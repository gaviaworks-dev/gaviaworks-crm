<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ajanda — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="panel" data-screen="ajanda">
<div class="kpi-grid" id="ajandaKpi"></div>
<div class="gv-card" id="ajanda"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;
  var mount = document.getElementById('ajanda');
  var kpiHost = document.getElementById('ajandaKpi');
  var TODAY = DB.today;
  var canFinans = GV.perm.can('finans');

  var AY_UZUN = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var DOW = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

  /* ================= Tarih yardımcıları — "şu an" DB.today'den gelir ===== */
  function parse(s){ return new Date(String(s).slice(0,10) + 'T00:00:00'); }
  function iso(d){
    var m = d.getMonth() + 1, g = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (g < 10 ? '0' : '') + g;
  }
  function addDays(s, n){ var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function addMonths(s, n){ var d = parse(s.slice(0,7) + '-01'); d.setMonth(d.getMonth() + n); return iso(d); }
  function monthStart(s){ return s.slice(0,7) + '-01'; }
  function weekStart(s){ return addDays(s, -((parse(s).getDay() + 6) % 7)); }
  function dayNum(s){ return parseInt(s.slice(8,10), 10); }

  /* ================= Kayıt yardımcıları ================================== */
  function custName(kod){ var c = (DB.customers || []).filter(function(x){ return x.kod === kod; })[0]; return c ? c.kisa : null; }
  function projName(kod){ var p = (DB.projects || []).filter(function(x){ return x.kod === kod; })[0]; return p ? p.ad : null; }
  function vehName(kod){ var v = (DB.vehicles || []).filter(function(x){ return x.kod === kod; })[0]; return v ? v.plaka + ' · ' + v.marka + ' ' + v.model : kod; }
  function vehPlate(kod){ var v = (DB.vehicles || []).filter(function(x){ return x.kod === kod; })[0]; return v ? v.plaka : kod; }

  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(function(p){ return p && p[1] != null && p[1] !== ''; }).map(function(p){
      return '<div><dt>' + esc(p[0]) + '</dt><dd>' + p[1] + '</dd></div>';
    }).join('') + '</dl>';
  }
  function money(v){ return canFinans ? F.money(v) : '••••••'; }

  /* ================= Olay kaynakları (PROMPT.md §19) ===================== */
  var SRC = [
    { key:'toplanti',  label:'Toplantılar',             icon:'i-users',          tone:'accent', tekil:'Toplantı' },
    { key:'gorev',     label:'Görev terminleri',        icon:'i-tasks',          tone:'info',   tekil:'Görev termini' },
    { key:'milestone', label:'Kilometre taşları',       icon:'i-milestone',      tone:'warn',   tekil:'Kilometre taşı' },
    { key:'izin',      label:'Personel izinleri',       icon:'i-calendar-check', tone:'ok',     tekil:'İzin' },
    { key:'arac',      label:'Araç yenilemeleri',       icon:'i-car',            tone:'danger', tekil:'Araç yenileme' },
    { key:'fatura',    label:'Fatura vadeleri',         icon:'i-receipt',        tone:'warn',   tekil:'Fatura vadesi' },
    { key:'sozlesme',  label:'Sözleşme yenilemeleri',   icon:'i-file-check',     tone:'info',   tekil:'Sözleşme yenileme' },
    { key:'ozel',      label:'Doğum günü ve yıldönümü', icon:'i-award',          tone:'ok',     tekil:'Özel gün' }
  ];
  function srcOf(k){ return SRC.filter(function(s){ return s.key === k; })[0] || SRC[0]; }

  var EV = [];
  function add(o){ o.id = 'E' + EV.length; EV.push(o); return o; }

  /* 1 — Toplantılar (DB.meetings) */
  (DB.meetings || []).filter(function(m){ return m.aktif !== false; }).forEach(function(m){
    add({
      src:'toplanti', d:String(m.tarih).slice(0,10), saat:String(m.tarih).slice(11,16),
      title:m.ad, tone:'accent', kod:m.kod, badge:m.durum,
      href:'app-toplanti.html', hrefLbl:'Toplantı kaydını aç',
      rows:[
        ['Toplantı türü', esc(m.tur)],
        ['Durum', GV.badge(m.durum)],
        ['Süre', m.sure + ' dakika'],
        ['Yer', esc(m.yer)],
        ['Müşteri', custName(m.musteri) ? esc(custName(m.musteri)) : null],
        ['Proje', projName(m.proje) ? esc(projName(m.proje)) : null],
        ['İç katılımcılar', (m.katilimci || []).map(function(k){ return GV.user(k, { sm:true }); }).join(' ')],
        ['Dış katılımcılar', (m.disKatilimci || []).length ? esc(m.disKatilimci.join(', ')) : null],
        ['Gündem', (m.gundem || []).map(function(g){ return '<span class="tag">' + esc(g) + '</span>'; }).join(' ')]
      ]
    });
  });

  /* 2 — Görev terminleri (DB.tasks.termin) */
  (DB.tasks || []).filter(function(t){ return t.aktif !== false && t.termin; }).forEach(function(t){
    var bitti = ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) !== -1;
    var gecikti = !bitti && F.days(t.termin) < 0;
    add({
      src:'gorev', d:t.termin, saat:null, title:t.baslik,
      tone: bitti ? 'ok' : (gecikti ? 'danger' : 'info'), kod:t.kod, badge:t.durum,
      href:'app-gorev-detay.html?id=' + t.kod, hrefLbl:'Görev detayını aç',
      rows:[
        ['Görev türü', esc(t.tur)],
        ['Durum', GV.badge(t.durum)],
        ['Öncelik', GV.pri(t.oncelik)],
        ['Termin', GV.dateCell(t.termin, { done:bitti })],
        ['Sorumlu', GV.user(t.sorumlu, { sm:true })],
        ['Proje', projName(t.proje) ? esc(projName(t.proje)) : null],
        ['Müşteri', custName(t.musteri) ? esc(custName(t.musteri)) : null],
        ['İlerleme', GV.progress(t.ilerleme)]
      ]
    });
  });

  /* 3 — Kilometre taşları / proje teslimleri (DB.milestones) */
  (DB.milestones || []).forEach(function(m){
    add({
      src:'milestone', d:m.tarih, saat:null, title:m.ad,
      tone: m.durum === 'Tamamlandı' ? 'ok' : (m.durum === 'Gecikti' ? 'danger' : 'warn'),
      kod:m.kod, badge:m.durum,
      href:'app-proje-detay.html?id=' + m.proje, hrefLbl:'Projeyi aç',
      rows:[
        ['Proje', projName(m.proje) ? esc(projName(m.proje)) : esc(m.proje)],
        ['Durum', GV.badge(m.durum)],
        ['İlerleme', GV.progress(m.ilerleme)],
        ['Hakediş tutarı', money(m.odeme)],
        ['Ödeme durumu', GV.badge(m.odemeDurum)]
      ]
    });
  });

  /* 4 — Personel izinleri (DB.leaves, baslangic..bitis aralığı günlere açılır) */
  (DB.leaves || []).filter(function(l){ return l.aktif !== false && l.durum !== 'Reddedildi'; }).forEach(function(l){
    var gunler = [], ds = l.baslangic, guard = 0;
    while(ds <= l.bitis && guard++ < 120){ gunler.push(ds); ds = addDays(ds, 1); }
    gunler.forEach(function(g, i){
      add({
        src:'izin', d:g, saat:null,
        title: DB.empName(l.personel) + ' — ' + l.tur + (gunler.length > 1 ? ' (' + (i + 1) + '/' + gunler.length + ')' : ''),
        tone: l.durum === 'Onaylandı' ? 'ok' : 'warn', kod:l.kod, badge:l.durum,
        href:'app-izin.html', hrefLbl:'İzin listesini aç',
        rows:[
          ['Personel', GV.user(l.personel, { sm:true })],
          ['İzin türü', esc(l.tur)],
          ['Durum', GV.badge(l.durum)],
          ['Başlangıç', F.date(l.baslangic)],
          ['Bitiş', F.date(l.bitis)],
          ['Toplam gün', '<b>' + l.gun + '</b>'],
          ['Vekil', l.vekil ? GV.user(l.vekil, { sm:true }) : null],
          ['Gerekçe', esc(l.gerekce)],
          ['Onaylayan', GV.user(l.onaylayan, { sm:true })]
        ]
      });
    });
  });

  /* 5 — Araç muayene ve sigorta/kasko yenilemeleri (DB.inspections + DB.policies) */
  (DB.inspections || []).filter(function(x){ return x.aktif !== false && x.sonrakiTarih; }).forEach(function(x){
    add({
      src:'arac', d:x.sonrakiTarih, saat:null, title:vehPlate(x.arac) + ' — muayene son tarihi',
      tone:'danger', kod:x.kod, badge:x.durum,
      href:'app-arac-muayene.html', hrefLbl:'Muayene listesini aç',
      rows:[
        ['Araç', esc(vehName(x.arac))],
        ['Durum', GV.badge(x.durum)],
        ['Geçerlilik', F.date(x.gecerlilik)],
        ['Son muayene', F.date(x.sonTarih)],
        ['Sonuç', esc(x.sonuc)],
        ['Kusur', x.kusur ? esc(x.kusur) : null],
        ['İstasyon', esc(x.istasyon)],
        ['Kalan gün', '<b>' + x.kalanGun + '</b>']
      ]
    });
  });
  (DB.policies || []).filter(function(p){ return p.aktif !== false && p.bitis; }).forEach(function(p){
    add({
      src:'arac', d:p.bitis, saat:null, title:vehPlate(p.arac) + ' — ' + p.tur + ' yenileme',
      tone:'danger', kod:p.kod, badge:p.yenileme && p.yenileme !== '—' ? p.yenileme : null,
      href:'app-arac-sigorta.html', hrefLbl:'Poliçe listesini aç',
      rows:[
        ['Araç', esc(vehName(p.arac))],
        ['Poliçe türü', esc(p.tur)],
        ['Sigorta şirketi', esc(p.sirket)],
        ['Poliçe no', esc(p.police)],
        ['Başlangıç', F.date(p.baslangic)],
        ['Bitiş', F.date(p.bitis)],
        ['Prim', money(p.prim)],
        ['Yenileme durumu', esc(p.yenileme)],
        ['Acente', esc(p.acente)],
        ['Kalan gün', '<b>' + p.kalanGun + '</b>']
      ]
    });
  });

  /* 6 — Fatura vadeleri (DB.invoices.vade) */
  (DB.invoices || []).filter(function(f){ return f.aktif !== false && f.vade; }).forEach(function(f){
    add({
      src:'fatura', d:f.vade, saat:null, title:f.kod + ' · ' + f.musteriAd,
      tone: f.durum === 'Ödendi' ? 'ok' : (f.durum === 'Gecikti' ? 'danger' : 'warn'),
      kod:f.kod, badge:f.durum,
      href:'app-fatura.html', hrefLbl:'Fatura listesini aç',
      rows:[
        ['Müşteri', esc(f.musteriAd)],
        ['Durum', GV.badge(f.durum)],
        ['Fatura tarihi', F.date(f.tarih)],
        ['Vade', GV.dateCell(f.vade, { done:f.durum === 'Ödendi' })],
        ['Tutar', money(f.tutar)],
        ['Vergi', money(f.vergi)],
        ['Genel toplam', '<b>' + money(f.toplam) + '</b>'],
        ['Ödeme tarihi', f.odemeTarihi ? F.date(f.odemeTarihi) : null],
        ['Proje', projName(f.proje) ? esc(projName(f.proje)) : null]
      ]
    });
  });

  /* 7 — Sözleşme yenilemeleri (DB.contracts.yenilemeTarihi) */
  (DB.contracts || []).filter(function(c){ return c.aktif !== false && c.yenileme && c.yenilemeTarihi; }).forEach(function(c){
    add({
      src:'sozlesme', d:c.yenilemeTarihi, saat:null, title:c.ad + ' — yenileme',
      tone:'info', kod:c.kod, badge:c.durum,
      href:'app-sozlesme.html', hrefLbl:'Sözleşme listesini aç',
      rows:[
        ['Müşteri', esc(c.musteriAd)],
        ['Durum', GV.badge(c.durum)],
        ['Sözleşme tutarı', money(c.tutar)],
        ['Başlangıç', F.date(c.baslangic)],
        ['Bitiş', F.date(c.bitis)],
        ['Yenileme tarihi', GV.dateCell(c.yenilemeTarihi)],
        ['Ödeme planı', esc(c.odemePlani)],
        ['Garanti', esc(c.garanti)]
      ]
    });
  });

  /* 8 — Doğum günü ve işe giriş yıldönümü (DB.employees.dogum / girisTarihi)
         Yıllık tekrar eden olaylar: görüntülenen eksen için ±1 yıl üretilir. */
  var yil0 = parseInt(TODAY.slice(0,4), 10);
  (DB.employees || []).filter(function(e){ return e.aktif !== false; }).forEach(function(e){
    [-1, 0, 1].forEach(function(off){
      var y = yil0 + off;
      if(e.dogum){
        add({
          src:'ozel', d:y + '-' + e.dogum.slice(5), saat:null, title:e.ad + ' — doğum günü',
          tone:'ok', kod:e.kod, badge:null,
          href:'app-personel.html', hrefLbl:'Personel listesini aç',
          rows:[
            ['Personel', GV.user(e.kod, { sm:true })],
            ['Pozisyon', esc(e.pozisyon)],
            ['Departman', esc(e.depAd)],
            ['Yaş', '<b>' + (y - parseInt(e.dogum.slice(0,4), 10)) + '</b>'],
            ['Lokasyon', esc(e.lokasyon)]
          ]
        });
      }
      if(e.girisTarihi){
        var kacinci = y - parseInt(e.girisTarihi.slice(0,4), 10);
        if(kacinci >= 1){
          add({
            src:'ozel', d:y + '-' + e.girisTarihi.slice(5), saat:null,
            title:e.ad + ' — ' + kacinci + '. iş yıldönümü',
            tone:'ok', kod:e.kod, badge:null,
            href:'app-personel.html', hrefLbl:'Personel listesini aç',
            rows:[
              ['Personel', GV.user(e.kod, { sm:true })],
              ['Pozisyon', esc(e.pozisyon)],
              ['Departman', esc(e.depAd)],
              ['İşe giriş', F.date(e.girisTarihi)],
              ['Kıdem', '<b>' + kacinci + ' yıl</b>']
            ]
          });
        }
      }
    });
  });

  var BYDAY = {};
  EV.forEach(function(e){ (BYDAY[e.d] = BYDAY[e.d] || []).push(e); });
  var BYID = {};
  EV.forEach(function(e){ BYID[e.id] = e; });

  /* ================= Durum + URL ========================================= */
  var qs = new URLSearchParams(location.search);
  var VIEWS = ['ay','hafta','gun'];
  var state = {
    v: VIEWS.indexOf(qs.get('v')) !== -1 ? qs.get('v') : 'ay',
    d: /^\d{4}-\d{2}-\d{2}$/.test(qs.get('d') || '') ? qs.get('d') : TODAY,
    off: (qs.get('k') || '').split(',').filter(function(k){
      return SRC.filter(function(s){ return s.key === k; }).length > 0;
    })
  };

  function syncURL(){
    var p = new URLSearchParams();
    p.set('v', state.v);
    p.set('d', state.d);
    if(state.off.length) p.set('k', state.off.join(','));
    history.replaceState({}, '', location.pathname + '?' + p.toString());
  }

  function visible(e){ return state.off.indexOf(e.src) === -1; }
  function dayEvents(ds){
    return (BYDAY[ds] || []).filter(visible).sort(function(a, b){
      return (a.saat || '99:99').localeCompare(b.saat || '99:99');
    });
  }
  function rangeEvents(from, to, all){
    return EV.filter(function(e){ return e.d >= from && e.d <= to && (all || visible(e)); });
  }

  function period(){
    if(state.v === 'ay'){
      var f = monthStart(state.d);
      return { grid:weekStart(f), label:AY_UZUN[parseInt(f.slice(5,7), 10) - 1] + ' ' + f.slice(0,4),
               from:f, to:addDays(addMonths(f, 1), -1) };
    }
    if(state.v === 'hafta'){
      var ws = weekStart(state.d), we = addDays(ws, 6);
      return { grid:ws, label:F.dateShort(ws) + ' – ' + F.dateShort(we) + ' ' + we.slice(0,4), from:ws, to:we };
    }
    return { grid:state.d, label:F.dateLong(state.d), from:state.d, to:state.d };
  }

  function shift(n){
    if(state.v === 'ay') state.d = addMonths(state.d, n);
    else if(state.v === 'hafta') state.d = addDays(state.d, 7 * n);
    else state.d = addDays(state.d, n);
  }

  /* ================= Parçalar ============================================ */
  function evChip(e){
    var t = e.tone === 'info' ? '' : ' is-' + e.tone;
    var lbl = (e.saat ? e.saat + ' ' : '') + e.title;
    return '<span class="gv-cal-ev' + t + '" role="button" tabindex="0" data-ev="' + e.id + '" title="' +
      esc(srcOf(e.src).tekil + ' · ' + lbl) + '">' + esc(lbl) + '</span>';
  }

  function dowRow(withDate, gridStart){
    return DOW.map(function(g, i){
      return '<div class="gv-cal-dow">' + g + (withDate ? ' · ' + F.dateShort(addDays(gridStart, i)) : '') + '</div>';
    }).join('');
  }

  function bosDurum(){
    var acik = state.off.length
      ? '<button type="button" class="btn btn-line" data-reset>' + ico('i-filter-x') + ' Tüm kaynakları göster</button>'
      : '<button type="button" class="btn btn-acc" data-today>' + ico('i-calendar-check') + ' Bugüne dön</button>';
    return '<div class="gc-body">' + GV.empty({
      icon:'i-calendar',
      title: state.v === 'gun' ? 'Bu günde olay yok' : 'Bu dönemde olay yok',
      desc: state.off.length
        ? 'Seçili kaynak filtreleri bu dönemdeki tüm olayları gizliyor. Filtreleri temizleyip tekrar bakabilirsiniz.'
        : 'Bu dönem için planlanmış toplantı, termin, yenileme veya izin kaydı bulunmuyor.',
      action:acik
    }) + '</div>';
  }

  function ayGorunum(){
    var p = period(), mm = monthStart(state.d).slice(0,7), cells = '', toplam = 0;
    for(var i = 0; i < 42; i++){
      var ds = addDays(p.grid, i);
      var evs = dayEvents(ds);
      toplam += evs.length;
      cells += '<div class="gv-cal-day' + (ds.slice(0,7) !== mm ? ' is-out' : '') + (ds === TODAY ? ' is-today' : '') + '">' +
        '<span class="gv-cal-num">' + dayNum(ds) + '</span>' +
        evs.slice(0, 3).map(evChip).join('') +
        (evs.length > 3
          ? '<span class="gv-cal-ev" role="button" tabindex="0" data-day="' + ds + '">+' + (evs.length - 3) + ' olay daha</span>'
          : '') +
        '</div>';
    }
    if(!toplam) return bosDurum();
    return '<div class="gv-cal">' + dowRow(false) + cells + '</div>';
  }

  function haftaGorunum(){
    var p = period(), cells = '', toplam = 0;
    for(var i = 0; i < 7; i++){
      var ds = addDays(p.grid, i);
      var evs = dayEvents(ds);
      toplam += evs.length;
      cells += '<div class="gv-cal-day' + (ds === TODAY ? ' is-today' : '') + '">' +
        '<span class="gv-cal-num">' + dayNum(ds) + '</span>' +
        (evs.length ? evs.map(evChip).join('') : '<span class="u-xs u-faint">Olay yok</span>') +
        '</div>';
    }
    if(!toplam) return bosDurum();
    return '<div class="gv-cal">' + dowRow(true, p.grid) + cells + '</div>';
  }

  var gunListe = [];
  function gunGorunum(){
    gunListe = dayEvents(state.d);
    if(!gunListe.length) return bosDurum();
    return '<div class="gc-body" id="gunTl">' + GV.activity(gunListe.map(function(e){
      return {
        kisi: srcOf(e.src).tekil,
        tarih: e.d + (e.saat ? 'T' + e.saat : ''),
        metin: e.title,
        tone: e.tone,
        icon: srcOf(e.src).icon
      };
    })) + '</div>';
  }

  function ust(){
    var p = period();
    var sayi = rangeEvents(p.from, p.to).length;
    var vw = [
      { k:'ay', ic:'i-grid', lbl:'Ay görünümü' },
      { k:'hafta', ic:'i-columns', lbl:'Hafta görünümü' },
      { k:'gun', ic:'i-list', lbl:'Gün görünümü' }
    ];
    return '<div class="gv-listhead">' +
      '<div class="lh-row u-row-between">' +
        '<div class="lh-acts">' +
          '<span class="viewswitch">' +
            '<button type="button" data-nav="-1" aria-label="Önceki dönem">' + ico('i-chev-left','ic-sm') + '</button>' +
            '<button type="button" data-nav="1" aria-label="Sonraki dönem">' + ico('i-chev-right','ic-sm') + '</button>' +
          '</span>' +
          '<button type="button" class="btn btn-line btn-sm" data-today>' + ico('i-calendar-check','ic-sm') + ' Bugün</button>' +
          '<h2 class="gc-title">' + esc(p.label) + '</h2>' +
        '</div>' +
        '<div class="lh-acts">' +
          '<span class="gv-count"><b>' + sayi + '</b> olay</span>' +
          '<span class="viewswitch">' + vw.map(function(v){
            return '<button type="button" data-view="' + v.k + '" aria-pressed="' + (state.v === v.k ? 'true' : 'false') +
              '" aria-label="' + v.lbl + '">' + ico(v.ic,'ic-sm') + '</button>';
          }).join('') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="lh-tabs"><div class="chipbar-wrap">' +
        '<button type="button" class="cb-arrow cb-prev" aria-label="Sola kaydır" hidden>' + ico('i-chev-left','ic-sm') + '</button>' +
        '<div class="chipbar" role="tablist" aria-multiselectable="true" aria-label="Olay kaynakları">' +
        SRC.map(function(s){
          var n = rangeEvents(p.from, p.to, true).filter(function(e){ return e.src === s.key; }).length;
          return '<button type="button" class="chip" role="tab" data-src="' + s.key + '" aria-selected="' +
            (state.off.indexOf(s.key) === -1 ? 'true' : 'false') + '">' +
            ico(s.icon,'ic-sm') + esc(s.label) + '<span class="chip-cnt">' + n + '</span></button>';
        }).join('') +
        '</div>' +
        '<button type="button" class="cb-arrow cb-next" aria-label="Sağa kaydır" hidden>' + ico('i-chev-right','ic-sm') + '</button>' +
      '</div></div>' +
    '</div>';
  }

  /* ================= KPI şeridi — DB.today eksenine göre sabit ============ */
  function kpiler(){
    var ayBas = monthStart(TODAY), ayBit = addDays(addMonths(ayBas, 1), -1);
    var hafBas = weekStart(TODAY), hafBit = addDays(hafBas, 6);
    var ufuk = addDays(TODAY, 60);
    var say = function(fn){ return EV.filter(fn).length; };

    var k = [
      { tone:'accent', icon:'i-users', href:'app-toplanti.html', lbl:'Bu ay toplantı',
        n:say(function(e){ return e.src === 'toplanti' && e.d >= ayBas && e.d <= ayBit; }),
        meta:AY_UZUN[parseInt(ayBas.slice(5,7), 10) - 1] + ' ' + ayBas.slice(0,4) },
      { tone:'warn', icon:'i-tasks', href:'app-gorev.html', lbl:'Bu hafta terminli görev',
        n:say(function(e){ return e.src === 'gorev' && e.d >= hafBas && e.d <= hafBit; }),
        meta:F.dateShort(hafBas) + ' – ' + F.dateShort(hafBit) },
      { tone:'danger', icon:'i-car', href:'app-arac-muayene.html', lbl:'Yaklaşan yenileme',
        n:say(function(e){ return ['arac','sozlesme'].indexOf(e.src) !== -1 && e.d >= TODAY && e.d <= ufuk; }),
        meta:'Önümüzdeki 60 gün' },
      { tone:'ok', icon:'i-calendar-check', href:'app-izin.html', lbl:'Bu ay izinli personel günü',
        n:say(function(e){ return e.src === 'izin' && e.d >= ayBas && e.d <= ayBit; }),
        meta:'Onaylı ve bekleyen izinler' }
    ];

    kpiHost.innerHTML = k.map(function(x){
      return '<a class="kpi is-' + x.tone + '" href="' + x.href + '">' +
        '<div class="kpi-ico">' + ico(x.icon,'ic-lg') + '</div>' +
        '<div class="kpi-body"><div class="kpi-num">' + F.num(x.n) + '</div>' +
        '<div class="kpi-lbl">' + esc(x.lbl) + '</div>' +
        '<div class="kpi-meta is-flat">' + ico('i-clock','ic-sm') + esc(x.meta) + '</div></div></a>';
    }).join('');
  }

  /* ================= Olay detay paneli =================================== */
  function acDetay(e){
    var s = srcOf(e.src);
    var rows = [
      ['Tarih', F.dateLong(e.d)],
      ['Saat', e.saat ? e.saat : null],
      ['Zaman', F.rel(e.d)]
    ].concat(e.rows || []);

    GV.drawer({
      title:e.title,
      body:'<div class="u-row u-wrap">' +
          '<span class="badge is-' + s.tone + '">' + ico(s.icon,'ic-sm') + ' ' + esc(s.tekil) + '</span>' +
          (e.badge ? GV.badge(e.badge) : '') +
          (e.kod ? '<span class="tag">' + esc(e.kod) + '</span>' : '') +
        '</div>' +
        '<div class="u-mt-8">' + dl(rows) + '</div>' +
        (e.href ? '<div class="u-mt-8"><a class="btn btn-acc" href="' + e.href + '">' +
          ico('i-external') + ' ' + esc(e.hrefLbl) + '</a></div>' : ''),
      actions:[
        { label:'Günü aç', cls:'btn-line', onClick:function(){ state.v = 'gun'; state.d = e.d; render(); } },
        { label:'Kapat', cls:'btn-line' }
      ]
    });
  }

  /* ================= Render ============================================== */
  function render(){
    syncURL();
    var p = period();
    mount.innerHTML = ust() + (state.v === 'ay' ? ayGorunum() : state.v === 'hafta' ? haftaGorunum() : gunGorunum());
    GV.chipbar(mount);
    var sub = document.querySelector('.gv-page-head [data-listcount]');
    if(sub) sub.textContent = p.label + ' · ' + rangeEvents(p.from, p.to).length + ' olay gösteriliyor';
    document.title = 'Ajanda — ' + p.label + ' — GaviaWorks CRM';
  }

  GV.pageHead({
    eyebrow:'Ana Panel', title:'Ajanda',
    sub:'—',
    actions:[
      { label:'Toplantılar', icon:'i-users', href:'app-toplanti.html' },
      { label:'Yazdır', icon:'i-printer', cls:'btn-acc', id:'btnYazdir' }
    ]
  });

  var yaz = document.getElementById('btnYazdir');
  if(yaz) yaz.addEventListener('click', function(){ window.print(); });

  kpiler();
  render();

  /* ================= Etkileşim =========================================== */
  function tikla(t){
    var nav = t.closest('[data-nav]');
    if(nav){ shift(parseInt(nav.dataset.nav, 10)); render(); return true; }

    if(t.closest('[data-today]')){ state.d = TODAY; render(); return true; }

    var v = t.closest('[data-view]');
    if(v){ state.v = v.dataset.view; render(); return true; }

    var s = t.closest('[data-src]');
    if(s){
      var k = s.dataset.src, i = state.off.indexOf(k);
      if(i === -1) state.off.push(k); else state.off.splice(i, 1);
      render();
      GV.toast(srcOf(k).label + (i === -1 ? ' gizlendi' : ' gösteriliyor'), 'info', 1600);
      return true;
    }

    if(t.closest('[data-reset]')){ state.off = []; render(); return true; }

    var gun = t.closest('[data-day]');
    if(gun){ state.v = 'gun'; state.d = gun.dataset.day; render(); return true; }

    var ev = t.closest('[data-ev]');
    if(ev){ var o = BYID[ev.dataset.ev]; if(o) acDetay(o); return true; }

    var tl = t.closest('#gunTl .gv-tl-item');
    if(tl){
      var items = Array.prototype.slice.call(mount.querySelectorAll('#gunTl .gv-tl-item'));
      var e2 = gunListe[items.indexOf(tl)];
      if(e2) acDetay(e2);
      return true;
    }
    return false;
  }

  mount.addEventListener('click', function(e){ tikla(e.target); });
  mount.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    if(!e.target.closest('[data-ev],[data-day]')) return;
    e.preventDefault();
    tikla(e.target);
  });

  /* Klavye kısayolları: ← → dönem, T bugün, 1/2/3 görünüm */
  document.addEventListener('keydown', function(e){
    if(e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if(document.querySelector('.gv-drawer, .gv-modal')) return;
    if(e.key === 'ArrowLeft'){ shift(-1); render(); }
    else if(e.key === 'ArrowRight'){ shift(1); render(); }
    else if(e.key === 't' || e.key === 'T'){ state.d = TODAY; render(); }
    else if(e.key === '1'){ state.v = 'ay'; render(); }
    else if(e.key === '2'){ state.v = 'hafta'; render(); }
    else if(e.key === '3'){ state.v = 'gun'; render(); }
  });
});
</script>
</body>
</html>
