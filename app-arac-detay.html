<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Araç Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="varlik" data-screen="arac">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');
  var canEkle = GV.perm.can('ekle');
  var ilk = (DB.vehicles && DB.vehicles[0]) ? DB.vehicles[0].kod : null;
  var id = new URLSearchParams(location.search).get('id') || ilk;
  var v = DB.vehicles.filter(function(x){ return x.kod === id; })[0];

  if(!v){
    GV.pageHead({ eyebrow:'Demirbaş & Filo', title:'Araç Kartı',
      sub:'Kayıt bulunamadı',
      actions:[{ label:'Araç Listesi', icon:'i-car', href:'app-arac.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Araç bulunamadı',
      desc:'“' + esc(id || '') + '” kodlu araç filo kaydında yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-arac.html">Araç listesine dön</a>' }) + '</div>';
    return;
  }

  var kod = v.kod;
  GV.shell.crumb(v.plaka);
  document.title = v.plaka + ' — GaviaWorks CRM';

  /* =====================================================================
     Kayda bağlı veri dilimleri — hepsi canonical `arac` alanından
     ===================================================================== */
  function ofArac(list){ return (list || []).filter(function(x){ return x.arac === kod; }); }
  function byTarihDesc(a, b){ return String(b.tarih || '').localeCompare(String(a.tarih || '')); }

  /* DB.assignments araç değil demirbaş zimmeti tutar (`demirbas` alanı).
     Araç için yazılmış zimmet kaydı olursa `arac` alanıyla da yakalanır. */
  var zimmetler  = (DB.assignments || []).filter(function(x){ return x.arac === kod || x.demirbas === kod; });
  var bakimlar   = ofArac(DB.maintenance).sort(function(a, b){ return String(b.planTarihi).localeCompare(String(a.planTarihi)); });
  var muayeneler = ofArac(DB.inspections).sort(function(a, b){ return String(a.sonrakiTarih).localeCompare(String(b.sonrakiTarih)); });
  var policeler  = ofArac(DB.policies);
  var yakitlar   = ofArac(DB.fuelLogs).sort(byTarihDesc);
  var giderler   = ofArac(DB.vehicleExpenses).sort(byTarihDesc);
  var kazalar    = ofArac(DB.accidents).sort(byTarihDesc);
  var cezalar    = ofArac(DB.fines).sort(byTarihDesc);
  var acts       = (DB.activities || []).filter(function(a){ return a.kayit === kod; });

  var trafik  = policeler.filter(function(p){ return p.tur === 'Trafik Sigortası'; })[0];
  var kasko   = policeler.filter(function(p){ return p.tur === 'Kasko'; })[0];
  var muayene = muayeneler[0];
  var acikBakim = bakimlar.filter(function(b){ return b.durum !== 'Tamam'; })
                          .sort(function(a, b){ return String(a.planTarihi).localeCompare(String(b.planTarihi)); })[0];

  /* =====================================================================
     Ortak yardımcılar
     ===================================================================== */
  function para(n){
    if(!canFinans) return '<span class="cell-mask">••••••</span>';
    if(n == null) return '<span class="u-faint">—</span>';
    return '<span class="cell-money">' + F.money(n) + '</span>';
  }
  function paraBirim(n, birim){
    if(!canFinans) return '<span class="cell-mask">••••••</span>';
    if(n == null) return '<span class="u-faint">—</span>';
    return '<span class="cell-money">' + F.num(n, 2) + ' ' + esc(birim) + '</span>';
  }
  var finansNot = canFinans ? '' : '<div class="gc-body">' + GV.notice({
    tone:'neutral', icon:'i-lock', title:'Tutarlar gizli',
    text:'Rolünüzde finansal tutar görüntüleme yetkisi yok. Kayıtlar listelenir, para alanları maskelenir.' }) + '</div>';

  /* Yenileme eşikleri — DB.today'e göre: süresi doldu · 7 · 15 · 30 · 60 gün.
     Ton sözlükte yok (sayısal eşik), bu yüzden GV.badge'e açık ton geçiliyor. */
  function kalanTon(iso){
    var d = F.days(iso);
    if(d == null) return null;
    if(d < 0) return 'is-danger';
    if(d <= 7) return 'is-danger';
    if(d <= 15) return 'is-warn';
    if(d <= 30) return 'is-warn';
    if(d <= 60) return 'is-info';
    return 'is-ok';
  }
  function kalanBadge(iso){
    var d = F.days(iso);
    if(d == null) return '<span class="u-faint">—</span>';
    var metin = d < 0 ? 'Süresi doldu · ' + (-d) + ' gün' : d === 0 ? 'Bugün' : d + ' gün kaldı';
    return GV.badge(metin, kalanTon(iso));
  }
  function tarihKalan(iso){
    if(!iso) return null;
    return '<span class="cell-date">' + F.date(iso) + '</span> ' + kalanBadge(iso);
  }
  function notTonu(iso){
    var t = kalanTon(iso);
    return t === 'is-danger' ? 'danger' : t === 'is-warn' ? 'warn' : t === 'is-info' ? 'info' : 'ok';
  }

  function tbl(head, rows, foot){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>' + (foot || '');
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function sec(baslik, icerik, aciklama){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3>' +
      (aciklama ? '<p>' + esc(aciklama) + '</p>' : '') + '</div>' + icerik + '</div>';
  }
  function km(n){ return n == null ? '<span class="u-faint">—</span>' : '<span class="u-num">' + F.num(n) + ' km</span>'; }
  function tagOf(t){ return t ? '<span class="tag">' + esc(t) + '</span>' : ''; }
  function surucu(k){ return k ? GV.user(k, { sm:true }) : '<span class="u-faint">Atanmamış</span>'; }

  /* =====================================================================
     Maliyet türetimi — veriye yazılı toplam yok, kayıtlardan hesaplanır.
     Çift sayım önlemi: DB.vehicleExpenses içindeki Yakıt/Bakım/Sigorta/Kasko
     kalemleri kendi koleksiyonlarından sayıldığı için "diğer" toplamına girmez.
     ===================================================================== */
  var TUREV_KALEM = ['Yakıt','Bakım','Sigorta','Kasko'];
  var digerGiderler = giderler.filter(function(g){ return TUREV_KALEM.indexOf(g.tur) === -1; });
  var yakitToplam = yakitlar.reduce(function(a, x){ return a + (x.tutar || 0); }, 0);
  var bakimToplam = bakimlar.reduce(function(a, x){ return a + (x.maliyet || 0); }, 0);
  var primToplam  = policeler.reduce(function(a, x){ return a + (x.prim || 0); }, 0);
  var digerToplam = digerGiderler.reduce(function(a, x){ return a + (x.tutar || 0); }, 0);
  var toplamMaliyet = yakitToplam + bakimToplam + primToplam + digerToplam;

  /* Satın alma bağı — §22 madde 24. Bağ ARAÇTA yazılı (`DB.vehicles[].siparis`);
     siparişte ayna alan yoktur (components.md §9d). Tarih ya da satıcı adı
     eşleşmesi bağ yerine geçmez (L-13) — bağ yoksa gerekçesi ekranda söylenir. */
  var satinSiparis = v.siparis ? DB.orders.filter(function(o){ return o.kod === v.siparis; })[0] : null;
  var satinTalep   = satinSiparis ? DB.purchases.filter(function(p){ return p.kod === satinSiparis.talep; })[0] : null;
  var satinTedarik = satinSiparis ? DB.suppliers.filter(function(s){ return s.kod === satinSiparis.tedarikci; })[0] : null;

  var donemBas = v.mulkiyet === 'Kiralık' ? v.sozlesmeBas : v.alisTarihi;
  var donemGun = donemBas ? Math.max(1, -F.days(donemBas)) : null;
  var donemAy  = donemGun ? donemGun / 30.44 : null;
  var aylikMaliyet = donemAy ? toplamMaliyet / donemAy : null;
  var yillikMaliyet = aylikMaliyet == null ? null : aylikMaliyet * 12;
  var kmBasi = v.guncelKm > 0 ? toplamMaliyet / v.guncelKm : null;

  /* Ödenmemiş cezalar gider kaydına işlenmemiş olabilir — toplama katılmaz, ayrıca uyarılır. */
  var acikCeza = cezalar.filter(function(c){ return c.durum !== 'Ödendi'; })
                        .reduce(function(a, c){ return a + (c.tutar || 0); }, 0);

  /* Yakıt tüketimi — ilk dolum referans alınır (tam depo yöntemi) */
  var yakitAsc = yakitlar.slice().sort(function(a, b){ return (a.km || 0) - (b.km || 0); });
  var toplamLitre = yakitlar.reduce(function(a, x){ return a + (x.litre || 0); }, 0);
  var ortBirim = toplamLitre > 0 ? yakitToplam / toplamLitre : null;
  var tuketim = null, tuketimKm = null;
  if(yakitAsc.length >= 2){
    tuketimKm = yakitAsc[yakitAsc.length - 1].km - yakitAsc[0].km;
    if(tuketimKm > 0){
      var litreSonrasi = yakitAsc.slice(1).reduce(function(a, x){ return a + (x.litre || 0); }, 0);
      tuketim = litreSonrasi / tuketimKm * 100;
    }
  }

  /* =====================================================================
     Sayfa başlığı
     ===================================================================== */
  var phActions = [{ label:'Araç Listesi', icon:'i-car', href:'app-arac.html' }];
  if(canEkle) phActions.push({ label:'Bakım Kaydı Ekle', icon:'i-plus', cls:'btn-acc', run:function(){ bakimModal(); } });
  GV.pageHead({
    eyebrow:'Demirbaş & Filo', title:'Araç Kartı',
    sub:'Bakım, muayene, sigorta, yakıt ve maliyet takibi tek kayıtta toplanır.',
    actions:phActions });

  /* =====================================================================
     Kayıt başlığı
     ===================================================================== */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + esc(kod) + '</span>' +
        GV.badge(v.durum) + tagOf(v.tip) + tagOf(v.mulkiyet) + tagOf(v.yakit) +
        (v.aktif ? '' : '<span class="tag">Pasif kayıt</span>') + '</div>' +
      '<h1>' + esc(v.plaka) + '</h1>' +
      '<div class="gv-rec-meta">' +
        '<span>' + ico('i-car','ic-sm') + esc(v.marka + ' ' + v.model + ' · ' + v.modelYili) + '</span>' +
        '<span>' + ico('i-user-check','ic-sm') + (v.anaSurucu ? esc(DB.empName(v.anaSurucu)) : esc(v.kullanim)) + '</span>' +
        '<span>' + ico('i-users','ic-sm') + esc(DB.depName(v.dep)) + '</span>' +
        '<span>' + ico('i-gauge','ic-sm') + F.num(v.guncelKm) + ' km</span>' +
        '<span>' + ico('i-wrench','ic-sm') + 'Sonraki bakım ' + F.date(v.sonrakiBakimTarihi) + '</span>' +
      '</div>' +
    '</div></div>';

  /* =====================================================================
     Sekmeler
     ===================================================================== */
  var tabs = [
    { key:'genel',    lbl:'Genel',            ic:'i-info' },
    { key:'zimmet',   lbl:'Zimmet',           ic:'i-user-check', cnt:zimmetler.length },
    { key:'bakim',    lbl:'Bakım',            ic:'i-wrench',     cnt:bakimlar.length },
    { key:'muayene',  lbl:'Muayene',          ic:'i-clipboard',  cnt:muayeneler.length },
    { key:'sigorta',  lbl:'Sigorta ve Kasko', ic:'i-shield',     cnt:policeler.length },
    { key:'yakit',    lbl:'Yakıt',            ic:'i-fuel',       cnt:yakitlar.length },
    { key:'gider',    lbl:'Giderler',         ic:'i-receipt',    cnt:giderler.length },
    { key:'kaza',     lbl:'Kaza ve Ceza',     ic:'i-alert',      cnt:kazalar.length + cezalar.length },
    { key:'maliyet',  lbl:'Maliyet Özeti',    ic:'i-chart-bar' },
    { key:'aktivite', lbl:'Aktivite Geçmişi', ic:'i-activity',   cnt:acts.length }
  ];
  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* =====================================================================
     1. GENEL — DB.vehicles alanlarının tamamı
     ===================================================================== */
  var kiralik = v.mulkiyet === 'Kiralık';
  var pGenel = '<div class="gc-body">' +
    sec('Araç Kimliği', GV.dl([
      ['Plaka', '<b class="u-num">' + esc(v.plaka) + '</b>'],
      ['Araç kodu', '<span class="u-num">' + esc(kod) + '</span>'],
      ['Marka', esc(v.marka)],
      ['Model', esc(v.model)],
      ['Model yılı', '<span class="u-num">' + esc(v.modelYili) + '</span>'],
      ['Araç tipi', tagOf(v.tip)],
      ['Renk', esc(v.renk)],
      ['Durum', GV.badge(v.durum)]
    ])) +
    sec('Teknik Bilgiler', GV.dl([
      ['Yakıt türü', esc(v.yakit)],
      ['Şanzıman', esc(v.vites)],
      ['Motor hacmi', v.motorHacmi ? '<span class="u-num">' + F.num(v.motorHacmi) + ' cc</span>' : null],
      ['Motor numarası', '<span class="u-num">' + esc(v.motorNo) + '</span>'],
      ['Şasi numarası', '<span class="u-num">' + esc(v.sasi) + '</span>']
    ])) +
    sec('Mülkiyet ve Edinim', GV.dl([
      ['Mülkiyet', tagOf(v.mulkiyet)],
      ['Satın alma tarihi', v.alisTarihi ? F.date(v.alisTarihi) : null],
      ['Satın alma bedeli', v.alisBedeli != null ? para(v.alisBedeli) : null],
      ['Satıcı', v.satici ? esc(v.satici) : null],
      ['Satın alma siparişi', satinSiparis
        ? '<a class="cell-main" href="app-siparis-detay.html?id=' + esc(satinSiparis.kod) + '">' +
          esc(satinSiparis.kod) + '</a>' +
          '<span class="cell-code">Sipariş neti ' + para(satinSiparis.tutar) +
          (satinTedarik ? ' · ' + esc(satinTedarik.unvan) : '') + '</span>'
        : null],
      ['Satın alma talebi', satinTalep
        ? '<a class="cell-main" href="app-satinalma-detay.html?id=' + esc(satinTalep.kod) + '">' +
          esc(satinTalep.kod) + '</a><span class="cell-code">' + esc(satinTalep.urun) + '</span>'
        : null],
      kiralik ? ['Kiralama firması', esc(v.kiralamaFirmasi)] : null,
      kiralik ? ['Kiralama sözleşmesi', F.date(v.sozlesmeBas) + ' – ' + F.date(v.sozlesmeBit)] : null,
      kiralik ? ['Sözleşme bitişine kalan', kalanBadge(v.sozlesmeBit)] : null,
      kiralik ? ['Aylık kira bedeli', para(v.aylikKira)] : null,
      kiralik ? ['Yıllık km sınırı', km(v.kmSiniri)] : null,
      kiralik ? ['Depozito', para(v.depozito)] : null
    ]) +
    /* §9d gösterim kuralı: bağ varsa "veride yazılı" denir; yoksa neden yok olduğu
       söylenir ve satıcı adı eşleşmesi bağ gibi sunulmaz. */
    (satinSiparis
      ? GV.notice({ tone:'ok', icon:'i-link', title:'Satın alma bağı veride yazılı',
          text:'Bu araç ' + satinSiparis.kod + ' siparişinden filoya alındı. Bağ ' +
               '`DB.vehicles[].siparis` alanında tutulur; siparişte ayna alan yoktur. ' +
               'Aracın alış bedeli (' + F.num(v.alisBedeli) + ' ₺) siparişin netine birebir eşittir.' })
      : GV.notice({ tone:'info', icon:'i-info', title:'Satın alma siparişi bağlı değil',
          text:kiralik
            ? 'Araç kiralıktır — satın alma siparişi doğmaz. Edinim ekseni kiralama ' +
              'sözleşmesidir; yukarıdaki sözleşme alanları geçerlidir.'
            : 'Araç ' + F.date(v.alisTarihi) + ' tarihinde alındı; bu tarih satın alma ' +
              'modülünün veri penceresinden önce kalıyor ve karşılık gelen talep/sipariş ' +
              'kaydı yok. Satıcı adı eşleşmesi bağ yerine geçmez (ders L-13).' })) ) +
    sec('Kullanım ve Sorumluluk', GV.dl([
      ['Kullanım şekli', esc(v.kullanim)],
      ['Ana sürücü', v.anaSurucu ? GV.user(v.anaSurucu, { sm:true }) : null],
      ['Yedek sürücü', v.yedekSurucu ? GV.user(v.yedekSurucu, { sm:true }) : null],
      ['Departman', esc(DB.depName(v.dep))],
      ['Bağlı proje', v.proje ? esc(v.proje) : null],
      ['Kayıt durumu', v.aktif ? GV.badge('Aktif') : GV.badge('Pasif')]
    ])) +
    sec('Kilometre ve Bakım', GV.dl([
      ['Güncel kilometre', '<b class="u-num">' + F.num(v.guncelKm) + ' km</b>'],
      ['Son bakım tarihi', v.sonBakimTarihi ? F.date(v.sonBakimTarihi) : null],
      ['Son bakım kilometresi', km(v.sonBakimKm)],
      ['Sonraki bakım tarihi', tarihKalan(v.sonrakiBakimTarihi)],
      ['Sonraki bakım kilometresi', km(v.sonrakiBakimKm) +
        (v.guncelKm >= v.sonrakiBakimKm ? ' ' + GV.badge('Km eşiği aşıldı', 'is-danger') :
          ' <span class="cell-sub">' + F.num(v.sonrakiBakimKm - v.guncelKm) + ' km kaldı</span>')]
    ])) +
    '</div>';

  /* =====================================================================
     2. ZİMMET
     ===================================================================== */
  var pZimmet = '<div class="gc-body">' +
    sec('Güncel Tahsis', GV.dl([
      ['Kullanım şekli', esc(v.kullanim)],
      ['Ana sürücü', v.anaSurucu ? GV.user(v.anaSurucu, { sm:true }) : null],
      ['Yedek sürücü', v.yedekSurucu ? GV.user(v.yedekSurucu, { sm:true }) : null],
      ['Departman', esc(DB.depName(v.dep))],
      ['Araç durumu', GV.badge(v.durum)]
    ]), 'Tahsis bilgisi araç kartında tutulur; imzalı zimmet tutanakları aşağıdaki listede izlenir.') +
    '</div>' +
    '<div class="gc-body flush">' +
    (zimmetler.length
      ? tbl('<th>Zimmet no</th><th>Personel</th><th>Teslim</th><th>İade</th><th>Personel onayı</th><th>Hasar notu</th><th>Durum</th>',
          zimmetler.map(function(z){
            return '<tr><td><span class="cell-main">' + esc(z.kod) + '</span>' +
              (z.tutanak ? '<span class="cell-code">' + esc(z.tutanak) + '</span>' : '') + '</td>' +
              '<td>' + surucu(z.personel) + '</td>' +
              '<td><span class="cell-date">' + F.date(z.teslimTarihi) + '</span></td>' +
              '<td>' + (z.iadeTarihi ? '<span class="cell-date">' + F.date(z.iadeTarihi) + '</span>' : '<span class="u-faint">—</span>') + '</td>' +
              '<td>' + GV.badge(z.personelOnay) + (z.onayTarihi ? '<span class="cell-sub">' + F.date(z.onayTarihi) + '</span>' : '') + '</td>' +
              '<td class="cell-wrap">' + (z.hasar ? esc(z.hasar) : '<span class="u-faint">—</span>') + '</td>' +
              '<td>' + GV.badge(z.durum, z.durum === 'İade edildi' ? 'is-neutral' : null) + '</td></tr>';
          }).join(''),
          sayac('<b>' + zimmetler.length + '</b> zimmet kaydı',
            '<a class="btn btn-line btn-sm" href="app-zimmet.html">' + ico('i-external','ic-sm') + ' Zimmet listesi</a>'))
      : GV.empty({ icon:'i-user-check', title:'Zimmet tutanağı yok',
          desc:'Bu araç için imzalı zimmet kaydı bulunmuyor. Araç ' + (v.anaSurucu ? DB.empName(v.anaSurucu) + ' adına tahsisli' : v.kullanim.toLowerCase() + 'da') + ', tutanak zimmet modülünden oluşturulur.',
          action:'<a class="btn btn-acc" href="app-zimmet.html">Zimmet listesine git</a>' })) +
    '</div>';

  /* =====================================================================
     3. BAKIM
     ===================================================================== */
  var bakimUyari = acikBakim
    ? '<div class="gc-body">' + GV.notice({
        tone:notTonu(acikBakim.planTarihi), icon:'i-wrench',
        title:'Sonraki bakım — ' + F.date(acikBakim.planTarihi) + ' · ' + F.num(acikBakim.planKm) + ' km',
        text:acikBakim.tur + ' · ' + acikBakim.servis + ' · ' + F.rel(acikBakim.planTarihi) +
             (v.guncelKm >= acikBakim.planKm ? ' · kilometre eşiği aşıldı, bakım öne alınmalı.' : ' · güncel km ' + F.num(v.guncelKm) + '.'),
        actions:[{ label:'Bakım takibi', href:'app-arac-bakim.html?f_arac=' + kod }] }) + '</div>'
    : '';
  var bakimMaliyetli = bakimlar.filter(function(b){ return b.maliyet != null; }).length;
  var pBakim = bakimUyari + finansNot + '<div class="gc-body flush">' +
    (bakimlar.length

    ['Departman', esc(DB.depName(v.dep))],
    ['Mülkiyet', tagOf(v.mulkiyet)],
    ['Güncel kilometre', '<b class="u-num">' + F.num(v.guncelKm) + ' km</b>'],
    ['Sonraki bakım', tarihKalan(v.sonrakiBakimTarihi) || '<span class="u-faint">—</span>'],
    ['Muayene bitiş', muayene ? tarihKalan(muayene.sonrakiTarih) : '<span class="u-faint">Kayıt yok</span>'],
    ['Trafik sigortası bitiş', trafik ? tarihKalan(trafik.bitis) : '<span class="u-faint">Poliçe yok</span>'],
    ['Kasko bitiş', kasko ? tarihKalan(kasko.bitis) : '<span class="u-faint">Poliçe yok</span>'],
    ['Toplam kayıtlı maliyet', para(toplamMaliyet)]
  ];

  /* Yenileme takvimi — kalan güne göre sıralı */
  var takvim = [
    v.sonrakiBakimTarihi ? { ad:'Periyodik bakım', ic:'i-wrench', tarih:v.sonrakiBakimTarihi, not:F.num(v.sonrakiBakimKm) + ' km' } : null,
    muayene ? { ad:'Araç muayenesi', ic:'i-clipboard', tarih:muayene.sonrakiTarih, not:muayene.istasyon } : null,
    trafik ? { ad:'Trafik sigortası', ic:'i-shield', tarih:trafik.bitis, not:trafik.sirket } : null,
    kasko ? { ad:'Kasko', ic:'i-shield-check', tarih:kasko.bitis, not:kasko.sirket } : null,
    (kiralik && v.sozlesmeBit) ? { ad:'Kiralama sözleşmesi', ic:'i-receipt', tarih:v.sozlesmeBit, not:v.kiralamaFirmasi } : null
  ].filter(Boolean).sort(function(a, b){ return String(a.tarih).localeCompare(String(b.tarih)); });

  var aside =
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-info') + 'Özet</h2></div>' +
    '<div class="gc-body"><div class="gv-summary">' + ozet.map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span><span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div></div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-calendar') + 'Yenileme Takvimi</h2></div>' +
    '<div class="gc-body">' + (takvim.length
      ? '<div class="gv-summary">' + takvim.map(function(t){
          return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + ico(t.ic,'ic-sm') + ' ' + esc(t.ad) +
            '<span class="cell-sub">' + esc(t.not) + '</span></span>' +
            '<span class="gv-summary-val"><span class="cell-date">' + F.dateShort(t.tarih) + '</span><br>' + kalanBadge(t.tarih) + '</span></div>';
        }).join('') + '</div>'
      : '<p class="u-sm u-faint">Bu araç için takip edilen bir yenileme tarihi yok.</p>') + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3))
      : '<p class="u-sm u-faint">Bu araç kartında henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =====================================================================
     Bakım kaydı ekleme — gerçekten çalışır
     ===================================================================== */
  function bakimModal(){
    var turler = ['Periyodik bakım','Ağır bakım','Onarım','Lastik değişimi'];
    GV.modal({
      title:'Bakım Kaydı Ekle', text:v.plaka + ' · ' + v.marka + ' ' + v.model, icon:'i-wrench', size:'sm',
      body:'<div class="gv-fields">' +
        '<div class="field f-col-12"><label for="bTur">Bakım türü</label><select id="bTur">' +
          turler.map(function(t){ return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field f-col-6"><label for="bTarih">Planlanan tarih</label>' +
          '<input type="date" class="inp" id="bTarih" value="' + DB.today + '"></div>' +
        '<div class="field f-col-6"><label for="bKm">Bakım kilometresi</label>' +
          '<input type="number" class="inp" id="bKm" min="' + v.guncelKm + '" value="' + (v.sonrakiBakimKm || v.guncelKm) + '"></div>' +
        '<div class="field f-col-12"><label for="bServis">Servis</label>' +
          '<input type="text" class="inp" id="bServis" placeholder="Yetkili servis adı"></div>' +
        '<div class="field f-col-12"><label for="bIslem">Yapılacak işlemler</label>' +
          '<input type="text" class="inp" id="bIslem" placeholder="Virgülle ayırın: Yağ değişimi, Filtre değişimi"></div>' +
        '</div>',
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Kaydet', cls:'btn-acc', onClick:function(close, el){
            var servis = el.querySelector('#bServis').value.trim();
            var tarih = el.querySelector('#bTarih').value;
            var bkm = parseInt(el.querySelector('#bKm').value, 10);
            if(!servis){ GV.toast('Servis adı zorunludur', 'danger'); return false; }
            if(!tarih){ GV.toast('Planlanan tarih zorunludur', 'danger'); return false; }
            if(!bkm || bkm < v.guncelKm){ GV.toast('Bakım kilometresi güncel kilometreden küçük olamaz', 'danger'); return false; }
            var gun = F.days(tarih);
            var yeni = {
              kod:'BKM-' + tarih.slice(0, 4) + '-' + String(DB.maintenance.length + 22).padStart(3, '0'),
              arac:kod, tur:el.querySelector('#bTur').value, planTarihi:tarih, planKm:bkm,
              gercekTarihi:null, servis:servis, maliyet:null,
              durum:gun <= 30 ? 'Yaklaşıyor' : 'Planlandı', kalanGun:gun,
              islemler:el.querySelector('#bIslem').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean),
              aktif:true
            };
            DB.maintenance.unshift(yeni);
            if(!v.sonrakiBakimTarihi || tarih < v.sonrakiBakimTarihi){
              v.sonrakiBakimTarihi = tarih;
              v.sonrakiBakimKm = bkm;
            }
            DB.activities.unshift({ kayit:kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0, 5),
              kisi:GV.session.emp, metin:'Bakım kaydı eklendi — ' + yeni.tur + ' · ' + servis,
              eski:null, yeni:yeni.kod, tone:'info', icon:'i-wrench' });
            GV.toast(yeni.kod + ' bakım kaydı oluşturuldu', 'ok');
            setTimeout(function(){ GV.refresh(); }, 700);
          } }
      ]
    });
  }
  GV.on(document, 'click', function(e){ if(e.target.closest('#btnBakim2')) bakimModal(); }, 'bakim');
});
</script>
</body>
</html>
