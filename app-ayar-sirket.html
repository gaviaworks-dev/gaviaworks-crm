<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Şirket Bilgileri — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="ayarlar" data-screen="sirket">
<div id="sirket"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<!-- REVİZE 18 — Aktif Modüller bloğu modül başına KAYIT SAYISI basıyor;
     sayılar `DB.tickets` · `DB.supportPackages` · `DB.purchases` · `DB.assets` ·
     `DB.assignments` · `DB.vehicles` üzerinden okunur ve hepsi ops.js'te.
     Dosya yüklenmezse sayaç hata vermeden SIFIR basar (L-34) — ölçülmüş
     sıfır ile yüklenmemiş sıfır aynı görünür. -->
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  /* =====================================================================
     ŞİRKET BİLGİLERİ — Ayarlar
     Ekran kapısı shell.js SCREEN_PERM['sirket'] = sahip · genelmudur · sistem.
     Bu script yalnız kapı açıkken çalışır (lessons L-07), bu yüzden ayrıca
     403 basılmaz; burada yalnız DÜZENLEME yetkisi (GV.perm.can('duzenle'))
     kontrol edilir ve yetkisiz rolde ekran salt okunur hâle gelir.

     Canonical kaynak: DB.company (org.js). Ekranda gösterilen çalışma
     kapasitesi DB.capacity/DB.timesheets'ten, KDV ve vade varsayılanı
     DB.invoices'tan OKUNUR — uydurulmaz.
     ===================================================================== */
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;
  var mount = document.getElementById('sirket');
  var ME = GV.session.emp;
  var ROL = GV.perm.role();
  var canEdit = GV.perm.can('duzenle');
  var C = DB.company;

  GV.shell.crumb('Şirket Bilgileri');

  /* =====================================================================
     VERİDEN TÜRETİLEN VARSAYILANLAR (L-08 — sayı veriye yazılmaz, okunur)
     ===================================================================== */
  function mod(arr){
    var say = {}, best = null, bn = 0;
    arr.forEach(function(v){
      say[v] = (say[v] || 0) + 1;
      if(say[v] > bn){ bn = say[v]; best = v; }
    });
    return { value:best, n:bn, total:arr.length };
  }
  function ort(arr){
    if(!arr.length) return 0;
    return arr.reduce(function(a, b){ return a + b; }, 0) / arr.length;
  }

  /* KDV oranı — fatura kayıtlarındaki vergi / matrah oranı */
  var KDV = mod(DB.invoices.map(function(i){ return Math.round(i.vergi / i.tutar * 100); }));
  /* Fatura vadesi — fatura tarihi → vade arası gün (F.days iki ISO tarihle çalışır) */
  var VADE = mod(DB.invoices.map(function(i){ return F.days(i.vade, i.tarih); }));
  /* Para birimi — sözleşme kayıtlarındaki döviz kodu */
  var DOVIZ = mod(DB.contracts.map(function(c){ return c.doviz; }));
  /* Haftalık kapasite — DB.capacity (tam zamanlı çoğunluk) */
  var KAP = mod(DB.capacity.map(function(c){ return c.kapasite; }));
  var KAP_TAM = DB.capacity.filter(function(c){ return c.kapasite === KAP.value; });
  var KAP_YARI = DB.capacity.filter(function(c){ return c.kapasite !== KAP.value; });
  /* Gerçekleşen haftalık saat — onaylı/bekleyen timesheet ortalaması */
  var TSH_ORT = Math.round(ort(DB.timesheets.map(function(t){ return t.toplam; })) * 10) / 10;

  /* Tatil listesi veri modelinde YOK — 2026 Türkiye resmî tatilleri varsayımdır.
     Şirket tatilleri DB.company.kurulus tarihinden türetilir (uydurma tarih yok). */
  var KURULUS_GUN = String(C.kurulus || '').slice(5);
  var TATIL_DEF = [
    { tarih:'2026-01-01', ad:'Yılbaşı', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-' + KURULUS_GUN, ad:C.ad + ' kuruluş yıl dönümü', tur:'Şirket', sure:'Yarım gün' },
    { tarih:'2026-03-19', ad:'Ramazan Bayramı arifesi', tur:'Resmî', sure:'Yarım gün' },
    { tarih:'2026-03-20', ad:'Ramazan Bayramı 1. gün', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-03-21', ad:'Ramazan Bayramı 2. gün', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-03-22', ad:'Ramazan Bayramı 3. gün', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-04-23', ad:'Ulusal Egemenlik ve Çocuk Bayramı', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-05-01', ad:'Emek ve Dayanışma Günü', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-05-19', ad:'Atatürk’ü Anma, Gençlik ve Spor Bayramı', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-05-26', ad:'Kurban Bayramı arifesi', tur:'Resmî', sure:'Yarım gün' },
    { tarih:'2026-05-27', ad:'Kurban Bayramı 1. gün', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-05-28', ad:'Kurban Bayramı 2. gün', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-05-29', ad:'Kurban Bayramı 3. gün', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-05-30', ad:'Kurban Bayramı 4. gün', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-07-15', ad:'Demokrasi ve Millî Birlik Günü', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-08-30', ad:'Zafer Bayramı', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-10-28', ad:'Cumhuriyet Bayramı arifesi', tur:'Resmî', sure:'Yarım gün' },
    { tarih:'2026-10-29', ad:'Cumhuriyet Bayramı', tur:'Resmî', sure:'Tam gün' },
    { tarih:'2026-12-31', ad:'Yıl sonu kapanışı', tur:'Şirket', sure:'Yarım gün' }
  ];

  /* Tenant listesi — statik prototipte tek şirket tanımlı (DB.company) */
  var TENANT_DEF = [{
    kod:C.tenant, ad:C.ad, unvan:C.unvan, paket:C.paket,
    kullanici:DB.employees.filter(function(e){ return e.aktif; }).length,
    durum:'Aktif', kaynak:'DB.company'
  }];

  var GUNLER = [
    { key:'pzt', lbl:'Pazartesi' }, { key:'sal', lbl:'Salı' }, { key:'car', lbl:'Çarşamba' },
    { key:'per', lbl:'Perşembe' }, { key:'cum', lbl:'Cuma' },
    { key:'cmt', lbl:'Cumartesi' }, { key:'paz', lbl:'Pazar' }
  ];

  /* =====================================================================
     AYAR DEPOSU — localStorage['gv.sirket']
     ===================================================================== */
  var LSK = 'gv.sirket';
  var DEF = {
    /* 1 · Kimlik */
    ad:C.ad, unvan:C.unvan, vergiDairesi:C.vergiDairesi, vergiNo:C.vergiNo,
    ticaretSicil:'', mersis:'', adres:C.adres, telefon:C.telefon, eposta:C.eposta, web:C.web,
    /* 2 · Çalışma düzeni */
    gunler:['pzt','sal','car','per','cum'],
    mesaiBas:'09:00', mesaiBit:'18:00', gunlukSaat:8, ogleArasi:'60',
    fazlaMesai:'Yönetici onaylı — ücretli (%50 zamlı)', yillikIzin:14,
    /* 3 · Tatil günleri */
    tatiller:TATIL_DEF.slice(),
    /* 4 · Finansal varsayılanlar */
    paraBirimi:DOVIZ.value || 'TRY', kdv:KDV.value, vadeGun:VADE.value,
    odemeKosul:'Fatura tarihinden itibaren ' + VADE.value + ' gün içinde havale/EFT ile ödenir. ' +
               'Gecikme hâlinde aylık %2 gecikme faizi uygulanır.',
    tarihBicim:'gg.aa.yyyy', sayiBicim:'1.234,56',
    /* 5 · Çoklu şirket */
    tenantlar:TENANT_DEF.slice(), aktifTenant:C.tenant
  };

  function oku(){
    var raw = {};
    try{ raw = JSON.parse(window.localStorage.getItem(LSK) || '{}') || {}; }catch(e){ raw = {}; }
    var out = {};
    Object.keys(DEF).forEach(function(k){
      out[k] = (raw[k] === undefined || raw[k] === null) ? DEF[k] : raw[k];
    });
    return out;
  }
  function yaz(){
    try{ window.localStorage.setItem(LSK, JSON.stringify(S)); return true; }
    catch(e){ return false; }
  }
  var S = oku();

  /* Log kaydı — app-ayar-profil.html / app-ayar-kullanici.html ile aynı kalıp */
  function logKaydi(islem, kayit, eski, yeni){
    DB.logs.unshift({
      kod:'LOG-' + (88300 + DB.logs.length), tarih:DB.today + 'T00:00',
      kisi:ME, islem:islem, kayit:kayit, modul:'Ayarlar', ip:'—', eski:eski, yeni:yeni
    });
  }

  /* Küçük yardımcılar */
  function ozetSatir(lbl, val){
    return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + esc(lbl) + '</span>' +
           '<span class="gv-summary-val">' + val + '</span></div>';
  }
  function saatSecenek(){
    var out = [];
    for(var h = 6; h <= 22; h++){
      var hh = (h < 10 ? '0' : '') + h;
      out.push({ value:hh + ':00', label:hh + ':00' });
      out.push({ value:hh + ':30', label:hh + ':30' });
    }
    return out;
  }
  /* Salt okunur moda çevirme — yetkisiz rolde alanlar ve aksiyonlar kilitlenir */
  function kilitle(sel){
    var box = typeof sel === 'string' ? document.querySelector(sel) : sel;
    if(!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('input,select,textarea,button'), function(el){
      if(el.closest('.gv-tabs')) return;
      el.disabled = true;
    });
  }
  var SALT_OKUNUR = GV.notice({
    tone:'warn', icon:'i-lock', title:'Salt okunur görünüm',
    text:'Rolünüzde (' + DB.roleName(ROL) + ') düzenleme yetkisi yok. Şirket ayarlarını ' +
         'görüntüleyebilirsiniz; kaydetme, ekleme ve silme aksiyonları devre dışıdır.'
  });

  /* =====================================================================
     SAYFA BAŞLIĞI
     ===================================================================== */
  GV.pageHead({
    eyebrow:'Ayarlar', title:'Şirket Bilgileri',
    sub:C.unvan + ' · ' + C.vergiDairesi + ' V.D. ' + C.vergiNo,
    actions:[
      { label:'Departmanlar', icon:'i-users', cls:'btn-line', href:'app-ayar-departman.html' },
      { label:'Kullanıcılar', icon:'i-user', cls:'btn-line', href:'app-ayar-kullanici.html' }
    ]
  });

  /* =====================================================================
     SEKME KABUĞU
     ===================================================================== */
  var tabs = [
    { key:'kimlik',  lbl:'Kimlik',                 ic:'i-building' },
    { key:'calisma', lbl:'Çalışma Düzeni',         ic:'i-clock' },
    { key:'tatil',   lbl:'Tatil Günleri',          ic:'i-calendar', cnt:S.tatiller.length },
    { key:'finans',  lbl:'Finansal Varsayılanlar', ic:'i-wallet' },
    { key:'tenant',  lbl:'Çoklu Şirket',           ic:'i-layers',   cnt:S.tenantlar.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="skTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' +
      ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  var panels = {
    kimlik:pKimlik(), calisma:pCalisma(), tatil:pTatil(), finans:pFinans(), tenant:pTenant()
  };

  mount.innerHTML = '<section class="gv-card">' + tabBar +
    tabs.map(function(x){
      return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>';
    }).join('') + '</section>';

  GV.tabs('#skTabs');

  /* =====================================================================
     PANEL ÜRETİCİLERİ
     ===================================================================== */
  /* ---- 1 · KİMLİK ------------------------------------------------------ */
  function pKimlik(){
    return '<div class="gc-body">' +
      (canEdit ? '' : SALT_OKUNUR) +
      '<div class="gv-form-sec">' +
        '<div class="gv-form-sec-head"><h3>Şirket logosu</h3>' +
        '<p>Logo yüklenene kadar şirket adının baş harfleri kullanılır. Kare görsel önerilir.</p></div>' +
        '<div class="u-row u-wrap u-mb-4">' +
          /* UID-03 — kare görsel sınıfı artık bileşen katmanında: `.gv-thumb`
             `background-size:cover` ve `position:center` sınıfın içinde, INLINE stil yok. */
          '<div class="gv-thumb is-lg" id="skLogo" aria-hidden="true">' +
            esc(F.initials(C.ad).toLocaleUpperCase('tr-TR')) + '</div>' +
          '<span class="u-col"><span class="cell-main" id="skAdLbl">' + esc(S.ad) + '</span>' +
          '<span class="cell-sub" id="skUnvanLbl">' + esc(S.unvan) + '</span></span>' +
        '</div>' +
        '<div id="skLogoUp"></div>' +
        '<div class="u-mt-4">' + GV.notice({
          tone:'neutral', icon:'i-image', title:'Logo veri modelinde tutulmuyor',
          text:'DB.company kaydında görsel alanı yok. Seçtiğiniz dosya bu statik prototipte yalnız ' +
               'tarayıcıda önizlenir, kaydedilmez; gerçek yükleme sunucu tarafı gerektirir. Önizleme ' +
               'kare bir div üzerine background-image ile basılır (img etiketi kullanılmaz).'
        }) + '</div>' +
      '</div>' +
      '<div id="skKimlikForm"></div>' +
      '<div class="gv-form-sec">' +
        '<div class="gv-form-sec-head"><h3>Kayıt bilgileri</h3>' +
        '<p>Sistemde tutulan sabit şirket bilgileri.</p></div>' +
        '<div class="gv-summary">' +
          ozetSatir('Tenant kodu', '<span class="cell-code">' + esc(C.tenant) + '</span>') +
          ozetSatir('Abonelik paketi', GV.badge(C.paket, 'is-accent')) +
          ozetSatir('Kuruluş tarihi', '<span class="cell-date">' + esc(F.date(C.kurulus)) + '</span>') +
          ozetSatir('Departman sayısı', '<b class="u-num">' +
            DB.departments.filter(function(d){ return d.aktif; }).length + ' / ' + DB.departments.length + '</b>') +
          ozetSatir('Kayıtlı personel', '<b class="u-num">' + DB.employees.length + '</b>') +
        '</div>' +
        '<div class="u-mt-4">' + GV.notice({
          tone:'warn', title:'Ticaret sicil ve MERSİS numarası veride yok',
          text:'DB.company kaydında yalnız vergi dairesi ve vergi numarası tutuluyor. Ticaret sicil ' +
               've MERSİS alanları uydurulmadı: boş bırakıldı, girilen değer yalnız tarayıcıda ' +
               '(localStorage: ' + LSK + ') saklanır ve fatura/sözleşme çıktılarına bağlanmaz.'
        }) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="gv-form-actions">' +
      '<span class="spacer u-sm u-muted">Değişiklik DB.company kaydına işlenir ve log kayıtlarına eski → yeni değerle düşer.</span>' +
      '<button type="button" class="btn btn-line" id="skKimlikGeri">' + ico('i-refresh') + ' Geri al</button>' +
      '<button type="button" class="btn btn-acc" id="skKimlikKaydet">' + ico('i-check') + ' Şirket bilgilerini kaydet</button>' +
    '</div>';
  }

  /* ---- 2 · ÇALIŞMA DÜZENİ ---------------------------------------------- */
  function gunKutulari(){
    return '<div class="u-row u-wrap">' + GUNLER.map(function(g){
      return '<label class="f-check"><input type="checkbox" data-gun="' + g.key + '"' +
        (S.gunler.indexOf(g.key) !== -1 ? ' checked' : '') + '>' +
        '<span>' + esc(g.lbl) + '</span></label>';
    }).join('') + '</div>';
  }

  /* ---- REVİZE 18 — AKTİF MODÜLLER ------------------------------------
     Yeni sekme AÇILMADI: blok "Çalışma Düzeni" sekmesine girdi (talimat:
     mevcut yapı üzerinden çöz). Kutular `gunKutulari()` ile birebir aynı
     kalıbı kullanır — yeni bileşen ve yeni CSS sınıfı yok.
     Anahtar KAPATMAK VERİ SİLMEZ: ilgili menü maddesi ve ekranı kullanıcıdan
     gizlenir, kayıt ve dosya yerinde kalır (G-1 · talimat REVİZE 18). */
  /* Sözlük FONKSİYONDA tutulur, `var`da değil: sekme panelleri bu satırdan
     ÖNCE kuruluyor ve `var` o anda `undefined` oluyordu (ölçüldü: panel
     açılışta TypeError ile ölüyor, sekmeler hiç basılmıyordu). İşlev
     bildirimi hoisting ile her yerden çağrılabilir. */
  function modulEtiket(){
    return { satis:'Satış', proje:'Projeler', destek:'Destek', personel:'Personel',
             finans:'Finans', satinalma:'Satın Alma', demirbas:'Demirbaş', filo:'Filo' };
  }
  /* Modül başına ölçülen kayıt sayısı — kullanıcı neyi gizlediğini bilsin.
     Sayı VERİDEN okunur; "kapatınca ne olacağı" tahmin edilmez. */
  function modulKayit(k){
    var D = window.DB || {};
    if(k === 'satis')     return (D.leads || []).length + ' aday · ' + (D.quotes || []).length + ' teklif';
    if(k === 'proje')     return (D.projects || []).length + ' proje';
    if(k === 'destek')    return (D.tickets || []).length + ' talep · ' + (D.supportPackages || []).length + ' paket';
    if(k === 'personel')  return (D.employees || []).length + ' personel';
    if(k === 'finans')    return (D.invoices || []).length + ' fatura · ' + (D.contracts || []).length + ' sözleşme';
    if(k === 'satinalma') return (D.purchases || []).length + ' talep';
    if(k === 'demirbas')  return (D.assets || []).length + ' demirbaş · ' + (D.assignments || []).length + ' zimmet';
    if(k === 'filo')      return (D.vehicles || []).length + ' araç';
    return '';
  }
  function modulKutulari(){
    var akt = (DB.company.aktifModuller || {});
    return '<div class="u-row u-wrap">' + Object.keys(modulEtiket()).map(function(k){
      return '<label class="f-check"><input type="checkbox" data-modul="' + k + '"' +
        (akt[k] !== false ? ' checked' : '') + '>' +
        '<span>' + esc(modulEtiket()[k]) + ' <span class="u-faint">· ' + esc(modulKayit(k)) + '</span></span></label>';
    }).join('') + '</div>';
  }
  function modulOku(){
    var out = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-modul]'), function(c){
      out[c.dataset.modul] = c.checked;
    });
    return out;
  }

  /* Kaydedilmemiş seçim S'ye yazılmaz — önizleme parametreyle beslenir. */
  function haftalikOzet(gunler, gunlukSaat){
    var gun = (gunler || S.gunler).length;
    var saat = gun * Number((gunlukSaat == null ? S.gunlukSaat : gunlukSaat) || 0);
    var fark = saat - KAP.value;
    return '<div class="gv-summary">' +
      ozetSatir('Haftalık çalışma günü', '<b class="u-num">' + gun + ' gün</b>') +
      ozetSatir('Seçili ayardan hesaplanan haftalık süre', '<b class="u-num">' + F.hours(saat) + '</b>') +
      ozetSatir('DB.capacity haftalık kapasitesi (tam zamanlı)',
        '<b class="u-num">' + F.hours(KAP.value) + '</b> · ' + KAP_TAM.length + ' kişi') +
      ozetSatir('DB.capacity yarı zamanlı kapasite',
        KAP_YARI.length
          ? '<b class="u-num">' + F.hours(KAP_YARI[0].kapasite) + '</b> · ' + KAP_YARI.length + ' kişi'
          : '<span class="u-faint">Yok</span>') +
      ozetSatir('Gerçekleşen haftalık ortalama (DB.timesheets)',
        '<b class="u-num">' + F.hours(TSH_ORT) + '</b> · ' + DB.timesheets.length + ' timesheet') +
      ozetSatir('Kapasite tutarlılığı', fark === 0
        ? GV.badge('Tutarlı', 'is-ok')
        : GV.badge((fark > 0 ? '+' : '') + F.hours(fark) + ' sapma', 'is-warn')) +
    '</div>';
  }

  function pCalisma(){
    return '<div class="gc-body">' +
      (canEdit ? '' : SALT_OKUNUR) +
      '<div class="gv-form-sec">' +
        '<div class="gv-form-sec-head"><h3>Haftalık çalışma günleri</h3>' +
        '<p>İşaretli günler mesai günü sayılır; kalanlar hafta tatilidir. İzin, zaman kaydı ve ' +
        'kapasite hesapları bu seçimden türer.</p></div>' +
        '<div id="skGunler">' + gunKutulari() + '</div>' +
      '</div>' +
      '<div id="skCalismaForm"></div>' +
      '<div class="gv-form-sec">' +
        '<div class="gv-form-sec-head"><h3>Aktif modüller</h3>' +
        '<p>İşaretsiz modülün menüsü kullanıcıdan gizlenir ve ekranları doğrudan adresle de ' +
        'açılmaz. <b>Veri silinmez</b> — anahtar geri açıldığında kayıtlar olduğu gibi döner.</p></div>' +
        '<div id="skModuller">' + modulKutulari() + '</div>' +
      '</div>' +
      '<div class="gv-form-sec">' +

  }

        icon:'i-calendar', title:'Tanımlı tatil günü yok',

    var adL = document.getElementById('skAdLbl');

    if(adL) adL.textContent = S.ad;
    if(unL) unL.textContent = S.unvan;
    if(sub) sub.textContent = S.unvan + ' · ' + S.vergiDairesi + ' V.D. ' + S.vergiNo;

    if(box && !box.style.backgroundImage) box.textContent = F.initials(S.ad).toLocaleUpperCase('tr-TR');

  document.getElementById('skKimlikKaydet').addEventListener('click', function(){
    if(!canEdit){ GV.toast('Şirket bilgilerini değiştirme yetkiniz yok', 'danger'); return; }
    var d = fKimlik.submit();
    if(!d) return;
    var degisen = 0;
    KIMLIK_ALAN.forEach(function(p){
      var yeni = String(d[p[0]] == null ? '' : d[p[0]]).trim();
      var eski = String(S[p[0]] == null ? '' : S[p[0]]);
      if(yeni === eski) return;
      logKaydi('Şirket bilgisi güncelledi · ' + p[1], C.tenant, eski || '—', yeni || '—');
      S[p[0]] = yeni;
      if(KIMLIK_CANONICAL.indexOf(p[0]) !== -1) C[p[0]] = yeni;
      degisen++;
    });
    if(!degisen){ GV.toast('Değişen alan yok', 'info'); return; }
    var ok = yaz();
    kimlikTazele();
    tenantOzetCiz();
    GV.toast(degisen + ' alan güncellendi · log kaydı oluşturuldu' +
      (ok ? '' : ' · tarayıcı depolaması kapalı, kalıcı kaydedilemedi'), ok ? 'ok' : 'warn', 4600);
  });

    var gunler = calismaOku();
    if(!gunler.length){

      return;
    }
    var eski = S.gunler.length + ' gün · ' + S.mesaiBas + '-' + S.mesaiBit + ' · ' +
               (S.gunler.length * Number(S.gunlukSaat || 0)) + ' sa/hafta';
    S.gunler = gunler;
    S.mesaiBas = d.mesaiBas; S.mesaiBit = d.mesaiBit;
    S.ogleArasi = d.ogleArasi; S.gunlukSaat = Number(d.gunlukSaat);
    S.yillikIzin = Number(d.yillikIzin); S.fazlaMesai = d.fazlaMesai;

    /* REVİZE 18 — modül anahtarları. Kapanan/açılan modül LOG'a yazılır:
       menü kaybolduğunda kullanıcı "ekran silinmiş" sanmasın, kaydı olsun. */
    var mod = modulOku();
    var eskiMod = Object.assign({}, DB.company.aktifModuller || {});
    var degisenMod = Object.keys(mod).filter(function(k){ return (eskiMod[k] !== false) !== mod[k]; });
    DB.company.aktifModuller = mod;
    if(degisenMod.length){
      logKaydi('Aktif modülleri güncelledi', C.tenant,
        degisenMod.map(function(k){ return modulEtiket()[k] + ': ' + (eskiMod[k] !== false ? 'açık' : 'kapalı'); }).join(' · '),
        degisenMod.map(function(k){ return modulEtiket()[k] + ': ' + (mod[k] ? 'açık' : 'kapalı'); }).join(' · '));
    }
    var yeni = S.gunler.length + ' gün · ' + S.mesaiBas + '-' + S.mesaiBit + ' · ' +
               (S.gunler.length * S.gunlukSaat) + ' sa/hafta';
    var ok = yaz();
    logKaydi('Çalışma düzenini güncelledi', C.tenant, eski, yeni);
    haftalikTazele();
    var saat = S.gunler.length * S.gunlukSaat;
    calismaDurum(ok
      ? 'Kaydedildi · haftalık ' + F.hours(saat) + ' (DB.capacity: ' + F.hours(KAP.value) + ')'
      : 'Kaydedilemedi — tarayıcı depolaması kapalı olabilir.');
    if(!ok){ GV.toast('Çalışma düzeni kaydedilemedi — tarayıcı depolaması kapalı', 'danger', 4200); return; }
    GV.toast(saat === KAP.value
      ? 'Çalışma düzeni kaydedildi — kapasite verisiyle tutarlı'
      : 'Çalışma düzeni kaydedildi — DB.capacity ile ' + F.hours(saat - KAP.value) + ' sapma var',
      saat === KAP.value ? 'ok' : 'warn', 4600);
    /* Menü modül anahtarından besleniyor; değişiklik anında görünsün. */
    if(degisenMod.length && GV.refresh) GV.refresh();

              return false;
            }
            S.tenantlar.push({ kod:kod, ad:ad, unvan:unvan || ad, paket:paket,
                               kullanici:0, durum:'Pasif', kaynak:'localStorage' });
            var ok = yaz();
            logKaydi('Yeni şirket (tenant) ekledi', kod, null, ad + ' · ' + paket);
            tenantCiz();
            GV.toast('“' + ad + '” eklendi — statik prototipte ayrı veri kümesi oluşmaz' +
                     (ok ? '' : ' · tarayıcıya kaydedilemedi'), ok ? 'ok' : 'warn', 5200);
          } }
      ]
    });
  });

  document.querySelector('[data-panel="tenant"]').addEventListener('click', function(e){
    var aktifBtn = e.target.closest('[data-tnaktif]');
    if(aktifBtn){
      if(!canEdit){ GV.toast('Aktif şirketi değiştirme yetkiniz yok', 'danger'); return; }
      var kod = aktifBtn.dataset.tnaktif;
      var yeni = S.tenantlar.filter(function(t){ return t.kod === kod; })[0];
      if(!yeni) return;
      GV.confirm({
        title:'Aktif şirketi değiştir', tone:'warn', okLabel:'Şirketi değiştir',
        text:'“' + yeni.ad + '” aktif şirket olacak. Gerçek kurulumda bu değişiklik oturumdaki tüm ' +
             'liste, rapor ve dosya erişimini o şirketin kapsamına alır. Statik prototipte kayıt kümesi ' +
             'tek olduğu için veriler değişmez, yalnız seçim saklanır.'
      }).then(function(evet){
        if(!evet) return;
        var eskiKod = S.aktifTenant;
        S.aktifTenant = kod;
        var ok = yaz();
        logKaydi('Aktif şirketi değiştirdi', kod, eskiKod, kod);
        tenantCiz();
        GV.toast('Aktif şirket: ' + yeni.ad + (ok ? '' : ' · tarayıcıya kaydedilemedi'), ok ? 'ok' : 'warn', 4200);
      });
      return;
    }
    var silBtn = e.target.closest('[data-tnsil]');
    if(!silBtn) return;
    if(!canEdit){ GV.toast('Şirket silme yetkiniz yok', 'danger'); return; }
    var sKod = silBtn.dataset.tnsil;
    var kayit = S.tenantlar.filter(function(t){ return t.kod === sKod; })[0];
    if(!kayit) return;
    if(kayit.kod === S.aktifTenant){
      GV.toast('Aktif şirket silinemez — önce başka bir şirketi aktif yapın', 'danger', 4600);
      return;
    }
    GV.confirm({
      title:'Şirket tanımını sil', tone:'danger', okLabel:'Şirketi sil',
      text:'“' + kayit.ad + '” (' + kayit.kod + ') tanımı kaldırılacak. Gerçek kurulumda bu işlem ' +
           'şirkete bağlı tüm kayıtları da kapsadığı için geri alınamaz ve ayrı bir onay akışına bağlanır.'
    }).then(function(evet){
      if(!evet){ GV.toast('İşlem iptal edildi', 'info'); return; }
      S.tenantlar = S.tenantlar.filter(function(t){ return t.kod !== sKod; });
      var ok = yaz();
      logKaydi('Şirket (tenant) tanımını sildi', sKod, kayit.ad + ' · ' + kayit.paket, null);
      tenantCiz();
      GV.toast('“' + kayit.ad + '” silindi' + (ok ? '' : ' · tarayıcıya kaydedilemedi'), ok ? 'ok' : 'warn', 4200);
    });
  });

  /* =====================================================================
     YETKİ — düzenleme yetkisi yoksa tüm sekmeler salt okunur
     ===================================================================== */
  if(!canEdit){
    ['kimlik','calisma','tatil','finans','tenant'].forEach(function(k){
      kilitle('[data-panel="' + k + '"]');
    });
  }
});
</script>
</body>
</html>
