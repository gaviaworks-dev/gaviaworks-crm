<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demirbaş Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="varlik" data-screen="demirbas">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');
  var canDuzenle = GV.perm.can('duzenle');

  var ilk = (DB.assets && DB.assets[0]) ? DB.assets[0].kod : null;
  var id = new URLSearchParams(location.search).get('id') || ilk;
  var a = (DB.assets || []).filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!a){
    GV.pageHead({ eyebrow:'Demirbaş & Filo', title:'Demirbaş Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Demirbaş listesi', icon:'i-package', href:'app-demirbas.html' },
               { label:'Zimmetler', icon:'i-clipboard-check', href:'app-zimmet.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Demirbaş bulunamadı',
      desc:'“' + esc(id || '') + '” kodlu demirbaş envanterde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-demirbas.html">Demirbaş listesine dön</a>' }) + '</div>';
    return;
  }

  var kod = a.kod;
  var ad = (a.marka || '') + ' ' + (a.model || '');
  GV.shell.crumb(kod);
  document.title = kod + ' — Demirbaş — GaviaWorks CRM';

  /* =====================================================================
     KAYDA BAĞLI VERİ DİLİMLERİ — hepsi veride YAZILI tekil bağdan gelir
     ===================================================================== */
  /* Zimmet bağı: DB.assignments[].demirbas (canonical, L-13) */
  var zimmetler = (DB.assignments || []).filter(function(z){ return z.demirbas === kod; })
    .sort(function(x, y){ return String(y.teslimTarihi || '').localeCompare(String(x.teslimTarihi || '')); });
  var aktifZimmet = zimmetler.filter(function(z){ return z.durum === 'Aktif'; })[0] || null;

  /* Tedarikçi bağı: DB.assets[].tedarikci → DB.suppliers[].kod */
  var tedarikci = a.tedarikci ? (DB.suppliers || []).filter(function(s){ return s.kod === a.tedarikci; })[0] : null;

  /* Sipariş bağı: `DB.assets[].siparis` VERİDE YAZILI tekil bağdır (components.md §9d, VB-07).
     `talep` alanı ise hâlâ yoktur — o okuma savunmacıdır, alan doğarsa ekran kendiliğinden bağlar. */
  var siparis = a.siparis ? (DB.orders || []).filter(function(o){ return o.kod === a.siparis; })[0] : null;
  var talep   = a.talep   ? (DB.purchases || []).filter(function(p){ return p.kod === a.talep; })[0] : null;
  var siparisBagiVar = !!(siparis || talep);

  /* Tedarikçi üzerinden DOLAYLI eşleşme — demirbaşın siparişi DEĞİLDİR, aynı
     tedarikçiye verilmiş tüm siparişlerdir. Ekranda böyle etiketlenir. */
  var tedSiparisleri = a.tedarikci
    ? (DB.orders || []).filter(function(o){ return o.tedarikci === a.tedarikci; })
        .sort(function(x, y){ return String(y.tarih).localeCompare(String(x.tarih)); })
    : [];
  function talepOf(k){ return k ? (DB.purchases || []).filter(function(p){ return p.kod === k; })[0] : null; }

  /* Bakım kaydı: DB.maintenance yalnız `arac` alanı taşır — demirbaş bağı yok.
     Filtre dürüsttür, bugünkü veride her zaman boş döner. */
  var bakimlar = (DB.maintenance || []).filter(function(m){ return m.demirbas === kod; });

  var acts = (DB.activities || []).filter(function(x){ return x.kayit === kod; });

  /* =====================================================================
     PARA EKSENİ — components.md §9b
       DB.assets[].alisFiyati = NET (KDV hariç). Ölçüm (6. oturum):
       · DMB-2025-009 (Figma) 42.000 = SAT-2026-015 net `tahminiMaliyet` 42.000
       · DMB-2025-005 (U2723QE) 21.000 = SAT-2026-016 net `tahminiMaliyet` 21.000
       · TDR-003 `toplamTutar` 126.000 = 3 × 42.000 (net eksen, §9b'de doğrulanmış)
       · Brüt olsaydı /1,2 tam liraya inmeliydi: 82.000→68.333,33 · 61.000→50.833,33
         · 47.000→39.166,67 · 18.500→15.416,67 → inmiyor, alan brüt olamaz.
     Etikette eksen daima yazılır. Net ve brüt aynı kolonda karışmaz.
     ===================================================================== */
  function para(n){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    if(n == null) return '<span class="u-faint">—</span>';
    return '<span class="cell-money">' + F.money(n) + '</span>';
  }
  function paraAlis(){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    if(a.alisFiyati == null) return '<span class="u-faint">—</span>';
    if(a.alisFiyati === 0) return '<span class="u-faint">Satın alma bedeli yok</span> ' +
      '<span class="cell-sub">dönemsel abonelik — bedel aylık gidere yazılır</span>';
    return '<span class="cell-money">' + F.money(a.alisFiyati) + '</span>';
  }
  var finansNot = canFinans ? '' : '<div class="gc-body">' + GV.notice({
    tone:'neutral', icon:'i-lock', title:'Tutarlar gizli',
    text:'Rolünüzde finansal tutar görüntüleme yetkisi yok. Kayıtlar listelenir, para alanları maskelenir.' }) + '</div>';

  /* =====================================================================
     SÜRE — referans DB.today (new Date() ile bugün alınmaz)
     Eşikler: süresi doldu · 7 · 15 · 30 · 60 gün
     ===================================================================== */
  var lisansMi = ['Yazılım lisansı','Kurumsal abonelik'].indexOf(a.kategori) !== -1;
  var sureAd   = lisansMi ? 'Lisans dönemi' : 'Garanti';
  var garantiGun = a.garantiBit ? F.days(a.garantiBit) : null;
  var garantiBitti = garantiGun != null && garantiGun < 0;

  function kalanTon(iso){
    var d = F.days(iso);
    if(d == null) return null;
    if(d < 0)   return 'is-danger';
    if(d <= 7)  return 'is-danger';
    if(d <= 15) return 'is-warn';
    if(d <= 30) return 'is-warn';
    if(d <= 60) return 'is-info';
    return 'is-ok';
  }
  /* Kalan gün sayısal bir eşiktir, sözlükte karşılığı yok — açık ton geçilir (§5). */
  function kalanBadge(iso){
    var d = F.days(iso);
    if(d == null) return '<span class="u-faint">—</span>';
    var metin = d < 0 ? 'Süresi doldu · ' + (-d) + ' gün' : d === 0 ? 'Bugün son gün' : d + ' gün kaldı';
    return GV.badge(metin, kalanTon(iso));
  }
  function tarihKalan(iso){
    if(!iso) return null;
    return '<span class="cell-date">' + F.date(iso) + '</span> ' + kalanBadge(iso);
  }
  function esikMetni(gun){
    if(gun == null) return null;
    if(gun < 0)   return 'Süresi doldu';
    if(gun <= 7)  return '7 günden az kaldı';
    if(gun <= 15) return '15 günden az kaldı';
    if(gun <= 30) return '30 günden az kaldı';
    if(gun <= 60) return '60 günden az kaldı';
    return 'Süre rahat';
  }
  function notTonu(iso){
    var t = kalanTon(iso);
    return t === 'is-danger' ? 'danger' : t === 'is-warn' ? 'warn' : t === 'is-info' ? 'info' : 'ok';
  }

  var sureToplam = (a.garantiBas && a.garantiBit)
    ? Math.round((new Date(a.garantiBit + 'T00:00:00') - new Date(a.garantiBas + 'T00:00:00')) / 86400000) : null;
  var sureGecen = (sureToplam != null && garantiGun != null) ? (sureToplam - garantiGun) : null;
  var sureOran  = (sureToplam && sureGecen != null)
    ? Math.max(0, Math.min(100, Math.round(sureGecen / sureToplam * 100))) : null;

  /* Yaş — satın alma tarihinden bugüne */
  var yasGun = a.alisTarihi ? Math.max(0, -F.days(a.alisTarihi)) : null;
  var yasYil = yasGun == null ? null : yasGun / 365.25;

  /* =====================================================================
     ORTAK YARDIMCILAR
     ===================================================================== */
  /* dt metinleri yazar tarafından yazılan sabit dizelerdir (eksen etiketi için
     <span class="u-faint"> içerir) — dt escape EDİLMEZ, dd zaten çağıran
     tarafta esc()'lenerek gelir. (lessons L-14) */
  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(Boolean).map(function(p){
      var bos = p[1] == null || p[1] === '';
      return '<div><dt>' + p[0] + '</dt><dd' + (bos ? ' class="is-empty"' : '') + '>' +
        (bos ? '—' : p[1]) + '</dd></div>';
    }).join('') + '</dl>';
  }
  function tbl(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function sec(baslik, govde, aciklama){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3>' +
      (aciklama ? '<p>' + esc(aciklama) + '</p>' : '') + '</div>' + govde + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function tagOf(t){ return t ? '<span class="tag">' + esc(t) + '</span>' : ''; }
  function personel(k){ return k ? GV.user(k, { sm:true }) : '<span class="u-faint">Zimmetsiz</span>'; }
  function tedarikciLink(kodu, metin){
    if(!kodu) return '<span class="u-faint">—</span>';
    return '<a href="app-tedarikci-detay.html?id=' + kodu + '">' + esc(metin || kodu) + '</a>';
  }

  /* =====================================================================
     CANONICAL DOĞRULAMA — demirbaş kartı ↔ zimmet kaydı
     ===================================================================== */
  var dogrulama = [];
  if(a.durum === 'Zimmetli' && !aktifZimmet){
    dogrulama.push({ tone:'warn', icon:'i-alert', title:'Zimmetli demirbaşın tutanağı yok',
      text:'Kart durumu “Zimmetli” ve ' + (a.zimmetli ? DB.empName(a.zimmetli) : 'bir personel') +
           ' üzerinde görünüyor, ama zimmet kayıtlarında (DB.assignments) bu demirbaş için aktif tutanak yok. ' +
           'Zimmet modülünden tutanak oluşturulmalı.' });
  }
  if(aktifZimmet && a.zimmetli && aktifZimmet.personel !== a.zimmetli){
    dogrulama.push({ tone:'danger', icon:'i-alert', title:'Zimmetli personel eşleşmiyor',
      text:'Demirbaş kartında ' + DB.empName(a.zimmetli) + ', aktif tutanakta (' + aktifZimmet.kod + ') ' +
           DB.empName(aktifZimmet.personel) + ' yazılı. İki kayıt aynı personeli göstermelidir.' });
  }
  if(aktifZimmet && a.zimmetTarihi && aktifZimmet.teslimTarihi !== a.zimmetTarihi){
    dogrulama.push({ tone:'warn', icon:'i-alert', title:'Zimmet tarihi eşleşmiyor',
      text:'Kartta ' + F.date(a.zimmetTarihi) + ', tutanakta ' + F.date(aktifZimmet.teslimTarihi) + ' yazılı.' });
  }
  if(a.durum !== 'Zimmetli' && aktifZimmet){
    dogrulama.push({ tone:'warn', icon:'i-alert', title:'Kapatılmamış zimmet tutanağı',
      text:'Demirbaş durumu “' + a.durum + '” ama ' + aktifZimmet.kod + ' tutanağı hâlâ “Aktif”. ' +
           'İade alındıysa tutanak da kapatılmalıdır.' });
  }
  var imzaBekleyen = zimmetler.filter(function(z){ return z.personelOnay === 'Bekliyor'; });
  var dogrulamaHtml = dogrulama.map(function(n){ return GV.notice(n); }).join('');

  /* =====================================================================
     SAYFA BAŞLIĞI — aksiyonların hepsi gerçekten çalışır
     ===================================================================== */
  var phActions = [
    { label:'Demirbaş listesi', icon:'i-package', href:'app-demirbas.html' },
    { label:'Zimmetler', icon:'i-clipboard-check', href:'app-zimmet.html' }
  ];
  if(canDuzenle && a.aktif !== false){
    if(a.durum === 'Zimmetli') phActions.push({ label:'İade Al', icon:'i-refresh', cls:'btn-acc', run:function(){ iadeAkisi(); } });
    else phActions.push({ label:'Zimmetle', icon:'i-user-check', cls:'btn-acc', run:function(){ zimmetModal(); } });
  }
  GV.pageHead({
    eyebrow:'Demirbaş & Filo', title:'Demirbaş Detayı',
    sub:kod + ' · ' + ad + ' · ' + a.kategori,
    actions:phActions });

  /* =====================================================================
     KAYIT BAŞLIĞI
     ===================================================================== */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + esc(kod) + '</span>' +
        GV.badge(a.durum) + tagOf(a.kategori) + tagOf(a.altKategori) +
        (a.aktif === false ? '<span class="tag">Pasif kayıt</span>' : '') +
        (a.arsiv ? '<span class="tag">Arşiv</span>' : '') +
        (garantiBitti ? '<span class="badge is-danger">' + esc(sureAd) + ' ' + Math.abs(garantiGun) + ' gün önce doldu</span>' : '') + '</div>' +
      '<h1>' + esc(ad) + '</h1>' +
      '<div class="gv-rec-meta">' +
        '<span>' + ico('i-package','ic-sm') + esc(a.ozellik || a.kategori) + '</span>' +
        '<span>' + ico('i-user-check','ic-sm') + (a.zimmetli ? esc(DB.empName(a.zimmetli)) : 'Zimmetsiz') + '</span>' +
        '<span>' + ico('i-users','ic-sm') + esc(DB.depName(a.dep)) + '</span>' +
        '<span>' + ico('i-home','ic-sm') + esc(a.lokasyon) + '</span>' +
        '<span>' + ico('i-key','ic-sm') + 'Seri ' + esc(a.seri) + '</span>' +
        '<span>' + ico('i-shield','ic-sm') + esc(sureAd) + ' bitişi ' + F.date(a.garantiBit) + '</span>' +
      '</div>' +
    '</div></div>';

  /* =====================================================================
     SEKMELER
     ===================================================================== */
  var tabs = [
    { key:'genel',     lbl:'Genel',                ic:'i-info' },
    { key:'zimmet',    lbl:'Zimmet Geçmişi',       ic:'i-user-check',      cnt:zimmetler.length },
    { key:'garanti',   lbl:'Garanti ve Lisans',    ic:'i-shield' },
    { key:'satinalma', lbl:'Satın Alma',           ic:'i-cart' },
    { key:'bakim',     lbl:'Bakım ve Onarım',      ic:'i-wrench',          cnt:bakimlar.length },
    { key:'aktivite',  lbl:'Aktivite Geçmişi',     ic:'i-activity',        cnt:acts.length }
  ];
  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* =====================================================================
     1. GENEL — DB.assets alanlarının TAMAMI
     ===================================================================== */
  var pGenel = (dogrulamaHtml ? '<div class="gc-body u-col">' + dogrulamaHtml + '</div>' : '') +
    '<div class="gc-body">' +
    sec('Demirbaş Kimliği', dl([
      ['Demirbaş kodu', '<b class="u-num">' + esc(kod) + '</b>'],
      ['Kategori', tagOf(a.kategori)],
      ['Alt kategori', a.altKategori ? tagOf(a.altKategori) : null],
      ['Marka', esc(a.marka)],
      ['Model', esc(a.model)],
      ['Teknik özellik', esc(a.ozellik)],
      ['Seri numarası', '<span class="u-num">' + esc(a.seri) + '</span>'],
      ['Barkod / envanter etiketi', '<span class="u-num">' + esc(a.barkod) + '</span>'],
      ['Durum', GV.badge(a.durum)],
      ['Kayıt durumu', a.aktif === false
        ? '<span class="tag">Pasif / arşivlendi</span>'
        : '<span class="badge is-ok no-dot">Aktif kayıt</span>']
    ])) +

    sec('Satın Alma ve Tedarik', dl([
      ['Satın alma tarihi', a.alisTarihi ? F.date(a.alisTarihi) : null],
      ['Satın alma tutarı <span class="u-faint">(KDV hariç)</span>', paraAlis()],
      ['Demirbaş yaşı', yasYil == null ? null :
        '<b class="u-num">' + F.num(yasYil, 1) + ' yıl</b> <span class="cell-sub">' + F.num(yasGun) + ' gün</span>'],
      ['Tedarikçi', tedarikci
        ? tedarikciLink(tedarikci.kod, tedarikci.unvan) + ' <span class="cell-sub">' + esc(tedarikci.kod + ' · ' + tedarikci.kategori) + '</span>'
        : (a.tedarikci ? tedarikciLink(a.tedarikci) : null)],
      ['Tedarikçi genel puanı <span class="u-faint">(sipariş geçmişi)</span>',
        tedarikci ? '<b class="u-num">' + F.num(tedarikci.puan, 1) + '</b> / 5' : null],
      ['Tedarikçi ödeme vadesi', tedarikci ? esc(tedarikci.odemeVadesi) : null],
      ['Bağlı sipariş / talep', siparisBagiVar
        ? (siparis ? esc(siparis.kod) : '') + (talep ? ' · ' + esc(talep.kod) : '')
        : '<span class="u-faint">Demirbaş kaydında sipariş/talep bağı tutulmuyor</span>']
    ])) +

    sec(sureAd + ' Bilgileri', dl([
      [(lisansMi ? 'Lisans başlangıcı' : 'Garanti başlangıcı'), a.garantiBas ? F.date(a.garantiBas) : null],
      [(lisansMi ? 'Lisans bitişi' : 'Garanti bitişi'),
        a.garantiBit ? GV.dateCell(a.garantiBit, { done:garantiBitti }) + ' ' + kalanBadge(a.garantiBit) : null],
      [(lisansMi ? 'Lisans süresi' : 'Garanti süresi'),
        sureToplam != null ? '<b class="u-num">' + F.num(sureToplam) + '</b> gün' : null],
      ['Süre ilerlemesi', sureOran != null
        ? GV.progress(sureOran, { tone:garantiBitti ? 'danger' : null }) : null],
      (lisansMi ? ['Lisans kapsamı <span class="u-faint">(özellik alanından)</span>', esc(a.ozellik)] : null)
    ])) +

    sec('Konum ve Sorumluluk', dl([
      ['Lokasyon', esc(a.lokasyon)],
      ['Departman', esc(DB.depName(a.dep))],
      ['Zimmetli personel', a.zimmetli ? GV.user(a.zimmetli, { sm:true }) : null],
      ['Zimmet tarihi', a.zimmetTarihi ? F.date(a.zimmetTarihi) : null],
      ['Son iade tarihi', a.iadeTarihi ? F.date(a.iadeTarihi) : null],
      ['Aktif zimmet tutanağı', aktifZimmet
        ? '<a href="app-zimmet.html">' + esc(aktifZimmet.kod) + '</a> <span class="cell-sub">' +
          esc(aktifZimmet.tutanak || '') + '</span>'
        : null]
    ])) +
    '</div>';

  /* =====================================================================
     2. ZİMMET GEÇMİŞİ — DB.assignments[].demirbas bağı
     ===================================================================== */
  var zimmetUyari = '';
  if(imzaBekleyen.length){
    zimmetUyari += '<div class="gc-body">' + GV.notice({
      tone:'warn', icon:'i-stamp', title:'İmza bekleyen tutanak var',
      text:imzaBekleyen.map(function(z){ return z.kod + ' (' + DB.empName(z.personel) + ')'; }).join(' · ') +
           ' — personel dijital onayı alınmadan zimmet hukuken tamamlanmış sayılmaz.',
      actions:[{ label:'Zimmet listesi', href:'app-zimmet.html' }] }) + '</div>';
  }

  var pZimmet = zimmetUyari +
    '<div class="gc-body">' +
    sec('Güncel Zimmet', aktifZimmet
      ? dl([
          ['Tutanak no', '<b class="u-num">' + esc(aktifZimmet.kod) + '</b>'],
          ['Personel', GV.user(aktifZimmet.personel, { sm:true }) +
            ' <span class="cell-sub">' + esc((DB.emp(aktifZimmet.personel) || {}).depAd || '') + '</span>'],
          ['Teslim tarihi', F.date(aktifZimmet.teslimTarihi) +
            ' <span class="cell-sub">' + Math.max(0, -F.days(aktifZimmet.teslimTarihi)) + ' gündür kullanımda</span>'],
          ['Personel onayı', GV.badge(aktifZimmet.personelOnay) +
            (aktifZimmet.onayTarihi ? ' <span class="cell-sub">' + F.date(aktifZimmet.onayTarihi) + '</span>' : '')],
          ['Tutanak dosyası', aktifZimmet.tutanak
            ? '<a data-wip="Zimmet tutanağı">' + ico('i-file','ic-sm') + ' ' + esc(aktifZimmet.tutanak) + '</a>' : null],
          ['Hasar / eksik notu', aktifZimmet.hasar ? '<span class="badge is-danger">' + esc(aktifZimmet.hasar) + '</span>' : null],
          ['Zimmet durumu', GV.badge(aktifZimmet.durum)]
        ])
      : GV.empty({ icon:'i-user-check', title:'Aktif zimmet yok',

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-truck') + 'Tedarik</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Tedarikçi', tedarikci ? tedarikciLink(tedarikci.kod, tedarikci.unvan)
                              : (a.tedarikci ? tedarikciLink(a.tedarikci) : '<span class="u-faint">—</span>')],
      ['Tedarikçi genel puanı', tedarikci ? '<b class="u-num">' + F.num(tedarikci.puan, 1) + '</b> / 5' : '<span class="u-faint">—</span>'],
      ['Ödeme vadesi', tedarikci ? esc(tedarikci.odemeVadesi) : '<span class="u-faint">—</span>'],
      ['Tedarikçi siparişi', tedSiparisleri.length
        ? '<b>' + tedSiparisleri.length + '</b> kayıt <span class="cell-sub">demirbaş bağı değil</span>'
        : '<span class="u-faint">Kayıt yok</span>'],
      ['Zimmet tutanağı', '<b>' + zimmetler.length + '</b>' +
        (imzaBekleyen.length ? ' <span class="cell-sub">' + imzaBekleyen.length + ' imza bekliyor</span>' : '')]
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3))
      : '<p class="u-sm u-faint">Bu demirbaş kartında henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =====================================================================
     ZİMMETLEME VE İADE — gerçekten çalışır, yalnız düzenleme yetkisiyle
     ===================================================================== */
  function zimmetModal(){
    var uygun = (DB.employees || []).filter(function(e){ return e.aktif; });
    GV.modal({
      title:'Demirbaşı Zimmetle', text:ad + ' · ' + kod, icon:'i-user-check', size:'sm',
      body:'<div class="gv-fields">' +
        '<div class="field f-col-12"><label for="zPers">Personel</label><select id="zPers">' +
          uygun.map(function(e){ return '<option value="' + e.kod + '">' + esc(e.ad + ' — ' + e.depAd) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="field f-col-12"><label for="zTar">Teslim tarihi</label>' +
          '<input type="date" class="inp" id="zTar" value="' + DB.today + '" max="' + DB.today + '"></div>' +
        '<div class="field f-col-12"><label class="f-check"><input type="checkbox" id="zTut" checked>' +
          '<span>Teslim tutanağı oluştur ve personel dijital onayına gönder</span></label></div>' +
        '</div>',
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Zimmetle', cls:'btn-acc', onClick:function(close, el){
            var p = el.querySelector('#zPers').value;
            var t = el.querySelector('#zTar').value;
            if(!p){ GV.toast('Personel seçilmelidir', 'danger'); return false; }
            if(!t){ GV.toast('Teslim tarihi zorunludur', 'danger'); return false; }
            if(F.days(t) > 0){ GV.toast('Teslim tarihi ileri tarihli olamaz', 'danger'); return false; }
            var imza = el.querySelector('#zTut').checked;
            var eski = a.durum;
            var yeni = {
              kod:'ZMT-' + t.slice(0, 4) + '-' + String(DB.assignments.length + 1).padStart(3, '0'),
              demirbas:kod, personel:p, teslimTarihi:t, iadeTarihi:null, durum:'Aktif',
              tutanak:'zimmet-' + kod.toLowerCase() + '.pdf',
              personelOnay:imza ? 'Bekliyor' : 'Onaylandı', onayTarihi:imza ? null : t,
              hasar:null, aktif:true
            };
            DB.assignments.unshift(yeni);
            a.durum = 'Zimmetli'; a.zimmetli = p; a.zimmetTarihi = t; a.iadeTarihi = null;
            DB.activities.unshift({ kayit:kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0, 5),
              kisi:GV.session.emp, metin:'Demirbaş zimmetlendi — ' + DB.empName(p) + ' (' + yeni.kod + ')',
              eski:eski, yeni:'Zimmetli', tone:'info', icon:'i-user-check' });
            GV.toast(kod + ' → ' + DB.empName(p) + ' zimmetlendi', 'ok');
            setTimeout(function(){ GV.refresh(); }, 700);
          } }
      ]
    });
  }

  function iadeAkisi(){
    GV.confirm({
      title:'Zimmet iadesi',
      text:(a.zimmetli ? DB.empName(a.zimmetli) : 'Personel') + ' üzerindeki ' + kod +
           ' iade alınacak, tutanak kapatılacak ve demirbaş depoya girecek.',
      okLabel:'İade al'
    }).then(function(ok){
      if(!ok) return;
      var eski = a.durum, kisi = a.zimmetli;
      if(aktifZimmet){ aktifZimmet.durum = 'İade edildi'; aktifZimmet.iadeTarihi = DB.today; }
      a.durum = 'Depoda'; a.zimmetli = null; a.zimmetTarihi = null; a.iadeTarihi = DB.today;
      a.lokasyon = a.lokasyon.indexOf('Depo') === 0 ? a.lokasyon : 'Depo · Ankara';
      DB.activities.unshift({ kayit:kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0, 5),
        kisi:GV.session.emp, metin:'Zimmet iade alındı' + (kisi ? ' — ' + DB.empName(kisi) : '') +
          (aktifZimmet ? ' (' + aktifZimmet.kod + ')' : ''),
        eski:eski, yeni:'Depoda', tone:'ok', icon:'i-refresh' });
      GV.toast(kod + ' iade alındı, depoya girdi', 'ok');
      setTimeout(function(){ GV.refresh(); }, 700);
    });
  }
});
</script>
</body>
</html>
