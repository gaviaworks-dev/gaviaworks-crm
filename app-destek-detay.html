<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Destek Talebi Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="destek" data-screen="destek">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');
  var canEkle   = GV.perm.can('ekle');

  /* =================================================================
     REVİZE 13 — MÜŞTERİ OTURUMU VE SAHİPLİK
     `GV.session` iki aileden gelir: personel (`emp:'EMP-*'`, `musteri:null`)
     ve müşteri portalı (`emp:null`, `musteri:'MUS-*'`). Bu ekran `?id=` değerini
     HAM okuyor ve kaydı KİMİN açtığını sormuyordu: müşteri oturumuyla giren
     biri adres çubuğuna başka firmanın talep kodunu yazınca o talebin
     başlığını, açıklamasını, çözüm notlarını ve tüm aktivite geçmişini
     (iç personel notları dahil) okuyabiliyordu. Kapsam artık listede değil,
     KAYDIN KENDİSİNDE sorulur — detay ekranı liste süzgecinin arkasından
     dolaşılabilen bir kapıydı.
     ================================================================= */
  var musOturum = (GV.session && GV.session.musteri) || null;  /* 'MUS-*' | null */
  var icBlok    = !musOturum;   /* iç üretim / iç ölçüm blokları basılsın mı */

  function benim(x){ return x.musteri === musOturum; }

  var qId = new URLSearchParams(location.search).get('id');
  /* `?id=` verilmediğinde ekran bir varsayılana düşer. Personel oturumunda
     bugünkü davranış (koleksiyonun ilk kaydı) BİREBİR korunur; müşteri
     oturumunda varsayılan da kapsamlı olmalı — aksi hâlde portal kendiliğinden
     yabancı bir kayda iniyordu (ölçüldü: MUS-2024-001 oturumu `?id=`siz
     açıldığında DST-2026-118'e, Trakya Otomotiv'in talebine düşüyor). */
  var varsayilan = musOturum ? (DB.tickets.filter(benim)[0] || null)
                             : (DB.tickets[0] || null);
  var id = qId || (varsayilan ? varsayilan.kod : undefined);
  var t  = DB.tickets.filter(function(x){ return x.kod === id; })[0];

  /* ---- Müşteri oturumunda hiç talep yok: kayıt uydurmak yerine dürüst boş durum ---- */
  if(musOturum && !qId && !varsayilan){
    GV.pageHead({ eyebrow:'Destek ve Bakım', title:'Destek Talebi Detayı', sub:'Kayıtlı talep yok',
      actions:[{ label:'Destek taleplerim', icon:'i-support', href:'app-destek.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-support', title:'Adınıza kayıtlı destek talebi yok',
      desc:GV.session.musteriAd + ' adına açılmış bir destek talebi bulunmuyor. ' +
           'Talep açıldığında kaydın detayı bu ekranda görünür.',
      action:'<a class="btn btn-acc" href="app-destek.html">Destek taleplerime git</a>' }) + '</div>';
    return;
  }

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!t){
    GV.pageHead({ eyebrow:'Destek ve Bakım', title:'Destek Talebi Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Destek listesi', icon:'i-support', href:'app-destek.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Destek talebi bulunamadı',
      desc:'“' + (id || '') + '” numaralı destek talebi sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-destek.html">Destek listesine dön</a>' }) + '</div>';
    return;
  }

  /* ---- SAHİPLİK KAPISI — kaydın HİÇBİR alanı basılmadan önce ----------
     Kayıt var ama müşteri oturumunun firmasına ait değil. Ekran buradan sonra
     tek bir alanını bile basmaz; kırıntı da bırakmaz: kırıntı, sayfa başlığı ve
     hata metni de birer sızıntı yüzeyidir. Ekranda yalnız KULLANICININ KENDİ
     yazdığı kod geçer — başlık, müşteri adı, durum ve SLA geçmez. Sızıntı sessiz
     de kapanmaz: kullanıcı neden göremediğini okur (shell'in 403 dili, kilit
     ikonu ve listeye dönüş aksiyonu). */
  if(musOturum && !benim(t)){
    document.title = 'Yetkisiz erişim — GaviaWorks CRM';
    GV.pageHead({ eyebrow:'Destek ve Bakım', title:'Destek Talebi Detayı', sub:'Yetkisiz erişim',
      actions:[{ label:'Destek taleplerim', icon:'i-support', href:'app-destek.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-lock', title:'Bu destek talebini görüntüleme yetkiniz yok',
      desc:'“' + id + '” kodlu talep ' + GV.session.musteriAd + ' kayıtlarına ait değil. ' +
           'Müşteri portalında yalnız kendi firmanızın destek talepleri açılabilir; ' +
           'başka bir firmanın kaydı bağlantıyla da açılamaz. Bu kaydın size ait ' +
           'olması gerekiyorsa destek ekibinize bildirin.',
      action:'<a class="btn btn-acc" href="app-destek.html">Destek taleplerime dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(t.kod);
  document.title = t.kod + ' — Destek Talebi — GaviaWorks CRM';

  /* =================================================================
     SÜRE BİÇİMLENDİRME — SLA hedefleri dakika cinsinden tutulur
     (GV.fmt.hours saat alır; dakika tabanı bu ekranda da gerekiyor)
     ================================================================= */
  function sure(dk){
    if(dk == null) return '—';
    var m = Math.abs(Math.round(dk));
    var g = Math.floor(m / 1440), s = Math.floor((m % 1440) / 60), d = m % 60;
    if(g) return g + ' gün' + (s ? ' ' + s + ' sa' : '');
    if(s) return s + ' sa' + (d ? ' ' + d + ' dk' : '');
    return d + ' dk';
  }

  /* Referans an: DB.today gününün başlangıcı (mock veri sabit tarih ekseni) */
  var SIMDI = new Date(DB.today + 'T00:00:00');
  function gecenDk(iso){
    if(!iso) return null;
    return Math.round((SIMDI - new Date(String(iso).slice(0,16) + ':00')) / 60000);
  }
  /* Açılış + geçen dakika → okunabilir an (kapanış zamanı veride tutulmuyor) */
  function anEkle(iso, dk){
    if(!iso || dk == null) return null;
    var d = new Date(String(iso).slice(0,16) + ':00');
    d.setMinutes(d.getMinutes() + dk);
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  var acikTalep = GV.destek.acik(t);   /* REVİZE 09 — tek tanım domain.js'te */

  /* =================================================================
     BEKLEME ÇİPİ (ADR-19) — bekleme bir DURUM DEĞİL, ikinci eksendir:
     talep “Devam ediyor” olmayı sürdürür, yalnız bir şeyi bekler. Eskiden
     bunun için `Müşteri bekleniyor` diye ayrı bir durum vardı ve talep
     ilerlemeyi bırakmış görünüyordu. Rozet DURUMU söyler, çip NEYİ
     BEKLEDİĞİNİ — dil görev ekseniyle birebir aynı (`app-gorev-detay.html`).
     ================================================================= */
  var beklemeCip = t.beklemeNedeni
    ? '<span class="tag" title="Bekleme nedeni">' + ico('i-clock','ic-sm') +
      esc(t.beklemeNedeni) + ' bekleniyor</span>'
    : '';

  /* =================================================================
     İŞ AKIŞI — merkezî geçiş motoru (şartname §6.1 · DB.transitions.ticket)
     Ekran durum YAZMAZ: yapılabilir adımları `GV.flow.adimlar` verir, geçişi
     `GV.flow.gec` uygular, aktivite kaydını ve bakım kotası düşümünü de o
     yapar. Eskiden bu ekranda hiç durum aksiyonu yoktu; talep kapatma yalnız
     listeden, ara adımlar hiçbir yerden yürütülemiyordu.
     ================================================================= */
  var adimlar   = GV.flow ? GV.flow.adimlar('ticket', t.kod) : [];
  var akisKural = GV.flow ? GV.flow.kural('ticket', t.durum) : null;

  /* Hedef durum başına ikon — buton yazısı geçiş tablosundaki `etiket`ten gelir */
  var ADIM_IKON = { 'Triage':'i-filter', 'Atandı':'i-user-plus', 'Devam ediyor':'i-play',
                    'Çözüldü':'i-check', 'Müşteri Onayı':'i-stamp', 'Kapandı':'i-check-circle',
                    'Yeniden Açıldı':'i-refresh' };
  /* Geçiş tablosunun zorunlu alan anahtarı → kullanıcının gördüğü etiket */
  var ALAN_AD = { sorumlu:'Sorumlu', oncelik:'Öncelik', cozumAciklama:'Çözüm açıklaması' };
  function alanAd(k){ return ALAN_AD[k] || k; }
  var ILISKI_AD = { sorumlu:'talebin sorumlusu', veren:'talebi açan', onaylayan:'onaylayan',
                    kontrolEden:'kontrol eden' };
  function yetkiAd(k){ return ILISKI_AD[k] || DB.roleName(k); }
  function yetkiMetin(roller){ return (roller || []).map(yetkiAd).join(', '); }

  /* Müşteri oturumunda yalnız YAPILABİLİR adım basılır: iç iş akışının
     devre dışı düğmelerini portal kullanıcısına göstermek iç süreci sızdırır.
     Personel oturumunda `izin:false` adım SESSİZCE ÖLÜ bırakılmaz (L-23):
     devre dışı basılır ve kimin yapabileceği `title`de yazar. */
  var gorunurAdim = icBlok ? adimlar : adimlar.filter(function(a){ return a.izin; });
  var adimBtn = gorunurAdim.map(function(a){
    var i = adimlar.indexOf(a);
    return '<button type="button" class="btn ' + a.tone + '" data-adim="' + i + '"' +
      (a.izin ? '' : ' disabled title="Bu işlemi yalnız şunlar yapabilir: ' +
        esc(yetkiMetin(akisKural && akisKural.yetki)) + '"') +
      '>' + ico(ADIM_IKON[a.hedef] || 'i-refresh') + ' ' + esc(a.etiket) + '</button>';
  }).join('');

  /* =================================================================
     SLA — components.md §9: iki eksenin KÖTÜSÜ
     tüketim = geçen / hedef · ≥1 İhlal edildi · ≥0,75 Risk altında · altı Zamanında
     ================================================================= */
  function politika(x){
    var l = DB.slaPolicies;
    for(var i = 0; i < l.length; i++){
      var p = l[i];
      if(p.kategori === x.kategori && (p.oncelik === x.oncelik || p.oncelik === 'Tümü')) return p;
    }
    return null;
  }
  function seviye(o){ return o >= 1 ? 'İhlal edildi' : o >= 0.75 ? 'Risk altında' : 'Zamanında'; }
  function tonu(d){ return d === 'İhlal edildi' ? 'danger' : d === 'Risk altında' ? 'warn' : 'ok'; }

  var P = politika(t);
  var gecenAcilis = gecenDk(t.acilis);

  /* ilk yanıt ekseni — yanıt verilmediyse açılıştan bu yana geçen süre sayar */
  var yanitHedef = P ? P.ilkYanit : null;
  var yanitGecen = t.mudahaleSuresi != null ? t.mudahaleSuresi : gecenAcilis;
  var yanitOran  = yanitHedef ? yanitGecen / yanitHedef : 0;
  var yanitKalan = yanitHedef != null ? yanitHedef - yanitGecen : null;
  var yanitDurum = t.mudahaleSuresi == null
    ? 'Yanıt bekliyor'
    : (yanitHedef != null && t.mudahaleSuresi > yanitHedef ? 'Aşıldı' : 'Tutturuldu');

  /* çözüm ekseni — çözülmediyse açılıştan bu yana geçen süre sayar */
  var cozumHedef = P ? P.cozum : null;
  var cozumGecen = t.cozumSuresi != null ? t.cozumSuresi : gecenAcilis;
  var cozumOran  = cozumHedef ? cozumGecen / cozumHedef : 0;
  var cozumKalan = cozumHedef != null ? cozumHedef - cozumGecen : null;
  var cozumDurum = t.cozumSuresi == null
    ? 'Çözüm bekliyor'
    : (cozumHedef != null && t.cozumSuresi > cozumHedef ? 'Aşıldı' : 'Tutturuldu');

  /* kötü olan eksen genel durumu belirler */
  var belirleyiciOran = Math.max(yanitOran, cozumOran);
  var eksen    = yanitOran > cozumOran ? 'ilk yanıt' : 'çözüm';
  var slaHesap = seviye(belirleyiciOran);
  var slaYuzde = P ? Math.round(belirleyiciOran * 100) : null;
  var yanitYuzde = yanitHedef ? Math.round(yanitOran * 100) : null;
  var cozumYuzde = cozumHedef ? Math.round(cozumOran * 100) : null;
  var cozumAni   = anEkle(t.acilis, t.cozumSuresi);

  /* =================================================================
     İLİŞKİLİ KAYITLAR — hepsi veride yazılı bağdan
     ================================================================= */
  var musteri = t.musteri ? DB.customers.filter(function(c){ return c.kod === t.musteri; })[0] : null;
  var proje   = t.proje ? DB.proj(t.proje) : null;
  var yetkili = musteri
    ? DB.contact(t.acan)
    : null;

  /* Bakım paketi — kota aritmetiği: kullanilan + kalan = aylikSaat × dönem ayı.
     Paketin `kalan`ı talebin `kalanDestek`iyle birebir aynıdır (components.md §9). */
  var musteriPaketleri = DB.supportPackages.filter(function(p){ return p.musteri === t.musteri; });
  var paket = musteriPaketleri.filter(function(p){ return p.kalan === t.kalanDestek; })[0] ||
              musteriPaketleri.filter(function(p){ return p.durum === 'Aktif'; })[0] ||
              musteriPaketleri[0] || null;
  var paketSozlesme = (paket && paket.sozlesme)
    ? DB.contracts.filter(function(s){ return s.kod === paket.sozlesme; })[0] || null : null;
  var paketToplamKota = paket ? paket.kullanilan + paket.kalan : null;
  var paketDonemAy    = (paket && paket.aylikSaat) ? Math.round(paketToplamKota / paket.aylikSaat) : null;
  var paketYuzde      = paketToplamKota ? Math.round(paket.kullanilan / paketToplamKota * 100) : null;

  /* Memnuniyet anketi — tur:'Destek talebi' ve ilgili === talep kodu */
  var anket = DB.surveys.filter(function(a){
    return a.tur === 'Destek talebi' && a.ilgili === t.kod; })[0] || null;

  var acts = DB.activities.filter(function(a){ return a.kayit === t.kod; });

  /* =================================================================
     DÖNÜŞÜMLER — bağ veride YAZILI (VB-05, ders L-13). Doğan kaydın
     `destek` alanı talebin kodunu gösterir; metin/etiket eşleştirmesi
     bağ yerine geçmez ve artık kullanılmıyor.
       görev             → DB.tasks[].destek
       hata              → DB.bugs[].destek
       değişiklik talebi → DB.changeRequests[].destek
     `DB.changeRequests[].talep` alanı BAŞKA bir eksendir (talebi açan
     taraf: 'Müşteri' | 'İç ekip') — bağ olarak okunmaz.
     ================================================================= */
  function bagli(kayitlar){
    return kayitlar.filter(function(x){ return x.destek === t.kod; });
  }
  function donusumleriTara(){
    return {
      gorevler: bagli(DB.tasks),
      hatalar:  bagli(DB.bugs),
      degisim:  bagli(DB.changeRequests),
      /* REVİZE 10 — fırsat dönüşümü. Bağ ADAY kaydında durur
         (`DB.leads[].destek`), ticket'ta ayna alan doğmaz (§9d). */
      firsatlar:bagli(DB.leads)
    };
  }

  /* =================================================================
     YARDIMCILAR
     ================================================================= */
  function tbl(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3></div>' + govde + '</div>';
  }
  function para(v){
    if(!canFinans) return '<span class="cell-mask">••••••</span>';
    return '<span class="cell-money">' + F.money(v) + '</span>';
  }
  /* Müşteri kartı ekranı müşteri rolüne KAPALI (shell `SEC_BY_ROLE.musteri`
     listesinde `musteri` bölümü yok) — portalda 403'e giden bağ bırakılmaz,
     ad düz metne iner. Personel oturumunda bağ aynen durur. */
  function musLink(metin){
    return icBlok ? '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + metin + '</a>' : metin;
  }
  function saat(v){ return '<b class="u-num">' + F.hours(v) + '</b>'; }
  function kalanMetin(dk){
    if(dk == null) return '<span class="u-faint">—</span>';
    if(dk >= 0) return '<b class="u-num u-ok">' + sure(dk) + ' kaldı</b>';
    return '<b class="u-num u-danger">' + sure(-dk) + ' aşım</b>';
  }
  /* NPS grubu — components.md §9: 9-10 destekleyici · 7-8 nötr · 0-6 kötüleyici.
     Bu üç değer GV.badge sözlüğünde yok, açık ton geçilir. */
  function npsGrup(v){ return v == null ? null : v >= 9 ? 'Destekleyici' : v >= 7 ? 'Nötr' : 'Kötüleyici'; }
  function npsBadge(v){
    if(v == null) return null;
    return GV.badge(npsGrup(v), v >= 9 ? 'is-ok' : v >= 7 ? 'is-warn' : 'is-danger');
  }
  function puanBadge(v){
    if(v == null) return null;
    return GV.badge(v + ' / 5', v >= 4 ? 'is-ok' : v >= 3 ? 'is-warn' : 'is-danger');
  }

  /* =================================================================
     GÖREVE DÖNÜŞTÜRME — app-toplanti-karar.html deseni
     ================================================================= */
  var me = GV.session.emp;
  var tabsApi = null;

  /* Yeni kayıt üretilince Dönüşümler sekmesi ve aktivite kartları yerinde tazelenir
     (sayfa yeniden yüklenirse mock veri sıfırlanır, üretilen görev kaybolurdu). */
  function donusumYenile(){
    var panel = document.querySelector('[data-panel="donusum"]');
    if(panel) panel.innerHTML = donusumPaneli();
    var d = donusumleriTara();
    var toplam = d.gorevler.length + d.hatalar.length + d.degisim.length + d.firsatlar.length;
    var tab = document.querySelector('#recTabs [data-tab="donusum"]');
    if(tab){
      var cnt = tab.querySelector('.gv-tab-cnt');
      if(!cnt && toplam){
        cnt = document.createElement('span');
        cnt.className = 'gv-tab-cnt';
        tab.appendChild(cnt);
      }
      if(cnt) cnt.textContent = toplam;
    }
    var yeniActs = DB.activities.filter(function(a){ return a.kayit === t.kod; });
    var aktivitePanel = document.querySelector('[data-panel="aktivite"]');
    if(aktivitePanel && yeniActs.length) aktivitePanel.innerHTML = '<div class="gc-body">' + GV.activity(yeniActs) + '</div>';
    var aktiviteTab = document.querySelector('#recTabs [data-tab="aktivite"]');
    if(aktiviteTab && yeniActs.length){
      var acnt = aktiviteTab.querySelector('.gv-tab-cnt');
      if(!acnt){
        acnt = document.createElement('span');
        acnt.className = 'gv-tab-cnt';
        aktiviteTab.appendChild(acnt);
      }
      acnt.textContent = yeniActs.length;
    }
  }

  function yeniGorevKodu(){
    var max = 0;
    DB.tasks.forEach(function(x){
      var m = /^GRV-2026-(\d+)$/.exec(x.kod || '');
      if(m) max = Math.max(max, parseInt(m[1], 10));
    });
    return 'GRV-2026-' + (max + 1);
  }
  function varsayilanTur(){
    return t.kategori === 'Hata' ? 'Hata' : 'Destek talebi';
  }
  function gorevOlustur(opt){
    var kod = yeniGorevKodu();
    var atanan = opt.sorumlu || t.sorumlu;
    var etki = DB.impacts.indexOf(t.etki) !== -1 ? t.etki : 'Orta';
    DB.tasks.unshift({
      kod:kod,
      baslik:opt.baslik,
      tur:opt.tur,
      proje:t.proje || null, modul:null, sprint:null, musteri:t.musteri || null,
      dep:(DB.emp(atanan) || {}).dep || null,
      olusturan:me, veren:me, sorumlu:atanan, yardimci:[],
      izleyiciler:[t.sorumlu].filter(function(k){ return k && k !== atanan; }),
      kontrolEden:me, onaylayan:me,
      oncelik:opt.oncelik, etki:etki, aciliyet:opt.oncelik === 'Kritik' ? 'Yüksek' : opt.oncelik,
      /* dönüşüm bağı — etiket değil, yazılı alan (VB-05) */
      destek:t.kod,
      durum:'Atandı', baslangic:DB.today, termin:opt.termin, tamamlanma:null,
      tahminiSure:opt.tahminiSure, gercekSure:0, faturalanabilir:0,
      ilerleme:0, revizyon:0, yenidenAcilma:0,
      aciklama:'Destek talebinden üretildi: ' + t.kod + ' · ' + t.baslik +
               ' (' + t.musteriAd + ' · ' + t.kategori + ')',
      amac:'Müşteri destek talebinin kalıcı çözüme bağlanması',
      kabulKriteri:'Çözüm talep sahibine doğrulatıldı ve ' + t.kod + ' destek kaydı kapatıldı',
      beklenenCikti:'Çözüm ve destek kaydına yazılan kapanış notu',
      etiketler:['Destek talebi', t.kod], aktif:true
    });
    DB.activities.unshift({
      kayit:t.kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0,5),
      kisi:GV.session.emp, metin:'Talepten görev üretildi — ' + kod,
      eski:null, yeni:kod, tone:'accent', icon:'i-tasks'
    });
    return kod;
  }
  /* ---- REVİZE 10 — CR ve FIRSAT üreticileri ---------------------------
     Doküman ticket'tan üç akış istiyor: görev · revizyon (CR) · satış fırsatı.
     Görev akışı ÇALIŞIYORDU ve korundu; ikinci bir yol açılmadı, aynı modal
     üç dala ayrıldı. Bağ her zaman DOĞAN kayıtta durur (§9d): `tasks.destek`,
     `changeRequests.destek`, `leads.destek`.

     Ön dolgu yalnız TALEPTE YAZILI olandan gelir. Ticket'ta karşılığı olmayan
     alanlar (CR'nin süre/maliyet etkisi, fırsatın bütçesi ve puanı)
     KULLANICIDAN alınır — tahmin uydurmak ölçüm gibi görünen bir kurgu olurdu
     (L-13 · V-53'ün aynı ilkesi). */
  function yeniKod(dizi, onek){
    var max = 0;
    (dizi || []).forEach(function(x){
      var m = new RegExp('^' + onek + '(\\d+)$').exec(x.kod || '');
      if(m) max = Math.max(max, parseInt(m[1], 10));
    });
    return onek + String(max + 1).padStart(3, '0');
  }

  function crOlustur(opt){
    var kod = yeniKod(DB.changeRequests, 'DGS-2026-');
    DB.changeRequests.unshift({
      kod:kod, proje:opt.proje || null, baslik:opt.baslik,
      talep:'Müşteri', tarih:DB.today,
      etkiSure:opt.etkiSure, etkiMaliyet:opt.etkiMaliyet,
      /* Değişiklik talebi sözlüğü şartnameye hizalandı (ADR): eski
         `Değerlendiriliyor` → `Etki Analizi`. Süre ve maliyet etkisi
         kullanıcıdan alındığı için kayıt doğrudan etki analizinde açılır. */
      durum:'Etki Analizi', kapsamIci:false, karar:null,
      sorumlu:opt.sorumlu || t.sorumlu,
      destek:t.kod, aktif:true
    });
    DB.activities.unshift({
      kayit:t.kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0,5),
      kisi:GV.session.emp, metin:'Talepten revizyon talebi üretildi — ' + kod,
      eski:null, yeni:kod, tone:'accent', icon:'i-edit'
    });
    return kod;
  }

  function firsatOlustur(opt){
    var kod = yeniKod(DB.leads, 'LEAD-2026-');
    var ilkAsama = (DB.pipelineStages || []).slice().sort(function(a, b){
      return (a.sira || 0) - (b.sira || 0); })[0];
    DB.leads.unshift({
      kod:kod,
      firma:musteri ? musteri.unvan : t.musteriAd,
      yetkili:DB.contactName(t.acan),
      tel:yetkili ? yetkili.tel : null, eposta:yetkili ? yetkili.eposta : null,
      sektor:musteri ? musteri.sektor : null,
      buyukluk:musteri ? musteri.buyukluk : null,
      hizmet:opt.hizmet, ozet:opt.ozet,
      talepTarihi:DB.today,
      /* `DB.refTypes`'a REVİZE 10'da eklenen değer — kaynak uydurulmadı,
         fırsat gerçekten destek talebinden doğuyor. */
      kaynak:'Destek talebi', referans:null, yonlendiren:null,
      sorumlu:(musteri && musteri.sorumlu) || t.sorumlu,
      butce:opt.butce, kapanisTahmini:null,
      oncelik:t.oncelik, puan:opt.puan, sicaklik:opt.sicaklik,
      sonIletisim:DB.today, sonrakiAksiyon:'Talep sahibiyle kapsam görüşmesi',
      sonrakiTarih:null,
      asama:ilkAsama ? ilkAsama.key : 'Yeni talep',
      musteri:t.musteri || null, kayipNedeni:null, aktif:true,
      etiketler:['Destek talebi', t.kod],
      notlar:'Destek talebinden üretildi: ' + t.kod + ' · ' + t.baslik,
      destek:t.kod
    });
    DB.activities.unshift({
      kayit:t.kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0,5),
      kisi:GV.session.emp, metin:'Talepten satış fırsatı üretildi — ' + kod,
      eski:null, yeni:kod, tone:'accent', icon:'i-target'
    });
    return kod;
  }

  /* =================================================================

  /* ---- İŞ AKIŞI ADIMLARI — tek mutasyon noktası `GV.flow.gec` -------
     Ekran hedefi kendisi YAZMAZ; motor geçiş tablosunu uygular (hedef geçerli
     mi · yetki · zorunlu alan · kapı) ve aktivite kaydını da o yazar.
     Başarısızlık dürüstçe bildirilir: “kapı” redleri (bakım kotası aşımı,
     ADR-10) uyarı tonuyla, kuralın kendi metniyle basılır. */
  function hataMetni(res){
    if(!res) return 'Geçiş yapılamadı';
    if(res.why === 'yetki')   return 'Bu geçişi yalnız şunlar yapabilir: ' + yetkiMetin(res.roller);
    if(res.why === 'zorunlu') return 'Şu alanlar dolu olmadan geçilemez: ' + res.eksik.map(alanAd).join(', ');
    if(res.why === 'kapi')    return res.mesaj;
    if(res.why === 'gerekce') return res.mesaj || 'Bu işlem için neden kodu ve açıklama zorunludur';
    return res.mesaj || res.why;
  }

  function uygula(hedef, ek, opts){
    var r = GV.flow.gec('ticket', t.kod, hedef, ek, opts || {});
    if(!r || !r.ok){
      GV.toast(hataMetni(r), (r && r.why === 'kapi') ? 'warn' : 'danger');
      return false;
    }
    var kimler = (r.bildirim || []).map(yetkiAd);
    GV.toast(t.kod + ' “' + r.yeni + '” oldu' +
      (kimler.length ? ' · bildirim: ' + kimler.join(', ') : ''), 'ok');
    setTimeout(function(){ GV.refresh(); }, 700);
    return true;
  }

  /* Eksik zorunlu alanı ve/veya neden kodunu SORAN modal. Kullanıcıyı “önce
     kaydı düzenle” diye başka ekrana yollamak yerine tam o alan burada
     istenir; değerler `ek`, neden kodu `opts.neden` olarak motora geçer. */
  var ADIM_KISI = DB.employees.filter(function(e){ return e.aktif !== false; });
  function alanGirdi(alan){
    var id = 'ek_' + alan, lbl = alanAd(alan);
    if(alan === 'sorumlu'){
      return '<div class="field f-col-12"><label for="' + id + '">' + lbl + '</label><select id="' + id + '">' +
        '<option value="">Seçin</option>' +
        ADIM_KISI.map(function(e){
          return '<option value="' + esc(e.kod) + '"' + (e.kod === t.sorumlu ? ' selected' : '') + '>' +
                 esc(e.ad + ' · ' + e.pozisyon) + '</option>'; }).join('') +
        '</select></div>';
    }
    if(alan === 'oncelik'){
      return '<div class="field f-col-12"><label for="' + id + '">' + lbl + '</label><select id="' + id + '">' +
        '<option value="">Seçin</option>' +
        DB.priorities.map(function(o){
          return '<option value="' + esc(o) + '"' + (o === t.oncelik ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select></div>';
    }
    if(alan === 'cozumAciklama'){
      /* Çözüldü adımının zorunlu alanı. Kullanıcıyı “önce kaydı düzenle” diye
         forma yollamak yerine metin tam burada istenir; motor onu kayda yazar. */
      return '<div class="field f-col-12"><label for="' + id + '">' + lbl + '</label>' +
        '<textarea id="' + id + '" rows="3" placeholder="Sorun nasıl çözüldü?">' +
        esc(t.cozumAciklama || '') + '</textarea></div>';
    }
    return '<div class="field f-col-12"><label for="' + id + '">' + lbl + '</label>' +
      '<input type="text" class="inp" id="' + id + '" value="' + esc(t[alan] == null ? '' : t[alan]) + '"></div>';
  }

  function nedenGirdi(){
    return '<div class="field f-col-12"><label for="adimNeden">Neden kodu<span class="req">*</span></label>' +
      '<select id="adimNeden"><option value="">Neden seçin</option>' +
      (DB.reasonCodes || []).map(function(r){
        return '<option value="' + esc(r.kod) + '">' + esc(r.ad) + '</option>'; }).join('') +
      '</select><div class="f-hint">Şartname [2.0.6] gerekçeyi neden KODU + açıklama olarak ister; ' +
      'serbest metin tek başına raporlanamaz.</div></div>';
  }

  function adimModal(a){
    var gerekceVar = !!a.gerekce;
    var eksik = a.eksik || [];
    GV.modal({
      title:a.etiket, text:t.kod + ' · “' + t.durum + '” → “' + a.hedef + '”',
      icon:ADIM_IKON[a.hedef] || 'i-refresh', size:'sm',
      body:'<div class="gv-fields">' + eksik.map(alanGirdi).join('') +
        (gerekceVar ? nedenGirdi() : '') + '</div>' +
        '<div class="field u-mt-4"><label for="adimNot">Açıklama' + (gerekceVar ? '<span class="req">*</span>' : '') + '</label>' +
        '<textarea id="adimNot" rows="2" placeholder="Geçiş gerekçesi"></textarea></div>',
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:a.etiket, cls:a.tone === 'btn-line' ? 'btn-acc' : a.tone, onClick:function(close, el){
            var ek = {}, bos = [];
            eksik.forEach(function(alan){
              var v = (el.querySelector('#ek_' + alan).value || '').trim();
              if(!v) bos.push(alanAd(alan)); else ek[alan] = v;
            });
            var neden = gerekceVar ? (el.querySelector('#adimNeden').value || '') : null;
            var not   = el.querySelector('#adimNot').value.trim();
            if(gerekceVar && !neden) bos.push('Neden kodu');
            if(gerekceVar && !not)   bos.push('Açıklama');
            if(bos.length){ GV.toast(bos.join(', ') + ' zorunludur', 'danger'); return false; }
            return uygula(a.hedef, Object.keys(ek).length ? ek : null,
                          { neden:neden || null, not:not || null }) ? undefined : false;
          } }
      ]
    });
  }

  function adimCalistir(a){
    if(!a) return;
    if((a.eksik && a.eksik.length) || a.gerekce){ adimModal(a); return; }
    /* Kapatma geri dönüşü zor bir adımdır: onay sorulur. İleri akışın normal
       adımı (Triage Et · Ata · Çalışmaya Başla) tek tıkla ilerler. */
    if(a.hedef !== 'Kapandı'){ uygula(a.hedef, null, null); return; }
    GV.confirm({ title:a.etiket, tone:'warn', okLabel:a.etiket,
      text:t.kod + ' talebi “' + t.durum + '” durumundan “' + a.hedef + '” durumuna geçecek' +
           (t.ucretli ? '.' : ' ve harcanan efor (' + F.hours(t.harcananSure) + ') bakım paketi kotasından düşülecek.')
    }).then(function(ok){ if(ok) uygula(a.hedef, null, null); });
  }

  Array.prototype.forEach.call(mount.querySelectorAll('[data-adim]'), function(b){
    b.addEventListener('click', function(){ adimCalistir(adimlar[+b.dataset.adim]); });
  });

  mount.addEventListener('click', function(e){
    if(e.target.closest('#btnDonusturBos')) donusturModal();
  });
});
</script>
</body>
</html>
