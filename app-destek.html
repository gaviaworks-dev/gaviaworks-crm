<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Destek Talepleri — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="destek" data-screen="destek">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  GV.pageHead({ eyebrow:'Destek ve Bakım', title:'Destek Talepleri',
    actions:[{ label:'SLA Takibi', icon:'i-hourglass', href:'app-destek-sla.html' },
             { label:'Yeni Destek Kaydı', icon:'i-plus', cls:'btn-acc', href:'app-destek-form.html' }] });
  /* REVİZE 09 — "açık talep" tanımı ekranda YAZILMAZ; dokuz tüketici
     aynı cümleyi ayrı ayrı kuruyordu. */
  var acik = GV.destek.acik;
  /* ADR-19 — BEKLEME İKİNCİ EKSENDİR. `Müşteri bekleniyor` artık bir DURUM
     değil: talep “Devam ediyor” olmayı sürdürür, yalnız bir şeyi bekler.
     Rozet DURUMU söyler, çip NEYİ BEKLEDİĞİNİ — görev ekseninde beş oturumdur
     böyle basılıyor (`app-gorev-detay.html` · `beklemeCip`), destek ekseni de
     aynı dili kullanır; yeni bir gösterim icat edilmez. */
  function beklemeCip(x){
    return x.beklemeNedeni
      ? '<span class="tag" title="Bekleme nedeni">' + GV.ico('i-clock','ic-sm') +
        esc(x.beklemeNedeni) + ' bekleniyor</span>'
      : '';
  }
  GV.list({
    /* UID-05 — SATIR KAPSAMI: `GV.perm.scope('gor')` kısıtlıysa bileşen kaynağı
       bu eşlemeye göre süzer ve liste üstünde bilgilendirici bir çip basar.
       Ekran yalnız hangi alanın hangi kapsama karşılık geldiğini bildirir. */
    /* REVİZE 13 — müşteri kapsamı. `kendi` personel ekseni (sorumlu), `musteri`
       ekseni talebin sahibi firmadır; müşteri portalı yalnız kendi taleplerini
       görür. Süzmeyi bileşen yapar (ui.js `afterScope`). */
    scopeField:{ kendi:'sorumlu', musteri:'musteri' },
    mount:'#liste', id:'destek', key:'kod', source:function(){ return DB.tickets; },
    exportName:'destek-talepleri', exportTitle:'Destek Talepleri', pageSize:10, views:['table','kanban'],
    search:{ placeholder:'Kayıt no, başlık, müşteri veya kategori ara', fields:['kod','baslik','musteriAd','kategori','acan'] },
    defaultSort:'acilis', defaultDir:'desc',
    kpis:[
      { label:'Açık destek kaydı', icon:'i-support', calc:function(a){ return a.filter(acik).length; } },
      { label:'SLA riski', icon:'i-hourglass', tone:'danger',
        calc:function(a){ return a.filter(function(x){ return x.slaDurum === 'Risk altında'; }).length; } },
      { label:'Ortalama müdahale', icon:'i-clock', tone:'info', format:function(v){ return v + ' dk'; },
        calc:function(a){ var l = a.filter(function(x){ return x.mudahaleSuresi != null; });
          return l.length ? Math.round(l.reduce(function(s,x){ return s + x.mudahaleSuresi; }, 0) / l.length) : 0; } },
      { label:'Memnuniyet', icon:'i-star', tone:'ok', format:function(v){ return v + ' / 5'; },
        calc:function(a){ var l = a.filter(function(x){ return x.memnuniyet != null; });
          return l.length ? (l.reduce(function(s,x){ return s + x.memnuniyet; }, 0) / l.length).toFixed(1) : '—'; } }
    ],
    tabs:[
      { key:'acik', label:'Açık Kayıtlar', icon:'i-support', filter:acik },
      { key:'yeni', label:'Yeni', icon:'i-inbox', filter:function(x){ return x.durum === 'Yeni'; } },
      { key:'devam', label:'Devam Edenler', icon:'i-play', filter:function(x){ return x.durum === 'Devam ediyor'; } },
      /* Sekme DURUMA değil BEKLEME EKSENİNE bakar: bekleyen talep durumunu
         korur, bu yüzden “Devam Edenler” sekmesinde de görünür. */
      { key:'bekleyen', label:'Beklemede', icon:'i-hourglass', filter:function(x){ return !!x.beklemeNedeni; } },
      { key:'sla', label:'SLA Riski', icon:'i-alert', filter:function(x){ return x.slaDurum === 'Risk altında'; } },
      { key:'hata', label:'Hata Bildirimleri', icon:'i-bug', filter:function(x){ return x.kategori === 'Hata'; } },
      { key:'gelistirme', label:'Geliştirme Talepleri', icon:'i-code', filter:function(x){ return x.kategori === 'Geliştirme talebi'; } },
      { key:'kapali', label:'Kapananlar', icon:'i-check-circle', filter:function(x){ return !acik(x); } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'baslik', label:'Destek kaydı', width:'26%', locked:true, cellClass:'cell-wrap', render:function(x){
          return '<a class="cell-main" href="app-destek-detay.html?id=' + x.kod + '">' + esc(x.baslik) + '</a>' +
                 '<span class="cell-code">' + x.kod + ' · ' + esc(x.kategori) + '</span>'; } },
      { key:'musteriAd', label:'Müşteri', render:function(x){
          return '<a class="cell-main" href="app-musteri-detay.html?id=' + x.musteri + '">' + esc(x.musteriAd) + '</a>' +
                 '<span class="cell-sub">' + esc(DB.contactName(x.acan)) + '</span>'; } },
      { key:'kategori', label:'Kategori', visible:false, render:function(x){ return '<span class="tag">' + esc(x.kategori) + '</span>'; } },
      { key:'oncelik', label:'Öncelik', render:function(x){ return GV.pri(x.oncelik); } },
      { key:'etki', label:'Etki', visible:false },
      { key:'sla', label:'SLA', render:function(x){
          var t = x.slaDurum === 'Risk altında' ? 'is-danger' : 'is-ok';
          return '<span class="badge ' + t + '">' + esc(x.sla) + '</span>'; },
        exportValue:function(x){ return x.sla + ' — ' + x.slaDurum; } },
      { key:'mudahaleSuresi', label:'Müdahale', cellClass:'num', render:function(x){
          return x.mudahaleSuresi != null ? '<span class="u-num">' + x.mudahaleSuresi + ' dk</span>' : '<span class="u-faint">—</span>'; } },
      { key:'sorumlu', label:'Sorumlu', render:function(x){ return GV.user(x.sorumlu, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.sorumlu); }, exportValue:function(x){ return DB.empName(x.sorumlu); } },
      { key:'harcananSure', label:'Harcanan', cellClass:'num', visible:false,
        render:function(x){ return '<span class="u-num">' + F.hours(x.harcananSure) + '</span>'; } },
      { key:'ucretli', label:'Ücretlendirme', visible:false, render:function(x){
          return x.ucretli ? '<span class="badge is-warn no-dot">Ücretli</span>' : '<span class="tag">Bakım paketi</span>'; },
        exportValue:function(x){ return x.ucretli ? 'Ücretli' : 'Bakım paketi'; } },
      { key:'memnuniyet', label:'Memnuniyet', render:function(x){
          if(x.memnuniyet == null) return '<span class="u-faint">—</span>';
          return '<span class="badge ' + (x.memnuniyet >= 4 ? 'is-ok' : x.memnuniyet >= 3 ? 'is-warn' : 'is-danger') + '">' + x.memnuniyet + ' / 5</span>'; } },
      { key:'acilis', label:'Açılış', render:function(x){ return '<span class="cell-date">' + F.dt(x.acilis) + '</span>'; } },
      { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum) + beklemeCip(x); },
        exportValue:function(x){ return x.durum + (x.beklemeNedeni ? ' · ' + x.beklemeNedeni + ' bekleniyor' : ''); } },
      { key:'beklemeNedeni', label:'Bekleme nedeni', visible:false, render:function(x){
          return x.beklemeNedeni ? beklemeCip(x) : '<span class="u-faint">Beklemiyor</span>'; },
        exportValue:function(x){ return x.beklemeNedeni || ''; } }
    ],
    filters:[
      { key:'durum', label:'Kayıt durumu', type:'multi', options:DB.ticketStatuses },
      /* Bekleme durumdan bağımsız süzülür — sözlük veri katmanında (`DB.ticketWaitReasons`) */
      { key:'beklemeNedeni', label:'Bekleme nedeni', type:'multi', options:DB.ticketWaitReasons },
      { key:'kategori', label:'Talep kategorisi', type:'multi', options:['Hata','Geliştirme talebi','Kullanım sorusu','Bilgi talebi'] },
      { key:'oncelik', label:'Öncelik', type:'multi', options:DB.priorities },
      { key:'musteri', label:'Müşteri', type:'select', options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'sorumlu', label:'Sorumlu', type:'select', options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'slaDurum', label:'SLA durumu', type:'select', options:['Zamanında','Risk altında'] },
      { key:'ucretli', label:'Ücretli kayıtlar', type:'select', options:[{ value:'e', label:'Sadece ücretli' }], test:function(x){ return x.ucretli; } }
    ],
    rowClass:function(x){ return x.slaDurum === 'Risk altında' && acik(x) ? 'is-late' : ''; },
    kanban:{ groupBy:'durum', columns:DB.ticketStatuses,
      card:function(x){
        return '<a class="gv-kcard-title" href="app-destek-detay.html?id=' + x.kod + '">' + esc(x.baslik) + '</a>' +
          '<div class="gv-kcard-meta"><span>' + esc(x.musteriAd) + '</span>' + GV.pri(x.oncelik) + '</div>' +
          '<div class="gv-kcard-meta">' + GV.user(x.sorumlu, { sm:true }) + beklemeCip(x) +
          (x.slaDurum === 'Risk altında' ? '<span class="badge is-danger">SLA</span>' : '') + '</div>'; } },
    mobile:function(x){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-destek-detay.html?id=' + x.kod + '">' + esc(x.baslik) + '</a>' +
        GV.pri(x.oncelik) + '</div>' +
        '<div class="gv-mrow-code">' + x.kod + ' · ' + esc(x.musteriAd) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-clock','ic-sm') + 'SLA ' + esc(x.sla) + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + beklemeCip(x) + '</span></div>';
    },
    rowActions:[
      { key:'ac', icon:'i-external', label:'Kaydı aç', href:function(x){ return 'app-destek-detay.html?id=' + x.kod; } },
      { key:'donustur', icon:'i-refresh', label:'Dönüştür', run:function(x){
          GV.modal({ title:'Destek Kaydını Dönüştür', text:x.kod + ' · ' + x.baslik, icon:'i-refresh', size:'sm',
            body:'<div class="field"><span class="f-lbl">Hedef kayıt türü</span><div class="f-radios">' +
              ['Görev','Hata kaydı','Geliştirme talebi','Değişiklik talebi','Ek teklif'].map(function(o,i){
                return '<label class="f-radio"><input type="radio" name="hedef" value="' + o + '"' + (i===0?' checked':'') + '>' + o + '</label>';
              }).join('') + '</div></div>',
            actions:[{ label:'Vazgeç', cls:'btn-line' },
              { label:'Dönüştür', cls:'btn-acc', onClick:function(close, el){
                  var hedef = el.querySelector('[name=hedef]:checked').value;
                  GV.toast(x.kod + ' → ' + hedef + ' olarak oluşturuldu', 'ok'); } }] }); } },
      /* Durum artık EKRANDA YAZILMAZ. Merkezî geçiş motoru hangi adımın
         yapılabilir olduğunu söyler; “Kapandı”ya yalnız tabloda yazılı
         durumlardan geçilir (Yeni · Müşteri Onayı) ve bakım kotası kapısı
         (ADR-10) burada da çalışır. Eskiden liste `x.durum = 'Kapatıldı'`
         yazıyor, ara adımları ve kotayı atlıyordu. */
      { key:'kapat', icon:'i-check', label:'Kaydı kapat', run:function(x, refresh){
          if(!acik(x)){ GV.toast('Bu kayıt zaten kapalı.', 'info'); return; }
          var adim = GV.flow.adimlar('ticket', x.kod).filter(function(a){ return a.hedef === 'Kapandı'; })[0];
          if(!adim){
            GV.toast('“' + x.durum + '” durumundaki kayıt doğrudan kapatılamaz — ' +
                     'iş akışındaki adımlar kayıt kartından yürütülür.', 'warn');
            return;
          }
          if(!adim.izin){ GV.toast('Bu kaydı kapatma yetkiniz yok.', 'danger'); return; }

          function kapat(opts){
            var r = GV.flow.gec('ticket', x.kod, 'Kapandı', null, opts || {});
            if(!r || !r.ok){
              /* Bakım kotası aşımı gibi kapı redleri sessizce yutulmaz (ADR-10) */
              GV.toast(r && r.mesaj ? r.mesaj : (r && r.why ? r.why : 'Kayıt kapatılamadı'),
                       r && r.why === 'kapi' ? 'warn' : 'danger');
              return false;
            }
            GV.toast(x.kod + ' kapandı', 'ok');
            refresh();
            return true;
          }

          /* Geçiş tablosu bu hedefte gerekçe istiyorsa (şartname [2.0.6]:
             neden KODU + açıklama) onay kutusu yetmez, ikisi de sorulur. */
          if(adim.gerekce){
            GV.modal({ title:'Destek kaydını kapat', text:x.kod + ' · ' + x.baslik, icon:'i-check', size:'sm',
              body:'<div class="field"><label for="kpNeden">Neden kodu<span class="req">*</span></label>' +
                   '<select id="kpNeden"><option value="">Neden seçin</option>' +
                   DB.reasonCodes.map(function(r){
                     return '<option value="' + esc(r.kod) + '">' + esc(r.ad) + '</option>'; }).join('') +
                   '</select></div>' +
                   '<div class="field u-mt-4"><label for="kpNot">Açıklama<span class="req">*</span></label>' +
                   '<textarea id="kpNot" rows="2" placeholder="Kapanış notu"></textarea>' +
                   '<span class="f-hint">Kapanışta müşteriye memnuniyet anketi gönderilir.</span></div>',
              actions:[{ label:'Vazgeç', cls:'btn-line' },
                { label:'Kaydı kapat', cls:'btn-ok', onClick:function(close, el){
                    var kod = el.querySelector('#kpNeden').value;
                    var not = el.querySelector('#kpNot').value.trim();
                    if(!kod || !not){ GV.toast('Neden kodu ve açıklama zorunludur', 'warn'); return false; }
                    return kapat({ neden:kod, not:not }) ? undefined : false;
                  } }] });
            return;
          }
          GV.confirm({ title:'Destek kaydını kapat',
            text:x.kod + ' kaydı kapatılacak ve müşteriye memnuniyet anketi gönderilecek.', okLabel:'Kapat' })
            .then(function(ok){ if(ok) kapat(); }); } }
    ],
    bulk:[{ key:'ata', label:'Sorumlu ata', icon:'i-user-check' }, { key:'disa', label:'Dışa aktar', icon:'i-download', export:true }],
    emptyState:{ icon:'i-support', title:'Bu görünümde destek kaydı yok',
      desc:'Müşteri talepleri tek merkezde toplanır; SLA ve çözüm süresi otomatik izlenir.',
      action:'<a class="btn btn-acc" href="app-destek-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Destek Kaydı</a>' }
  });

});
</script>
</body>
</html>
