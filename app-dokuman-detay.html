<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Doküman Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="dokuman" data-screen="dokuman">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');

  /* Denetim (log) yetkisi gizli içerik maskesini açar — app-dokuman-sure.html ile
     birebir aynı kural, aynı eşik, aynı maskeleme deseni. */
  var canLog     = GV.perm.can('log');
  var canDuzenle = GV.perm.can('duzenle');
  var canOnay    = GV.perm.can('onay');
  var canDisa    = GV.perm.can('disaAktar');

  /* REVİZE 13 — müşteri oturumunda varsayılan kayıt kendi dokümanı. */
  var qsId = new URLSearchParams(location.search).get('id');
  function dokMusteri(x){
    if(x.musteri) return x.musteri;
    var p = x.proje ? DB.proj(x.proje) : null;
    return p ? p.musteri : null;
  }
  var benimDok = (GV.session && GV.session.musteri)
    ? DB.documents.filter(function(x){ return dokMusteri(x) === GV.session.musteri; })[0] : null;
  var id = qsId || ((GV.session && GV.session.musteri)
    ? (benimDok || {}).kod : (DB.documents[0] || {}).kod);
  var d  = DB.documents.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!d){
    GV.pageHead({ eyebrow:'Dokümanlar', title:'Doküman Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Doküman merkezi', icon:'i-folder', href:'app-dokuman.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Doküman bulunamadı',
      desc:'“' + esc(id || '') + '” kodlu doküman arşivde yok. Bağlantı eski olabilir veya doküman silinmiş olabilir.',
      action:'<a class="btn btn-acc" href="app-dokuman.html">Doküman merkezine dön</a>' }) + '</div>';
    return;
  }

  /* =================================================================
     GİZLİLİK MASKESİ (app-dokuman-sure.html deseni)
     'Gizli' ve 'Kişisel veri' dokümanlarında içerik alanı (doküman adı)
     denetim yetkisi olmayan rollerde maskelenir. Kod, tür, klasör ve
     tarihler açık kalır — kayıt izlenebilir, içerik okunmaz.
     ================================================================= */
  var gizliBelge = d.gizlilik === 'Gizli' || d.gizlilik === 'Kişisel veri';
  var masked     = gizliBelge && !canLog;

  function adHtml(){
    return masked
      ? '<span class="cell-mask" title="Bu dokümanın içeriğini görüntüleme yetkiniz yok">••••••</span>'
      : esc(d.ad);
  }
  function adText(){ return masked ? d.kod : d.ad; }   /* modal/toast metinlerinde kayıt kendi kodu ile anılır */

  /* REVİZE 13 — kayıt sahipliği kapısı. Dokümanın müşterisi ya doğrudan
     yazılı ya projesinden gelir; ikisi de yoksa dosya İÇ dokümandır ve
     müşteri oturumunda açılmaz. */
  if(!GV.guardRecord({ mount:mount, musteri:dokMusteri(d), kod:d.kod,
        eyebrow:'Dokümanlar', title:'Doküman Detayı',
        geriHref:'app-dokuman.html', geriLabel:'Doküman merkezi' })) return;

  GV.shell.crumb(d.kod);
  document.title = d.kod + ' — Doküman — GaviaWorks CRM';

  /* =================================================================
     İLİŞKİLİ KAYITLAR
     Veride YAZILI bağ: musteri + proje. Sözleşme ve teklif bağı
     DB.documents'ta YOK — proje/müşteri üzerinden TÜREtilir ve arayüzde
     "türetildi" olarak işaretlenir (uydurma bağ kurulmaz).
     ================================================================= */
  var musteri = d.musteri ? DB.customers.filter(function(m){ return m.kod === d.musteri; })[0] : null;
  var proje   = d.proje ? DB.proj(d.proje) : null;

  var sozlesme = null, sozlesmeKaynak = null;
  if(d.proje){
    sozlesme = DB.contracts.filter(function(c){ return c.proje === d.proje; })[0] || null;
    if(sozlesme) sozlesmeKaynak = 'proje';
  }
  if(!sozlesme && d.musteri){
    var cAday = DB.contracts.filter(function(c){ return c.musteri === d.musteri; });
    if(cAday.length === 1){ sozlesme = cAday[0]; sozlesmeKaynak = 'musteri'; }
  }

  var teklif = null;
  if(d.musteri){
    var qAday = DB.quotes.filter(function(q){ return q.musteri === d.musteri; });
    if(qAday.length === 1) teklif = qAday[0];
  }

  /* Aynı bağlı kayda (müşteri veya proje) ait diğer dokümanlar */
  var kardes = DB.documents.filter(function(x){
    if(x.kod === d.kod) return false;
    return (d.musteri && x.musteri === d.musteri) || (d.proje && x.proje === d.proje);
  });

  var acts = DB.activities.filter(function(a){ return a.kayit === d.kod; });

  /* Sürüm zinciri ve onay zinciri — bağ tek yönlü, kayıt kaynaktan okunur (§9d).
     Dokümanın `versiyon` ve `onay` alanları bu iki zincirden TÜRETİLEBİLİR olmalıdır;
     ekran türetilen sonucu kayıtla karşılaştırır ve çelişkiyi söyler (L-08). */
  var surumler = DB.documentVersions.filter(function(v){ return v.dokuman === d.kod; })
                                    .sort(function(a,b){ return a.sira - b.sira; });
  var guncelSurum = surumler.length ? surumler[surumler.length - 1] : null;
  var adimlar = DB.documentApprovals.filter(function(a){ return a.dokuman === d.kod; })
                                    .sort(function(a,b){ return a.sira - b.sira; });

  /* =================================================================
     SÜRE — referans DB.today; eşikler app-dokuman-sure.html ile aynı
     ================================================================= */
  var sureli   = d.sonKullanma != null;
  /* Kalan gün kayıtta yazılı; tazelik için son kullanma tarihinden yeniden hesaplanır
     (app-dokuman-sure.html'deki kalan() ile birebir aynı) */
  var kalanGun = sureli ? (d.kalanGun != null ? d.kalanGun : F.days(d.sonKullanma)) : null;
  var doldu    = sureli && kalanGun < 0;

  /* Süre listesindeki üç durumlu rozet — sözlükte tanımlı değerler */
  var sureDurum = !sureli ? null : (kalanGun < 0 ? 'Süresi doldu' : kalanGun <= 30 ? 'Yaklaşıyor' : 'Geçerli');

  /* 60 / 30 / 15 / 7 gün eşikleri */
  function esik(gun){
    if(gun == null) return null;
    if(gun < 0)   return { tone:'danger', lbl:'Süresi doldu' };
    if(gun <= 7)  return { tone:'danger', lbl:'7 günden az kaldı' };
    if(gun <= 15) return { tone:'warn',   lbl:'15 günden az kaldı' };
    if(gun <= 30) return { tone:'warn',   lbl:'30 günden az kaldı' };
    if(gun <= 60) return { tone:'info',   lbl:'60 günden az kaldı' };
    return { tone:'ok', lbl:'Süre rahat' };
  }
  var sureEsik = esik(kalanGun);

  function kalanMetin(gun){
    if(gun == null) return '<span class="u-faint">Süresiz doküman</span>';
    if(gun < 0)   return '<b class="u-danger">' + Math.abs(gun) + ' gün önce doldu</b>';
    if(gun === 0) return '<b class="u-danger">Bugün son gün</b>';
    return '<b class="u-num">' + gun + ' gün kaldı</b>';
  }

  /* Geçerlilik penceresi: yükleme tarihinden son kullanmaya */
  var toplamGun = sureli && d.tarih
    ? Math.round((new Date(d.sonKullanma + 'T00:00:00') - new Date(String(d.tarih).slice(0,10) + 'T00:00:00')) / 86400000)
    : null;
  var gecenGun  = (toplamGun != null && kalanGun != null) ? (toplamGun - kalanGun) : null;
  var sureOran  = (toplamGun && gecenGun != null)
    ? Math.max(0, Math.min(100, Math.round(gecenGun / toplamGun * 100))) : null;

  function yilEkle(iso){
    var p = String(iso).slice(0,10).split('-');
    return (parseInt(p[0],10) + 1) + '-' + p[1] + '-' + p[2];
  }

  /* =================================================================
     YARDIMCILAR
     dt metinleri yazar tarafından yazılan sabit dizelerdir (eksen /
     kaynak işareti için <span class="u-faint"> içerir) — dt escape
     EDİLMEZ, dd zaten çağıran tarafta esc()'lenerek gelir. (L-14)
     ================================================================= */
  function tbl(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3></div>' + govde + '</div>';
  }
  /* Gizlilik seviyeleri badge sözlüğünde YOK — açık ton geçilir (components.md §5) */
  function gizBadge(v){
    var t = v === 'Gizli' ? 'is-danger' : v === 'Kişisel veri' ? 'is-purple' : 'is-neutral';
    return GV.badge(v, t + ' no-dot');
  }
  function docLink(x){
    return '<a class="cell-main" href="app-dokuman-detay.html?id=' + encodeURIComponent(x.kod) + '">' +
      (( !canLog && (x.gizlilik === 'Gizli' || x.gizlilik === 'Kişisel veri'))
        ? '<span class="cell-mask" title="Bu dokümanın içeriğini görüntüleme yetkiniz yok">••••••</span>'
        : esc(x.ad)) + '</a>';
  }

  /* =================================================================
     AKSİYONLAR — hepsi gerçekten çalışır, koşulu sağlamayan basılmaz
     ================================================================= */
  function indirAkisi(){
    GV.toast(d.kod + ' · ' + d.format + ' — dosya içeriği saklanmadığı için indirme yapılamaz.', 'info', 5200);
  }

  /* Onay TEK BİR ALANI çevirmez: zincirdeki sıradaki bekleyen adımı kapatır ve
     doküman durumu adımlardan yeniden türetilir. Zincirin ortasındaki bir adımı
     onaylamak dokümanı 'Onaylandı' yapmaz — arkasında bekleyen adım varsa. */
  function onayAkisi(){
    var sira = adimlar.filter(function(a){ return a.durum === 'Bekliyor'; })[0];
    if(!sira){ GV.toast('Bu dokümanda bekleyen onay adımı yok.', 'info'); return; }
    var kalan = adimlar.filter(function(a){ return a.durum === 'Bekliyor'; }).length - 1;
    GV.confirm({
      title:'Dijital onay',
      text:adText() + ' dokümanının “' + sira.makam + '” adımı onaylanacak' +
           (kalan ? '. Bu adımdan sonra ' + kalan + ' adım daha bekliyor, doküman onay durumu değişmez.'
                  : '. Zincirin son adımı — doküman onay durumu “Onaylandı”ya geçer.'),
      okLabel:'Onayla'
    }).then(function(ok){
      if(!ok) return;
      var saat = DB.today + 'T' + new Date().toTimeString().slice(0,5);
      sira.durum = 'Onaylandı';
      sira.tarih = saat;
      sira.kisi  = GV.session.emp;
      sira.not   = 'Ekrandan onaylandı';
      var eski = d.onay;
      d.onay = adimlar.every(function(a){ return a.durum === 'Onaylandı'; }) ? 'Onaylandı' : 'Bekliyor';
      DB.activities.unshift({ kayit:d.kod, tarih:saat, kisi:GV.session.emp,
        metin:'“' + sira.makam + '” adımı onaylandı' + (kalan ? ' · ' + kalan + ' adım bekliyor' : ''),
        eski:eski, yeni:d.onay, tone:'ok', icon:'i-stamp' });
      GV.toast(kalan ? sira.makam + ' adımı onaylandı · ' + kalan + ' adım kaldı'
                     : d.kod + ' onaylandı', 'ok');
      setTimeout(function(){ GV.refresh(); }, 700);
    });
  }

  function versiyonAkisi(){
    var oneri = sureli ? yilEkle(d.sonKullanma) : '';
    var up;
    var m = GV.modal({ title:'Yeni versiyon yükle', icon:'i-upload', size:'sm',
      text:adText() + ' · mevcut sürüm v' + d.versiyon,
      body:'<div class="gv-fields">' +
        '<div class="field f-col-12"><label for="vSon">Son kullanma tarihi' +
          (sureli ? '' : ' (opsiyonel)') + '</label>' +
          '<input type="date" class="inp" id="vSon" value="' + esc(oneri) + '">' +
          '<div class="f-hint">' + (sureli
            ? 'Varsayılan olarak mevcut tarihin bir yıl sonrası önerilir.'
            : 'Bu doküman süresiz kayıtlı. Tarih girerseniz süre takibine dahil olur.') + '</div></div>' +
        '<div class="field f-col-12" id="vUp"></div>' +
        '<div class="field f-col-12"><label for="vNot">Versiyon notu (opsiyonel)</label>' +
          '<textarea id="vNot" rows="2" placeholder="Örn. Yenilenen belge, imzalı nüsha"></textarea></div>' +
      '</div>',
      actions:[{ label:'Vazgeç', cls:'btn-line' },
        { label:'Versiyonu kaydet', cls:'btn-acc', onClick:function(close, el){
            if(!up || !up.files().length){ GV.toast('Yeni versiyon için dosya seçmelisiniz', 'danger'); return false; }
            var son = el.querySelector('#vSon').value;
            if(sureli && !son){ GV.toast('Süre takipli dokümanda son kullanma tarihi zorunludur', 'danger'); return false; }
            if(son && son <= DB.today){ GV.toast('Son kullanma tarihi bugünden ileri olmalıdır', 'danger'); return false; }
            var vNot = (el.querySelector('#vNot').value || '').trim();
            var eskiV = d.versiyon;
            d.versiyon = d.versiyon + 1;
            d.tarih = DB.today;
            if(son){ d.sonKullanma = son; d.kalanGun = F.days(son); }
            /* Sürüm zincirine GERÇEK kayıt yazılır — yoksa doküman v(n+1) derken
               zincir v(n)'de kalır ve ekran kendi ölçtüğü çelişkiyi bildirirdi. */
            DB.documentVersions.push({ dokuman:d.kod, sira:d.versiyon, tarih:DB.today,
              yukleyen:GV.session.emp, boyut:d.boyut, format:d.format,
              not:vNot || 'Yeni sürüm yüklendi' });
            DB.activities.unshift({ kayit:d.kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0,5),
              kisi:GV.session.emp, metin:'Yeni versiyon yüklendi' + (vNot ? ' — ' + vNot : ''),
              eski:'v' + eskiV, yeni:'v' + d.versiyon, tone:'accent', icon:'i-upload' });
            GV.toast('v' + d.versiyon + ' yüklendi' + (son ? ' · yeni son kullanma ' + F.date(son) : ''), 'ok');
            setTimeout(function(){ GV.refresh(); }, 700);
          } }] });
    up = GV.upload({ mount:m.el.querySelector('#vUp'), multiple:false,
      accept:'.pdf,.docx,.xlsx,.png,.jpg',
      title:'Yeni sürümü seçin veya sürükleyip bırakın',
      hint:'PDF, DOCX, XLSX, PNG · en fazla 20 MB · dosya içeriği saklanmaz' });
  }

  var actions = [
    { label:'Doküman merkezi', icon:'i-folder', href:'app-dokuman.html' },
    { label:'Süresi dolanlar', icon:'i-hourglass', href:'app-dokuman-sure.html' }
  ];
  if(canOnay && d.onay === 'Bekliyor'){
    actions.push({ label:'Dijital onay ver', icon:'i-stamp', run:onayAkisi });
  }
  /* İndir: dışa aktarma yetkisi olmayan rollere HİÇ basılmaz; maskeli kayıtta da basılmaz */
  if(canDisa && !masked){
    actions.push({ label:'İndir', icon:'i-download', cls:'btn-acc', run:indirAkisi });
  }

  GV.pageHead({
    eyebrow:'Dokümanlar', title:'Doküman Detayı',
    sub:d.kod + ' · ' + adText() + ' · ' + d.tur,
    actions:actions
  });

  /* =================================================================
     KAYIT BAŞLIĞI
     ================================================================= */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + esc(d.kod) + '</span>' +
        GV.badge(d.onay) +
        (sureli ? GV.badge(sureDurum) : '<span class="tag">Süresiz</span>') +
        gizBadge(d.gizlilik) +
        '<span class="tag">' + esc(d.tur) + '</span>' +
        (d.aktif === false ? '<span class="tag">Arşiv</span>' : '') + '</div>' +
      '<h1>' + adHtml() + '</h1>' +
      '<div class="gv-rec-meta">' +
        '<span>' + ico('i-folder','ic-sm') + esc(d.klasor) + '</span>' +
        '<span>' + ico('i-file','ic-sm') + esc(d.format) + ' · ' + esc(d.boyut) + ' · v' + d.versiyon + '</span>' +
        '<span>' + ico('i-user','ic-sm') + esc(DB.empName(d.yukleyen)) + '</span>' +
        '<span>' + ico('i-calendar','ic-sm') + 'Yüklendi ' + F.date(d.tarih) + '</span>' +
        (sureli
          ? '<span>' + ico('i-hourglass','ic-sm') + 'Son kullanma ' + F.date(d.sonKullanma) + '</span>'
          : '<span>' + ico('i-hourglass','ic-sm') + 'Son kullanma tarihi yok</span>') +
        (musteri
          ? '<span>' + ico('i-building','ic-sm') + '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + esc(musteri.kisa) + '</a></span>'
          : '<span>' + ico('i-building','ic-sm') + 'Şirket içi doküman</span>') +
        (proje
          ? '<span>' + ico('i-briefcase','ic-sm') + '<a href="app-proje-detay.html?id=' + proje.kod + '">' + esc(proje.ad) + '</a></span>'
          : '') +
      '</div>' +
    '</div></div>';

  /* =================================================================
     SEKMELER
     ================================================================= */
  var tabs = [
    { key:'genel',    lbl:'Genel',              ic:'i-info' },
    { key:'versiyon', lbl:'Versiyon Geçmişi',   ic:'i-layers', cnt:surumler.length },
    { key:'sure',     lbl:'Süre ve Yenileme',   ic:'i-hourglass' },
    { key:'erisim',   lbl:'Erişim ve Gizlilik', ic:'i-lock' },
    { key:'bagli',    lbl:'Bağlı Kayıtlar',     ic:'i-link',   cnt:kardes.length },
    { key:'onay',     lbl:'Onay Akışı',         ic:'i-stamp', cnt:adimlar.length },
    { key:'aktivite', lbl:'Aktivite Geçmişi',   ic:'i-activity', cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  var maskeNot = masked ? '<div class="gc-body">' + GV.notice({
    tone:'warn', icon:'i-lock', title:'Doküman içeriği maskeli',
    text:'Bu kayıt “' + d.gizlilik + '” seviyesinde. Rolünüzde denetim (log) yetkisi olmadığı için ' +
         'doküman adı ve içerik erişimi maskelenir; kod, tür, klasör, tarih ve süre alanları açık kalır. ' +
         'Maskeleme kuralı süre takibi ekranıyla birebir aynıdır.' }) + '</div>' : '';

  /* =================================================================
     1. GENEL — DB.documents alanlarının tamamı
     ================================================================= */
  var pGenel = maskeNot + '<div class="gc-body">' +
    sec('Doküman Kimliği', GV.dl([
      ['Doküman kodu', '<span class="u-num">' + esc(d.kod) + '</span>'],
      ['Doküman adı', adHtml()],
      ['Doküman türü', '<span class="tag">' + esc(d.tur) + '</span>'],
      ['Klasör', esc(d.klasor)],
      ['Kayıt durumu', d.aktif === false
        ? '<span class="tag">Arşivlendi</span>'
        : '<span class="badge is-ok no-dot">Aktif kayıt</span>']
    ])) +

    sec('Dosya Bilgisi', GV.dl([
      ['Format', '<span class="tag">' + esc(d.format) + '</span>'],
      ['Boyut', esc(d.boyut)],
      ['Versiyon', '<b class="u-num">v' + d.versiyon + '</b>' +
        (d.versiyon > 1 ? ' <span class="cell-sub">güncel sürüm</span>' : ' <span class="cell-sub">ilk sürüm</span>')],
      ['Yükleyen', GV.user(d.yukleyen, { sm:true })],
      ['Yükleme tarihi', '<span class="cell-date">' + F.date(d.tarih) + '</span>' +
        ' <span class="cell-sub">' + F.rel(d.tarih) + '</span>']
    ])) +

    sec('Süre ve Geçerlilik', GV.dl([
      ['Son kullanma tarihi', sureli

  var eksikSurum = d.versiyon - surumler.length;   /* kaydı olmayan ara sürüm sayısı */

  /* =================================================================

  var GIZ_ACIKLAMA = {

  /* Yetki matrisi karşılığı olan roller — sayaç ve tablo aynı kümeyi kullanır */
  var rolKume = DB.roles.filter(function(r){ return DB.permMatrix[r.key]; });

    '<div class="gc-body flush">' +

          kardes.map(function(x){
            var xk = x.sonKullanma != null ? (x.kalanGun != null ? x.kalanGun : F.days(x.sonKullanma)) : null;
            return '<tr><td class="cell-wrap">' + docLink(x) +
                '<span class="cell-code">' + esc(x.kod) + ' · ' + esc(x.format) + ' · ' + esc(x.boyut) + '</span></td>' +
              '<td><span class="tag">' + esc(x.tur) + '</span></td>' +
              '<td class="cell-wrap"><span class="cell-sub">' + esc(x.klasor) + '</span></td>' +
              '<td class="num"><span class="u-num">v' + x.versiyon + '</span></td>' +
              '<td>' + GV.user(x.yukleyen, { sm:true }) + '</td>' +
              '<td><span class="cell-date">' + F.date(x.tarih) + '</span></td>' +
              '<td>' + (x.sonKullanma
                ? GV.dateCell(x.sonKullanma) + (xk != null && xk <= 30
                    ? '<span class="cell-sub">' + (xk < 0 ? Math.abs(xk) + ' gün geçti' : xk + ' gün kaldı') + '</span>' : '')
                : '<span class="u-faint">Süresiz</span>') + '</td>' +
              '<td>' + gizBadge(x.gizlilik) + '</td>' +
              '<td>' + GV.badge(x.onay) + '</td></tr>';
          }).join('')) +
        sayac('<b>' + kardes.length + '</b> doküman · aynı ' +
          (d.proje ? 'proje' : 'müşteri') + ' bağına sahip diğer kayıtlar',
          '<a class="btn btn-line btn-sm" href="app-dokuman.html?q=' +
            encodeURIComponent(d.proje || d.musteri || '') + '">' + ico('i-folder','ic-sm') + ' Merkezde filtrele</a>')
      : GV.empty({ icon:'i-folder', title:'Aynı kayda bağlı başka doküman yok',
          desc:(bagliVar
            ? 'Bu müşteri / proje için arşivde başka doküman bulunmuyor.'
            : 'Doküman bir müşteri veya projeye bağlı olmadığı için kardeş doküman listesi kurulamıyor.'),
          action:'<a class="btn btn-acc" href="app-dokuman.html">Doküman merkezine git</a>' })) +
    '</div>';

  /* =================================================================
     6. ONAY AKIŞI — dijital onay zinciri veride YOK
     ================================================================= */
  var onayAksiyon = (canOnay && d.onay === 'Bekliyor')
    ? '<div class="u-row u-mt-8"><button type="button" class="btn btn-acc" id="btnOnay">' +
      ico('i-stamp') + ' Dijital onay ver</button></div>'
    : '';

  /* Onay durumu zincirden TÜRETİLİR: her adım onaylıysa 'Onaylandı', biri bile
     beklerse 'Bekliyor'. Kayıttaki alanla karşılaştırılır — çelişki örtülmez. */
  var onaylananAdim = adimlar.filter(function(a){ return a.durum === 'Onaylandı'; }).length;
  var bekleyenAdim  = adimlar.filter(function(a){ return a.durum === 'Bekliyor'; })[0] || null;
  var turemisOnay   = adimlar.length ? (onaylananAdim === adimlar.length ? 'Onaylandı' : 'Bekliyor') : null;

  var onayNot = !adimlar.length
    ? GV.notice({ tone:'warn', icon:'i-alert', title:'Bu dokümanın onay adımı kaydı yok',
        text:'Kayıt “' + d.onay + '” diyor ama zincirde adım bulunmuyor.' })
    : (turemisOnay !== d.onay
        ? GV.notice({ tone:'danger', icon:'i-alert', title:'Onay durumu zincirle çelişiyor',
            text:'Kayıtta “' + d.onay + '” yazılı ama ' + adimlar.length + ' adımdan türeyen sonuç “' +
                 turemisOnay + '”. Veri düzeltmesi gerekir.' })
        : (bekleyenAdim
            ? GV.notice({ tone:'warn', icon:'i-clock', title:'Onay zinciri devam ediyor',
                text:adimlar.length + ' adımın ' + onaylananAdim + ' tanesi tamamlandı. Sıradaki adım: ' +
                     bekleyenAdim.makam + ' · ' + DB.empName(bekleyenAdim.kisi) + '.' +
                     (bekleyenAdim.not ? ' Not: ' + bekleyenAdim.not : '') })
            : GV.notice({ tone:'ok', icon:'i-check-circle', title:'Onay zinciri tamamlandı',
                text:adimlar.length + ' adımın ' + adimlar.length + ' tanesi onaylandı; son onay ' +
                     F.date(String(adimlar[adimlar.length - 1].tarih).slice(0,10)) + ' tarihinde verildi.' })));

  var sonOnay = adimlar.filter(function(a){ return a.durum === 'Onaylandı'; }).slice(-1)[0] || null;

  var pOnay = '<div class="gc-body">' + onayNot +
    GV.dl([
      ['Dijital onay durumu', GV.badge(d.onay) +
        (turemisOnay ? '<span class="cell-sub">' + adimlar.length + ' adımlık zincirden türetildi</span>' : '')],
      ['Tamamlanan adım', adimlar.length
        ? '<b class="u-num">' + onaylananAdim + '</b> / ' + adimlar.length : null],
      ['Son onaylayan', sonOnay ? GV.user(sonOnay.kisi, { sm:true }) : null],
      ['Son onay tarihi', sonOnay ? '<span class="cell-date">' + F.dt(sonOnay.tarih) + '</span>' : null],
      ['Son onay notu', sonOnay && sonOnay.not ? esc(sonOnay.not) : null],
      ['Bekleyen adım', bekleyenAdim ? esc(bekleyenAdim.makam) + '<span class="cell-sub">' +
        esc(DB.empName(bekleyenAdim.kisi)) + '</span>' : null],
      ['Onay talebini açan <span class="u-faint">(dokümanı yükleyen)</span>', GV.user(d.yukleyen, { sm:true })],
      ['Kayıt yükleme tarihi', '<span class="cell-date">' + F.date(d.tarih) + '</span>']
    ]) + onayAksiyon + '</div>' +
    (adimlar.length
      ? '<div class="gc-body">' + GV.chain(adimlar.map(function(a){
          return { rol:a.makam, kisi:DB.empName(a.kisi), durum:a.durum, tarih:a.tarih, not:a.not };
        })) + '</div>'
      : '<div class="gc-body flush">' +
        GV.empty({ icon:'i-stamp', title:'Onay adımı kaydı yok',
          desc:'Çok adımlı dijital onay akışı bu doküman için veride tanımlı değil.',
          action:'<a class="btn btn-acc" href="app-panel-onaylar.html">Onay merkezine git</a>' }) +
        '</div>');

  /* =================================================================
     7. AKTİVİTE GEÇMİŞİ
     ================================================================= */
  var pAktivite = '<div class="gc-body">' +
    (acts.length ? GV.activity(acts)
      : GV.empty({ icon:'i-activity', title:'Bu dokümanda kayıtlı hareket yok',
          desc:'Doküman üzerinde yapılan versiyon, onay ve süre değişiklikleri burada listelenir. ' +
               'Bu kayıt için henüz hareket girilmemiş.',
          action:'<a class="btn btn-line" href="app-dokuman.html">Doküman merkezine dön</a>' })) +
    '</div>';

  var panels = {
    genel:pGenel, versiyon:pVersiyon, sure:pSure, erisim:pErisim,
    bagli:pBagli, onay:pOnay, aktivite:pAktivite
  };

  /* =================================================================
     SAĞ ÖZET PANELİ
     ================================================================= */
  var aside =
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-info') + 'Özet</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Tür', '<span class="tag">' + esc(d.tur) + '</span>'],
      ['Klasör', esc(d.klasor)],
      ['Yükleyen', GV.user(d.yukleyen, { sm:true })],
      ['Yükleme tarihi', '<span class="cell-date">' + F.date(d.tarih) + '</span>'],
      ['Boyut / format', '<span class="tag">' + esc(d.format) + '</span> <span class="u-num">' + esc(d.boyut) + '</span>'],
      ['Versiyon', '<b class="u-num">v' + d.versiyon + '</b>'],
      ['Son kullanma', sureli ? GV.dateCell(d.sonKullanma) : '<span class="u-faint">Süresiz</span>'],
      ['Kalan gün', sureli ? kalanMetin(kalanGun) : '<span class="u-faint">—</span>'],
      ['Süre eşiği', sureEsik ? GV.badge(sureEsik.lbl, 'is-' + sureEsik.tone) : '<span class="u-faint">Takip dışı</span>'],
      ['Gizlilik', gizBadge(d.gizlilik)],
      ['Dijital onay', GV.badge(d.onay)],
      ['Kayıt durumu', d.aktif === false ? '<span class="tag">Arşiv</span>' : '<span class="badge is-ok no-dot">Aktif</span>']
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-link') + 'Bağlı Kayıt</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Müşteri', musteri
        ? '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + esc(musteri.kisa) + '</a>'
        : '<span class="u-faint">Şirket içi</span>'],
      ['Proje', proje
        ? '<a href="app-proje-detay.html?id=' + proje.kod + '">' + esc(proje.kod) + '</a>'
        : '<span class="u-faint">Projesiz</span>'],
      ['Sözleşme', sozlesme
        ? '<a href="app-sozlesme-detay.html?id=' + sozlesme.kod + '">' + esc(sozlesme.kod) + '</a>' +
          ' <span class="cell-sub">türetildi</span>'
        : '<span class="u-faint">Bağ yok</span>'],
      ['Teklif', teklif
        ? '<a href="app-teklif-detay.html?id=' + teklif.kod + '">' + esc(teklif.kod) + '</a>' +
          ' <span class="cell-sub">türetildi</span>'
        : '<span class="u-faint">Bağ yok</span>'],
      ['Aynı bağa ait doküman', '<b>' + kardes.length + '</b>']
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-lock') + 'Erişim</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Gizlilik seviyesi', gizBadge(d.gizlilik)],
      ['İçerik erişiminiz', masked
        ? '<span class="badge is-danger no-dot">Maskeli</span>'
        : '<span class="badge is-ok no-dot">Açık</span>'],
      ['İçeriği açık gören rol', gizliBelge
        ? '<b class="u-num">' + acikRol.length + '</b> rol'
        : '<span class="u-faint">Tüm roller</span>'],
      ['Doğrudan ilgili kişi', '<b>' + kisiler.length + '</b>'],
      ['Dışa aktarma yetkiniz', canDisa ? 'Var' : '<span class="u-faint">Yok</span>']
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3))
      : '<p class="u-sm u-faint">Bu doküman kartında henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =================================================================
     AKSİYON BAĞLAMA
     ================================================================= */
  mount.addEventListener('click', function(e){
    if(e.target.closest('#btnVersiyon') || e.target.closest('#btnVersiyonSure')) return versiyonAkisi();
    if(e.target.closest('#btnOnay')) return onayAkisi();
  });
});
</script>
</body>
</html>
