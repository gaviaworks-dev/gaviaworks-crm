<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Süresi Dolanlar — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="dokuman" data-screen="doksure">
<div id="sureNot"></div>
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, canLog = GV.perm.can('log');

  /* ---- kapsam: yalnız son kullanma tarihi tanımlı dokümanlar ---- */
  function scope(){ return DB.documents.filter(function(x){ return x.sonKullanma != null; }); }

  /* ---- yardımcılar ---- */
  var cust = function(k){ return DB.customers.filter(function(c){ return c.kod === k; })[0] || null; };
  var proj = function(k){ return DB.projects.filter(function(p){ return p.kod === k; })[0] || null; };
  function custName(k){ var c = cust(k); return c ? c.kisa : ''; }
  function projName(k){ var p = proj(k); return p ? p.ad : ''; }

  /* Gizlilik maskesi — 'Gizli' ve 'Kişisel veri' dokümanlarında doküman ADI,
     log/denetim yetkisi olmayan rollerde maskelenir. Kod, tür ve tarihler açık kalır. */
  function masked(x){ return !canLog && (x.gizlilik === 'Gizli' || x.gizlilik === 'Kişisel veri'); }

  /* ---- Hatırlatma kaydı (VB-29 · UID-30) ---------------------------------
     Aksiyon eskiden yalnız yeşil toast basıyordu; "şu kayda şu tarihte
     hatırlatma gönderildi" ekseni hiçbir koleksiyonda yoktu. `DB.reminders`
     açıldı; aksiyon artık gerçek kayıt yazıyor ve alıcının bildirim kutusuna
     da düşüyor (iki ayrı olgu: gönderim logu + kullanıcı bildirimi).        */
  function htrKod(){
    var n = DB.reminders.reduce(function(m, r){
      var x = +String(r.kod).split('-')[2];
      return x > m ? x : m;
    }, 0);
    return 'HTR-' + String(DB.today).slice(0,4) + '-' + ('00' + (n + 1)).slice(-3);
  }
  function bldKod(){
    var n = DB.notifications.reduce(function(m, r){
      var x = +String(r.kod).split('-')[1];
      return x > m ? x : m;
    }, 0);
    return 'BLD-' + (n + 1);
  }
  function hatirlatmaYaz(x){
    var alici = x.yukleyen;
    DB.reminders.unshift({
      kod:htrKod(), kayit:x.kod, tur:'Doküman yenileme', tarih:DB.today + 'T09:00',
      kanal:'Sistem içi', gonderen:GV.session.emp, alici:alici, durum:'Gönderildi'
    });
    DB.notifications.unshift({
      kod:bldKod(), tur:'Belge süresi',
      baslik:etiket(x) + ' yenileme hatırlatması',
      ozet:'Son kullanma ' + F.date(x.sonKullanma) + ' · ' + kalanText(x),
      tarih:DB.today + 'T09:00', kisi:alici, okundu:false,
      tone:kalan(x) < 0 ? 'danger' : 'warn', link:'app-dokuman-sure.html?q=' + x.kod
    });
    return alici;
  }
  function adHtml(x){
    return masked(x)
      ? '<span class="cell-mask" title="Bu dokümanın adını görüntüleme yetkiniz yok">••••••</span>'
      : esc(x.ad);
  }
  function adText(x){ return masked(x) ? '••••••' : x.ad; }
  /* modal/onay metinlerinde maskeli kayıt kendi kodu ile anılır */
  function etiket(x){ return masked(x) ? x.kod : x.ad; }

  /* kalan gün kayıtta yazılı; tazelik için son kullanma tarihinden yeniden hesaplanır */
  function kalan(x){ return x.kalanGun != null ? x.kalanGun : F.days(x.sonKullanma); }
  function durum(x){ var d = kalan(x); return d < 0 ? 'Süresi doldu' : d <= 30 ? 'Yaklaşıyor' : 'Geçerli'; }
  function kalanText(x){
    var d = kalan(x);
    if(d < 0) return Math.abs(d) + ' gün geçti';
    if(d === 0) return 'Bugün doluyor';
    return d + ' gün';
  }
  function yilEkle(iso){
    var p = String(iso).slice(0,10).split('-');
    return (parseInt(p[0],10) + 1) + '-' + p[1] + '-' + p[2];
  }

  var TUR = ['Sözleşme','Teklif','Gizlilik sözleşmesi','Proje analizi','Teknik doküman','Tasarım dosyası',
             'Test raporu','Teslim belgesi','Fatura','Personel belgesi','Zimmet formu','Araç belgesi',
             'Poliçe','Ruhsat','Muayene raporu','Satın alma belgesi'];
  var KLASOR = scope().map(function(x){ return x.klasor; })
    .filter(function(v,i,s){ return s.indexOf(v) === i; }).sort();

  GV.pageHead({ eyebrow:'Doküman Yönetimi', title:'Süresi Dolanlar',
    sub:'Son kullanma tarihi tanımlı dokümanların yenileme takibi',
    actions:[{ label:'Doküman Merkezi', icon:'i-folder', href:'app-dokuman.html' }] });

  document.getElementById('sureNot').innerHTML = '<div class="u-mb-4">' + GV.notice({
    tone:'info', icon:'i-hourglass', title:'Bu liste yalnız süre takipli dokümanları kapsar',
    text:'Ekranda son kullanma tarihi tanımlı ' + scope().length + ' doküman izlenir; arşivdeki toplam ' +
         DB.documents.length + ' dokümanın kalanında süre alanı boş olduğu için buraya düşmez. ' +
         'Sol menüdeki “Süresi Dolanlar” rozeti 30 gün ve altında kalan dokümanları sayar; ' +
         'listedeki “Yaklaşıyor” sekmesi birebir aynı koşulu kullanır. Süresiz dokümanlar ve ' +
         'klasörleme, versiyonlama, yükleme işlemleri doküman merkezinde yürütülür.',
    actions:[{ label:'Doküman Merkezine Git', href:'app-dokuman.html' }] }) + '</div>';

  /* REVİZE 13 — müşteri oturumu mu? Kapsam bildirimi buna bağlıdır. */
  var musKapsam = !!(GV.session && GV.session.musteri);

  var list = GV.list({
    /* REVİZE 13 — müşteri kapsamı: doküman bağı doğrudan ya da projesi
       üzerinden yazılı; ikisi de yoksa dosya iç dokümandır. Kapsam yalnız
       müşteri oturumunda bildirilir (iç rollerin ekranı değişmesin). */
    scopeField:musKapsam ? { musteri:function(x){
      if(x.musteri) return x.musteri;
      var p = x.proje ? DB.proj(x.proje) : null;
      return p ? p.musteri : null;
    } } : null,
    mount:'#liste', id:'doksure', key:'kod', source:scope,
    exportName:'suresi-dolan-dokumanlar', exportTitle:'Süre Takipli Dokümanlar',
    pageSize:25, views:['table','card'],
    search:{ placeholder:'Doküman kodu, adı, klasör veya tür ara', fields:['kod','ad','klasor','tur','format'],
      extra:function(x){ return DB.empName(x.yukleyen) + ' ' + custName(x.musteri) + ' ' + projName(x.proje); } },
    defaultSort:'kalanGun', defaultDir:'asc',

    kpis:[
      { label:'Süresi dolmuş', icon:'i-x-circle', tone:'danger',
        calc:function(a){ return a.filter(function(x){ return kalan(x) < 0; }).length; } },
      { label:'30 günden az kalan', icon:'i-alert', tone:'warn',
        calc:function(a){ return a.filter(function(x){ var d = kalan(x); return d >= 0 && d <= 30; }).length; } },
      { label:'90 günden az kalan', icon:'i-clock', tone:'info',
        calc:function(a){ return a.filter(function(x){ var d = kalan(x); return d >= 0 && d <= 90; }).length; } },
      { label:'Süre takipli doküman', icon:'i-hourglass', calc:function(a){ return a.length; } },
      { label:'Onayı bekleyen', icon:'i-stamp', tone:'purple',
        calc:function(a){ return a.filter(function(x){ return x.onay === 'Bekliyor'; }).length; } }
    ],

    tabs:[
      { key:'tumu', label:'Tümü', icon:'i-hourglass', filter:null },
      { key:'doldu', label:'Süresi Doldu', icon:'i-x-circle', filter:function(x){ return kalan(x) < 0; } },
      { key:'yaklasan', label:'Yaklaşıyor (≤30 gün)', icon:'i-alert',
        filter:function(x){ var d = kalan(x); return d >= 0 && d <= 30; } },
      { key:'gecerli', label:'Geçerli', icon:'i-check-circle', filter:function(x){ return kalan(x) > 30; } }
    ],

    columns:[
      { key:'kod', label:'Doküman kodu', width:'12%', locked:true, render:function(x){
          return '<a class="cell-main" href="app-dokuman.html?q=' + encodeURIComponent(x.kod) + '">' + esc(x.kod) + '</a>'; } },
      { key:'ad', label:'Doküman adı', width:'22%', cellClass:'cell-wrap', render:function(x){
          return '<span class="cell-main">' + adHtml(x) + '</span>' +
                 '<span class="cell-sub">' + esc(x.klasor) + '</span>'; },
        sortValue:function(x){ return adText(x); }, exportValue:function(x){ return adText(x); } },
      { key:'tur', label:'Tür', render:function(x){ return '<span class="tag">' + esc(x.tur) + '</span>'; } },
      { key:'klasor', label:'Klasör', visible:false, cellClass:'cell-wrap' },
      { key:'baglam', label:'Müşteri / proje', width:'16%', cellClass:'cell-wrap', sortable:false,
        render:function(x){
          if(!x.musteri && !x.proje) return '<span class="u-faint">Şirket içi doküman</span>';
          var m = x.musteri
            ? '<a class="cell-main" href="app-musteri.html?q=' + encodeURIComponent(x.musteri) + '">' + esc(custName(x.musteri) || x.musteri) + '</a>'
            : '<span class="cell-main">—</span>';
          return m + '<span class="cell-sub">' + esc(x.proje ? (projName(x.proje) || x.proje) : 'Projeye bağlı değil') + '</span>'; },
        exportValue:function(x){ return [custName(x.musteri), projName(x.proje)].filter(Boolean).join(' · '); } },
      { key:'dosya', label:'Format ve boyut', visible:false, sortable:false, render:function(x){
          return '<span class="tag">' + esc(x.format) + '</span><span class="cell-sub">' + esc(x.boyut) + '</span>'; },
        exportValue:function(x){ return x.format + ' · ' + x.boyut; } },
      { key:'versiyon', label:'Versiyon', visible:false, cellClass:'num', render:function(x){
          return '<span class="u-num">v' + x.versiyon + '</span>'; } },
      { key:'yukleyen', label:'Yükleyen', render:function(x){ return GV.user(x.yukleyen, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.yukleyen); }, exportValue:function(x){ return DB.empName(x.yukleyen); } },
      { key:'tarih', label:'Yüklenme tarihi', visible:false, render:function(x){
          return '<span class="cell-date">' + F.date(x.tarih) + '</span>'; } },
      { key:'sonKullanma', label:'Son kullanma', render:function(x){ return GV.dateCell(x.sonKullanma); } },
      { key:'kalanGun', label:'Kalan gün', cellClass:'num', sortValue:function(x){ return kalan(x); },
        render:function(x){
          var d = kalan(x);
          return '<b class="u-num">' + esc(kalanText(x)) + '</b>' +
                 (d >= 0 && d <= 30 ? '<span class="cell-sub">yenileme zamanı</span>' : ''); },
        exportValue:function(x){ return kalan(x); } },
      { key:'durum', label:'Süre durumu', sortValue:function(x){ return kalan(x); },
        render:function(x){ return GV.badge(durum(x)); }, exportValue:function(x){ return durum(x); } },
      { key:'gizlilik', label:'Gizlilik', render:function(x){
          var t = x.gizlilik === 'Gizli' ? 'is-danger' : x.gizlilik === 'Kişisel veri' ? 'is-purple' : 'is-neutral';
          return '<span class="badge ' + t + ' no-dot">' + esc(x.gizlilik) + '</span>'; } },
      { key:'onay', label:'Onay durumu', render:function(x){ return GV.badge(x.onay); } }
    ],

    filters:[
      { key:'tur', label:'Doküman türü', type:'multi', options:TUR },
      { key:'klasor', label:'Klasör', type:'multi', options:KLASOR },
      { key:'musteri', label:'Müşteri', type:'select',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'gizlilik', label:'Gizlilik seviyesi', type:'multi', options:['İç kullanım','Gizli','Kişisel veri'] },
      { key:'onay', label:'Onay durumu', type:'select', options:['Bekliyor','Onaylandı'] },
      { key:'sonKullanma', label:'Son kullanma tarihi', type:'daterange' }
    ],

    rowClass:function(x){ return kalan(x) <= 30 ? 'is-late' : ''; },

    card:function(x){
      return '<div class="gv-rcard-top"><div><span class="cell-main">' + adHtml(x) + '</span>' +
        '<div class="cell-sub">' + esc(x.klasor) + '</div>' +
        '<div class="cell-code">' + esc(x.kod) + ' · ' + esc(x.tur) + ' · v' + x.versiyon + '</div></div>' +
        GV.badge(durum(x)) + '</div>' +
        '<div class="gv-rcard-meta"><span>' + GV.ico('i-calendar','ic-sm') + F.date(x.sonKullanma) + '</span>' +
        '<span>' + esc(kalanText(x)) + '</span></div>' +
        '<div class="gv-rcard-foot">' + GV.user(x.yukleyen, { sm:true }) + GV.badge(x.onay) + '</div>';
    },
    mobile:function(x){
      return '<div class="gv-mrow-top"><span class="cell-main">' + adHtml(x) + '</span>' +
        GV.badge(durum(x)) + '</div>' +
        '<div class="gv-mrow-code">' + esc(x.kod) + ' · ' + esc(x.tur) + ' · v' + x.versiyon + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-calendar','ic-sm') + 'Son kullanma: ' + F.date(x.sonKullanma) + '</span>' +
        '<span>' + GV.ico('i-hourglass','ic-sm') + esc(kalanText(x)) + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.onay) + '</span>' +
        GV.user(x.yukleyen, { sm:true }) + '</div>';
    },

    rowActions:[
      { key:'merkez', icon:'i-external', label:'Doküman merkezinde aç',
        href:function(x){ return 'app-dokuman.html?q=' + encodeURIComponent(x.kod); } },
      { key:'musteri', icon:'i-building', label:'Müşteriyi aç',
        href:function(x){ return x.musteri ? 'app-musteri.html?q=' + encodeURIComponent(x.musteri) : null; },
        run:function(x){ GV.toast(etiket(x) + ' bir müşteriye bağlı değil; şirket içi doküman.', 'info'); } },
      { key:'hatirlat', icon:'i-bell', label:'Yenileme hatırlatması gönder', run:function(x){
          var d = kalan(x);
          GV.confirm({ title:'Yenileme hatırlatması',
            text:etiket(x) + ' dokümanı için hatırlatma, dokümanı yükleyen ' + DB.empName(x.yukleyen) +
                 ' kişisine gönderilecek. Son kullanma ' + F.date(x.sonKullanma) + ' · ' + kalanText(x) +
                 (d < 0 ? ' (süre dolmuş)' : '') + '.',
            okLabel:'Hatırlatmayı gönder', tone:d < 0 ? 'danger' : 'warn' })
            .then(function(ok){
              if(!ok) return;
              var alici = hatirlatmaYaz(x);
              GV.toast('Hatırlatma ' + DB.empName(alici) + ' kişisine gönderildi ve kayda yazıldı', 'ok');
              GV.refresh(); }); } },
      { key:'versiyon', icon:'i-upload', label:'Yeni versiyon yükle', run:function(x, refresh){
          var yeniSon = yilEkle(x.sonKullanma);
          var up;
          var m = GV.modal({ title:'Yeni versiyon yükle', icon:'i-upload', size:'sm',
            text:etiket(x) + ' · mevcut sürüm v' + x.versiyon,
            body:'<div class="gv-fields">' +
              '<div class="field f-col-12"><label for="vSon">Yeni son kullanma tarihi</label>' +
                '<input type="date" class="inp" id="vSon" value="' + esc(yeniSon) + '">' +
                '<div class="f-hint">Varsayılan olarak mevcut tarihin bir yıl sonrası önerilir.</div></div>' +
              '<div class="field f-col-12" id="vUp"></div>' +
              '<div class="field f-col-12"><label for="vNot">Versiyon notu (opsiyonel)</label>' +
                '<textarea id="vNot" rows="2" placeholder="Örn. Yenilenen belge, imzalı nüsha"></textarea></div>' +
            '</div>',
            actions:[{ label:'Vazgeç', cls:'btn-line' },
              { label:'Versiyonu kaydet', cls:'btn-acc', onClick:function(close, el){
                  if(!up || !up.files().length){ GV.toast('Yeni versiyon için dosya seçmelisiniz', 'danger'); return false; }
                  var son = el.querySelector('#vSon').value;
                  if(!son){ GV.toast('Yeni son kullanma tarihi zorunludur', 'danger'); return false; }
                  if(son <= DB.today){ GV.toast('Son kullanma tarihi bugünden ileri olmalıdır', 'danger'); return false; }
                  x.versiyon = x.versiyon + 1;
                  x.sonKullanma = son;
                  x.kalanGun = F.days(son);
                  x.tarih = DB.today;
                  GV.toast('v' + x.versiyon + ' yüklendi · yeni son kullanma ' + F.date(son), 'ok');
                  refresh();
                } }] });
          up = GV.upload({ mount:m.el.querySelector('#vUp'), multiple:false,
            accept:'.pdf,.docx,.xlsx,.png,.jpg',
            title:'Yenilenen dosyayı seçin veya sürükleyip bırakın',
            hint:'PDF, DOCX, XLSX, PNG · en fazla 20 MB · prototipte dosya içeriği saklanmaz' }); } }
    ],

    bulk:[
      { key:'hatirlat', label:'Hatırlatma gönder', icon:'i-bell',
        confirm:'Seçili {n} doküman için yenileme hatırlatması, dokümanları yükleyen kişilere gönderilecek.',
        run:function(ids){
          var kisi = [], n = 0;
          ids.forEach(function(k){
            var d = scope().filter(function(x){ return x.kod === k; })[0];
            if(!d) return;
            var alici = hatirlatmaYaz(d);
            n++;
            if(alici && kisi.indexOf(alici) === -1) kisi.push(alici);
          });
          GV.toast(n + ' doküman için ' + kisi.length + ' kişiye hatırlatma yazıldı', n ? 'ok' : 'info'); } },
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true }
    ],

    emptyState:{ icon:'i-hourglass', title:'Bu görünümde süre takipli doküman yok',
      desc:'Yalnız son kullanma tarihi tanımlı dokümanlar burada izlenir. Sözleşme, poliçe ve ' +
           'gizlilik sözleşmesi gibi belgelere doküman merkezinden son kullanma tarihi verildiğinde ' +
           'kayıt bu listeye düşer.' }
  });

});
</script>
</body>
</html>
