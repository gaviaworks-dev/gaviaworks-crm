<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Görev Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="gorev" data-screen="bana">
<!-- UID-15 — shell iskeleti ARTIK ELLE YAZILMIYOR. `buildSkeleton()` gövdedeki
     içeriği koruyup rail/menü/üstbar/main sarmalayıcısını kendisi kurar; böylece
     20 satırlık markup 13 ekranda tekrarlanmaz, kopyalanan `.gv-divider`ın
     `aria-controls` niteliğini kaybetmesi sorunu da kökten biter. -->
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<!-- ops.js: DB.tickets (görevin kaynağı — destek talebi) · misc.js: DB.messages + DB.channels
     (görevin kaynağı — sohbet mesajı). Ders L-12: okunan koleksiyonun dosyası yüklenmezse
     hata sayfa açılışında değil, o bölüm çizilirken patlar. -->
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<!-- domain.js: `GV.task` (REVİZE 02) buradan gelir. Bu ekran durum geçişini beş
     oturumdur KENDİ İÇİNDE yazıyordu — hedefi doğrudan `t.durum`a atıyor, geçiş
     tablosunun `yetki` ve `zorunlu` alanlarını yalnız ipucu metni olarak basıyordu.
     Mutasyon ortak katmana taşındı; ekran artık yalnız çağırıp sonucu raporlar.
     Yükleme sırası zorunlu: veri → shell → ui → domain. -->
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var id = new URLSearchParams(location.search).get('id') || 'GRV-2026-101';
  var t = DB.tasks.filter(function(x){ return x.kod === id; })[0];

  if(!t){
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Görev bulunamadı',
      desc:'“' + esc(id) + '” numaralı görev sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-gorev.html">Görev listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(t.kod);
  document.title = t.baslik + ' — GaviaWorks CRM';

  var proje = DB.projects.filter(function(p){ return p.kod === t.proje; })[0];
  var musteri = DB.customers.filter(function(c){ return c.kod === t.musteri; })[0];
  var sprint = DB.sprints.filter(function(s){ return s.kod === t.sprint; })[0];
  var modul = DB.projectModules.filter(function(m){ return m.kod === t.modul; })[0];
  /* GÖREVİN KAYNAĞI (§22 madde 15 · 16 — VB-28). Üç eksen, üçü de veride YAZILI:
       · destek talebi → görev : `DB.tasks[].destek` (görevin kendi üstünde)
       · hata → görev          : `DB.bugs[].gorev`  (hatanın üstünde; `tasks.hata`
                                 ayna alanı bilinçli olarak YOKTUR — assumptions V-29)
       · sohbet mesajı → görev : `DB.messages[].gorev` (mesajın üstünde)
     Son ikisi ters yönden okunur; bu yüzden filtre kaynak koleksiyon üzerinde. */
  var kaynakTalep = t.destek ? DB.tickets.filter(function(x){ return x.kod === t.destek; })[0] : null;
  var kaynakHata  = DB.bugs.filter(function(b){ return b.gorev === t.kod; })[0];
  var kaynakMesaj = (DB.messages || []).filter(function(m){ return m.gorev === t.kod; })[0];
  var kaynakKanal = kaynakMesaj ? (DB.channels || []).filter(function(k){ return k.kod === kaynakMesaj.kanal; })[0] : null;
  var kaynakVar   = !!(kaynakTalep || kaynakHata || kaynakMesaj);
  var alt = DB.subtasks.filter(function(s){ return s.ustGorev === t.kod; });
  /* Kontrol maddeleri alt görevlerden AYRI koleksiyondur (PROMPT.md §12) */
  var knt = DB.checklists.filter(function(k){ return k.gorev === t.kod; })
                         .sort(function(a,b){ return a.sira - b.sira; });
  var deps = DB.taskDeps.filter(function(d){ return d.gorev === t.kod || d.bagimli === t.kod; });
  var acts = DB.activities.filter(function(a){ return a.kayit === t.kod; });
  var logs = DB.timelogs.filter(function(l){ return l.gorev === t.kod; });
  /* HARCANAN SÜRE TÜRETİLİR, SAKLANMAZ (REVİZE 02 · ders L-08).
     Zaman kaydı modalı hem `DB.timelogs`e satır yazıyor hem `t.gercekSure`'ü
     artırıyordu — çift defter. İki defter, ikisinden biri (kayıt silme, kayıt
     düzeltme, başka ekrandan giriş) değiştiği anda ayrışır ve ekran kendi
     içinde çelişir. Tek doğru kaynak zaman kayıtlarıdır; ekran onları toplar.
     `t.gercekSure` alanı veride DURUYOR (veri dosyaları başka bir sahibin) —
     bu ekran ona artık YAZMAZ ve okumaz. */
  var harcanan = logs.reduce(function(a, l){ return a + l.sure; }, 0);
  var gecikti = t.termin && F.days(t.termin) < 0 && ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) === -1;

  /* ---- REVİZE 02 · geçiş katmanı --------------------------------------
     Ekranda üç ayrı mutasyon yolu vardı (başlıktaki dropdown · "Onayla" ·
     "Revize İste") ve üçü de birbirinden habersiz `t.durum`'a yazıyordu.
     Hepsi tek yordama, `GV.task.transition`'a bağlandı. Butonlar da elle
     sayılmıyor; `GV.task.nextSteps` o kayıt + o oturum için yapılabilir
     geçişleri veriyor, ekran onu butona çeviriyor. */
  var kural   = DB.taskTransitions[t.durum] || null;
  var adimlar = GV.task ? GV.task.nextSteps(t.kod) : [];

  /* `yetki` listesi iki cins anahtar taşır: ROL ("pm") ve İLİŞKİ ("sorumlu").
     Kullanıcıya "bunu kim yapabilir" derken ikisi de okunur yazılmalı; ham
     anahtar basmak ekranda "sorumlu, pm" gibi anlamsız bir dizi bırakırdı. */
  var ILISKI_AD = { sorumlu:'görevin sorumlusu', kontrolEden:'kontrol eden',
                    onaylayan:'onaylayan', veren:'görevi veren', izleyiciler:'izleyiciler' };
  function yetkiAd(k){ return ILISKI_AD[k] || DB.roleName(k); }
  function yetkiMetin(roller){ return (roller || []).map(yetkiAd).join(', '); }

  /* Zorunlu alan anahtarı → kullanıcının formda gördüğü etiket */
  var ALAN_AD = { teslimEdilenCikti:'Teslim edilen çıktı', engelNedeni:'Engel nedeni',
                  sorumlu:'Sorumlu', revizeNot:'Revizyon notu', gecikmeNedeni:'Gecikme nedeni' };
  function alanAd(k){ return ALAN_AD[k] || k; }

  /* Hedef durum başına ikon — buton yazısı `DB.taskActionLabels`ten gelir */
  var ADIM_IKON = { 'Atandı':'i-user-plus', 'Devam ediyor':'i-play', 'Kontrolde':'i-send',
                    'Revizede':'i-refresh', 'Onay bekliyor':'i-stamp', 'Tamamlandı':'i-check',
                    'Engellendi':'i-alert', 'İptal edildi':'i-x', 'Arşivlendi':'i-archive' };

  /* Onay sekmesindeki iki kısayol da AYNI adım listesinden okunur — ayrı bir
     "hangi duruma gideyim" mantığı yazmak üçüncü bir doğruluk kaynağı olurdu. */
  var adimOnay   = adimlar.filter(function(a){ return a.hedef === 'Tamamlandı' || a.hedef === 'Onay bekliyor'; })[0];
  var adimRevize = adimlar.filter(function(a){ return a.hedef === 'Revizede'; })[0];


  /* ---- Başlık ---- */
  /* BEKLEME ÇİPİ (REVİZE 01). Bekleme bir DURUM DEĞİL, durumdan bağımsız ikinci
     eksendir: görev "Devam ediyor" olmayı sürdürür, yalnız bir şeyi bekler.
     Eskiden bunun için üç ayrı durum vardı (`Bilgi bekliyor` · `Müşteri
     bekleniyor` · `Departman bekleniyor`) ve görev ilerlemeyi bırakmış
     görünüyordu. Rozet DURUMU söyler, çip NEYİ BEKLEDİĞİNİ — yeni satır,
     yeni kart ya da yeni sekme açılmaz. */
  var beklemeCip = t.beklemeNedeni
    ? '<span class="tag" title="Bekleme nedeni' + (t.beklemeNotu ? ' — ' + esc(t.beklemeNotu) : '') + '">' +
      ico('i-clock','ic-sm') + esc(t.beklemeNedeni) + ' bekleniyor</span>'
    : '';

  /* Aksiyon butonları — eski "Durum Değiştir" dropdown'ının yerine.
     Dropdown 10 değerli sözlüğün tamamını gösteriyor, `yetki` ve `zorunlu`
     kurallarını yalnız ipucu metni olarak basıp hedefi kontrolsüz yazıyordu.
     Talimat açıkça diyor: "Kullanıcıya uzun statü dropdownları göstererek
     süreci karmaşıklaştırma." Artık yalnız yapılabilir işlem butondur.
     `izin:false` olan adım SESSİZCE ÖLÜ bırakılmaz (L-23 · UID-27 · UID-30):
     devre dışı basılır ve `title` kimin yapabileceğini söyler. */
  var adimBtn = adimlar.map(function(a, i){
    return '<button type="button" class="btn ' + a.tone + '" data-adim="' + i + '"' +
      (a.izin ? '' : ' disabled title="Bu işlemi yalnız şunlar yapabilir: ' + esc(yetkiMetin(kural && kural.yetki)) + '"') +
      '>' + ico(ADIM_IKON[a.hedef] || 'i-refresh') + ' ' + esc(a.etiket) + '</button>';
  }).join('');

  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + t.kod + '</span>' + GV.badge(t.durum) + beklemeCip + GV.pri(t.oncelik) +
        '<span class="tag">' + esc(t.tur) + '</span>' +
        (gecikti ? '<span class="badge is-danger">' + Math.abs(F.days(t.termin)) + ' gün gecikti</span>' : '') + '</div>' +
      '<h1>' + esc(t.baslik) + '</h1>' +
      '<div class="gv-rec-meta">' +
        (proje ? '<span>' + ico('i-briefcase','ic-sm') + '<a href="app-proje-detay.html?id=' + proje.kod + '">' + esc(proje.ad) + '</a></span>' : '') +
        (musteri ? '<span>' + ico('i-building','ic-sm') + '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + esc(musteri.kisa) + '</a></span>' : '') +
        '<span>' + ico('i-users','ic-sm') + esc(DB.depName(t.dep)) + '</span>' +
        '<span>' + ico('i-calendar','ic-sm') + 'Termin ' + F.date(t.termin) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="ph-actions">' +
      adimBtn +
      '<a class="btn btn-line" href="app-gorev-form.html?id=' + t.kod + '">' + ico('i-edit') + ' Düzenle</a>' +
      '<button type="button" class="btn btn-acc" id="btnSure">' + ico('i-timer') + ' Süre Ekle</button>' +
    '</div></div>';

  /* ---- Sekmeler ---- */
  var tabs = [
    { key:'genel', lbl:'Genel', ic:'i-info' },
    { key:'kontrol', lbl:'Kontrol Listesi', ic:'i-clipboard-check', cnt:knt.length + alt.length },
    { key:'bagimlilik', lbl:'Bağımlılıklar', ic:'i-git', cnt:deps.length },
    { key:'sure', lbl:'Zaman Kayıtları', ic:'i-timer', cnt:logs.length },
    { key:'onay', lbl:'Kontrol ve Onay', ic:'i-stamp' },
    { key:'dosya', lbl:'Dosyalar', ic:'i-paperclip' },
    { key:'yorum', lbl:'Yorumlar', ic:'i-chat' },
    { key:'aktivite', lbl:'Aktivite Geçmişi', ic:'i-activity', cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* ---- Panel içerikleri ---- */
  var pGenel =
    '<div class="gc-body">' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Görev Tanımı</h3></div>' +
        '<p class="u-muted" style="line-height:var(--lh-loose)">' + esc(t.aciklama) + '</p>' +
        /* Bekleme nedeni denetimi DURUM SATIRININ YANINDA durur (REVİZE 01):
           ayrı sekme, ayrı kart ya da ayrı bölüm açılmaz — bekleme kendi başına
           bir süreç değil, mevcut durumun bir niteliğidir. */
        GV.dl([
          ['Durum', GV.badge(t.durum) + (beklemeCip ? ' ' + beklemeCip : '') +
            ' <button type="button" class="btn btn-line btn-sm" id="btnBekleme">' + ico('i-clock','ic-sm') + ' ' +
            (t.beklemeNedeni ? 'Beklemeyi düzenle' : 'Bekleme nedeni ekle') + '</button>'],
          (t.beklemeNedeni ? ['Bekleme notu', t.beklemeNotu ? esc(t.beklemeNotu) : null] : null),
          ['Görev amacı', esc(t.amac)],
          ['Kabul kriterleri', esc(t.kabulKriteri)],
          ['Beklenen çıktı', esc(t.beklenenCikti)],
          ['Teslim edilen çıktı', t.teslimEdilenCikti ? esc(t.teslimEdilenCikti) : null]
        ]) +
      '</div>' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Sınıflandırma</h3></div>' +
        GV.dl([
          ['Görev türü', esc(t.tur)],
          ['Müşteri', musteri ? '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + esc(musteri.unvan) + '</a>' : null],
          ['Proje', proje ? '<a href="app-proje-detay.html?id=' + proje.kod + '">' + esc(proje.ad) + '</a>' : null],
          ['Modül', modul ? esc(modul.ad) : null],
          ['Sprint', sprint ? esc(sprint.ad) : null],
          ['Departman', esc(DB.depName(t.dep))],
          ['Etiketler', (t.etiketler || []).map(function(e){ return '<span class="tag">' + esc(e) + '</span>'; }).join(' ')]
        ]) +
      '</div>' +
      (!kaynakVar ? '' :
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Görevin Kaynağı</h3>' +
        '<p>Bu görev başka bir kayıttan doğdu; bağ veride yazılıdır, tarih ya da metin ' +
        'benzerliğinden türetilmemiştir.</p></div>' +
        GV.dl([
          ['Destek talebi', kaynakTalep
            ? '<a href="app-destek-detay.html?id=' + esc(kaynakTalep.kod) + '">' + esc(kaynakTalep.kod) + '</a>' +
              '<span class="cell-code">' + esc(kaynakTalep.baslik) + '</span>' +
              ' ' + GV.badge(kaynakTalep.durum) : null],
          ['Kaynak hata', kaynakHata
            ? '<a href="app-proje-hata-detay.html?id=' + esc(kaynakHata.kod) + '">' + esc(kaynakHata.kod) + '</a>' +
              '<span class="cell-code">' + esc(kaynakHata.baslik) + '</span>' +
              ' ' + GV.badge(kaynakHata.siddet, 'is-danger') : null],
          ['Sohbet mesajı', kaynakMesaj
            ? '<a href="app-sohbet.html?k=' + esc(kaynakMesaj.kanal) + '">' +
              esc(kaynakKanal ? kaynakKanal.ad : kaynakMesaj.kanal) + '</a>' +
              '<span class="cell-code">' + esc(kaynakMesaj.metin) + '</span>' : null]
        ]) +
      '</div>') +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Sorumluluk</h3></div>' +
        GV.dl([
          ['Görevi oluşturan', GV.user(t.olusturan, { sm:true })],
          ['Görevi veren', GV.user(t.veren, { sm:true })],
          ['Ana sorumlu', GV.user(t.sorumlu, { sm:true })],
          ['Yardımcı sorumlular', (t.yardimci || []).length ? t.yardimci.map(function(e){ return GV.user(e, { sm:true }); }).join(' ') : null],
          ['İzleyiciler', (t.izleyiciler || []).length ? t.izleyiciler.map(function(e){ return GV.user(e, { sm:true }); }).join(' ') : null],
          ['Kontrol eden', GV.user(t.kontrolEden, { sm:true })],
          ['Onaylayan', GV.user(t.onaylayan, { sm:true })]
        ]) +
      '</div>' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Zaman ve Efor</h3></div>' +
        GV.dl([
          ['Başlangıç tarihi', F.date(t.baslangic)],
          ['Termin tarihi', GV.dateCell(t.termin, { done:t.durum === 'Tamamlandı' })],
          ['Tamamlanma tarihi', t.tamamlanma ? F.date(t.tamamlanma) : null],
          ['Tahmini süre', F.hours(t.tahminiSure)],
          /* Saklanan `gercekSure` değil, zaman kayıtlarının toplamı (L-08) */
          ['Gerçekleşen süre', '<b>' + F.hours(harcanan) + '</b>' +
            '<span class="cell-sub">' + logs.length + ' zaman kaydından türetildi</span>'],
          ['Faturalandırılabilir süre', F.hours(t.faturalanabilir)],
          ['İlerleme', GV.progress(t.ilerleme)]
        ]) +
      '</div>' +
      ((t.engelNedeni || t.gecikmeNedeni || t.revizeNot) ?
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Engel ve Riskler</h3></div>' +
        GV.dl([
          ['Engel nedeni', t.engelNedeni ? esc(t.engelNedeni) : null],
          ['Gecikme nedeni', t.gecikmeNedeni ? esc(t.gecikmeNedeni) : null],
          ['Revizyon notu', t.revizeNot ? esc(t.revizeNot) : null]
        ]) + '</div>' : '') +
    '</div>';

  /* PROMPT.md §12 görev kartında "Kontrol listesi" ve "Alt görevler" AYRI iki alandır,
     bu yüzden iki ayrı blok basılır ve ilerleme İKİSİNDEN BİRLİKTE türetilir (L-08):
       kontrol maddesi (DB.checklists) → kabul koşulu, sorumlusu yok
       alt görev       (DB.subtasks)   → atanabilir iş, sorumlusu var           */
  var kntTamam = knt.filter(function(k){ return k.tamam; }).length;
  var altTamam = alt.filter(function(s){ return s.tamam; }).length;
  var toplamMadde = knt.length + alt.length;
  var toplamTamam = kntTamam + altTamam;

  function kntBlok(){
    if(!knt.length){
      return GV.notice({ tone:'neutral', icon:'i-info', title:'Kontrol maddesi tanımlanmamış',
        text:'Bu görevin kabul koşulları madde madde yazılmamış. Kabul kriteri alanı ' +
             (t.kabulKriteri ? '“' + esc(t.kabulKriteri) + '” diyor; maddelere bölmek için görevi düzenleyin.'
                             : 'da boş.') });
    }
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Kontrol listesi</h3>' +
        '<p>Görevin kabul koşulları. Sorumlusu yoktur, iş yükü doğurmaz; kontrol eden ' +
        'görevi onaylamadan önce tek tek işaretler. <b>' + kntTamam + '</b> / ' + knt.length +
        ' madde işaretli.</p></div>' +
      '<ul class="gv-checklist">' + knt.map(function(k){
        return '<li><label class="f-check"><input type="checkbox" data-knt="' + k.kod + '"' +
          (k.tamam ? ' checked' : '') + '><span>' + esc(k.madde) + '</span></label>' +
          '<span class="cell-sub">' + (k.tamam ? 'işaretlendi' : 'bekliyor') + '</span></li>';
      }).join('') + '</ul>' +
      (t.kontrolEden ? '<p class="u-xs u-faint u-mt-8">Kontrol eden: ' +
        esc(DB.empName(t.kontrolEden)) + '</p>' : '') + '</div>';
  }

  function altBlok(){
    if(!alt.length){
      return GV.notice({ tone:'neutral', icon:'i-info', title:'Alt görev yok',
        text:'Bu görev alt görevlere bölünmemiş. Alt görev, kontrol maddesinden farklı olarak ' +
             'sorumlusu olan ve iş yüküne giren bir iştir.' });
    }
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Alt görevler</h3>' +
        '<p>Kontrol maddesinden farklı olarak sorumlusu olan ve iş yüküne giren işler. ' +
        '<b>' + altTamam + '</b> / ' + alt.length + ' alt görev tamamlandı.</p></div>' +
      '<ul class="gv-checklist">' + alt.map(function(s){
        return '<li><label class="f-check"><input type="checkbox" data-sub="' + s.kod + '"' +
          (s.tamam ? ' checked' : '') + '><span>' + esc(s.baslik) + '</span></label>' +
          '<span class="cell-sub">' + esc(DB.empName(s.sorumlu)) + '</span></li>';
      }).join('') + '</ul></div>';
  }

  var pKontrol = '<div class="gc-body">' + kntBlok() + '</div>' +
    '<div class="gc-body">' + altBlok() + '</div>' +
    (toplamMadde
      ? '<div class="gc-body"><div class="u-row-between u-mb-4">' +
        '<span class="u-sm">İlerleme <span class="u-faint">· ' + knt.length + ' kontrol maddesi + ' +
          alt.length + ' alt görev üzerinden türetildi</span></span>' +
        '<span class="u-sm u-num"><b>' + toplamTamam + '</b> / ' + toplamMadde + '</span></div>' +
        GV.progress(Math.round(toplamTamam / toplamMadde * 100)) + '</div>'
      : '');

  var pBagimlilik = '<div class="gc-body">' +
    (deps.length ? '<div class="gv-tablewrap"><table class="gtable"><thead><tr><th>Görev</th><th>İlişki</th><th>Durum</th></tr></thead><tbody>' +
      deps.map(function(d){
        var other = d.gorev === t.kod ? d.bagimli : d.gorev;
        var o = DB.tasks.filter(function(x){ return x.kod === other; })[0];
        if(!o) return '';
        return '<tr><td><a class="cell-main" href="app-gorev-detay.html?id=' + o.kod + '">' + esc(o.baslik) + '</a>' +
          '<span class="cell-code">' + o.kod + '</span></td>' +
          '<td><span class="tag">' + esc(d.gorev === t.kod ? 'Bu görev ' + d.tur.toLowerCase() : d.tur) + '</span></td>' +
          '<td>' + GV.badge(o.durum) + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      : GV.empty({ icon:'i-git', title:'Bağımlılık yok', desc:'Bu görev başka bir göreve bağlı değil ve hiçbir görevi engellemiyor.' })) +
    '</div>';

  var pSure = '<div class="gc-body flush">' +
    (logs.length ? '<div class="gv-tablewrap"><table class="gtable"><thead><tr><th>Tarih</th><th>Personel</th><th>Açıklama</th><th class="num">Süre</th><th>Faturalanabilir</th><th>Onay</th></tr></thead><tbody>' +
      logs.map(function(l){
        return '<tr><td><span class="cell-date">' + F.date(l.tarih) + '</span></td>' +
          '<td>' + GV.user(l.personel, { sm:true }) + '</td>' +
          '<td>' + esc(l.aciklama) + '</td>' +
          '<td class="num"><b class="u-num">' + F.hours(l.sure) + '</b></td>' +
          '<td>' + (l.faturalanabilir ? '<span class="badge is-ok">Evet</span>' : '<span class="tag">Hayır</span>') + '</td>' +
          '<td>' + GV.badge(l.onay === 'Onaylandı' ? 'Onaylandı' : 'Bekliyor') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="gc-foot"><span class="gv-count">Toplam <b>' + F.hours(harcanan) + '</b> · Tahmini ' + F.hours(t.tahminiSure) + '</span>' +
      '<button type="button" class="btn btn-line btn-sm" id="btnSure2">' + ico('i-plus','ic-sm') + ' Süre ekle</button></div>'
      : GV.empty({ icon:'i-timer', title:'Zaman kaydı yok', desc:'Bu göreve henüz süre girilmemiş.',
          action:'<button type="button" class="btn btn-acc" id="btnSure2">Süre ekle</button>' })) +
    '</div>';

  /* ---- Kontrol ve Onay (REVİZE 02) ----
     Zincir eskiden kalkmış durum adlarına göre kuruluyordu (`Kontrol bekliyor`
     artık `Kontrolde`) ve ÜÇÜNCÜ adımı her görevde basıyordu. Oysa onay adımının
     gerekip gerekmediği saklanmaz, TÜRETİLİR (L-08): kontrol eden ile onaylayan
     aynı kişiyse kontrol zaten onaydır ve görev doğrudan `Tamamlandı`ya gider.
     O görevlerde "Onaylayan" adımı hiçbir zaman tamamlanamayacak ölü bir kutu
     olarak duruyordu — veride 26 görevin 17'sinde durum buydu. Artık basılmıyor,
     yerine tek satırlık gerekçe yazılıyor. */
  var onayGerekli  = GV.task ? GV.task.onayGerekli(t) : (t.onaylayan !== t.kontrolEden);
  var kapandi      = ['Tamamlandı','Arşivlendi'].indexOf(t.durum) !== -1;
  var teslimEdildi = ['Kontrolde','Onay bekliyor','Tamamlandı','Arşivlendi'].indexOf(t.durum) !== -1;
  var calisiyor    = ['Atandı','Devam ediyor','Revizede','Engellendi'].indexOf(t.durum) !== -1;

  var zincir = [
    { rol:'Sorumlu', kisi:DB.empName(t.sorumlu),
      durum:teslimEdildi ? 'Onaylandı' : (calisiyor ? 'Bekliyor' : '—'),
      tarih:kapandi ? t.tamamlanma : null, not:'Teslim ve çıktı yükleme' },
    /* Revizede = kontrol edenin işi geri çevirdiği tek durumdur; zincirde
       "—" göstermek bunu gizlerdi, oysa gerçekleşmiş bir karardır. */
    { rol:'Kontrol eden', kisi:DB.empName(t.kontrolEden),
      durum:t.durum === 'Kontrolde' ? 'Bekliyor'
          : t.durum === 'Revizede' ? 'Reddedildi'
          : (['Onay bekliyor','Tamamlandı','Arşivlendi'].indexOf(t.durum) !== -1 ? 'Onaylandı' : '—'),
      tarih:null, not:onayGerekli ? 'Kalite kontrolü' : 'Kalite kontrolü ve nihai onay' }
  ];
  if(onayGerekli){
    zincir.push({ rol:'Onaylayan', kisi:DB.empName(t.onaylayan),
      durum:t.durum === 'Onay bekliyor' ? 'Bekliyor' : (kapandi ? 'Onaylandı' : '—'),
      tarih:kapandi ? t.tamamlanma : null, not:'Nihai onay' });
  }

  /* İki kısayol da `GV.task.transition`a bağlı; hedef `nextSteps`ten okunur.
     Uygulanamayacak adım ÖLÜ BUTON olarak bırakılmaz — devre dışı basılır ve
     `title` nedenini söyler (L-23 · UID-27 · UID-30). */
  function onayBtn(id, adim, cls, ikon, etiket, yokMetin){
    var kapali = !adim ? yokMetin : (!adim.izin ? 'Bu işlemi yalnız şunlar yapabilir: ' + yetkiMetin(kural && kural.yetki) : null);
    return '<button type="button" class="btn ' + cls + '" id="' + id + '"' +
      (kapali ? ' disabled title="' + esc(kapali) + '"' : '') + '>' + ico(ikon) + ' ' + etiket + '</button>';
  }

  var pOnay = '<div class="gc-body">' +
    GV.chain(zincir) +
    (onayGerekli ? '' : '<p class="u-xs u-faint u-mt-8">Bu görevde kontrol eden ile onaylayan aynı kişi (' +
      esc(DB.empName(t.kontrolEden)) + '); ayrı bir onay adımı yoktur, kontrol doğrudan tamamlar.</p>') +
    GV.dl([
      ['Kalite kontrol sonucu', kapandi ? 'Başarılı' : (t.durum === 'Revizede' ? 'Revizyon istendi' : null)],
      ['Revizyon sayısı', '<b>' + t.revizyon + '</b>'],
      ['Yeniden açılma sayısı', '<b>' + t.yenidenAcilma + '</b>'],
      ['Tamamlanma kanıtı', t.teslimEdilenCikti ? esc(t.teslimEdilenCikti) : null]
    ]) +
    '<div class="u-row u-mt-8">' +
      onayBtn('btnOnayla', adimOnay, 'btn-ok', 'i-check', 'Onayla',
        'Görev “' + t.durum + '” durumunda; onaylanacak bir teslim yok.') +
      onayBtn('btnRevize', adimRevize, 'btn-danger-line', 'i-refresh', 'Revize İste',
        'Görev “' + t.durum + '” durumundan revizeye gönderilemez.') +
    '</div>' +
    '</div>';

  var pDosya = '<div class="gc-body">' +
    '<div class="gv-upload" id="upload" tabindex="0" role="button">' + ico('i-upload','ic-lg') +
      '<div class="gv-upload-title">Dosya seçin veya sürükleyip bırakın</div>' +
      '<div class="gv-upload-hint">PDF, DOCX, PNG, JPG, ZIP · en fazla 20 MB</div>' +
      '<input type="file" id="uploadInput" hidden multiple></div>' +
    '<div class="gv-filelist" id="fileList"></div></div>';

  var pYorum = '<div class="gc-body">' +
    '<div id="yorumlar">' +
      '<div class="gv-comment">' + '<span class="gv-user-ava">' + esc((DB.emp(t.veren) || {}).ini || '?') + '</span>' +
        '<div class="gv-comment-body"><div class="gv-comment-head"><span class="gv-tl-who">' + esc(DB.empName(t.veren)) + '</span>' +
        '<span class="gv-tl-when">' + F.dt(t.baslangic || DB.today) + '</span></div>' +
        '<div class="gv-comment-text">' + esc(t.amac) + '</div></div></div>' +
    '</div>' +
    '<div class="gv-comment-form"><span class="gv-user-ava">' + esc(GV.session.ini) + '</span>' +
      '<textarea id="yorumMetin" placeholder="Yorum yazın… (@ ile kişi etiketleyebilirsiniz)" rows="2"></textarea>' +
      '<button type="button" class="btn btn-acc" id="btnYorum">' + ico('i-send') + ' Gönder</button></div>' +
    '</div>';

  var pAktivite = '<div class="gc-body">' + GV.activity(acts) + '</div>';

  var panels = {
    genel:pGenel, kontrol:pKontrol, bagimlilik:pBagimlilik, sure:pSure,
    onay:pOnay, dosya:pDosya, yorum:pYorum, aktivite:pAktivite
  };

  /* ---- Yan panel ---- */
  var aside = '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-info') + 'Özet</h2></div>' +
    '<div class="gc-body"><div class="gv-summary">' +
      [['Durum', GV.badge(t.durum)],
       ['Öncelik', GV.pri(t.oncelik)],
       ['Etki seviyesi', esc(t.etki)],
       ['Aciliyet', esc(t.aciliyet)],
       ['Sorumlu', GV.user(t.sorumlu, { sm:true })],
       ['Termin', GV.dateCell(t.termin, { done:t.durum === 'Tamamlandı' })],
       ['İlerleme', '<b>%' + t.ilerleme + '</b>'],
       ['Tahmini / gerçek', F.hours(t.tahminiSure) + ' / <b>' + F.hours(harcanan) + '</b>'],
       ['Revizyon', '<b>' + t.revizyon + '</b>'],
       ['Yeniden açılma', '<b>' + t.yenidenAcilma + '</b>']
      ].map(function(p){
        return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span><span class="gv-summary-val">' + p[1] + '</span></div>';
      }).join('') +
    '</div></div></section>' +
    (proje ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-briefcase') + 'Proje</h2></div>' +
      '<div class="gc-body"><a class="cell-main" href="app-proje-detay.html?id=' + proje.kod + '">' + esc(proje.ad) + '</a>' +
      '<div class="cell-sub u-mb-4">' + esc(proje.musteriAd) + '</div>' + GV.progress(proje.ilerleme) +
      '<div class="gv-summary u-mt-4">' +
        '<div class="gv-summary-row"><span class="gv-summary-lbl">Proje yöneticisi</span><span class="gv-summary-val">' + GV.user(proje.pm, { sm:true }) + '</span></div>' +
        '<div class="gv-summary-row"><span class="gv-summary-lbl">Planlanan bitiş</span><span class="gv-summary-val">' + F.date(proje.planlananBitis) + '</span></div>' +
      '</div></div></section>' : '') +
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3)) :
      '<p class="u-sm u-faint">Bu görevde henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* ---- Aksiyonlar — hepsi gerçekten çalışır ---- */

  /* Tek mutasyon noktası. Ekran hedefi kendisi YAZMAZ; `GV.task.transition`
     geçiş tablosunu uygular (hedef geçerli mi · yetki · zorunlu alan) ve
     aktivite kaydını da o yazar. Başarısızlık DÜRÜSTÇE bildirilir — eskiden
     hiçbir kapı yoktu, her geçiş "başarılı" görünüyordu. */
  function hataMetni(res){
    if(!res) return 'Geçiş yapılamadı';
    if(res.why === 'yetki')   return 'Bu geçişi yalnız şunlar yapabilir: ' + yetkiMetin(res.roller);
    if(res.why === 'zorunlu') return 'Şu alanlar dolu olmadan geçilemez: ' + res.eksik.map(alanAd).join(', ');
    return res.why;
  }

  function uygula(hedef, ek, not){
    var res = GV.task.transition(t.kod, hedef, ek, not);
    if(!res || !res.ok){ GV.toast(hataMetni(res), 'danger'); return false; }
    /* `bildirim` geçiş tablosunda yazılı — kime haber gittiğini söylemek,
       kullanıcıya "sessizce bir şey oldu" hissi bırakmamak için. */
    var kimler = (res.bildirim || []).map(yetkiAd);
    GV.toast(t.kod + ' “' + res.gorev.durum + '” oldu' +
      (kimler.length ? ' · bildirim: ' + kimler.join(', ') : ''), 'ok');
    setTimeout(function(){ GV.refresh(); }, 700);
    return true;
  }

  /* Eksik zorunlu alanı SORAN küçük modal. Geçiş tablosu bir alanı şart
     koşuyorsa kullanıcıyı "önce görevi düzenle" diye başka ekrana yollamak
     yerine tam o alanı burada isteriz; değerler `ek` argümanı olarak geçer. */
  var KISILER = DB.employees.filter(function(e){ return e.aktif; });
  function alanGirdi(alan){
    var id = 'ek_' + alan, lbl = alanAd(alan);
    if(alan === 'sorumlu'){
      return '<div class="field f-col-12"><label for="' + id + '">' + lbl + '</label><select id="' + id + '">' +
        '<option value="">Seçin</option>' +
        KISILER.map(function(e){ return '<option value="' + esc(e.kod) + '">' + esc(e.ad + ' · ' + e.pozisyon) + '</option>'; }).join('') +
        '</select></div>';
    }
    if(alan === 'engelNedeni'){
      return '<div class="field f-col-12"><label for="' + id + '">' + lbl + '</label>' +
        '<textarea id="' + id + '" rows="2" placeholder="Görev neyle engellendi?">' + esc(t[alan] || '') + '</textarea></div>';
    }
    return '<div class="field f-col-12"><label for="' + id + '">' + lbl + '</label>' +
      '<input type="text" class="inp" id="' + id + '" value="' + esc(t[alan] || '') + '"></div>';
  }

  function eksikModal(a){
    GV.modal({
      title:a.etiket, text:t.kod + ' · “' + t.durum + '” → “' + a.hedef + '”', icon:ADIM_IKON[a.hedef] || 'i-refresh', size:'sm',
      body:'<div class="gv-fields">' + a.eksik.map(alanGirdi).join('') + '</div>' +
        '<div class="field u-mt-4"><label for="adimNot">Açıklama</label>' +
        '<textarea id="adimNot" rows="2" placeholder="Geçiş gerekçesi (isteğe bağlı)"></textarea></div>',
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:a.etiket, cls:a.tone === 'btn-line' ? 'btn-acc' : a.tone, onClick:function(close, el){
            var ek = {}, bos = [];
            a.eksik.forEach(function(alan){
              var v = (el.querySelector('#ek_' + alan).value || '').trim();
              if(!v) bos.push(alanAd(alan)); else ek[alan] = v;
            });
            if(bos.length){ GV.toast(bos.join(', ') + ' zorunludur', 'danger'); return false; }
            return uygula(a.hedef, ek, el.querySelector('#adimNot').value.trim() || null) ? undefined : false;
          } }
      ]
    });
  }

  function adimCalistir(a){
    if(!a) return;
    if(a.eksik && a.eksik.length){ eksikModal(a); return; }
    /* "Engellendi" hedefinde `eksik` BOŞ gelir: zorunluluk kaynak durumun
       kuralında yazılıdır ve `engelNedeni`yi ancak engelden ÇIKARKEN ister.
       Nedeni yazılmadan engellenen görev çıkışta takılır — kullanıcı önce
       düzenleme formuna gitmek zorunda kalır. Nedeni girildiği anda soruyoruz. */
    if(a.hedef === 'Engellendi'){
      eksikModal({ hedef:a.hedef, etiket:a.etiket, tone:a.tone, eksik:['engelNedeni'] });
      return;
    }
    /* Geri dönüşü olmayan / yıkıcı hedeflerde onay sorulur; ileri akışın
       normal adımı (Çalışmaya Başla · Kontrole Gönder) tek tıkla ilerler —
       her adıma modal koymak REVİZE 02'nin sadeleştirme amacına aykırı. */
    if(['İptal edildi','Arşivlendi','Engellendi'].indexOf(a.hedef) === -1){ uygula(a.hedef, null, null); return; }
    GV.confirm({
      title:a.etiket, tone:a.hedef === 'Arşivlendi' ? 'warn' : 'danger', okLabel:a.etiket,
      text:t.kod + ' görevi “' + t.durum + '” durumundan “' + a.hedef + '” durumuna geçecek.'
    }).then(function(ok){ if(ok) uygula(a.hedef, null, null); });
  }

  Array.prototype.forEach.call(mount.querySelectorAll('[data-adim]'), function(b){
    b.addEventListener('click', function(){ adimCalistir(adimlar[+b.dataset.adim]); });
  });

  /* BEKLEME NEDENİ (REVİZE 01) — durum DEĞİŞMEZ, yalnız neyi beklediği yazılır.
     Tek denetim hem kurar hem kaldırır; boş seçenek "beklemiyor" demektir. */
  document.getElementById('btnBekleme').addEventListener('click', function(){
    GV.modal({
      title:'Bekleme Nedeni', text:t.kod + ' · durum “' + t.durum + '” olarak kalır', icon:'i-clock', size:'sm',
      body:'<div class="field"><label for="bkNeden">Bekleme nedeni</label><select id="bkNeden">' +
        '<option value="">Beklemiyor</option>' +
        DB.taskWaitReasons.map(function(n){
          return '<option value="' + esc(n) + '"' + (t.beklemeNedeni === n ? ' selected' : '') + '>' + esc(n) + '</option>';
        }).join('') + '</select>' +
        '<div class="f-hint">Bekleme bir durum değildir; görev “' + esc(t.durum) + '” olarak kalır, yalnız neyi beklediğini söyler.</div></div>' +
        '<div class="field u-mt-4"><label for="bkNot">Bekleme notu</label>' +
        '<textarea id="bkNot" rows="2" placeholder="Ne bekleniyor?">' + esc(t.beklemeNotu || '') + '</textarea></div>',
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Kaydet', cls:'btn-acc', onClick:function(close, el){
            var neden = el.querySelector('#bkNeden').value || null;
            var notu  = el.querySelector('#bkNot').value.trim();
            var res = GV.task.bekleme(t.kod, neden, notu);
            if(!res || !res.ok){
              /* Uydurma başarı mesajı yok (L-23): ortak katman değişiklik
                 görmediyse kullanıcı da bunu okur. */
              GV.toast(res && res.why === 'zaten bu durumda'
                ? 'Bekleme nedeni zaten “' + (neden || 'yok') + '” — değişiklik yapılmadı'
                : (res ? res.why : 'İşlem yapılamadı'), 'danger');
              return false;
            }
            GV.toast(neden ? 'Bekleme nedeni: ' + neden : 'Bekleme kaldırıldı', 'ok');
            setTimeout(function(){ GV.refresh(); }, 700);
          } }
      ]
    });
  });

  function sureModal(){
    GV.modal({
      title:'Zaman Kaydı Ekle', text:t.kod + ' · ' + t.baslik, icon:'i-timer', size:'sm',
      body:'<div class="gv-fields">' +
        '<div class="field f-col-6"><label for="sTarih">Tarih</label><input type="date" class="inp" id="sTarih" value="' + DB.today + '"></div>' +
        '<div class="field f-col-6"><label for="sSure">Süre (saat)</label><input type="number" class="inp" id="sSure" min="0.25" step="0.25" value="1"></div>' +
        '<div class="field f-col-12"><label for="sAcik">Açıklama</label><input type="text" class="inp" id="sAcik" placeholder="Ne yapıldı?"></div>' +
        '<div class="field f-col-12"><label class="f-check"><input type="checkbox" id="sFatura" checked><span>Faturalandırılabilir</span></label></div>' +
        '</div>',
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Kaydet', cls:'btn-acc', onClick:function(close, el){
            var sure = parseFloat(el.querySelector('#sSure').value);
            var acik = el.querySelector('#sAcik').value.trim();
            if(!sure || sure <= 0){ GV.toast('Geçerli bir süre girin', 'danger'); return false; }
            if(!acik){ GV.toast('Açıklama zorunludur', 'danger'); return false; }
            DB.timelogs.unshift({ kod:'ZMN-' + Math.floor(Math.random()*1e4), personel:GV.session.emp,
              tarih:el.querySelector('#sTarih').value, gorev:t.kod, proje:t.proje, musteri:t.musteri,
              sure:sure, faturalanabilir:el.querySelector('#sFatura').checked, aciklama:acik, onay:'Bekliyor', aktif:true });
            /* `t.gercekSure` BURADA ARTIRILMAZ (REVİZE 02 · L-08). Eskiden hem
               zaman kaydı yazılıyor hem alan artırılıyordu; iki defter, kayıt
               silinir ya da düzeltilirse anında ayrışırdı. Harcanan süre artık
               `DB.timelogs` toplamından türetiliyor — tazelemede kendiliğinden
               doğru gelir. */
            GV.toast(F.hours(sure) + ' zaman kaydı eklendi', 'ok');
            setTimeout(function(){ GV.refresh(); }, 700);
          } }
      ]
    });
  }
  document.getElementById('btnSure').addEventListener('click', sureModal);
  GV.on(document, 'click', function(e){ if(e.target.closest('#btnSure2')) sureModal(); }, 'sure');

  /* Kontrol ve Onay sekmesinin iki kısayolu (REVİZE 02).
     Eskiden ikisi de geçiş tablosunu TAMAMEN atlıyordu: "Onayla" doğrudan
     `t.durum='Tamamlandı'` yazıyor, kontrol eden ile onaylayanın farklı olduğu
     görevlerde onay adımını sessizce atlıyordu; "Revize İste" ise sözlükten
     kalkmış `Revize bekliyor` değerini yazıyordu. Üç yol da artık tek yordamdan
     geçiyor; revizyon sayacını ve aktivite kaydını da o yordam yönetiyor. */
  GV.on(document, 'click', function(e){
    if(e.target.closest('#btnOnayla') && adimOnay){
      GV.confirm({
        title:'Görevi onayla', okLabel:adimOnay.etiket,
        text:t.kod + ' görevi “' + adimOnay.hedef + '” durumuna geçecek.' +
          (onayGerekli && adimOnay.hedef === 'Onay bekliyor'
            ? ' Kontrol eden ile onaylayan farklı olduğu için nihai onay ' + DB.empName(t.onaylayan) + ' tarafından verilecek.'
            : '')
      }).then(function(ok){
        if(!ok) return;
        if(adimOnay.eksik && adimOnay.eksik.length){ eksikModal(adimOnay); return; }
        uygula(adimOnay.hedef, null, 'Kontrol ve Onay sekmesinden onaylandı');
      });
    }
    if(e.target.closest('#btnRevize') && adimRevize){
      GV.modal({ title:'Revize İste', text:'Revizyon gerekçesini yazın.', icon:'i-refresh', tone:'warn', size:'sm',
        body:'<div class="field"><label for="revNot">Revizyon notu</label><textarea id="revNot" rows="3" placeholder="Neyin düzeltilmesi gerekiyor?"></textarea></div>',
        actions:[{ label:'Vazgeç', cls:'btn-line' },
          { label:'Revize iste', cls:'btn-danger', onClick:function(close, el){
              var n = el.querySelector('#revNot').value.trim();
              if(!n){ GV.toast('Revizyon notu zorunludur', 'danger'); return false; }
              /* Not `ek` olarak geçer: geçişle birlikte yazılır ve zorunlu alan
                 denetiminde de sayılır — ekran alanı kendisi atamaz. */
              return uygula('Revizede', { revizeNot:n }, n) ? undefined : false;
            } }] });
    }
  }, 'durum');

  /* Kontrol listesi ve alt görevler — canlı ilerleme.
     İlerleme İKİ kümeden birlikte türetilir; hangi kutu işaretlenirse işaretlensin
     aynı orandan hesaplanır (L-08 — yüzde ayrıca saklanmaz). */
  mount.addEventListener('change', function(e){
    var c = e.target.closest('[data-sub], [data-knt]');
    if(!c) return;
    if(c.dataset.sub){
      var s = alt.filter(function(x){ return x.kod === c.dataset.sub; })[0];
      if(s) s.tamam = c.checked;
    } else {
      var k = knt.filter(function(x){ return x.kod === c.dataset.knt; })[0];
      if(k) k.tamam = c.checked;
    }
    var done = knt.filter(function(x){ return x.tamam; }).length +
               alt.filter(function(x){ return x.tamam; }).length;
    var tum  = knt.length + alt.length;
    if(!tum) return;
    var pct = Math.round(done / tum * 100);
    t.ilerleme = pct;
    var bar = mount.querySelector('[data-panel=kontrol] .gv-progress span');
    var val = mount.querySelector('[data-panel=kontrol] .gv-progress-val');
    if(bar) bar.style.width = pct + '%';
    if(val) val.textContent = pct + '%';
    GV.toast(done + ' / ' + tum + ' madde tamamlandı', 'ok', 1600);
  });

  /* Yorum ekleme */
  GV.on(document, 'click', function(e){
    if(!e.target.closest('#btnYorum')) return;
    var ta = document.getElementById('yorumMetin');
    var v = ta.value.trim();
    if(!v){ GV.toast('Yorum boş olamaz', 'danger'); ta.focus(); return; }
    document.getElementById('yorumlar').insertAdjacentHTML('beforeend',
      '<div class="gv-comment"><span class="gv-user-ava">' + esc(GV.session.ini) + '</span>' +
      '<div class="gv-comment-body"><div class="gv-comment-head"><span class="gv-tl-who">' + esc(GV.session.ad) + '</span>' +
      '<span class="gv-tl-when">az önce</span></div><div class="gv-comment-text">' + esc(v) + '</div></div></div>');
    ta.value = '';
    GV.toast('Yorumunuz eklendi', 'ok');
  }, 'onay');

  /* Dosya yükleme */
  var up = document.getElementById('upload'), upIn = document.getElementById('uploadInput'), fl = document.getElementById('fileList');
  function showFiles(files){
    fl.innerHTML = Array.prototype.map.call(files, function(f){
      return '<div class="gv-file"><span class="gv-file-ico">' + ico('i-file','ic-sm') + '</span>' +
        '<span><span class="gv-file-name">' + esc(f.name) + '</span><span class="gv-file-meta">' +
        (f.size > 1048576 ? (f.size/1048576).toFixed(1) + ' MB' : Math.round(f.size/1024) + ' KB') + '</span></span>' +
        '<button type="button" class="ia is-danger" data-rmfile aria-label="Kaldır">' + ico('i-x','ic-sm') + '</button></div>';
    }).join('');
    GV.toast(files.length + ' dosya eklendi', 'ok');
  }
  up.addEventListener('click', function(){ upIn.click(); });
  up.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); upIn.click(); } });
  up.addEventListener('dragover', function(e){ e.preventDefault(); up.classList.add('is-over'); });
  up.addEventListener('dragleave', function(){ up.classList.remove('is-over'); });
  up.addEventListener('drop', function(e){ e.preventDefault(); up.classList.remove('is-over'); showFiles(e.dataTransfer.files); });
  upIn.addEventListener('change', function(){ showFiles(upIn.files); });
  fl.addEventListener('click', function(e){ if(e.target.closest('[data-rmfile]')) e.target.closest('.gv-file').remove(); });
});
</script>
</body>
</html>
