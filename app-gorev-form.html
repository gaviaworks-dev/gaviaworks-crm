<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Görev Ver — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="gorev" data-screen="bana">
<div id="rec"></div>

<!-- Okunan koleksiyonların TAMAMININ dosyası yüklenir (ders L-12):
     org.js  → DB.employees, DB.departments, DB.emp, DB.empName, DB.depName, DB.today
     crm.js  → DB.customers
     ops.js  → DB.tickets            (destek → görev bağı, components.md §9d)
     work.js → DB.tasks, DB.subtasks, DB.taskDeps, DB.taskStatuses, DB.taskTypes,
               DB.priorities, DB.impacts, DB.taskTransitions, DB.projects,
               DB.projectModules, DB.sprints, DB.bugs, DB.activities -->
<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');

  function sayi(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function tam(v){ return Math.round(sayi(v)); }
  function metinDizi(t){
    return String(t == null ? '' : t).split(',').map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length > 0; });
  }

  /* =================================================================
     MOD — adreste id varsa düzenleme, yoksa yeni kayıt
     ================================================================= */
  var qs      = new URLSearchParams(location.search);
  var id      = qs.get('id');
  var kayit   = id ? DB.tasks.filter(function(x){ return x.kod === id; })[0] : null;
  var duzenle = !!kayit;

  /* Adreste id var ama kayıt yok — uydurma yok, boş forma da düşülmez. */
  if(id && !kayit){
    GV.shell.crumb('Kayıt bulunamadı');
    GV.pageHead({
      eyebrow:'İş Takibi', title:'Kayıt bulunamadı',
      sub:'Düzenlenmek istenen görev sistemde yok.',
      actions:[{ label:'Görevlere dön', cls:'btn-line', href:'app-gorev.html' }]
    });
    mount.innerHTML = '<section class="gv-card">' + GV.empty({
      icon:'i-search', title:'Görev bulunamadı',
      desc:'“' + esc(id) + '” numaralı görev bulunamadı. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-gorev.html">Görevlere dön</a>' }) + '</section>';
    return;
  }

  GV.shell.crumb(duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Görev');
  document.title = (duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Görev') + ' — GaviaWorks CRM';

  /* =================================================================
     YETKİ KAPISI — form kurulmadan önce (PROMPT.md §5 · ders L-07)
     ================================================================= */
  var can = duzenle ? GV.perm.can('duzenle') : GV.perm.can('ekle');
  if(!can){
    GV.pageHead({
      eyebrow:'İş Takibi',
      title: duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Görev',
      sub:'Bu işlem için yetkiniz yok.',
      actions:[{ label:'Görevlere dön', cls:'btn-line', href:'app-gorev.html' }]
    });
    mount.innerHTML = '<section class="gv-card">' + GV.errorState({
      title:'Bu işlem için yetkiniz yok',
      desc:(duzenle ? 'Görev düzenleme' : 'Görev oluşturma') +
           ' yetkisi rolünüzde (' + GV.session.rolAd + ') tanımlı değil. ' +
           'Görevleri görüntüleyebilir ama değiştiremezsiniz.' }) + '</section>';
    var acts403 = mount.querySelector('.gv-state-acts');
    if(acts403){
      acts403.innerHTML = '<a class="btn btn-line" href="app-gorev.html">Görevlere dön</a>' +
        (duzenle ? ' <a class="btn btn-acc" href="app-gorev-detay.html?id=' + kayit.kod + '">Görevi görüntüle</a>' : '');
    }
    return;                                   /* GV.form HİÇ kurulmaz */
  }

  /* =================================================================
     BAĞLAR — hepsi veride YAZILI tekil bağdan okunur (ders L-13)
       hata → görev : DB.bugs[].gorev   (görevde ayna alan YOK, components.md §9d)
       destek → görev: DB.tasks[].destek
     ================================================================= */
  var hataBagi = duzenle
    ? DB.bugs.filter(function(b){ return b.gorev === kayit.kod; })[0] || null
    : null;

  /* Hatadan doğan görevde şiddet → etki eşlemesi (components.md §9):
     şiddet 'Kritik' → etki 'Çok yüksek', diğer üçü birebir. */
  function etkiEsle(siddet){ return siddet === 'Kritik' ? 'Çok yüksek' : siddet; }

  /* Adres parametreleri: ?proje= · ?sprint= · ?hata= */
  var qsProje  = qs.get('proje');
  var qsSprint = qs.get('sprint');
  var qsHata   = qs.get('hata');
  var onProje  = qsProje  ? DB.projects.filter(function(p){ return p.kod === qsProje;  })[0] || null : null;
  var onSprint = qsSprint ? DB.sprints.filter(function(s){ return s.kod === qsSprint; })[0] || null : null;
  var onHata   = qsHata   ? DB.bugs.filter(function(b){ return b.kod === qsHata;    })[0] || null : null;
  /* Adresteki hata zaten başka bir göreve bağlıysa bağ İKİNCİ kez kurulmaz. */
  var onHataDolu = !!(onHata && onHata.gorev);
  var yeniHata   = (!duzenle && onHata && !onHataDolu) ? onHata : null;

  /* Sprint ile proje çelişirse açık verilen proje kazanır, sprint düşürülür. */
  var sprintCelisti = !!(onProje && onSprint && onSprint.proje !== onProje.kod);
  if(sprintCelisti) onSprint = null;

  /* Etki eşlemesinin uygulandığı hata kaydı (iki modda da aynı kural). */
  var hata = duzenle ? hataBagi : yeniHata;

  var destekTalebi = duzenle && kayit.destek
    ? DB.tickets.filter(function(t){ return t.kod === kayit.destek; })[0] || null : null;

  var acts = duzenle
    ? DB.activities.filter(function(x){ return x.kayit === kayit.kod; })
        .sort(function(a, b){ return String(b.tarih).localeCompare(String(a.tarih)); })
    : [];

  /* =================================================================
     SEÇENEK KÜMELERİ — durum/tür/öncelik/etki SÖZLÜKTEN gelir
     ================================================================= */
  var DURUMLAR = DB.taskStatuses;      /* 19 */
  var TURLER   = DB.taskTypes;         /* 18 */
  var ONCELIK  = DB.priorities;        /* 4  */
  var ETKILER  = DB.impacts;           /* 4  */

  /* Aciliyet için veride sözlük YOK — küme koleksiyondaki kullanılan değerlerden
     türetilir, uydurma değer eklenmez (kalıp: app-onanaliz-form.html sureBirim). */
  var ACILIYET = [];
  DB.tasks.forEach(function(t){
    if(t.aciliyet && ACILIYET.indexOf(t.aciliyet) === -1) ACILIYET.push(t.aciliyet);
  });
  if(duzenle && kayit.aciliyet && ACILIYET.indexOf(kayit.aciliyet) === -1) ACILIYET.push(kayit.aciliyet);

  /* Tekrar sıklığı sözlüğü de veride yok — aynı yordamla türetilir. */
  var TEKRARLAR = [];
  DB.tasks.forEach(function(t){
    if(t.tekrar && TEKRARLAR.indexOf(t.tekrar) === -1) TEKRARLAR.push(t.tekrar);
  });
  if(duzenle && kayit.tekrar && TEKRARLAR.indexOf(kayit.tekrar) === -1) TEKRARLAR.push(kayit.tekrar);

  /* Bağımlılık ilişki türü sözlüğü de yok; '—' sentinel'i kümeye ALINMAZ. */
  var BAGIM_TUR = [];
  DB.taskDeps.forEach(function(d){
    if(d.tur && d.tur !== '—' && BAGIM_TUR.indexOf(d.tur) === -1) BAGIM_TUR.push(d.tur);
  });

  var KISILER = DB.employees
    .filter(function(e){ return e.aktif; })
    .map(function(e){ return { value:e.kod, label:e.ad + ' · ' + e.pozisyon }; });

  var DEPARTMANLAR = DB.departments
    .filter(function(d){ return d.aktif || (duzenle && d.kod === kayit.dep); })
    .map(function(d){ return { value:d.kod, label:d.ad + (d.aktif ? '' : ' (pasif)') }; });

  var MUSTERILER = DB.customers
    .filter(function(c){ return c.aktif !== false || (duzenle && c.kod === kayit.musteri); })
    .map(function(c){ return { value:c.kod, label:c.kisa + ' · ' + c.kod }; });

  var PROJELER = DB.projects
    .filter(function(p){ return p.aktif !== false || (duzenle && p.kod === kayit.proje); })
    .map(function(p){ return { value:p.kod, label:p.ad + ' · ' + p.durum }; });

  var TALEPLER = DB.tickets
    .filter(function(t){ return t.aktif !== false || (duzenle && t.kod === kayit.destek); })
    .map(function(t){ return { value:t.kod, label:t.kod + ' · ' + t.baslik }; });

  function modulSecenek(proje){
    return DB.projectModules.filter(function(m){ return m.proje === proje; })
      .map(function(m){ return { value:m.kod, label:m.ad + ' · ' + m.durum }; });
  }
  function sprintSecenek(proje){
    return DB.sprints.filter(function(s){ return s.proje === proje; })
      .map(function(s){ return { value:s.kod, label:s.ad + ' · ' + s.durum }; });
  }

  /* =================================================================
     ALT GÖREVLER VE BAĞIMLILIKLAR — GV.form alanı DEĞİLDİR.
     Kalıp: app-teklif-form.html kalem tablosu. Tamponda tutulur,
     kaydederken gerçekten DB.subtasks / DB.taskDeps'e yazılır.
     ================================================================= */
  var altlar = duzenle
    ? DB.subtasks.filter(function(s){ return s.ustGorev === kayit.kod; })
        .map(function(s){ return { kod:s.kod, baslik:s.baslik, tamam:!!s.tamam, sorumlu:s.sorumlu }; })
    : [];

  var hamBagimlilik = duzenle
    ? DB.taskDeps.filter(function(d){ return d.gorev === kayit.kod || d.bagimli === kayit.kod; })
    : [];
  var bosBagimlilik = 0;
  var bagimliliklar = [];
  hamBagimlilik.forEach(function(d){
    var giden = d.gorev === kayit.kod;
    var digeri = giden ? d.bagimli : d.gorev;
    var hedef = digeri ? DB.tasks.filter(function(t){ return t.kod === digeri; })[0] : null;
    if(!hedef){ bosBagimlilik++; return; }        /* hedefsiz kayıt tamponlanmaz */
    bagimliliklar.push({ yon:giden ? 'giden' : 'gelen', digeri:digeri, tur:d.tur });
  });

  /* =================================================================
     FORM KAYDI
     ================================================================= */
  var EKIP = DB.employees.filter(function(e){ return e.aktif; });
  var formRec = {};

  if(duzenle){
    Object.keys(kayit).forEach(function(k){ formRec[k] = kayit[k]; });
    formRec.etiketler = (kayit.etiketler || []).join(', ');
    EKIP.forEach(function(e){
      formRec['yrd_' + e.kod] = (kayit.yardimci || []).indexOf(e.kod) !== -1;
      formRec['izl_' + e.kod] = (kayit.izleyiciler || []).indexOf(e.kod) !== -1;
    });
    formRec.aktif = kayit.aktif !== false;
  }else{
    var baslangicProje = onProje ? onProje.kod : (onSprint ? onSprint.proje : '');
    var projeKaydi = baslangicProje
      ? DB.projects.filter(function(p){ return p.kod === baslangicProje; })[0] || null : null;
    var hataProje = yeniHata
      ? DB.projects.filter(function(p){ return p.kod === yeniHata.proje; })[0] || null : null;
    if(yeniHata && !projeKaydi){ projeKaydi = hataProje; baslangicProje = hataProje ? hataProje.kod : ''; }

    /* Hatadan gelen modül/sprint yalnız aynı projedeyse ön seçilir — çapraz proje bağı yazılmaz. */
    var hataModul = (yeniHata && yeniHata.modul && baslangicProje === yeniHata.proje) ? yeniHata.modul : '';
    var hataSprint = (yeniHata && yeniHata.sprint && baslangicProje === yeniHata.proje) ? yeniHata.sprint : '';

    formRec = {
      baslik: yeniHata ? yeniHata.baslik : '',
      tur:    yeniHata ? 'Hata' : '',
      etiketler:'', aciklama:'', amac:'',
      musteri: projeKaydi ? projeKaydi.musteri : '',
      proje:   baslangicProje || '',
      modul:   hataModul,
      sprint:  onSprint ? onSprint.kod : hataSprint,
      dep:     GV.session.dep || '',
      /* Hatanın destek bağı göreve KOPYALANMAZ: talep → hata → görev zinciri
         türetilmiş bir bağdır, veride yazılı değildir (ders L-13). */
      destek:  '',
      veren:   GV.session.emp, sorumlu:'', kontrolEden:'', onaylayan:'',
      oncelik: yeniHata ? yeniHata.oncelik : 'Orta',
      etki:    yeniHata ? etkiEsle(yeniHata.siddet) : 'Orta',
      aciliyet:'Orta',
      baslangic:'', termin:'', tamamlanma:'',
      tahminiSure:'', gercekSure:0, faturalanabilir:0, ilerleme:0,
      revizyon:0, yenidenAcilma:0,
      kabulKriteri:'', beklenenCikti:'', teslimEdilenCikti:'',
      engelNedeni:'', gecikmeNedeni:'', revizeNot:'', tekrar:'',
      durum:'Havuzda', aktif:true
    };
    EKIP.forEach(function(e){ formRec['yrd_' + e.kod] = false; formRec['izl_' + e.kod] = false; });
  }

  /* =================================================================
     BAĞLAM BLOKLARI
     ================================================================= */
  function sub(t){ return '<span class="cell-sub">' + esc(t) + '</span>'; }

  var ust = '';

  if(duzenle){
    /* ---- Hata bağı: veride YAZILI tekil bağ + şiddet → etki eşlemesi ---- */
    if(hataBagi){
      var beklenenEtki = etkiEsle(hataBagi.siddet);
      ust += '<section class="gv-card"><div class="gc-body">' + GV.notice({
        tone: kayit.etki === beklenenEtki ? 'ok' : 'warn',
        title:'Bu görev bir hata kaydından doğdu',
        text:hataBagi.kod + ' (' + hataBagi.baslik + ') hatasının düzeltme görevidir. Bağ ' + hataBagi.kod +
             ' kaydının “gorev” alanında yazılı; görev kartında ayna alan tutulmaz. Hatanın şiddeti “' +
             hataBagi.siddet + '” olduğu için görevin etki seviyesi “' + beklenenEtki + '” olmalıdır' +
             (kayit.etki === beklenenEtki
               ? ' ve kayıt bu kurala uyuyor.'
               : '; kayıtta “' + kayit.etki + '” yazılı. Etki alanı eşlemeye göre düzeltilmeden kaydedilemez.') +
             ' Etki alanı bu yüzden kilitli bir kural altındadır.',
        actions:[{ label:'Hatayı aç', href:'app-proje-hata-detay.html?id=' + hataBagi.kod, cls:'btn-line' }]
      }) + '</div></section>';
    }else if(kayit.tur === 'Hata'){
      ust += '<section class="gv-card"><div class="gc-body">' + GV.notice({
        tone:'neutral', title:'Görev türü “Hata” ama bağlı bir hata kaydı yok',
        text:'Hata ↔ görev bağı yalnız hata kaydının “gorev” alanında tutulur (components.md §9d); ' +
             'görev formundan yazılamaz. Bu görevi bir hataya bağlamak için hata kartındaki ' +
             'göreve dönüştürme akışı kullanılır. Bağ kurulunca etki seviyesi hatanın şiddetinden gelir.',
        actions:[{ label:'Hata listesi', href:'app-proje-hata.html', cls:'btn-line' }]
      }) + '</div></section>';
    }

    /* ---- İlişkili kayıtlar ---- */
    var iliskiSatir = [];
    if(altlar.length) iliskiSatir.push(altlar.length + ' alt görev / kontrol maddesi');
    if(bagimliliklar.length) iliskiSatir.push(bagimliliklar.length + ' bağımlılık kaydı');
    if(destekTalebi) iliskiSatir.push(destekTalebi.kod + ' destek talebi');

    var iliskiAksiyon = [{ label:'Görev kartını aç', href:'app-gorev-detay.html?id=' + kayit.kod, cls:'btn-line' }];
    if(destekTalebi) iliskiAksiyon.push({ label:'Destek talebini aç', href:'app-destek-detay.html?id=' + destekTalebi.kod, cls:'btn-line' });

    ust += '<section class="gv-card"><div class="gc-body">' +
      GV.notice({
        tone:iliskiSatir.length ? 'warn' : 'info',
        title:iliskiSatir.length ? 'Bu göreve bağlı başka kayıtlar var' : 'Bu göreve bağlı başka kayıt yok',
        text:(iliskiSatir.length
                ? iliskiSatir.join(' · ') + '. Alt görevler ve bağımlılıklar bu formdan yönetilir; ' +
                  'kaydettiğinizde alt görev ve bağımlılık kayıtları formdaki liste ile birebir eşitlenir.'
                : 'Görev şu an alt görev, bağımlılık ve destek bağı taşımıyor. Aşağıdaki listelerden ekleyebilirsiniz.'),
        actions:iliskiAksiyon }) +
      (bosBagimlilik
        ? GV.notice({ tone:'danger', title:'Hedefi olmayan bağımlılık kaydı bulundu',
            text:'Bu görevin ' + bosBagimlilik + ' bağımlılık kaydında karşı görev boş (bagimli: null) ve ' +
                 'ilişki türü “—” sentinel’i. Kaydı bu formdan onaramazsınız; kaydettiğinizde bu satır ' +
                 'bağımlılık listesinden düşer. Veri düzeltmesi olarak orkestratöre bildirilmelidir.' })
        : '') +
      '</div></section>';

    /* ---- Bağlam kartı ---- */
    var son = acts[0];
    ust += '<section class="gv-card">' +
      '<div class="gc-head"><h2 class="gc-title">' + ico('i-info') + 'Kayıt Özeti</h2>' +
        '<div class="gc-head-acts"><a class="btn btn-line btn-sm" href="app-gorev-detay.html?id=' + kayit.kod + '">' +
          ico('i-external','ic-sm') + ' Görev kartını aç</a></div></div>' +
      '<div class="gc-body">' + GV.dl([
        ['Görev numarası', '<span class="cell-code">' + esc(kayit.kod) + '</span>'],
        ['Başlık', esc(kayit.baslik)],
        ['Durum', GV.badge(kayit.durum) + (kayit.aktif === false ? ' <span class="tag">Arşiv</span>' : '')],
        ['Görev türü', '<span class="tag">' + esc(kayit.tur) + '</span>'],
        ['Öncelik / etki', GV.pri(kayit.oncelik) + ' <span class="tag">' + esc(kayit.etki) + '</span>'],
        ['Proje', kayit.proje
          ? '<a href="app-proje-detay.html?id=' + kayit.proje + '">' + esc(DB.projName(kayit.proje)) + '</a>'
          : null],
        ['Müşteri', kayit.musteri
          ? '<a href="app-musteri-detay.html?id=' + kayit.musteri + '">' +
            esc((DB.customers.filter(function(c){ return c.kod === kayit.musteri; })[0] || {}).kisa || kayit.musteri) + '</a>'
          : null],
        ['Departman', esc(DB.depName(kayit.dep))],
        ['Görevi oluşturan', GV.user(kayit.olusturan, { sm:true }) + sub('Oluşturan alanı formda değiştirilemez')],
        ['Ana sorumlu', kayit.sorumlu ? GV.user(kayit.sorumlu, { sm:true }) : null],
        ['Termin', GV.dateCell(kayit.termin, { done:kayit.durum === 'Tamamlandı' }) + sub(F.rel(kayit.termin))],
        ['İlerleme', GV.progress(kayit.ilerleme)],
        ['Son değiştiren', son ? esc(DB.empName(son.kisi)) + sub(F.dt(son.tarih) + ' · ' + son.metin) : null]
      ]) + '</div></section>';

    if(!canFinans){
      ust += '<section class="gv-card"><div class="gc-body">' + GV.notice({
        tone:'neutral', icon:'i-lock', title:'Faturalandırılabilir süre alanı bu formda yok',
        text:'Rolünüzde finansal yetki (' + GV.session.rolAd + ') tanımlı olmadığı için faturalandırılabilir ' +
             'süre alanı forma hiç basılmadı. Bu kaydın mevcut değeri (' + F.hours(kayit.faturalanabilir) +
             ') kaydettiğinizde olduğu gibi korunur.' }) + '</div></section>';
    }
  }else{
    /* ---- Yeni kayıt: ne olacağı + adres parametrelerinin sonucu ---- */
    var yeniNot = GV.notice({ tone:'info', title:'Yeni görev kaydı oluşturuluyor',
      text:'Kaydettiğinizde sıradaki görev numarası atanır, görevi oluşturan olarak siz (' + GV.session.ad +
           ') yazılır, aktivite geçmişine “Görev oluşturuldu” satırı düşer, girdiğiniz alt görev ve ' +
           'bağımlılık kayıtları oluşturulur ve görev listesine dönülür.',
      actions:[{ label:'Görevler', href:'app-gorev.html' }] });

    var parNot = '';
    if(qsProje && !onProje){
      parNot += GV.notice({ tone:'warn', title:'Adresteki proje bulunamadı',
        text:'“' + qsProje + '” numaralı proje sistemde yok, bu yüzden proje alanı ön seçili gelmedi.',
        actions:[{ label:'Projeler', href:'app-proje.html' }] });
    }
    if(qsSprint && !onSprint && !sprintCelisti){
      parNot += GV.notice({ tone:'warn', title:'Adresteki sprint bulunamadı',
        text:'“' + qsSprint + '” numaralı sprint sistemde yok, bu yüzden sprint alanı ön seçili gelmedi.',
        actions:[{ label:'Sprintler', href:'app-proje-sprint.html' }] });
    }
    if(sprintCelisti){
      parNot += GV.notice({ tone:'danger', title:'Adresteki sprint ile proje çelişiyor',

  sections.forEach(function(s){ (s.fields || []).forEach(function(f){ if(f.required) zorunlu.push(f.label); }); });

  /* =================================================================
     PROJEYE BAĞLI LİSTELER — proje değişince modül/sprint/müşteri yenilenir.
     Dinleyiciler mount İÇİNDEKİ düğümlere bağlanır (ders L-16).
     ================================================================= */
  var elProje   = form.el.querySelector('[name="proje"]');
  var elModul   = form.el.querySelector('[name="modul"]');
  var elSprint  = form.el.querySelector('[name="sprint"]');
  var elMusteri = form.el.querySelector('[name="musteri"]');

  function doldur(el, list, secili, bosMetin){
    if(!el) return;
    el.innerHTML = '<option value="">' + esc(bosMetin) + '</option>' +
      list.map(function(o){
        return '<option value="' + esc(o.value) + '"' + (o.value === secili ? ' selected' : '') + '>' +
               esc(o.label) + '</option>';
      }).join('');
    var varMi = list.filter(function(o){ return o.value === secili; }).length > 0;
    el.value = varMi ? secili : '';
  }

  if(elProje){
    elProje.addEventListener('change', function(){
      var kod = elProje.value;
      doldur(elModul,  modulSecenek(kod),  elModul ? elModul.value : '',  kod ? 'Modül seçin (opsiyonel)' : 'Önce proje seçin');
      doldur(elSprint, sprintSecenek(kod), elSprint ? elSprint.value : '', kod ? 'Sprint seçin (opsiyonel)' : 'Önce proje seçin');
      var p = DB.projects.filter(function(x){ return x.kod === kod; })[0];
      if(p && elMusteri) elMusteri.value = p.musteri;
      if(!kod && elMusteri) elMusteri.value = '';
    });
  }

  /* =================================================================

            var cakisma = bagimliliklar.filter(function(x, i2){
              return i2 !== idx && x.digeri === digeri && x.yon === yon; }).length;
            if(cakisma){ GV.toast('Bu görevle aynı yönde bir bağımlılık zaten var', 'danger'); return false; }

  /* =================================================================
     KAYDET
     ================================================================= */
  var ALAN_ADI = {
    baslik:'Görev başlığı', tur:'Görev türü', aciklama:'Ayrıntılı açıklama', amac:'Görev amacı',
    etiketler:'Etiketler', proje:'Proje', musteri:'Müşteri', modul:'Proje modülü', sprint:'Sprint',
    dep:'Sorumlu departman', destek:'Doğuran destek talebi', veren:'Görevi veren', sorumlu:'Ana sorumlu',
    yardimci:'Yardımcı sorumlular', izleyiciler:'İzleyiciler', kontrolEden:'Kontrol eden',
    onaylayan:'Onaylayan', oncelik:'Öncelik', etki:'Etki seviyesi', aciliyet:'Aciliyet',
    baslangic:'Başlangıç tarihi', termin:'Termin tarihi', tamamlanma:'Tamamlanma tarihi',
    tahminiSure:'Tahmini süre', gercekSure:'Gerçekleşen süre', faturalanabilir:'Faturalandırılabilir süre',
    ilerleme:'İlerleme', revizyon:'Revizyon sayısı', yenidenAcilma:'Yeniden açılma sayısı',
    kabulKriteri:'Kabul kriterleri', beklenenCikti:'Beklenen çıktı',
    teslimEdilenCikti:'Teslim edilen çıktı', engelNedeni:'Engel nedeni',
    gecikmeNedeni:'Gecikme nedeni', revizeNot:'Revizyon notu', tekrar:'Tekrar sıklığı',
    durum:'Görev durumu', aktif:'Kayıt durumu'
  };

  var KISI_ALAN = ['veren','sorumlu','kontrolEden','onaylayan'];
  var SAYI_ALAN = ['tahminiSure','gercekSure','faturalanabilir'];
  var TAM_ALAN  = ['ilerleme','revizyon','yenidenAcilma'];
  var BOS_NULL  = ['proje','musteri','modul','sprint','destek','sorumlu','kontrolEden','onaylayan',
                   'baslangic','tamamlanma','tekrar'];

  /* Tarih DB.today'den gelir; new Date() ile bugün alınmaz. */
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }

  /* Yeni kod dizi uzunluğundan değil, en yüksek mevcut numaradan üretilir. */
  function yeniKod(){
    var max = 0;
    DB.tasks.forEach(function(x){
      var m = /^GRV-\d{4}-(\d+)$/.exec(x.kod || '');
      if(m) max = Math.max(max, +m[1]);
    });
    return 'GRV-' + String(DB.today).slice(0, 4) + '-' + ('00' + (max + 1)).slice(-3);
  }

  function norm(x){
    if(Array.isArray(x)) return x.join(' | ');
    if(x == null || x === false || x === '') return '';
    return String(x);
  }
  function gorunur(k, v){
    if(Array.isArray(v)) return v.length ? v.map(function(x){
      return KISI_ALAN.indexOf(k) !== -1 || k === 'yardimci' || k === 'izleyiciler' ? DB.empName(x) : x;
    }).join(', ') : '—';
    if(v == null || v === '') return '—';
    if(k === 'aktif') return v ? 'Aktif' : 'Arşiv';
    if(KISI_ALAN.indexOf(k) !== -1) return DB.empName(v);
    if(k === 'dep') return DB.depName(v);
    if(k === 'proje') return DB.projName(v);
    if(k === 'modul') return DB.modName(v);
    if(SAYI_ALAN.indexOf(k) !== -1) return F.hours(v);
    if(k === 'ilerleme') return '%' + v;
    if(k === 'baslangic' || k === 'termin' || k === 'tamamlanma') return F.date(v);
    return String(v);
  }

  function degerleriOku(){
    var raw = form.submit();
    if(!raw) return null;

    var v = {};
    Object.keys(raw).forEach(function(k){
      if(k.indexOf('yrd_') === 0 || k.indexOf('izl_') === 0) return;
      v[k] = raw[k];
    });

    v.yardimci = EKIP.filter(function(e){ return raw['yrd_' + e.kod]; }).map(function(e){ return e.kod; });
    v.izleyiciler = EKIP.filter(function(e){ return raw['izl_' + e.kod]; }).map(function(e){ return e.kod; });
    v.etiketler = metinDizi(raw.etiketler);

    SAYI_ALAN.forEach(function(k){ if(k in v) v[k] = sayi(v[k]); });
    TAM_ALAN.forEach(function(k){ v[k] = tam(v[k]); });
    ['baslik','aciklama','amac','kabulKriteri','beklenenCikti','teslimEdilenCikti',
     'engelNedeni','gecikmeNedeni','revizeNot'].forEach(function(k){
      v[k] = String(v[k] == null ? '' : v[k]).trim();
    });
    BOS_NULL.forEach(function(k){ if(v[k] === '' || v[k] == null) v[k] = null; });
    v.aktif = !!v.aktif;

    if(!canFinans){
      /* Yetkisiz rol bu alanı hiç görmedi: düzenlemede mevcut değer korunur, yenide sıfır. */
      v.faturalanabilir = duzenle ? kayit.faturalanabilir : 0;
    }
    return v;
  }

  /* Alt görev ve bağımlılık kayıtları koleksiyonlarla eşitlenir — dizi referansı
     korunur, yerinde eklenip çıkarılır. */
  function altYaz(kod){
    var oncekiler = DB.subtasks.filter(function(s){ return s.ustGorev === kod; }).length;
    for(var i = DB.subtasks.length - 1; i >= 0; i--){
      if(DB.subtasks[i].ustGorev === kod) DB.subtasks.splice(i, 1);
    }
    altlar.forEach(function(a){
      DB.subtasks.push({ kod:a.kod, ustGorev:kod, baslik:a.baslik, tamam:!!a.tamam, sorumlu:a.sorumlu });
    });
    return oncekiler !== altlar.length || duzenle;
  }

  function bagYaz(kod){
    for(var i = DB.taskDeps.length - 1; i >= 0; i--){
      var d = DB.taskDeps[i];
      if(d.gorev === kod || d.bagimli === kod) DB.taskDeps.splice(i, 1);
    }
    bagimliliklar.forEach(function(b){
      DB.taskDeps.push(b.yon === 'giden'
        ? { gorev:kod, bagimli:b.digeri, tur:b.tur }
        : { gorev:b.digeri, bagimli:kod, tur:b.tur });
    });
  }

  function kaydet(){
    var v = degerleriOku();
    if(!v) return;

    var hedefKod;

    if(duzenle){
      hedefKod = kayit.kod;
      var degisen = 0;
      Object.keys(v).forEach(function(k){
        if(norm(kayit[k]) === norm(v[k])) return;
        DB.activities.unshift({
          kayit:kayit.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Alan güncellendi: ' + (ALAN_ADI[k] || k),
          eski:gorunur(k, kayit[k]), yeni:gorunur(k, v[k]),
          tone:k === 'durum' ? 'info' : 'accent', icon:k === 'durum' ? 'i-refresh' : 'i-edit'
        });
        kayit[k] = v[k];
        degisen++;
      });

      var altOnce = DB.subtasks.filter(function(s){ return s.ustGorev === kayit.kod; }).length;
      var bagOnce = DB.taskDeps.filter(function(d){ return d.gorev === kayit.kod || d.bagimli === kayit.kod; }).length;
      altYaz(kayit.kod);
      bagYaz(kayit.kod);
      if(altOnce !== altlar.length){
        DB.activities.unshift({ kayit:kayit.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Alt görev listesi güncellendi', eski:altOnce + ' madde', yeni:altlar.length + ' madde',
          tone:'accent', icon:'i-clipboard-check' });
        degisen++;
      }
      if(bagOnce !== bagimliliklar.length){
        DB.activities.unshift({ kayit:kayit.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Bağımlılık listesi güncellendi', eski:bagOnce + ' bağ', yeni:bagimliliklar.length + ' bağ',
          tone:'accent', icon:'i-git' });
        degisen++;
      }

      if(!degisen) GV.toast('Değişiklik yok — kayıt olduğu gibi bırakıldı', 'info');
      else GV.toast(kayit.kod + ' güncellendi · ' + degisen + ' değişiklik', 'ok');
    }else{
      hedefKod = yeniKod();
      DB.tasks.unshift(Object.assign({ kod:hedefKod, olusturan:GV.session.emp }, v));
      DB.activities.unshift({
        kayit:hedefKod, tarih:simdi(), kisi:GV.session.emp,
        metin:'Görev oluşturuldu' + (yeniHata ? ' (' + yeniHata.kod + ' hatasından)' : ''),
        eski:null, yeni:hedefKod, tone:'ok', icon:'i-plus'
      });
      altYaz(hedefKod);
      bagYaz(hedefKod);

      /* Hata → görev bağı doğan kaydın DEĞİL, hatanın üstünde tutulur (components.md §9d). */
      if(yeniHata && !yeniHata.gorev){
        yeniHata.gorev = hedefKod;
        DB.activities.unshift({
          kayit:yeniHata.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Düzeltme görevi oluşturuldu', eski:null, yeni:hedefKod, tone:'accent', icon:'i-tasks'
        });
      }
      GV.toast(hedefKod + ' oluşturuldu' +
        (altlar.length ? ' · ' + altlar.length + ' alt görev' : '') +
        (bagimliliklar.length ? ' · ' + bagimliliklar.length + ' bağımlılık' : ''), 'ok');
    }

    form.setDirty(false);
    /* location.reload() YASAK (ders L-15) — normal akış listeye dönmektir. */
    setTimeout(function(){ location.href = 'app-gorev.html'; }, 700);
  }

  GV.pageHead({
    eyebrow:'İş Takibi',
    title: duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Görev',
    sub:   duzenle
      ? 'Kayıt üzerinde yapılan değişiklikler aktivite geçmişine yazılır · ' + alanSayisi + ' alan.'
      : 'Zorunlu alanlar yıldızla işaretlidir · ' + alanSayisi + ' alan, ' + zorunlu.length + ' zorunlu.',
    actions:[
      { label:'Vazgeç', cls:'btn-line', href:'app-gorev.html' },
      { label: duzenle ? 'Değişiklikleri kaydet' : 'Görevi oluştur', cls:'btn-acc', icon:'i-check', run:kaydet }
    ]
  });

  /* Mount İÇİNDEKİ düğüm — GV.refresh() taze kopyayla değiştirir (ders L-16). */
  var altBtn = document.getElementById('kaydetAlt');
  if(altBtn) altBtn.addEventListener('click', kaydet);
});
</script>
</body>
</html>
