<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Görevler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="gorev" data-screen="bana">
<script>
/* Sözleşme: shell.js'ten ÖNCE ?t= okunur, body[data-screen] set edilir.
   Böylece sol menüdeki vurgu ile listenin aktif sekmesi aynı kalır. */
(function(){
  var t = new URLSearchParams(location.search).get('t');
  var MENU = ['havuz','bana','verdigim','departman','onay','kontrol','geciken','engel'];
  /* Parametresiz açılışta liste ilk sekmede (İş Havuzu) başlar — menü vurgusu da öyle */
  document.body.dataset.screen = MENU.indexOf(t) !== -1 ? t : 'havuz';
})();
</script>
<!-- UID-15 — shell iskeleti ARTIK ELLE YAZILMIYOR. `buildSkeleton()` gövdedeki
     içeriği koruyup rail/menü/üstbar/main sarmalayıcısını kendisi kurar; böylece
     20 satırlık markup 13 ekranda tekrarlanmaz, kopyalanan `.gv-divider`ın
     `aria-controls` niteliğini kaybetmesi sorunu da kökten biter. -->
<div class="gv-page-head">
  <div>
    <div class="ph-eyebrow">İş Takibi</div>
    <h1>Görevler</h1>
    <div class="ph-sub" data-listcount>—</div>
  </div>
  <div class="ph-actions">
    <a class="btn btn-line" href="app-istalebi.html">
      <svg class="ic" aria-hidden="true"><use href="#i-arrow-right"></use></svg> Departman Talebi
    </a>
    <a class="btn btn-acc" href="app-gorev-form.html">
      <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg> Görev Ver
    </a>
  </div>
</div>
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<!-- REVİZE 02 — durum mutasyonu ARTIK EKRANDA YAZILMIYOR. "Üzerime al" ve toplu
     arşivleme `GV.task.transition` üzerinden geçer; geçiş tablosunu, yetkiyi ve
     zorunlu alanları tek yer bilir. domain.js olmadan bu ekran kendi kuralını
     yazmak zorunda kalırdı — beş oturum boyunca olan tam olarak buydu. -->
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, me = GV.session.emp, myDep = GV.session.dep;
  var acik = function(t){ return ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) === -1; };
  var geciken = function(t){ return acik(t) && t.termin && F.days(t.termin) < 0; };

  /* Toplu atama / öncelik — tek modal, tek yordam, sayarak rapor.
     Seçim `GV.modal` ile alınır (yeni bileşen yazılmaz); uygulama
     `GV.task.ata` / `GV.task.oncelik` üzerinden geçer ve KAÇ kaydın gerçekten
     değiştiği sayılır. "N kayıt işlendi" gibi seçim sayısını tekrarlayan bir
     cümle kurulmaz — UID-27'nin tam olarak düştüğü hata buydu. */
  function topluSecim(kodlar, tur){
    var atama = tur === 'ata';
    var secenekler = atama
      ? DB.employees.filter(function(e){ return e.aktif !== false; })
          .map(function(e){ return { v:e.kod, t:e.ad + ' · ' + e.pozisyon }; })
      : DB.priorities.map(function(x){ return { v:x, t:x }; });
    GV.modal({
      title:atama ? 'Seçilen görevlere sorumlu ata' : 'Seçilen görevlerin önceliğini değiştir',
      text:kodlar.length + ' görev seçildi.' +
           (atama ? ' Havuzdaki görevler için bu işlem "Havuzda → Atandı" geçişidir; ' +
                    'zaten atanmış görevlerde yalnız sorumlu değişir, durum korunur.' : ''),
      icon:atama ? 'i-user-check' : 'i-flag', tone:'warn', size:'sm',
      body:'<div class="field"><label for="tpSec">' + (atama ? 'Sorumlu' : 'Öncelik') + '</label>' +
           '<select id="tpSec"><option value="">Seçiniz…</option>' +
           secenekler.map(function(o){
             return '<option value="' + GV.esc(o.v) + '">' + GV.esc(o.t) + '</option>'; }).join('') +
           '</select></div>',
      actions:[{ label:'Vazgeç', cls:'btn-line' },
        { label:'Uygula', cls:'btn-acc', onClick:function(close, el){
            var v = el.querySelector('#tpSec').value;
            if(!v){ GV.toast(atama ? 'Sorumlu seçilmedi' : 'Öncelik seçilmedi', 'danger'); return false; }
            var olan = 0, gecis = 0, olmayan = [];
            kodlar.forEach(function(k){
              var r = atama ? GV.task.ata(k, v) : GV.task.oncelik(k, v);
              if(r && r.ok){ olan++; if(r.bildirim || r.gecis === undefined && atama) gecis++; }
              else olmayan.push(k + ' — ' + gecisRed(r));
            });
            if(!olan) GV.toast('Hiçbir görev güncellenmedi · ' + olmayan[0], 'danger');
            else GV.toast(olan + ' görev güncellendi' +
              (atama && gecis ? ' · ' + gecis + ' tanesi havuzdan atandı' : '') +
              (olmayan.length ? ' · ' + olmayan.length + ' görev atlandı (' + olmayan[0] + ')' : ''),
              olmayan.length ? 'warn' : 'ok');
            GV.refresh();
          } }]
    });
  }

  /* REVİZE 02 — `GV.task.transition` reddini KULLANICI DİLİNE çevirir.
     Yordam `{ok:false, why:…}` döner; ekranın işi bunu yutmak değil söylemektir.
     Eskiden bu ekran kendi kapısını yazıyor ("havuzda değil") ve gerçek redde —
     yetki yok, zorunlu alan boş — hiçbir şey söylemeden geçiyordu. */
  /* `yetki` listesi ROL anahtarı da İLİŞKİ anahtarı da taşır (domain.js). Kullanıcıya
     ham anahtar gösterilmez: rol anahtarı sözlükteki adına, ilişki anahtarı ise
     “bu görevin sorumlusu” gibi bir cümleye çevrilir. `pm` ile `sorumlu` aynı
     listede yan yana durur ama aynı şey değildir. */
  var ILISKI_AD = { sorumlu:'görevin sorumlusu', kontrolEden:'kontrol eden',
                    onaylayan:'onaylayan', veren:'görevi veren' };
  function yetkiAdi(k){ return ILISKI_AD[k] || DB.roleName(k); }

  function gecisRed(r){
    if(!r) return 'Geçiş yürütülemedi.';
    if(r.why === 'yetki')
      return 'Bu geçişi yalnız şunlar yapabilir: ' + (r.roller || []).map(yetkiAdi).join(' · ') + '.';
    if(r.why === 'zorunlu')
      return 'Geçiş öncesi dolması gereken alan: ' + (r.eksik || []).join(' · ') + '.';
    return r.why ? r.why + '.' : 'Geçiş yürütülemedi.';
  }

  GV.list({
    /* UID-05 — SATIR KAPSAMI: `GV.perm.scope('gor')` kısıtlıysa bileşen kaynağı
       bu eşlemeye göre süzer ve liste üstünde bilgilendirici bir çip basar.
       Ekran yalnız hangi alanın hangi kapsama karşılık geldiğini bildirir. */
    scopeField:{ kendi:'sorumlu', departman:'dep' },
    mount:'#liste', id:'gorev', key:'kod', source:function(){ return DB.tasks; },
    exportName:'gorevler', exportTitle:'Görev Listesi', pageSize:10,
    views:['table','kanban','card','calendar'],
    /* UID-12 — sprint ve modül kodları arama metnine katılır: `?q=SPR-2026-020`
       eskiden 0 kayıt döndürüyordu, link veren ekranlar bu yüzden `f_sprint`
       kullanmak zorunda kalmıştı. */
    search:{ placeholder:'Görev, proje, sprint, müşteri veya kişi ara',
             fields:['kod','baslik','aciklama','proje','musteri','etiketler','tur'],
             extra:function(t){
               return [t.sprint || '', t.modul || '', DB.empName(t.sorumlu), DB.empName(t.veren)].join(' ');
             } },
    defaultSort:'termin',

    kpis:[
      { label:'Açık görev', icon:'i-tasks', calc:function(a){ return a.filter(acik).length; } },
      { label:'Bana verilen', icon:'i-inbox', tone:'info', href:'app-gorev.html?t=bana',
        calc:function(a){ return a.filter(function(t){ return t.sorumlu === me && acik(t); }).length; } },
      { label:'Geciken', icon:'i-alert', tone:'danger', href:'app-gorev.html?t=geciken',
        calc:function(a){ return a.filter(geciken).length; } },
      { label:'Havuzda bekleyen', icon:'i-layers', tone:'warn', href:'app-gorev.html?t=havuz',
        calc:function(a){ return a.filter(function(t){ return t.durum === 'Havuzda'; }).length; } }
    ],

    tabs:[
      { key:'havuz',     label:'İş Havuzu',        icon:'i-layers',          filter:function(t){ return t.durum === 'Havuzda'; } },
      { key:'bana',      label:'Bana Verilenler',  icon:'i-inbox',           filter:function(t){ return (t.sorumlu === me || (t.yardimci||[]).indexOf(me) !== -1) && acik(t); } },
      { key:'verdigim',  label:'Verdiğim İşler',   icon:'i-send',            filter:function(t){ return t.veren === me || t.olusturan === me; } },
      { key:'departman', label:'Departman İşleri', icon:'i-users',           filter:function(t){ return t.dep === myDep; } },
      { key:'proje',     label:'Proje İşleri',     icon:'i-briefcase',       filter:function(t){ return !!t.proje && acik(t); } },
      /* REVİZE 01 — ÇİPBAR TASARIMI DEĞİŞMEDİ, SÖZLÜĞÜ DEĞİŞTİ. İki çip kalktı:
         · `atama` (`Atama bekliyor`) `havuz` çipinin birebir ikiziydi — sözlükte
           `Atama bekliyor` ≈ `Havuzda` olduğu için aynı küme iki kez basılıyordu.
         · `kabul` (`Kabul bekliyor`) `Atandı`ya taşındı; tek kaydı da öyle.
         `kontrol` çipi duruyor ama artık `Kontrolde` süzüyor: eski değer sözlükten
         çıktı ve çip sessizce 0 kayıt döndürüyordu (UID-12'nin sınıfı — ölü buton
         değil, SESSİZ EKSİK SONUÇ).
         Yerine BEKLEME çipi geldi: bekleme artık durum değil, ikinci eksen; "kim
         neyi bekliyor" sorusu bu listede sorulur. Bekleme nedeni başına ayrı çip
         AÇILMAZ — yedi neden çipbarı listenin önüne geçirirdi; kırılım gelişmiş
         filtredeki `beklemeNedeni` alanından alınır. */
      { key:'onay',      label:'Onay Bekleyenler', icon:'i-stamp',           filter:function(t){ return t.durum === 'Onay bekliyor'; } },
      { key:'kontrol',   label:'Kontroldekiler',   icon:'i-clipboard-check', filter:function(t){ return t.durum === 'Kontrolde'; } },
      { key:'bekleme',   label:'Beklemede',        icon:'i-hourglass',       filter:function(t){ return t.beklemeNedeni != null; } },
      { key:'geciken',   label:'Gecikenler',       icon:'i-alert',           filter:geciken },
      { key:'engel',     label:'Engellenenler',    icon:'i-lock',            filter:function(t){ return t.durum === 'Engellendi'; } },
      { key:'tamam',     label:'Tamamlananlar',    icon:'i-check-circle',    filter:function(t){ return t.durum === 'Tamamlandı'; } },
      { key:'arsiv',     label:'Arşivlenenler',    icon:'i-archive',         filter:function(t){ return t.durum === 'Arşivlendi'; } },
      /* UID-12 — DIŞ BAĞLANTILARIN HEDEFİ. Bu sekme olmadan `?f_sprint=...` ile
         gelen kullanıcı varsayılan "İş Havuzu" sekmesinin süzdüğü alt kümeyi
         görüyordu: sprintin tamamlanmış görevleri görünmüyor, kanban'ın
         "Tamamlandı" kolonu boş kalıyordu. Sahte buton değil **sessiz eksik
         sonuç**. Genel kural: bir liste ekranına dışarıdan filtreli link
         veriliyorsa, o ekranda filtreyi kısıtlamayan bir "Tümü" sekmesi bulunur. */
      { key:'tumu',      label:'Tümü',             icon:'i-list',            filter:null }
    ],

    columns:[
      { key:'baslik', label:'Görev', width:'26%', cellClass:'cell-wrap', locked:true,
        render:function(t){ return '<a class="cell-main" href="app-gorev-detay.html?id=' + t.kod + '">' + GV.esc(t.baslik) + '</a>' +
          '<span class="cell-code">' + t.kod + ' · ' + GV.esc(t.tur) + '</span>'; },
        exportValue:function(t){ return t.baslik; } },
      { key:'proje', label:'Proje / Müşteri', render:function(t){
          if(!t.proje && !t.musteri) return '<span class="u-faint">İç iş</span>';
          var p = (DB.projects.filter(function(x){ return x.kod === t.proje; })[0] || {});
          var m = (DB.customers.filter(function(x){ return x.kod === t.musteri; })[0] || {});
          return '<span class="cell-main">' + GV.esc(p.ad || m.kisa || '—') + '</span>' +
                 (m.kisa && p.ad ? '<span class="cell-sub">' + GV.esc(m.kisa) + '</span>' : ''); },
        exportValue:function(t){ return t.proje || t.musteri || 'İç iş'; } },
      { key:'dep', label:'Departman', visible:false, render:function(t){ return GV.esc(DB.depName(t.dep)); } },
      { key:'atama', label:'Atayan → Sorumlu', sortable:false, render:function(t){
          return '<span class="chain-cell"><span class="cc-from">' + GV.esc(DB.empName(t.veren)) + '</span>' +
                 GV.ico('i-arrow-right','ic-sm') + '<span class="cc-to">' + GV.esc(DB.empName(t.sorumlu)) + '</span></span>'; },
        exportValue:function(t){ return DB.empName(t.veren) + ' → ' + DB.empName(t.sorumlu); } },
      { key:'termin', label:'Termin', render:function(t){
          return GV.dateCell(t.termin, { done:t.durum === 'Tamamlandı' }); } },
      { key:'oncelik', label:'Öncelik', render:function(t){ return GV.pri(t.oncelik); } },
      { key:'ilerleme', label:'İlerleme', visible:false, render:function(t){ return GV.progress(t.ilerleme); } },
      { key:'tahminiSure', label:'Tahmini / Gerçek', visible:false, cellClass:'num', render:function(t){
          return '<span class="u-num">' + F.hours(t.tahminiSure) + ' / <b>' + F.hours(t.gercekSure) + '</b></span>'; },
        exportValue:function(t){ return t.tahminiSure + ' / ' + t.gercekSure; } },
      { key:'revizyon', label:'Revizyon', visible:false, cellClass:'num' },
      /* REVİZE 01 — bekleme nedeni VARSAYILAN KOLON DEĞİLDİR. Kolon yöneticisinden
         açılır; her süzgeci her listeye kolon olarak yığmak listeyi okunmaz yapar.
         Beklemenin görünür yeri durum rozetinin yanındaki ikincil çiptir (aşağıda) —
         yeni satır ya da yeni alan açılmaz. */
      { key:'beklemeNedeni', label:'Bekleme nedeni', visible:false, cellClass:'cell-wrap',
        render:function(t){
          if(!t.beklemeNedeni) return '<span class="u-faint">Beklemiyor</span>';
          return '<span class="tag">' + GV.esc(t.beklemeNedeni) + '</span>' +
                 (t.beklemeNotu ? '<span class="cell-sub">' + GV.esc(t.beklemeNotu) + '</span>' : '');
        },
        exportValue:function(t){ return t.beklemeNedeni || ''; } },
      /* Durum rozeti + bekleme çipi TEK hücrede. Bekleme durumun yerine geçmez,
         yanına yazılır: görev "Devam ediyor" olmayı sürdürür, yalnız neyi
         beklediğini söyler. Eski sözlükte bunu anlatmanın tek yolu görevi
         "Müşteri bekleniyor" durumuna almaktı; görev ilerlemeyi bırakmış görünüyordu. */
      { key:'durum', label:'Durum', render:function(t){
          /* Çip metni “Bekliyor: X” kalıbındadır — “Müşteri bekleniyor” gibi bir
             cümle kurulmaz, çünkü o SÖZLÜKTEN ÇIKMIŞ bir durumun birebir adıdır;
             ekranda yeniden belirmesi kaldırılmadığı izlenimi verirdi. */
          return GV.badge(t.durum) +
            (t.beklemeNedeni ? ' <span class="tag">Bekliyor: ' + GV.esc(t.beklemeNedeni) + '</span>' : ''); },
        exportValue:function(t){ return t.durum + (t.beklemeNedeni ? ' (bekliyor: ' + t.beklemeNedeni + ')' : ''); } }
    ],

    filters:[
      { key:'durum', label:'Durum', type:'multi', options:DB.taskStatuses },
      /* REVİZE 01 — bekleme ekseninin kırılımı BURADA sorulur, çipbarda değil.
         `beklemeNedeni` taşımayan kayıtta alan hiç yok; süzgeç `undefined` ile
         eşleşmediği için "Müşteri" seçildiğinde yalnız gerçekten bekleyenler kalır. */
      { key:'beklemeNedeni', label:'Bekleme nedeni', type:'multi', options:DB.taskWaitReasons },
      { key:'tur', label:'Görev türü', type:'multi', options:DB.taskTypes },
      { key:'oncelik', label:'Öncelik', type:'multi', options:DB.priorities },
      { key:'sorumlu', label:'Sorumlu', type:'select',
        options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'veren', label:'Görevi veren', type:'select',
        options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'dep', label:'Departman', type:'multi',
        options:DB.departments.map(function(d){ return { value:d.kod, label:d.ad }; }) },
      { key:'proje', label:'Proje', type:'select',
        options:DB.projects.map(function(p){ return { value:p.kod, label:p.ad }; }) },
      { key:'musteri', label:'Müşteri', type:'select',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'sprint', label:'Sprint', type:'select',
        options:DB.sprints.map(function(s){ return { value:s.kod, label:s.ad }; }) },
      { key:'termin', label:'Termin aralığı', type:'daterange' }
    ],

    rowClass:function(t){ return geciken(t) ? 'is-late' : ''; },

    kanban:{ groupBy:'durum',
      /* REVİZE 01 — KOLONLAR SÖZLÜKTEN TÜRETİLİR. Burada elle yazılmış ikinci bir
         durum listesi vardı ve sözlükle ayrışmıştı: `Kontrol bekliyor` kolonu artık
         var olmayan bir değeri grupluyor (hep boş), `Revizede` kolonu ise hiç yok —
         revizedeki görev panoda görünmüyordu. Tek sözlük, tek gerçek.
         Panodan yalnız KAPANMIŞ iki uç düşer: pano canlı işin yeridir, iptal ve
         arşiv kayıtları oraya kolon açmaz (ikisi de çipbarda ve süzgeçte duruyor). */
      columns:DB.taskStatuses.filter(function(d){ return ['İptal edildi','Arşivlendi'].indexOf(d) === -1; }),
      card:function(t){
        return '<a class="gv-kcard-title" href="app-gorev-detay.html?id=' + t.kod + '">' + GV.esc(t.baslik) + '</a>' +
          '<div class="gv-kcard-meta"><span>' + t.kod + '</span>' + GV.pri(t.oncelik) + '</div>' +
          '<div class="gv-kcard-meta">' + GV.user(t.sorumlu, { sm:true }) + GV.dateCell(t.termin) + '</div>';
      } },

    /* Takvim görünümü §12'nin dördüncü görünümü. Görevler TERMİN tarihine
       yerleşir — başlangıç değil, çünkü listenin bütün gecikme ekseni terminden
       türer. Termini olmayan görev uydurma bir güne konmaz, sayısı şeritte yazılır. */
    calendar:{
      dateField:'termin',
      title:function(t){ return t.kod + ' · ' + t.baslik; },
      href:function(t){ return 'app-gorev-detay.html?id=' + t.kod; },
      tone:function(t){
        if(t.durum === 'Tamamlandı' || t.durum === 'Arşivlendi') return 'ok';
        if(geciken(t)) return 'danger';
        if(t.durum === 'Engellendi') return 'danger';
        if(t.oncelik === 'Kritik' || t.oncelik === 'Yüksek') return 'warn';
        return 'info';
      } },

    card:function(t){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-gorev-detay.html?id=' + t.kod + '">' + GV.esc(t.baslik) + '</a>' +
        '<div class="cell-code">' + t.kod + '</div></div>' + GV.pri(t.oncelik) + '</div>' +
        '<div class="gv-rcard-meta"><span>' + GV.esc(t.tur) + '</span><span>' + GV.esc(DB.depName(t.dep)) + '</span></div>' +
        GV.progress(t.ilerleme) +
        '<div class="gv-rcard-foot">' + GV.badge(t.durum) + GV.dateCell(t.termin) + '</div>';
    },

    mobile:function(t){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-gorev-detay.html?id=' + t.kod + '">' + GV.esc(t.baslik) + '</a>' +
        GV.pri(t.oncelik) + '</div>' +
        '<div class="gv-mrow-code">' + t.kod + ' · ' + GV.esc(t.tur) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-user','ic-sm') + GV.esc(DB.empName(t.sorumlu)) + '</span>' +
        '<span>' + GV.ico('i-calendar','ic-sm') + F.dateShort(t.termin) + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(t.durum) + '</span></div>';
    },

    rowActions:[
      { key:'ac', icon:'i-external', label:'Detayı aç', href:function(t){ return 'app-gorev-detay.html?id=' + t.kod; } },
      { key:'duzenle', icon:'i-edit', label:'Düzenle', href:function(t){ return 'app-gorev-form.html?id=' + t.kod; } },
      /* REVİZE 02 — "Üzerime al" ARTIK KENDİ KURALINI YAZMIYOR.
         Eskiden burada iki ihlal vardı: (a) `if(t.durum !== 'Havuzda')` geçiş
         tablosuna PARALEL, elle yazılmış bir kapıydı — tablo değişince ekran
         ayrışırdı; (b) onaydan sonra `t.sorumlu` ve `t.durum` doğrudan yazılıyordu,
         yani yetki ve zorunlu alan hiç sorulmadan, aktivite kaydı hiç düşmeden.
         Şimdi tek mutasyon noktası `GV.task.transition`; ekran yalnız çağırır ve
         reddi olduğu gibi söyler (VB-06 / VB-23 ile aynı ders).
         `show()` de tabloya sorar: `Atandı` bu kayıttan erişilebilir bir hedef
         değilse aksiyon hiç basılmaz — ikinci bir "havuzda mı" kontrolü değil. */
      { key:'uzerime', icon:'i-user-check', label:'Üzerime al',
        show:function(t){
          return GV.task.nextSteps(t.kod).some(function(a){ return a.hedef === 'Atandı'; });
        },
        run:function(t, refresh){
          GV.confirm({ title:'Görevi üzerinize alın',
            text:t.baslik + ' görevi size atanacak ve durumu “Atandı” olacak.', okLabel:'Üzerime al' })
            .then(function(ok){
              if(!ok) return;
              var r = GV.task.transition(t.kod, 'Atandı', { sorumlu:me }, 'görevi üzerine aldı');
              if(r && r.ok){ GV.toast(t.kod + ' üzerinize alındı', 'ok'); refresh(); return; }
              GV.toast(t.kod + ' üzerinize alınamadı — ' + gecisRed(r), 'warn');
            }); } }
    ],

    /* UID-27 — `run`ı olmayan toplu işlem SAHTE BAŞARI basıyordu; bileşen artık
       böyle bir maddeyi devre dışı + “bu sürümde yok” etiketiyle basıyor, yeşil
       mesaj uydurmuyor. `ata` ve `oncelik` bilerek o durumdadır: ikisi de toplu
       mutasyon ister ve `ata` sorumlu yazmak demektir — havuzdaki görevde bu bir
       DURUM GEÇİŞİDİR (`Havuzda → Atandı`), diğerlerinde düz alan yazımı. İkisini
       tek düğmeye sıkıştırmak REVİZE 02'nin kaçındığı ikinci mutasyon yolunu açardı;
       düğme yalan söylemek yerine yazılmadığını söylüyor.
       `arsiv` ise yazıldı: hedefi tek ve geçiş tablosunda tanımlı. */
    bulk:[
      /* REVİZE 02 kuyruğu — bu iki toplu işlemin `run`'ı yoktu, yani pasif
         basılıyorlardı (UID-27 düzeltmesinden sonra bileşen `run`suz aksiyona
         başarı mesajı basmıyor). Karar: ikisi de yazıldı ama mutasyon EKRANDA
         DEĞİL `GV.task`'ta durur. Atama bazı görevlerde bir GEÇİŞ
         (`Havuzda → Atandı`), bazılarında düz alan yazımıdır; bu ayrımı
         ekranda yapmak REVİZE 02'nin kapattığı ikinci mutasyon yolunu geri
         açardı. `GV.task.ata` ayrımı kendi içinde yapıyor, ekran yalnız
         seçimi soruyor ve sonucu SAYARAK raporluyor. */
      { key:'ata', label:'Sorumlu ata', icon:'i-user-check',
        run:function(kodlar){ topluSecim(kodlar, 'ata'); } },
      { key:'oncelik', label:'Öncelik değiştir', icon:'i-flag',
        run:function(kodlar){ topluSecim(kodlar, 'oncelik'); } },
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true },
      { key:'arsiv', label:'Arşivle', icon:'i-archive', tone:'danger',
        confirm:'{n} görev arşivlenecek. Arşivleme bir durum geçişidir: yalnız ' +
                'tamamlanmış ya da iptal edilmiş görevler arşivlenebilir, ' +
                'yetkisi olmayan geçişler uygulanmaz. Onaylıyor musunuz?',
        run:function(kodlar){
          var olan = [], olmayan = [];
          kodlar.forEach(function(k){
            var r = GV.task.transition(k, 'Arşivlendi', null, 'toplu arşivleme');
            if(r && r.ok) olan.push(k); else olmayan.push(k + ' — ' + gecisRed(r));
          });
          /* Kaç kaydın gerçekten değiştiği SAYILARAK yazılır; “N kayıt işlendi”
             gibi seçim sayısını tekrarlayan bir cümle kurulmaz (UID-27). */
          if(!olan.length){
            GV.toast('Hiçbir görev arşivlenemedi · ' + olmayan[0], 'danger');
          }else if(olmayan.length){
            GV.toast(olan.length + ' görev arşivlendi · ' + olmayan.length +
                     ' görev arşivlenemedi (' + olmayan[0] + ')', 'warn');
          }else{
            GV.toast(olan.length + ' görev arşivlendi', 'ok');
          }
        } }
    ],

    emptyState:{ icon:'i-tasks', title:'Bu görünümde görev yok',
      desc:'Sekmeyi veya filtreleri değiştirebilir, ya da yeni bir görev oluşturabilirsiniz.',
      action:'<a class="btn btn-acc" href="app-gorev-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Görev Ver</a>' }
  });
});
</script>
</body>
</html>
