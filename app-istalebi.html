<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Departman Talepleri — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="gorev" data-screen="istalebi">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, me = GV.session.emp, myDep = GV.session.dep;
  GV.pageHead({ eyebrow:'İş Takibi', title:'Departmanlar Arası İş Talepleri',
    actions:[{ label:'Görevler', icon:'i-tasks', href:'app-gorev.html' },
             { label:'Yeni Talep', icon:'i-plus', cls:'btn-acc', href:'app-istalebi-form.html' }] });
  var acik = function(x){ return x.durum !== 'Tamamlandı'; };
  var geciken = function(x){ return acik(x) && x.termin && F.days(x.termin) < 0; };
  GV.list({
    mount:'#liste', id:'istalebi', key:'kod', source:function(){ return DB.deptRequests; },
    exportName:'is-talepleri', exportTitle:'Departmanlar Arası İş Talepleri', pageSize:10, views:['table','kanban'],
    search:{ placeholder:'Talep no, başlık, açıklama veya tür ara', fields:['kod','baslik','aciklama','tur','beklenenCikti'] },
    defaultSort:'termin',
    kpis:[
      { label:'Açık talep', icon:'i-arrow-right', calc:function(a){ return a.filter(acik).length; } },
      { label:'Bana gelen', icon:'i-inbox', tone:'info',
        calc:function(a){ return a.filter(function(x){ return x.sorumlu === me && acik(x); }).length; } },
      { label:'Departmanıma gelen', icon:'i-users', tone:'purple',
        calc:function(a){ return a.filter(function(x){ return x.talepEdilenDep === myDep && acik(x); }).length; } },
      { label:'Geciken', icon:'i-alert', tone:'danger', calc:function(a){ return a.filter(geciken).length; } }
    ],
    tabs:[
      { key:'acik', label:'Açık Talepler', icon:'i-arrow-right', filter:acik },
      { key:'bana', label:'Bana Gelenler', icon:'i-inbox', filter:function(x){ return x.sorumlu === me; } },
      { key:'benden', label:'Benim Taleplerim', icon:'i-send', filter:function(x){ return x.talepEden === me; } },
      { key:'depbana', label:'Departmanıma Gelenler', icon:'i-users', filter:function(x){ return x.talepEdilenDep === myDep; } },
      { key:'onay', label:'Onay Bekleyenler', icon:'i-stamp', filter:function(x){ return x.onay === 'Bekliyor'; } },
      { key:'geciken', label:'Gecikenler', icon:'i-alert', filter:geciken },
      { key:'tamam', label:'Tamamlananlar', icon:'i-check-circle', filter:function(x){ return x.durum === 'Tamamlandı'; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'baslik', label:'Talep', width:'26%', locked:true, cellClass:'cell-wrap', render:function(x){
          return '<a class="cell-main" href="app-istalebi-detay.html?id=' + x.kod + '">' + esc(x.baslik) + '</a>' +
                 '<span class="cell-sub">' + esc(x.aciklama) + '</span><span class="cell-code">' + x.kod + '</span>'; } },
      { key:'tur', label:'Talep türü', render:function(x){ return '<span class="tag">' + esc(x.tur) + '</span>'; } },
      { key:'yon', label:'Departman akışı', sortable:false, render:function(x){
          return '<span class="chain-cell"><span class="cc-from">' + esc(DB.dep(x.talepEdenDep).kisa) + '</span>' +
                 GV.ico('i-arrow-right','ic-sm') + '<span class="cc-to">' + esc(DB.dep(x.talepEdilenDep).kisa) + '</span></span>'; },
        exportValue:function(x){ return DB.depName(x.talepEdenDep) + ' → ' + DB.depName(x.talepEdilenDep); } },
      { key:'talepEden', label:'Talep eden', render:function(x){ return GV.user(x.talepEden, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.talepEden); }, exportValue:function(x){ return DB.empName(x.talepEden); } },
      { key:'sorumlu', label:'Sorumlu', render:function(x){ return GV.user(x.sorumlu, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.sorumlu); }, exportValue:function(x){ return DB.empName(x.sorumlu); } },
      { key:'beklenenCikti', label:'Beklenen çıktı', visible:false, cellClass:'cell-wrap' },
      { key:'kabulKriteri', label:'Kabul kriteri', visible:false, cellClass:'cell-wrap' },
      { key:'oncelik', label:'Öncelik', render:function(x){ return GV.pri(x.oncelik); } },
      { key:'termin', label:'Termin', render:function(x){ return GV.dateCell(x.termin, { done:x.durum === 'Tamamlandı' }); } },
      { key:'onay', label:'Onay', render:function(x){ return GV.badge(x.onay); } },
      { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } }
    ],
    filters:[
      { key:'durum', label:'Talep durumu', type:'multi', options:['Bekliyor','Devam ediyor','Tamamlandı'] },
      { key:'tur', label:'Talep türü', type:'multi',
        options:['Ön analiz talebi','Ekran tasarım talebi','Test talebi','Hata çözüm talebi','Ekipman talebi','Eksik bilgi talebi'] },
      { key:'talepEdenDep', label:'Talep eden departman', type:'multi',
        options:DB.departments.map(function(d){ return { value:d.kod, label:d.ad }; }) },
      { key:'talepEdilenDep', label:'Talep edilen departman', type:'multi',
        options:DB.departments.map(function(d){ return { value:d.kod, label:d.ad }; }) },
      { key:'oncelik', label:'Öncelik', type:'multi', options:DB.priorities },
      { key:'termin', label:'Termin', type:'daterange' }
    ],
    rowClass:function(x){ return geciken(x) ? 'is-late' : ''; },
    kanban:{ groupBy:'durum', columns:['Bekliyor','Devam ediyor','Tamamlandı'],
      card:function(x){
        return '<a class="gv-kcard-title" href="app-istalebi-detay.html?id=' + x.kod + '">' + esc(x.baslik) + '</a>' +
          '<div class="gv-kcard-meta"><span>' + esc(DB.dep(x.talepEdenDep).kisa) + ' → ' + esc(DB.dep(x.talepEdilenDep).kisa) + '</span></div>' +
          '<div class="gv-kcard-meta">' + GV.user(x.sorumlu, { sm:true }) + GV.dateCell(x.termin) + '</div>'; } },
    mobile:function(x){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-istalebi-detay.html?id=' + x.kod + '">' + esc(x.baslik) + '</a>' +
        GV.pri(x.oncelik) + '</div>' +
        '<div class="gv-mrow-code">' + x.kod + ' · ' + esc(x.tur) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + esc(DB.dep(x.talepEdenDep).kisa) + ' → ' + esc(DB.dep(x.talepEdilenDep).kisa) + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + '</span>' + GV.dateCell(x.termin) + '</div>';
    },
    rowActions:[
      { key:'ac', icon:'i-external', label:'Talebi aç', href:function(x){ return 'app-istalebi-detay.html?id=' + x.kod; } },
      { key:'kabul', icon:'i-check', label:'Talebi kabul et', run:function(x, refresh){
          if(x.durum !== 'Bekliyor'){ GV.toast('Bu talep zaten işleme alınmış.', 'info'); return; }
          GV.confirm({ title:'Talebi kabul et',
            text:esc(x.baslik) + ' talebi size atanacak ve durumu “Devam ediyor” olacak.', okLabel:'Kabul et' })
            .then(function(ok){ if(ok){ x.durum = 'Devam ediyor'; x.sorumlu = me; x.onay = 'Onaylandı';
              GV.toast(x.kod + ' kabul edildi', 'ok'); refresh(); } }); } },
      { key:'gorev', icon:'i-tasks', label:'Göreve dönüştür', run:function(x){
          GV.confirm({ title:'Göreve dönüştür',
            text:x.kod + ' talebinden, talep edilen departmanda yeni bir görev oluşturulacak. Talep bilgileri göreve taşınır.',
            okLabel:'Görev oluştur' }).then(function(ok){
              if(!ok) return;
              var kod = 'GRV-2026-' + (200 + DB.tasks.length);
              DB.tasks.unshift({ kod:kod, baslik:x.baslik, tur:'Genel görev', proje:x.proje, modul:null, sprint:null,
                musteri:x.musteri, dep:x.talepEdilenDep, olusturan:GV.session.emp, veren:x.talepEden, sorumlu:x.sorumlu,
                yardimci:[], izleyiciler:[x.talepEden], kontrolEden:x.talepEden, onaylayan:x.talepEden,
                oncelik:x.oncelik, etki:'Orta', aciliyet:x.oncelik, durum:'Atandı', baslangic:DB.today, termin:x.termin,
                tamamlanma:null, tahminiSure:8, gercekSure:0, faturalanabilir:0, ilerleme:0, revizyon:0, yenidenAcilma:0,
                aciklama:x.aciklama, amac:x.beklenenCikti, kabulKriteri:x.kabulKriteri, beklenenCikti:x.beklenenCikti,
                etiketler:['Departman talebi'], aktif:true });
              GV.result({ tone:'ok', title:'Görev oluşturuldu', text:kod + ' numaralı görev açıldı ve sorumluya atandı.',
                actions:[{ label:'Görevi aç', cls:'btn-acc', onClick:function(){ location.href = 'app-gorev-detay.html?id=' + kod; } },
                         { label:'Kapat', cls:'btn-line' }] }); }); } }
    ],
    bulk:[{ key:'sorumlu', label:'Sorumlu ata', icon:'i-user-check' }, { key:'disa', label:'Dışa aktar', icon:'i-download' }],
    emptyState:{ icon:'i-arrow-right', title:'Bu görünümde talep yok',
      desc:'Departmanlar birbirine yapılandırılmış talep göndererek işleri sözlü iletişimden çıkarır.',
      action:'<a class="btn btn-acc" href="app-istalebi-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Talep</a>' }
  });

});
</script>
</body>
</html>
