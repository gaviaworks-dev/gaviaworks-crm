<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Komisyon Kazancı Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satis" data-screen="komisyon">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');
  var canOnay   = GV.perm.can('onay');

  var id = new URLSearchParams(location.search).get('id') || (DB.commissions[0] || {}).kod;
  var k  = DB.commissions.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!k){
    GV.pageHead({ eyebrow:'Satış ve CRM', title:'Komisyon Kazancı Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Komisyon listesi', icon:'i-percent', href:'app-komisyon.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Komisyon kazancı bulunamadı',
      desc:'“' + esc(id || '') + '” kodlu komisyon kaydı sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-komisyon.html">Komisyon listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(k.kod);
  document.title = k.kod + ' — Komisyon Kazancı — GaviaWorks CRM';

  /* =================================================================
     TERMİNOLOJİ NOTU (VB-04)
       DB.commissions[].kazanimTarihi ve DB.referrers[].komisyonToplam ALAN ADLARI
       veri dosyasında inşaat terimi taşıyor ve DEĞİŞTİRİLMEZ — rename tek
       turda yapılacak. Ekranda gösterilen HİÇBİR etikette bu kelime geçmez:
         kazanimTarihi → "Kazanç tarihi"
         referrers.komisyonToplam → "Komisyon kazancı" / "Toplam komisyon kazancı"
         odenen → "Ödenen komisyon" · bekleyen → "Bekleyen komisyon"
         commissions.ciro → "Dayanak ciro"
     ================================================================= */

  /* =================================================================
     İLİŞKİLİ KAYITLAR
       commission.referans → REF-xxx   (veride YAZILI tekil bağ)
       commission.musteri  → MUS-xxx   (veride YAZILI tekil bağ)
       approval.kayit      → KOM-xxx   (veride YAZILI tekil bağ)
       activity.kayit      → KOM-xxx   (veride YAZILI tekil bağ)
       SÖZLEŞME BAĞI YOK — komisyon kaydı sözleşme kodu tutmuyor. Sözleşmeler
       yalnız MÜŞTERİ üzerinden ADAY olarak listelenir (ders L-13, uydurulmaz).
     ================================================================= */
  var ref = k.referans ? DB.referrers.filter(function(r){ return r.kod === k.referans; })[0] : null;
  var mus = k.musteri  ? DB.customers.filter(function(c){ return c.kod === k.musteri;  })[0] : null;
  var ony = DB.approvals.filter(function(a){ return a.kayit === k.kod; })[0] || null;
  var acts = DB.activities.filter(function(a){ return a.kayit === k.kod; });

  /* Yönlendirenin tüm komisyonları — ARŞİVLİ KAYIT DA DAHİL.
     Arşivli satır soluk (.is-passive) gösterilir ama toplamlara girer:
     yönlendiren kartındaki komisyonToplam/odenen/bekleyen ancak böyle tutuyor. */
  var refKoms = ref ? DB.commissions.filter(function(x){ return x.referans === ref.kod; })
                        .sort(function(a,b){ return String(b.kazanimTarihi || '').localeCompare(String(a.kazanimTarihi || '')); })
                    : [];

  /* Müşteri üzerinden ADAY sözleşmeler / faturalar / tahsilatlar */
  var sozlesmeler = mus ? DB.contracts.filter(function(c){ return c.musteri === mus.kod; })
                            .sort(function(a,b){ return String(b.imzaTarihi).localeCompare(String(a.imzaTarihi)); }) : [];
  var faturalar   = mus ? DB.invoices.filter(function(i){ return i.musteri === mus.kod; })
                            .sort(function(a,b){ return String(a.tarih).localeCompare(String(b.tarih)); }) : [];
  var tahsilatlar = mus ? DB.payments.filter(function(p){ return p.musteri === mus.kod; })
                            .sort(function(a,b){ return String(a.vade).localeCompare(String(b.vade)); }) : [];

  /* Dayanak cirosu ile birebir eşleşen sözleşme(ler) — eşleşme bir İPUCUDUR,
     veride yazılı bağ değildir; ekranda da böyle etiketlenir. */
  var esleyen = sozlesmeler.filter(function(c){ return (k.ciro || 0) > 0 && c.tutar === k.ciro; });

  /* =================================================================
     PARA — components.md §9b
       Bu ekranda NET eksende olanlar:
         commissions.ciro (dayanak ciro) · commissions.tutar (komisyon kazancı)
         referrers.ciro/komisyonToplam/odenen/bekleyen/sabitBedel
         contracts.tutar · invoices.tutar · customers.toplamCiro
       BRÜT eksende olanlar (yalnız Dayanak sekmesinin alt bloğunda):
         contracts.toplam · invoices.toplam · payments.tutar
         customers.bekleyenTahsilat
       İki eksen aynı kolonda KARIŞMAZ, her etikette eksen yazılıdır.
     ================================================================= */
  function para(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="cell-money">' + F.money(v) + '</span>';
  }
  function paraSade(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="u-num">' + F.money(v) + '</span>';
  }
  var finansNot = canFinans ? '' : '<div class="gc-body">' + GV.notice({
    tone:'neutral', icon:'i-lock', title:'Tutarlar gizli',
    text:'Rolünüzde finansal tutar görüntüleme yetkisi yok. Kayıtlar listelenir, para alanları maskelenir.' }) + '</div>';

  /* =================================================================
     HESAPLAMA ZİNCİRİ VE DOĞRULAMASI
       Ciro yüzdesi modeli : dayanak ciro × oran / 100 = komisyon kazancı
       Sabit bedel modeli  : oran ve ciro hesaba girmez, kazanç sabit tutardır
     ================================================================= */
  var oranli     = (k.oran || 0) > 0;                 /* ciro yüzdesi modeli mi */
  var ciroluDayanak = (k.ciro || 0) > 0;
  var hesapTutar = oranli ? Math.round((k.ciro || 0) * k.oran / 100) : null;
  var hesapUyum  = hesapTutar == null ? null : hesapTutar === k.tutar;
  var hesapFark  = hesapTutar == null ? null : hesapTutar - k.tutar;

  /* Sabit bedelli kayıtta dayanak ciro bilgi amaçlıdır — yine de efektif
     oran hesaplanır ki kazanç cironun kaçta kaçı, ekranda görünsün. */
  var efektifOran = ciroluDayanak ? Math.round((k.tutar || 0) / k.ciro * 1000) / 10 : null;

  /* Kayıttaki oran / bedel ile yönlendiren kartındaki koşulun karşılaştırması */
  var kartOran   = ref ? (ref.komisyonOrani || 0) : null;
  var kartBedel  = ref ? (ref.sabitBedel || 0) : null;
  var oranUyum   = (oranli && ref) ? (k.oran === kartOran) : null;
  var bedelUyum  = (!oranli && ref && kartBedel) ? (k.tutar === kartBedel) : null;
  var kartModel  = ref ? ref.komisyonModeli : null;
  var modelAdi   = oranli ? 'Ciro yüzdesi' : 'Sabit bedel';
  var modelUyum  = ref ? (kartModel === modelAdi) : null;

  /* =================================================================
     YÖNLENDİRENİN TOPLAMI — arşivli kayıt DAHİL
     ================================================================= */
  var refToplam   = refKoms.reduce(function(s,x){ return s + (x.tutar || 0); }, 0);
  var refOdenen   = refKoms.filter(function(x){ return x.durum === 'Ödendi'; })
                           .reduce(function(s,x){ return s + (x.tutar || 0); }, 0);
  var refBekleyen = refToplam - refOdenen;
  var refDayanak  = refKoms.reduce(function(s,x){ return s + (x.ciro || 0); }, 0);
  var refArsivli  = refKoms.filter(function(x){ return x.arsiv === true; });
  var refArsivTutar = refArsivli.reduce(function(s,x){ return s + (x.tutar || 0); }, 0);

  var kartFarkToplam   = ref ? refToplam - (ref.komisyonToplam || 0) : 0;
  var kartFarkOdenen   = ref ? refOdenen - (ref.odenen || 0) : 0;
  var kartFarkBekleyen = ref ? refBekleyen - (ref.bekleyen || 0) : 0;
  var kartTutuyor = ref && kartFarkToplam === 0 && kartFarkOdenen === 0 && kartFarkBekleyen === 0;
  /* Kart bütünlüğü: komisyonToplam = odenen + bekleyen (ödeme aksiyonu bunu korur) */
  var kartIcTutarlilik = ref ? ((ref.odenen || 0) + (ref.bekleyen || 0) === (ref.komisyonToplam || 0)) : null;

  /* Bu kazancın yönlendirenin toplamındaki payı — iki eksende de gösterilir */
  var payTuretilen = refToplam ? Math.round((k.tutar || 0) / refToplam * 100) : null;
  var payKart      = (ref && ref.komisyonToplam) ? Math.round((k.tutar || 0) / ref.komisyonToplam * 100) : null;

  /* =================================================================
     MÜŞTERİ / SÖZLEŞME EKSENLERİ
     ================================================================= */
  var sozNet  = sozlesmeler.reduce(function(s,c){ return s + (c.tutar || 0); }, 0);   /* NET  */
  var sozKdv  = sozlesmeler.reduce(function(s,c){ return s + (c.kdv || 0); }, 0);     /* KDV  */
  var sozBrut = sozlesmeler.reduce(function(s,c){ return s + (c.toplam || 0); }, 0);  /* BRÜT */
  var ftrNet  = faturalar.reduce(function(s,i){ return s + (i.tutar || 0); }, 0);     /* NET  */
  var ftrBrut = faturalar.reduce(function(s,i){ return s + (i.toplam || 0); }, 0);    /* BRÜT */
  var thsBrut = tahsilatlar.filter(function(p){ return p.durum === 'Ödendi'; })
                           .reduce(function(s,p){ return s + (p.tutar || 0); }, 0);   /* BRÜT */
  var thsAcik = tahsilatlar.filter(function(p){ return p.durum !== 'Ödendi'; })
                           .reduce(function(s,p){ return s + (p.tutar || 0); }, 0);   /* BRÜT */

  /* =================================================================
     DURUM VE AKSİYON KOŞULLARI (ölü buton yasağı — koşul yoksa basılmaz)
     ================================================================= */
  var dogmus      = !!k.kazanimTarihi;                        /* kazanç doğdu mu */
  var onayli      = k.onay === 'Onaylandı';
  var reddedildi  = k.onay === 'Reddedildi';
  var odendi      = k.durum === 'Ödendi';
  var onaylanabilir = !onayli && !reddedildi && dogmus;       /* onay ancak kazanç doğduktan sonra */
  var odenebilir    = onayli && !odendi;

  var kazancGun  = k.kazanimTarihi ? -F.days(k.kazanimTarihi) : null;   /* kaç gün önce doğdu */
  var odemeGun   = k.odemeTarihi   ? -F.days(k.odemeTarihi)   : null;
  var bekleyenGun = (dogmus && !odendi) ? kazancGun : null;             /* ödenmeden geçen gün */

  /* Ödeme bekleme eşikleri — DB.today referansı, 30 / 60 / 90 gün */
  function bekleyisEsigi(gun){
    if(gun == null) return null;
    if(gun >= 90) return { tone:'danger', lbl:'90 günden uzun süredir ödenmedi' };
    if(gun >= 60) return { tone:'danger', lbl:'60 günden uzun süredir ödenmedi' };
    if(gun >= 30) return { tone:'warn',   lbl:'30 günden uzun süredir ödenmedi' };
    return { tone:'ok', lbl:'Ödeme penceresi içinde' };
  }
  var bekleyis = bekleyenGun != null ? bekleyisEsigi(bekleyenGun) : null;

  /* =================================================================
     YARDIMCILAR
     ================================================================= */
  /* dt metinleri yazar tarafından yazılan sabit dizelerdir (eksen etiketi için
     <span class="u-faint"> içerir) — bu yüzden dt escape EDİLMEZ, dd zaten
     çağıran tarafta esc()'lenerek gelir. */
  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(Boolean).map(function(p){
      var bos = p[1] == null || p[1] === '';
      return '<div><dt>' + p[0] + '</dt><dd' + (bos ? ' class="is-empty"' : '') + '>' +
        (bos ? '—' : p[1]) + '</dd></div>';
    }).join('') + '</dl>';
  }
  function tbl(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3></div>' + govde + '</div>';
  }
  function bos(v){ return v == null || v === '' || v === '—'; }
  function gunMetin(gun){
    if(gun == null) return '<span class="u-faint">—</span>';
    if(gun === 0) return '<b class="u-num">bugün</b>';
    if(gun < 0)   return '<b class="u-num">' + Math.abs(gun) + ' gün sonra</b>';
    return '<b class="u-num">' + gun + ' gün önce</b>';
  }
  function musLink(){
    return mus ? '<a href="app-musteri-detay.html?id=' + esc(mus.kod) + '">' + esc(k.firma) + '</a>'
               : '<span class="u-faint">' + esc(k.firma || '—') + '</span>';
  }
  function refLink(){
    return ref ? '<a href="app-referans-detay.html?id=' + esc(ref.kod) + '">' + esc(ref.ad) + '</a>'
               : '<span class="u-faint">' + esc(k.kisi || '—') + '</span>';
  }
  /* Kazanç modelinin tek cümlelik ifadesi — "%0" hiçbir yerde yazılmaz */
  function oranMetin(){
    return oranli ? '<b class="u-num">%' + k.oran + '</b>' : '<span class="tag">Sabit bedel</span>';
  }
  function ciroMetin(){
    return ciroluDayanak ? para(k.ciro) : '<span class="u-faint">Ciroya bağlı değil</span>';
  }
  function kazancTarihMetin(){
    return dogmus ? '<span class="cell-date">' + F.date(k.kazanimTarihi) + '</span>'
                  : '<span class="u-faint">Henüz doğmadı</span>';
  }

  /* =================================================================
     MUTASYONLAR — ders L-15: location.reload() YOK, GV.refresh() var
     ================================================================= */
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }

  function onaylaAkisi(){
    if(!canOnay || !onaylanabilir) return;
    GV.confirm({
      title:'Komisyon kazancını onayla',
      text:k.kod + ' — ' + k.kisi + ' için ' + (canFinans ? F.money(k.tutar) + ' (KDV hariç) ' : '') +
           'komisyon kazancı onaylanacak ve ödeme kuyruğuna girecek.',
      okLabel:'Onayla'
    }).then(function(ok){
      if(!ok) return;
      var eskiOnay = k.onay, eskiDurum = k.durum;
      k.onay  = 'Onaylandı';
      k.durum = 'Onaylandı';
      if(ony) ony.durum = 'Onaylandı';
      DB.activities.unshift({ kayit:k.kod, tarih:simdi(), kisi:GV.session.emp,
        metin:'Komisyon kazancı onaylandı' + (ony ? ' — onay kaydı ' + ony.kod : ''),
        eski:'Onay ' + eskiOnay + ' · Durum ' + eskiDurum,
        yeni:'Onay Onaylandı · Durum Onaylandı', tone:'ok', icon:'i-check-circle' });
      GV.toast(k.kod + ' onaylandı', 'ok');
      setTimeout(function(){ GV.refresh(); }, 700);
    });
  }

  function odeAkisi(){
    if(!canFinans || !odenebilir) return;
    GV.confirm({
      title:'Ödendi olarak işaretle',
      text:k.kod + ' — ' + F.money(k.tutar) + ' (KDV hariç) komisyon ödemesi ' + F.date(DB.today) +
           ' tarihiyle kaydedilecek' + (ref ? '; ' + ref.ad + ' kartındaki ödenen ve bekleyen komisyon da güncellenecek.' : '.'),
      okLabel:'Ödendi işaretle'
    }).then(function(ok){
      if(!ok) return;
      var eskiDurum = k.durum;
      k.durum = 'Ödendi';
      k.odemeTarihi = DB.today;
      var refNot = '';
      if(ref){
        var eskiOdenen = ref.odenen || 0, eskiBekleyen = ref.bekleyen || 0;
        ref.odenen   = eskiOdenen + (k.tutar || 0);
        ref.bekleyen = Math.max(0, eskiBekleyen - (k.tutar || 0));
        /* Canonical: komisyonToplam = odenen + bekleyen — kart bütünlüğü her koşulda korunur */
        ref.komisyonToplam  = ref.odenen + ref.bekleyen;
        refNot = ' · ' + ref.kod + ' ödenen ' + F.money(eskiOdenen) + ' → ' + F.money(ref.odenen);
        DB.activities.unshift({ kayit:ref.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Komisyon ödemesi işlendi — ' + k.kod,
          eski:'Ödenen ' + F.money(eskiOdenen) + ' · Bekleyen ' + F.money(eskiBekleyen),
          yeni:'Ödenen ' + F.money(ref.odenen) + ' · Bekleyen ' + F.money(ref.bekleyen),
          tone:'ok', icon:'i-wallet' });
      }
      DB.activities.unshift({ kayit:k.kod, tarih:simdi(), kisi:GV.session.emp,
        metin:'Komisyon kazancı ödendi olarak işaretlendi' + refNot,
        eski:'Durum ' + eskiDurum + ' · Ödeme tarihi yok',
        yeni:'Durum Ödendi · Ödeme tarihi ' + F.date(DB.today), tone:'ok', icon:'i-wallet' });
      GV.toast(k.kod + ' ödendi olarak işaretlendi', 'ok');
      setTimeout(function(){ GV.refresh(); }, 700);
    });
  }

  /* =================================================================
     SAYFA BAŞLIĞI — üç aksiyonun üçü de yayındaki ekranlara gider
     ================================================================= */
  GV.pageHead({
    eyebrow:'Satış ve CRM', title:'Komisyon Kazancı Detayı',
    sub:k.kod + ' · ' + k.kisi + ' · ' + k.firma,
    actions:[
      { label:'Komisyon listesi', icon:'i-percent', href:'app-komisyon.html' },
      { label:'Yönlendiren', icon:'i-users',
        href:ref ? 'app-referans-detay.html?id=' + ref.kod : 'app-referans.html' },
      { label:'Referans raporu', icon:'i-chart-bar', cls:'btn-acc', href:'app-rapor-referans.html' }
    ]
  });

  /* =================================================================
     KAYIT BAŞLIĞI
     ================================================================= */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + esc(k.kod) + '</span>' +
        GV.badge(k.durum) +
        (bos(k.onay) ? '<span class="tag">Onay akışı başlamadı</span>' : GV.badge(k.onay)) +
        '<span class="tag">' + esc(modelAdi) + '</span>' +
        (!dogmus ? '<span class="badge is-neutral no-dot">Kazanç henüz doğmadı</span>' : '') +
        (bekleyis && bekleyis.tone !== 'ok' ? '<span class="badge is-' + bekleyis.tone + ' no-dot">' + esc(bekleyis.lbl) + '</span>' : '') +
        (k.arsiv ? '<span class="tag">Arşiv</span>' : '') +
        (k.aktif === false ? '<span class="tag">Pasif kayıt</span>' : '') + '</div>' +
      '<h1>' + esc(k.kisi) + '</h1>' +
      '<div class="gv-rec-meta">' +
        '<span>' + ico('i-users','ic-sm') + refLink() + '</span>' +
        '<span>' + ico('i-building','ic-sm') + musLink() + '</span>' +
        '<span>' + ico('i-percent','ic-sm') +
          (oranli ? 'Dayanak ciro × %' + k.oran : 'Sabit bedelli komisyon') + '</span>' +
        '<span>' + ico('i-wallet','ic-sm') +
          (canFinans ? F.money(k.tutar) + ' komisyon kazancı (KDV hariç)' : 'Kazanç gizli') + '</span>' +
        '<span>' + ico('i-calendar','ic-sm') + 'Kazanç tarihi ' +
          (dogmus ? F.date(k.kazanimTarihi) : 'henüz doğmadı') + '</span>' +
        '<span>' + ico('i-check-circle','ic-sm') +
          (odendi ? 'Ödendi ' + F.date(k.odemeTarihi) : 'Ödenmedi') + '</span>' +
      '</div>' +
    '</div></div>';

  /* =================================================================
     SEKMELER
     ================================================================= */
  var tabs = [
    { key:'genel',       lbl:'Genel',                     ic:'i-info' },
    { key:'hesap',       lbl:'Hesaplama',                 ic:'i-percent' },
    { key:'yonlendiren', lbl:'Yönlendiren',               ic:'i-users',    cnt:refKoms.length },
    { key:'dayanak',     lbl:'Dayanak Sözleşme',          ic:'i-file-check', cnt:sozlesmeler.length },
    { key:'onay',        lbl:'Onay ve Ödeme',             ic:'i-stamp' },
    { key:'aktivite',    lbl:'Aktivite Geçmişi',          ic:'i-activity', cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){

           (bekleyenGun != null ? 'Kazanç doğalı ' + bekleyenGun + ' gün oldu. ' : '') +
           (canFinans ? 'Finans yetkiniz var — ödemeyi işaretleyebilirsiniz.'
                      : 'Ödeme işaretleme finans yetkisi gerektirir.') });
  }

  var pOnay = finansNot + '<div class="gc-body">' + aksiyonNot + '</div>' +
    '<div class="gc-body">' +
    (ony
      ? sec('Onay Akışı', zincir +
          dl([
            ['Onay kaydı', '<a href="app-panel-onaylar.html">' + esc(ony.kod) + '</a>' +
              ' <span class="cell-sub">' + esc(ony.tur) + '</span>'],
            ['Onay başlığı', esc(ony.baslik)],
            ['Talep eden', GV.user(ony.talepEden, { sm:true })],
            ['Onaylayacak kişi', GV.user(ony.onaylayan, { sm:true })],
            ['Onay kaydındaki tutar <span class="u-faint">(KDV hariç)</span>',
              ony.tutar == null ? '<span class="u-faint">Tutarsız onay</span>' : para(ony.tutar)],
            ['Onay tutarı ↔ komisyon kazancı', ony.tutar == null
              ? '<span class="u-faint">Karşılaştırılamaz</span>'
              : (ony.tutar === k.tutar
                  ? '<span class="badge is-ok no-dot">Birebir aynı</span>'
                  : '<span class="badge is-danger no-dot">Fark var</span> ' + paraSade(ony.tutar - k.tutar))],
            ['Onay talep tarihi', '<span class="cell-date">' + F.date(ony.tarih) + '</span>' +
              ' <span class="cell-sub">' + gunMetin(-F.days(ony.tarih)) + '</span>'],
            ['Aciliyet', GV.pri(ony.aciliyet)],
            ['Onay kaydının durumu', GV.badge(ony.durum)],
            ['Komisyon kaydındaki onay durumu', bos(k.onay)
              ? '<span class="u-faint">Onay akışı başlamadı</span>' : GV.badge(k.onay)],
            ['İki durum uyumu', bos(k.onay)
              ? '<span class="u-faint">Karşılaştırılamaz</span>'
              : (ony.durum === k.onay
                  ? '<span class="badge is-ok no-dot">Aynı</span>'
                  : '<span class="badge is-warn no-dot">Farklı</span> <span class="cell-sub">onay kaydı ' +
                    esc(ony.durum) + ', komisyon ' + esc(k.onay) + '</span>')],
            ['Onay kaydının hedefi', '<a href="' + esc(ony.link) + '">' + esc(ony.link) + '</a>']
          ]))
      : sec('Onay Akışı', GV.empty({ icon:'i-stamp', title:'Bu komisyona ait onay kaydı yok',
          desc:bos(k.onay)
            ? 'Kazanç henüz onay kuyruğuna girmemiş — onay kaydı, kazanç doğduğunda açılır.'
            : 'Komisyon kaydı “' + esc(k.onay) + '” diyor ama onay kuyruğunda bu kazanca ait bir kayıt bulunmuyor. ' +
              'Onay geçmişi arşivlenmiş olabilir.',
          action:'<a class="btn btn-acc" href="app-panel-onaylar.html">Onay kuyruğuna git</a>' }))) +

    sec('Ödeme Durumu', dl([
      ['Kazanç durumu', GV.badge(k.durum)],
      ['Onay durumu', bos(k.onay) ? '<span class="u-faint">Onay akışı başlamadı</span>' : GV.badge(k.onay)],
      ['Ödenecek tutar <span class="u-faint">(KDV hariç)</span>', '<b>' + para(k.tutar) + '</b>'],
      ['Ödeme alacak yönlendiren', refLink() + (ref ? ' <span class="cell-sub">' + esc(ref.kod) + '</span>' : '')],
      ['Kazanç tarihi', kazancTarihMetin()],
      ['Ödeme tarihi', k.odemeTarihi
        ? '<span class="cell-date">' + F.date(k.odemeTarihi) + '</span> <span class="cell-sub">' +
          gunMetin(odemeGun) + '</span>'
        : '<span class="u-faint">Ödenmedi</span>'],
      ['Ödenmeden geçen süre', bekleyenGun != null
        ? gunMetin(bekleyenGun) + ' <span class="cell-sub">kazanç doğduğundan bu yana</span>' : null],
      ['Ödeme bekleyişi <span class="u-faint">(30 / 60 / 90 gün eşiği)</span>',
        bekleyis ? GV.badge(bekleyis.lbl, 'is-' + bekleyis.tone) : null],
      ['Ödeme sonrası yönlendiren kartı', (ref && odenebilir)
        ? '<span class="cell-sub">Ödenen ' + (canFinans ? F.money(ref.odenen) + ' → ' + F.money((ref.odenen || 0) + (k.tutar || 0)) : '••••••') +
          ' · bekleyen ' + (canFinans ? F.money(ref.bekleyen) + ' → ' + F.money(Math.max(0, (ref.bekleyen || 0) - (k.tutar || 0))) : '••••••') +
          '</span>'
        : null],
      ['Sistem tarihi', '<span class="cell-date">' + F.date(DB.today) + '</span>']
    ]) + onayAksiyon) + '</div>';

  /* =================================================================
     6. AKTİVİTE GEÇMİŞİ
     ================================================================= */
  var pAktivite = '<div class="gc-body">' +
    (acts.length ? GV.activity(acts)
      : GV.empty({ icon:'i-activity', title:'Bu komisyonda kayıtlı hareket yok',
          desc:'Kazanç üzerinde yapılan onay, ödeme ve tutar değişiklikleri burada listelenir.',
          action:'<a class="btn btn-line" href="app-komisyon.html">Komisyon listesine dön</a>' })) +
    '</div>';

  var panels = {
    genel:pGenel, hesap:pHesap, yonlendiren:pYonlendiren,
    dayanak:pDayanak, onay:pOnay, aktivite:pAktivite
  };

  /* =================================================================
     SAĞ ÖZET PANELİ
     ================================================================= */
  var aside =
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-info') + 'Özet</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Yönlendiren', refLink()],
      ['Kazandırdığı müşteri', musLink()],
      ['Dayanak ciro <span class="u-faint">(KDV hariç)</span>', ciroMetin()],
      ['Oran', oranMetin()],
      ['Komisyon kazancı <span class="u-faint">(KDV hariç)</span>', '<b>' + para(k.tutar) + '</b>'],
      ['Kazanç tarihi', kazancTarihMetin()],
      ['Kazanç durumu', GV.badge(k.durum)],
      ['Ödeme tarihi', k.odemeTarihi
        ? '<span class="cell-date">' + F.date(k.odemeTarihi) + '</span>'
        : '<span class="u-faint">Ödenmedi</span>'],
      ['Onay durumu', bos(k.onay) ? '<span class="u-faint">Başlamadı</span>' : GV.badge(k.onay)],
      k.arsiv ? ['Arşiv', '<span class="tag">Arşivli — toplamlara dahil</span>'] : null
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-percent') + 'Hesap</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Model', '<span class="tag">' + esc(modelAdi) + '</span>'],
      ['Dayanak ciro <span class="u-faint">(KDV hariç)</span>', ciroMetin()],
      ['Uygulanan oran', oranMetin()],
      oranli ? ['Hesaplanan <span class="u-faint">(ciro × oran)</span>', paraSade(hesapTutar)] : null,
      ['Kayıtlı kazanç <span class="u-faint">(KDV hariç)</span>', para(k.tutar)],
      ['Doğrulama', oranli
        ? (hesapUyum ? '<span class="badge is-ok no-dot">Zincir tutuyor</span>'
                     : '<span class="badge is-danger no-dot">Fark ' + (canFinans ? F.money(hesapFark) : '••••') + '</span>')
        : (bedelUyum == null
            ? '<span class="badge is-neutral no-dot">Sabit bedel — çarpım yok</span>'
            : (bedelUyum ? '<span class="badge is-ok no-dot">Kart bedeliyle birebir</span>'
                         : '<span class="badge is-danger no-dot">Kart bedeliyle fark var</span>'))],
      ['Efektif oran <span class="u-faint">(net / net)</span>', efektifOran != null
        ? (canFinans ? '<b class="u-num">%' + F.num(efektifOran, 1) + '</b>' : '<span class="cell-mask">••••</span>')
        : '<span class="u-faint">—</span>']
    ]) + '</div></section>' +

    (ref
      ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-users') + 'Yönlendiren</h2></div>' +
        '<div class="gc-body">' + ozetListe([
          ['Yönlendiren', '<a href="app-referans-detay.html?id=' + esc(ref.kod) + '">' + esc(ref.ad) + '</a>'],
          ['Komisyon modeli', '<span class="tag">' + esc(ref.komisyonModeli) + '</span>'],
          ['Toplam komisyon kazancı <span class="u-faint">(KDV hariç)</span>', para(ref.komisyonToplam)],
          ['Ödenen komisyon <span class="u-faint">(KDV hariç)</span>', para(ref.odenen)],
          ['Bekleyen komisyon <span class="u-faint">(KDV hariç)</span>',
            ref.bekleyen ? '<b class="u-warn">' + para(ref.bekleyen) + '</b>'
                         : '<span class="badge is-ok no-dot">Yok</span>'],
          ['Bu kazancın payı', payKart != null ? GV.progress(payKart) : '<span class="u-faint">—</span>'],
          ['Komisyon kaydı', '<b>' + refKoms.length + '</b>']
        ]) + '</div></section>'
      : '') +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-stamp') + 'Onay ve Ödeme</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Onay kaydı', ony
        ? '<a href="app-panel-onaylar.html">' + esc(ony.kod) + '</a>'
        : '<span class="u-faint">Yok</span>'],
      ['Onay durumu', bos(k.onay) ? '<span class="u-faint">Başlamadı</span>' : GV.badge(k.onay)],
      ['Onaylayacak kişi', ony ? GV.user(ony.onaylayan, { sm:true }) : '<span class="u-faint">—</span>'],
      ['Ödeme durumu', GV.badge(k.durum)],
      ['Ödeme bekleyişi', bekleyis ? GV.badge(bekleyis.lbl, 'is-' + bekleyis.tone)
                                   : '<span class="u-faint">—</span>']
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3))
      : '<p class="u-sm u-faint">Bu komisyon kaydında henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =================================================================
     AKSİYONLAR — mount içindeki düğüme delege; GV.refresh() mount'u taze
     kopyayla değiştirdiği için dinleyici birikmez (ders L-16).
     ================================================================= */
  mount.addEventListener('click', function(e){
    if(e.target.closest('#btnOnayla')) onaylaAkisi();
    else if(e.target.closest('#btnOde')) odeAkisi();
  });
});
</script>
</body>
</html>
