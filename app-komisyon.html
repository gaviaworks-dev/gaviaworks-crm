<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Komisyon Hakedişleri — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satis" data-screen="komisyon">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, canFinans = GV.perm.can('finans');

  GV.pageHead({ eyebrow:'Satış ve CRM', title:'Komisyon Hakedişleri',
    actions:[{ label:'Yönlendirenler', icon:'i-users', href:'app-referans.html' },
             { label:'Yeni Hakediş', icon:'i-plus', cls:'btn-acc', href:'app-komisyon-form.html' }] });

  GV.list({
    mount:'#liste', id:'komisyon', key:'kod', source:function(){ return DB.commissions; },
    exportName:'komisyonlar', exportTitle:'Referans Komisyon Hakedişleri', pageSize:10,
    search:{ placeholder:'Hakediş no, yönlendiren veya müşteri ara', fields:['kod','kisi','firma','durum'] },
    defaultSort:'hakedisTarihi', defaultDir:'desc',
    kpis:[
      { label:'Toplam hakediş', icon:'i-percent', format:F.moneyK,
        calc:function(a){ return canFinans ? a.reduce(function(s,x){ return s + x.tutar; }, 0) : 0; } },
      { label:'Ödenen', icon:'i-check-circle', tone:'ok', format:F.moneyK,
        calc:function(a){ return canFinans ? a.filter(function(x){ return x.durum === 'Ödendi'; }).reduce(function(s,x){ return s + x.tutar; }, 0) : 0; } },
      { label:'Onay bekleyen', icon:'i-stamp', tone:'warn',
        calc:function(a){ return a.filter(function(x){ return x.onay === 'Bekliyor'; }).length; } },
      { label:'Ödeme bekleyen', icon:'i-wallet', tone:'danger', format:F.moneyK,
        calc:function(a){ return canFinans ? a.filter(function(x){ return x.durum !== 'Ödendi'; }).reduce(function(s,x){ return s + x.tutar; }, 0) : 0; } }
    ],
    tabs:[
      { key:'acik', label:'Açık Hakedişler', icon:'i-percent', filter:function(x){ return x.durum !== 'Ödendi'; } },
      { key:'onay', label:'Onay Bekleyen', icon:'i-stamp', filter:function(x){ return x.onay === 'Bekliyor'; } },
      { key:'odeme', label:'Ödeme Bekleyen', icon:'i-wallet', filter:function(x){ return x.onay === 'Onaylandı' && x.durum !== 'Ödendi'; } },
      { key:'odendi', label:'Ödenenler', icon:'i-check-circle', filter:function(x){ return x.durum === 'Ödendi'; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'kod', label:'Hakediş', width:'18%', locked:true, cellClass:'cell-wrap',
        render:function(x){ return '<a class="cell-main" href="app-komisyon-detay.html?id=' + x.kod + '">' + x.kod + '</a>' +
          '<span class="cell-sub">' + esc(x.kisi) + '</span>'; } },
      { key:'referans', label:'Yönlendiren', render:function(x){
          return '<a class="cell-main" href="app-referans-detay.html?id=' + x.referans + '">' + esc(x.kisi) + '</a>' +
                 '<span class="cell-code">' + x.referans + '</span>'; } },
      { key:'firma', label:'Kazandırdığı müşteri', render:function(x){
          return x.musteri ? '<a class="cell-main" href="app-musteri-detay.html?id=' + x.musteri + '">' + esc(x.firma) + '</a>'
                           : '<span class="u-faint">' + esc(x.firma) + '</span>'; } },
      { key:'ciro', label:'Ciro', cellClass:'num', render:function(x){
          return canFinans ? '<span class="u-num">' + F.money(x.ciro) + '</span>' : '<span class="cell-mask">••••</span>'; },
        exportValue:function(x){ return canFinans ? x.ciro : ''; } },
      { key:'oran', label:'Oran', cellClass:'num', render:function(x){
          return x.oran ? '<span class="u-num">%' + x.oran + '</span>' : '<span class="tag">Sabit</span>'; } },
      { key:'tutar', label:'Hakediş tutarı', cellClass:'num', render:function(x){
          return canFinans ? '<span class="cell-money">' + F.money(x.tutar) + '</span>' : '<span class="cell-mask">••••••</span>'; },
        exportValue:function(x){ return canFinans ? x.tutar : ''; } },
      { key:'hakedisTarihi', label:'Hakediş tarihi', render:function(x){
          return x.hakedisTarihi ? '<span class="cell-date">' + F.date(x.hakedisTarihi) + '</span>' : '<span class="u-faint">Beklemede</span>'; } },
      { key:'onay', label:'Onay', render:function(x){ return x.onay === '—' ? '<span class="u-faint">—</span>' : GV.badge(x.onay); } },
      { key:'odemeTarihi', label:'Ödeme tarihi', visible:false, render:function(x){
          return x.odemeTarihi ? '<span class="cell-date">' + F.date(x.odemeTarihi) + '</span>' : '<span class="u-faint">—</span>'; } },
      { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } }
    ],
    filters:[
      { key:'durum', label:'Hakediş durumu', type:'multi', options:['Bekliyor','Onay bekliyor','Onaylandı','Ödendi'] },
      { key:'onay', label:'Onay durumu', type:'select', options:['Bekliyor','Onaylandı','Reddedildi'] },
      { key:'referans', label:'Yönlendiren', type:'select',
        options:DB.referrers.map(function(r){ return { value:r.kod, label:r.ad }; }) },
      { key:'musteri', label:'Müşteri', type:'select',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'hakedisTarihi', label:'Hakediş tarihi', type:'daterange' }
    ],
    rowClass:function(x){ return (x.onay === 'Onaylandı' && x.durum !== 'Ödendi') ? 'is-late' : ''; },
    mobile:function(x){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-komisyon-detay.html?id=' + x.kod + '">' + x.kod + '</a>' +
        (canFinans ? '<span class="cell-money">' + F.money(x.tutar) + '</span>' : '') + '</div>' +
        '<div class="gv-mrow-code">' + esc(x.kisi) + ' · ' + esc(x.firma) + '</div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + '</span></div>';
    },
    rowActions:[
      { key:'ac', icon:'i-external', label:'Hakedişi aç', href:function(x){ return 'app-komisyon-detay.html?id=' + x.kod; } },
      { key:'onayla', icon:'i-check', label:'Onayla', run:function(x, refresh){
          if(!GV.perm.can('onay')){ GV.toast('Onaylama yetkiniz yok.', 'danger'); return; }
          if(x.onay === 'Onaylandı'){ GV.toast('Bu hakediş zaten onaylı.', 'info'); return; }
          GV.confirm({ title:'Hakedişi onayla',
            text:x.kisi + ' için ' + F.money(x.tutar) + ' tutarındaki hakediş onaylanacak ve ödeme kuyruğuna girecek.',
            okLabel:'Onayla' }).then(function(ok){
              if(!ok) return;
              x.onay = 'Onaylandı'; x.durum = 'Onaylandı';
              GV.toast(x.kod + ' onaylandı', 'ok'); refresh(); }); } },
      { key:'ode', icon:'i-wallet', label:'Ödendi işaretle', run:function(x, refresh){
          if(x.onay !== 'Onaylandı'){ GV.toast('Önce yönetici onayı alınmalı.', 'warn'); return; }
          if(x.durum === 'Ödendi'){ GV.toast('Bu hakediş zaten ödenmiş.', 'info'); return; }
          GV.confirm({ title:'Ödendi olarak işaretle', text:F.money(x.tutar) + ' ödeme kaydı oluşturulacak.', okLabel:'Ödendi' })
            .then(function(ok){ if(ok){ x.durum = 'Ödendi'; x.odemeTarihi = DB.today;
              GV.toast(x.kod + ' ödendi olarak işaretlendi', 'ok'); refresh(); } }); } }
    ],
    bulk:[
      { key:'onay', label:'Toplu onayla', icon:'i-check' },
      { key:'disa', label:'Dışa aktar', icon:'i-download' }
    ],
    emptyState:{ icon:'i-percent', title:'Bu görünümde hakediş yok',
      desc:'Kazanılan referanslı satışlar burada komisyon hakedişine dönüşür.' }
  });

});
</script>
</body>
</html>
