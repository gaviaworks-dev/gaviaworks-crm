<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Müşteri Adayları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satis" data-screen="lead">
<a class="gv-skip" href="#gvMain">İçeriğe atla</a>

<div class="gv-app">
  <aside class="gv-rail" id="gvRail"></aside>
  <nav class="gv-menu" id="gvMenu"></nav>
  <button type="button" class="gv-divider" id="gvDivider" aria-label="Menüyü daralt veya genişlet">
    <span><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chev-left"></use></svg></span>
  </button>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main" id="gvMain">
    <div class="gv-page">
      <nav class="gv-crumb" id="gvCrumb" aria-label="Konum"></nav>

      <div class="gv-page-head">
        <div>
          <div class="ph-eyebrow">Satış ve CRM</div>
          <h1>Müşteri Adayları</h1>
          <div class="ph-sub" data-listcount>—</div>
        </div>
        <div class="ph-actions">
          <a class="btn btn-line" href="app-pipeline.html">
            <svg class="ic" aria-hidden="true"><use href="#i-funnel"></use></svg> Pipeline Görünümü
          </a>
          <a class="btn btn-acc" href="app-lead-form.html">
            <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg> Yeni Müşteri Adayı
          </a>
        </div>
      </div>

      <div id="liste"></div>
    </div>
  </main>
</div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt;
  var acikAsama = function(r){ return ['Kazanıldı','Kaybedildi','Beklemeye alındı'].indexOf(r.asama) === -1; };

  GV.list({
    mount:'#liste', id:'lead', key:'kod', source:function(){ return DB.leads; },
    exportName:'musteri-adaylari', exportTitle:'Müşteri Adayları Listesi',
    search:{ placeholder:'Firma, yetkili, hizmet veya lead no ara',
             fields:['kod','firma','yetkili','hizmet','ozet','sektor','yonlendiren','etiketler'] },
    defaultSort:'sonrakiTarih', pageSize:10, views:['table','card'],

    kpis:[
      { label:'Toplam aday', icon:'i-user-plus', calc:function(a){ return a.length; }, href:'app-lead.html' },
      { label:'Açık fırsat', icon:'i-funnel', tone:'info', calc:function(a){ return a.filter(acikAsama).length; } },
      { label:'Sıcak aday', icon:'i-trend-up', tone:'danger', calc:function(a){ return a.filter(function(r){ return r.sicaklik === 'Sıcak' && acikAsama(r); }).length; } },
      { label:'Açık pipeline değeri', icon:'i-wallet', tone:'ok', format:F.moneyK,
        calc:function(a){ return a.filter(acikAsama).reduce(function(s,r){ return s + r.butce; }, 0); } }
    ],

    tabs:[
      { key:'acik',    label:'Açık Adaylar', icon:'i-funnel',      filter:acikAsama },
      { key:'yeni',    label:'Yeni Talepler', icon:'i-inbox',      filter:function(r){ return r.asama === 'Yeni talep'; } },
      { key:'sicak',   label:'Sıcak',        icon:'i-trend-up',    filter:function(r){ return r.sicaklik === 'Sıcak' && acikAsama(r); } },
      { key:'aksiyon', label:'Aksiyonu Gecikenler', icon:'i-alert', filter:function(r){ return r.sonrakiTarih && F.days(r.sonrakiTarih) < 0 && acikAsama(r); } },
      { key:'kazanan', label:'Kazanılanlar', icon:'i-check-circle',filter:function(r){ return r.asama === 'Kazanıldı'; } },
      { key:'kayip',   label:'Kaybedilenler',icon:'i-x-circle',    filter:function(r){ return r.asama === 'Kaybedildi'; } },
      { key:'bekleme', label:'Beklemede',    icon:'i-hourglass',   filter:function(r){ return r.asama === 'Beklemeye alındı'; } },
      { key:'tumu',    label:'Tümü',         icon:'i-list',        filter:null }
    ],

    columns:[
      { key:'firma', label:'Firma / Talep', width:'25%', cellClass:'cell-wrap', locked:true,
        render:function(r){ return '<a class="cell-main" href="app-lead-detay.html?id=' + r.kod + '">' + GV.esc(r.firma) + '</a>' +
          '<span class="cell-sub">' + GV.esc(r.ozet) + '</span><span class="cell-code">' + r.kod + '</span>'; },
        exportValue:function(r){ return r.firma + ' — ' + r.ozet; } },
      { key:'yetkili', label:'Yetkili', render:function(r){
          return '<span class="cell-main">' + GV.esc(r.yetkili) + '</span><span class="cell-sub">' + GV.esc(r.tel) + '</span>'; } },
      { key:'hizmet', label:'İlgilendiği hizmet', render:function(r){ return '<span class="tag">' + GV.esc(r.hizmet) + '</span>'; } },
      { key:'sektor', label:'Sektör', visible:false },
      { key:'yonlendiren', label:'Kaynak / Yönlendiren', render:function(r){
          return '<span class="cell-main">' + GV.esc(r.kaynak) + '</span>' +
                 (r.yonlendiren && r.yonlendiren !== '—' ? '<span class="cell-sub">' + GV.esc(r.yonlendiren) + '</span>' : ''); } },
      { key:'sorumlu', label:'Satış sorumlusu', render:function(r){ return GV.user(r.sorumlu, { sm:true }); },
        sortValue:function(r){ return DB.empName(r.sorumlu); }, exportValue:function(r){ return DB.empName(r.sorumlu); } },
      { key:'butce', label:'Tahmini bütçe (KDV hariç)', cellClass:'num', render:function(r){ return '<span class="cell-money">' + F.money(r.butce) + '</span>'; } },
      { key:'puan', label:'Lead puanı', cellClass:'num', visible:false, render:function(r){ return GV.progress(r.puan); } },
      { key:'sicaklik', label:'Sıcaklık', render:function(r){ return GV.badge(r.sicaklik); } },
      { key:'oncelik', label:'Öncelik', visible:false, render:function(r){ return GV.pri(r.oncelik); } },
      { key:'sonrakiTarih', label:'Sonraki aksiyon', render:function(r){
          if(!r.sonrakiTarih) return '<span class="u-faint">—</span>';
          return GV.dateCell(r.sonrakiTarih) + '<span class="cell-sub">' + GV.esc(r.sonrakiAksiyon) + '</span>'; } },
      { key:'sonIletisim', label:'Son iletişim', visible:false, render:function(r){ return F.date(r.sonIletisim); } },
      { key:'asama', label:'Aşama', render:function(r){ return GV.badge(r.asama); } }
    ],

    filters:[
      { key:'asama', label:'Satış aşaması', type:'multi', options:DB.pipelineStages.map(function(s){ return s.key; }) },
      { key:'sorumlu', label:'Satış sorumlusu', type:'select',
        options:DB.employees.filter(function(e){ return ['satismudur','satistemsilci','sahip'].indexOf(e.rol) !== -1; })
                            .map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'hizmet', label:'İlgilendiği hizmet', type:'multi', options:DB.services },
      { key:'sektor', label:'Sektör', type:'multi', options:DB.sectors },
      { key:'kaynak', label:'Müşteri kaynağı', type:'select', options:DB.refTypes },
      { key:'sicaklik', label:'Sıcaklık seviyesi', type:'select', options:['Sıcak','Ilık','Soğuk'] },
      { key:'oncelik', label:'Öncelik', type:'select', options:['Kritik','Yüksek','Orta','Düşük'] },
      { key:'butce', label:'Tahmini bütçe, KDV hariç (en az)', type:'text',
        test:function(r,v){ return r.butce >= (parseFloat(v) || 0); } },
      { key:'talepTarihi', label:'Talep tarihi', type:'daterange' }
    ],

    rowClass:function(r){ return (r.sonrakiTarih && F.days(r.sonrakiTarih) < 0 && acikAsama(r)) ? 'is-late' : ''; },

    rowActions:[
      { key:'ac', icon:'i-external', label:'Detayı aç', href:function(r){ return 'app-lead-detay.html?id=' + r.kod; } },
      { key:'duzenle', icon:'i-edit', label:'Düzenle', href:function(r){ return 'app-lead-form.html?id=' + r.kod; } },
      { key:'arsiv', icon:'i-archive', label:'Arşivle', run:function(r, refresh){
          GV.confirm({ title:'Adayı arşivle', text:r.firma + ' adayı arşive taşınacak. Listeden gizlenir ancak silinmez.', okLabel:'Arşivle' })
            .then(function(ok){ if(ok){ r.arsiv = true; GV.toast(r.kod + ' arşivlendi', 'ok'); refresh(); } }); } }
    ],

    bulk:[
      { key:'atama', label:'Sorumlu ata', icon:'i-user-check' },
      { key:'asama', label:'Aşama değiştir', icon:'i-funnel' },
      { key:'disa', label:'Dışa aktar', icon:'i-download' },
      { key:'arsiv', label:'Arşivle', icon:'i-archive', tone:'danger', confirm:'{n} aday arşive taşınacak. Onaylıyor musunuz?' }
    ],

    card:function(r){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-lead-detay.html?id=' + r.kod + '">' + GV.esc(r.firma) + '</a>' +
        '<div class="cell-code">' + r.kod + '</div></div>' + GV.badge(r.asama) + '</div>' +
        '<p class="u-sm u-muted u-mt-0">' + GV.esc(r.ozet) + '</p>' +
        '<div class="gv-rcard-meta"><span>' + GV.esc(r.yetkili) + '</span><span>' + GV.esc(r.hizmet) + '</span></div>' +
        '<div class="gv-rcard-foot"><span class="cell-money">' + F.money(r.butce) + '</span>' + GV.user(r.sorumlu, { sm:true }) + '</div>';
    },

    mobile:function(r){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-lead-detay.html?id=' + r.kod + '">' + GV.esc(r.firma) + '</a>' +
        GV.badge(r.sicaklik) + '</div>' +
        '<div class="gv-mrow-code">' + r.kod + ' · ' + GV.esc(r.hizmet) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.esc(r.yetkili) + '</span><span>' + F.money(r.butce) + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(r.asama) + '</span>' +
        (r.sonrakiTarih ? GV.dateCell(r.sonrakiTarih) : '') + '</div>';
    },

    emptyState:{ icon:'i-user-plus', title:'Bu görünümde müşteri adayı yok',
      desc:'Filtreleri değiştirebilir veya yeni bir müşteri adayı ekleyerek satış sürecini başlatabilirsiniz.',
      action:'<a class="btn btn-acc" href="app-lead-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Müşteri Adayı</a>' }
  });
});
</script>
</body>
</html>
