<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>İletişim Geçmişi — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="musteri" data-screen="iletisim">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  var TUR_ICON = { 'Toplantı':'i-users', 'Telefon':'i-phone', 'E-posta':'i-mail', 'Ziyaret':'i-home' };
  var adOf = function(x){
    if(x.musteri){ var m = DB.customers.filter(function(c){ return c.kod === x.musteri; })[0]; return m ? m.unvan : x.musteri; }
    if(x.lead){ var l = DB.leads.filter(function(c){ return c.kod === x.lead; })[0]; return l ? l.firma : x.lead; }
    return '—';
  };
  GV.pageHead({ eyebrow:'Müşteri Yönetimi', title:'İletişim Geçmişi',
    actions:[{ label:'Müşteriler', icon:'i-building', href:'app-musteri.html' },
             { label:'Görüşme Kaydet', icon:'i-plus', cls:'btn-acc', href:'app-musteri-iletisim-form.html' }] });
  GV.list({
    mount:'#liste', id:'iletisim', key:'kod', source:function(){ return DB.interactions; },
    exportName:'iletisim-gecmisi', exportTitle:'Müşteri İletişim Geçmişi', pageSize:25,
    search:{ placeholder:'Konu, kişi, özet veya sonuç ara', fields:['kod','konu','ozet','kontak','sonuc','tur'] },
    defaultSort:'tarih', defaultDir:'desc',
    kpis:[
      { label:'Toplam görüşme', icon:'i-phone', calc:function(a){ return a.length; } },
      { label:'Bu ay', icon:'i-calendar', tone:'info',
        calc:function(a){ return a.filter(function(x){ return String(x.tarih).slice(0,7) === DB.today.slice(0,7); }).length; } },
      { label:'Toplantı', icon:'i-users', tone:'purple', calc:function(a){ return a.filter(function(x){ return x.tur === 'Toplantı'; }).length; } },
      { label:'Müşteri adayı görüşmesi', icon:'i-user-plus', tone:'ok', calc:function(a){ return a.filter(function(x){ return !!x.lead; }).length; } }
    ],
    tabs:[
      { key:'tumu', label:'Tüm Görüşmeler', icon:'i-list', filter:null },
      { key:'toplanti', label:'Toplantılar', icon:'i-users', filter:function(x){ return x.tur === 'Toplantı'; } },
      { key:'telefon', label:'Telefon', icon:'i-phone', filter:function(x){ return x.tur === 'Telefon'; } },
      { key:'eposta', label:'E-posta', icon:'i-mail', filter:function(x){ return x.tur === 'E-posta'; } },
      { key:'musteri', label:'Mevcut Müşteri', icon:'i-building', filter:function(x){ return !!x.musteri; } },
      { key:'aday', label:'Müşteri Adayı', icon:'i-user-plus', filter:function(x){ return !!x.lead; } }
    ],
    columns:[
      { key:'konu', label:'Görüşme', width:'26%', locked:true, cellClass:'cell-wrap', render:function(x){
          return '<span class="cell-main">' + esc(x.konu) + '</span><span class="cell-sub">' + esc(x.ozet) + '</span>' +
                 '<span class="cell-code">' + x.kod + '</span>'; } },
      { key:'tur', label:'Kanal', render:function(x){
          return '<span class="tag">' + GV.ico(TUR_ICON[x.tur] || 'i-chat','ic-sm') + ' ' + esc(x.tur) + '</span>'; } },
      { key:'firma', label:'Müşteri / Aday', sortValue:adOf, render:function(x){
          var href = x.musteri ? 'app-musteri-detay.html?id=' + x.musteri : (x.lead ? 'app-lead-detay.html?id=' + x.lead : null);
          return href ? '<a class="cell-main" href="' + href + '">' + esc(adOf(x)) + '</a>' : '<span class="u-faint">—</span>'; },
        exportValue:adOf },
      { key:'kontak', label:'Görüşülen kişi' },
      { key:'kisi', label:'Şirket içi', render:function(x){ return GV.user(x.kisi, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.kisi); }, exportValue:function(x){ return DB.empName(x.kisi); } },
      { key:'sonuc', label:'Sonuç', cellClass:'cell-wrap' },
      { key:'tarih', label:'Tarih', render:function(x){ return '<span class="cell-date">' + F.dt(x.tarih) + '</span>'; } }
    ],
    filters:[
      { key:'tur', label:'İletişim kanalı', type:'multi', options:DB.interactionTypes }   /* VB-14 */,
      { key:'kisi', label:'Şirket içi kişi', type:'select', options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'musteri', label:'Müşteri', type:'select', options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'tarih', label:'Görüşme tarihi', type:'daterange' }
    ],
    mobile:function(x){
      return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.konu) + '</span>' +
        '<span class="tag">' + esc(x.tur) + '</span></div>' +
        '<div class="gv-mrow-code">' + esc(adOf(x)) + ' · ' + esc(x.kontak) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-clock','ic-sm') + F.dt(x.tarih) + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="u-sm u-muted">' + esc(x.sonuc) + '</span></div>';
    },
    rowActions:[
      { key:'detay', icon:'i-eye', label:'Görüşme özeti', run:function(x){
          GV.modal({ title:x.konu, text:esc(adOf(x)) + ' · ' + esc(x.kontak) + ' · ' + F.dt(x.tarih), icon:TUR_ICON[x.tur] || 'i-chat', size:'sm',
            body:'<div class="gv-dl"><div><dt>Özet</dt><dd>' + esc(x.ozet) + '</dd></div>' +
                 '<div><dt>Sonuç</dt><dd>' + esc(x.sonuc) + '</dd></div>' +
                 '<div><dt>Şirket içi katılımcı</dt><dd>' + esc(DB.empName(x.kisi)) + '</dd></div></div>',
            actions:[{ label:'Kapat', cls:'btn-acc' }] }); } }
    ],
    bulk:[{ key:'disa', label:'Dışa aktar', icon:'i-download', export:true }],
    emptyState:{ icon:'i-phone', title:'Bu görünümde görüşme kaydı yok',
      desc:'Müşteriyle yapılan her görüşmeyi kaydedin — geçmiş tek yerde toplanır ve kaybolmaz.' }
  });

});
</script>
</body>
</html>
