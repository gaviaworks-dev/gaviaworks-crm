<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yetkili Kişiler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="musteri" data-screen="yetkili">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  var mus = function(k){ return DB.customers.filter(function(c){ return c.kod === k; })[0] || {}; };
  GV.pageHead({ eyebrow:'Müşteri Yönetimi', title:'Yetkili Kişiler',
    actions:[{ label:'Müşteriler', icon:'i-building', href:'app-musteri.html' },
             { label:'Yeni Yetkili', icon:'i-plus', cls:'btn-acc', href:'app-musteri-yetkili-form.html' }] });
  GV.list({
    mount:'#liste', id:'yetkili', key:'kod', source:function(){ return DB.contacts; },
    exportName:'yetkililer', exportTitle:'Müşteri Yetkilileri', pageSize:25,
    search:{ placeholder:'Ad, pozisyon, e-posta veya firma ara', fields:['kod','ad','pozisyon','eposta','tel'] },
    defaultSort:'ad',
    kpis:[
      { label:'Toplam yetkili', icon:'i-user', calc:function(a){ return a.length; } },
      { label:'Birincil kontak', icon:'i-star', tone:'ok', calc:function(a){ return a.filter(function(x){ return x.birincil; }).length; } },
      { label:'Karar verici', icon:'i-user-check', tone:'purple', calc:function(a){ return a.filter(function(x){ return x.karar; }).length; } },
      { label:'Pasif kayıt', icon:'i-archive', tone:'neutral', calc:function(a){ return a.filter(function(x){ return !x.aktif; }).length; } }
    ],
    tabs:[
      { key:'aktif', label:'Aktif Yetkililer', icon:'i-users', filter:function(x){ return x.aktif; } },
      { key:'birincil', label:'Birincil Kontaklar', icon:'i-star', filter:function(x){ return x.birincil && x.aktif; } },
      { key:'karar', label:'Karar Vericiler', icon:'i-user-check', filter:function(x){ return x.karar && x.aktif; } },
      { key:'pasif', label:'Pasif', icon:'i-archive', filter:function(x){ return !x.aktif; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'ad', label:'Yetkili', width:'22%', locked:true, cellClass:'cell-wrap', render:function(x){
          return '<span class="cell-main">' + esc(x.ad) + '</span><span class="cell-sub">' + esc(x.pozisyon) + '</span>' +
                 '<span class="cell-code">' + x.kod + '</span>'; } },
      { key:'musteri', label:'Firma', render:function(x){
          var m = mus(x.musteri);
          return '<a class="cell-main" href="app-musteri-detay.html?id=' + x.musteri + '">' + esc(m.unvan || x.musteri) + '</a>' +
                 (m.sektor ? '<span class="cell-sub">' + esc(m.sektor) + '</span>' : ''); },
        sortValue:function(x){ return mus(x.musteri).unvan || ''; }, exportValue:function(x){ return mus(x.musteri).unvan || x.musteri; } },
      { key:'tel', label:'Telefon' },
      { key:'eposta', label:'E-posta', render:function(x){ return '<a href="mailto:' + esc(x.eposta) + '">' + esc(x.eposta) + '</a>'; } },
      { key:'birincil', label:'Birincil', render:function(x){ return x.birincil ? '<span class="badge is-ok no-dot">Birincil</span>' : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return x.birincil ? 'Evet' : 'Hayır'; } },
      { key:'karar', label:'Karar verici', render:function(x){ return x.karar ? '<span class="badge is-purple no-dot">Karar verici</span>' : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return x.karar ? 'Evet' : 'Hayır'; } },
      { key:'aktif', label:'Durum', render:function(x){ return GV.badge(x.aktif ? 'Aktif' : 'Pasif'); } }
    ],
    filters:[
      { key:'musteri', label:'Firma', type:'select', options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'birincil', label:'Birincil kontak', type:'select', options:[{ value:'e', label:'Sadece birincil' }], test:function(x){ return x.birincil; } },
      { key:'karar', label:'Karar verici', type:'select', options:[{ value:'e', label:'Sadece karar vericiler' }], test:function(x){ return x.karar; } }
    ],
    rowClass:function(x){ return x.aktif ? '' : 'is-passive'; },
    mobile:function(x){
      return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.ad) + '</span>' +
        (x.birincil ? '<span class="badge is-ok no-dot">Birincil</span>' : '') + '</div>' +
        '<div class="gv-mrow-code">' + esc(x.pozisyon) + ' · ' + esc(mus(x.musteri).kisa || '') + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-phone','ic-sm') + esc(x.tel) + '</span></div>';
    },
    rowActions:[
      { key:'firma', icon:'i-building', label:'Firmayı aç', href:function(x){ return 'app-musteri-detay.html?id=' + x.musteri; } },
      { key:'mail', icon:'i-mail', label:'E-posta gönder', href:function(x){ return 'mailto:' + x.eposta; } }
    ],
    bulk:[{ key:'disa', label:'Dışa aktar', icon:'i-download', export:true }],
    emptyState:{ icon:'i-user', title:'Bu görünümde yetkili yok', desc:'Müşteri kartlarına yetkili kişi ekleyerek iletişim geçmişini kişiye bağlayabilirsiniz.' }
  });

});
</script>
</body>
</html>
