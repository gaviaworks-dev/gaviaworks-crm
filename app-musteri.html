<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Müşteriler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="musteri" data-screen="musteri">
<a class="gv-skip" href="#gvMain">İçeriğe atla</a>

<div class="gv-app">
  <aside class="gv-rail" id="gvRail"></aside>
  <nav class="gv-menu" id="gvMenu"></nav>
  <button type="button" class="gv-divider" id="gvDivider" aria-label="Menüyü daralt veya genişlet">
    <span><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chev-left"></use></svg></span>
  </button>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main" id="gvMain">
    <div class="gv-page">
      <nav class="gv-crumb" id="gvCrumb" aria-label="Konum"></nav>
      <div class="gv-page-head">
        <div>
          <div class="ph-eyebrow">Müşteri Yönetimi</div>
          <h1>Müşteriler</h1>
          <div class="ph-sub" data-listcount>—</div>
        </div>
        <div class="ph-actions">
          <a class="btn btn-line" href="app-musteri-iletisim.html">
            <svg class="ic" aria-hidden="true"><use href="#i-phone"></use></svg> İletişim Geçmişi
          </a>
          <a class="btn btn-acc" href="app-musteri-form.html">
            <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg> Yeni Müşteri
          </a>
        </div>
      </div>
      <div id="liste"></div>
    </div>
  </main>
</div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt;
  var canFinans = GV.perm.can('finans');

  GV.list({
    mount:'#liste', id:'musteri', key:'kod', source:function(){ return DB.customers; },
    exportName:'musteriler', exportTitle:'Müşteri Listesi', pageSize:10, views:['table','card'],
    search:{ placeholder:'Firma, sektör, yetkili veya müşteri no ara',
             fields:['kod','unvan','kisa','sektor','adres','etiketler','sonrakiAksiyon'] },
    defaultSort:'unvan',

    kpis:[
      { label:'Toplam müşteri', icon:'i-building', calc:function(a){ return a.length; } },
      { label:'Aktif müşteri', icon:'i-check-circle', tone:'ok',
        calc:function(a){ return a.filter(function(c){ return c.durum === 'Aktif'; }).length; } },
      { label:'Riskli müşteri', icon:'i-alert-circle', tone:'danger',
        calc:function(a){ return a.filter(function(c){ return c.risk === 'Yüksek' || c.durum === 'Riskli'; }).length; } },
      { label:'Bekleyen tahsilat', icon:'i-wallet', tone:'warn', format:F.moneyK,
        perm:'finans', calc:function(a){ return a.reduce(function(s,c){ return s + c.bekleyenTahsilat; }, 0); },
        href:'app-tahsilat.html' }
    ],

    tabs:[
      { key:'tumu',       label:'Tüm Müşteriler',      icon:'i-list',         filter:null },
      { key:'aktif',      label:'Aktif Müşteriler',    icon:'i-check-circle', filter:function(c){ return c.durum === 'Aktif'; } },
      { key:'potansiyel', label:'Potansiyel',          icon:'i-user-plus',    filter:function(c){ return c.durum === 'Potansiyel'; } },
      { key:'riskli',     label:'Riskli Müşteriler',   icon:'i-alert',        filter:function(c){ return c.risk === 'Yüksek' || c.durum === 'Riskli'; } },
      { key:'pasif',      label:'Pasif Müşteriler',    icon:'i-archive',      filter:function(c){ return c.durum === 'Pasif'; } }
    ],

    columns:[
      { key:'unvan', label:'Firma', width:'24%', cellClass:'cell-wrap', locked:true,
        render:function(c){ return '<a class="cell-main" href="app-musteri-detay.html?id=' + c.kod + '">' + GV.esc(c.unvan) + '</a>' +
          '<span class="cell-code">' + c.kod + ' · ' + GV.esc(c.sektor) + '</span>'; } },
      { key:'sektor', label:'Sektör', visible:false },
      { key:'buyukluk', label:'Firma büyüklüğü', visible:false },
      { key:'sorumlu', label:'Müşteri sorumlusu', render:function(c){ return GV.user(c.sorumlu, { sm:true }); },
        sortValue:function(c){ return DB.empName(c.sorumlu); }, exportValue:function(c){ return DB.empName(c.sorumlu); } },
      { key:'kaynak', label:'Kaynak', visible:false, render:function(c){
          var r = DB.referrers.filter(function(x){ return x.kod === c.referans; })[0];
          return '<span class="cell-main">' + GV.esc(c.kaynak) + '</span>' + (r ? '<span class="cell-sub">' + GV.esc(r.ad) + '</span>' : ''); } },
      { key:'aktifProje', label:'Proje', cellClass:'num', render:function(c){
          return '<span class="u-num"><b>' + c.aktifProje + '</b> aktif / ' + c.projeSayisi + '</span>'; } },
      { key:'toplamCiro', label:'Toplam ciro', cellClass:'num', render:function(c){
          return canFinans ? '<span class="cell-money">' + F.money(c.toplamCiro) + '</span>' : '<span class="cell-mask">••••••</span>'; },
        exportValue:function(c){ return canFinans ? c.toplamCiro : ''; } },
      { key:'bekleyenTahsilat', label:'Bekleyen tahsilat', cellClass:'num', render:function(c){
          if(!canFinans) return '<span class="cell-mask">••••••</span>';
          return c.bekleyenTahsilat ? '<span class="cell-money u-danger">' + F.money(c.bekleyenTahsilat) + '</span>' : '<span class="u-faint">—</span>'; },
        exportValue:function(c){ return canFinans ? c.bekleyenTahsilat : ''; } },
      { key:'memnuniyet', label:'Memnuniyet', render:function(c){
          if(c.memnuniyet == null) return '<span class="u-faint">—</span>';
          var t = c.memnuniyet >= 4 ? 'is-ok' : c.memnuniyet >= 3 ? 'is-warn' : 'is-danger';
          return '<span class="badge ' + t + '">' + c.memnuniyet.toFixed(1) + ' / 5</span>'; } },
      { key:'sonIletisim', label:'Son iletişim', render:function(c){ return '<span class="cell-date">' + F.date(c.sonIletisim) + '</span>'; } },
      { key:'sonrakiTarih', label:'Sonraki aksiyon', visible:false, render:function(c){
          if(!c.sonrakiTarih) return '<span class="u-faint">—</span>';
          return GV.dateCell(c.sonrakiTarih) + '<span class="cell-sub">' + GV.esc(c.sonrakiAksiyon) + '</span>'; } },
      { key:'risk', label:'Risk', visible:false, render:function(c){
          return '<span class="badge ' + (c.risk === 'Yüksek' ? 'is-danger' : c.risk === 'Orta' ? 'is-warn' : 'is-ok') + '">' + GV.esc(c.risk) + '</span>'; } },
      { key:'durum', label:'Durum', render:function(c){ return GV.badge(c.durum); } }
    ],

    filters:[
      { key:'durum', label:'Müşteri durumu', type:'multi', options:['Aktif','Potansiyel','Riskli','Pasif'] },
      { key:'sektor', label:'Sektör', type:'multi', options:DB.sectors },
      { key:'risk', label:'Risk seviyesi', type:'select', options:['Düşük','Orta','Yüksek'] },
      { key:'sorumlu', label:'Müşteri sorumlusu', type:'select',
        options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'kaynak', label:'Müşteri kaynağı', type:'multi', options:DB.refTypes },
      /* UID-21 — YÖNLENDİREN EKSENİ. Bağlantı eskiden yönlendirenin TÜRÜNE göre
         süzüyordu (`f_kaynak=Mevcut müşteri`): REF-001 satırından gidildiğinde o
         kişinin getirdikleri değil, aynı KANALDAN gelen tüm kayıtlar listeleniyordu.
         Bağlantı çalıştığı için hata sessizdi — UID-12 ile aynı sınıf. Gerçek bağ
         zaten veride yazılı (`referans`), yalnız süzgeç anahtarı yoktu. */
      { key:'referans', label:'Yönlendiren kişi', type:'select',
        options:DB.referrers.map(function(r){ return { value:r.kod, label:r.ad + ' · ' + r.tur }; }) },
      { key:'buyukluk', label:'Firma büyüklüğü', type:'multi', options:['10-50','50-100','100-250','250-500','500+'] },
      { key:'bekleyenTahsilat', label:'Bekleyen tahsilatı olanlar', type:'select',
        options:[{ value:'var', label:'Sadece bekleyen tahsilatı olanlar' }],
        test:function(c){ return c.bekleyenTahsilat > 0; } },
      { key:'ilkKayit', label:'İlk kayıt tarihi', type:'daterange' }
    ],

    rowClass:function(c){ return (c.risk === 'Yüksek' || c.durum === 'Riskli') ? 'is-late' : (c.durum === 'Pasif' ? 'is-passive' : ''); },

    card:function(c){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-musteri-detay.html?id=' + c.kod + '">' + GV.esc(c.kisa) + '</a>' +
        '<div class="cell-code">' + c.kod + ' · ' + GV.esc(c.sektor) + '</div></div>' + GV.badge(c.durum) + '</div>' +
        '<div class="gv-rcard-meta"><span>' + c.aktifProje + ' aktif proje</span>' +
        (c.memnuniyet != null ? '<span>Memnuniyet ' + c.memnuniyet + '/5</span>' : '') + '</div>' +
        '<div class="gv-rcard-foot">' + (canFinans ? '<span class="cell-money">' + F.money(c.toplamCiro) + '</span>' : '<span class="cell-mask">••••</span>') +
        GV.user(c.sorumlu, { sm:true }) + '</div>';
    },

    mobile:function(c){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-musteri-detay.html?id=' + c.kod + '">' + GV.esc(c.unvan) + '</a>' +
        GV.badge(c.durum) + '</div>' +
        '<div class="gv-mrow-code">' + c.kod + ' · ' + GV.esc(c.sektor) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-briefcase','ic-sm') + c.aktifProje + ' aktif proje</span>' +
        (canFinans ? '<span>' + GV.ico('i-wallet','ic-sm') + F.moneyK(c.toplamCiro) + '</span>' : '') + '</div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.user(c.sorumlu, { sm:true }) + '</span>' +
        '<span class="cell-date">' + F.dateShort(c.sonIletisim) + '</span></div>';
    },

    rowActions:[
      { key:'ac', icon:'i-external', label:'Müşteri kartını aç', href:function(c){ return 'app-musteri-detay.html?id=' + c.kod; } },
      { key:'duzenle', icon:'i-edit', label:'Düzenle', href:function(c){ return 'app-musteri-form.html?id=' + c.kod; } },
      { key:'pasif', icon:'i-archive', label:'Pasife al', run:function(c, refresh){
          GV.confirm({ title:'Müşteriyi pasife al', text:c.unvan + ' pasif duruma alınacak. Kayıt silinmez, listede "Pasif" sekmesinde görünür.', okLabel:'Pasife al' })
            .then(function(ok){ if(ok){ c.durum = 'Pasif'; c.aktif = false; GV.toast(c.kod + ' pasife alındı', 'ok'); refresh(); } }); } }
    ],

    bulk:[
      { key:'sorumlu', label:'Sorumlu ata', icon:'i-user-check' },
      { key:'etiket', label:'Etiket ekle', icon:'i-tag' },
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true },
      { key:'pasif', label:'Pasife al', icon:'i-archive', tone:'danger', confirm:'{n} müşteri pasife alınacak. Onaylıyor musunuz?' }
    ],

    emptyState:{ icon:'i-building', title:'Bu görünümde müşteri yok',
      desc:'Filtreleri değiştirebilir veya yeni bir müşteri kaydı oluşturabilirsiniz.',
      action:'<a class="btn btn-acc" href="app-musteri-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Müşteri</a>' }
  });
});
</script>
</body>
</html>
