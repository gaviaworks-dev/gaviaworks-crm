<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ödeme Planları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="finans" data-screen="odemeplani">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  var canFinans = GV.perm.can('finans');
  var canKes    = canFinans && GV.perm.can('ekle');

  /* =================================================================
     ZİNCİR: milestone → sözleşme → fatura → tahsilat
     Yeni koleksiyon yok; satırlar her çağrıda canonical kayıtlardan
     yeniden türetilir (fatura kesildikten sonra zincir tazelensin diye).
     ================================================================= */
  function projeOf(kod){ return DB.projects.filter(function(p){ return p.kod === kod; })[0] || null; }
  function sozlesmeOf(m){ return DB.contracts.filter(function(c){ return c.kod === m.sozlesme; })[0] || null; }
  function planTaksit(m){ return DB.milestones.filter(function(x){ return x.sozlesme === m.sozlesme; }).length; }
  function faturaOf(ms){ return DB.invoices.filter(function(i){ return i.milestone === ms; })[0] || null; }
  function tahsilatOf(ftr){ return ftr ? (DB.payments.filter(function(t){ return t.fatura === ftr; })[0] || null) : null; }
  function pmsOf(kod){ return kod ? (DB.projectMilestones.filter(function(x){ return x.kod === kod; })[0] || null) : null; }

  /* Gecikme günü — referans DB.today (new Date() ile "bugün" alınmaz).
     Öncelik sırası: tahsilat kaydı → fatura vadesi → faturasız taksitin planlanan tarihi. */
  function gecikme(m, f, t){
    if(t) return t.gecikmeGun || 0;
    if(f && f.durum !== 'Ödendi' && f.vade && F.days(f.vade) < 0) return -F.days(f.vade);
    if(!f && m.odemeDurum !== 'Ödendi' && m.tarih && F.days(m.tarih) < 0) return -F.days(m.tarih);
    return 0;
  }

  function rows(){
    return DB.milestones.map(function(m){
      var p = projeOf(m.proje);
      var c = sozlesmeOf(m);
      var f = faturaOf(m.kod);
      var t = tahsilatOf(f ? f.kod : null);
      return {
        kod:m.kod, ad:m.ad, tarih:m.tarih, odeme:m.odeme, durum:m.durum,
        taksit:m.taksit, taksitAdet:planTaksit(m),
        odemeDurum:m.odemeDurum, ilerleme:m.ilerleme,
        proje:m.proje, projeAd:p ? p.ad : '',
        musteri:p ? p.musteri : null, musteriAd:p ? p.musteriAd : (c ? c.musteriAd : ''),
        sozlesme:c ? c.kod : null, odemePlani:c ? c.odemePlani : null,
        fatura:f ? f.kod : null, faturaDurum:f ? f.durum : null,
        faturaToplam:f ? f.toplam : null, faturaVade:f ? f.vade : null,
        tahsilat:t ? t.kod : null, tahsilatDurum:t ? t.durum : null,
        tahsilatTutar:t ? t.tutar : null,
        gecikmeGun:gecikme(m, f, t),
        /* REVİZE 06 — taksitin isteğe bağlı PROJE MILESTONE'u. Bağ ödeme
           kaydında durur (`DB.milestones[].milestone`), milestone'da ayna
           alan yoktur (§9d). Doküman: "İstenirse ödeme kaydında İlgili
           Milestone seçilebilir." */
        milestone:m.milestone || null,
        milestoneAd:pmsOf(m.milestone) ? pmsOf(m.milestone).baslik : null,
        milestoneDurum:pmsOf(m.milestone) ? pmsOf(m.milestone).durum : null
      };
    });
  }

  /* ---- ölçütler ---- */
  var faturasiz  = function(x){ return !x.fatura; };
  var faturali   = function(x){ return !!x.fatura; };
  var tahsilEdil = function(x){ return x.tahsilatDurum === 'Ödendi'; };
  var bekleyen   = function(x){ return x.odemeDurum !== 'Ödendi'; };
  var geciken    = function(x){ return x.gecikmeGun > 0; };
  /* Gerçek finans riski: taksit tamamlandı ama faturası hiç kesilmedi */
  var riskli     = function(x){ return x.durum === 'Tamamlandı' && !x.fatura; };
  var topla      = function(a, f){ return a.filter(f).reduce(function(s,x){ return s + (x.odeme || 0); }, 0); };

  var TUTAR_ARALIK = { '100 B ₺ altı':[0, 100000], '100 B – 200 B ₺':[100000, 200000],
                       '200 B – 300 B ₺':[200000, 300000], '300 B ₺ üzeri':[300000, Infinity] };

  /* ---- finans maskesi ---- */
  function para(v){
    return canFinans ? '<span class="cell-money">' + F.money(v) + '</span>'
                     : '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
  }
  function paraExp(v){ return canFinans ? v : '••••••'; }

  /* ---- yeni fatura kodu: mevcut en yüksek FTR sırasının bir fazlası ---- */
  function sonrakiFaturaKodu(){
    var mx = 0;
    DB.invoices.forEach(function(i){
      var m = /^FTR-\d{4}-(\d+)$/.exec(i.kod || '');
      if(m){ var n = parseInt(m[1], 10); if(n > mx) mx = n; }
    });
    var s = String(mx + 1);
    while(s.length < 3) s = '0' + s;
    return 'FTR-' + String(DB.today).slice(0,4) + '-' + s;
  }
  /* Gün ekleme — UTC ekseninde, yerel saat kayması yaşanmasın diye */
  function gunEkle(iso, n){
    var d = new Date(String(iso).slice(0,10) + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  }

  GV.pageHead({ eyebrow:'Finans', title:'Ödeme Planları',
    sub:'Sözleşme taksitlerinin fatura → tahsilat zinciri; taksit isteğe bağlı olarak bir proje milestone’una bağlanır (REVİZE 06)',
    actions:[{ label:'Faturalar', icon:'i-receipt', href:'app-fatura.html' },
             { label:'Tahsilatlar', icon:'i-wallet', href:'app-tahsilat.html' },
             { label:'Sözleşmeler', icon:'i-file-check', href:'app-sozlesme.html' }] });

  GV.list({
    mount:'#liste', id:'odemeplani', key:'kod', source:rows,
    exportName:'odeme-planlari', exportTitle:'Sözleşme Ödeme Planları', pageSize:10,
    views:['table','card'], archive:false,
    search:{ placeholder:'Taksit, proje, müşteri, sözleşme, fatura veya tahsilat no ara',
             fields:['kod','ad','proje','projeAd','musteriAd','sozlesme','odemePlani',
                     'fatura','tahsilat','durum','odemeDurum'] },
    defaultSort:'tarih', defaultDir:'asc',

    kpis:[
      { label:'Toplam plan tutarı (KDV hariç)', icon:'i-milestone', format:F.moneyK,
        perm:'finans', calc:function(a){ return topla(a, function(){ return true; }); },
        meta:function(a){ return a.length + ' taksit · ' +
          a.filter(function(x){ return !!x.sozlesme; }).length + ' sözleşmeye bağlı'; } },
      { label:'Faturalanmış', icon:'i-receipt', tone:'info', format:F.moneyK,
        perm:'finans', calc:function(a){ return topla(a, faturali); },
        meta:function(a){ return a.filter(faturali).length + ' taksitin faturası kesildi'; } },
      { label:'Tahsil edilmiş', icon:'i-check-circle', tone:'ok', format:F.moneyK,
        perm:'finans', calc:function(a){ return topla(a, tahsilEdil); },
        meta:function(a){ return a.filter(tahsilEdil).length + ' taksit kapandı'; } },
      { label:'Faturalanmayı bekleyen', icon:'i-hourglass', tone:'warn', format:F.moneyK,
        perm:'finans', calc:function(a){ return topla(a, riskli); },
        meta:function(a){ return a.filter(riskli).length + ' tamamlanan taksit faturasız · ' +
          a.filter(faturasiz).length + ' taksit henüz faturalanmadı'; },
        metaTone:'warn' },
      { label:'Geciken taksit', icon:'i-alert', tone:'danger', format:F.moneyK,
        perm:'finans', calc:function(a){ return topla(a, geciken); },
        meta:function(a){ return a.filter(geciken).length + ' taksitin ödemesi gecikti'; },
        metaTone:'danger' }
    ],

    tabs:[
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null },
      { key:'bekleyen', label:'Bekleyen', icon:'i-clock', filter:bekleyen },
      { key:'faturalandi', label:'Faturalandı', icon:'i-receipt', filter:faturali },
      { key:'tahsil', label:'Tahsil Edildi', icon:'i-check-circle', filter:tahsilEdil },
      { key:'geciken', label:'Geciken', icon:'i-alert', filter:geciken },
      { key:'faturasiz', label:'Faturası Kesilmemiş', icon:'i-alert-circle', filter:faturasiz }
    ],

    columns:[
      { key:'kod', label:'Taksit', width:'12%', locked:true, cellClass:'cell-wrap',
        render:function(x){ return '<span class="cell-main">' + x.kod + '</span>' +
          '<span class="cell-code">' + x.proje + '</span>'; } },
      { key:'ad', label:'Taksit adı', width:'16%', cellClass:'cell-wrap',
        render:function(x){ return '<span class="cell-main">' + esc(x.ad) + '</span>' +
          (x.odemePlani ? '<span class="cell-sub">' + esc(x.odemePlani) + '</span>' : ''); } },
      { key:'proje', label:'Proje', cellClass:'cell-wrap', render:function(x){
          return '<a class="cell-main" href="app-proje.html?t=tumu&q=' + x.proje + '">' + esc(x.projeAd) + '</a>' +
                 '<span class="cell-code">' + x.proje + '</span>'; },
        exportValue:function(x){ return x.projeAd; } },
      /* İlgili milestone — İSTEĞE BAĞLI bağ. Taksit bir proje olayına
         karşılık gelmiyorsa hücre "Bağlı değil" der; boş bırakmak
         "bağ kurulmamış" ile "bağ yok" arasındaki farkı siler. */
      { key:'milestone', label:'İlgili milestone', cellClass:'cell-wrap', render:function(x){
          return x.milestone
            ? '<a class="cell-main" href="app-proje-milestone.html?t=tumu&q=' + x.milestone + '">' + esc(x.milestoneAd) + '</a>' +
              '<span class="cell-code">' + x.milestone + '</span>' + GV.badge(x.milestoneDurum)
            : '<span class="u-faint">Bağlı değil</span>'; },
        exportValue:function(x){ return x.milestone || ''; } },
      { key:'musteriAd', label:'Müşteri', cellClass:'cell-wrap', render:function(x){
          return x.musteri
            ? '<a class="cell-main" href="app-musteri.html?q=' + x.musteri + '">' + esc(x.musteriAd) + '</a>' +
              '<span class="cell-code">' + x.musteri + '</span>'
            : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return x.musteriAd; } },
      { key:'sozlesme', label:'Sözleşme', cellClass:'cell-wrap', render:function(x){
          return x.sozlesme
            ? '<a class="cell-main" href="app-sozlesme.html?t=tumu&q=' + x.sozlesme + '">' + x.sozlesme + '</a>' +
              '<span class="cell-sub">' + esc(x.odemePlani || '—') + '</span>'
            : '<span class="u-faint">Sözleşmesiz</span>'; } },
      { key:'odemePlani', label:'Ödeme planı', visible:false, sortable:false, render:function(x){
          return x.odemePlani ? '<span class="cell-sub">' + esc(x.odemePlani) + '</span>'
                              : '<span class="u-faint">—</span>'; } },
      { key:'tarih', label:'Planlanan tarih', render:function(x){
          return GV.dateCell(x.tarih, { done:x.durum === 'Tamamlandı' }) +
            (x.durum === 'Tamamlandı' ? '' : '<span class="cell-sub">' + F.rel(x.tarih) + '</span>'); } },
      { key:'taksit', label:'Taksit', cellClass:'num', render:function(x){
          return x.taksit ? '<span class="cell-main">' + x.taksit + ' / ' + x.taksitAdet + '</span>'
                          : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return x.taksit ? (x.taksit + '/' + x.taksitAdet) : ''; } },
      { key:'odeme', label:'Taksit tutarı (KDV hariç)', cellClass:'num',
        render:function(x){ return para(x.odeme); },
        exportValue:function(x){ return paraExp(x.odeme); } },
      { key:'durum', label:'Taksit durumu', render:function(x){ return GV.badge(x.durum); } },
      { key:'ilerleme', label:'İlerleme', cellClass:'num', render:function(x){ return GV.progress(x.ilerleme); },
        exportValue:function(x){ return (x.ilerleme == null ? '' : x.ilerleme + '%'); } },
      { key:'fatura', label:'Fatura', cellClass:'cell-wrap', render:function(x){
          return x.fatura
            ? '<a class="cell-main" href="app-fatura.html?t=tumu&q=' + x.fatura + '">' + x.fatura + '</a>' +
              GV.badge(x.faturaDurum)
            : '<span class="badge is-warn no-dot">Kesilmedi</span>'; },
        exportValue:function(x){ return x.fatura ? (x.fatura + ' · ' + x.faturaDurum) : 'Kesilmedi'; } },
      { key:'faturaToplam', label:'Fatura toplamı (KDV dahil)', cellClass:'num', visible:false,
        render:function(x){ return x.faturaToplam == null ? '<span class="u-faint">—</span>' : para(x.faturaToplam); },
        exportValue:function(x){ return x.faturaToplam == null ? '' : paraExp(x.faturaToplam); } },
      { key:'faturaVade', label:'Fatura vadesi', visible:false, render:function(x){
          return x.faturaVade ? GV.dateCell(x.faturaVade, { done:x.tahsilatDurum === 'Ödendi' })
                              : '<span class="u-faint">—</span>'; } },
      { key:'tahsilatDurum', label:'Tahsilat', cellClass:'cell-wrap', render:function(x){
          if(!x.fatura) return '<span class="u-faint">Fatura bekliyor</span>';
          if(!x.tahsilat) return '<span class="badge is-warn no-dot">Takipte değil</span>';
          return '<a class="cell-code" href="app-tahsilat.html?t=tumu&q=' + x.tahsilat + '">' + x.tahsilat + '</a>' +
                 GV.badge(x.tahsilatDurum); },
        exportValue:function(x){ return x.tahsilat ? (x.tahsilat + ' · ' + x.tahsilatDurum)
                                                   : (x.fatura ? 'Takipte değil' : 'Fatura bekliyor'); } },
      { key:'gecikmeGun', label:'Gecikme', cellClass:'num', render:function(x){
          return x.gecikmeGun > 0
            ? '<span class="u-num u-danger u-b">' + F.num(x.gecikmeGun) + ' gün</span>'
            : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return x.gecikmeGun || 0; } },
      { key:'odemeDurum', label:'Ödeme durumu', visible:false,
        render:function(x){ return GV.badge(x.odemeDurum); } }
    ],

    filters:[
      { key:'proje', label:'Proje', type:'select',
        options:DB.projects.map(function(p){ return { value:p.kod, label:p.ad }; }) },
      { key:'musteri', label:'Müşteri', type:'select',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'sozlesme', label:'Sözleşme', type:'select',
        options:DB.contracts.map(function(c){ return { value:c.kod, label:c.kod + ' · ' + c.musteriAd }; }) },
      { key:'milestoneVarmi', label:'Milestone bağı', type:'select', options:['Var','Yok'],
        test:function(x, v){ return v === 'Var' ? !!x.milestone : !x.milestone; } },
      { key:'durum', label:'Taksit durumu', type:'multi',
        options:['Tamamlandı','Yaklaşıyor','Gecikti','Planlandı'] },
      { key:'odemeDurum', label:'Ödeme durumu', type:'multi', options:['Ödendi','Bekliyor'] },
      { key:'faturaDurumu', label:'Fatura durumu', type:'select',
        options:['Faturalandı','Faturası kesilmemiş'],
        test:function(x, v){ return v === 'Faturalandı' ? !!x.fatura : !x.fatura; } },
      { key:'tarih', label:'Planlanan tarih', type:'daterange' },
      { key:'tutarAralik', label:'Taksit tutarı (KDV hariç)', type:'select', options:Object.keys(TUTAR_ARALIK),
        test:function(x, v){
          var r = TUTAR_ARALIK[v];
          return !!r && (x.odeme || 0) >= r[0] && (x.odeme || 0) < r[1]; } }
    ],

    rowClass:function(x){ return geciken(x) || riskli(x) ? 'is-late' : ''; },

    mobile:function(x){
      return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.ad) + '</span>' +
        (canFinans ? '<span class="cell-money">' + F.money(x.odeme) + '</span>'
                   : '<span class="cell-mask">••••••</span>') + '</div>' +
        '<div class="gv-mrow-code">' + x.kod + ' · ' + esc(x.musteriAd) + '</div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) +
        (x.fatura ? '<span class="tag">' + x.fatura + '</span>'
                  : '<span class="badge is-warn no-dot">Faturasız</span>') +
        (geciken(x) ? '<span class="badge is-danger">' + F.num(x.gecikmeGun) + ' gün gecikti</span>' : '') +
        '</span>' + GV.dateCell(x.tarih, { done:x.durum === 'Tamamlandı' }) + '</div>';
    },

    card:function(x){
      return '<div class="gv-rcard-top"><div><span class="cell-main">' + esc(x.ad) + '</span>' +
        '<div class="cell-sub">' + esc(x.projeAd) + '</div></div>' + GV.badge(x.durum) + '</div>' +
        '<div class="gv-rcard-meta"><span>' + x.kod + '</span>' +
        '<span>' + esc(x.musteriAd) + '</span>' +
        '<span>' + F.dateShort(x.tarih) + '</span></div>' +
        '<div class="gv-rcard-meta">' + GV.progress(x.ilerleme) + '</div>' +
        '<div class="gv-rcard-meta">' +
        '<span>' + (x.sozlesme ? x.sozlesme + ' · ' + esc(x.odemePlani || '—') : 'Sözleşmesiz') + '</span>' +
        '<span>' + (x.fatura ? x.fatura : 'Fatura kesilmedi') + '</span>' +
        '<span>' + (x.tahsilat ? x.tahsilat + ' · ' + x.tahsilatDurum : 'Tahsilat yok') + '</span></div>' +
        '<div class="gv-rcard-foot">' + para(x.odeme) +
        (geciken(x) ? '<span class="badge is-danger">' + F.num(x.gecikmeGun) + ' gün gecikti</span>'
                    : GV.badge(x.odemeDurum)) + '</div>';
    },

    rowActions:[
      { key:'proje', icon:'i-briefcase', label:'Projeyi aç',
        href:function(x){ return 'app-proje.html?t=tumu&q=' + x.proje; } },
      /* Zincirin o halkası yoksa aksiyon hiç basılmaz — hedefsiz düğme bırakılmaz.
         Eksik halka zaten "Fatura" / "Tahsilat" kolonlarında rozetle görünür. */
      { key:'fatura', icon:'i-receipt', label:'Faturayı aç',
        show:function(x){ return !!x.fatura; },
        href:function(x){ return 'app-fatura.html?t=tumu&q=' + x.fatura; } },
      { key:'tahsilat', icon:'i-wallet', label:'Tahsilatı aç',
        show:function(x){ return !!x.tahsilat; },
        href:function(x){ return 'app-tahsilat.html?t=tumu&q=' + x.tahsilat; } },
      { key:'faturakes', icon:'i-plus', label:'Fatura kes',
        show:function(x){ return canKes && !x.fatura; },
        run:function(x, refresh){
          var vergi  = Math.round(x.odeme * 0.20);
          var toplam = x.odeme + vergi;
          var kod    = sonrakiFaturaKodu();
          var vade   = gunEkle(DB.today, 30);
          GV.confirm({ title:'Taksit için fatura kes',
            text:x.kod + ' — ' + x.ad + ' taksiti için ' + kod + ' numaralı fatura oluşturulacak. ' +
                 'Matrah ' + F.money(x.odeme) + ' · KDV ' + F.money(vergi) + ' · Genel toplam ' + F.money(toplam) +
                 ' · Vade ' + F.date(vade) + '.',
            okLabel:'Fatura Kes' }).then(function(ok){
              if(!ok) return;
              DB.invoices.push({
                kod:kod, musteri:x.musteri, musteriAd:x.musteriAd, sozlesme:x.sozlesme,
                proje:x.proje, milestone:x.kod, tarih:DB.today, vade:vade,
                tutar:x.odeme, vergi:vergi, toplam:toplam,
                durum:'Ödenmedi', odemeTarihi:null, aktif:true
              });
              GV.toast(kod + ' kesildi — ' + x.kod + ' artık faturalar listesinde', 'ok');
              refresh();
            }); } }
    ],

    bulk:canFinans ? [
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true }
    ] : null,

    emptyState:{ icon:'i-milestone', title:'Bu görünümde taksit yok',
      desc:'Sözleşmeler projelere milestone olarak bağlandıkça ödeme planı taksitleri burada listelenir; her taksit fatura ve tahsilat zinciriyle izlenir.',
      action:'<a class="btn btn-acc" href="app-sozlesme.html"><svg class="ic"><use href="#i-file-check"></use></svg> Sözleşmeler</a>' }
  });

});
</script>
</body>
</html>
