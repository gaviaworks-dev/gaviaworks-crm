<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ön Analizler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satis" data-screen="onanaliz">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;

  GV.pageHead({ eyebrow:'Satış ve CRM', title:'Ön Analizler',
    actions:[{ label:'Teklifler', icon:'i-quote', href:'app-teklif.html' },
             { label:'Yeni Ön Analiz', icon:'i-plus', cls:'btn-acc', href:'app-onanaliz-form.html' }] });

  var ozet = function(a){
    var p = [];
    if(a.web) p.push('Web'); if(a.mobil) p.push('Mobil');
    if(a.yonetimPaneli) p.push('Yönetim paneli'); if(a.musteriPaneli) p.push('Müşteri paneli');
    if(a.aiOzellik) p.push('Yapay zekâ'); if(a.odeme) p.push('Ödeme');
    if(a.abonelik) p.push('Abonelik'); if(a.cokluDil) p.push('Çoklu dil');
    if(a.cokluSirket) p.push('Çoklu şirket'); if(a.raporlama) p.push('Raporlama');
    if(a.bildirim) p.push('Bildirim'); if(a.kvkk) p.push('KVKK');
    return p;
  };

  GV.list({
    mount:'#liste', id:'onanaliz', key:'kod', source:function(){ return DB.analyses; },
    exportName:'on-analizler', exportTitle:'Ön Analiz Listesi', pageSize:10, views:['table','card'],
    search:{ placeholder:'Analiz no, firma, hizmet veya amaç ara', fields:['kod','firma','hizmet','amac','hedefKullanici'] },
    defaultSort:'tarih', defaultDir:'desc',
    kpis:[
      { label:'Toplam ön analiz', icon:'i-clipboard', calc:function(a){ return a.length; } },
      { label:'Hazırlanan', icon:'i-edit', tone:'info',
        calc:function(a){ return a.filter(function(x){ return x.durum === 'Hazırlanıyor'; }).length; } },
      { label:'Onay bekleyen', icon:'i-stamp', tone:'warn',
        calc:function(a){ return a.filter(function(x){ return x.durum === 'Onay bekliyor'; }).length; } },
      { label:'Tahmini iş gücü', icon:'i-timer', tone:'purple', format:function(v){ return v + ' sa'; },
        calc:function(a){ return a.reduce(function(s,x){ return s + x.isgucu; }, 0); } }
    ],
    tabs:[
      { key:'acik', label:'Açık Analizler', icon:'i-clipboard', filter:function(x){ return x.durum !== 'Onaylandı'; } },
      { key:'hazir', label:'Hazırlanıyor', icon:'i-edit', filter:function(x){ return x.durum === 'Hazırlanıyor'; } },
      { key:'onay', label:'Onay Bekleyen', icon:'i-stamp', filter:function(x){ return x.durum === 'Onay bekliyor'; } },
      { key:'onayli', label:'Onaylananlar', icon:'i-check-circle', filter:function(x){ return x.durum === 'Onaylandı'; } },
      { key:'riskli', label:'Riskli', icon:'i-alert', filter:function(x){ return (x.riskler || []).length >= 2; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'firma', label:'Ön analiz', width:'24%', locked:true, cellClass:'cell-wrap',
        render:function(x){ return '<a class="cell-main" href="app-onanaliz-detay.html?id=' + x.kod + '">' + esc(x.firma) + '</a>' +
          '<span class="cell-sub">' + esc(x.amac) + '</span><span class="cell-code">' + x.kod + '</span>'; } },
      { key:'hizmet', label:'Hizmet', render:function(x){ return '<span class="tag">' + esc(x.hizmet) + '</span>'; } },
      { key:'kapsam', label:'Kapsam', sortable:false, cellClass:'cell-wrap', render:function(x){
          return ozet(x).slice(0,4).map(function(p){ return '<span class="tag">' + esc(p) + '</span>'; }).join(' ') +
                 (ozet(x).length > 4 ? '<span class="cell-sub">+' + (ozet(x).length - 4) + ' özellik</span>' : ''); },
        exportValue:function(x){ return ozet(x).join(', '); } },
      { key:'anaModul', label:'Modül', cellClass:'num', render:function(x){
          return '<span class="u-num"><b>' + x.anaModul + '</b> ana / ' + x.altModul + ' alt</span>'; },
        exportValue:function(x){ return x.anaModul + ' / ' + x.altModul; } },
      { key:'rolSayisi', label:'Rol', cellClass:'num', visible:false },
      { key:'ekip', label:'Tahmini ekip', cellClass:'num', render:function(x){ return '<span class="u-num">' + x.ekip + ' kişi</span>'; } },
      { key:'isgucu', label:'İş gücü', cellClass:'num', render:function(x){ return '<span class="u-num">' + F.num(x.isgucu) + ' sa</span>'; } },
      { key:'sure', label:'Süre', cellClass:'num', render:function(x){ return '<span class="u-num">' + x.sure + ' ' + x.sureBirim + '</span>'; } },
      { key:'tahminiBedel', label:'Tahmini bedel', cellClass:'num',
        render:function(x){ return '<span class="cell-money">' + F.money(x.tahminiBedel) + '</span>'; } },
      { key:'riskler', label:'Risk', cellClass:'num', sortValue:function(x){ return (x.riskler||[]).length; },
        render:function(x){ var n = (x.riskler||[]).length;
          return n ? '<span class="badge ' + (n >= 2 ? 'is-danger' : 'is-warn') + '">' + n + ' risk</span>' : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return (x.riskler||[]).join(' | '); } },
      { key:'hazirlayan', label:'Hazırlayan', render:function(x){ return GV.user(x.hazirlayan, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.hazirlayan); }, exportValue:function(x){ return DB.empName(x.hazirlayan); } },
      { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } }
    ],
    filters:[
      { key:'durum', label:'Analiz durumu', type:'multi', options:['Hazırlanıyor','Onay bekliyor','Onaylandı'] },
      { key:'hizmet', label:'Hizmet türü', type:'multi', options:DB.services },
      { key:'hazirlayan', label:'Hazırlayan', type:'select',
        options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'mobil', label:'Mobil ihtiyacı olanlar', type:'select',
        options:[{ value:'var', label:'Sadece mobil içerenler' }], test:function(x){ return x.mobil; } },
      { key:'aiOzellik', label:'Yapay zekâ içerenler', type:'select',
        options:[{ value:'var', label:'Sadece AI içerenler' }], test:function(x){ return x.aiOzellik; } },
      { key:'tahminiBedel', label:'Tahmini bedel (en az)', type:'text', test:function(x,v){ return x.tahminiBedel >= (parseFloat(v) || 0); } },
      { key:'tarih', label:'Analiz tarihi', type:'daterange' }
    ],
    rowClass:function(x){ return (x.riskler || []).length >= 2 ? 'is-late' : ''; },
    card:function(x){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-onanaliz-detay.html?id=' + x.kod + '">' + esc(x.firma) + '</a>' +
        '<div class="cell-code">' + x.kod + '</div></div>' + GV.badge(x.durum) + '</div>' +
        '<p class="u-sm u-muted u-mt-0">' + esc(x.amac) + '</p>' +
        '<div class="gv-rcard-meta"><span>' + x.anaModul + ' modül</span><span>' + x.ekip + ' kişi</span><span>' + x.sure + ' ' + x.sureBirim + '</span></div>' +
        '<div class="gv-rcard-foot"><span class="cell-money">' + F.money(x.tahminiBedel) + '</span>' + GV.user(x.hazirlayan, { sm:true }) + '</div>';
    },
    mobile:function(x){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-onanaliz-detay.html?id=' + x.kod + '">' + esc(x.firma) + '</a>' +
        GV.badge(x.durum) + '</div>' +
        '<div class="gv-mrow-code">' + x.kod + ' · ' + esc(x.hizmet) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-layers','ic-sm') + x.anaModul + ' modül</span>' +
        '<span>' + GV.ico('i-timer','ic-sm') + F.num(x.isgucu) + ' sa</span></div>' +
        '<div class="gv-mrow-bottom"><span class="cell-money">' + F.money(x.tahminiBedel) + '</span></div>';
    },
    rowActions:[
      { key:'ac', icon:'i-external', label:'Analizi aç', href:function(x){ return 'app-onanaliz-detay.html?id=' + x.kod; } },
      { key:'ciktilar', icon:'i-file', label:'Analiz çıktıları', run:function(x){
          GV.modal({ title:'Ön Analiz Çıktıları', text:x.kod + ' · ' + x.firma, icon:'i-file', size:'lg',
            body:'<p class="u-sm u-muted u-mb-4">PROMPT.md §10 — ön analiz sonucunda üretilen 10 çıktı:</p>' +
              '<div class="gv-tablewrap"><table class="gtable"><tbody>' +
              [['Proje kapsam dokümanı', x.kapsamIci.join(' · ')],
               ['Modül listesi', x.anaModul + ' ana modül, ' + x.altModul + ' alt modül'],
               ['Sayfa listesi', 'Rol başına ekran haritası (' + x.rolSayisi + ' rol)'],
               ['Kullanıcı rol listesi', x.hedefKullanici],
               ['Teknik gereksinimler', (x.entegrasyon || []).join(', ') + ' · ' + x.guvenlik],
               ['İş gücü tahmini', F.num(x.isgucu) + ' saat / ' + x.ekip + ' kişilik ekip'],
               ['Zaman planı', x.sure + ' ' + x.sureBirim],
               ['Tahmini bedel (KDV hariç)', F.money(x.tahminiBedel)],
               ['Risk raporu', (x.riskler || []).join(' | ') || 'Tespit edilen risk yok'],
               ['Teklif taslağı', x.durum === 'Onaylandı' ? 'Hazır — teklife dönüştürülebilir' : 'Analiz onayı bekleniyor']
              ].map(function(r){ return '<tr><td style="width:34%"><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td></tr>'; }).join('') +
              '</tbody></table></div>',
            actions:[{ label:'Kapat', cls:'btn-acc' }] }); } },
      { key:'teklif', icon:'i-quote', label:'Teklife dönüştür', run:function(x){
          if(x.durum !== 'Onaylandı'){ GV.toast('Önce ön analizin onaylanması gerekiyor.', 'warn'); return; }
          GV.confirm({ title:'Teklife dönüştür',
            text:x.kod + ' analizinden ' + F.money(x.tahminiBedel) + ' tahmini tutarla yeni teklif taslağı oluşturulacak.',
            okLabel:'Oluştur' }).then(function(ok){ if(ok) GV.toast('Teklif taslağı oluşturuldu', 'ok'); }); } }
    ],
    bulk:[{ key:'onay', label:'Onaya gönder', icon:'i-stamp' }, { key:'disa', label:'Dışa aktar', icon:'i-download', export:true }],
    emptyState:{ icon:'i-clipboard', title:'Bu görünümde ön analiz yok',
      desc:'Müşteri talebi netleştiğinde ön analiz oluşturarak kapsam, efor ve tahmini bedeli çıkarabilirsiniz.',
      action:'<a class="btn btn-acc" href="app-onanaliz-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Ön Analiz</a>' }
  });

});
</script>
</body>
</html>
