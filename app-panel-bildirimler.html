<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bildirimler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="panel" data-screen="bildirimler">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  GV.pageHead({ eyebrow:'Gündem', title:'Bildirim Merkezi',
    actions:[{ label:'Bildirim Tercihleri', icon:'i-settings', href:'app-ayar-bildirim.html' },
             { label:'Tümünü Okundu İşaretle', icon:'i-check', cls:'btn-acc', id:'btnOku' }] });
  var list = GV.list({
    mount:'#liste', id:'bildirim', key:'kod', source:function(){ return DB.notifications; },
    exportName:'bildirimler', exportTitle:'Bildirimler', pageSize:25, archive:false,
    search:{ placeholder:'Bildirim başlığı, tür veya özet ara', fields:['kod','tur','baslik','ozet'] },
    defaultSort:'tarih', defaultDir:'desc',
    kpis:[
      { label:'Okunmamış', icon:'i-bell', tone:'danger', calc:function(a){ return a.filter(function(x){ return !x.okundu; }).length; } },
      { label:'Kritik uyarı', icon:'i-alert', tone:'danger', calc:function(a){ return a.filter(function(x){ return x.tone === 'danger'; }).length; } },
      { label:'Bugün', icon:'i-sun', tone:'info', calc:function(a){ return a.filter(function(x){ return String(x.tarih).slice(0,10) === DB.today; }).length; } },
      { label:'Toplam bildirim', icon:'i-list', tone:'neutral', calc:function(a){ return a.length; } }
    ],
    tabs:[
      { key:'okunmamis', label:'Okunmamış', icon:'i-bell', filter:function(x){ return !x.okundu; } },
      { key:'kritik', label:'Kritik', icon:'i-alert', filter:function(x){ return x.tone === 'danger'; } },
      { key:'gorev', label:'Görev', icon:'i-tasks', filter:function(x){ return /Görev|görev/.test(x.tur); } },
      { key:'onay', label:'Onay', icon:'i-stamp', filter:function(x){ return /[Oo]nay/.test(x.tur); } },
      { key:'filo', label:'Araç ve Filo', icon:'i-car', filter:function(x){ return /[Mm]uayene|[Ss]igorta|[Kk]asko|[Bb]akım/.test(x.tur); } },
      { key:'finans', label:'Finans', icon:'i-wallet', filter:function(x){ return /[Tt]ahsilat|[Ll]isans/.test(x.tur); } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'baslik', label:'Bildirim', width:'34%', locked:true, cellClass:'cell-wrap', render:function(x){
          return '<span class="cell-main">' + (x.okundu ? '' : '<span class="badge is-danger no-dot" style="margin-right:var(--sp-3)">Yeni</span>') +
                 esc(x.baslik) + '</span><span class="cell-sub">' + esc(x.ozet) + '</span>'; } },
      { key:'tur', label:'Bildirim türü', render:function(x){ return '<span class="tag">' + esc(x.tur) + '</span>'; } },
      { key:'kisi', label:'İlgili kişi', render:function(x){ return GV.user(x.kisi, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.kisi); }, exportValue:function(x){ return DB.empName(x.kisi); } },
      { key:'tarih', label:'Tarih', render:function(x){ return '<span class="cell-date">' + F.dt(x.tarih) + '</span>'; } },
      { key:'okundu', label:'Durum', render:function(x){ return GV.badge(x.okundu ? 'Tamamlandı' : 'Yeni'); },
        exportValue:function(x){ return x.okundu ? 'Okundu' : 'Okunmadı'; } }
    ],
    filters:[
      { key:'tur', label:'Bildirim türü', type:'multi',
        options:[].concat.apply([], [DB.notifications.map(function(n){ return n.tur; })])
          .filter(function(v,i,s){ return s.indexOf(v) === i; }) },
      { key:'kisi', label:'İlgili kişi', type:'select', options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'tarih', label:'Bildirim tarihi', type:'daterange' }
    ],
    rowClass:function(x){ return (!x.okundu && x.tone === 'danger') ? 'is-late' : ''; },
    mobile:function(x){
      return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.baslik) + '</span>' +
        (x.okundu ? '' : '<span class="badge is-danger no-dot">Yeni</span>') + '</div>' +
        '<div class="gv-mrow-code">' + esc(x.tur) + ' · ' + F.dt(x.tarih) + '</div>' +
        '<div class="gv-mrow-meta"><span>' + esc(x.ozet) + '</span></div>';
    },
    rowActions:[
      { key:'git', icon:'i-external', label:'Kayda git', href:function(x){ return x.link; } },
      { key:'oku', icon:'i-check', label:'Okundu işaretle', run:function(x, refresh){
          x.okundu = !x.okundu; GV.toast(x.okundu ? 'Okundu işaretlendi' : 'Okunmadı olarak işaretlendi', 'ok', 1600); refresh(); } }
    ],
    bulk:[{ key:'oku', label:'Okundu işaretle', icon:'i-check' }, { key:'disa', label:'Dışa aktar', icon:'i-download' }],
    emptyState:{ icon:'i-bell', title:'Bildirim yok', desc:'Bu görünümde gösterilecek bildirim bulunmuyor.' }
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('#btnOku')) return;
    var n = DB.notifications.filter(function(x){ return !x.okundu; }).length;
    if(!n){ GV.toast('Okunmamış bildirim yok', 'info'); return; }
    GV.confirm({ title:'Tümünü okundu işaretle', text:n + ' bildirim okundu olarak işaretlenecek.', okLabel:'İşaretle' })
      .then(function(ok){ if(ok){ DB.notifications.forEach(function(x){ x.okundu = true; });
        GV.toast(n + ' bildirim okundu işaretlendi', 'ok'); list.refresh(); } });
  });

});
</script>
</body>
</html>
