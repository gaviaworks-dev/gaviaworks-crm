<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bekleyen Onaylar — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="panel" data-screen="onaylar">
<div id="kapsamNot"></div>
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<!-- Onay kuyruğu SEKİZ varlık tipini kapsar (satın alma · izin · teklif ·
     görev · değişiklik · ön analiz · komisyon · timesheet). Kaynak kayda
     dokunabilmek için hepsinin verisi yüklü olmalı; ekran üçünü yüklüyordu
     ve motor kaynak kaydı bulamıyordu. -->
<script src="assets/data/hr.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, canFinans = GV.perm.can('finans');

  /* REVİZE 13 — MÜŞTERİ KAPSAMI.
     `DB.approvals` şirketin İÇ onay kuyruğudur: timesheet · izin · komisyon ·
     satın alma · teklif iç onayı… Müşteri oturumunda 12 onayın tamamı
     listeleniyordu; tutarlar `finans` maskesiyle gizliydi ama SATIRLAR değildi.
     Müşterinin bu kuyrukta taraf olduğu tek kalem KENDİ ONAYINI BEKLEYEN
     TESLİMdir (dokümandaki "Bekleyen onaylar" kalemi budur, shell sayacı da
     aynı tanımı kullanır: `deliveries.musteriOnay === 'Bekliyor'`).
     Kapsam yalnız müşteri oturumunda bildirilir: personel rollerinin
     (`kendi` · `departman` · `proje`) bu ekranda bugün de süzgeci yok, eşleme
     yazılmadan `scopeField` bildirmek onlara kapsam çubuğu bastırırdı. */
  var musKapsam = GV.perm.scope('gor') === 'musteri';
  var musKod    = (GV.session || {}).musteri;

  /* Onayın müşterisi onay kaydında YAZILI DEĞİL — `kayit` alanı onayın hangi
     kayda ait olduğunu söyler (SAT-* · IZN-* · TSL-* …), müşteri o kaydın
     projesinde yazılıdır. Teslim kaydına bağlanmayan her onay türü müşteri
     oturumunda listeden düşer (null döner).
     ÖLÇÜM (2026-08-07): `DB.approvals` içinde TSL-* kaydına bağlı onay YOK →
     müşteri oturumunda liste bugün 0 satırdır. Satır uydurulmaz; veriye teslim
     onayı yazıldığı gün bu yordam onu kendiliğinden geçirir. */
  function onayMusterisi(x){
    var t = (DB.deliveries || []).filter(function(d){ return d.kod === x.kayit; })[0];
    if(!t) return null;
    var p = DB.proj(t.proje);
    return p ? p.musteri : null;
  }

  /* Boş durumun DÜRÜST olması için sayı veriden ölçülür — müşterinin onayını
     bekleyen teslimler `app-proje-teslim.html`de yaşıyor, onay kuyruğunda değil. */
  function bekleyenTeslim(){
    if(!musKod) return [];
    var pk = (DB.projects || []).filter(function(p){ return p.musteri === musKod; })
              .map(function(p){ return p.kod; });
    return (DB.deliveries || []).filter(function(d){
      return pk.indexOf(d.proje) !== -1 && d.musteriOnay === 'Bekliyor'; });
  }
  var teslimSayi = musKapsam ? bekleyenTeslim().length : 0;

  /* Ret ve iade penceresi — şartname [2.0.6] gerekçeyi NEDEN KODU + açıklama
     olarak istiyor. Eskiden yalnız serbest metin isteniyordu ve o metin de
     hiçbir yere kaydedilmiyordu. Neden kodları `DB.reasonCodes` sözlüğünden
     gelir; sözlük tek kaynaktır ve raporlanabilir. */
  function kararModal(x, karar, baslik, btnLabel, btnCls, refresh){
    var tur = karar === 'İade' ? 'iade' : 'ret';
    var kodlar = (DB.reasonCodes || []).filter(function(r){ return (r.tur || []).indexOf(tur) !== -1; });
    GV.modal({ title:baslik, text:x.baslik, icon:'i-x-circle',
      tone:karar === 'İade' ? 'warn' : 'danger', size:'sm',
      body:'<div class="field"><label for="rKod">Neden kodu <span class="req">*</span></label>' +
           '<select id="rKod"><option value="">Seçiniz…</option>' +
           kodlar.map(function(r){ return '<option value="' + r.kod + '">' + esc(r.ad) + '</option>'; }).join('') +
           '</select></div>' +
           '<div class="field"><label for="rNot">Açıklama <span class="req">*</span></label>' +
           '<textarea id="rNot" rows="3" placeholder="Kararın gerekçesini yazın — kayda ve denetim izine geçer."></textarea></div>',
      actions:[{ label:'Vazgeç', cls:'btn-line' },
        { label:btnLabel, cls:btnCls, onClick:function(close, el){
            var kod = el.querySelector('#rKod').value;
            var not = el.querySelector('#rNot').value.trim();
            if(!kod){ GV.toast('Neden kodu zorunludur', 'danger'); return false; }
            if(!not){ GV.toast('Açıklama zorunludur', 'danger'); return false; }
            var r = GV.approval.karar(x.kod, karar, { neden:kod, not:not });
            if(!r.ok){ GV.toast(r.mesaj || ('İşlem uygulanamadı: ' + r.why), 'danger'); return false; }
            GV.toast(x.kod + ' · ' + karar.toLowerCase() +
              (r.akis ? ' · ' + x.kayit + ' → ' + r.akis.yeni : ''), 'ok');
            refresh(); } }] });
  }

  GV.pageHead({ eyebrow:'Gündem', title:'Bekleyen Onaylar',
    /* Müşteri oturumunda iç ekranlara (onay akışı ayarı · iç bildirim akışı)
       düğme bırakılmaz — ikisi de bu role kapalı. */
    actions:musKapsam
      ? [{ label:'Teslimler', icon:'i-package', cls:'btn-acc', href:'app-proje-teslim.html' }]
      : [{ label:'Onay Akışları', icon:'i-sliders', href:'app-ayar-onay.html' },
         { label:'Bildirimler', icon:'i-bell', cls:'btn-acc', href:'app-panel-bildirimler.html' }] });

  /* Süzme SESSİZ olmaz (L-23): müşteri neyi görmediğini de bilir. */
  if(musKapsam){
    document.getElementById('kapsamNot').innerHTML = GV.notice({
      tone:'info', icon:'i-shield',
      title:'Yalnız sizin onayınızı bekleyen kayıtlar',
      text:'Bu ekranda size ait onay kalemleri listelenir; şirket içi onay kuyruğu gösterilmez.'
    });
  }

  GV.list({
    mount:'#liste', id:'onaylar', key:'kod', source:function(){ return DB.approvals; },
    exportName:'bekleyen-onaylar', exportTitle:'Bekleyen Onaylar', pageSize:25, archive:false,
    search:{ placeholder:'Onay no, kayıt, başlık veya tür ara', fields:['kod','tur','kayit','baslik'] },
    defaultSort:'tarih',
    /* Eşleme bir ALAN ADI değil YORDAM: kapsam alanı kayıtta yazılı değil. */
    scopeField:musKapsam ? { musteri:onayMusterisi } : null,
    kpis:[
      { label:'Bekleyen onay', icon:'i-stamp', tone:'warn', calc:function(a){ return a.filter(function(x){ return x.durum === 'Bekliyor'; }).length; } },
      { label:'Kritik aciliyet', icon:'i-alert', tone:'danger',
        calc:function(a){ return a.filter(function(x){ return x.durum === 'Bekliyor' && x.aciliyet === 'Kritik'; }).length; } },
      { label:'Bekleyen tutar', icon:'i-wallet', tone:'info', format:F.moneyK,
        calc:function(a){ return canFinans ? a.filter(function(x){ return x.durum === 'Bekliyor'; })
          .reduce(function(s,x){ return s + (x.tutar || 0); }, 0) : 0; } },
      { label:'En eski bekleyen', icon:'i-hourglass', tone:'danger', format:function(v){ return v + ' gün'; },
        calc:function(a){ var b = a.filter(function(x){ return x.durum === 'Bekliyor'; });
          return b.length ? Math.max.apply(null, b.map(function(x){ return Math.abs(F.days(x.tarih)); })) : 0; } }
    ],
    /* Sekmeler onay TÜRÜ ekseninde kırılır; müşteri oturumunda o türlerin hepsi
       kapsam dışı kaldığı için sekme de basılmaz — boş sekme iç kuyruğun
       taksonomisini (izin · satın alma · timesheet) ele verirdi. Kalan üç sekme
       durum eksenlidir. */
    tabs:musKapsam ? [
      { key:'bekleyen', label:'Bekleyenler', icon:'i-stamp', filter:function(x){ return x.durum === 'Bekliyor'; } },
      { key:'sonuc', label:'Sonuçlananlar', icon:'i-check-circle', filter:function(x){ return x.durum !== 'Bekliyor'; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ] : [
      { key:'bekleyen', label:'Bekleyenler', icon:'i-stamp', filter:function(x){ return x.durum === 'Bekliyor'; } },
      { key:'satinalma', label:'Satın Alma', icon:'i-cart', filter:function(x){ return x.tur === 'Satın alma talebi'; } },
      { key:'izin', label:'İzin', icon:'i-calendar-check', filter:function(x){ return x.tur === 'İzin talebi'; } },
      { key:'teklif', label:'Teklif ve Analiz', icon:'i-quote',
        filter:function(x){ return ['Teklif iç onayı','Ön analiz onayı'].indexOf(x.tur) !== -1; } },
      { key:'gorev', label:'Görev ve Değişiklik', icon:'i-tasks',
        filter:function(x){ return ['Görev onayı','Değişiklik talebi','Timesheet onayı'].indexOf(x.tur) !== -1; } },
      { key:'sonuc', label:'Sonuçlananlar', icon:'i-check-circle', filter:function(x){ return x.durum !== 'Bekliyor'; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'baslik', label:'Onay konusu', width:'30%', locked:true, cellClass:'cell-wrap', render:function(x){
          return '<a class="cell-main" href="' + x.link + '">' + esc(x.baslik) + '</a>' +
                 '<span class="cell-code">' + x.kod + ' · ' + esc(x.kayit) + '</span>'; } },
      { key:'tur', label:'Onay türü', render:function(x){ return '<span class="tag">' + esc(x.tur) + '</span>'; } },
      { key:'talepEden', label:'Talep eden', render:function(x){ return GV.user(x.talepEden, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.talepEden); }, exportValue:function(x){ return DB.empName(x.talepEden); } },
      { key:'onaylayan', label:'Onaylayacak', render:function(x){ return GV.user(x.onaylayan, { sm:true }); },
        sortValue:function(x){ return DB.empName(x.onaylayan); }, exportValue:function(x){ return DB.empName(x.onaylayan); } },
      { key:'tutar', label:'Tutar', cellClass:'num', render:function(x){
          if(!x.tutar) return '<span class="u-faint">—</span>';
          return canFinans ? '<span class="cell-money">' + F.money(x.tutar) + '</span>' : '<span class="cell-mask">••••</span>'; },
        exportValue:function(x){ return canFinans ? x.tutar : ''; } },
      { key:'aciliyet', label:'Aciliyet', render:function(x){ return GV.pri(x.aciliyet); } },
      { key:'tarih', label:'Talep tarihi', render:function(x){
          var g = Math.abs(F.days(x.tarih));
          return '<span class="cell-date' + (g > 7 && x.durum === 'Bekliyor' ? ' is-late' : '') + '">' + F.date(x.tarih) + '</span>' +
                 (x.durum === 'Bekliyor' ? '<span class="cell-sub">' + g + ' gündür bekliyor</span>' : ''); } },
      { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } }
    ],
    /* Süzgeç seçenekleri de bilgidir: `tur` listesi iç onay türlerini,
       `onaylayan` listesi tüm personel kadrosunu sayardı. Müşteri oturumunda
       ikisi de basılmaz. */
    filters:musKapsam ? [
      { key:'durum', label:'Onay durumu', type:'select', options:['Bekliyor','Onaylandı','Reddedildi'] },
      { key:'aciliyet', label:'Aciliyet', type:'multi', options:DB.priorities },
      { key:'tarih', label:'Talep tarihi', type:'daterange' }
    ] : [
      { key:'tur', label:'Onay türü', type:'multi',
        options:DB.approvals.map(function(a){ return a.tur; }).filter(function(v,i,s){ return s.indexOf(v) === i; }) },
      { key:'durum', label:'Onay durumu', type:'select', options:['Bekliyor','Onaylandı','Reddedildi'] },
      { key:'onaylayan', label:'Onaylayacak kişi', type:'select', options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'aciliyet', label:'Aciliyet', type:'multi', options:DB.priorities },
      { key:'tarih', label:'Talep tarihi', type:'daterange' }
    ],
    rowClass:function(x){ return (x.durum === 'Bekliyor' && (x.aciliyet === 'Kritik' || Math.abs(F.days(x.tarih)) > 7)) ? 'is-late' : ''; },
    mobile:function(x){
      return '<div class="gv-mrow-top"><a class="cell-main" href="' + x.link + '">' + esc(x.baslik) + '</a>' +
        GV.pri(x.aciliyet) + '</div>' +
        '<div class="gv-mrow-code">' + esc(x.tur) + ' · ' + esc(x.kayit) + '</div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + '</span>' +
        (canFinans && x.tutar ? '<span class="cell-money">' + F.money(x.tutar) + '</span>' : '') + '</div>';
    },
    rowActions:[
      { key:'git', icon:'i-external', label:'Kayda git', href:function(x){ return x.link; } },
      /* ⚠️ CLOUD TURU — bu üç eylem YENİDEN YAZILDI.
         Eskiden "Onayla" yalnız `x.durum = 'Onaylandı'` yapıyordu: kaynak
         kayda (satın alma · izin · teklif) hiç dokunmuyor, zincirde adım
         ilerletmiyor, aktiviteye yazmıyordu. Kullanıcı onayladığını sanıyor, talep hâlâ
         "Onay bekliyor" duruyordu — UID-27 sınıfının en ağırı.
         Ret gerekçesi de hiçbir yere kaydedilmiyordu (`rNot` okunup atılıyordu).
         Artık üçü de `GV.approval.karar()` üzerinden yürür: kuyruk kaydı +
         onay zinciri + kaynak kaydın durum geçişi TEK işlemde sonuçlanır ve
         kaynak kayıt geçemezse onay da geri alınır. */
      { key:'onayla', icon:'i-check', label:'Onayla', run:function(x, refresh){
          if(x.durum !== 'Bekliyor'){ GV.toast('Bu onay zaten sonuçlanmış.', 'info'); return; }
          if(!GV.perm.can('onay')){ GV.toast('Onaylama yetkiniz yok.', 'danger'); return; }
          var d = GV.approval.adim(x.tur, x.kayit);
          GV.confirm({ title:'Onayla',
            text:x.baslik + (x.tutar ? ' · ' + F.money(x.tutar) : '') +
                 (d ? ' — onayınızla ' + (d.adim + 1) + '/' + d.toplam + ' adım tamamlanacak'
                    : ' — bu tür için onay zinciri tanımlı değil'),
            okLabel:'Onayla' })
            .then(function(ok){
              if(!ok) return;
              var r = GV.approval.karar(x.kod, 'Onaylandı', {});
              if(!r.ok){ GV.toast(r.mesaj || ('Onaylanamadı: ' + r.why), 'danger'); return; }
              GV.toast(x.kod + (r.zincirBitti
                ? ' onaylandı' + (r.akis ? ' · ' + x.kayit + ' → ' + r.akis.yeni : '')
                : ' — adım ' + r.adim.adim + '/' + r.adim.toplam + ', ' +
                  (r.adim.siradaki ? r.adim.siradaki.rol + ' onayı bekleniyor' : 'zincir sürüyor')), 'ok');
              if(r.sod) GV.toast(r.sod, 'warn');
              if(r.not) GV.toast(r.not, 'info');
              refresh(); }); } },
      { key:'iade', icon:'i-refresh', label:'İade et', run:function(x, refresh){
          if(x.durum !== 'Bekliyor'){ GV.toast('Bu onay zaten sonuçlanmış.', 'info'); return; }
          kararModal(x, 'İade', 'Onayı iade et', 'İade Et', 'btn-line', refresh); } },
      { key:'red', icon:'i-x', label:'Reddet', cls:'is-danger', run:function(x, refresh){
          if(x.durum !== 'Bekliyor'){ GV.toast('Bu onay zaten sonuçlanmış.', 'info'); return; }
          kararModal(x, 'Reddedildi', 'Onayı reddet', 'Reddet', 'btn-danger', refresh); } }
    ],
    /* Toplu onay artık GERÇEK: her kayıt tek tek `GV.approval.karar()`
       üzerinden geçer, geçemeyen kayıt sayılır ve kullanıcıya söylenir.
       Eskiden `run` yoktu ve `ui.js` (L-23) aksiyonu haklı olarak devre dışı
       basıyordu — "12 kayıt onaylandı" diye yalan bir yeşil mesaj basmaktansa. */
    bulk:[{ key:'onay', label:'Toplu onayla', icon:'i-check',
            confirm:'{n} onay kaydı sonuçlandırılacak ve bağlı kayıtların durumu değişecek. Sürdürülsün mü?',
            show:function(){ return GV.perm.can('onay'); },
            run:function(rows){
              var ok = 0, kalan = [];
              rows.forEach(function(x){
                if(x.durum !== 'Bekliyor'){ kalan.push(x.kod + ' (zaten sonuçlanmış)'); return; }
                var r = GV.approval.karar(x.kod, 'Onaylandı', {});
                if(r.ok) ok++; else kalan.push(x.kod + ' (' + (r.mesaj || r.why) + ')');
              });
              GV.toast(ok + ' onay sonuçlandı' + (kalan.length ? ' · ' + kalan.length + ' kayıt geçemedi' : ''),
                       kalan.length ? 'warn' : 'ok');
              if(kalan.length) GV.notice({ tone:'warn', title:'Geçemeyen kayıtlar',
                                           text:kalan.join(' · ') });
            } },
          { key:'disa', label:'Dışa aktar', icon:'i-download', export:true }],
    /* Müşteri oturumunda boş liste DÜRÜST anlatılır: kuyruk boş değil, bu
       kuyrukta sizin kaleminiz yok. Onayınızı bekleyen teslim varsa sayısı
       veriden okunur ve ekrana yönlendirilir — sayı uydurulmaz, teslim de yoksa
       aksiyon basılmaz. */
    emptyState:musKapsam
      ? { icon:'i-stamp', title:'Onayınızı bekleyen kayıt yok',
          desc:teslimSayi
            ? 'Onay kuyruğunda size ait bir kalem bulunmuyor. Onayınızı bekleyen ' +
              teslimSayi + ' teslim, Teslimler ekranında listeleniyor.'
            : 'Onay kuyruğunda size ait bir kalem bulunmuyor; onayınızı bekleyen bir teslim de yok.',
          action:teslimSayi
            ? '<a class="btn btn-acc" href="app-proje-teslim.html"><svg class="ic"><use href="#i-package"></use></svg> Teslimlere Git</a>'
            : '' }
      : { icon:'i-check-circle', title:'Bekleyen onay yok', desc:'Onay kuyruğunuz temiz — sizi bekleyen işlem bulunmuyor.' }
  });

});
</script>
</body>
</html>
