<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Performans — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="personel" data-screen="performans">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  GV.pageHead({ eyebrow:'İnsan Kaynakları', title:'Performans Yönetimi',
    actions:[{ label:'Eğitim ve Yetkinlik', icon:'i-graduation', href:'app-egitim.html' },
             { label:'Yeni Değerlendirme', icon:'i-plus', cls:'btn-acc', href:'app-performans-form.html' }] });
  var ort = function(p){
    var v = [p.ozDegerlendirme, p.yoneticiDegerlendirme, p.pmDegerlendirme].filter(function(x){ return x != null; });
    return v.length ? (v.reduce(function(a,b){ return a + b; }, 0) / v.length) : null;
  };
  GV.list({
    mount:'#liste', id:'performans', key:'kod', source:function(){ return DB.performance; },
    exportName:'performans', exportTitle:'Performans Değerlendirmeleri', pageSize:25,
    search:{ placeholder:'Personel, dönem veya gelişim planı ara', fields:['kod','donem','gelisimPlani','durum'] },
    defaultSort:'donem', defaultDir:'desc',
    kpis:[
      { label:'Değerlendirme', icon:'i-award', calc:function(a){ return a.length; } },
      { label:'Açık dönem', icon:'i-edit', tone:'warn', calc:function(a){ return a.filter(function(x){ return x.durum === 'Açık'; }).length; } },
      { label:'Ortalama puan', icon:'i-star', tone:'ok', format:function(v){ return v + ' / 5'; },
        calc:function(a){ var l = a.filter(function(x){ return ort(x) != null; });
          return l.length ? (l.reduce(function(s,x){ return s + ort(x); }, 0) / l.length).toFixed(1) : '—'; } },
      { label:'Zamanında teslim', icon:'i-check-circle', tone:'info', format:function(v){ return '%' + v; },
        calc:function(a){ var l = a.filter(function(x){ return x.zamanindaTeslim != null; });
          return l.length ? Math.round(l.reduce(function(s,x){ return s + x.zamanindaTeslim; }, 0) / l.length) : 0; } }
    ],
    tabs:[
      { key:'tamam', label:'Tamamlananlar', icon:'i-check-circle', filter:function(x){ return x.durum === 'Tamamlandı'; } },
      { key:'acik', label:'Açık Dönemler', icon:'i-edit', filter:function(x){ return x.durum === 'Açık'; } },
      { key:'gelisim', label:'Eğitim İhtiyacı Olanlar', icon:'i-graduation', filter:function(x){ return (x.egitimIhtiyaci || []).length > 0; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'personel', label:'Personel', width:'20%', locked:true, render:function(x){
          var e = DB.emp(x.personel) || {};
          return '<a class="cell-main" href="app-personel-detay.html?id=' + x.personel + '">' + esc(e.ad || x.personel) + '</a>' +
                 '<span class="cell-sub">' + esc(e.pozisyon || '') + '</span>'; },
        sortValue:function(x){ return DB.empName(x.personel); }, exportValue:function(x){ return DB.empName(x.personel); } },
      { key:'donem', label:'Dönem', render:function(x){ return '<span class="tag">' + esc(x.donem) + '</span>'; } },
      { key:'ozDegerlendirme', label:'Öz değerlendirme', cellClass:'num', render:function(x){
          return x.ozDegerlendirme != null ? '<span class="u-num">' + x.ozDegerlendirme + '</span>' : '<span class="u-faint">—</span>'; } },
      { key:'yoneticiDegerlendirme', label:'Yönetici', cellClass:'num', render:function(x){
          return x.yoneticiDegerlendirme != null ? '<span class="u-num u-b">' + x.yoneticiDegerlendirme + '</span>' : '<span class="u-faint">—</span>'; } },
      { key:'pmDegerlendirme', label:'Proje yöneticisi', cellClass:'num', visible:false, render:function(x){
          return x.pmDegerlendirme != null ? '<span class="u-num">' + x.pmDegerlendirme + '</span>' : '<span class="u-faint">—</span>'; } },
      { key:'zamanindaTeslim', label:'Zamanında teslim', sortValue:function(x){ return x.zamanindaTeslim || 0; }, render:function(x){
          return x.zamanindaTeslim != null ? GV.progress(x.zamanindaTeslim) : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return x.zamanindaTeslim; } },
      { key:'revizyonOrani', label:'Revizyon oranı', cellClass:'num', render:function(x){
          if(x.revizyonOrani == null) return '<span class="u-faint">—</span>';
          return '<span class="badge ' + (x.revizyonOrani <= 10 ? 'is-ok' : x.revizyonOrani <= 20 ? 'is-warn' : 'is-danger') + '">%' + x.revizyonOrani + '</span>'; } },
      { key:'gorevSayisi', label:'Görev', cellClass:'num', visible:false },
      { key:'kaliteSonucu', label:'Kalite', cellClass:'num', render:function(x){
          return x.kaliteSonucu != null ? '<span class="u-num">' + x.kaliteSonucu + ' / 5</span>' : '<span class="u-faint">—</span>'; } },
      { key:'egitimIhtiyaci', label:'Eğitim ihtiyacı', cellClass:'cell-wrap', sortable:false, render:function(x){
          return (x.egitimIhtiyaci || []).length
            ? x.egitimIhtiyaci.map(function(e){ return '<span class="tag">' + esc(e) + '</span>'; }).join(' ')
            : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return (x.egitimIhtiyaci || []).join(', '); } },
      { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum === 'Açık' ? 'Bekliyor' : 'Tamamlandı'); } }
    ],
    filters:[
      { key:'donem', label:'Dönem', type:'multi', options:['2026-Q1','2026-Q2','2026-Q3','2026-Q4'] },
      { key:'personel', label:'Personel', type:'select', options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'durum', label:'Durum', type:'select', options:['Açık','Tamamlandı'] }
    ],
    mobile:function(x){
      return '<div class="gv-mrow-top"><span class="cell-main">' + esc(DB.empName(x.personel)) + '</span>' +
        '<span class="tag">' + esc(x.donem) + '</span></div>' +
        '<div class="gv-mrow-meta"><span>Yönetici: ' + (x.yoneticiDegerlendirme != null ? x.yoneticiDegerlendirme + '/5' : '—') + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum === 'Açık' ? 'Bekliyor' : 'Tamamlandı') + '</span></div>';
    },
    rowActions:[
      { key:'detay', icon:'i-eye', label:'Değerlendirme detayı', run:function(x){
          if(x.durum === 'Açık'){ GV.toast('Bu dönem henüz doldurulmadı.', 'info'); return; }
          GV.modal({ title:DB.empName(x.personel) + ' — ' + x.donem, icon:'i-award', size:'lg',
            text:'Performans yalnız görev adediyle değil; kalite, süre, revizyon ve dış bağımlılıklarla birlikte değerlendirilir.',
            body:'<div class="gv-tablewrap"><table class="gtable"><tbody>' +
              [['Öz değerlendirme', x.ozDegerlendirme + ' / 5'], ['Yönetici değerlendirmesi', x.yoneticiDegerlendirme + ' / 5'],
               ['Proje yöneticisi değerlendirmesi', x.pmDegerlendirme + ' / 5'], ['Görev kalite sonucu', x.kaliteSonucu + ' / 5'],
               ['Zamanında teslim oranı', '%' + x.zamanindaTeslim], ['Revizyon oranı', '%' + x.revizyonOrani],
               ['Tamamlanan görev', x.gorevSayisi], ['Problem çözme', x.problemCozme + ' / 5'],
               ['Teknik gelişim', x.teknikGelisim + ' / 5'], ['Ekip çalışması', x.ekipCalismasi + ' / 5'],
               ['Departmanlar arası iletişim', x.iletisim + ' / 5'], ['Müşteri geri bildirimi', x.musteriGeriBildirim + ' / 5'],
               ['Eğitim ihtiyacı', (x.egitimIhtiyaci || []).join(', ') || '—'], ['Gelişim planı', x.gelisimPlani]
              ].map(function(r){ return '<tr><td style="width:42%"><b>' + esc(r[0]) + '</b></td><td>' + esc(String(r[1])) + '</td></tr>'; }).join('') +
              '</tbody></table></div>' +
              '<p class="u-xs u-faint u-mt-4">Bu veriler karar desteğidir; sistem otomatik karar vermez.</p>',
            actions:[{ label:'Kapat', cls:'btn-acc' }] }); } },
      { key:'kart', icon:'i-external', label:'Personel kartı', href:function(x){ return 'app-personel-detay.html?id=' + x.personel; } }
    ],
    bulk:[{ key:'disa', label:'Dışa aktar', icon:'i-download' }],
    emptyState:{ icon:'i-award', title:'Bu görünümde değerlendirme yok',
      desc:'Performans dönemi açıldığında öz değerlendirme ve yönetici değerlendirmesi formları burada listelenir.' }
  });

});
</script>
</body>
</html>
