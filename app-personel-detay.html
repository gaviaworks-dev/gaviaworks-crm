<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Personel Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="personel" data-screen="personel">
<a class="gv-skip" href="#gvMain">İçeriğe atla</a>

<div class="gv-app">
  <aside class="gv-rail" id="gvRail"></aside>
  <nav class="gv-menu" id="gvMenu"></nav>
  <button type="button" class="gv-divider" id="gvDivider" aria-label="Menüyü daralt veya genişlet">
    <span><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chev-left"></use></svg></span>
  </button>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main" id="gvMain">
    <div class="gv-page">
      <nav class="gv-crumb" id="gvCrumb" aria-label="Konum"></nav>
      <div id="gvPageHead"></div>
      <div id="rec"></div>
    </div>
  </main>
</div>

<script src="assets/data/org.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');

  /* Maaş/ücret alan bazlı yetkiye tabidir (KVKK — tasks/assumptions.md V-12).
     Eğitim maliyeti şirket gideridir, 'finans' yetkisiyle maskelenir. */
  var canMaas   = GV.perm.can('maas');
  var canFinans = GV.perm.can('finans');
  var canEkle   = GV.perm.can('ekle');

  var id = new URLSearchParams(location.search).get('id') || DB.employees[0].kod;
  var e = DB.employees.filter(function(x){ return x.kod === id; })[0];

  if(!e){
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Personel bulunamadı',
      desc:'“' + esc(id) + '” numaralı personel kaydı sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-personel.html">Personel listesine dön</a>' }) + '</div>';
    return;
  }

  var kod = e.kod;
  GV.shell.crumb(kod);
  document.title = e.ad + ' — GaviaWorks CRM';

  /* ---- Kayda bağlı veri dilimleri (hepsi canonical `personel` alanından) ---- */
  function byDateDesc(a, b){ return String(b.tarih || '').localeCompare(String(a.tarih || '')); }
  var KAPALI = ['Tamamlandı','İptal edildi','Arşivlendi'];

  var gorevler = DB.tasks.filter(function(t){
    return t.sorumlu === kod || (t.yardimci || []).indexOf(kod) !== -1;
  });
  var acikGorev = gorevler.filter(function(t){ return KAPALI.indexOf(t.durum) === -1; });
  var gecikenGorev = acikGorev.filter(function(t){ return t.termin && F.days(t.termin) < 0; });

  /* Proje bağı: ekip listesi + rol alanları + görevlerin projeleri birleşimi */
  var projeler = DB.projects.filter(function(p){
    if((p.ekip || []).indexOf(kod) !== -1) return true;
    if(p.pm === kod || p.teknikSorumlu === kod || p.musteriSorumlu === kod) return true;
    return gorevler.some(function(t){ return t.proje === p.kod; });
  });
  function projeRol(p){
    var r = [];
    if(p.pm === kod) r.push('Proje yöneticisi');
    if(p.teknikSorumlu === kod) r.push('Teknik sorumlu');
    if(p.musteriSorumlu === kod) r.push('Müşteri sorumlusu');
    if((p.ekip || []).indexOf(kod) !== -1) r.push('Ekip üyesi');
    if(!r.length) r.push('Görev sorumlusu');
    return r;
  }

  var loglar = DB.timelogs.filter(function(l){ return l.personel === kod; }).sort(byDateDesc);
  var logToplam = loglar.reduce(function(a, l){ return a + l.sure; }, 0);
  var logFatura = loglar.filter(function(l){ return l.faturalanabilir; })
                        .reduce(function(a, l){ return a + l.sure; }, 0);
  var logOran = logToplam ? Math.round(logFatura / logToplam * 100) : 0;

  var tsheets = DB.timesheets.filter(function(t){ return t.personel === kod; });
  var izinler = DB.leaves.filter(function(l){ return l.personel === kod; });
  var vekillik = DB.leaves.filter(function(l){ return l.vekil === kod; });
  var izinOnayli = izinler.filter(function(l){ return l.durum === 'Onaylandı'; });
  var izinKullanilan = izinOnayli.reduce(function(a, l){ return a + l.gun; }, 0);
  var izinBekleyen = izinler.filter(function(l){ return l.durum === 'Onay bekliyor'; });

  var kap = DB.capacity.filter(function(c){ return c.personel === kod; })[0] || null;
  var perf = DB.performance.filter(function(p){ return p.personel === kod; });
  var egitimler = DB.trainings.filter(function(t){ return (t.katilimci || []).indexOf(kod) !== -1; });
  var zimmetler = DB.assignments.filter(function(z){ return z.personel === kod; });
  var araclar = DB.vehicles.filter(function(v){ return v.anaSurucu === kod || v.yedekSurucu === kod; });
  var acts = DB.activities.filter(function(a){ return a.kayit === kod; });

  var yonetici = DB.emp(e.yonetici);
  var astlar = DB.employees.filter(function(x){ return x.yonetici === kod; });
  var yonettigi = DB.departments.filter(function(d){ return d.yonetici === kod; });

  /* Doluluk: kapasite kaydı varsa oradan, yoksa personel kartındaki değerden */
  var doluluk = kap ? kap.doluluk : e.doluluk;
  var asiriYuklu = doluluk >= 95;

  /* Kıdem — tarih ekseni DB.today (sistem saati kullanılmaz) */
  var kidemGun = -F.days(e.girisTarihi);
  var kidemYil = Math.floor(kidemGun / 365);
  var kidemAy  = Math.floor((kidemGun % 365) / 30.44);
  var kidem = (kidemYil ? kidemYil + ' yıl ' : '') + kidemAy + ' ay';

  /* ---- Maskeleme yardımcıları ---- */
  function mask(){ return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>'; }
  function ucret(){
    if(!canMaas) return mask();
    if(e.maas) return '<span class="cell-money">' + F.money(e.maas) + '</span>';
    if(e.saatlikUcret) return '<span class="cell-money">' + F.money(e.saatlikUcret) + '</span>';
    return null;
  }
  function ucretEksen(){
    if(e.maas) return 'Aylık brüt maaş';
    if(e.saatlikUcret) return 'Saatlik ücret';
    return 'Ücret';
  }
  function para(v){
    if(!canFinans) return mask();
    return '<span class="cell-money">' + F.money(v) + '</span>';
  }
  var maasNot = canMaas ? '' : GV.notice({
    tone:'neutral', icon:'i-lock', title:'Ücret bilgisi gizli',
    text:'Rolünüzde ücret görüntüleme yetkisi yok. Alan listelenir, tutar maskelenir.' });

  /* ---- Ortak markup yardımcıları ---- */
  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(Boolean).map(function(p){
      var bos = p[1] == null || p[1] === '';
      return '<div><dt>' + esc(p[0]) + '</dt><dd' + (bos ? ' class="is-empty"' : '') + '>' +
        (bos ? '—' : p[1]) + '</dd></div>';
    }).join('') + '</dl>';
  }
  function tbl(head, rows, foot){
    return '<div class="gv-tablewrap is-mobilescroll"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>' + (foot || '');
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function link(href, metin, altMetin){
    return '<a class="cell-main" href="' + href + '">' + esc(metin) + '</a>' +
      (altMetin ? '<span class="cell-code">' + esc(altMetin) + '</span>' : '');
  }
  function tags(list, bos){
    return (list && list.length)
      ? list.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join(' ')
      : (bos || null);
  }

  /* ---- Sayfa başlığı — aksiyonlar gerçekten çalışır ---- */
  var phActions = [
    { label:'Personel listesi', icon:'i-users', href:'app-personel.html' },
    { label:'Kapasite planı', icon:'i-gauge', href:'app-kapasite.html' }
  ];
  if(canEkle) phActions.push({ label:'Görev ata', icon:'i-tasks', cls:'btn-acc', run:function(){ gorevAtaModal(); } });

  GV.pageHead({
    eyebrow:'Personel & İK',
    title:e.ad,
    sub:e.pozisyon + ' · ' + e.depAd + ' · ' + kod,
    actions:phActions
  });

  /* ---- Kayıt başlığı ----
     Ad, çift <h1> oluşmaması için GV.pageHead başlığında tutulur; kayıt başlığı
     kod + durum + unvan/rol + kimlik meta'sını taşır. */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id">' +
        '<span class="gv-user-ava is-lg">' + esc(e.ini) + '</span>' +
        '<span class="gv-rec-code">' + kod + '</span>' +
        GV.badge(e.aktif ? 'Aktif' : 'Pasif') +
        '<span class="tag">' + esc(e.pozisyon) + '</span>' +
        '<span class="tag">' + esc(DB.roleName(e.rol)) + '</span>' +
        '<span class="tag">' + esc(e.calismaTuru) + '</span>' +
        (asiriYuklu ? '<span class="badge is-danger">Aşırı yüklü</span>' : '') +
        (gecikenGorev.length ? '<span class="badge is-warn">' + gecikenGorev.length + ' geciken görev</span>' : '') +
      '</div>' +
      '<div class="gv-rec-meta">' +
        '<span>' + ico('i-users','ic-sm') + esc(DB.depName(e.dep)) + '</span>' +
        '<span>' + ico('i-user-check','ic-sm') + 'Yönetici ' + esc(yonetici ? yonetici.ad : '—') + '</span>' +
        '<span>' + ico('i-calendar','ic-sm') + 'İşe giriş ' + F.date(e.girisTarihi) + ' · ' + esc(kidem) + '</span>' +
        '<span>' + ico('i-home','ic-sm') + esc(e.lokasyon) + '</span>' +
        '<span>' + ico('i-mail','ic-sm') + '<a href="mailto:' + esc(e.eposta) + '">' + esc(e.eposta) + '</a></span>' +
        '<span>' + ico('i-phone','ic-sm') + '<a href="tel:' + esc(e.tel.replace(/\s/g,'')) + '">' + esc(e.tel) + '</a></span>' +
      '</div>' +
    '</div></div>';

  /* ---- Sekmeler ---- */
  var tabs = [
    { key:'genel',      lbl:'Genel',              ic:'i-info' },
    { key:'gorev',      lbl:'Görevler',           ic:'i-tasks',          cnt:gorevler.length },
    { key:'proje',      lbl:'Projeler',           ic:'i-briefcase',      cnt:projeler.length },
    { key:'zaman',      lbl:'Zaman Kayıtları',    ic:'i-timer',          cnt:loglar.length },
    { key:'timesheet',  lbl:'Timesheet',          ic:'i-sheet',          cnt:tsheets.length },
    { key:'izin',       lbl:'İzinler',            ic:'i-calendar-check', cnt:izinler.length },
    { key:'kapasite',   lbl:'Kapasite',           ic:'i-gauge' },
    { key:'performans', lbl:'Performans',         ic:'i-star',           cnt:perf.length },
    { key:'egitim',     lbl:'Eğitim & Yetkinlik', ic:'i-graduation',     cnt:egitimler.length },
    { key:'zimmet',     lbl:'Zimmetler',          ic:'i-package',        cnt:zimmetler.length + araclar.length },
    { key:'aktivite',   lbl:'Aktivite Geçmişi',   ic:'i-activity',       cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* =================================================================
     1. GENEL — DB.employees alanlarının tamamı
     ================================================================= */
  var pGenel =
    '<div class="gc-body">' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Kimlik</h3></div>' +
        dl([
          ['Personel kodu', '<span class="u-num">' + esc(kod) + '</span>'],
          ['Ad soyad', esc(e.ad)],
          ['Baş harfler', '<span class="gv-user-ava is-sm">' + esc(e.ini) + '</span>'],
          ['Doğum tarihi', F.date(e.dogum)],
          ['Kan grubu', e.kanGrubu && e.kanGrubu !== '—' ? esc(e.kanGrubu) : null],
          ['Öğrenim', esc(e.egitim)],
          ['Lokasyon', esc(e.lokasyon)],
          ['Durum', GV.badge(e.aktif ? 'Aktif' : 'Pasif')]
        ]) +
      '</div>' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Unvan ve Organizasyon</h3></div>' +
        dl([
          ['Unvan / pozisyon', esc(e.pozisyon)],
          ['Sistem rolü', '<span class="tag">' + esc(DB.roleName(e.rol)) + '</span>'],
          ['Tanımlı diğer roller', tags((e.roller || []).filter(function(r){ return r !== e.rol; }).map(DB.roleName))],
          ['Departman', '<a href="app-ayar-departman.html">' + esc(DB.depName(e.dep)) + '</a>' +
            '<span class="cell-code">' + esc(e.dep) + '</span>'],
          ['Yöneticisi', yonetici
            ? '<a class="cell-main" href="app-personel-detay.html?id=' + yonetici.kod + '">' + esc(yonetici.ad) + '</a>' +
              '<span class="cell-sub">' + esc(yonetici.pozisyon) + '</span>'
            : null],
          ['Yönettiği departmanlar', tags(yonettigi.map(function(d){ return d.ad; }))],
          ['Bağlı personel', astlar.length
            ? astlar.map(function(a){
                return '<a href="app-personel-detay.html?id=' + a.kod + '">' + esc(a.ad) + '</a>';
              }).join(', ')
            : null]
        ]) +
      '</div>' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Çalışma ve Özlük</h3></div>' +
        dl([
          ['Çalışma türü', esc(e.calismaTuru)],
          ['Sözleşme türü', esc(e.sozlesme)],
          ['İşe giriş tarihi', F.date(e.girisTarihi)],
          ['Kıdem', '<b>' + esc(kidem) + '</b>'],
          [ucretEksen(), ucret()],
          ['İzin bakiyesi', '<b class="u-num">' + e.izinBakiye + ' gün</b>'],
          ['Haftalık doluluk', GV.progress(doluluk, { tone:asiriYuklu ? 'danger' : doluluk >= 85 ? 'warn' : '' })]
        ]) +
        (maasNot ? '<div class="u-mt-4">' + maasNot + '</div>' : '') +
      '</div>' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>İletişim</h3></div>' +
        dl([
          ['E-posta', '<a href="mailto:' + esc(e.eposta) + '">' + esc(e.eposta) + '</a>'],
          ['Telefon', '<a href="tel:' + esc(e.tel.replace(/\s/g,'')) + '">' + esc(e.tel) + '</a>'],
          ['Acil durumda aranacak kişi', e.acilKisi && e.acilKisi !== '—' ? esc(e.acilKisi) : null]
        ]) +
      '</div>' +
      '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Yetkinlik ve Uzmanlık</h3></div>' +
        dl([
          ['Yetkinlikler', tags(e.yetkinlik)],
          ['Teknolojiler', tags(e.teknoloji)],
          ['Sertifikalar', tags(e.sertifika)],
          ['Tamamlanan eğitim', '<b>' + egitimler.filter(function(t){ return t.durum === 'Tamamlandı'; }).length +
            '</b> / ' + egitimler.length]
        ]) +
      '</div>' +
    '</div>';

  /* =================================================================
     2. GÖREVLER
     ================================================================= */
  var pGorev = '<div class="gc-body flush">' +
    (gorevler.length
      ? tbl('<th>Görev</th><th>Rol</th><th>Proje</th><th>Durum</th><th>Öncelik</th><th>Termin</th><th>İlerleme</th>',
          gorevler.map(function(t){
            return '<tr><td class="cell-wrap">' + link('app-gorev-detay.html?id=' + t.kod, t.baslik, t.kod) + '</td>' +
              '<td><span class="tag">' + (t.sorumlu === kod ? 'Sorumlu' : 'Yardımcı') + '</span></td>' +
              '<td>' + (t.proje
                ? '<a href="app-proje-detay.html?id=' + t.proje + '">' + esc(DB.projName(t.proje)) + '</a>'
                : '<span class="u-faint">Projesiz</span>') + '</td>' +
              '<td>' + GV.badge(t.durum) + '</td>' +
              '<td>' + GV.pri(t.oncelik) + '</td>' +
              '<td>' + GV.dateCell(t.termin, { done:t.durum === 'Tamamlandı' }) + '</td>' +
              '<td>' + GV.progress(t.ilerleme) + '</td></tr>';
          }).join(''),
          sayac('<b>' + gorevler.length + '</b> görev · açık <b>' + acikGorev.length + '</b>' +
            (gecikenGorev.length ? ' · geciken <b>' + gecikenGorev.length + '</b>' : ''),
            '<a class="btn btn-line btn-sm" href="app-gorev.html?t=tumu&f_sorumlu=' + kod + '">' +
              ico('i-tasks','ic-sm') + ' Görev listesinde aç</a>'))
      : GV.empty({ icon:'i-tasks', title:'Atanmış görev yok',
          desc:'Bu personele sorumlu veya yardımcı olarak atanmış bir görev bulunmuyor.',
          action:'<a class="btn btn-acc" href="app-gorev.html">Görev listesine git</a>' })) +
    '</div>';

  /* =================================================================
     3. PROJELER
     ================================================================= */
  var pProje = '<div class="gc-body flush">' +
    (projeler.length
      ? tbl('<th>Proje</th><th>Roller</th><th>Durum</th><th>Sağlık</th><th class="num">Görev</th><th>Planlanan bitiş</th><th>İlerleme</th>',
          projeler.map(function(p){
            var pg = gorevler.filter(function(t){ return t.proje === p.kod; });
            return '<tr><td class="cell-wrap">' + link('app-proje-detay.html?id=' + p.kod, p.ad, p.kod + ' · ' + p.musteriAd) + '</td>' +
              '<td>' + projeRol(p).map(function(r){ return '<span class="tag">' + esc(r) + '</span>'; }).join(' ') + '</td>' +
              '<td>' + GV.badge(p.durum) + '</td>' +
              '<td>' + GV.badge(p.saglik) + '</td>' +
              '<td class="num"><b class="u-num">' + pg.length + '</b></td>' +
              '<td>' + GV.dateCell(p.planlananBitis, { done:p.ilerleme === 100 }) + '</td>' +
              '<td>' + GV.progress(p.ilerleme) + '</td></tr>';
          }).join(''),
          sayac('<b>' + projeler.length + '</b> proje · devam eden ' +
            projeler.filter(function(p){ return p.ilerleme < 100; }).length,
            '<a class="btn btn-line btn-sm" href="app-proje.html">' + ico('i-briefcase','ic-sm') + ' Proje listesi</a>'))
      : GV.empty({ icon:'i-briefcase', title:'Proje bağı yok',
          desc:'Bu personel hiçbir proje ekibinde yer almıyor ve projeye bağlı görevi bulunmuyor.',
          action:'<a class="btn btn-acc" href="app-proje.html">Proje listesine git</a>' })) +
    '</div>';

  /* =================================================================
     4. ZAMAN KAYITLARI
     ================================================================= */
  var pZaman = '<div class="gc-body flush">' +
    (loglar.length
      ? tbl('<th>Tarih</th><th>Proje</th><th>Görev</th><th>Açıklama</th><th class="num">Süre</th><th>Faturalanabilir</th><th>Onay</th>',
          loglar.map(function(l){
            return '<tr><td><span class="cell-date">' + F.date(l.tarih) + '</span></td>' +
              '<td>' + (l.proje
                ? '<a href="app-proje-detay.html?id=' + l.proje + '">' + esc(DB.projName(l.proje)) + '</a>'
                : '<span class="u-faint">Projesiz</span>') + '</td>' +
              '<td>' + (l.gorev
                ? '<a href="app-gorev-detay.html?id=' + l.gorev + '">' + esc(l.gorev) + '</a>'
                : '<span class="u-faint">—</span>') + '</td>' +
              '<td class="cell-wrap">' + esc(l.aciklama) + '</td>' +
              '<td class="num"><b class="u-num">' + F.hours(l.sure) + '</b></td>' +
              '<td>' + (l.faturalanabilir ? '<span class="badge is-ok">Evet</span>' : '<span class="tag">Hayır</span>') + '</td>' +
              '<td>' + GV.badge(l.onay) + '</td></tr>';
          }).join(''),
          sayac('<b>' + loglar.length + '</b> kayıt · toplam <b>' + F.hours(logToplam) + '</b> · ' +
            'faturalanabilir <b>' + F.hours(logFatura) + '</b> (%' + logOran + ')',
            '<a class="btn btn-line btn-sm" href="app-zaman.html?f_personel=' + kod + '">' +
              ico('i-timer','ic-sm') + ' Zaman kayıtları</a>'))
      : GV.empty({ icon:'i-timer', title:'Zaman kaydı yok',
          desc:'Bu personel henüz hiçbir göreve süre girmemiş.',
          action:'<a class="btn btn-acc" href="app-zaman.html">Zaman kayıtlarına git</a>' })) +
    '</div>';

  /* =================================================================
     5. TIMESHEET
     ================================================================= */
  var tsToplam = tsheets.reduce(function(a, t){ return a + t.toplam; }, 0);
  var tsFatura = tsheets.reduce(function(a, t){ return a + t.faturalanabilir; }, 0);
  var pTimesheet = '<div class="gc-body flush">' +
    (tsheets.length

  function gorevAtaModal(){
    GV.modal({
      title:'Görev Ata', text:kod + ' · ' + e.ad, icon:'i-tasks', size:'sm',
      body:'<div class="gv-fields">' +
        '<div class="field f-col-12"><label for="gBaslik">Görev başlığı</label>' +
          '<input type="text" class="inp" id="gBaslik" placeholder="Ne yapılacak?"></div>' +
        '<div class="field f-col-6"><label for="gProje">Proje</label><select id="gProje">' +
          '<option value="">Projesiz</option>' +
          DB.projects.filter(function(p){ return p.ilerleme < 100; }).map(function(p){
            return '<option value="' + esc(p.kod) + '">' + esc(p.ad) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field f-col-6"><label for="gTur">Görev türü</label><select id="gTur">' +
          DB.taskTypes.map(function(t){
            return '<option value="' + esc(t) + '"' + (t === 'Proje görevi' ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="field f-col-6"><label for="gOncelik">Öncelik</label><select id="gOncelik">' +
          DB.priorities.map(function(p){
            return '<option value="' + esc(p) + '"' + (p === 'Orta' ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="field f-col-6"><label for="gTermin">Termin</label>' +
          '<input type="date" class="inp" id="gTermin" value="' + DB.today + '"></div>' +
        '<div class="field f-col-6"><label for="gSure">Tahmini süre (saat)</label>' +
          '<input type="number" class="inp" id="gSure" min="0.5" step="0.5" value="4"></div>' +
        '<div class="field f-col-12"><label for="gAcik">Açıklama</label>' +
          '<textarea id="gAcik" rows="2" placeholder="Görevin kapsamı"></textarea></div>' +
        '</div>' +
        (asiriYuklu ? '<div class="u-mt-4">' + GV.notice({ tone:'warn', title:'Doluluk %' + doluluk,
          text:e.ad + ' zaten aşırı yüklü görünüyor. Atama yine de yapılabilir, yük dengesini kontrol edin.' }) + '</div>' : ''),
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Görevi ata', cls:'btn-acc', onClick:function(close, el){
            var baslik = el.querySelector('#gBaslik').value.trim();
            var termin = el.querySelector('#gTermin').value;
            if(!baslik){ GV.toast('Görev başlığı zorunludur', 'danger'); return false; }
            if(!termin){ GV.toast('Termin tarihi zorunludur', 'danger'); return false; }
            if(termin < DB.today){ GV.toast('Termin bugünden önce olamaz', 'danger'); return false; }
            var proje = el.querySelector('#gProje').value;
            var p = proje ? DB.proj(proje) : null;
            var yeni = 'GRV-2026-' + (100 + DB.tasks.length + 1);
            DB.tasks.unshift({
              kod:yeni, baslik:baslik, tur:el.querySelector('#gTur').value,
              proje:proje || null, modul:null, sprint:null, musteri:p ? p.musteri : null, dep:e.dep,
              olusturan:GV.session.emp, veren:GV.session.emp, sorumlu:kod, yardimci:[], izleyiciler:[],
              kontrolEden:e.yonetici, onaylayan:e.yonetici,
              oncelik:el.querySelector('#gOncelik').value, etki:'Orta', aciliyet:'Orta',
              durum:'Atandı', baslangic:DB.today, termin:termin, tamamlanma:null,
              tahminiSure:parseFloat(el.querySelector('#gSure').value) || 0,
              gercekSure:0, faturalanabilir:0, ilerleme:0, revizyon:0, yenidenAcilma:0,
              aciklama:el.querySelector('#gAcik').value.trim() || '—',
              amac:'—', kabulKriteri:'—', beklenenCikti:'—', etiketler:[], aktif:true
            });
            DB.activities.unshift({ kayit:kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0,5),
              kisi:GV.session.emp, metin:'Görev atandı — ' + baslik, eski:null, yeni:yeni,
              tone:'info', icon:'i-tasks' });
            GV.toast(yeni + ' görevi ' + e.ad + ' kişisine atandı', 'ok');
            setTimeout(function(){ GV.refresh(); }, 700);
          } }
      ]
    });
  }
});
</script>
</body>
</html>
