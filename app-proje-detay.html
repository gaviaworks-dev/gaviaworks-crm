<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Proje Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="proje" data-screen="proje">
<!-- UID-15 — shell iskeleti ARTIK ELLE YAZILMIYOR. `buildSkeleton()` gövdedeki
     içeriği koruyup rail/menü/üstbar/main sarmalayıcısını kendisi kurar; böylece
     20 satırlık markup 13 ekranda tekrarlanmaz, kopyalanan `.gv-divider`ın
     `aria-controls` niteliğini kaybetmesi sorunu da kökten biter. -->
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<!-- hr.js = DB.timelogs + DB.employees → personel ve dış kaynak kalemi.
     ops.js = DB.purchases → satın alma kalemi. `GV.proje.maliyet` bu iki
     koleksiyondan okur; ops.js yüklenmezse satın alma kalemi sessizce 0
     kalırdı — bu bir ölçüm değil, eksik kaynak olurdu (REVİZE 04). -->
<script src="assets/data/hr.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var id = new URLSearchParams(location.search).get('id') || 'PRJ-2026-001';
  var p = DB.projects.filter(function(x){ return x.kod === id; })[0];

  if(!p){
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Proje bulunamadı',
      desc:'“' + esc(id) + '” numaralı proje sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-proje.html">Proje listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(p.kod);
  document.title = p.ad + ' — GaviaWorks CRM';

  /* ---- Yetki: finansal tutar maskeleme ---- */
  var canFinans = GV.perm.can('finans');
  function para(v){ return canFinans ? '<span class="cell-money">' + F.money(v) + '</span>' : '<span class="cell-mask">••••••</span>'; }
  function paraK(v){ return canFinans ? '<span class="cell-money">' + F.moneyK(v) + '</span>' : '<span class="cell-mask">••••••</span>'; }

  /* ---- İlişkili kayıtlar ---- */
  function byProje(a){ return (a || []).filter(function(x){ return x.proje === p.kod; }); }

  var musteri     = DB.customers.filter(function(c){ return c.kod === p.musteri; })[0];
  var moduller    = byProje(DB.projectModules);
  var msler       = byProje(DB.milestones).slice().sort(function(a,b){ return (a.taksit || 0) - (b.taksit || 0); });
  /* REVİZE 06 — MILESTONE sekmesi artık PROJE OLAYLARINI gösterir; taksitler
     (`msler`) Bütçe sekmesindeki ödeme planında kalır. İki sekme turun başında
     AYNI diziyi iki başlıkla basıyordu. */
  var pmsler      = byProje(DB.projectMilestones).slice().sort(function(a,b){
                      return String(a.tarih).localeCompare(String(b.tarih)); });
  var sprintler   = byProje(DB.sprints).slice().sort(function(a,b){ return a.baslangic < b.baslangic ? -1 : 1; });
  var gorevler    = byProje(DB.tasks);
  var loglar      = byProje(DB.timelogs);
  var toplantilar = byProje(DB.meetings).slice().sort(function(a,b){ return a.tarih < b.tarih ? 1 : -1; });
  var dokumanlar  = byProje(DB.documents);
  var testler     = byProje(DB.tests);
  var hatalar     = byProje(DB.bugs);
  var teslimler   = byProje(DB.deliveries);
  var degisiklik  = byProje(DB.changeRequests);
  var faturalar   = byProje(DB.invoices);
  var sozlesme    = DB.contracts.filter(function(c){ return c.proje === p.kod; })[0];
  /* Revizyon sayımı DURUMDAN değil, sayaçtan okunur — bu yüzden `Revize bekliyor`
     `Revizede` içinde kapanınca (REVİZE 01) burası etkilenmedi: `Revizede`'ye
     her geçişte `GV.task.transition` `revizyon`u bir artırır (REVİZE 02). */
  var revizyonlar = gorevler.filter(function(t){ return t.tur === 'Revizyon' || t.revizyon > 0 || t.yenidenAcilma > 0; });
  var gorevKod    = gorevler.map(function(t){ return t.kod; });
  var acts        = DB.activities.filter(function(a){ return a.kayit === p.kod || gorevKod.indexOf(a.kayit) !== -1; })
                      .slice().sort(function(a,b){ return a.tarih < b.tarih ? 1 : -1; });
  var kararlar    = DB.decisions.filter(function(d){
                      return toplantilar.some(function(t){ return t.kod === d.toplanti; }); });

  var bitisRef  = p.gercekBitis || p.planlananBitis;
  var kalanGun  = F.days(p.planlananBitis);
  var bitti     = GV.proje.bitti(p);   /* REVİZE 05 — tanım `domain.js`'te */
  var gecikti   = kalanGun < 0 && !bitti;
  /* REVİZE 03 — süre üçlüsü zaman defterinden türetilir; `harcananSure`
     alanı kaldırıldı. `sure.kapsam` false ise defter bu projeyi hiç
     kapsamıyor demektir ve ekran sayı basmaz, bunu SÖYLER. */
  var sure = GV.proje.sure(p.kod);

  /* REVİZE 04 — `gerceklesenMaliyet` alanı KALDIRILDI. 14 kayıtta elle yazılı
     TEK bir rakamdı; hangi kalemden oluştuğu hiçbir yerde yazmıyordu ve bu
     ekran onu iki sekmede "türetilmiş / örtüşmeyebilir" uyarısıyla itiraf
     ediyordu. Maliyet artık dört kalemden türetilir (personel · dış kaynak ·
     satın alma · diğer) ve tek doğru kaynağı `GV.proje.maliyet`tir — bu ekran
     kendi hesabını YAZMAZ, süre üçlüsünde olduğu gibi yordamı çağırır.
     `p.butce` (onaylı bütçe) KALIR: o bir ölçüm değil, plan değeridir. */
  var maliyet = GV.proje.maliyet(p.kod);

  /* DEĞİŞMEZ KURAL — maliyet ölçülemiyorsa ekran SIFIR BASMAZ (L-13).
     "0 ₺ maliyet" ile "maliyet ölçülemiyor" aynı şey değildir: bu depoda 14
     projenin 8'inde `kapsam` false (arşivli projelerin zaman defteri yok).
     Bu cümle yetkiden BAĞIMSIZ basılır — ortada gizlenecek bir tutar yok;
     `cell-mask` boş bir hücreyi maskeleyip tutar varmış gibi gösterirdi. */
  var OLCULEMIYOR = '<span class="u-faint">Ölçülemiyor — bu projede onaylı zaman kaydı ve teslim alınmış satın alma yok</span>';
  var OLCULEMIYOR_KISA = '<span class="u-faint">Ölçülemiyor</span>';
  /* Tutar basan tek kapı: önce ölçüm var mı, sonra yetki maskesi (`para`). */
  function mPara(v){ return maliyet.kapsam ? para(v) : OLCULEMIYOR; }

  /* Maliyete DAYANAN türetmeler de kapsamı taşır: ölçülmemiş maliyetten
     "bütçe içinde" sonucu çıkarmak, "bütçe aşıldı" demek kadar uydurma olurdu. */
  var kalanButce    = maliyet.kapsam ? p.butce - maliyet.toplam : null;
  var butceKullanim = (maliyet.kapsam && p.butce) ? Math.round(maliyet.toplam / p.butce * 100) : null;
  /* Ortalama saat maliyeti yalnız EMEK kalemlerinden hesaplanır: satın alma
     saatle ölçülmez, toplamı saate bölmek "saat başına düşen donanım gideri"
     gibi karşılığı olmayan bir birim üretirdi. */
  var emekMaliyet = maliyet.personel + maliyet.disKaynak;
  var saatMaliyet = (maliyet.kapsam && maliyet.saat) ? Math.round(emekMaliyet / maliyet.saat) : null;

  /* ---- Küçük yardımcılar ---- */
  /* Sekme içi tablolar mobilde kart listesine dönmez, yatay kaydırır —
     ui.css'teki varsayılan davranış: tablo mobilde kendi içinde yatay kayar (UID-14). */
  function tablo(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' + head +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function bos(icon, title, desc, action){
    return GV.empty({ icon:icon, title:title, desc:desc, action:action });
  }
  function toD(iso){ return new Date(String(iso).slice(0,10) + 'T00:00:00'); }
  function isoOf(d){
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function addDays(iso, n){ var d = toD(iso); d.setDate(d.getDate() + n); return isoOf(d); }
  function uniq(a){ var o = []; a.forEach(function(x){ if(x && o.indexOf(x) === -1) o.push(x); }); return o; }
  function link(href, text){ return '<a href="' + href + '">' + text + '</a>'; }

  /* ===================================================================
     BAŞLIK
     =================================================================== */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + p.kod + '</span>' +
        GV.badge(p.durum) + GV.badge(p.saglik) + GV.pri(p.oncelik) +
        '<span class="tag">' + esc(p.tur) + '</span>' +
        (gecikti ? '<span class="badge is-danger">' + Math.abs(kalanGun) + ' gün gecikti</span>' : '') + '</div>' +
      '<h1>' + esc(p.ad) + '</h1>' +
      '<div class="gv-rec-meta">' +
        '<span>' + ico('i-building','ic-sm') +
          (musteri ? link('app-musteri-detay.html?id=' + musteri.kod, esc(musteri.kisa || musteri.unvan)) : esc(p.musteriAd)) + '</span>' +
        '<span>' + ico('i-user','ic-sm') + 'PM ' + esc(DB.empName(p.pm)) + '</span>' +
        '<span>' + ico('i-users','ic-sm') + (p.ekip || []).length + ' kişilik ekip</span>' +
        '<span>' + ico('i-calendar','ic-sm') + F.date(p.baslangic) + ' → ' + F.date(p.planlananBitis) + '</span>' +
        '<span>' + ico('i-flag','ic-sm') + esc(p.faz) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="ph-actions">' +
      '<a class="btn btn-line" href="app-gorev.html">' + ico('i-tasks') + ' Görevler</a>' +
      '<a class="btn btn-line" href="app-proje-milestone.html">' + ico('i-milestone') + ' Milestone</a>' +
      /* REVİZE 07 — kapanmış projede buton BASILMAZ; "kapat" diyip sonra
         "zaten kapalı" demek sahte aksiyondur (act.js sınıfı 🔴 YALAN). */
      (GV.proje.kapali(p) ? '' :
        '<button type="button" class="btn btn-line" id="btnKapat">' + ico('i-check-circle') + ' Projeyi Kapat</button>') +
      '<a class="btn btn-acc" href="app-proje-form.html?id=' + p.kod + '">' + ico('i-edit') + ' Düzenle</a>' +
    '</div></div>';

  /* ===================================================================
     1. GENEL BAKIŞ
     =================================================================== */
  var kritikIsler = gorevler.filter(function(t){
    return ['Kritik','Yüksek'].indexOf(t.oncelik) !== -1 &&
           ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) === -1;
  });

  var pGenel = '<div class="gc-body">' +
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Proje Künyesi</h3></div>' +
      GV.dl([
        ['Proje kodu', '<b>' + p.kod + '</b>'],
        ['Proje adı', esc(p.ad)],
        ['Müşteri', musteri ? link('app-musteri-detay.html?id=' + musteri.kod, esc(musteri.unvan)) : esc(p.musteriAd)],
        ['Proje türü', esc(p.tur)],
        /* REVİZE 11 — proje kaynağı. Kaynağı sözleşme olan projede sözleşme
           kaydı bağ olarak gösterilir; bağ SÖZLEŞMEDE yazılıdır (§9d), burada
           okunur. Kaydı olmayan eski işlerde kaynak yazılır, sahte bağ değil. */
        ['Proje kaynağı', esc(p.kaynak) + (sozlesme
          ? ' · ' + link('app-sozlesme-detay.html?id=' + sozlesme.kod, esc(sozlesme.kod))
          : (p.kaynak === 'Müşteri Sözleşmesi'
              ? ' <span class="u-faint">· sözleşme kaydı bu depoda yok</span>' : ''))],
        ['Faz', esc(p.faz)],
        ['Durum', GV.badge(p.durum)],
        ['Sağlık durumu', GV.badge(p.saglik)],
        ['Öncelik', GV.pri(p.oncelik)],
        ['Proje yöneticisi', GV.user(p.pm, { sm:true })],
        ['Son güncelleme', F.date(p.sonGuncelleme)]
      ]) +
    '</div>' +
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Zaman ve İlerleme</h3></div>' +
      GV.dl([
        ['Başlangıç tarihi', F.date(p.baslangic)],
        ['Planlanan bitiş', GV.dateCell(p.planlananBitis, { done:bitti })],
        ['Gerçekleşen bitiş', p.gercekBitis ? F.date(p.gercekBitis) : null],
        ['Kalan süre', bitti ? 'Tamamlandı' : F.rel(p.planlananBitis)],
        ['İlerleme oranı', GV.progress(p.ilerleme)],
        ['Planlanan süre', F.hours(sure.planlanan)],
        ['Gerçekleşen süre <span class="u-faint">(onaylı zaman kaydı)</span>', sure.kapsam
          ? '<b>' + F.hours(sure.gerceklesen) + '</b>' +
            (sure.tum > sure.gerceklesen
              ? ' <span class="cell-sub">+ ' + F.hours(sure.tum - sure.gerceklesen) + ' onay bekliyor</span>' : '')
          : '<span class="u-faint">Zaman defterinde bu projeye ait kayıt yok</span>'],
        ['Faturalandırılabilir süre', sure.kapsam
          ? '<b>' + F.hours(sure.faturalanabilir) + '</b>' +
            (sure.gerceklesen ? ' <span class="cell-sub">gerçekleşenin %' +
              Math.round(sure.faturalanabilir / sure.gerceklesen * 100) + '\u2019i</span>' : '')
          : null],
        ['Süre sapması', (function(){
          if(!sure.planlanan || !sure.kapsam) return null;
          var d = sure.gerceklesen - sure.planlanan;
          var y = Math.round(d / sure.planlanan * 100);
          return d > 0 ? '<span class="u-num u-danger u-b">+' + F.hours(d) + ' (%' + y + ')</span>'
                       : '<span class="u-num u-ok u-b">' + F.hours(d) + ' (%' + y + ')</span>';
        })()],
        ['Gecikme nedeni', p.gecikmeNedeni ? esc(p.gecikmeNedeni) : null]
      ]) +
    '</div>' +
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Teknik Envanter</h3></div>' +
      GV.dl([
        ['Kod deposu', p.repo && p.repo !== '—' ? esc(p.repo) : null],
        ['Canlı ortam', p.canli && p.canli !== '—' ? esc(p.canli) : null],
        ['Test ortamı', p.test && p.test !== '—' ? esc(p.test) : null],
        ['Tasarım dosyası', p.tasarim && p.tasarim !== '—' ? esc(p.tasarim) : null],
        ['Sunucu / barındırma', esc(p.sunucu)],
        ['Teknoloji yığını', (p.teknoloji || []).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join(' ')],
        ['Üçüncü taraf servisler', (p.ucuncuTaraf || []).length
          ? p.ucuncuTaraf.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join(' ') : null],
        ['Teknik sorumlu', GV.user(p.teknikSorumlu, { sm:true })],
        ['Müşteri ilişkileri sorumlusu', GV.user(p.musteriSorumlu, { sm:true })]
      ]) +
    '</div>' +
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Riskler ve Kritik İşler</h3></div>' +
      ((p.riskler || []).length
        ? '<div class="u-col u-mb-4">' + p.riskler.map(function(r){
            return '<span class="u-sm">' + ico('i-alert','ic-sm') + ' ' + esc(r) + '</span>'; }).join('') + '</div>'
        : '<p class="u-sm u-faint u-mb-4">Bu proje için tanımlı risk kaydı yok.</p>') +
      (kritikIsler.length
        ? tablo('<th>Kritik / yüksek öncelikli açık iş</th><th>Sorumlu</th><th>Termin</th><th>Durum</th>',
            kritikIsler.map(function(t){
              return '<tr><td>' + link('app-gorev-detay.html?id=' + t.kod, esc(t.baslik)) +
                '<span class="cell-code">' + t.kod + '</span></td>' +
                '<td>' + GV.user(t.sorumlu, { sm:true }) + '</td>' +
                '<td>' + GV.dateCell(t.termin) + '</td>' +
                '<td>' + GV.badge(t.durum) + '</td></tr>';
            }).join(''))
        : '<p class="u-sm u-faint">Açık kritik iş yok.</p>') +
    '</div>' +
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Müşteri Onayları</h3></div>' +
      (teslimler.length
        ? tablo('<th>Teslim</th><th>Tarih</th><th>Müşteri onayı</th><th>Onay tarihi</th>',
            teslimler.map(function(d){
              return '<tr><td><span class="cell-main">' + esc(d.ad) + '</span><span class="cell-code">' + d.kod + '</span></td>' +
                '<td><span class="cell-date">' + F.date(d.tarih) + '</span></td>' +
                '<td>' + GV.badge(d.musteriOnay) + '</td>' +
                '<td>' + (d.onayTarihi ? F.date(d.onayTarihi) : '<span class="u-faint">—</span>') + '</td></tr>';
            }).join(''))
        : '<p class="u-sm u-faint">Müşteri onayına sunulmuş teslim kaydı yok.</p>') +
    '</div>' +
  '</div>';

  /* ===================================================================
     2. PROJE EKİBİ
     =================================================================== */
  var ekipKod = uniq([p.pm].concat(p.ekip || [], [p.teknikSorumlu, p.musteriSorumlu])
    .concat(gorevler.map(function(t){ return t.sorumlu; }))
    .concat(loglar.map(function(l){ return l.personel; })));

  function ekipRol(kod){
    var r = [];
    if(kod === p.pm) r.push('Proje yöneticisi');
    if(kod === p.teknikSorumlu) r.push('Teknik sorumlu');
    if(kod === p.musteriSorumlu) r.push('Müşteri sorumlusu');
    if((p.ekip || []).indexOf(kod) !== -1) r.push('Ekip üyesi');
    if(!r.length) r.push('Katkı veren');
    return r;
  }

  var pEkip = '<div class="gc-body flush">' +
    tablo('<th>Kişi</th><th>Pozisyon</th><th>Projedeki rolü</th><th class="num">Görev</th><th class="num">Harcanan</th><th>Genel doluluk</th>',
      ekipKod.map(function(k){
        var e = DB.emp(k) || {};
        var gs = gorevler.filter(function(t){ return t.sorumlu === k; });
        var sa = loglar.filter(function(l){ return l.personel === k; }).reduce(function(a,l){ return a + l.sure; }, 0);
        return '<tr><td>' + GV.user(k) + '<span class="cell-code">' + esc(k) + '</span></td>' +
          '<td><span class="cell-sub">' + esc(e.pozisyon || '—') + '</span></td>' +
          '<td>' + ekipRol(k).map(function(r){ return '<span class="tag">' + esc(r) + '</span>'; }).join(' ') + '</td>' +
          '<td class="num"><b class="u-num">' + gs.length + '</b></td>' +
          '<td class="num"><span class="u-num">' + F.hours(sa) + '</span></td>' +
          '<td>' + (e.doluluk == null ? '<span class="u-faint">—</span>' : GV.progress(e.doluluk)) + '</td></tr>';
      }).join('')) +
    '<div class="gc-foot"><span class="gv-count"><b>' + ekipKod.length + '</b> kişi · toplam ' +
      F.hours(loglar.reduce(function(a,l){ return a + l.sure; }, 0)) + ' kayıtlı emek</span>' +
      '<a class="btn btn-line btn-sm" href="app-personel.html">' + ico('i-users','ic-sm') + ' Personel listesi</a></div>' +
  '</div>';

  /* ===================================================================
     3. MODÜLLER
     =================================================================== */
  var pModul = '<div class="gc-body flush">' +
    (moduller.length
      ? tablo('<th>Modül</th><th>Sorumlu</th><th>Durum</th><th>İlerleme</th><th class="num">Planlanan efor</th><th class="num">Kayıtlı görev</th>',
          moduller.map(function(m){
            var mg = gorevler.filter(function(t){ return t.modul === m.kod; });
            return '<tr><td><span class="cell-main">' + esc(m.ad) + '</span><span class="cell-code">' + m.kod + '</span></td>' +
              '<td>' + GV.user(m.sorumlu, { sm:true }) + '</td>' +
              '<td>' + GV.badge(m.durum) + '</td>' +
              '<td>' + GV.progress(m.ilerleme) + '</td>' +
              '<td class="num"><span class="u-num">' + F.hours(m.efor) + '</span></td>' +
              '<td class="num"><b class="u-num">' + mg.length + '</b></td></tr>';
          }).join('')) +
        '<div class="gc-foot"><span class="gv-count"><b>' + moduller.length + '</b> modül · toplam planlanan efor ' +
          F.hours(moduller.reduce(function(a,m){ return a + m.efor; }, 0)) + '</span></div>'
      : bos('i-layers','Modül tanımlı değil','Bu proje için henüz modül kırılımı oluşturulmamış.')) +
  '</div>';

  /* ===================================================================
     4. PROJE MILESTONE'U (proje olayları — tutar taşımaz)
     =================================================================== */
  /* Bütçe sekmesindeki ödeme planı da kullanır — taksitin faturası. */
  function msFatura(kod){ return DB.invoices.filter(function(f){ return f.milestone === kod; })[0]; }
  function pmsTeslim(kod){ return DB.deliveries.filter(function(d){ return d.kod === kod; })[0]; }
  /* Ters yön: bağ ödeme kaydında durur, milestone'da ayna alan yoktur (§9d). */
  function pmsTaksit(kod){ return DB.milestones.filter(function(m){ return m.milestone === kod; })[0]; }

  var pMilestone = '<div class="gc-body flush">' +
    (pmsler.length
      ? tablo('<th>Milestone</th><th>Tarih</th><th>Sorumlu</th><th>Durum</th>' +
              '<th>İlgili teslimat</th><th>Bağlı ödeme taksiti</th><th>Kayıt kaynağı</th>',
          pmsler.map(function(m){
            var t = m.teslimat ? pmsTeslim(m.teslimat) : null, k = pmsTaksit(m.kod);
            return '<tr><td><span class="cell-main">' + esc(m.baslik) + '</span><span class="cell-code">' + m.kod + '</span></td>' +
              '<td>' + GV.dateCell(m.tarih, { done:m.durum === 'Tamamlandı' }) + '</td>' +
              '<td>' + (m.sorumlu ? GV.user(m.sorumlu, { sm:true }) : '<span class="u-faint">—</span>') + '</td>' +
              '<td>' + GV.badge(m.durum) + '</td>' +
              '<td>' + (t ? link('app-proje-teslim-detay.html?id=' + t.kod, esc(t.ad)) : '<span class="u-faint">—</span>') + '</td>' +
              '<td>' + (k ? '<span class="cell-sub">T' + k.taksit + ' · ' + esc(k.ad) + '</span>' : '<span class="u-faint">Ödeme bağı yok</span>') + '</td>' +
              '<td><span class="cell-sub">' + esc(m.aciklama) + '</span></td></tr>';
          }).join('')) +
        '<div class="gc-foot"><span class="gv-count"><b>' + pmsler.length + '</b> milestone · ' +
          pmsler.filter(function(m){ return m.durum === 'Tamamlandı'; }).length + ' tamamlandı · ' +
          'tutarlar Bütçe sekmesindeki ödeme planındadır</span>' +
          '<a class="btn btn-line btn-sm" href="app-proje-milestone.html">' + ico('i-milestone','ic-sm') + ' Milestone ekranı</a></div>'
      : bos('i-milestone','Milestone kaydı yok',
            'Bu projede henüz bir teslim ya da tamamlanmış proje olayı kaydedilmemiş. ' +
            'Ödeme planı taksitleri Bütçe sekmesindedir — taksit bir milestone değildir.')) +
  '</div>';

  /* ===================================================================
     5. SPRINTLER
     =================================================================== */
  var pSprint = '<div class="gc-body flush">' +
    (sprintler.length
      ? tablo('<th>Sprint</th><th>Aralık</th><th>Durum</th><th class="num">Planlanan</th><th class="num">Tamamlanan</th>' +
              '<th>Tamamlanma</th><th class="num">Görev</th><th class="num">Kayıtlı görev</th>',
          sprintler.map(function(s){
            var sg = gorevler.filter(function(t){ return t.sprint === s.kod; });
            var oran = s.planlanan ? Math.round(s.tamamlanan / s.planlanan * 100) : 0;
            return '<tr><td><span class="cell-main">' + esc(s.ad) + '</span><span class="cell-code">' + s.kod + '</span></td>' +
              '<td><span class="cell-date">' + F.dateShort(s.baslangic) + ' – ' + F.dateShort(s.bitis) + '</span></td>' +
              '<td>' + GV.badge(s.durum) + '</td>' +
              '<td class="num"><span class="u-num">' + F.hours(s.planlanan) + '</span></td>' +
              '<td class="num"><b class="u-num">' + F.hours(s.tamamlanan) + '</b></td>' +
              '<td>' + GV.progress(oran) + '</td>' +
              '<td class="num"><span class="u-num">' + s.gorevSayisi + '</span></td>' +
              '<td class="num"><span class="u-num">' + sg.length + '</span></td></tr>';
          }).join('')) +
        '<div class="gc-foot"><span class="gv-count">“Görev” sprintin gerçek görev sayısı, “kayıtlı görev” prototipte modellenmiş olanlar</span>' +
          '<a class="btn btn-line btn-sm" href="app-proje-sprint.html">' + ico('i-sprint','ic-sm') + ' Sprint ekranı</a></div>'
      : bos('i-sprint','Sprint tanımlı değil','Bu proje sprint döngüsüyle yürütülmüyor ya da henüz sprint açılmamış.')) +
  '</div>';

  /* ===================================================================
     6. GÖREVLER
     =================================================================== */
  var pGorev = '<div class="gc-body flush">' +
    (gorevler.length
      ? tablo('<th>Görev</th><th>Tür</th><th>Modül</th><th>Sorumlu</th><th>Öncelik</th><th>Durum</th>' +
              '<th>Termin</th><th>İlerleme</th><th class="num">Tahmini / gerçek</th>',
          gorevler.map(function(t){
            return '<tr><td>' + link('app-gorev-detay.html?id=' + t.kod, esc(t.baslik)) +
              '<span class="cell-code">' + t.kod + '</span></td>' +
              '<td><span class="tag">' + esc(t.tur) + '</span></td>' +
              '<td><span class="cell-sub">' + esc(t.modul ? DB.modName(t.modul) : '—') + '</span></td>' +
              '<td>' + GV.user(t.sorumlu, { sm:true }) + '</td>' +
              '<td>' + GV.pri(t.oncelik) + '</td>' +
              '<td>' + GV.badge(t.durum) + '</td>' +
              '<td>' + GV.dateCell(t.termin, { done:t.durum === 'Tamamlandı' }) + '</td>' +
              '<td>' + GV.progress(t.ilerleme) + '</td>' +
              '<td class="num"><span class="u-num">' + F.hours(t.tahminiSure) + ' / <b>' + F.hours(t.gercekSure) + '</b></span></td></tr>';
          }).join('')) +
        '<div class="gc-foot"><span class="gv-count"><b>' + gorevler.length + '</b> görev · ' +
          gorevler.filter(function(t){ return t.durum === 'Tamamlandı'; }).length + ' tamamlandı · ' +
          gorevler.filter(function(t){ return F.days(t.termin) < 0 && ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) === -1; }).length +
          ' geciken</span><a class="btn btn-line btn-sm" href="app-gorev.html">' + ico('i-tasks','ic-sm') + ' Görev ekranı</a></div>'
      : bos('i-tasks','Görev yok','Bu projeye bağlı kayıtlı görev bulunmuyor.')) +
  '</div>';

  /* ===================================================================
     7. İŞ YÜKÜ
     =================================================================== */
  var isYukuSat = ekipKod.map(function(k){
    var e = DB.emp(k) || {};
    var gs = gorevler.filter(function(t){ return t.sorumlu === k; });
    var acik = gs.filter(function(t){ return ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) === -1; });
    var geciken = acik.filter(function(t){ return F.days(t.termin) < 0; });
    var sa = loglar.filter(function(l){ return l.personel === k; }).reduce(function(a,l){ return a + l.sure; }, 0);
    var tahmin = acik.reduce(function(a,t){ return a + (t.tahminiSure || 0); }, 0);
    return { kod:k, e:e, gs:gs, acik:acik, geciken:geciken, sa:sa, tahmin:tahmin };
  }).sort(function(a,b){ return b.sa - a.sa; });

  var toplamSaat = loglar.reduce(function(a,l){ return a + l.sure; }, 0);

  var pIsYuku = '<div class="gc-body">' +
    GV.notice({ tone:'info', icon:'i-info',
      title:'Bu sekmedeki saatler yalnız bu projeye girilmiş zaman kayıtlarıdır',
      text:'Kişinin genel doluluğu tüm projelerini kapsar; proje bazlı emek ' + F.hours(toplamSaat) +
           ', projenin defterdeki toplam emeği ' + F.hours(sure.tum) + ' olarak raporlanır.' }) +
    '<div class="u-mt-4">' +
    tablo('<th>Kişi</th><th class="num">Atanmış görev</th><th class="num">Açık görev</th><th class="num">Geciken</th>' +
          '<th class="num">Açık iş tahmini</th><th class="num">Harcanan saat</th><th>Projedeki payı</th>',
      isYukuSat.map(function(r){
        var pay = toplamSaat ? Math.round(r.sa / toplamSaat * 100) : 0;
        return '<tr><td>' + GV.user(r.kod) + '</td>' +
          '<td class="num"><span class="u-num">' + r.gs.length + '</span></td>' +
          '<td class="num"><b class="u-num">' + r.acik.length + '</b></td>' +
          '<td class="num">' + (r.geciken.length
            ? '<span class="u-num u-danger u-b">' + r.geciken.length + '</span>' : '<span class="u-num u-faint">0</span>') + '</td>' +
          '<td class="num"><span class="u-num">' + F.hours(r.tahmin) + '</span></td>' +
          '<td class="num"><b class="u-num">' + F.hours(r.sa) + '</b></td>' +
          '<td>' + GV.progress(pay, { tone:'accent' }) + '</td></tr>';
      }).join('')) +
    '</div></div>';

  /* ===================================================================
     8. TAKVİM (DB.today ayı)
     =================================================================== */
  var TODAY = DB.today;
  var ayBasi = TODAY.slice(0,7) + '-01';
  var ilkGun = toD(ayBasi);
  var kaydir = (ilkGun.getDay() + 6) % 7;          /* pazartesi başlangıç */
  var gridStart = addDays(ayBasi, -kaydir);
  var AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var DOW = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

  var olaylar = [];
  msler.forEach(function(m){
    olaylar.push({ g:m.tarih, t:'Taksit ' + m.taksit + ' · ' + m.ad,
      tone:m.durum === 'Tamamlandı' ? 'ok' : (m.durum === 'Gecikti' ? 'danger' : 'purple') });
  });
  sprintler.forEach(function(s){
    olaylar.push({ g:s.baslangic, t:'Sprint başlangıcı · ' + s.ad, tone:'accent' });
    olaylar.push({ g:s.bitis, t:'Sprint bitişi · ' + s.ad, tone:'accent' });
  });
  gorevler.forEach(function(t){
    if(!t.termin) return;
    var ge = F.days(t.termin) < 0 && ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) === -1;
    olaylar.push({ g:t.termin, t:'Termin · ' + t.baslik, tone:ge ? 'danger' : (t.durum === 'Tamamlandı' ? 'ok' : 'warn') });
  });
  toplantilar.forEach(function(m){ olaylar.push({ g:m.tarih.slice(0,10), t:'Toplantı · ' + m.ad, tone:'neutral' }); });
  teslimler.forEach(function(d){
    olaylar.push({ g:d.tarih, t:'Teslim · ' + d.ad, tone:d.durum === 'Gecikti' ? 'danger' : 'ok' }); });

  var ayOlay = olaylar.filter(function(o){ return o.g >= gridStart && o.g < addDays(gridStart, 42); });

  var calCells = '';
  for(var ci = 0; ci < 42; ci++){
    var ds = addDays(gridStart, ci);
    var evs = ayOlay.filter(function(o){ return o.g === ds; });
    calCells += '<div class="gv-cal-day' + (ds.slice(0,7) !== TODAY.slice(0,7) ? ' is-out' : '') +
      (ds === TODAY ? ' is-today' : '') + '">' +
      '<span class="gv-cal-num">' + parseInt(ds.slice(8,10), 10) + '</span>' +
      evs.slice(0,3).map(function(o){
        return '<span class="gv-cal-ev is-' + o.tone + '" title="' + esc(o.t) + '">' + esc(o.t) + '</span>';
      }).join('') +
      (evs.length > 3 ? '<span class="gv-cal-ev is-neutral" title="' + (evs.length - 3) + ' olay daha">+' +
        (evs.length - 3) + ' olay daha</span>' : '') +
      '</div>';
  }

  var pTakvim = '<div class="gc-body">' +
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' +
      esc(AYLAR[parseInt(TODAY.slice(5,7), 10) - 1] + ' ' + TODAY.slice(0,4)) + '</h3>' +
      '<p>Milestone, sprint sınırları, görev terminleri, toplantılar ve teslimler</p></div>' +
      (ayOlay.length
        ? '<div class="gv-cal">' + DOW.map(function(d){ return '<div class="gv-cal-dow">' + d + '</div>'; }).join('') + calCells + '</div>'
        : bos('i-calendar','Bu ayda olay yok','Seçili ayda bu projeye ait milestone, termin, toplantı veya teslim bulunmuyor.')) +
    '</div>' +
    '<div class="gv-legend">' +
      '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--purple)"></span>Milestone</span>' +
      '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--acc-ink)"></span>Sprint</span>' +
      '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--warn)"></span>Görev termini</span>' +
      '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--ok)"></span>Teslim</span>' +
      '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--danger)"></span>Geciken</span>' +
    '</div></div>';

  /* ===================================================================
     9. GANTT
     Çubuk konumu inline style ile verilir (components.md §3 istisnası),
     renk sınıfla gelir: .is-ok / .is-warn / .is-danger
     =================================================================== */
  var ganttTarih = [p.baslangic, p.planlananBitis, p.gercekBitis, TODAY]
    .concat(msler.map(function(m){ return m.tarih; }))
    .concat(sprintler.map(function(s){ return s.baslangic; }))
    .concat(sprintler.map(function(s){ return s.bitis; }))
    .filter(Boolean).sort();

  var gStart = ganttTarih[0], gEnd = ganttTarih[ganttTarih.length - 1];
  /* Eksen ay başına yuvarlanır, böylece ay başlıkları çubuklarla hizalanır */
  gStart = gStart.slice(0,7) + '-01';
  var eAy = parseInt(gEnd.slice(5,7), 10), eYil = parseInt(gEnd.slice(0,4), 10);
  if(eAy === 12){ eAy = 1; eYil++; } else { eAy++; }
  gEnd = eYil + '-' + ('0' + eAy).slice(-2) + '-01';
  var gSpan = Math.max(1, (toD(gEnd) - toD(gStart)) / 86400000);

  function gPct(iso){ return (toD(iso) - toD(gStart)) / 86400000 / gSpan * 100; }

  var gAylar = [];
  (function(){
    var y = parseInt(gStart.slice(0,4), 10), m = parseInt(gStart.slice(5,7), 10);
    var sonY = parseInt(gEnd.slice(0,4), 10), sonM = parseInt(gEnd.slice(5,7), 10);
    while(y < sonY || (y === sonY && m < sonM)){
      var gunSayisi = new Date(y, m, 0).getDate();
      gAylar.push({ lbl:AYLAR[m - 1].slice(0,3) + ' ' + String(y).slice(2), gun:gunSayisi });
      if(m === 12){ m = 1; y++; } else { m++; }
    }
  })();

  function ganttRow(lbl, bas, bit, cls, metin){
    var l = Math.max(0, gPct(bas));
    var w = Math.max(1.2, gPct(bit) - l);
    if(l + w > 100) w = 100 - l;
    return '<div class="gv-gantt-row">' +
      '<div class="gv-gantt-lbl" title="' + esc(lbl) + '">' + esc(lbl) + '</div>' +
      '<div class="gv-gantt-track">' +
        '<span class="gv-gantt-ms" style="left:' + gPct(TODAY).toFixed(2) + '%" title="Bugün ' + F.date(TODAY) + '"></span>' +
        '<span class="gv-gantt-bar' + (cls ? ' ' + cls : '') + '" style="left:' + l.toFixed(2) + '%;width:' + w.toFixed(2) + '%" ' +
          'title="' + esc(lbl + ' · ' + F.date(bas) + ' → ' + F.date(bit)) + '">' + esc(metin || '') + '</span>' +
      '</div></div>';
  }

  var ganttRows = ganttRow('PROJE · ' + p.kod, p.baslangic, p.gercekBitis || p.planlananBitis,
      bitti ? 'is-ok' : (gecikti ? 'is-danger' : ''), '%' + p.ilerleme);

  var oncekiTarih = p.baslangic;
  msler.forEach(function(m){
    var cls = m.durum === 'Tamamlandı' ? 'is-ok' : (m.durum === 'Gecikti' ? 'is-danger' :
              (m.durum === 'Yaklaşıyor' ? 'is-warn' : ''));
    var bas = oncekiTarih < m.tarih ? oncekiTarih : m.tarih;
    ganttRows += ganttRow('T' + m.taksit + ' · ' + m.ad, bas, m.tarih, cls, F.dateShort(m.tarih));
    oncekiTarih = m.tarih;
  });

  sprintler.forEach(function(s){
    var gecikmis = F.days(s.bitis) < 0 && s.durum !== 'Tamamlandı';
    var cls = s.durum === 'Tamamlandı' ? 'is-ok' : (gecikmis ? 'is-danger' :
              (s.durum === 'Devam ediyor' ? 'is-warn' : ''));
    ganttRows += ganttRow(s.ad, s.baslangic, s.bitis, cls,
      s.planlanan ? Math.round(s.tamamlanan / s.planlanan * 100) + '%' : '');
  });

  var pGantt = '<div class="gc-body">' +
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Zaman Çizelgesi</h3>' +
      '<p>Proje, ödeme planı taksitleri ve sprintler · mor çizgi bugünü gösterir</p></div>' +
      '<div class="gv-gantt">' +
        '<div class="gv-gantt-head"><div class="gv-gantt-lbl">Kalem</div>' +
          '<div class="gv-gantt-months">' + gAylar.map(function(a){
            return '<div class="gv-gantt-month" style="flex:' + a.gun + '">' + esc(a.lbl) + '</div>';
          }).join('') + '</div></div>' +
        '<div class="gv-gantt-grid">' + ganttRows + '</div>' +
      '</div>' +
      '<div class="gv-legend">' +
        '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--ok)"></span>Tamamlandı</span>' +
        '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--warn)"></span>Yaklaşan / devam eden</span>' +
        '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--danger)"></span>Gecikmiş</span>' +
        '<span class="gv-legend-item"><span class="gv-legend-swatch" style="background:var(--purple)"></span>Bugün</span>' +
      '</div>' +
    '</div></div>';

  /* ===================================================================
     10. KANBAN
     =================================================================== */
  /* Kolonlar sözlükten gelir (REVİZE 01 ile 19 değerden 10'a indi), ama pano
     YAŞAYAN işi gösterir: `Arşivlendi` ve `İptal edildi` yaşam döngüsünün
     dışındadır — kolon açılırsa pano ölü işle şişer ve akış okunmaz olur.
     `Tamamlandı` panoda kalır; panonun son kolonu odur. */
  var PANO_DISI   = ['Arşivlendi','İptal edildi'];
  var panoGorev   = gorevler.filter(function(t){ return PANO_DISI.indexOf(t.durum) === -1; });
  var kanbanDurum = DB.taskStatuses.filter(function(d){
    return PANO_DISI.indexOf(d) === -1 && panoGorev.some(function(t){ return t.durum === d; }); });

  var pKanban = panoGorev.length
    ? '<div class="gv-kanban">' + kanbanDurum.map(function(d){
        var items = panoGorev.filter(function(t){ return t.durum === d; });
        var ton = GV.tone(d);
        return '<section class="gv-kcol" data-kcol="' + esc(d) + '">' +
          '<div class="gv-kcol-head">' +
            '<span class="gv-kcol-bar" style="width:var(--sp-8);background:var(--' + (ton === 'accent' ? 'acc' : ton) + ')"></span>' +
            '<span class="gv-kcol-title">' + esc(d) + '</span>' +
            '<span class="gv-kcol-cnt">' + items.length + '</span></div>' +
          '<div class="gv-kcol-body">' + items.map(function(t){
            return '<article class="gv-kcard" data-id="' + t.kod + '">' +
              '<span class="gv-kcard-title">' + link('app-gorev-detay.html?id=' + t.kod, esc(t.baslik)) + '</span>' +
              '<div class="gv-kcard-meta">' + GV.pri(t.oncelik) + '<span>' + esc(t.kod) + '</span></div>' +
              '<div class="gv-kcard-meta">' + GV.user(t.sorumlu, { sm:true }) + GV.dateCell(t.termin, { done:t.durum === 'Tamamlandı' }) + '</div>' +
              GV.progress(t.ilerleme) +
            '</article>';
          }).join('') + '</div></section>';
      }).join('') + '</div>'
    : '<div class="gc-body">' + bos('i-kanban','Kanban için görev yok',
        'Bu projede panoya girecek görev yok. Arşivlenmiş ve iptal edilmiş görevler panoda gösterilmez.') + '</div>';

  /* ===================================================================
     11. ZAMAN KAYITLARI
     =================================================================== */
  /* REVİZE 03 — bu toplam ONAYLI eksene çekildi. Eskiden onaylı/onaysız tüm
     satırları topluyordu ve proje kartındaki faturalandırılabilir süreyle
     ayrışıyordu; aynı sayı iki ekranda iki farklı değerdi. */
  var faturalanabilirSaat = sure.faturalanabilir;

  var pZaman = '<div class="gc-body flush">' +
    (loglar.length
      ? tablo('<th>Tarih</th><th>Personel</th><th>Görev</th><th>Açıklama</th><th class="num">Süre</th><th>Faturalanabilir</th><th>Onay</th>',
          loglar.slice().sort(function(a,b){ return a.tarih < b.tarih ? 1 : -1; }).map(function(l){
            var g = DB.task(l.gorev);

                '<th class="num">KDV</th><th class="num">Genel toplam (KDV dahil)</th><th>Durum</th><th>Ödeme tarihi</th>',

    '</div></div>';

  /* ===================================================================
     20. MALİYETLER
     =================================================================== */
  var modulEfor = moduller.reduce(function(a,m){ return a + m.efor; }, 0);

  /* Kişi bazlı emek maliyeti ARTIK TÜRETİLMİŞ TAHMİN DEĞİL, ÖLÇÜM: her satır
     kişinin ONAYLI saati × kendi saatlik iç maliyeti. Eskiden proje ortalama
     saat maliyetiyle çarpılıyordu; o yüzden "toplamla örtüşmeyebilir" uyarısı
     gerekiyordu. Bu tablonun toplamı `maliyet.personel + maliyet.disKaynak`
     kalemlerine birebir eşittir — uyarı gereksizleşti (bkz. sekme başı notu). */
  var kisiSat = isYukuSat.filter(function(r){ return r.sa > 0; }).map(function(r){
    var kl     = loglar.filter(function(l){ return l.personel === r.kod; });
    var onayli = kl.filter(function(l){ return l.onay === 'Onaylandı'; });
    var oSaat  = onayli.reduce(function(a,l){ return a + l.sure; }, 0);
    var fSaat  = onayli.filter(function(l){ return l.faturalanabilir; })
                   .reduce(function(a,l){ return a + l.sure; }, 0);
    /* İç maliyet iki alandan türetilir (maaş veya sözleşmeli saat ücreti);
       ikisi de boşsa tutar UYDURULMAZ, null taşınır ve ekranda söylenir. */
    var ic = GV.hr.icMaliyet(r.kod);
    return { kod:r.kod, sa:r.sa, oSaat:oSaat, fSaat:fSaat, ic:ic,
             dis:GV.hr.disKaynak(r.kod),
             tutar:ic ? Math.round(oSaat * ic.saat) : null };
  });
  var kisiToplam = kisiSat.reduce(function(a,r){ return a + (r.tutar || 0); }, 0);

  var pMaliyet = '<div class="gc-body">' +
    /* Yetki maskesi REVİZE 04'te değişmedi: finans yetkisi olmayan rol tutar
       görmez, saat bilgisi yetkiden bağımsız kalır. */
    (!canFinans ? GV.notice({ tone:'warn', icon:'i-lock',
      title:'Maliyet tutarları gizlendi',
      text:'Emek maliyeti ve kalem kırılımını görmek için finans yetkisi gerekir. Saat bilgileri yetkiden bağımsız gösterilir.' }) + '<div class="u-mt-4"></div>'
      /* ESKİ UYARI KALDIRILDI ("kırılım türetilmiş değerdir · toplamla birebir

      : GV.notice({ tone:'info', icon:'i-info',
      title:'Maliyet dört kalemden türetilir, elle yazılmaz',
      text:'Personel ve dış kaynak kalemi onaylı zaman kayıtlarının kişi bazlı iç maliyetiyle, ' +
           'satın alma kalemi teslim alınmış satın alma talepleriyle hesaplanır. ' +
           '“Diğer giderler” için bu depoda kaynak koleksiyonu yok — o kalem ölçülmüyor, sıfır olduğu için değil.' }) + '<div class="u-mt-4"></div>') +

    /* REVİZE 04 — dokümanın istediği YEDİ DEĞER burada: gelir · personel ·

       karşılaştırması (onaylı bütçe / kalan / kullanım) Bütçe sekmesinde

            ['Proje geliri (sözleşme bedeli)', para(maliyet.gelir)],

            ['Dış kaynak maliyeti <span class="u-faint">(hizmet sözleşmeli)</span>', para(maliyet.disKaynak)],
            ['Satın alma / gider <span class="u-faint">(teslim alınmış talepler)</span>', para(maliyet.satinAlma)],
            /* `diger` SIFIR ₺ GİBİ BASILMAZ: kaynağı olmayan kalemi tutar
               olarak göstermek, ölçülmemişi ölçülmüş saymak olurdu. */
            ['Diğer giderler', '<span class="u-faint">Kaynak yok — projeye bağlı gider koleksiyonu bu depoda tutulmuyor</span>'],
            ['Toplam maliyet', canFinans
              ? '<span class="u-num u-b">' + F.money(maliyet.toplam) + '</span>'
              : '<span class="cell-mask">••••••</span>'],
            ['Brüt kâr', maliyet.brutKar == null ? OLCULEMIYOR : (canFinans
              ? (maliyet.brutKar < 0
                  ? '<span class="u-num u-danger u-b">−' + F.money(Math.abs(maliyet.brutKar)) + '</span>'
                  : '<span class="u-num u-ok u-b">' + F.money(maliyet.brutKar) + '</span>')
              : '<span class="cell-mask">••••••</span>')],
            /* Kârlılık yüzde biçiminde basılır ama MASKEYE TABİDİR: brüt kâr
               gizliyken oranını göstermek, gizlenen tutarı gelirden geri
               hesaplanabilir kılardı. Ekranın eski yüzdeleri (bütçe kullanımı,
               ilerleme) maskesiz kalmaya devam eder — onlar tutar taşımıyor. */
            ['Kârlılık', maliyet.karlilikYuzde == null ? OLCULEMIYOR : (canFinans
              ? GV.progress(maliyet.karlilikYuzde, { tone:maliyet.karlilikYuzde < 0 ? 'danger' : (maliyet.karlilikYuzde < 20 ? 'warn' : 'ok') })

          ]) +
          (maliyet.maliyetsizPersonel.length
            ? '<p class="u-sm u-faint">' + maliyet.maliyetsizPersonel.length +

              '); saatleri toplama girmedi.</p>' : '')
        /* KAPSAM YOK: tutar yerine açık cümle. Gelir sözleşmede yazılıdır ve

        : GV.dl([['Proje geliri (sözleşme bedeli)', para(maliyet.gelir)]]) +

                '<td>' + GV.progress(pay, { tone:'accent' }) + '</td></tr>';
            }).join('')) +
          '<div class="u-row u-mt-4"><span class="gv-count">Toplam emek maliyeti ' +
            (maliyet.kapsam ? para(emekMaliyet) : OLCULEMIYOR_KISA) +
            ' <span class="u-faint">(personel + dış kaynak kalemi)</span></span></div>'
        : '<p class="u-sm u-faint">Bu projeye girilmiş zaman kaydı olmadığı için kişi bazlı kırılım üretilemiyor.</p>') +
    '</div>' +
    /* UYARI SİLİNMEDİ, KAPSAMI DARALTILDI: modül tablosu PLANLANAN eforu
       çarpar — planlanan efor bir ölçüm değil, tahmindir ve kişi kırılımı gibi
       gerçek kalemlere oturmaz. Belirsizlik burada hâlâ geçerli olduğu için
       uyarı bu bölüme, kendi kapsamına indi. */
    '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>Modül Bazlı Planlanan Efor Maliyeti (tahmin)</h3>' +
      '<p>Planlanan efor × projenin ortalama saat maliyeti — planlama tahminidir, gerçekleşen maliyet kalemi değildir</p></div>' +
      (moduller.length
        ? (saatMaliyet == null
            ? '<p class="u-sm u-faint">Ortalama saat maliyeti ölçülemediği için modül bazlı tahmin üretilemiyor.</p>'
            : tablo('<th>Modül</th><th>Durum</th><th class="num">Planlanan efor</th><th class="num">Tahmini maliyet</th><th>Efor payı</th>',
                moduller.map(function(m){
                  var pay = modulEfor ? Math.round(m.efor / modulEfor * 100) : 0;
                  return '<tr><td><span class="cell-main">' + esc(m.ad) + '</span></td>' +
                    '<td>' + GV.badge(m.durum) + '</td>' +
                    '<td class="num"><span class="u-num">' + F.hours(m.efor) + '</span></td>' +
                    '<td class="num">' + para(Math.round(m.efor * saatMaliyet)) + '</td>' +
                    '<td>' + GV.progress(pay, { tone:'accent' }) + '</td></tr>';
                }).join('')))
        : '<p class="u-sm u-faint">Modül kırılımı olmadığı için modül bazlı tahmin üretilemiyor.</p>') +
      '<div class="u-row u-mt-4"><a class="btn btn-line btn-sm" href="app-butce.html">' +
        ico('i-wallet','ic-sm') + ' Bütçe ve maliyet ekranı</a></div>' +
    '</div></div>';

  /* ===================================================================
     21. RAPORLAR
     =================================================================== */
  var durumDagilim = DB.taskStatuses.map(function(d){
    return { label:d, value:gorevler.filter(function(t){ return t.durum === d; }).length };
  }).filter(function(x){ return x.value; });

  var modulBar = moduller.map(function(m){
    return { label:m.ad.length > 14 ? m.ad.slice(0,13) + '…' : m.ad, value:m.ilerleme,
             tone:m.ilerleme >= 100 ? 'ok' : (m.ilerleme < 35 ? 'danger' : null) };
  });

  var sprintBar = sprintler.map(function(s){
    return { label:s.ad.replace(/^Sprint\s*/, 'S'), value:s.planlanan, value2:s.tamamlanan };
  });

  var hataBar = DB.priorities.map(function(s){
    return { label:s, value:hatalar.filter(function(h){ return h.siddet === s; }).length,
             tone:s === 'Kritik' ? 'danger' : (s === 'Yüksek' ? 'warn' : null) };
  }).filter(function(x){ return x.value; });

  function chartCard(title, sub, html, wide){
    return '<div class="gv-chartcard"' + (wide ? ' style="grid-column:1/-1"' : '') + '><h3>' + esc(title) + '</h3>' +
      '<span class="gv-ch-sub">' + esc(sub) + '</span>' + html + '</div>';
  }

  var pRapor = '<div class="gc-body">' +
    '<div class="kpi-grid">' +
      '<div class="kpi is-accent"><div class="kpi-ico">' + ico('i-gauge','ic-lg') + '</div>' +
        '<div class="kpi-body"><div class="kpi-num">%' + p.ilerleme + '</div><div class="kpi-lbl">Proje ilerlemesi</div>' +
        '<div class="kpi-meta ' + (gecikti ? 'is-down' : 'is-flat') + '">' + esc(F.rel(p.planlananBitis)) + '</div></div></div>' +
      /* Bütçe kullanımı KPI'ı maliyete dayanır: ölçüm yoksa "%0" basmak
         bütçeye hiç dokunulmadığını söylerdi. Süre KPI'ındaki dil izlenir:
         rakam yerine durumu söyleyen küçük metin. */
      '<div class="kpi ' + (butceKullanim == null ? 'is-info' : (butceKullanim > 100 ? 'is-danger' : 'is-ok')) + '">' +
        '<div class="kpi-ico">' + ico('i-wallet','ic-lg') + '</div>' +
        '<div class="kpi-body"><div class="kpi-num">' +
          (butceKullanim == null ? '<small>ölçülemiyor</small>' : '%' + butceKullanim) + '</div>' +
        '<div class="kpi-lbl">Bütçe kullanımı</div>' +
        '<div class="kpi-meta is-flat">' +
          (butceKullanim == null ? 'Onaylı bütçe ' + paraK(p.butce) + ' · maliyet ölçülemiyor'
                                 : paraK(maliyet.toplam) + ' / ' + paraK(p.butce)) + '</div></div></div>' +
      '<div class="kpi is-info"><div class="kpi-ico">' + ico('i-timer','ic-lg') + '</div>' +
        '<div class="kpi-body"><div class="kpi-num">' + (sure.kapsam ? F.num(sure.gerceklesen) + '<small>sa</small>' : '<small>defter yok</small>') + '</div>' +
        '<div class="kpi-lbl">Gerçekleşen süre</div>' +
        '<div class="kpi-meta is-flat">Planlanan ' + F.hours(sure.planlanan) +
          (sure.kapsam ? ' · fat. ' + F.hours(sure.faturalanabilir) : '') + '</div></div></div>' +
      '<div class="kpi ' + (acikHata.length ? 'is-warn' : 'is-ok') + '"><div class="kpi-ico">' + ico('i-bug','ic-lg') + '</div>' +
        '<div class="kpi-body"><div class="kpi-num">' + acikHata.length + '</div><div class="kpi-lbl">Açık hata</div>' +
        '<div class="kpi-meta is-flat">' + testler.reduce(function(a,t){ return a + t.senaryo; }, 0) + ' test senaryosu</div></div></div>' +
    '</div>' +
    '<div class="gv-charts">' +
      (modulBar.length ? chartCard('Modül ilerlemesi', 'Modül bazında tamamlanma yüzdesi',

      (durumDagilim.length ? chartCard('Görev durum dağılımı', gorevler.length + ' kayıtlı görev',
        GV.chart.donut(durumDagilim, { center:String(gorevler.length), centerSub:'görev' }) + GV.chart.legend(durumDagilim)) : '') +
      (sprintBar.length ? chartCard('Sprint planlanan / tamamlanan', 'Saat cinsinden sprint yükü',
        GV.chart.bar(sprintBar, { height:230, label:'Sprint yükü grafiği' })) : '') +
      (hataBar.length ? chartCard('Hata şiddet dağılımı', hatalar.length + ' hata kaydı',
        GV.chart.bar(hataBar, { height:230, label:'Hata şiddet grafiği' })) : '') +
      /* Grafik de sıfır çubuk basmaz: maliyet ölçülemiyorsa o çubuk hiç
         çizilmez, alt başlık nedenini söyler. Sıfır yükseklikte bir "Maliyet"
         çubuğu, maliyetsiz bir proje anlatırdı. */
      (canFinans
        ? chartCard('Bütçe ve gerçekleşen maliyet',
            maliyet.kapsam ? 'KDV hariç, bin ₺' : 'KDV hariç, bin ₺ · gerçekleşen maliyet ölçülemiyor',
            GV.chart.bar([
              { label:'Sözleşme', value:Math.round(p.sozlesmeTutari / 1000) },
              { label:'Bütçe', value:Math.round(p.butce / 1000) }
            ].concat(maliyet.kapsam
              ? [{ label:'Maliyet', value:Math.round(maliyet.toplam / 1000),
                   tone:maliyet.toplam > p.butce ? 'danger' : 'ok' }]

        : chartCard('Bütçe ve gerçekleşen maliyet', 'Finans yetkisi gerekir',

              desc:'Bu grafiği görüntülemek için finans yetkisi gerekir.' }), true)) +

  var pAktivite = '<div class="gc-body">' +
    (acts.length

      : bos('i-activity','Hareket kaydı yok','Bu proje ve görevleri için kayıtlı değişiklik geçmişi bulunmuyor.')) +
  '</div>';

  /* ===================================================================

  var tabs = [
    { key:'genel',      lbl:'Genel Bakış',          ic:'i-info',            html:pGenel },

    { key:'degisiklik', lbl:'Değişiklik Talepleri', ic:'i-git',             html:pDegisiklik, cnt:degisiklik.length },
    { key:'test',       lbl:'Testler',              ic:'i-flask',           html:pTest,       cnt:testler.length },
    { key:'hata',       lbl:'Hatalar',              ic:'i-bug',             html:pHata,       cnt:hatalar.length },
    { key:'teslim',     lbl:'Teslimler',            ic:'i-package',         html:pTeslim,     cnt:teslimler.length },
    { key:'butce',      lbl:'Bütçe',                ic:'i-wallet',          html:pButce },
    { key:'maliyet',    lbl:'Maliyetler',           ic:'i-receipt',         html:pMaliyet },
    { key:'rapor',      lbl:'Raporlar',             ic:'i-chart-pie',       html:pRapor },
    { key:'aktivite',   lbl:'Aktivite Geçmişi',     ic:'i-activity',        html:pAktivite,   cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* ===================================================================
     SAĞ ÖZET PANELİ
     =================================================================== */
  var aside =
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-info') + 'Özet</h2></div>' +
    '<div class="gc-body"><div class="gv-summary">' +
      [['Durum', GV.badge(p.durum)],
       ['Sağlık', GV.badge(p.saglik)],
       ['Öncelik', GV.pri(p.oncelik)],
       ['Sözleşme bedeli (KDV hariç)', para(p.sozlesmeTutari)],
       ['Onaylı bütçe (KDV hariç)', para(p.butce)],
       /* Özet panel dar: ölçüm yokluğunu uzun cümleyle değil kısa etiketle
          söyler; ayrıntısı Maliyetler sekmesinde yazılı (aynı `u-faint` dili). */
       ['Toplam maliyet (KDV hariç)', maliyet.kapsam ? para(maliyet.toplam) : OLCULEMIYOR_KISA],
       ['Brüt kâr (KDV hariç)', maliyet.brutKar == null ? OLCULEMIYOR_KISA : (canFinans
          ? (maliyet.brutKar < 0
              ? '<span class="u-num u-danger u-b">−' + F.money(Math.abs(maliyet.brutKar)) + '</span>'
              : '<span class="u-num u-ok u-b">' + F.money(maliyet.brutKar) + '</span>')
          : '<span class="cell-mask">••••••</span>')],
       ['Kalan bütçe (KDV hariç)', kalanButce == null ? OLCULEMIYOR_KISA : (canFinans
          ? (kalanButce < 0
              ? '<span class="u-num u-danger u-b">−' + F.money(Math.abs(kalanButce)) + '</span>'
              : '<span class="u-num u-ok u-b">' + F.money(kalanButce) + '</span>')
          : '<span class="cell-mask">••••••</span>')],
       ['İlerleme', '<b>%' + p.ilerleme + '</b>'],
       ['Planlanan bitiş', GV.dateCell(p.planlananBitis, { done:bitti })],
       ['Gecikme', gecikti
          ? '<span class="badge is-danger">' + Math.abs(kalanGun) + ' gün</span>'
          : (bitti ? '<span class="badge is-ok">Yok</span>' : '<span class="u-faint">Yok</span>')],
       ['Planlanan / gerçekleşen', F.hours(sure.planlanan) + ' / ' +
          (sure.kapsam ? '<b>' + F.hours(sure.gerceklesen) + '</b>' : '<span class="u-faint">defter yok</span>')]
      ].map(function(x){
        return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + x[0] + '</span><span class="gv-summary-val">' + x[1] + '</span></div>';
      }).join('') +
      '<div class="u-mt-4">' + GV.progress(p.ilerleme) + '</div>' +
    '</div></div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-building') + 'Müşteri</h2></div>' +
    '<div class="gc-body">' +
      (musteri
        ? link('app-musteri-detay.html?id=' + musteri.kod, '<span class="cell-main">' + esc(musteri.unvan) + '</span>') +
          '<div class="cell-sub u-mb-4">' + esc(musteri.sektor || '') + '</div>' +
          '<div class="gv-summary">' +
            '<div class="gv-summary-row"><span class="gv-summary-lbl">Müşteri sorumlusu</span><span class="gv-summary-val">' +
              GV.user(p.musteriSorumlu, { sm:true }) + '</span></div>' +
            '<div class="gv-summary-row"><span class="gv-summary-lbl">Teknik sorumlu</span><span class="gv-summary-val">' +
              GV.user(p.teknikSorumlu, { sm:true }) + '</span></div>' +
          '</div>'
        : '<p class="u-sm u-faint">' + esc(p.musteriAd) + '</p>') +
    '</div></section>' +

    (sozlesme
      ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-file-check') + 'Sözleşme</h2></div>' +
        '<div class="gc-body">' + link('app-sozlesme.html', '<span class="cell-main">' + esc(sozlesme.ad) + '</span>') +
        '<div class="cell-code u-mb-4">' + sozlesme.kod + '</div>' +
        '<div class="gv-summary">' +
          '<div class="gv-summary-row"><span class="gv-summary-lbl">Durum</span><span class="gv-summary-val">' + GV.badge(sozlesme.durum) + '</span></div>' +
          '<div class="gv-summary-row"><span class="gv-summary-lbl">Ödeme planı</span><span class="gv-summary-val">' + esc(sozlesme.odemePlani) + '</span></div>' +
          '<div class="gv-summary-row"><span class="gv-summary-lbl">Bedel (KDV hariç)</span><span class="gv-summary-val">' + para(sozlesme.tutar) + '</span></div>' +
          '<div class="gv-summary-row"><span class="gv-summary-lbl">Genel toplam (KDV dahil)</span><span class="gv-summary-val">' + para(sozlesme.toplam) + '</span></div>' +
          '<div class="gv-summary-row"><span class="gv-summary-lbl">Bitiş</span><span class="gv-summary-val">' + F.date(sozlesme.bitis) + '</span></div>' +
        '</div></div></section>'
      : '') +

    ((p.riskler || []).length || p.gecikmeNedeni
      ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-alert') + 'Riskler</h2></div>' +
        '<div class="gc-body"><div class="u-col">' +
          (p.riskler || []).map(function(r){ return '<span class="u-sm">' + esc(r) + '</span>'; }).join('') +
          (p.gecikmeNedeni ? '<span class="u-sm u-danger">' + esc(p.gecikmeNedeni) + '</span>' : '') +
        '</div></div></section>'
      : '') +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3)) :
      '<p class="u-sm u-faint">Bu projede henüz kayıtlı hareket yok.</p>') + '</div></section>';

  /* ===================================================================
     BAS
     =================================================================== */
  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + x.html + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* ===================================================================
     PROJE KAPANIŞ AKIŞI (REVİZE 07)

     Yeni ekran, yeni menü, yeni bileşen YOK: var olan `GV.confirm` +
     `.gv-checklist` + `GV.result` ile kurulur. Sekiz kontrolün cevabı
     `GV.proje.kapanisKontrol`ten gelir — ekran kendi hesabını yapmaz,
     yoksa checklist ile kapanışın kendisi farklı karar verebilirdi.

     Geçmeyen madde kapanışı ENGELLEMEZ, gerekçe ister; gerekçe aktiviteye
     yazılır. Ölçülemeyen madde (`olculdu:false`) "geçti" sayılmaz ve ayrı
     tonla basılır — kontrol yapılamadıysa güvence de yoktur.
     =================================================================== */
  var btnKapat = document.getElementById('btnKapat');
  if(btnKapat) btnKapat.addEventListener('click', function(){
    var kontrol = GV.proje.kapanisKontrol(p.kod);
    var gecmeyen = kontrol.filter(function(k){ return k.olculdu && !k.gecti; });
    var olcusuz  = kontrol.filter(function(k){ return !k.olculdu; });

    var liste = '<ul class="gv-checklist">' + kontrol.map(function(k){
      var rozet = !k.olculdu ? '<span class="badge is-neutral no-dot">Ölçülemedi</span>'
                : k.gecti    ? '<span class="badge is-ok no-dot">Tamam</span>'
                             : '<span class="badge is-danger no-dot">' + k.sayi + ' kayıt</span>';
      return '<li><span><span class="cell-main">' + esc(k.etiket) + '</span>' +
        '<span class="cell-sub">' + esc(k.detay) + '</span></span>' + rozet + '</li>';
    }).join('') + '</ul>';

    /* Alan markup'ı `.field` — görev detayının bekleme/revizyon modallarıyla
       aynı kalıp; kapanış için yeni bir form dili kurulmaz. */
    var gerekceAlan = gecmeyen.length
      ? '<div class="field"><label for="kapanisGerekce">Kapanış gerekçesi</label>' +
        '<textarea id="kapanisGerekce" rows="3" ' +
        'placeholder="Örn. Fatura tahsilatı sözleşme gereği teslimden 30 gün sonra yapılacak"></textarea>' +
        '<p class="u-sm u-faint">Geçmeyen ' + gecmeyen.length + ' madde var; kapanış engellenmez ama ' +
        'gerekçe proje hareket geçmişine yazılır.</p></div>'
      : '';

    GV.confirm({
      title:'Projeyi Kapat — ' + p.kod,
      tone:gecmeyen.length ? 'warn' : 'ok',
      okLabel:'Projeyi Kapat', cancelLabel:'Vazgeç',
      text:'Kapanış projenin durumunu “Tamamlandı” yapar, gerçekleşen bitiş tarihini ' +
           DB.today + ' olarak yazar ve faz kaydını boşaltır.' +
           (olcusuz.length ? ' ' + olcusuz.length + ' madde ölçülemedi — o maddeler için güvence yoktur.' : ''),
      body:liste + gerekceAlan
    }).then(function(ok){
      if(!ok) return;
      var g = document.getElementById('kapanisGerekce');
      var r = GV.proje.kapat(p.kod, g ? g.value : '');
      if(!r.ok){
        if(r.why === 'gerekçe'){
          GV.toast('Geçmeyen madde var: kapanış gerekçesi yazılmalıdır (' + r.eksik.join(' · ') + ')', 'danger');
        }else if(r.why === 'yetki'){
          GV.toast('Proje kapatma yetkiniz yok.', 'danger');
        }else{
          GV.toast('Proje kapatılamadı: ' + r.why, 'warn');
        }
        return;
      }
      GV.refresh();
      bakimAdimi(r);
    });
  });

  /* ---- REVİZE 08 — kapanışın SON ADIMI: bakım / destek geçişi ----------
     Doküman: "Bu proje için bakım veya destek hizmeti başlatılacak mı?"
     Üç cevap: Hayır · mevcut pakete bağla · yeni paket. Yeni paket YENİ
     EKRAN AÇMAZ, aynı modalda alınır; bağ pakette durur (§9d).
     Aylık saat ve bedel KULLANICIDAN alınır — paket fiyat katalogu bu
     depoda yok ve uydurulmaz (L-13). */
  function bakimAdimi(r){
    var paketler = GV.proje.bakimPaketleri(p.kod).filter(function(x){ return !x.proje; });
    var bugun = DB.today;

    var secim =
      '<div class="field"><label for="bkmKarar">Bu proje için bakım veya destek hizmeti başlayacak mı?</label>' +
      '<select id="bkmKarar">' +
        '<option value="hayir">Hayır — bakım hizmeti başlamayacak</option>' +
        (paketler.length
          ? '<option value="bagla">Mevcut pakete bağla (' + paketler.length + ' uygun paket)</option>' : '') +
        '<option value="yeni">Yeni paket oluştur</option>' +
      '</select></div>' +
      (paketler.length
        ? '<div class="field" id="bkmPaketAlan" hidden><label for="bkmPaket">Müşterinin paketi</label>' +
          '<select id="bkmPaket">' + paketler.map(function(x){
            return '<option value="' + x.kod + '">' + esc(x.ad) + ' · ' + x.kod +
                   ' · ' + F.date(x.baslangic) + ' → ' + F.date(x.bitis) + '</option>'; }).join('') +
          '</select></div>'
        : '') +
      '<div id="bkmYeniAlan" hidden>' +
        '<div class="field"><label for="bkmTip">Paket tipi</label><select id="bkmTip">' +
          DB.supportPackageTypes.map(function(t){ return '<option>' + esc(t) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label for="bkmBas">Başlangıç tarihi</label>' +
          '<input type="date" id="bkmBas" value="' + bugun + '"></div>' +
        '<div class="field"><label for="bkmAy">Süre (ay)</label>' +
          '<input type="number" id="bkmAy" min="1" max="60" value="12"></div>' +
        '<div class="field"><label for="bkmSaat">Aylık destek saati</label>' +
          '<input type="number" id="bkmSaat" min="1" max="200" value="4"></div>' +
        '<div class="field"><label for="bkmTutar">Paket bedeli (KDV hariç)</label>' +
          '<input type="number" id="bkmTutar" min="0" step="1000" placeholder="Örn. 96000"></div>' +
        '<p class="u-sm u-faint">Sözleşme projeden devralınır' +
          (sozlesme ? ' (' + sozlesme.kod + ')' : ' — bu projenin sözleşmesi yok, paket sözleşmesiz açılır') +
          '. Aylık saat ve bedel sorulur çünkü bu depoda paket fiyat katalogu yok.</p>' +
      '</div>';

    var m = GV.modal({
      title:'Proje kapatıldı — ' + p.kod,
      tone:r.gecmeyen ? 'warn' : 'ok',
      icon:'i-check-circle', size:'sm',
      text:p.kod + ' artık “Tamamlandı” durumunda · gerçekleşen bitiş ' + r.tarih +
           (r.gecmeyen ? ' · geçmeyen ' + r.gecmeyen + ' madde gerekçeyle geçildi' : ''),
      body:secim,
      actions:[
        { label:'Proje listesi', cls:'btn-line', onClick:function(){ location.href = 'app-proje.html'; } },
        { label:'Tamamla', cls:'btn-acc', onClick:function(close){
            var karar = document.getElementById('bkmKarar').value;
            if(karar === 'hayir'){ GV.toast('Proje kapatıldı · bakım hizmeti başlatılmadı', 'ok'); return; }
            if(karar === 'bagla'){
              var s2 = GV.proje.bakimBagla(p.kod, document.getElementById('bkmPaket').value);
              if(!s2.ok){ GV.toast('Paket bağlanamadı: ' + s2.why, 'danger'); return false; }
              GV.refresh();
              GV.toast(s2.paket + ' paketi ' + p.kod + ' projesine bağlandı', 'ok');
              return;
            }
            var s3 = GV.proje.bakimAc(p.kod, {
              baslangic:document.getElementById('bkmBas').value,
              tip:document.getElementById('bkmTip').value,
              ay:document.getElementById('bkmAy').value,
              aylikSaat:document.getElementById('bkmSaat').value,
              tutar:document.getElementById('bkmTutar').value
            });
            if(!s3.ok){
              GV.toast(s3.why === 'zorunlu' ? ('Eksik alan: ' + s3.eksik.join(' · '))
                                            : ('Paket açılamadı: ' + s3.why), 'danger');
              return false;
            }
            close();
            GV.refresh();
            GV.result({ title:'Bakım paketi açıldı', tone:'ok',
              text:s3.paket + ' · ' + p.musteriAd + ' · bitiş ' + F.date(s3.bitis) +
                   (s3.sozlesme ? ' · sözleşme ' + s3.sozlesme : ' · sözleşmesiz'),
              actions:[{ label:'Paketi aç', cls:'btn-acc',
                         onClick:function(){ location.href = 'app-destek-paket.html?t=tumu&q=' + s3.paket; } },
                       { label:'Tamam', cls:'btn-line' }] });
            return false;
          } }
      ]
    });

    /* Seçime göre alan gösterimi — gereksiz alan hiç görünmez. */
    var sel = document.getElementById('bkmKarar');
    var alanBagla = document.getElementById('bkmPaketAlan');
    var alanYeni  = document.getElementById('bkmYeniAlan');
    if(sel) sel.addEventListener('change', function(){
      if(alanBagla) alanBagla.hidden = sel.value !== 'bagla';
      if(alanYeni)  alanYeni.hidden  = sel.value !== 'yeni';
    });
    return m;
  }

  /* Dosyalar sekmesindeki yükleme alanı — ortak bileşen */
  GV.upload({
    mount:'#prjUpload',
    hint:'PDF, DOCX, XLSX, PNG, JPG, ZIP · en fazla 20 MB',
    onChange:function(files){
      if(files.length) GV.toast(files.length + ' dosya ' + p.kod + ' projesine eklenmek üzere hazır', 'ok', 2200);
    }
  });
});
</script>
</body>
</html>
