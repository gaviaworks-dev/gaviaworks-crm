<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Proje Kaydı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="proje" data-screen="proje">
<div id="rec"></div>

<!-- Okunan koleksiyonların TAMAMININ dosyası yüklenir (ders L-12):
     org.js  → DB.employees, DB.emp, DB.empName, DB.today
     crm.js  → DB.customers, DB.services
     work.js → DB.projects, DB.projectModules, DB.tasks, DB.deliveries,
               DB.milestones, DB.activities, DB.priorities
     misc.js → DB.contracts -->
<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');

  /* =================================================================
     MOD — adreste id varsa düzenleme, yoksa yeni kayıt
     ================================================================= */
  var qs      = new URLSearchParams(location.search);
  var id      = qs.get('id');
  var kayit   = id ? DB.projects.filter(function(x){ return x.kod === id; })[0] : null;
  var duzenle = !!kayit;

  /* Adreste id var ama kayıt yok — uydurma yok, boş forma da düşülmez. */
  if(id && !kayit){
    GV.shell.crumb('Kayıt bulunamadı');
    GV.pageHead({
      eyebrow:'Teslimat', title:'Kayıt bulunamadı',
      sub:'Düzenlenmek istenen proje kaydı sistemde yok.',
      actions:[{ label:'Projelere dön', cls:'btn-line', href:'app-proje.html' }]
    });
    mount.innerHTML = '<section class="gv-card">' + GV.empty({
      icon:'i-search', title:'Proje bulunamadı',
      desc:'“' + esc(id) + '” numaralı proje bulunamadı. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-proje.html">Projelere dön</a>' }) + '</section>';
    return;
  }

  GV.shell.crumb(duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Proje');
  document.title = (duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Proje') + ' — GaviaWorks CRM';

  /* =================================================================
     YETKİ KAPISI — form kurulmadan önce (PROMPT.md §5 · ders L-07)
     ================================================================= */
  var can = duzenle ? GV.perm.can('duzenle') : GV.perm.can('ekle');
  if(!can){
    GV.pageHead({
      eyebrow:'Teslimat',
      title: duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Proje',
      sub:'Bu işlem için yetkiniz yok.',
      actions:[{ label:'Projelere dön', cls:'btn-line', href:'app-proje.html' }]
    });
    mount.innerHTML = '<section class="gv-card">' + GV.errorState({
      title:'Bu işlem için yetkiniz yok',
      desc:(duzenle ? 'Proje düzenleme' : 'Proje ekleme') +
           ' yetkisi rolünüzde (' + GV.session.rolAd + ') tanımlı değil. ' +
           'Projeleri görüntüleyebilir ama değiştiremezsiniz.' }) + '</section>';
    /* GV.errorState kendi “Tekrar dene” butonunu basar; burada yeniden denenecek bir
       yükleme yok — ölü kontrol bırakmamak için gerçek aksiyonla değiştirilir. */
    var acts403 = mount.querySelector('.gv-state-acts');
    if(acts403){
      acts403.innerHTML = '<a class="btn btn-line" href="app-proje.html">Projelere dön</a>' +
        (duzenle ? ' <a class="btn btn-acc" href="app-proje-detay.html?id=' + kayit.kod + '">Proje kartını aç</a>' : '');
    }
    return;                                   /* GV.form HİÇ kurulmaz */
  }

  /* =================================================================
     BAĞLAR — hepsi veride YAZILI tekil alandan okunur (ders L-13)
       proje.musteri      → DB.customers
       sozlesme.proje     → DB.contracts      (bağ SÖZLEŞMEDE yazılı, projede değil)
       modul.proje        → DB.projectModules
       gorev.proje        → DB.tasks
       teslim.proje       → DB.deliveries
       milestone.proje    → DB.milestones
       activity.kayit     → PRJ-xxx
     ================================================================= */
  var musteri  = duzenle && kayit.musteri
    ? DB.customers.filter(function(c){ return c.kod === kayit.musteri; })[0] : null;
  var sozlesme = duzenle
    ? DB.contracts.filter(function(s){ return s.proje === kayit.kod; })[0] || null : null;
  var moduller = duzenle
    ? DB.projectModules.filter(function(m){ return m.proje === kayit.kod; }) : [];
  var gorevler = duzenle
    ? DB.tasks.filter(function(t){ return t.proje === kayit.kod; }) : [];
  var teslimler = duzenle
    ? DB.deliveries.filter(function(d){ return d.proje === kayit.kod; }) : [];
  var taksitler = duzenle
    ? DB.milestones.filter(function(m){ return m.proje === kayit.kod; }) : [];
  var acts = duzenle
    ? DB.activities.filter(function(x){ return x.kayit === kayit.kod; })
        .sort(function(a,b){ return String(b.tarih).localeCompare(String(a.tarih)); })
    : [];

  /* PROMPT.md §11 “Kritik işler” ve “Müşteri onayları” PROJE KAYDINDA alan olarak
     YOKTUR; ikisi de bağlı koleksiyonlardan türetilir (app-proje-detay.html ile aynı
     ölçüt). Bu yüzden forma alan olarak basılmaz, salt-okunur bağlam olarak gösterilir. */
  var kritikIsler = gorevler.filter(function(t){
    return ['Kritik','Yüksek'].indexOf(t.oncelik) !== -1 &&
           ['Tamamlandı','İptal edildi','Arşivlendi'].indexOf(t.durum) === -1;
  });
  var musteriOnaylari = teslimler.filter(function(d){ return !!d.musteriOnay; });

  /* Adres parametresiyle ön doldurma: ?musteri=MUS-xxx */
  var qsMus = qs.get('musteri');
  var onMus = qsMus ? DB.customers.filter(function(c){ return c.kod === qsMus; })[0] : null;

  /* PROJE BAŞLATMA — ?sozlesme=SZL-xxx (PROMPT.md §26-H "Proje başlatma").
     Sözleşme detayındaki "Projeyi başlat" bu parametreyi verir; form sözleşmeyi
     okuyup müşteriyi, adı, bedeli ve tarihleri ÖN DOLDURUR. Değerler kopyalanmaz,
     SÖZLEŞMEDEN OKUNUR ve kullanıcı isterse değiştirir; kaydederken bağ yine
     sözleşme kaydının `proje` alanına yazılır (§9d yön kuralı, projede ayna yok).
     Zaten projesi olan sözleşme ikinci kez proje doğuramaz. */
  var qsSzl = duzenle ? null : qs.get('sozlesme');
  var kaynakSozlesme = qsSzl ? DB.contracts.filter(function(s){ return s.kod === qsSzl; })[0] || null : null;
  var sozlesmeDolu = kaynakSozlesme && kaynakSozlesme.proje
    ? DB.proj(kaynakSozlesme.proje) : null;
  var onSzlMus = kaynakSozlesme && kaynakSozlesme.musteri
    ? DB.customers.filter(function(c){ return c.kod === kaynakSozlesme.musteri; })[0] : null;
  /* Proje adı sözleşme adından türetilir: "… Sözleşmesi" son eki atılır. */
  function projeAdiTuret(s){
    return String(s.ad || '').replace(/\s*Sözleşmesi\s*$/i, '').trim() || s.ad;
  }

  /* =================================================================
     SEÇENEK KÜMELERİ — hepsi veriden; sözlük yoksa mevcut kayıtlardan türetilir
     ================================================================= */
  /* VB-22 — üç küme artık veri katmanındaki sözlükten gelir; ekran kendi
     listesini yazmıyor ve veride kullanılmayan değer de forma giriyor. */
  var DURUMLAR = DB.projectStatuses;
  var SAGLIK   = DB.healthLevels;
  var FAZLAR   = DB.projectPhases.slice();
  if(duzenle && kayit.faz && FAZLAR.indexOf(kayit.faz) === -1) FAZLAR.push(kayit.faz);

  /* REVİZE 11 — PROJE KAYNAĞI kümesi ve SÖZLEŞME SEÇİCİ.
     Kaynak formun İLK alanıdır çünkü diğer alanların zorunluluğunu o belirler:
     `Müşteri Sözleşmesi` seçilirse sözleşme alanı görünür ve zorunlu olur,
     diğer dört değerde alan hiç basılmaz (GV.form `showIf` sözleşmesi).
     Seçilebilir sözleşmeler: projesi HENÜZ OLMAYANLAR — bir sözleşme ikinci
     bir proje doğuramaz (form zaten `?sozlesme=` yolunda bunu uyguluyordu,
     seçici de aynı kuralı uygular). */
  var KAYNAKLAR = DB.projectSources;
  var SOZLESMELER = DB.contracts
    .filter(function(s){ return !s.proje; })
    .map(function(s){
      var m = DB.customers.filter(function(c){ return c.kod === s.musteri; })[0];
      return { value:s.kod, label:s.kod + ' · ' + s.ad + (m ? ' · ' + m.unvan : '') };
    });
  /* Düzenlemede bağlı sözleşme (varsa) salt okunur gösterilir: bağ SÖZLEŞME
     kaydında yaşar (§9d) ve iki ekrandan yazılırsa ikinci mutasyon yolu doğar. */
  var bagliSozlesme = duzenle
    ? DB.contracts.filter(function(s){ return s.proje === kayit.kod; })[0] || null : null;

  /* Proje türü hizmet kataloğundan gelir — 8 projenin 8'i katalogdaki bir değeri taşıyor. */
  var TURLER  = DB.services.slice();
  var turDisi = duzenle && kayit.tur && TURLER.indexOf(kayit.tur) === -1;

  var MUSTERILER = DB.customers
    .filter(function(c){ return c.aktif !== false || (duzenle && c.kod === kayit.musteri); })
    .map(function(c){
      var say = DB.projects.filter(function(p){
        return p.musteri === c.kod && (!duzenle || p.kod !== kayit.kod); }).length;
      return { value:c.kod, label:c.unvan + ' · ' + c.kod + (say ? ' · ' + say + ' projesi var' : '') };
    });

  function calisanSecenek(filtre){
    return DB.employees
      .filter(function(e){ return filtre ? filtre(e) : true; })
      .filter(function(e){ return e.aktif !== false; })
      .map(function(e){ return { value:e.kod, label:e.ad + ' · ' + e.pozisyon }; });
  }
  /* Proje yöneticisi kümesi rol matrisinden değil, çalışan kartındaki `roller`
     dizisinden okunur — app-proje.html'in pm filtresiyle aynı ölçüt. */
  function pmAday(e){ return e.roller.indexOf('pm') !== -1 || e.rol === 'sahip'; }
  var PMLER = calisanSecenek(pmAday);
  /* Düzenlenen kaydın pm'i kümede yoksa kaybolmasın diye eklenir. */
  if(duzenle && kayit.pm && !PMLER.some(function(o){ return o.value === kayit.pm; })){
    var pmEmp = DB.emp(kayit.pm);
    PMLER.push({ value:kayit.pm, label:(pmEmp ? pmEmp.ad : kayit.pm) + ' · kayıtta yazılı (pm rolü yok)' });
  }
  var CALISANLAR = calisanSecenek(null);
  var EKIP_ADAY  = DB.employees.filter(function(e){
    return e.aktif !== false || (duzenle && (kayit.ekip || []).indexOf(e.kod) !== -1); });

  /* =================================================================
     FORM KAYDI — koleksiyondaki ham değerler forma uygun biçime çevrilir
       Dizi alanları (ekip dışında) satır satır metne açılır; kaydederken
       yeniden diziye çevrilir. GV.form'da dizi/çip/çoklu seçim tipi YOK.
       Ekip, üye başına bir onay kutusu alanı olarak basılır.
     ================================================================= */
  var LISTE_ALAN = ['teknoloji','ucuncuTaraf','riskler'];
  var SAYI_ALAN  = ['ilerleme','tahminiSure'];
  var PARA_ALAN  = ['sozlesmeTutari','butce'];
  var EKIP_ON    = 'ekip_';

  function metin(arr){ return (arr || []).join('\n'); }
  function satirlar(t){
    return String(t == null ? '' : t).split('\n').map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length > 0; });
  }
  function sayi(v){ var n = Number(v); return isFinite(n) ? n : 0; }

  var formRec = {};
  if(duzenle){
    Object.keys(kayit).forEach(function(k){ formRec[k] = kayit[k]; });
    LISTE_ALAN.forEach(function(k){ formRec[k] = metin(kayit[k]); });
    formRec.sozlesme = bagliSozlesme ? bagliSozlesme.kod : '';
    formRec.gercekBitis = kayit.gercekBitis || '';
    formRec.gecikmeNedeni = kayit.gecikmeNedeni || '';
    formRec.arsiv = kayit.arsiv === true;
    if(turDisi) formRec.tur = '';
    EKIP_ADAY.forEach(function(e){
      formRec[EKIP_ON + e.kod] = (kayit.ekip || []).indexOf(e.kod) !== -1; });
  }else{
    /* Ön dolgu kaynağı sırası: sözleşme > ?musteri parametresi > boş */
    var ks = (kaynakSozlesme && !sozlesmeDolu) ? kaynakSozlesme : null;
    formRec = {
      ad:(ks ? projeAdiTuret(ks) : ''),
      /* Kaynak sözleşmeden geldiyse kaynak alanı da ön seçilidir — kullanıcı
         aynı bilgiyi ikinci kez girmez (talimat: fazla tıklamaya zorlama). */
      kaynak:(ks ? 'Müşteri Sözleşmesi' : ''),
      sozlesme:(ks ? ks.kod : ''),
      musteri:(ks && onSzlMus ? onSzlMus.kod : (onMus ? onMus.kod : '')),
      tur:'', faz:FAZLAR[0] || '',
      oncelik:'Orta', pm:'', teknikSorumlu:'', musteriSorumlu:'',
      baslangic:(ks && ks.baslangic ? ks.baslangic : DB.today),
      planlananBitis:(ks && ks.bitis ? ks.bitis : ''), gercekBitis:'',
      durum:'Plan', ilerleme:0, saglik:'İyi',
      tahminiSure:'',
      /* NET bedel — sözleşmenin `tutar` alanı KDV hariçtir (components.md §9b) */
      sozlesmeTutari:(ks ? ks.tutar : ''), butce:'',
      repo:'', canli:'', test:'', tasarim:'', sunucu:'',
      teknoloji:'', ucuncuTaraf:'', riskler:'', gecikmeNedeni:'',
      arsiv:false
    };
    EKIP_ADAY.forEach(function(e){ formRec[EKIP_ON + e.kod] = false; });
  }

  /* =================================================================
     ÖLÇÜMLER — etiket ve ipuçlarında kullanılan sayılar varsayılmaz, sayılır
     ================================================================= */
  /* Sözleşme bedeli ekseni: components.md §9b → DB.projects[].sozlesmeTutari = NET.
     Ölçüm burada da tekrarlanır ki ipucundaki sayı gerçek olsun. */
  var eslesen = 0, sozlesmeli = 0;
  DB.projects.forEach(function(p){
    var s = DB.contracts.filter(function(c){ return c.proje === p.kod; })[0];
    if(!s) return;
    sozlesmeli++;
    if(s.tutar === p.sozlesmeTutari) eslesen++;
  });

  /* Modül ilerlemesi ↔ proje ilerlemesi: veride yazılı bir türetme kuralı YOK.
     İki ölçü de gösterilir, aralarında kural varmış gibi doğrulama yapılmaz. */
  var modOrt = moduller.length
    ? Math.round(moduller.reduce(function(s,m){ return s + m.ilerleme; }, 0) / moduller.length) : null;
  var modEforToplam = moduller.reduce(function(s,m){ return s + (m.efor || 0); }, 0);
  var modAgirlikli = modEforToplam
    ? Math.round(moduller.reduce(function(s,m){ return s + m.ilerleme * (m.efor || 0); }, 0) / modEforToplam)
    : null;

  /* Gecikmiş projelerde gecikme nedeni yazılı mı — kural buradan ölçülür. */
  var gecikenler = DB.projects.filter(GV.proje.geciken);
  var gecikenNedenli = gecikenler.filter(function(p){ return !!p.gecikmeNedeni; }).length;

  /* =================================================================
     BAĞLAM BLOKLARI
     ================================================================= */
  function sub(t){ return '<span class="cell-sub">' + esc(t) + '</span>'; }
  function kart(baslik, ikon, govde, aksiyon){
    return '<section class="gv-card">' +
      '<div class="gc-head"><h2 class="gc-title">' + ico(ikon) + esc(baslik) + '</h2>' +
      (aksiyon ? '<div class="gc-head-acts">' + aksiyon + '</div>' : '') + '</div>' +
      '<div class="gc-body">' + govde + '</div></section>';
  }

  var ust = '';

  if(duzenle){
    /* ---- Katalog dışı proje türü uyarısı ---- */
    if(turDisi){
      ust += '<section class="gv-card"><div class="gc-body">' + GV.notice({
        tone:'danger', title:'Kayıttaki proje türü hizmet kataloğunda yok',
        text:'Bu projede “' + kayit.tur + '” türü yazılı ama hizmet kataloğunda (' + TURLER.length +
             ' hizmet) böyle bir değer yok. Tür alanı boş açıldı; kaydetmeden önce katalogdan ' +
             'geçerli bir tür seçmelisiniz.' }) + '</div></section>';
    }

    /* ---- İlişkili kayıt uyarısı — bağ SÖZLEŞMEDE yazılı (contract.proje) ---- */
    var bagAksiyon = [];
    if(sozlesme) bagAksiyon.push({ label:'Sözleşmeyi aç', href:'app-sozlesme-detay.html?id=' + sozlesme.kod, cls:'btn-line' });
    if(musteri)  bagAksiyon.push({ label:'Müşteri kartını aç', href:'app-musteri-detay.html?id=' + musteri.kod, cls:'btn-line' });

    var bagliSayi = moduller.length + gorevler.length + teslimler.length + taksitler.length;
    ust += '<section class="gv-card"><div class="gc-body">' +
      GV.notice({
        tone:bagliSayi ? 'warn' : 'info',
        title:bagliSayi ? 'Bu projeye bağlı ' + bagliSayi + ' kayıt var' : 'Bu projeye bağlı alt kayıt yok',
        text:(bagliSayi
              ? moduller.length + ' modül · ' + gorevler.length + ' görev · ' + taksitler.length +
                ' taksit · ' + teslimler.length + ' teslim bu projenin kodunu taşıyor. '
              : 'Modül, görev, taksit ve teslim koleksiyonlarında bu proje kodunu taşıyan kayıt yok. ') +
             (sozlesme
               ? sozlesme.kod + ' sözleşmesi bu projeye bağlı (bağ sözleşme kaydının “proje” alanında yazılı, ' +
                 'projede ayna alan açılmaz). Sözleşme bedeli ' + F.money(sozlesme.tutar, '₺') + ' (KDV hariç), ' +
                 'genel toplam ' + F.money(sozlesme.toplam, '₺') + ' (KDV dahil). Projedeki sözleşme bedelini ' +
                 'değiştirirseniz sözleşme kaydı otomatik güncellenmez.'
               : 'Bu projeye bağlı bir sözleşme kaydı yok (“proje” alanı ' + kayit.kod +
                 ' olan sözleşme bulunmuyor); sözleşme bedeli alanı bir sözleşmeyle karşılaştırılamaz.') +
             (bagliSayi ? ' Projeyi arşive alırsanız bu kayıtlar silinmez, listelerde bağlı kaldıkları proje ' +
                          'arşivli görünür.' : ''),
        actions:bagAksiyon }) +
      '</div></section>';

    /* ---- Bağlam kartı ---- */
    var son = acts[0];
    ust += kart('Kayıt Özeti', 'i-info', GV.dl([
        ['Proje numarası', '<span class="cell-code">' + esc(kayit.kod) + '</span>'],
        ['Proje adı', esc(kayit.ad)],
        ['Müşteri', musteri
          ? '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + esc(musteri.unvan) + '</a>' +
            sub(musteri.sektor + ' · risk: ' + musteri.risk)
          : (kayit.musteri ? '<span class="u-num">' + esc(kayit.musteri) + '</span>' + sub('Müşteri kaydı bulunamadı') : null)],
        ['Proje durumu', GV.badge(kayit.durum) +
          (kayit.arsiv === true ? ' <span class="tag">Arşiv</span>' : '') +
          (kayit.arsiv === true ? ' <span class="tag">Arşiv</span>' : '')],
        ['Sağlık durumu', GV.badge(kayit.saglik)],
        ['Öncelik', GV.pri(kayit.oncelik)],
        ['Proje yöneticisi', GV.user(kayit.pm, { sm:true })],
        ['İlerleme', GV.progress(kayit.ilerleme)],
        ['Planlanan bitiş', GV.dateCell(kayit.planlananBitis, { done:GV.proje.bitti(kayit) }) +
          sub(F.rel(kayit.planlananBitis))],
        ['Son güncelleme', F.date(kayit.sonGuncelleme)],
        ['Son değiştiren', son ? esc(DB.empName(son.kisi)) + sub(F.dt(son.tarih) + ' · ' + son.metin) : null]
      ]),
      '<a class="btn btn-line btn-sm" href="app-proje-detay.html?id=' + kayit.kod + '">' +
        ico('i-external','ic-sm') + ' Proje kartını aç</a>');

    /* ---- PROMPT.md §11'in iki TÜRETİLMİŞ alanı: kritik işler + müşteri onayları ---- */
    ust += kart('Kritik İşler ve Müşteri Onayları', 'i-clipboard-check',
      GV.notice({ tone:'neutral', icon:'i-lock',
        title:'Bu iki alan proje kaydında tutulmaz, formda düzenlenmez',
        text:'“Kritik işler” ve “müşteri onayları” proje kaydında ayrı bir alanda tutulmaz. ' +
             'Kritik işler görev kayıtlarındaki ' +
             'kritik/yüksek öncelikli açık görevlerden, müşteri onayları teslim kayıtlarının ' +
             '“müşteri onayı” alanından türetilir. Buradan görüntülenir, ilgili ekranlarından değiştirilir.',
        actions:[

  /* =================================================================

        /* REVİZE 04 — "Gerçekleşen maliyet" alanı KALDIRILDI. Elle girilen tek
           bir rakamdı ve hangi kalemden oluştuğu hiçbir yerde yazılı değildi.
           Artık `GV.proje.maliyet` dört kalemi (personel · dış kaynak · satın
           alma · diğer) ayrı ayrı türetiyor; türetilebilen değer forma
           girilmez (L-08). Onaylı bütçe bir PLAN değeridir, kalır. */
        { key:'butce', label:'Onaylı proje bütçesi (KDV hariç)', type:'money', required:true, min:0, cols:4,
          hint:'Projenin iç maliyet bütçesi — sözleşme bedeli değildir. Gerçekleşen maliyet ' +
               'onaylı zaman kayıtları ve projeye bağlı satın almalardan otomatik hesaplanır.' }
      ]});
  }

  sections.push(
    { title:'Teknik envanter',
      desc:'Projenin bağlantı ve altyapı alanları. ' +
           'Bağlantılar şema öneki olmadan (örn. github.com/…) tutulduğu için metin alanı ' +
           'olarak açılır; bilinmeyen alanlara tire (—) yazılır.',
      fields:[
        { key:'repo', label:'Kaynak kod deposu', type:'text', cols:6,
          placeholder:'github.com/gaviaworks/proje-adi' },
        { key:'canli', label:'Canlı ortam bağlantısı', type:'text', cols:6,
          placeholder:'panel.musteri.com' },
        { key:'test', label:'Test ortamı bağlantısı', type:'text', cols:6,
          placeholder:'test.musteri.com' },
        { key:'tasarim', label:'Tasarım dosyası bağlantısı', type:'text', cols:6,
          placeholder:'figma.com/proje-adi' },
        { key:'sunucu', label:'Sunucu ve barındırma', type:'text', required:true, cols:12,
          placeholder:'Örn. Gavia yönetimli VPS · Müşteri on-premise · AWS eu-central-1' },
        { key:'teknoloji', label:'Kullanılan teknolojiler', type:'textarea', rows:5, required:true, cols:6,
          placeholder:'Node.js\nReact\nPostgreSQL',
          hint:'Her satıra bir teknoloji yazın. Boş satırlar kaydedilmez; liste ekranının aramasında bu alan taranır.' },
        { key:'ucuncuTaraf', label:'Üçüncü taraf servisler', type:'textarea', rows:5, cols:6,
          placeholder:'iyzico\nGoogle Maps\ne-Fatura',
          hint:'Her satıra bir servis yazın. Servis kullanılmıyorsa boş bırakın.' }
      ]},

    { title:'Risk ve gecikme',
      desc:'Projenin açık uçları. Planlanan bitişi geçmiş ve teslim edilmemiş projede gecikme nedeni zorunludur.',
      fields:[
        { key:'riskler', label:'Proje riskleri', type:'textarea', rows:5, cols:6,
          placeholder:'Kapsam büyümesi\nEntegrasyon dokümantasyonu yetersiz',
          hint:'Her satıra bir risk yazın.' },
        { key:'gecikmeNedeni', label:'Gecikme nedeni', type:'textarea', rows:5, cols:6,
          placeholder:'Örn. Müşteri içerik onayı 9 gün gecikti',
          hint:'Ölçüm: gecikmiş ' + gecikenler.length + ' projenin ' + gecikenNedenli + ' tanesinde bu alan dolu.',
          validate:function(v, d){
            var gecikti = GV.proje.geciken(d);
            return (gecikti && !String(v || '').trim())
              ? 'Planlanan bitişi geçmiş ve teslim edilmemiş projede gecikme nedeni yazılmalıdır.' : '';
          } }
      ]},

    /* REVİZE 05 / VB-20 — `aktif` anahtarı KALDIRILDI. Proje kaydında iki
       arşiv ekseni vardı (`aktif:false` ve `arsiv:true`); 14 kaydın 14'ünde
       `aktif:true` yazıyordu, yani eksen hiç kullanılmıyordu ama iki alanın
       çelişmesi mümkündü ve hangisinin kazandığı yalnız liste bileşeninde
       yazılıydı. Arşiv tek eksende: `arsiv`. */
    { title:'Kayıt durumu',
      desc:'Kaydın listelerde görünüp görünmeyeceği. Arşiv tek eksendir; ' +
           'arşivlenen proje yalnız arşiv görünümünde listelenir.',
      fields:[
        { key:'arsiv', label:'Arşiv', type:'switch', cols:6,
          onLabel:'Proje arşivlendi — yalnız arşiv görünümünde listelenir',
          hint:'Veride 14 projenin 7’sinde bu bayrak var; hepsi durumu “Tamamlandı” olan kayıtlar.',
          validate:function(v, d){
            return (v && GV.proje.kapaliDurumlar.indexOf(d.durum) === -1)
              ? 'Kapanmamış proje arşivlenemez — önce durumu “Tamamlandı” ya da “İptal Edildi” yapın.' : '';
          } }
      ]}
  );

  /* Ekip grubu mantıksal olarak TEK alandır; sayım öyle yapılır. */
  var alanSayisi = sections.reduce(function(n, s){
    return n + (s.title === 'Proje ekibi' ? 1 : (s.fields || []).length); }, 0);
  var zorunlu = [];
  sections.forEach(function(s){ (s.fields || []).forEach(function(f){ if(f.required) zorunlu.push(f.label); }); });

  var form = GV.form({
    mount:'#formMount', id:'proje', record:formRec, sections:sections
  });

  /* =================================================================
     REVİZE 11 — SÖZLEŞME SEÇİCİNİN DAVRANIŞI
     Üç durum: (a) adresten sözleşme geldi → seçili ve KİLİTLİ, (b) düzenleme →
     salt okunur (bağ sözleşme kaydında yaşar), (c) yeni kayıt → seçilebilir ve
     seçim ön dolgu yapar. Ön dolgu YALNIZ BOŞ alanı doldurur: kullanıcının
     yazdığı bir değeri sözleşme ezmez.
     ================================================================= */
  /* DURUM SALT OKUNUR — mevcut değeri okunur, kullanıcı değiştiremez.
     `read()` `disabled` alanın değerini de okur (sözleşme seçicisinde olduğu gibi),
     bu yüzden kaydederken durum kaybolmaz; yalnız yazma yolu kapanır. */
  var durSelect = form.el.querySelector('[name="durum"]');
  if(durSelect) durSelect.disabled = true;

  var szlSelect = form.el.querySelector('[name="sozlesme"]');
  if(szlSelect && (duzenle || (kaynakSozlesme && !sozlesmeDolu))){
    szlSelect.disabled = true;                     /* değeri okunur, değiştirilemez */
    var kynSelect = form.el.querySelector('[name="kaynak"]');
    if(kynSelect && kaynakSozlesme && !sozlesmeDolu && !duzenle) kynSelect.disabled = true;
  }
  /* Seçilen sözleşmenin özeti — sözleşme alanının altında, YENİ KART AÇILMADAN. */
  var szlBilgi = document.createElement('div');
  szlBilgi.className = 'u-mt-4';
  var szlWrap = form.el.querySelector('[data-field="sozlesme"]');
  if(szlWrap) szlWrap.appendChild(szlBilgi);

  if(szlSelect && !duzenle && !szlSelect.disabled){
    szlSelect.addEventListener('change', function(){
      var s = DB.contracts.filter(function(x){ return x.kod === szlSelect.value; })[0];
      if(!s) return;
      var mus = DB.customers.filter(function(c){ return c.kod === s.musteri; })[0];
      function doldur(ad, deger){
        var el = form.el.querySelector('[name="' + ad + '"]');
        if(el && !String(el.value || '').trim() && deger != null && deger !== '') el.value = deger;
      }
      doldur('ad', projeAdiTuret(s));
      doldur('musteri', s.musteri);
      doldur('baslangic', s.baslangic);
      doldur('planlananBitis', s.bitis);
      doldur('sozlesmeTutari', s.tutar);           /* NET — sözleşme `tutar`ı KDV hariç */
      /* Proje TÜRÜ ön doldurulmaz ve bu bilinçli bir boşluktur (V-56):
         sözleşme kaydında hizmet alanı yok, ad alanı da hizmet kataloğunun
         hiçbir değerini birebir taşımıyor (7 sözleşmenin 7'sinde 0 eşleşme).
         Anahtar kelimeden tahmin etmek zorunlu bir alana YANLIŞ değer yazardı
         ("Mobil Operasyon ERP" → Mobil Uygulama? CRM / ERP?) — L-13. */
      szlBilgi.innerHTML = GV.notice({ tone:'ok', icon:'i-file', title:s.kod + ' sözleşmesinden ön dolduruldu',
        text:(mus ? mus.unvan + ' · ' : '') + esc(s.ad) + ' · ' + F.money(s.tutar, '₺') + ' (KDV hariç) · ' +
             F.date(s.baslangic) + ' – ' + F.date(s.bitis) + '. Ödeme planı: ' + esc(s.odemePlani || '—') +
             '. Taksitler bu formda açılmaz; proje doğduktan sonra ödeme planı ekranından bağlanır. ' +
             'Boş alanlar dolduruldu, sizin yazdıklarınıza dokunulmadı.' });
      form.sync();
    });
  }

  /* Proje adı müşteri seçiminden TÜRETİLMEZ: veride 8 projenin hiçbirinin adı müşteri
     unvanıyla başlamıyor (“Vitalis Hasta Randevu Mobil Uygulaması” ≠ “Vitalis Sağlık Grubu”).
     Otomatik doldurma yarım bir ad bırakacağı için kurulmadı; müşteri unvanı yalnız
     kaydederken `musteriAd` alanına kopyalanır. */

  /* =================================================================
     KAYDET
     ================================================================= */
  var ALAN_ADI = {
    ad:'Proje adı', kaynak:'Proje kaynağı',
    musteri:'Müşteri', musteriAd:'Müşteri unvanı', tur:'Proje türü', faz:'Faz',
    oncelik:'Öncelik', pm:'Proje yöneticisi', teknikSorumlu:'Teknik sorumlu',
    musteriSorumlu:'Müşteri sorumlusu', ekip:'Proje ekibi',
    baslangic:'Başlangıç tarihi', planlananBitis:'Planlanan bitiş', gercekBitis:'Gerçekleşen bitiş',
    durum:'Proje durumu', ilerleme:'İlerleme oranı', saglik:'Proje sağlık durumu',
    tahminiSure:'Planlanan süre',
    sozlesmeTutari:'Sözleşme bedeli', butce:'Onaylı proje bütçesi',
    repo:'Kaynak kod deposu', canli:'Canlı ortam bağlantısı', test:'Test ortamı bağlantısı',
    tasarim:'Tasarım dosyası bağlantısı', sunucu:'Sunucu ve barındırma',
    teknoloji:'Kullanılan teknolojiler', ucuncuTaraf:'Üçüncü taraf servisler',
    riskler:'Proje riskleri', gecikmeNedeni:'Gecikme nedeni',
    sonGuncelleme:'Son güncelleme tarihi', arsiv:'Arşiv'
  };

  /* Tarih DB.today'den gelir; new Date() ile bugün alınmaz. */
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }

  /* Yeni kod dizi uzunluğundan değil, en yüksek mevcut numaradan üretilir.
     Numara yıl ekseninden bağımsız artar (PRJ-2025-008 → PRJ-2026-009). */
  function yeniKod(){
    var max = 0;
    DB.projects.forEach(function(x){
      var m = /^PRJ-\d{4}-(\d+)$/.exec(x.kod || '');
      if(m) max = Math.max(max, +m[1]);
    });
    return 'PRJ-' + String(DB.today).slice(0,4) + '-' + ('00' + (max + 1)).slice(-3);
  }

  /* Karşılaştırma normalleştirmesi: null, false ve boş metin aynı kovaya düşer. */
  function norm(x){
    if(Array.isArray(x)) return x.join(' | ');
    if(x == null || x === false || x === '') return '';
    return String(x);
  }
  function gorunur(k, v){
    if(k === 'ekip') return (v || []).length ? (v || []).map(DB.empName).join(', ') : '—';
    if(Array.isArray(v)) return v.length ? v.join(' | ') : '—';
    if(v == null || v === '') return '—';
    if(k === 'arsiv') return v ? 'Arşivli' : 'Arşivde değil';
    if(['pm','teknikSorumlu','musteriSorumlu'].indexOf(k) !== -1) return DB.empName(v);
    if(PARA_ALAN.indexOf(k) !== -1) return F.money(v, '₺');
    if(k === 'ilerleme') return v + '%';
    if(k === 'tahminiSure') return F.hours(v);
    if(['baslangic','planlananBitis','gercekBitis','sonGuncelleme'].indexOf(k) !== -1) return F.date(v);
    return String(v);
  }

  /* Formda seçilen sözleşme kaydı — `degerleriOku` yazar, `kaydet` okur.
     Proje kaydına GİRMEZ: bağ sözleşmenin `proje` alanında yaşar (§9d). */
  var secilenSozlesme = null;

  function degerleriOku(){
    var raw = form.submit();
    if(!raw) return null;

    var v = {};
    Object.keys(raw).forEach(function(k){
      if(k.indexOf(EKIP_ON) === 0) return;         /* ekip kutuları ayrı toplanır */
      if(k === 'sozlesme') return;                 /* projede AYNA ALAN AÇILMAZ (§9d) */
      v[k] = raw[k];
    });
    /* Sözleşme seçimi kayda değil BAĞA gider; `kaydet` bunu ayrı okur. */
    secilenSozlesme = raw.sozlesme
      ? DB.contracts.filter(function(x){ return x.kod === raw.sozlesme; })[0] || null : null;

    v.ekip = EKIP_ADAY.filter(function(e){ return !!raw[EKIP_ON + e.kod]; })
                      .map(function(e){ return e.kod; });

    LISTE_ALAN.forEach(function(k){ v[k] = satirlar(v[k]); });
    SAYI_ALAN.forEach(function(k){ v[k] = sayi(v[k]); });
    v.arsiv = !!v.arsiv;
    v.ad = String(v.ad || '').trim();
    v.gercekBitis   = String(v.gercekBitis || '').trim() || null;
    v.gecikmeNedeni = String(v.gecikmeNedeni || '').trim() || null;
    ['repo','canli','test','tasarim','sunucu'].forEach(function(k){
      v[k] = String(v[k] || '').trim() || '—';     /* veride boş bağlantı tire ile yazılır */
    });

    /* Müşteri unvanı seçimden KOPYALANIR — kayıtta yazılı, ekranda türetilmez. */
    var c = DB.customers.filter(function(x){ return x.kod === v.musteri; })[0];
    v.musteriAd = c ? c.unvan : (duzenle ? kayit.musteriAd : '');

    if(canFinans){
      PARA_ALAN.forEach(function(k){ v[k] = sayi(v[k]); });
    }else{
      /* Yetkisiz rol bu alanları hiç görmedi: düzenlemede mevcut değer korunur,
         yeni kayıtta sıfırdan açılır. Tahmin yazılmaz. */
      PARA_ALAN.forEach(function(k){ v[k] = duzenle ? kayit[k] : 0; });
    }
    return v;
  }

  function kaydet(){
    var v = degerleriOku();
    if(!v) return;

    if(duzenle){
      /* Aktivite kaydı yalnız DEĞİŞEN alanlar için yazılır (PROMPT.md §28). */
      var degisen = 0;
      Object.keys(v).forEach(function(k){
        if(norm(kayit[k]) === norm(v[k])) return;
        DB.activities.unshift({
          kayit:kayit.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Alan güncellendi: ' + (ALAN_ADI[k] || k),
          eski:gorunur(k, kayit[k]), yeni:gorunur(k, v[k]),
          tone:'accent', icon:'i-edit'
        });
        kayit[k] = v[k];
        degisen++;
      });
      if(!degisen){
        GV.toast('Değişiklik yok — kayıt olduğu gibi bırakıldı', 'info');
      }else{
        /* Son güncelleme tarihi yalnız gerçekten bir şey değiştiğinde ilerletilir. */
        if(kayit.sonGuncelleme !== DB.today){
          DB.activities.unshift({
            kayit:kayit.kod, tarih:simdi(), kisi:GV.session.emp,
            metin:'Alan güncellendi: ' + ALAN_ADI.sonGuncelleme,
            eski:gorunur('sonGuncelleme', kayit.sonGuncelleme), yeni:gorunur('sonGuncelleme', DB.today),
            tone:'accent', icon:'i-edit'
          });
          kayit.sonGuncelleme = DB.today;
        }
        GV.toast(kayit.kod + ' güncellendi · ' + degisen + ' alan', 'ok');
      }
    }else{
      var kod = yeniKod();
      DB.projects.unshift(Object.assign({ kod:kod }, v, { sonGuncelleme:DB.today }));
      DB.activities.unshift({
        kayit:kod, tarih:simdi(), kisi:GV.session.emp,
        metin:'Proje oluşturuldu', eski:null, yeni:kod, tone:'ok', icon:'i-plus'
      });
      /* Bağ veride YAZILI olduğu için müşteri kaydına da bir satır düşülür (ders L-13). */
      if(v.musteri){
        DB.activities.unshift({
          kayit:v.musteri, tarih:simdi(), kisi:GV.session.emp,
          metin:'Proje ' + kod + ' açıldı', eski:null, yeni:v.ad, tone:'accent', icon:'i-briefcase'
        });
      }
      /* PROJE BAŞLATMA zincirinin kapanışı: bağ SÖZLEŞME kaydına yazılır, projede
         ayna alan açılmaz (§9d). Aynı sözleşmeye ikinci proje bağlanmaz. */
      /* Bağın kaynağı İKİ yol: adresten gelen sözleşme (`?sozlesme=`) ya da
         formdaki sözleşme seçici (REVİZE 11). İkisi de aynı mutasyondan geçer. */
      var szl = secilenSozlesme || kaynakSozlesme;
      var szlBagli = false;
      if(szl && !szl.proje){
        szl.proje = kod;
        szlBagli = true;
        DB.activities.unshift({
          kayit:szl.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Sözleşmeden proje başlatıldı', eski:null, yeni:kod, tone:'ok', icon:'i-briefcase'
        });
        DB.activities.unshift({
          kayit:kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Proje ' + szl.kod + ' sözleşmesinden başlatıldı',
          eski:null, yeni:szl.kod, tone:'accent', icon:'i-file'
        });
      }
      GV.toast(kod + ' oluşturuldu' +
        (szlBagli ? ' · ' + szl.kod + ' sözleşmesine bağlandı' : ''), 'ok');
    }

    form.setDirty(false);
    /* location.reload() YASAK (ders L-15) — normal akış listeye dönmektir. */
    setTimeout(function(){ location.href = 'app-proje.html'; }, 700);
  }

  GV.pageHead({
    eyebrow:'Teslimat',
    title: duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Proje',
    sub:   duzenle
      ? 'Kayıt üzerinde yapılan değişiklikler aktivite geçmişine yazılır · ' + alanSayisi + ' alan.'
      : 'Zorunlu alanlar yıldızla işaretlidir · ' + alanSayisi + ' alan, ' + zorunlu.length + ' zorunlu.',
    actions:[
      { label:'Vazgeç', cls:'btn-line', href:'app-proje.html' },
      { label: duzenle ? 'Değişiklikleri kaydet' : 'Kaydet', cls:'btn-acc', icon:'i-check', run:kaydet }
    ]
  });

  /* Mount İÇİNDEKİ düğüm — GV.refresh() taze kopyayla değiştirir (ders L-16). */
  var altBtn = document.getElementById('kaydetAlt');
  if(altBtn) altBtn.addEventListener('click', kaydet);
});
</script>
</body>
</html>
