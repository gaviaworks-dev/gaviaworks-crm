<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hata Kaydı Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="proje" data-screen="hata">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var me = GV.session.emp;
  var yetkiEkle    = GV.perm.can('ekle');
  var yetkiDuzenle = GV.perm.can('duzenle');

  var id = new URLSearchParams(location.search).get('id') || (DB.bugs[0] || {}).kod;
  var b  = DB.bugs.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!b){
    mount.onclick = null;
    GV.pageHead({ eyebrow:'Proje Yönetimi', title:'Hata Kaydı Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Hata listesi', icon:'i-bug', href:'app-proje-hata.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Hata kaydı bulunamadı',
      desc:'“' + esc(id || '') + '” numaralı hata kaydı sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-proje-hata.html">Hata listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(b.kod);
  document.title = b.kod + ' — Hata Kaydı — GaviaWorks CRM';

  /* =================================================================
     İLİŞKİLİ KAYITLAR — hepsi veride YAZILI tekil bağdan türetilir
     ================================================================= */
  var proje   = b.proje ? DB.proj(b.proje) : null;
  var modul   = b.modul ? DB.mod(b.modul) : null;
  var musteri = proje && proje.musteri
    ? (DB.customers.filter(function(c){ return c.kod === proje.musteri; })[0] || null) : null;

  /* Hata ↔ görev bağı YALNIZ hatanın `gorev` alanından okunur — bu bağın **tek yönü**
     budur, görev tarafında ayna alan yoktur (iki yönlü bağ ayrışır, ders L-13).
     Başlık benzerliğiyle tahmin edilmez. */
  var gorev = b.gorev ? DB.task(b.gorev) : null;

  var acts      = DB.activities.filter(function(a){ return a.kayit === b.kod; });
  var gorevActs = gorev ? DB.activities.filter(function(a){ return a.kayit === gorev.kod; }) : [];

  /* =================================================================
     DURUM VE SÜRE — tarih ekseni DB.today (new Date() ile bugün alınmaz)
     ================================================================= */
  var kapali = b.durum === 'Kapandı';
  var agir   = b.siddet === 'Kritik' || b.siddet === 'Yüksek';

  /* Kapanmış hatada süre = bulunma → çözüm; açık hatada = bulunmadan bugüne. */
  function sureGun(x){
    var d0 = F.days(x.bulunma);
    if(d0 == null) return null;
    return (x.cozum ? F.days(x.cozum) : 0) - d0;
  }
  var sure = sureGun(b);

  /* DB.today'e gün ekler — referans yine sabit veri ekseni, sistem saati değil. */
  function addDays(iso, n){
    var d = new Date(String(iso).slice(0,10) + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }

  function sureMetin(){
    if(sure == null) return '<span class="u-faint">—</span>';
    if(kapali && b.cozum)
      return '<b class="u-num u-ok">' + F.num(sure) + '</b> gün <span class="cell-sub">bulunmadan çözüme</span>';
    var t = sure > 7 ? ' u-danger' : sure > 3 ? ' u-warn' : '';
    return '<b class="u-num' + t + '">' + F.num(sure) + '</b> gün <span class="cell-sub">hâlâ açık</span>';
  }

  /* =================================================================
     §9 KURALI — DB.bugs[].siddet, DB.priorities kümesidir
     (Kritik / Yüksek / Orta / Düşük). DB.impacts ('Çok yüksek' …) DEĞİLDİR.
     Hatadan görev üretilirken eşleme: 'Kritik' → etki 'Çok yüksek',
     diğer üç değer iki eksende de aynı adı taşır.
     ================================================================= */
  function etkiKarsiligi(siddet){ return siddet === 'Kritik' ? 'Çok yüksek' : siddet; }
  var TERMIN_GUN = { 'Kritik':1, 'Yüksek':3, 'Orta':7, 'Düşük':14 };

  /* Yeni görev kodu — DB.tasks içindeki EN YÜKSEK GRV-yyyy-nnn + 1
     (dizi uzunluğu kullanılmaz: silme/ekleme sonrası kod çakışır). */
  function yeniGorevKodu(){
    var max = 0;
    DB.tasks.forEach(function(t){
      var x = /^GRV-\d{4}-(\d+)$/.exec(t.kod || '');
      if(x) max = Math.max(max, parseInt(x[1], 10));
    });
    return 'GRV-' + String(DB.today).slice(0,4) + '-' + (max + 1);
  }

  /* =================================================================
     İLİŞKİLİ KAYITLAR — üçü de artık VERİDE YAZILI tekil bağdır (VB-05 / VB-08).
     Tarih yakınlığı ve kategori sıralaması yalnız **bağ yoksa** gösterilen
     bağlam listelerinde kullanılır ve orada "bağ değildir" diye etiketlenir.
     ================================================================= */
  /* Sprint — hatanın ELE ALINDIĞI sprint, `DB.bugs[].sprint` alanında yazılı. */
  var sprint = b.sprint ? (DB.sprints.filter(function(s){ return s.kod === b.sprint; })[0] || null) : null;
  /* Bağlı görevin sprinti ayrı bir okuma; ikisi çelişirse ekranda gösterilir. */
  var gorevSprint = (gorev && gorev.sprint)
    ? (DB.sprints.filter(function(s){ return s.kod === gorev.sprint; })[0] || null) : null;
  var sprintCelisme = !!(sprint && gorevSprint && sprint.kod !== gorevSprint.kod);

  /* Test koşumu — `DB.bugs[].test` alanında yazılı tekil bağ. */
  var test = b.test ? (DB.tests.filter(function(t){ return t.kod === b.test; })[0] || null) : null;
  /* Bağ yoksa aynı projenin koşumları BAĞLAM olarak listelenir (bağ değildir). */
  var projeTestleri = DB.tests.filter(function(t){ return t.proje === b.proje && t.kod !== b.test; });
  var testAdaylari = projeTestleri.slice().sort(function(x, y){
    return String(y.tarih || '').localeCompare(String(x.tarih || ''));
  });

  /* Destek talebi — `DB.bugs[].destek` alanında yazılı tekil bağ (VB-05). */
  var talep = b.destek ? (DB.tickets.filter(function(t){ return t.kod === b.destek; })[0] || null) : null;
  var projeTalepleri = DB.tickets.filter(function(t){ return t.proje === b.proje && t.kod !== b.destek; });
  var talepAdaylari = projeTalepleri.slice().sort(function(x, y){
    var fx = x.kategori === 'Hata' ? 0 : 1, fy = y.kategori === 'Hata' ? 0 : 1;
    if(fx !== fy) return fx - fy;
    return String(y.acilis || '').localeCompare(String(x.acilis || ''));
  });
  var hataTalepleri = talepAdaylari.filter(function(t){ return t.kategori === 'Hata'; });

  /* Aynı modülün diğer hataları — modül alanı hatada YAZILI, bu bir bağdır. */
  var modulHatalari = DB.bugs.filter(function(x){ return x.modul === b.modul && x.kod !== b.kod; });

  /* =================================================================
     YARDIMCILAR — app-sozlesme-detay.html / app-istalebi-detay.html kalıbı
     `dt` escape EDİLMEZ (etiketler sabit yazı, eksen işareti render olmalı),
     `dd` çağıran tarafta esc()'lenmiş gelir (ders L-14).
     ================================================================= */
  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(Boolean).map(function(p){
      var bos = p[1] == null || p[1] === '';
      return '<div><dt>' + p[0] + '</dt><dd' + (bos ? ' class="is-empty"' : '') + '>' +
        (bos ? '—' : p[1]) + '</dd></div>';
    }).join('') + '</dl>';
  }
  function tbl(head, rows){
    return '<div class="gv-tablewrap is-mobilescroll"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3></div>' + govde + '</div>';
  }
  function kisiSatir(kod){
    if(!kod) return null;
    var e = DB.emp(kod);
    if(!e) return GV.user(kod, { sm:true });
    return '<a href="app-personel-detay.html?id=' + esc(e.kod) + '">' + GV.user(kod, { sm:true }) + '</a>' +
      ' <span class="cell-sub">' + esc(e.pozisyon) + ' · ' + esc(e.depAd) + '</span>';
  }
  function projeSatir(){
    if(!proje) return '<span class="u-faint">Projesiz hata kaydı</span>';
    return '<a href="app-proje-detay.html?id=' + esc(proje.kod) + '">' + esc(proje.ad) + '</a>' +
      ' <span class="cell-sub">' + esc(proje.kod) + ' · ' + esc(proje.tur) + ' · ' + esc(proje.durum) + '</span>';
  }
  function modulSatir(){
    if(!modul) return '<span class="u-faint">Modüle bağlanmamış</span>';
    return esc(modul.ad) + ' <span class="cell-sub">' + esc(modul.kod) + ' · ' + esc(modul.durum) +
      ' · %' + F.num(modul.ilerleme) + ' · sorumlu ' + esc(DB.empName(modul.sorumlu)) + '</span>';
  }
  function sprintSatir(){
    if(!sprint) return '<span class="u-faint">Sprint bağı yok</span>';
    return esc(sprint.ad) + ' <span class="cell-sub">' + esc(sprint.kod) + ' · ' + esc(sprint.durum) +
      ' · hatanın ele alındığı sprint' +
      (sprintCelisme ? ' · <b class="u-danger">bağlı görev ' + esc(gorev.kod) + ' ' +
        esc(gorevSprint.kod) + ' sprintinde</b>' : '') + '</span>';
  }

  /* =================================================================
     MUTASYONLAR — location.reload() KULLANILMAZ (ders L-15).
     Mock veri bellekte durur; reload script'leri baştan koşar ve
     değişikliği siler. Doğrusu: setTimeout(GV.refresh, 700).
     ================================================================= */
  function cozulduIsaretle(tarih, not){
    var eskiDurum = b.durum, eskiCozum = b.cozum;
    b.durum = 'Kapandı';
    b.cozum = tarih;
    DB.activities.unshift({
      kayit:b.kod, tarih:simdi(), kisi:GV.session.ad,
      metin:'Hata çözüldü olarak kapatıldı' + (not ? ' — ' + not : ''),
      eski:eskiDurum, yeni:'Kapandı', tone:'ok', icon:'i-check-circle' });
    if(eskiCozum !== tarih){
      DB.activities.unshift({
        kayit:b.kod, tarih:simdi(), kisi:GV.session.ad, metin:'Çözüm tarihi yazıldı',
        eski:eskiCozum ? F.date(eskiCozum) : 'Çözülmedi', yeni:F.date(tarih),
        tone:'info', icon:'i-calendar' });
    }
    GV.toast(b.kod + ' kapandı · çözüm ' + F.date(tarih), 'ok');
    setTimeout(function(){ GV.refresh(); }, 700);
  }

  function yenidenAc(yeniDurum, neden){
    var eskiDurum = b.durum, eskiCozum = b.cozum;
    b.durum = yeniDurum;
    b.cozum = null;
    DB.activities.unshift({
      kayit:b.kod, tarih:simdi(), kisi:GV.session.ad,
      metin:'Hata yeniden açıldı — ' + neden,
      eski:eskiDurum, yeni:yeniDurum, tone:'danger', icon:'i-refresh' });
    if(eskiCozum){
      DB.activities.unshift({
        kayit:b.kod, tarih:simdi(), kisi:GV.session.ad, metin:'Çözüm tarihi geri alındı',
        eski:F.date(eskiCozum), yeni:'Çözülmedi', tone:'warn', icon:'i-calendar' });
    }
    /* Bağlı görev kapanmışsa hata yeniden açılınca görev de akışa döner. */
    if(gorev && ['Tamamlandı','Arşivlendi'].indexOf(gorev.durum) !== -1){
      var eskiG = gorev.durum;
      gorev.durum = 'Revize bekliyor';
      gorev.revizeNot = 'Hata ' + b.kod + ' yeniden açıldı — ' + neden;
      gorev.yenidenAcilma = (gorev.yenidenAcilma || 0) + 1;
      DB.activities.unshift({
        kayit:gorev.kod, tarih:simdi(), kisi:GV.session.ad,
        metin:'Bağlı hata yeniden açıldığı için görev revizeye alındı (' + b.kod + ')',
        eski:eskiG, yeni:'Revize bekliyor', tone:'danger', icon:'i-refresh' });
    }
    GV.toast(b.kod + ' yeniden açıldı · durum “' + yeniDurum + '”', 'warn');
    setTimeout(function(){ GV.refresh(); }, 700);
  }

  function goreveDonustur(opt){
    var kod = yeniGorevKodu();
    DB.tasks.unshift({
      kod:kod, baslik:opt.baslik, tur:opt.tur,
      proje:b.proje || null, modul:b.modul || null, sprint:opt.sprint || null,
      musteri:proje ? proje.musteri : null, dep:null,
      olusturan:me, veren:b.bulan, sorumlu:opt.sorumlu, yardimci:[],
      izleyiciler:[b.bulan].filter(function(k){ return k && k !== opt.sorumlu; }),
      kontrolEden:b.bulan, onaylayan:proje ? proje.pm : null,
      oncelik:opt.oncelik, etki:opt.etki, aciliyet:opt.oncelik,
      durum:'Atandı', baslangic:DB.today, termin:opt.termin, tamamlanma:null,
      tahminiSure:null, gercekSure:0, faturalanabilir:0, ilerleme:0, revizyon:0, yenidenAcilma:0,
      aciklama:b.kod + ' hata kaydından oluşturuldu. Ortam: ' + (b.ortam || '—') +
               ' · Tekrarlanabilirlik: ' + (b.tekrarlanabilir || '—') + '.',
      amac:'Hata kaydının giderilmesi',
      kabulKriteri:'Hata bildirilen ortamda tekrarlanamıyor, regresyon testi temiz',
      beklenenCikti:'Düzeltme + test kaydı',
      etiketler:['Hata', b.siddet],
      aktif:true
    });
    /* Bağ TEK YÖNDE yazılır: hata → görev (components.md §9d, assumptions V-29).
       `DB.tasks[].hata` ayna alanı doğmaz — canon.js eksen 15 bunu kontrol eder. */
    b.gorev = kod;

    DB.activities.unshift({
      kayit:b.kod, tarih:simdi(), kisi:GV.session.ad,
      metin:'Hata göreve dönüştürüldü — ' + opt.baslik,
      eski:'Göreve bağlanmadı', yeni:kod, tone:'accent', icon:'i-tasks' });
    DB.activities.unshift({
      kayit:kod, tarih:simdi(), kisi:GV.session.ad,
      metin:'Görev oluşturuldu (' + b.kod + ' hatasından)',
      eski:null, yeni:null, tone:'neutral', icon:'i-plus' });

    /* Görev açılınca hata artık üzerinde çalışılıyor sayılır. */
    if(b.durum === 'Açık'){
      DB.activities.unshift({
        kayit:b.kod, tarih:simdi(), kisi:GV.session.ad, metin:'Görev açılışıyla hata akışa girdi',
        eski:'Açık', yeni:'Devam ediyor', tone:'info', icon:'i-arrow-right' });
      b.durum = 'Devam ediyor';
    }
    return kod;
  }

  /* =================================================================
     MODALLAR — doğrulama GV.notice / .field.is-invalid deseniyle
     ================================================================= */
  function kisiOptions(sel){
    var ekip = proje && proje.ekip ? proje.ekip : [];
    function opt(e){
      return '<option value="' + esc(e.kod) + '"' + (e.kod === sel ? ' selected' : '') + '>' +
        esc(e.ad) + ' — ' + esc(e.pozisyon) + '</option>';
    }
    var ekipKisi = DB.employees.filter(function(e){ return ekip.indexOf(e.kod) !== -1 && e.aktif !== false; });
    var digerler = DB.employees.filter(function(e){ return ekip.indexOf(e.kod) === -1 && e.aktif !== false; });
    return (ekipKisi.length
        ? '<optgroup label="' + esc(proje ? proje.ad + ' ekibi' : 'Proje ekibi') + '">' +
          ekipKisi.map(opt).join('') + '</optgroup>'
        : '') +
      '<optgroup label="Diğer personel">' + digerler.map(opt).join('') + '</optgroup>';
  }

  function cozumModal(){
    GV.modal({
      title:'Hatayı çözüldü işaretle', text:b.kod + ' · ' + b.baslik, icon:'i-check-circle', size:'lg',
      body:
        '<div class="gv-grid gv-grid-2">' +
          '<div class="field"><label for="czTarih">Çözüm tarihi<span class="req">*</span></label>' +
            '<input type="date" id="czTarih" value="' + esc(DB.today) + '">' +
            '<span class="f-hint">Hata ' + esc(F.date(b.bulunma)) + ' tarihinde bulundu. Çözüm tarihi bundan önce olamaz.</span>' +
            '<span class="f-err">' + ico('i-alert','ic-sm') + 'Çözüm tarihi bulunma tarihinden önce olamaz.</span></div>' +
          '<div class="field"><label for="czOrtam">Doğrulanan ortam</label>' +
            '<input type="text" class="inp" id="czOrtam" value="' + esc(b.ortam || '') + '">' +
            '<span class="f-hint">Düzeltmenin doğrulandığı ortam. Kayıttaki ortam bilgisi hazır geldi.</span></div>' +
        '</div>' +
        '<div class="field u-mt-4"><label for="czNot">Çözüm notu <span class="u-faint">(opsiyonel)</span></label>' +
          '<textarea id="czNot" rows="2" placeholder="Kök neden, yapılan düzeltme, doğrulama biçimi…"></textarea></div>' +
        GV.notice({ tone:'info', title:'Hata durum sözlüğünde ayrı bir “Çözüldü” değeri yok',
          text:'Hata kayıtları Açık · Devam ediyor · Kapandı ekseninde tutulur. Çözüm kararı bu yüzden ' +
               'durumu “Kapandı” yapar ve çözüm tarihi alanına yazılır; açık kalma süresi bu iki tarihten hesaplanır.' }),
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Çözüldü işaretle', cls:'btn-acc', icon:'i-check', onClick:function(close, el){
            var t = el.querySelector('#czTarih');
            var v = t.value;
            if(!v || (b.bulunma && v < b.bulunma)){
              t.closest('.field').classList.add('is-invalid');
              GV.toast('Çözüm tarihi bulunma tarihinden önce olamaz', 'warn');
              t.focus();
              return false;
            }
            var not = el.querySelector('#czNot').value.trim();
            var ortam = el.querySelector('#czOrtam').value.trim();
            cozulduIsaretle(v, not + (ortam && ortam !== b.ortam ? (not ? ' · ' : '') + 'doğrulanan ortam: ' + ortam : ''));
          } }
      ]
    });
  }

  function yenidenAcModal(){
    GV.modal({
      title:'Hatayı yeniden aç', text:b.kod + ' · ' + b.baslik, icon:'i-refresh', tone:'danger', size:'lg',
      body:
        '<div class="field"><label for="yaNeden">Yeniden açma gerekçesi<span class="req">*</span></label>' +
          '<textarea id="yaNeden" rows="3" placeholder="Düzeltme doğrulanamadı · hata farklı ortamda tekrarladı · regresyon…"></textarea>' +
          '<span class="f-hint">En az 10 karakter. Gerekçe aktivite geçmişine yazılır ve bağlı göreve taşınır.</span>' +
          '<span class="f-err">' + ico('i-alert','ic-sm') + 'Gerekçe zorunludur — en az 10 karakter yazın.</span></div>' +
        '<div class="field u-mt-4"><label for="yaDurum">Yeni durum</label><select id="yaDurum">' +
          ['Açık','Devam ediyor'].map(function(d){
            return '<option value="' + esc(d) + '">' + esc(d) + '</option>';
          }).join('') + '</select>' +
          '<span class="f-hint">Sorumlu hazırsa doğrudan “Devam ediyor” seçilebilir.</span></div>' +
        GV.notice({ tone:'warn', title:'Çözüm tarihi silinir',
          text:'Yeniden açılan hatanın çözüm tarihi boşaltılır; açık kalma süresi bulunma tarihinden bugüne ' +
               'yeniden sayılır.' + (gorev && ['Tamamlandı','Arşivlendi'].indexOf(gorev.durum) !== -1
                 ? ' Bağlı görev ' + gorev.kod + ' de “Revize bekliyor” durumuna alınır.' : '') }),
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Yeniden aç', cls:'btn-danger', icon:'i-refresh', onClick:function(close, el){
            var t = el.querySelector('#yaNeden');
            var v = t.value.trim();
            if(v.length < 10){
              t.closest('.field').classList.add('is-invalid');
              GV.toast('Yeniden açma gerekçesi zorunlu — en az 10 karakter', 'warn');
              t.focus();
              return false;
            }

    '<div class="gc-body">' + ozetListe([

      ['Atanan', b.sorumlu ? GV.user(b.sorumlu, { sm:true }) : '<span class="u-faint">Atanmadı</span>'],

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-server') + 'Teknik Bağlam</h2></div>' +
    '<div class="gc-body">' + ozetListe([

      ['Kaynak test koşumu', test
        ? '<a href="app-proje-test-detay.html?id=' + esc(test.kod) + '">' + esc(test.kod) + '</a>' +
          '<span class="cell-sub">' + esc(test.tur) + '</span>'
        : '<span class="u-faint">Koşumdan gelmedi</span>'],
      ['Kaynak destek talebi', talep
        ? '<a href="app-destek-detay.html?id=' + esc(talep.kod) + '">' + esc(talep.kod) + '</a>' +
          '<span class="cell-sub">' + esc(talep.musteriAd) + '</span>'
        : '<span class="u-faint">Talepten gelmedi</span>'],
      ['Aynı modüldeki hata', modulHatalari.length
        ? '<b class="u-num">' + modulHatalari.length + '</b>' : '<span class="badge is-ok no-dot">Yok</span>']
    ]) + '</div>' +
    sayac('<a class="btn btn-line btn-sm" href="app-proje-hata.html">' + ico('i-bug','ic-sm') +
      ' Tüm hata kayıtları</a>') +
    '</section>' +

    (proje
      ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-briefcase') + 'Proje</h2></div>' +
        '<div class="gc-body"><a class="cell-main" href="app-proje-detay.html?id=' + esc(proje.kod) + '">' +
          esc(proje.ad) + '</a>' +
        '<div class="cell-sub u-mb-4">' + esc(proje.musteriAd) + '</div>' + GV.progress(proje.ilerleme) +
        '<div class="u-mt-4">' + ozetListe([
          ['Durum', GV.badge(proje.durum)],
          ['Sağlık', GV.badge(proje.saglik)],
          ['Proje yöneticisi', GV.user(proje.pm, { sm:true })],
          ['Teknik sorumlu', proje.teknikSorumlu ? GV.user(proje.teknikSorumlu, { sm:true }) : '<span class="u-faint">—</span>'],
          ['Planlanan bitiş', '<span class="cell-date">' + F.date(proje.planlananBitis) + '</span>'],
          ['Projedeki açık hata', '<b class="u-num">' +
            DB.bugs.filter(function(x){ return x.proje === proje.kod && x.durum !== 'Kapandı'; }).length + '</b>']
        ]) + '</div></div></section>'
      : '') +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' +
    (acts.length ? GV.activity(acts.slice(0, 3))
      : (gorevActs.length
          ? '<p class="u-sm u-faint u-mb-8">Hata kaydında hareket yok — bağlı görevin son hareketleri:</p>' +
            GV.activity(gorevActs.slice(0, 3))
          : '<p class="u-sm u-faint">Bu hata kaydında henüz kayıtlı hareket yok.</p>')) +
    '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =================================================================
     AKSİYONLAR — yetki ve durum koşulu sağlanmayan buton HİÇ basılmaz.
     Dinleyici `mount.onclick` ATAMASI ile bağlanır: atama idempotenttir,
     GV.refresh() sonrası dinleyici birikmez (ders L-16).
     ================================================================= */
  mount.onclick = function(e){
    if(e.target.closest('#btnDonustur'))  return donusturModal();
    if(e.target.closest('#btnCozuldu'))   return cozumModal();
    if(e.target.closest('#btnYenidenAc')) return yenidenAcModal();
  };
});
</script>
</body>
</html>
