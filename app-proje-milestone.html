<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Milestone — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="proje" data-screen="milestone">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  var canDuzen  = GV.perm.can('duzenle');

  /* =================================================================
     REVİZE 06 — BU EKRAN ARTIK PROJE MILESTONE'UNU GÖSTERİR.

     Turun başında `app-proje-milestone.html` ile `app-odemeplani.html`
     **aynı koleksiyonun (`DB.milestones`) iki görünümüydü**: ikisi de taksit
     numarası, tutar ve fatura basıyordu. Doküman ikisini ayırmayı istiyor —
     "milestone ile ödeme aynı nesne olmamalıdır".

       bu ekran            → `DB.projectMilestones` · PROJE OLAYI, tutarsız
       app-odemeplani.html → `DB.milestones`        · ÖDEME TAKSİTİ, tutarlı

     Bağ ödeme kaydında durur (`DB.milestones[].milestone`); burada ayna alan
     yoktur (§9d), taksit ters yönden okunur. TUTAR KOLONU BİLEREK YOK:
     para ekseni ödeme planı ekranınındır, iki ekranı yeniden birbirine
     benzetmek ayrımı ilk günde geri alırdı.
     ================================================================= */
  function projeOf(kod){ return DB.projects.filter(function(p){ return p.kod === kod; })[0] || null; }
  function teslimOf(kod){ return DB.deliveries.filter(function(d){ return d.kod === kod; })[0] || null; }
  /* Ters yön: bu milestone'a bağlanmış ödeme taksiti (varsa tek). */
  function taksitOf(kod){ return DB.milestones.filter(function(m){ return m.milestone === kod; })[0] || null; }

  function rows(){
    return DB.projectMilestones.map(function(m){
      var p = projeOf(m.proje);
      var t = m.teslimat ? teslimOf(m.teslimat) : null;
      var k = taksitOf(m.kod);
      return {
        kod:m.kod, baslik:m.baslik, tarih:m.tarih, durum:m.durum,
        sorumlu:m.sorumlu, sorumluAd:m.sorumlu ? DB.empName(m.sorumlu) : '',
        aciklama:m.aciklama,
        teslimat:m.teslimat, teslimAd:t ? t.ad : null, teslimOnay:t ? t.musteriOnay : null,
        taksit:k ? k.kod : null, taksitNo:k ? k.taksit : null, taksitAd:k ? k.ad : null,
        odemeDurum:k ? k.odemeDurum : null, sozlesme:k ? k.sozlesme : null,
        proje:m.proje, projeAd:p ? p.ad : '', projeDurum:p ? p.durum : null,
        projeFaz:p ? p.faz : null,
        musteri:p ? p.musteri : null, musteriAd:p ? p.musteriAd : ''
      };
    });
  }

  /* ---- ölçütler — gecikme referansı DB.today (F.days), new Date() değil ---- */
  var tamam    = function(x){ return x.durum === 'Tamamlandı'; };
  var geciken  = function(x){ return x.durum === 'Gecikti' ||
                                     (!tamam(x) && x.tarih && F.days(x.tarih) < 0); };
  var yaklasan = function(x){
    if(tamam(x) || geciken(x) || !x.tarih) return false;
    var d = F.days(x.tarih);
    return d >= 0 && d <= 45;
  };
  var teslimli = function(x){ return !!x.teslimat; };
  var odemesiz = function(x){ return !x.taksit; };

  GV.pageHead({ eyebrow:'Projeler', title:'Proje Milestone',
    sub:'Projenin teslim ve onay kilometre taşları — tutar taşımaz; ödeme taksitleri ayrı ekranda izlenir',
    actions:[{ label:'Ödeme Planları', icon:'i-wallet', href:'app-odemeplani.html' },
             { label:'Teslimler', icon:'i-package', href:'app-proje-teslim.html' },
             { label:'Proje Listesi', icon:'i-briefcase', href:'app-proje.html' }] });

  /* REVİZE 13 — müşteri oturumu mu? Kapsam bildirimi buna bağlıdır. */
  var musKapsam = !!(GV.session && GV.session.musteri);

  GV.list({
    /* REVİZE 13 — müşteri kapsamı. Satır zaten projesinden `musteri` alanını
       türetiyor (yukarıdaki `rows()`), kapsam onu kullanır. */
    /* REVİZE 13 — kapsam YALNIZ müşteri oturumunda bildirilir. Koşulsuz
       bildirilseydi `ui.js` iç roller için ("kendi" · "departman" · "proje")
       "bu ekranda süzgeç tanımlı değil" çubuğunu basardı: o kapsam borcu
       gerçektir ama bu turun konusu değil ve 12 rolün ekranını değiştirirdi. */
    scopeField:musKapsam ? { musteri:'musteri' } : null,
    mount:'#liste', id:'projemilestone', key:'kod', source:rows,
    exportName:'proje-milestone', exportTitle:'Proje Milestone Listesi', pageSize:10,
    views:['table','card','kanban'], archive:false,
    kanban:{ groupBy:'durum', columns:DB.milestoneStatuses,
      card:function(x){
        return '<span class="gv-kcard-title">' + esc(x.baslik) + '</span>' +
          '<div class="gv-kcard-meta"><span>' + esc(x.projeAd) + '</span></div>' +
          '<div class="gv-kcard-meta">' + GV.user(x.sorumlu, { sm:true }) +
          GV.dateCell(x.tarih, { done:tamam(x) }) + '</div>' +
          '<div class="gv-kcard-meta"><span>' + x.kod + '</span>' +
          (x.teslimat ? '<span class="tag">' + x.teslimat + '</span>'
                      : '<span class="u-faint">teslim kaydı yok</span>') + '</div>';
      } },
    search:{ placeholder:'Milestone, proje, müşteri, sorumlu veya teslim no ara',
             fields:['kod','baslik','proje','projeAd','musteri','musteriAd',
                     'sorumluAd','teslimat','taksit','durum'] },
    defaultSort:'tarih', defaultDir:'asc',

    kpis:[
      { label:'Toplam milestone', icon:'i-milestone',
        calc:function(a){ return a.length; },
        meta:function(a){
          var pr = a.map(function(x){ return x.proje; }).filter(function(v,i,ar){ return ar.indexOf(v) === i; });
          return pr.length + ' projede · ' + DB.projects.length + ' projenin ' +
            (DB.projects.length - pr.length) + "'inde milestone kaydı yok"; } },
      { label:'Tamamlanan', icon:'i-check-circle', tone:'ok',
        calc:function(a){ return a.filter(tamam).length; },
        meta:function(a){ return a.length ? '%' + Math.round(a.filter(tamam).length / a.length * 100) + ' tamamlandı' : '—'; } },
      { label:'Geciken', icon:'i-alert', tone:'danger',
        calc:function(a){ return a.filter(geciken).length; },
        meta:function(a){ return a.filter(yaklasan).length + ' milestone 45 gün içinde'; },
        metaTone:'warn' },
      { label:'Teslim kaydı olan', icon:'i-package', tone:'info',
        calc:function(a){ return a.filter(teslimli).length; },
        meta:function(a){ return a.filter(odemesiz).length + ' milestone bir ödeme taksitine bağlı değil'; } }
    ],

    tabs:[
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null },
      { key:'yaklasan', label:'Yaklaşanlar', icon:'i-hourglass', filter:yaklasan },
      { key:'geciken', label:'Gecikenler', icon:'i-alert', filter:geciken },
      { key:'tamam', label:'Tamamlananlar', icon:'i-check-circle', filter:tamam },
      { key:'teslimli', label:'Teslim Kaydı Olanlar', icon:'i-package', filter:teslimli }
    ],

    columns:[
      { key:'baslik', label:'Milestone', width:'22%', locked:true, cellClass:'cell-wrap',
        render:function(x){ return '<span class="cell-main">' + esc(x.baslik) + '</span>' +
          '<span class="cell-code">' + x.kod + '</span>'; },
        exportValue:function(x){ return x.kod + ' · ' + x.baslik; } },
      { key:'proje', label:'Proje', cellClass:'cell-wrap', render:function(x){
          return '<a class="cell-main" href="app-proje-detay.html?id=' + x.proje + '">' + esc(x.projeAd) + '</a>' +
                 '<span class="cell-code">' + x.proje + '</span>'; },
        exportValue:function(x){ return x.projeAd; } },
      { key:'musteriAd', label:'Müşteri', cellClass:'cell-wrap', render:function(x){
          return x.musteri
            ? '<a class="cell-main" href="app-musteri-detay.html?id=' + x.musteri + '">' + esc(x.musteriAd) + '</a>' +
              '<span class="cell-code">' + x.musteri + '</span>'
            : '<span class="u-faint">—</span>'; },
        exportValue:function(x){ return x.musteriAd; } },
      { key:'sorumlu', label:'Sorumlu', render:function(x){
          return x.sorumlu ? GV.user(x.sorumlu, { sm:true }) : '<span class="u-faint">—</span>'; },
        sortValue:function(x){ return x.sorumluAd; }, exportValue:function(x){ return x.sorumluAd; } },
      { key:'tarih', label:'Tarih', render:function(x){
          return GV.dateCell(x.tarih, { done:tamam(x) }) +
            (tamam(x) ? '' : '<span class="cell-sub ' + (geciken(x) ? 'u-danger' : yaklasan(x) ? 'u-warn' : '') + '">' +
                             F.rel(x.tarih) + '</span>'); },
        exportValue:function(x){ return x.tarih || ''; } },
      { key:'durum', label:'Milestone durumu', render:function(x){ return GV.badge(x.durum); } },
      { key:'teslimat', label:'İlgili teslimat', cellClass:'cell-wrap', render:function(x){
          return x.teslimat
            ? '<a class="cell-main" href="app-proje-teslim-detay.html?id=' + x.teslimat + '">' + esc(x.teslimAd) + '</a>' +
              '<span class="cell-code">' + x.teslimat + '</span>' + GV.badge(x.teslimOnay)
            : '<span class="u-faint">Teslim kaydı yok</span>'; },
        exportValue:function(x){ return x.teslimat || ''; } },
      /* Bağlı taksit BİLGİ olarak gösterilir — tutarı burada basılmaz.
         Para ekseni ödeme planı ekranınındır (§9b tek eksen kuralı). */
      { key:'taksit', label:'Bağlı ödeme taksiti', cellClass:'cell-wrap', render:function(x){
          return x.taksit
            ? '<a class="cell-main" href="app-odemeplani.html?t=tumu&q=' + x.taksit + '">T' + x.taksitNo + ' · ' + esc(x.taksitAd) + '</a>' +
              '<span class="cell-code">' + x.taksit + '</span>' + GV.badge(x.odemeDurum)
            : '<span class="u-faint">Ödeme bağı yok</span>'; },
        exportValue:function(x){ return x.taksit || ''; } },
      { key:'aciklama', label:'Kayıt kaynağı', visible:false, cellClass:'cell-wrap',
        render:function(x){ return '<span class="cell-sub">' + esc(x.aciklama) + '</span>'; },
        exportValue:function(x){ return x.aciklama || ''; } },
      { key:'projeDurum', label:'Proje durumu', visible:false, render:function(x){
          return x.projeDurum ? GV.badge(x.projeDurum) : '<span class="u-faint">—</span>'; } },
      { key:'projeFaz', label:'Proje fazı', visible:false, render:function(x){
          return x.projeFaz ? '<span class="tag">' + esc(x.projeFaz) + '</span>' : '<span class="u-faint">—</span>'; } }
    ],

    filters:[
      { key:'proje', label:'Proje', type:'select',
        options:DB.projects.map(function(p){ return { value:p.kod, label:p.ad }; }) },
      { key:'musteri', label:'Müşteri', type:'select',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'durum', label:'Milestone durumu', type:'multi', options:DB.milestoneStatuses },
      { key:'sorumlu', label:'Sorumlu', type:'select',
        options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'tarih', label:'Tarih', type:'daterange' },
      { key:'teslimVarmi', label:'Teslim kaydı', type:'select', options:['Var','Yok'],
        test:function(x, v){ return v === 'Var' ? !!x.teslimat : !x.teslimat; } },
      { key:'odemeVarmi', label:'Ödeme bağı', type:'select', options:['Var','Yok'],
        test:function(x, v){ return v === 'Var' ? !!x.taksit : !x.taksit; } }
    ],

    rowClass:function(x){ return geciken(x) ? 'is-late' : ''; },

    mobile:function(x){
      return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.baslik) + '</span>' +
        GV.badge(x.durum) + '</div>' +
        '<div class="gv-mrow-code">' + x.kod + ' · ' + esc(x.projeAd) + '</div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' +
        (x.teslimat ? '<span class="tag">' + x.teslimat + '</span>'
                    : '<span class="u-faint">teslim kaydı yok</span>') +
        '</span>' + GV.dateCell(x.tarih, { done:tamam(x) }) + '</div>';
    },

    card:function(x){
      return '<div class="gv-rcard-top"><div><span class="cell-main">' + esc(x.baslik) + '</span>' +
        '<div class="cell-sub">' + esc(x.projeAd) + '</div></div>' + GV.badge(x.durum) + '</div>' +
        '<div class="gv-rcard-meta"><span>' + x.kod + '</span>' +
        '<span>' + F.dateShort(x.tarih) + '</span>' +
        '<span>' + esc(x.musteriAd || '—') + '</span></div>' +
        '<div class="gv-rcard-meta">' + GV.user(x.sorumlu, { sm:true }) + '</div>' +
        '<div class="gv-rcard-foot">' +
        (x.teslimat ? '<span class="tag">' + x.teslimat + '</span>' : '<span class="u-faint">Teslim kaydı yok</span>') +
        (x.taksit ? '<span class="tag">' + x.taksit + '</span>' : '<span class="u-faint">Ödeme bağı yok</span>') +
        '</div>';
    },

    /* Zincirin halkası yoksa aksiyon hiç basılmaz (components.md §2 → rowActions.show) */
    rowActions:[
      { key:'proje', icon:'i-briefcase', label:'Projeyi aç',
        href:function(x){ return 'app-proje-detay.html?id=' + x.proje; } },
      { key:'teslim', icon:'i-package', label:'Teslimi aç',
        show:function(x){ return !!x.teslimat; },
        href:function(x){ return 'app-proje-teslim-detay.html?id=' + x.teslimat; } },
      { key:'plan', icon:'i-wallet', label:'Bağlı taksiti aç',
        show:function(x){ return !!x.taksit; },
        href:function(x){ return 'app-odemeplani.html?t=tumu&q=' + x.taksit; } }
    ],

    bulk:[
      { key:'tamamla', label:'Tamamlandı İşaretle', icon:'i-check-circle',
        confirm:'Seçili {n} milestone tamamlandı olarak işaretlenecek. Zaten tamamlanmış kayıtlar atlanır. ' +
                'Bağlı ödeme taksitinin durumu DEĞİŞMEZ — ödeme ayrı bir eksendir.',
        run:function(ids){
          if(!canDuzen){ GV.toast('Milestone güncelleme yetkiniz yok.', 'danger'); return; }
          var n = 0;
          DB.projectMilestones.forEach(function(m){
            if(ids.indexOf(m.kod) !== -1 && m.durum !== 'Tamamlandı'){ m.durum = 'Tamamlandı'; n++; }
          });
          GV.toast(n ? (n + ' milestone tamamlandı olarak işaretlendi' +
                        (n < ids.length ? ' · ' + (ids.length - n) + ' kayıt atlandı' : ''))
                     : 'Seçili kayıtların tamamı zaten tamamlanmış', n ? 'ok' : 'warn');
        } },
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true }
    ],

    emptyState:{ icon:'i-milestone', title:'Bu görünümde milestone yok',
      desc:'Proje milestone\'u projenin teslim ve onay olaylarını izler — tutar taşımaz. ' +
           'Ödeme taksitleri ve tutarları “Ödeme Planları” ekranındadır.',
      action:'<a class="btn btn-acc" href="app-proje.html"><svg class="ic"><use href="#i-briefcase"></use></svg> Proje Listesi</a>' }
  });

});
</script>
</body>
</html>
