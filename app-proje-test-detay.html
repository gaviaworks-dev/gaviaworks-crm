<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test Koşumu Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="proje" data-screen="test">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var yetkiDuzenle = GV.perm.can('duzenle');
  var yetkiEkle    = GV.perm.can('ekle');

  var id = new URLSearchParams(location.search).get('id') || (DB.tests[0] || {}).kod;
  var t  = DB.tests.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!t){
    mount.onclick = null;
    GV.pageHead({ eyebrow:'Proje Yönetimi', title:'Test Koşumu Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Test listesi', icon:'i-flask', href:'app-proje-test.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-flask', title:'Test koşumu bulunamadı',
      desc:'“' + esc(id || '') + '” numaralı test koşumu sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-proje-test.html">Test listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(t.kod);
  document.title = t.kod + ' — Test Koşumu — GaviaWorks CRM';

  /* =================================================================
     İLİŞKİLİ KAYITLAR — VB-08 ile bağ alanları veriye YAZILDI:
       `DB.tests[].moduller` (dizi) · `DB.tests[].sprint`
       `DB.bugs[].test`  — koşumun açtığı hatalar bu alandan okunur
       `DB.deliveries[].test` — koşumun kabule bağlandığı teslim
     Bağ alanı boş olan yerde tarih yakınlığı ile TAHMİN EDİLMEZ; aynı projenin
     kayıtları yalnız BAĞLAM listesi olarak, "bağ değildir" etiketiyle gösterilir.
     ================================================================= */
  var proje = t.proje ? DB.proj(t.proje) : null;
  var acts  = DB.activities.filter(function(a){ return a.kayit === t.kod; });
  var projeActs = proje ? DB.activities.filter(function(a){ return a.kayit === proje.kod; }) : [];

  var tamam   = t.durum === 'Tamamlandı';

  /* =================================================================
     SAYAÇ — TEK KAYNAK `GV.test.sayac()` ([9.1.1] · paket P3-03)
     Kayıttaki `senaryo` / `basarili` / `basarisiz` alanları bu ekranda
     ARTIK DOĞRUDAN OKUNMAZ. Yordam iki farklı güvenilirlikte sayı döndürür
     ve bunu `turetilmis` bayrağıyla söyler:
       true  → sayı gerçek senaryo sonuçlarından SAYILDI
       false → eski kayıt; senaryo dökümü yok, üç sayı kayıttan DEVRALINDI
     İkisini aynı biçimde basmak yanlış beyandır; ekran ayrımı her yüzeyde
     görünür kılar (rozet · künye satırı · sekme uyarısı).
     ================================================================= */
  var S = GV.test.sayac(t) || { turetilmis:false, senaryo:0, basarili:0, basarisiz:0,
                                engellendi:null, kosulmadi:null, kosum:0 };
  var turetilmis = S.turetilmis === true;
  var kosuldu    = (S.senaryo || 0) > 0;
  var kosumlar   = GV.test.kosumlar(t.kod);
  var hatasiz    = GV.test.hatasizBasarisiz(t.kod);

  /* Başarı oranının PAYDASI iki modelde farklıdır ve etiketinde yazılır.
     Türetilmiş sayaçta senaryonun bir kısmı Engellendi / Koşulmadı olabilir;
     onları paydaya koymak "başarısız" saymak olurdu. */
  var kosulan = turetilmis ? ((S.basarili || 0) + (S.basarisiz || 0)) : (S.senaryo || 0);
  var oran    = kosulan ? Math.round(S.basarili / kosulan * 100) : null;
  var hataOran= kosulan ? Math.round(S.basarisiz / kosulan * 100) : null;
  var paydaEt = turetilmis ? 'koşulan senaryo içinde' : 'toplam senaryo içinde';

  /* Sayım tutarlılığı yalnız DEVRALINAN sayaçta anlamlı bir denetimdir:
     türetilmiş sayaçta dört sonuç sayısının toplamı zaten senaryo sayısıdır. */
  var toplamSayim = (S.basarili || 0) + (S.basarisiz || 0);
  var sayimTutar  = turetilmis ? true : toplamSayim === (S.senaryo || 0);

  function oranTon(o){ return o === 100 ? 'ok' : o >= 90 ? '' : o >= 70 ? 'warn' : 'danger'; }
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }
  /* İki tarih arasındaki gün farkı — referans ekseni DB.today (new Date() ile bugün alınmaz). */
  function fark(a, b){
    if(!a || !b) return null;
    return F.days(a) - F.days(b);
  }

  /* ---- Kapsam: koşumun modülleri ve sprinti — ikisi de veride YAZILI ---- */
  var projeModulleri = proje
    ? DB.projectModules.filter(function(m){ return m.proje === proje.kod; }) : [];
  var projeSprintleri = proje
    ? DB.sprints.filter(function(s){ return s.proje === proje.kod; }) : [];
  /* Koşumun kapsadığı modüller — `moduller` dizisi; boş dizi = projenin modül
     kırılımı veride yok, kapsam proje ekseninde okunur. */
  var kapsamModulKod = t.moduller || [];
  var kapsamModulleri = projeModulleri.filter(function(m){ return kapsamModulKod.indexOf(m.kod) !== -1; });
  var kapsamDisi = projeModulleri.filter(function(m){ return kapsamModulKod.indexOf(m.kod) === -1; });
  /* Sprint — yazılı bağ. null = koşum tarihi hiçbir sprint aralığına girmiyor. */
  var sprint = t.sprint ? (projeSprintleri.filter(function(s){ return s.kod === t.sprint; })[0] || null) : null;

  /* ---- Açılan hatalar: `DB.bugs[].test` alanında YAZILI tekil bağ ---- */
  var projeHatalari = proje
    ? DB.bugs.filter(function(b){ return b.proje === proje.kod; }) : [];
  var acilanHatalar = DB.bugs.filter(function(b){ return b.test === t.kod; });
  /* Bu koşuma bağlı OLMAYAN proje hataları — bağlam listesi, bağ değildir. */
  var digerHatalar = projeHatalari.filter(function(b){ return b.test !== t.kod; });
  var acikHatalar  = projeHatalari.filter(function(b){ return b.durum !== 'Kapandı'; });
  /* Kural: bağlı hata sayısı başarısız senaryo sayısını AŞAMAZ (canon eksen 15). */
  var hataFazlasi = acilanHatalar.length > (S.basarisiz || 0);

  /* ---- İlgili teslim: `DB.deliveries[].test` alanında YAZILI bağ ---- */
  var projeTeslimleri = proje
    ? DB.deliveries.filter(function(d){ return d.proje === proje.kod; }) : [];
  var bagliTeslimler = projeTeslimleri.filter(function(d){ return d.test === t.kod; });
  var digerTeslimler = projeTeslimleri.filter(function(d){ return d.test !== t.kod; });

  /* =================================================================
     YARDIMCILAR — app-sozlesme-detay.html / app-proje-hata-detay.html kalıbı
     `dt` escape EDİLMEZ (etiketler sabit yazı, eksen işareti render olmalı),
     `dd` çağıran tarafta esc()'lenmiş gelir (ders L-14).
     ================================================================= */
  function tbl(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    /* başlık escape EDİLMEZ: sayfada yazılı sabit, içinde kaynak işareti
       (<span class="u-faint">(bağlam)</span>) render edilmek zorunda (ders L-14) */
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + baslik + '</h3></div>' + govde + '</div>';
  }
  function kisiSatir(kod){
    if(!kod) return null;
    var e = DB.emp(kod);
    if(!e) return GV.user(kod, { sm:true });
    return '<a href="app-personel-detay.html?id=' + esc(e.kod) + '">' + GV.user(kod, { sm:true }) + '</a>' +
      ' <span class="cell-sub">' + esc(e.pozisyon) + ' · ' + esc(e.depAd) + '</span>';
  }
  function projeSatir(){
    if(!proje) return '<span class="u-faint">Projesiz koşum</span>';
    return '<a href="app-proje-detay.html?id=' + esc(proje.kod) + '">' + esc(proje.ad) + '</a>' +
      ' <span class="cell-sub">' + esc(proje.kod) + ' · ' + esc(proje.tur) + ' · ' + esc(proje.durum) + '</span>';
  }
  function sayiHucre(n, ton){
    if(n == null) return '<span class="u-faint">—</span>';
    return '<b class="u-num' + (ton ? ' u-' + ton : '') + '">' + F.num(n) + '</b>';
  }
  /* Kod → kayıt araması. YALNIZ sözlük koleksiyonlarında kullanılır
     (build · ortam · plan); senaryo sonuç zinciri GV.test üzerinden okunur,
     burada kendi filtre zincirim kurulmaz. */
  function bul(arr, kod){
    if(!kod) return null;
    return (arr || []).filter(function(x){ return x.kod === kod; })[0] || null;
  }

  /* ---- Sayacın kaynağını söyleyen rozet ve açıklama ---- */
  function kaynakRozeti(){
    return turetilmis
      ? '<span class="badge is-ok no-dot">Sayaç senaryo sonuçlarından türetildi</span>'
      : '<span class="badge is-warn no-dot">Sayaç kayıttan devralındı</span>';
  }
  function kaynakAciklama(){
    return turetilmis
      ? 'Bu koşumun üç sayısı senaryo sonuç kayıtlarından tek tek sayıldı; ' +
        'hangi senaryonun ne sonuç verdiği aşağıdaki tabloda okunur.'
      : 'Bu kaydın senaryo dökümü yok: sayılar test kaydından devralındı. ' +
        'Hangi senaryonun geçtiği, hangisinin düştüğü veride kayıtlı değildir — ' +
        'bu yüzden senaryo tablosu yerine bu açıklama gösteriliyor, ' +
        'sayı türetiliyormuş gibi yapılmıyor.';
  }

  /* ---- Sonuç sözlüğü: `Başarılı` ve `Başarısız` GV.badge ton haritasında YOK
     (haritada yalnız `Engellendi` ve `Koşulmadı` var). Eksik iki anahtar için
     yerel harita kurmak yerine fabrikanın açık ton kanalı kullanılır. ---- */
  var SONUC_TON = { 'Başarılı':'is-ok', 'Başarısız':'is-danger' };

  var colSonuc = GV.cols.durum('sonuc', 'Sonuç', {
    extra:function(x){ return SONUC_TON[x.sonuc] || null; } });
  var colKosan = GV.cols.kisi('kosan', 'Koşan', { bosMetin:'Koşulmadı' });
  var colTarih = GV.cols.date('tarih', 'Tarih', { plain:true, bosMetin:'—',
    sub:function(x){ return x.tarih ? esc(String(x.tarih).slice(11,16)) : ''; } });

  /* =================================================================
     MUTASYON — location.reload() KULLANILMAZ (ders L-15).
     Mock veri bellekte durur; reload script'leri baştan koşar ve değişikliği
     siler. Doğrusu: setTimeout(GV.refresh, 700).
     ================================================================= */
  function kosumuTamamla(opt){
    var eskiDurum = t.durum, eskiTarih = t.tarih;
    t.durum = 'Tamamlandı';
    if(opt.tarih && opt.tarih !== eskiTarih) t.tarih = opt.tarih;

    if(opt.senaryo != null){
      var eskiSenaryo = t.senaryo, eskiBasarili = t.basarili, eskiBasarisiz = t.basarisiz;
      t.senaryo   = opt.senaryo;
      t.basarili  = opt.basarili;
      t.basarisiz = opt.basarisiz;
      DB.activities.unshift({
        kayit:t.kod, tarih:simdi(), kisi:GV.session.emp, metin:'Senaryo sonuçları yazıldı',
        eski:eskiSenaryo + ' senaryo · ' + eskiBasarili + ' başarılı · ' + eskiBasarisiz + ' başarısız',
        yeni:opt.senaryo + ' senaryo · ' + opt.basarili + ' başarılı · ' + opt.basarisiz + ' başarısız',
        tone:'accent', icon:'i-list' });
    }
    if(opt.tarih && opt.tarih !== eskiTarih){
      DB.activities.unshift({
        kayit:t.kod, tarih:simdi(), kisi:GV.session.emp, metin:'Koşum tarihi güncellendi',
        eski:F.date(eskiTarih), yeni:F.date(opt.tarih), tone:'info', icon:'i-calendar' });
    }
    DB.activities.unshift({
      kayit:t.kod, tarih:simdi(), kisi:GV.session.emp,
      metin:'Test koşumu tamamlandı olarak işaretlendi' + (opt.not ? ' — ' + opt.not : ''),
      eski:eskiDurum, yeni:'Tamamlandı', tone:'ok', icon:'i-check-circle' });

    GV.toast(t.kod + ' tamamlandı olarak işaretlendi', 'ok');
    setTimeout(function(){ GV.refresh(); }, 700);
  }

  function tamamlaModal(){
    var varsayilanTarih = (t.tarih && t.tarih > DB.today) ? DB.today : (t.tarih || DB.today);
    GV.modal({
      title:'Test koşumunu tamamla', text:t.kod + ' · ' + t.ad, icon:'i-check-circle', size:'lg',
      body:
        '<div class="gv-grid gv-grid-2">' +
          '<div class="field"><label for="tkTarih">Koşum tarihi<span class="req">*</span></label>' +
            '<input type="date" id="tkTarih" value="' + esc(varsayilanTarih) + '">' +
            '<span class="f-hint">Kayıtta yazılı tarih ' + esc(F.date(t.tarih)) +
              '. Tamamlanan koşum ileri tarihli olamaz — sistem tarihi ' + esc(F.date(DB.today)) + '.</span>' +
            '<span class="f-err">' + ico('i-alert','ic-sm') + 'Koşum tarihi bugünden ileri olamaz.</span></div>' +
          '<div class="field"><label for="tkNot">Kapanış notu <span class="u-faint">(opsiyonel)</span></label>' +
            '<input type="text" class="inp" id="tkNot" placeholder="Kapsam, atlanan senaryo, ortam…"></div>' +
        '</div>' +
        (kosuldu
          ? '<div class="u-mt-4">' + GV.dl([
              ['Sayacın kaynağı', kaynakRozeti()],
              ['Toplam senaryo', sayiHucre(S.senaryo)],
              ['Başarılı', sayiHucre(S.basarili, 'ok')],
              ['Başarısız', sayiHucre(S.basarisiz, S.basarisiz ? 'danger' : null)],
              (S.engellendi == null ? null : ['Engellendi', sayiHucre(S.engellendi, 'warn')]),
              (S.kosulmadi == null ? null : ['Koşulmadı', sayiHucre(S.kosulmadi)]),
              ['Başarı oranı <span class="u-faint">(' + paydaEt + ')</span>',
                GV.progress(oran, { tone:oranTon(oran) })]
            ]) + '</div>'
          : '<div class="gv-grid gv-grid-3 u-mt-4">' +
              '<div class="field"><label for="tkSenaryo">Toplam senaryo<span class="req">*</span></label>' +
                '<input type="number" class="inp" id="tkSenaryo" min="1" step="1" value="">' +
                '<span class="f-err">' + ico('i-alert','ic-sm') + 'Toplam senaryo en az 1 olmalı.</span></div>' +
              '<div class="field"><label for="tkBasarili">Başarılı<span class="req">*</span></label>' +
                '<input type="number" class="inp" id="tkBasarili" min="0" step="1" value="0"></div>' +
              '<div class="field"><label for="tkBasarisiz">Başarısız<span class="req">*</span></label>' +
                '<input type="number" class="inp" id="tkBasarisiz" min="0" step="1" value="0">' +
                '<span class="f-err">' + ico('i-alert','ic-sm') +
                  'Başarılı + başarısız toplamı, toplam senaryo sayısına eşit olmalı.</span></div>' +
            '</div>') +
        GV.notice({ tone:kosuldu ? 'info' : 'warn',
          title:kosuldu
            ? (turetilmis ? 'Senaryo sayıları sonuç kayıtlarından sayıldı' : 'Senaryo sayıları kayıttan devralındı')
            : 'Bu koşumun senaryo sonucu hiç yazılmamış',
          text:kosuldu
            ? kaynakAciklama() +
              ' Tamamlama işlemi sayaçları değiştirmez, kaydın durumunu “Tamamlandı” yapar.'
            : 'Kayıtta toplam senaryo 0 görünüyor. Koşum tamamlandı işaretlenirken sonuç sayıları da yazılır; ' +
              'başarılı ile başarısız toplamı, toplam senaryo sayısına eşit olmak zorundadır.' }),
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Tamamlandı işaretle', cls:'btn-acc', icon:'i-check', onClick:function(close, el){
            var tarihEl = el.querySelector('#tkTarih');
            var tarih = tarihEl.value;
            if(!tarih || tarih > DB.today){
              tarihEl.closest('.field').classList.add('is-invalid');
              GV.toast('Koşum tarihi bugünden ileri olamaz', 'warn');
              tarihEl.focus();
              return false;
            }
            var opt = { tarih:tarih, not:el.querySelector('#tkNot').value.trim() };

            if(!kosuldu){
              var sEl = el.querySelector('#tkSenaryo'), bEl = el.querySelector('#tkBasarili'),
                  zEl = el.querySelector('#tkBasarisiz');
              var s = parseInt(sEl.value, 10), b = parseInt(bEl.value, 10), z = parseInt(zEl.value, 10);
              if(!(s > 0)){
                sEl.closest('.field').classList.add('is-invalid');
                GV.toast('Toplam senaryo en az 1 olmalı', 'warn');
                sEl.focus();
                return false;
              }
              if(!(b >= 0) || !(z >= 0) || b + z !== s){
                zEl.closest('.field').classList.add('is-invalid');
                GV.toast('Başarılı + başarısız toplamı senaryo sayısına eşit olmalı', 'warn');
                zEl.focus();
                return false;
              }
              opt.senaryo = s; opt.basarili = b; opt.basarisiz = z;
            }
            kosumuTamamla(opt);
          } }
      ]
    });
  }

  /* =================================================================
     SENARYO ADIMLARI — [9.1.1]
     Satırın "N adım" düğmesi sağ paneli açar: adımlar `GV.test.adimlar()`
     ile SIRALI okunur, beklenen sonuç adımın kendisinde yazılıdır.
     ================================================================= */
  function adimPaneli(sonucKod){
    var c = GV.test.hataBaglami(sonucKod);
    if(!c){ GV.toast('Senaryo sonucu bulunamadı', 'warn'); return; }
    var sen = c.senaryo, r = c.sonuc;
    var adimlar = GV.test.adimlar(sen.kod);

    GV.drawer({
      title:(sen.ad || r.senaryo) + ' — adımlar',
      body:
        GV.dl([
          ['Senaryo kodu', '<span class="u-num">' + esc(sen.kod || r.senaryo) + '</span>'],
          ['Modül', sen.modul ? esc(DB.modName(sen.modul)) : null],
          ['Senaryo türü', sen.tur ? GV.badge(sen.tur) : null],
          ['Öncelik', sen.oncelik ? GV.pri(sen.oncelik) : null],
          ['Ön koşul', sen.onKosul ? '<span class="cell-wrap">' + esc(sen.onKosul) + '</span>' : null],
          ['Bu koşumdaki sonuç', GV.badge(r.sonuc, SONUC_TON[r.sonuc] || null)],
          ['Koşan', r.kosan ? GV.user(r.kosan, { sm:true }) : '<span class="u-faint">Koşulmadı</span>'],
          ['Sonuç zamanı', r.tarih ? F.dt(r.tarih) : '<span class="u-faint">—</span>'],
          ['Koşum', c.kosum.kod
            ? '<span class="u-num">' + esc(c.kosum.kod) + '</span>' +
              ' <span class="cell-sub">' + esc(c.build.surum || '—') + ' · ' + esc(c.ortam.ad || '—') + '</span>'
            : null],
          ['Koşum notu', r.not ? '<span class="cell-wrap">' + esc(r.not) + '</span>' : null],
          ['Bağlı hata', r.hata
            ? '<a href="app-proje-hata-detay.html?id=' + esc(r.hata) + '">' + esc(r.hata) + '</a>'
            : '<span class="u-faint">Yok</span>']
        ]) +
        '<div class="u-mt-8">' +
        (adimlar.length
          ? tbl('<th class="num">Sıra</th><th>Adım</th><th>Beklenen sonuç</th>',
              adimlar.map(function(x){
                return '<tr><td class="num"><span class="u-num">' + F.num(x.sira) + '</span></td>' +
                  '<td class="cell-wrap">' + esc(x.adim) + '</td>' +
                  '<td class="cell-wrap">' + esc(x.beklenen) + '</td></tr>';
              }).join(''))
          : GV.empty({ icon:'i-list', title:'Bu senaryonun adımı yazılmamış',
              desc:'Senaryo tanımı var ama adım kaydı yok; beklenen sonuç adımda tutulduğu için ' +
                   'bu senaryoda beklenen çıktı da okunamıyor.' })) +
        '</div>' +
        (c.kanit.length
          ? '<div class="u-mt-8">' + sec('Kanıt',

  /* =================================================================
     [9.1.4] — BAŞARISIZ SONUÇTAN HATA AÇMA
     Bağlam `GV.test.hataBaglami()` ile TEK yordamdan gelir; ekran kaynak

  function hataFormAdresi(c){
    var o = c.oneri, p = [];

      if(v == null || v === '') return;
      p.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    }
    ekle('proje', o.proje);
    ekle('modul', o.modul);
    ekle('baslik', o.baslik);
    ekle('surum', o.surum);
    ekle('ortam', o.ortam);
    ekle('test', o.test);
    ekle('adimMetni', o.adimMetni);
    ekle('gerceklesen', o.gerceklesen);
    ekle('sonuc', c.sonuc.kod);
    return 'app-proje-hata-form.html' + (p.length ? '?' + p.join('&') : '');
  }

      (S.engellendi == null ? null : ['Engellenen senaryo', sayiHucre(S.engellendi, 'warn')]),

        : '<span class="u-faint">Bu teste bağlı koşum kaydı yok</span>'],

              ' — sayım tutmuyor</span>')]

          text:'Senaryo · adım · koşum · sonuç · kanıt zinciri veride yazılı. Sayaçlar sonuç ' +

      ['Sayacın kaynağı', kaynakRozeti()],
      ['Toplam senaryo', kosuldu ? sayiHucre(S.senaryo) : '<span class="u-faint">0</span>'],

      ['Başarısız', kosuldu
        ? (S.basarisiz ? sayiHucre(S.basarisiz, 'danger') : '<span class="u-num u-ok">0</span>')
        : null],
      (S.engellendi == null ? null : ['Engellendi', sayiHucre(S.engellendi, 'warn')]),
      (S.kosulmadi == null ? null : ['Koşulmadı', sayiHucre(S.kosulmadi)]),
      ['Başarı oranı <span class="u-faint">(' + paydaEt + ')</span>', oran == null
        ? '<span class="u-faint">Henüz koşulmadı</span>'
        : GV.progress(oran, { tone:oranTon(oran) })],
      ['Başarısızlık oranı <span class="u-faint">(' + paydaEt + ')</span>', hataOran == null
        ? '<span class="u-faint">—</span>'
        : '<b class="u-num' + (S.basarisiz ? ' u-danger' : ' u-ok') + '">%' + F.num(hataOran) + '</b>'],
      ['Koşum durumu', GV.badge(t.durum)],
      ['Sayım tutarlılığı', turetilmis
        ? '<span class="badge is-ok no-dot">Dört sonuç sayısı toplamı = senaryo sayısı</span>'
        : (sayimTutar
            ? '<span class="badge is-ok no-dot">Tutarlı</span>'
            : '<span class="badge is-danger no-dot">Başarılı + başarısız = ' + F.num(toplamSayim) +
              ', toplam senaryo ' + F.num(S.senaryo || 0) + '</span>')]
    ]) + '</div>' +

    '<div class="gc-body' + (kosuldu ? ' flush' : '') + '">' +
    (turetilmis
      ? tbl(SONUC_BASLIK, tumSonuclar.map(sonucSatir).join('')) +
        sayac('<b>' + F.num(S.senaryo) + '</b> senaryo sonucu · <b>' + F.num(S.basarili) +
          '</b> başarılı · <b>' + F.num(S.basarisiz) + '</b> başarısız · <b>' + F.num(S.engellendi) +
          '</b> engellendi · <b>' + F.num(S.kosulmadi) + '</b> koşulmadı')
      : (kosuldu
          ? kirilim + sayac('<b>' + F.num(S.senaryo) + '</b> senaryo · <b>' + F.num(S.basarili) +
              '</b> başarılı · <b>' + F.num(S.basarisiz) +
              '</b> başarısız · bu sayılar kayıttan devralındı, senaryo adları veride tutulmuyor')
          : GV.empty({ icon:'i-list', title:'Bu koşumda senaryo sonucu yok',
              desc:'Kayıtta toplam senaryo 0 görünüyor — koşum henüz yapılmadı ya da sonuçları girilmedi. ' +
                   'Senaryo sayıları yazıldığında başarı oranı burada hesaplanır.',
              action:tamamlaBtn || '<a class="btn btn-line" href="app-proje-test.html">Test listesine dön</a>' }))) +
    '</div>' +

    (tamamlaBtn && kosuldu
      ? '<div class="gc-body"><div class="u-row u-wrap">' + tamamlaBtn + '</div></div>'
      : '') +

    (tamam
      ? '<div class="gc-body">' + GV.notice({ tone:'ok', icon:'i-check-circle', title:'Koşum tamamlandı',
          text:t.kod + ' ' + F.date(t.tarih) + ' tarihinde koşuldu ve tamamlandı olarak işaretlendi' +
               (kosuldu ? ' — ' + F.num(kosulan) + ' koşulan senaryonun %' + F.num(oran) + ' kadarı geçti.' : '.') }) + '</div>'
      : (!yetkiDuzenle
          ? '<div class="gc-body">' + GV.notice({ tone:'neutral', icon:'i-lock', title:'Koşumu tamamlama yetkisi yok',
              text:'Rolünüzde düzenleme yetkisi bulunmadığı için “Koşumu tamamla” aksiyonu hiç basılmadı. ' +
                   'Koşum durumunu test sorumlusu veya proje yöneticisi değiştirir.' }) + '</div>'
          : ''));

  /* =================================================================
     3. KOŞUMLAR — [9.1.1] koşum künyesi: build · commit · ortam · sorumlu
     Koşum kayıtları GV.test.kosumlar(), sonuçları GV.test.sonuclar() ile
     okunur. Build ve ortam sözlük araması `bul()` ile yapılır; ortak katmanda
     bu iki koleksiyon için kod→kayıt yardımcısı YOK (raporda bildirildi).
     ================================================================= */
  function kosumKunye(r){
    var b = bul(DB.builds, r.build);
    var o = bul(DB.environments, r.ortam);
    var pl = bul(DB.testPlans, r.plan);
    var sn = GV.test.sonuclar(r.kod);
    return GV.dl([
      ['Koşum kodu', '<span class="u-num">' + esc(r.kod) + '</span>'],
      ['Durum', GV.badge(r.durum)],
      ['Build sürümü', b
        ? '<span class="u-num">' + esc(b.surum) + '</span>' +
          ' <span class="cell-sub">' + esc(b.kod) + ' · ' + esc(b.durum) + ' · ' + F.date(b.tarih) + '</span>'
        : (r.build ? '<span class="u-num">' + esc(r.build) + '</span>' : null)],
      ['Commit', b && b.commit
        ? ico('i-git','ic-sm') + ' <span class="u-num">' + esc(b.commit) + '</span>'
        : null],
      ['Ortam', o
        ? ico('i-server','ic-sm') + ' ' + esc(o.ad) +
          ' <span class="cell-sub">' + esc(o.tur) + ' · ' + esc(o.url) + '</span>'
        : (r.ortam ? esc(r.ortam) : null)],
      ['Koşum sorumlusu', kisiSatir(r.sorumlu)],
      ['Build sorumlusu', b && b.sorumlu ? kisiSatir(b.sorumlu) : null],
      ['Koşum aralığı', (r.baslangic || r.bitis)
        ? '<span class="cell-date">' + F.date(r.baslangic) + ' → ' + F.date(r.bitis) + '</span>'
        : null],
      ['Test planı', pl
        ? esc(pl.ad) + ' <span class="cell-sub">' + esc(pl.kod) + ' · çıkış ölçütü: ' +
          esc(pl.cikisOlcutu) + '</span>'
        : '<span class="u-faint">Plansız koşum</span>'],
      ['Bu koşumda yazılı sonuç', sn.length
        ? '<b class="u-num">' + F.num(sn.length) + '</b>'
        : '<span class="u-faint">Sonuç satırı yok</span>']
    ]);
  }

  function kosumBlok(r){
    var sn = GV.test.sonuclar(r.kod);
    return '<div class="gc-body">' +
      sec('Koşum ' + esc(r.kod) + ' <span class="u-faint">(künye)</span>', kosumKunye(r)) + '</div>' +
      '<div class="gc-body' + (sn.length ? ' flush' : '') + '">' +
      (sn.length
        ? (!turetilmis
            ? '<div class="u-mb-8">' + GV.notice({ tone:'warn', icon:'i-alert',
                title:'Aşağıdaki satırlar bu KOŞUMUN sonuçlarıdır, testin senaryo dökümü değildir',
                text:'Test kaydının sayaçları (' + F.num(S.senaryo) + ' senaryo · ' + F.num(S.basarili) +
                     ' başarılı · ' + F.num(S.basarisiz) + ' başarısız) bu ' + F.num(sn.length) +
                     ' satırdan türetilmedi — kayıt senaryo dökümü taşımıyor, üç sayı ondan devralındı. ' +
                     'İki küme aynı şeyi ölçmüyor: burada yalnız bu koşumda yazılmış sonuçlar görünür, ' +
                     'testin tüm senaryoları değil.' }) + '</div>'
            : '') +
          tbl(SONUC_BASLIK, sn.map(sonucSatir).join('')) +
          sayac('<b>' + F.num(sn.length) + '</b> sonuç satırı bu koşumda yazılı')
        : GV.empty({ icon:'i-list', title:'Bu koşumda sonuç satırı yok',
            desc:'Koşum kaydı açıldı ama hiçbir senaryonun sonucu yazılmamış. Sonuçlar yazıldığında ' +
                 'senaryo dökümü ve sayaçlar buradan türetilir.' })) +
      '</div>';
  }

  var pKosum = kosumlar.length
    ? '<div class="gc-body">' +
      GV.notice({ tone:'info', icon:'i-play', title:'Koşum künyesi: hangi sürümde, nerede, kim koştu',
        text:'Bir test kaydı birden çok koşuma sahip olabilir; sonuç senaryoda değil KOŞUMDA tutulur, ' +
             'yoksa “geçen sefer geçmişti” bilgisi kaybolurdu. Her koşum bir build ve bir ortama bağlıdır — ' +
             'hata kaydı da bu künyeyi devralır.' }) +
      GV.dl([
        ['Test kaydı', '<span class="u-num">' + esc(t.kod) + '</span> <span class="cell-sub">' +
          esc(t.ad) + '</span>'],
        ['Koşum sayısı', '<b class="u-num">' + F.num(kosumlar.length) + '</b>'],
        ['Sayacın kaynağı', kaynakRozeti() + ' <span class="cell-sub">' +
          (turetilmis ? 'sonuç satırları sayıldı' : 'üç sayı test kaydından devralındı') + '</span>'],
        ['Hatası açılmamış başarısız sonuç', hatasiz.length
          ? '<b class="u-num u-danger">' + F.num(hatasiz.length) + '</b> <span class="cell-sub">' +
            'her biri için “Hata oluştur” aksiyonu var</span>'
          : '<span class="badge is-ok no-dot">Yok</span>' +
            '<span class="cell-sub">başarısız sonuçların hepsi hata kaydına bağlanmış</span>']
      ]) + '</div>' +
      kosumlar.map(kosumBlok).join('')
    : '<div class="gc-body flush">' + GV.empty({ icon:'i-play', title:'Bu teste bağlı koşum kaydı yok',
        desc:'Test varlık modelinde koşum, “hangi senaryo kümesi hangi build ve ortamda çalıştı” ' +
             'sorusunu yanıtlar. Bu kayıt için henüz koşum açılmamış; sayaçları test kaydından devralıyor.',
        action:'<a class="btn btn-line" href="app-proje-test.html">Test listesine dön</a>' }) + '</div>';

  /* =================================================================
     3. AÇILAN HATALAR — bağ `DB.bugs[].test` alanında YAZILI (VB-08)
     ================================================================= */
  function hataSatir(b){
    var bagli = b.test === t.kod;
    var d = fark(b.bulunma, t.tarih);
    return '<tr' + (bagli ? ' class="is-late"' : '') + '>' +
      '<td class="cell-wrap"><a class="cell-main" href="app-proje-hata-detay.html?id=' + esc(b.kod) + '">' +
        esc(b.baslik) + '</a><span class="cell-code">' + esc(b.kod) + '</span></td>' +
      '<td class="cell-wrap">' + esc(DB.modName(b.modul)) + '</td>' +
      '<td>' + GV.pri(b.siddet) + '</td>' +
      '<td>' + GV.user(b.bulan, { sm:true }) + '</td>' +
      '<td>' + GV.dateCell(b.bulunma, { done:b.durum === 'Kapandı' }) +
        (d == null ? '' : '<span class="cell-sub">' +
          (d === 0 ? 'koşumla aynı gün' : (d > 0 ? d + ' gün sonra' : (-d) + ' gün önce')) + '</span>') + '</td>' +
      '<td>' + GV.badge(b.durum) + '</td>' +
      '<td>' + (bagli
        ? '<span class="badge is-ok no-dot">Bu koşumdan</span>'
        : '<span class="tag">Aynı proje</span>') + '</td></tr>';
  }

  var pHata = '<div class="gc-body">' +
    (acilanHatalar.length
      ? GV.notice({ tone:'ok', icon:'i-link', title:'Açılan hatalar veride yazılı',
          text:'Bu koşumun açtığı ' + acilanHatalar.length + ' hata, hata kaydındaki kaynak koşum alanıyla ' +
               'bu koşuma bağlıdır — tarih yakınlığından türetilmedi. Bir hata en fazla bir koşuma bağlanır ve bağlı hata ' +
               'sayısı koşumun başarısız senaryo sayısını aşamaz; bu kural her tarama turunda ölçülür.' })
      : GV.notice({ tone:'info', icon:'i-info', title:'Bu koşumdan hata kaydı doğmadı',
          text:'Hiçbir hata kaydı kaynak koşum olarak ' + esc(t.kod) + ' kodunu göstermiyor. Aşağıdaki hatalar aynı ' +
               'projenin kayıtlarıdır ve **bağ değildir**, yalnız bağlam olarak listelenir.' })) +
    GV.dl([
      ['Koşum tarihi', GV.dateCell(t.tarih, { done:tamam })],
      ['Bu koşumdaki başarısız senaryo <span class="u-faint">(' +
        (turetilmis ? 'türetildi' : 'devralındı') + ')</span>', S.basarisiz
        ? sayiHucre(S.basarisiz, 'danger')
        : '<span class="u-num u-ok">0</span>'],
      ['Hatası açılmamış başarısız sonuç', hatasiz.length
        ? '<b class="u-num u-danger">' + F.num(hatasiz.length) + '</b>' +
          ' <span class="cell-sub">Koşumlar sekmesinde “Hata oluştur” aksiyonu var</span>'
        : (tumSonuclar.length
            ? '<span class="badge is-ok no-dot">Yok</span>' +
              '<span class="cell-sub">yazılı sonuç satırlarının başarısız olanları hataya bağlanmış</span>'
            : '<span class="u-faint">Ölçülemedi — bu kayıtta sonuç satırı tutulmuyor</span>')],
      ['Bu koşumdan açılan hata', acilanHatalar.length
        ? '<b class="u-num u-danger">' + acilanHatalar.length + '</b>'
        : '<span class="u-faint">Yok</span>'],
      ['Bu projedeki toplam hata kaydı', '<b class="u-num">' + projeHatalari.length + '</b>' +
        ' <span class="cell-sub">' + esc(proje ? proje.ad : t.proje || '—') + '</span>'],
      ['Açık hata', acikHatalar.length
        ? '<b class="u-num u-danger">' + acikHatalar.length + '</b>'
        : '<span class="badge is-ok no-dot">Yok</span>']
    ]) + '</div>' +

    '<div class="gc-body flush">' +
    (projeHatalari.length
      ? tbl('<th>Hata kaydı</th><th>Modül</th><th>Şiddet</th><th>Bulan</th><th>Bulunma</th>' +
            '<th>Durum</th><th>Bağ</th>',
          acilanHatalar.concat(digerHatalar).map(hataSatir).join('')) +
        sayac('<b>' + acilanHatalar.length + '</b> hata bu koşumdan açıldı · ' + digerHatalar.length +
          ' hata aynı projede ama başka kanaldan geldi',
          '<a class="btn btn-line btn-sm" href="app-proje-hata.html?q=' + esc(t.proje || '') + '">' +
            ico('i-bug','ic-sm') + ' Projenin hataları</a>')
      : GV.empty({ icon:'i-bug', title:'Bu projede hata kaydı yok',
          desc:'Koşumun bağlı olduğu projede kayıtlı hata bulunmuyor. Başarısız senaryolar henüz hata kaydına ' +
               'dönüştürülmemiş olabilir.',
          action:'<a class="btn btn-acc" href="app-proje-hata.html">Hata listesini aç</a>' })) +
    '</div>' +

    (hataFazlasi
      ? '<div class="gc-body">' + GV.notice({ tone:'danger', icon:'i-alert-circle',
          title:'Bağlı hata sayısı başarısız senaryo sayısını aşıyor',
          text:'Bu koşuma ' + acilanHatalar.length + ' hata bağlı ama yalnız ' + F.num(S.basarisiz) +
               ' senaryo başarısız görünüyor. İki sayıdan biri yanlış — canonical tarama bu çelişkiyi ' +
               'eksen 15\'te yakalar.' }) + '</div>'
      : (S.basarisiz && !acilanHatalar.length)
        ? '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',
            title:'Başarısız senaryo var ama bağlı hata kaydı yok',
            text:'Bu koşumda ' + F.num(S.basarisiz) + ' senaryo başarısız oldu; buna karşılık `test` alanı bu ' +
                 'koşumu gösteren hiçbir hata kaydı yok. Her düşen senaryo ayrı hata kaydı doğurmak zorunda ' +
                 'değildir, ama bu boşluk kayıtların hiç açılmadığı anlamına da gelebilir.' }) + '</div>'
        : '');

  /* =================================================================
     4. KAPSAM — `moduller` ve `sprint` alanları veride YAZILI (VB-08)
     ================================================================= */
  function modulSatir(m){
    return '<tr>' +
      '<td class="cell-wrap"><span class="cell-main">' + esc(m.ad) + '</span>' +
        '<span class="cell-code">' + esc(m.kod) + '</span></td>' +
      '<td>' + GV.badge(m.durum) + '</td>' +
      '<td>' + GV.progress(m.ilerleme) + '</td>' +
      '<td>' + GV.user(m.sorumlu, { sm:true }) + '</td>' +
      '<td class="num"><span class="u-num">' + F.num(m.efor) + '</span></td>' +
      '<td>' + (kapsamModulKod.indexOf(m.kod) !== -1
        ? '<span class="badge is-ok no-dot">Kapsamda</span>'
        : '<span class="tag">Kapsam dışı</span>') + '</td></tr>';
  }

  var testAsamasi = projeModulleri.filter(function(m){ return m.durum === 'Test'; });

  var pKapsam = '<div class="gc-body">' +
    (kapsamModulleri.length
      ? GV.notice({ tone:'ok', icon:'i-layers', title:'Koşumun kapsamı veride yazılı',
          text:'Bu koşum ' + kapsamModulleri.length + ' modülü tarıyor — kapsam koşum kaydının modül ' +
               'listesinde yazılıdır, proje modül listesinden türetilmedi. Kapsam dışındaki modüller tabloda ayrıca ' +
               'işaretlendi ki koşumun neyi kapsamadığı da okunabilsin.' })
      : GV.notice({ tone:'info', icon:'i-info', title:'Bu koşumun modül kapsamı boş',
          text:'Koşum kaydının modül listesi boş: projenin modül kırılımı tutulmuyor, bu yüzden kapsam yalnız ' +
               'proje ekseninde okunuyor. Aşağıdaki liste bağlamdır, koşumun kapsamı değildir.' })) +
    GV.dl([
      ['Proje', projeSatir()],
      ['Projenin modül sayısı', '<b class="u-num">' + projeModulleri.length + '</b>'],
      ['Test aşamasındaki modül', testAsamasi.length
        ? '<b class="u-num u-warn">' + testAsamasi.length + '</b> <span class="cell-sub">' +
          esc(testAsamasi.map(function(m){ return m.ad; }).join(' · ')) + '</span>'
        : '<span class="u-faint">Şu an test aşamasında modül yok</span>'],
      ['Koşumun kapsadığı modül', kapsamModulleri.length
        ? '<b class="u-num">' + kapsamModulleri.length + '</b> <span class="cell-sub">' +
          esc(kapsamModulleri.map(function(m){ return m.ad; }).join(' · ')) + '</span>'
        : '<span class="u-faint">Kapsam yazılı değil — proje ekseninde okunur</span>'],
      ['Sprint <span class="u-faint">(yazılı bağ)</span>', sprint
        ? esc(sprint.ad) + ' <span class="cell-sub">' + esc(sprint.kod) + ' · ' +
          esc(sprint.durum) + ' · ' + F.date(sprint.baslangic) + ' → ' + F.date(sprint.bitis) + '</span>'
        : '<span class="u-faint">Koşum hiçbir sprint aralığına düşmüyor</span>'],
      ['Sprint ilerlemesi', sprint && sprint.planlanan
        ? GV.progress(Math.round(sprint.tamamlanan / sprint.planlanan * 100)) +
          ' <span class="cell-sub">' + F.hours(sprint.tamamlanan) + ' / ' + F.hours(sprint.planlanan) + '</span>'
        : null],
      ['Projenin sprint sayısı', '<b class="u-num">' + projeSprintleri.length + '</b>'],
      ['Test ortamı <span class="u-faint">(proje kartından)</span>',
        proje && proje.test && proje.test !== '—' ? '<span class="u-num">' + esc(proje.test) + '</span>' : null],
      ['Canlı ortam <span class="u-faint">(proje kartından)</span>',
        proje && proje.canli && proje.canli !== '—' ? '<span class="u-num">' + esc(proje.canli) + '</span>' : null],
      ['Teknoloji <span class="u-faint">(proje kartından)</span>', proje && (proje.teknoloji || []).length
        ? proje.teknoloji.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join(' ')
        : null]
    ]) + '</div>' +

    '<div class="gc-body flush">' +
    (projeModulleri.length
      ? tbl('<th>Modül</th><th>Durum</th><th>İlerleme</th><th>Sorumlu</th><th class="num">Efor (sa)</th><th>Bağ</th>',
          projeModulleri.map(modulSatir).join('')) +
        sayac('<b>' + kapsamModulleri.length + '</b> modül bu koşumun kapsamında · ' + kapsamDisi.length +
          ' modül kapsam dışı',
          proje ? '<a class="btn btn-line btn-sm" href="app-proje-detay.html?id=' + esc(proje.kod) + '">' +
            ico('i-briefcase','ic-sm') + ' Projeyi aç</a>' : '')
      : GV.empty({ icon:'i-layers', title:'Bu projede modül kaydı yok',
          desc:'Koşumun bağlı olduğu projede tanımlı modül bulunmuyor; bu yüzden kapsam bağlamı gösterilemiyor. ' +
               'Modüller tanımlandığında burada listelenir.',
          action:proje
            ? '<a class="btn btn-acc" href="app-proje-detay.html?id=' + esc(proje.kod) + '">Projeyi aç</a>'
            : '<a class="btn btn-line" href="app-proje.html">Proje listesini aç</a>' })) +
    '</div>' +

    (projeSprintleri.length
      ? '<div class="gc-body">' + sec('Projenin Sprintleri <span class="u-faint">(bağlam)</span>',
          tbl('<th>Sprint</th><th>Aralık</th><th>Durum</th><th>İlerleme</th><th class="num">Görev</th><th>Bağ</th>',
            projeSprintleri.map(function(s){
              var kapsar = sprint && s.kod === sprint.kod;
              return '<tr' + (kapsar ? ' class="is-late"' : '') + '>' +
                '<td class="cell-wrap"><a class="cell-main" href="app-proje-sprint.html?q=' + esc(s.kod) + '">' +
                  esc(s.ad) + '</a><span class="cell-code">' + esc(s.kod) + '</span></td>' +
                '<td><span class="cell-date">' + F.date(s.baslangic) + ' → ' + F.date(s.bitis) + '</span></td>' +
                '<td>' + GV.badge(s.durum) + '</td>' +
                '<td>' + (s.planlanan
                  ? GV.progress(Math.round(s.tamamlanan / s.planlanan * 100))
                  : '<span class="u-faint">—</span>') + '</td>' +
                '<td class="num"><span class="u-num">' + F.num(s.gorevSayisi) + '</span></td>' +
                '<td>' + (kapsar
                  ? '<span class="badge is-warn no-dot">Koşum tarihini kapsıyor</span>'
                  : '<span class="tag">Aynı proje</span>') + '</td></tr>';
            }).join('')))+ '</div>'
      : '');

  /* =================================================================
     5. İLGİLİ TESLİM — bağ `DB.deliveries[].test` alanında YAZILI (VB-08)
     ================================================================= */
  function teslimSatir(d){
    var fk = fark(d.tarih, t.tarih);
    var bagli = d.test === t.kod;
    return '<tr' + (bagli ? ' class="is-late"' : '') + '>' +
      '<td class="cell-wrap"><a class="cell-main" href="app-proje-teslim-detay.html?id=' + esc(d.kod) + '">' +
        esc(d.ad) + '</a><span class="cell-code">' + esc(d.kod) + '</span></td>' +
      '<td>' + GV.dateCell(d.tarih, { done:d.durum === 'Onaylandı' }) +
        (fk == null ? '' : '<span class="cell-sub">' +
          (fk === 0 ? 'koşumla aynı gün' : (fk > 0 ? fk + ' gün sonra' : (-fk) + ' gün önce')) + '</span>') + '</td>' +
      '<td>' + GV.badge(d.durum) + '</td>' +
      '<td>' + GV.badge(d.musteriOnay) + '</td>' +
      '<td>' + GV.user(d.teslimEden, { sm:true }) + '</td>' +
      '<td class="cell-wrap">' + esc(d.not || '') + '</td>' +
      '<td>' + (bagli
        ? '<span class="badge is-ok no-dot">Bu koşuma bağlı</span>'
        : '<span class="tag">Aynı proje</span>') + '</td></tr>';
  }

  var ilkTeslim = bagliTeslimler[0] || null;

  var pTeslim = '<div class="gc-body">' +
    (ilkTeslim
      ? GV.notice({ tone:'ok', icon:'i-package', title:'Teslim bağı veride yazılı',
          text:'Bu koşum ' + esc(ilkTeslim.kod) + ' teslimini kabule bağlıyor — bağ teslim kaydının ' +
               'test alanında yazılıdır, tarih yakınlığından türetilmedi. Teslimin taksit ' +
               'bağı da yazılıdır; kalite zinciri böylece test → hata → teslim → taksit olarak uçtan uca okunur.' })
      : GV.notice({ tone:'info', icon:'i-info', title:'Bu koşum bir teslime bağlı değil',
          text:'Hiçbir teslim kaydı kabul testi olarak ' + esc(t.kod) + ' kodunu göstermiyor. Kabul testi olmayan koşumlar ' +
               '(regresyon, duman, yük testi) bir teslime bağlanmayabilir. Aşağıdaki teslimler aynı projenin ' +
               'kayıtlarıdır ve **bağ değildir**, yalnız bağlam olarak listelenir.' })) +
    GV.dl([
      ['Koşum tarihi', GV.dateCell(t.tarih, { done:tamam })],
      ['Bu koşuma bağlı teslim', ilkTeslim
        ? '<a href="app-proje-teslim-detay.html?id=' + esc(ilkTeslim.kod) + '">' + esc(ilkTeslim.ad) + '</a>' +
          ' <span class="cell-sub">' + esc(ilkTeslim.kod) + ' · ' + F.date(ilkTeslim.tarih) + '</span>'
        : '<span class="u-faint">Yok</span>'],
      ['Teslime kalan süre', ilkTeslim && ilkTeslim.tarih
        ? '<b class="u-num">' + F.num(Math.abs(fark(ilkTeslim.tarih, t.tarih))) + '</b> gün ' +
          '<span class="cell-sub">' + (fark(ilkTeslim.tarih, t.tarih) >= 0 ? 'koşumdan sonra' : 'koşumdan önce') + '</span>'
        : null],
      ['Teslim durumu', ilkTeslim ? GV.badge(ilkTeslim.durum) : null],
      ['Müşteri onayı', ilkTeslim ? GV.badge(ilkTeslim.musteriOnay) : null],
      ['Onay tarihi', ilkTeslim && ilkTeslim.onayTarihi ? F.date(ilkTeslim.onayTarihi) : null],
      ['Teslimin kapsadığı modül', ilkTeslim && (ilkTeslim.moduller || []).length
        ? esc(ilkTeslim.moduller.map(function(k){ return DB.modName(k); }).join(' · '))
        : null],
      ['Karşılık gelen taksit <span class="u-faint">(teslimde yazılı bağ)</span>',
        ilkTeslim && ilkTeslim.milestone
          ? '<span class="u-num">' + esc(ilkTeslim.milestone) + '</span>' +
            ' <span class="cell-sub">' + esc((DB.milestones.filter(function(m){
                return m.kod === ilkTeslim.milestone; })[0] || {}).ad || '') + '</span>'
          : null],
      ['Bu projedeki diğer teslim', '<b class="u-num">' + digerTeslimler.length + '</b>']
    ]) + '</div>' +

    '<div class="gc-body flush">' +
    (projeTeslimleri.length
      ? tbl('<th>Teslim</th><th>Tarih</th><th>Durum</th><th>Müşteri onayı</th><th>Teslim eden</th>' +
            '<th>Not</th><th>Bağ</th>',
          bagliTeslimler.concat(digerTeslimler).map(teslimSatir).join('')) +
        sayac('<b>' + bagliTeslimler.length + '</b> teslim bu koşuma bağlı · ' + digerTeslimler.length +
          ' teslim aynı projede ama bu koşuma bağlı değil',
          '<a class="btn btn-line btn-sm" href="app-proje-teslim.html">' + ico('i-package','ic-sm') +
            ' Teslim listesi</a>')
      : GV.empty({ icon:'i-package', title:'Bu projede teslim kaydı yok',
          desc:'Koşumun bağlı olduğu projede kayıtlı teslim bulunmuyor.',
          action:'<a class="btn btn-acc" href="app-proje-teslim.html">Teslim listesini aç</a>' })) +
    '</div>';

  /* =================================================================
     6. AKTİVİTE GEÇMİŞİ
     ================================================================= */
  var pAktivite = '<div class="gc-body' + (acts.length ? '' : ' flush') + '">' +
    (acts.length
      ? GV.activity(acts)
      : GV.empty({ icon:'i-activity', title:'Bu koşumda hareket yok',
          desc:'Durum değişikliği, senaryo sonucu yazımı ve tarih güncellemesi hareketleri burada listelenir. ' +
               'Bu kayıt üzerinde henüz izlenen bir değişiklik yapılmadı.',
          action:'<a class="btn btn-acc" href="app-proje-test.html">Test listesine dön</a>' })) +
    '</div>' +

    (projeActs.length
      ? '<div class="gc-body">' + sec('Projenin Hareketleri',
          GV.notice({ tone:'neutral', icon:'i-info', title:'Bu hareketler ' + proje.kod + ' projesine yazılıdır',
            text:'Aşağıdaki kayıtlar test koşumunun değil, koşumun bağlı olduğu projenin aktivite geçmişidir. ' +
                 'Bağlam olarak gösterilir.' }) +
          '<div class="u-mt-8">' + GV.activity(projeActs) + '</div>') + '</div>'
      : '');

  var panels = {
    genel:pGenel, senaryo:pSenaryo, kosum:pKosum, hata:pHata,
    kapsam:pKapsam, teslim:pTeslim, aktivite:pAktivite
  };

  /* =================================================================
     SAĞ ÖZET PANELİ
     ================================================================= */
  var aside =
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-flask') + 'Özet</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Proje', proje
        ? '<a href="app-proje-detay.html?id=' + esc(proje.kod) + '">' + esc(proje.ad) + '</a>' +
          '<span class="cell-sub">' + esc(proje.kod) + '</span>'
        : '<span class="u-faint">Projesiz</span>'],
      ['Test türü', GV.badge(t.tur)],
      ['Durum', GV.badge(t.durum)],
      ['Koşum tarihi', '<span class="cell-date">' + F.date(t.tarih) + '</span>' +
        '<span class="cell-sub">' + esc(F.rel(t.tarih)) + '</span>'],
      ['Koşan kişi', GV.user(t.sorumlu, { sm:true })],
      ['Toplam senaryo', kosuldu ? sayiHucre(S.senaryo) : '<span class="u-faint">Koşulmadı</span>'],
      ['Başarılı / başarısız', kosuldu
        ? '<b class="u-num u-ok">' + F.num(S.basarili) + '</b> / <b class="u-num' +
          (S.basarisiz ? ' u-danger' : '') + '">' + F.num(S.basarisiz) + '</b>'
        : '<span class="u-faint">—</span>'],
      ['Engellendi / koşulmadı', turetilmis
        ? '<b class="u-num u-warn">' + F.num(S.engellendi) + '</b> / <b class="u-num">' +
          F.num(S.kosulmadi) + '</b>'
        : '<span class="u-faint">Devralınan sayaçta ölçülmedi</span>'],
      ['Sayacın kaynağı', kaynakRozeti()],
      ['Koşum kaydı', S.kosum ? '<b class="u-num">' + F.num(S.kosum) + '</b>'
        : '<span class="u-faint">Yok</span>']
    ]) +
    '<div class="u-mt-8">' +
      (oran == null
        ? '<p class="u-sm u-faint">Başarı oranı için senaryo sonucu gerekiyor.</p>'
        : GV.progress(oran, { tone:oranTon(oran) })) +
    '</div></div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-bug') + 'Açtığı Hatalar</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Bu koşumdan açılan hata', acilanHatalar.length
        ? '<b class="u-num u-danger">' + acilanHatalar.length + '</b><span class="cell-sub">yazılı bağ</span>'
        : '<span class="u-faint">Yok</span>'],
      ['Projenin diğer hataları', digerHatalar.length
        ? '<b class="u-num">' + digerHatalar.length + '</b>'
        : '<span class="u-faint">Yok</span>'],
      ['Projedeki açık hata', acikHatalar.length
        ? '<b class="u-num u-danger">' + acikHatalar.length + '</b>'
        : '<span class="badge is-ok no-dot">Yok</span>'],
      /* Bağ artık İKİ eksende yazılı: hata kaydındaki `test` alanı (koşum düzeyi)
         ve sonuç kaydındaki `hata` alanı (senaryo düzeyi, [9.1.4]). */
      ['Bağ alanı', '<span class="badge is-ok no-dot">Yazılı</span>' +
        '<span class="cell-sub">hata → koşum ve sonuç → hata</span>'],
      ['Hatası açılmamış başarısız sonuç', hatasiz.length
        ? '<b class="u-num u-danger">' + F.num(hatasiz.length) + '</b>' +
          '<span class="cell-sub">Koşumlar sekmesinden hata açılabilir</span>'
        : (tumSonuclar.length
            ? '<span class="badge is-ok no-dot">Yok</span>'
            : '<span class="u-faint">Sonuç satırı tutulmuyor</span>')]
    ]) + '</div>' +
    sayac('<a class="btn btn-line btn-sm" href="app-proje-hata.html' + (t.proje ? '?q=' + esc(t.proje) : '') + '">' +
      ico('i-bug','ic-sm') + ' Projenin hataları</a>') +
    '</section>' +

    (proje
      ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-briefcase') + 'Proje</h2></div>' +
        '<div class="gc-body"><a class="cell-main" href="app-proje-detay.html?id=' + esc(proje.kod) + '">' +
          esc(proje.ad) + '</a>' +
        '<div class="cell-sub u-mb-4">' + esc(proje.musteriAd) + '</div>' + GV.progress(proje.ilerleme) +
        '<div class="u-mt-4">' + ozetListe([
          ['Durum', GV.badge(proje.durum)],
          ['Sağlık', GV.badge(proje.saglik)],
          ['Proje yöneticisi', GV.user(proje.pm, { sm:true })],
          ['Teknik sorumlu', proje.teknikSorumlu
            ? GV.user(proje.teknikSorumlu, { sm:true }) : '<span class="u-faint">—</span>'],
          ['Planlanan bitiş', '<span class="cell-date">' + F.date(proje.planlananBitis) + '</span>'],
          ['Projenin test koşumu', '<b class="u-num">' +
            DB.tests.filter(function(x){ return x.proje === proje.kod; }).length + '</b>']
        ]) + '</div></div></section>'
      : '') +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' +
    (acts.length
      ? GV.activity(acts.slice(0, 3))
      : (projeActs.length
          ? '<p class="u-sm u-faint u-mb-8">Koşum kaydında hareket yok — projenin son hareketleri:</p>' +
            GV.activity(projeActs.slice(0, 3))
          : '<p class="u-sm u-faint">Bu test koşumunda henüz kayıtlı hareket yok.</p>')) +
    '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =================================================================
     AKSİYONLAR — yetki ve durum koşulu sağlanmayan buton HİÇ basılmaz.
     Dinleyici `mount.onclick` ATAMASI ile bağlanır: atama idempotenttir,
     GV.refresh() sonrası dinleyici birikmez (ders L-16).
     ================================================================= */
  mount.onclick = function(e){
    if(e.target.closest('#btnTamamla')) return tamamlaModal();
    var a = e.target.closest('[data-adim]');
    if(a) return adimPaneli(a.getAttribute('data-adim'));
    var h = e.target.closest('[data-hata]');
    if(h) return hataOlusturModal(h.getAttribute('data-hata'));
  };
});
</script>
</body>
</html>
