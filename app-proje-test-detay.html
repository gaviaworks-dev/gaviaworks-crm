<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test Koşumu Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="proje" data-screen="test">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var yetkiDuzenle = GV.perm.can('duzenle');

  var id = new URLSearchParams(location.search).get('id') || (DB.tests[0] || {}).kod;
  var t  = DB.tests.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!t){
    mount.onclick = null;
    GV.pageHead({ eyebrow:'Proje Yönetimi', title:'Test Koşumu Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Test listesi', icon:'i-flask', href:'app-proje-test.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-flask', title:'Test koşumu bulunamadı',
      desc:'“' + esc(id || '') + '” numaralı test koşumu sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-proje-test.html">Test listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(t.kod);
  document.title = t.kod + ' — Test Koşumu — GaviaWorks CRM';

  /* =================================================================
     İLİŞKİLİ KAYITLAR
     `DB.tests` kaydı YALNIZ `proje` alanı üzerinden bağ taşır. Modül, sprint,
     hata ve teslim bağı veride YOKTUR (ölçüldü) — aşağıdaki listeler bu yüzden
     "bağ" değil, açıkça etiketlenmiş ADAY / BAĞLAM listeleridir (ders L-13).
     ================================================================= */
  var proje = t.proje ? DB.proj(t.proje) : null;
  var acts  = DB.activities.filter(function(a){ return a.kayit === t.kod; });
  var projeActs = proje ? DB.activities.filter(function(a){ return a.kayit === proje.kod; }) : [];

  var tamam   = t.durum === 'Tamamlandı';
  var kosuldu = (t.senaryo || 0) > 0;
  var oran    = kosuldu ? Math.round(t.basarili / t.senaryo * 100) : null;
  var hataOran= kosuldu ? Math.round(t.basarisiz / t.senaryo * 100) : null;
  /* Sayı tutarlılığı: başarılı + başarısız = senaryo olmalı. */
  var toplamSayim = (t.basarili || 0) + (t.basarisiz || 0);
  var sayimTutar  = toplamSayim === (t.senaryo || 0);

  function oranTon(o){ return o === 100 ? 'ok' : o >= 90 ? '' : o >= 70 ? 'warn' : 'danger'; }
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }
  /* İki tarih arasındaki gün farkı — referans ekseni DB.today (new Date() ile bugün alınmaz). */
  function fark(a, b){
    if(!a || !b) return null;
    return F.days(a) - F.days(b);
  }

  /* ---- Kapsam bağlamı: modüller ve tarihi kapsayan sprint (türetilmiş) ---- */
  var projeModulleri = proje
    ? DB.projectModules.filter(function(m){ return m.proje === proje.kod; }) : [];
  var projeSprintleri = proje
    ? DB.sprints.filter(function(s){ return s.proje === proje.kod; }) : [];
  var tarihSprint = (proje && t.tarih)
    ? (projeSprintleri.filter(function(s){
        return s.baslangic <= t.tarih && t.tarih <= s.bitis;
      })[0] || null)
    : null;

  /* ---- Aday hatalar: koşum ↔ hata bağı veride YOK ----
     Güçlü aday ölçütü, kardeş ekran app-proje-hata-detay.html ile BİREBİR aynı
     tutulur (başarısız senaryosu olan koşum + ±3 gün tarih mesafesi); iki ekran
     aynı çifte farklı sinyal vermesin diye. Bağ iddiası değildir. */
  function hataYakin(b){
    if(!t.basarisiz || !t.tarih || !b.bulunma) return false;
    return Math.abs(fark(b.bulunma, t.tarih)) <= 3;
  }
  var projeHatalari = proje
    ? DB.bugs.filter(function(b){ return b.proje === proje.kod; }) : [];
  var hataAdaylari = projeHatalari.slice().sort(function(x, y){
    var fx = hataYakin(x) ? 0 : 1, fy = hataYakin(y) ? 0 : 1;
    if(fx !== fy) return fx - fy;
    return String(y.bulunma || '').localeCompare(String(x.bulunma || ''));
  });
  var gucluHatalar = hataAdaylari.filter(hataYakin);
  var acikHatalar  = projeHatalari.filter(function(b){ return b.durum !== 'Kapandı'; });

  /* ---- İlgili teslim: koşum ↔ teslim bağı veride YOK, tarihten türetilir ---- */
  var projeTeslimleri = proje
    ? DB.deliveries.filter(function(d){ return d.proje === proje.kod; }) : [];
  var teslimSirali = projeTeslimleri.slice().sort(function(x, y){
    var dx = Math.abs(fark(x.tarih, t.tarih)), dy = Math.abs(fark(y.tarih, t.tarih));
    if(dx == null) return 1;
    if(dy == null) return -1;
    return dx - dy;
  });
  var yakinTeslim = teslimSirali[0] || null;
  var yakinFark   = yakinTeslim ? fark(yakinTeslim.tarih, t.tarih) : null;

  /* =================================================================
     YARDIMCILAR — app-sozlesme-detay.html / app-proje-hata-detay.html kalıbı
     `dt` escape EDİLMEZ (etiketler sabit yazı, eksen işareti render olmalı),
     `dd` çağıran tarafta esc()'lenmiş gelir (ders L-14).
     ================================================================= */
  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(Boolean).map(function(p){
      var bos = p[1] == null || p[1] === '';
      return '<div><dt>' + p[0] + '</dt><dd' + (bos ? ' class="is-empty"' : '') + '>' +
        (bos ? '—' : p[1]) + '</dd></div>';
    }).join('') + '</dl>';
  }
  function tbl(head, rows){
    return '<div class="gv-tablewrap is-mobilescroll"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    /* başlık escape EDİLMEZ: sayfada yazılı sabit, içinde kaynak işareti
       (<span class="u-faint">(bağlam)</span>) render edilmek zorunda (ders L-14) */
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + baslik + '</h3></div>' + govde + '</div>';
  }
  function kisiSatir(kod){
    if(!kod) return null;
    var e = DB.emp(kod);
    if(!e) return GV.user(kod, { sm:true });
    return '<a href="app-personel-detay.html?id=' + esc(e.kod) + '">' + GV.user(kod, { sm:true }) + '</a>' +
      ' <span class="cell-sub">' + esc(e.pozisyon) + ' · ' + esc(e.depAd) + '</span>';
  }
  function projeSatir(){
    if(!proje) return '<span class="u-faint">Projesiz koşum</span>';
    return '<a href="app-proje-detay.html?id=' + esc(proje.kod) + '">' + esc(proje.ad) + '</a>' +
      ' <span class="cell-sub">' + esc(proje.kod) + ' · ' + esc(proje.tur) + ' · ' + esc(proje.durum) + '</span>';
  }
  function sayiHucre(n, ton){
    if(n == null) return '<span class="u-faint">—</span>';
    return '<b class="u-num' + (ton ? ' u-' + ton : '') + '">' + F.num(n) + '</b>';
  }

  /* =================================================================
     MUTASYON — location.reload() KULLANILMAZ (ders L-15).
     Mock veri bellekte durur; reload script'leri baştan koşar ve değişikliği
     siler. Doğrusu: setTimeout(GV.refresh, 700).
     ================================================================= */
  function kosumuTamamla(opt){
    var eskiDurum = t.durum, eskiTarih = t.tarih;
    t.durum = 'Tamamlandı';
    if(opt.tarih && opt.tarih !== eskiTarih) t.tarih = opt.tarih;

    if(opt.senaryo != null){
      var eskiSenaryo = t.senaryo, eskiBasarili = t.basarili, eskiBasarisiz = t.basarisiz;
      t.senaryo   = opt.senaryo;
      t.basarili  = opt.basarili;
      t.basarisiz = opt.basarisiz;
      DB.activities.unshift({
        kayit:t.kod, tarih:simdi(), kisi:GV.session.ad, metin:'Senaryo sonuçları yazıldı',
        eski:eskiSenaryo + ' senaryo · ' + eskiBasarili + ' başarılı · ' + eskiBasarisiz + ' başarısız',
        yeni:opt.senaryo + ' senaryo · ' + opt.basarili + ' başarılı · ' + opt.basarisiz + ' başarısız',
        tone:'accent', icon:'i-list' });
    }
    if(opt.tarih && opt.tarih !== eskiTarih){
      DB.activities.unshift({
        kayit:t.kod, tarih:simdi(), kisi:GV.session.ad, metin:'Koşum tarihi güncellendi',
        eski:F.date(eskiTarih), yeni:F.date(opt.tarih), tone:'info', icon:'i-calendar' });
    }
    DB.activities.unshift({
      kayit:t.kod, tarih:simdi(), kisi:GV.session.ad,
      metin:'Test koşumu tamamlandı olarak işaretlendi' + (opt.not ? ' — ' + opt.not : ''),
      eski:eskiDurum, yeni:'Tamamlandı', tone:'ok', icon:'i-check-circle' });

    GV.toast(t.kod + ' tamamlandı olarak işaretlendi', 'ok');
    setTimeout(function(){ GV.refresh(); }, 700);
  }

  function tamamlaModal(){
    var varsayilanTarih = (t.tarih && t.tarih > DB.today) ? DB.today : (t.tarih || DB.today);
    GV.modal({
      title:'Test koşumunu tamamla', text:t.kod + ' · ' + t.ad, icon:'i-check-circle', size:'lg',
      body:
        '<div class="gv-grid gv-grid-2">' +
          '<div class="field"><label for="tkTarih">Koşum tarihi<span class="req">*</span></label>' +
            '<input type="date" id="tkTarih" value="' + esc(varsayilanTarih) + '">' +
            '<span class="f-hint">Kayıtta yazılı tarih ' + esc(F.date(t.tarih)) +
              '. Tamamlanan koşum ileri tarihli olamaz — sistem tarihi ' + esc(F.date(DB.today)) + '.</span>' +
            '<span class="f-err">' + ico('i-alert','ic-sm') + 'Koşum tarihi bugünden ileri olamaz.</span></div>' +
          '<div class="field"><label for="tkNot">Kapanış notu <span class="u-faint">(opsiyonel)</span></label>' +
            '<input type="text" class="inp" id="tkNot" placeholder="Kapsam, atlanan senaryo, ortam…"></div>' +
        '</div>' +
        (kosuldu
          ? '<div class="u-mt-4">' + dl([
              ['Toplam senaryo', sayiHucre(t.senaryo)],
              ['Başarılı', sayiHucre(t.basarili, 'ok')],
              ['Başarısız', sayiHucre(t.basarisiz, t.basarisiz ? 'danger' : null)],
              ['Başarı oranı', GV.progress(oran, { tone:oranTon(oran) })]
            ]) + '</div>'
          : '<div class="gv-grid gv-grid-3 u-mt-4">' +
              '<div class="field"><label for="tkSenaryo">Toplam senaryo<span class="req">*</span></label>' +
                '<input type="number" class="inp" id="tkSenaryo" min="1" step="1" value="">' +
                '<span class="f-err">' + ico('i-alert','ic-sm') + 'Toplam senaryo en az 1 olmalı.</span></div>' +
              '<div class="field"><label for="tkBasarili">Başarılı<span class="req">*</span></label>' +
                '<input type="number" class="inp" id="tkBasarili" min="0" step="1" value="0"></div>' +
              '<div class="field"><label for="tkBasarisiz">Başarısız<span class="req">*</span></label>' +
                '<input type="number" class="inp" id="tkBasarisiz" min="0" step="1" value="0">' +
                '<span class="f-err">' + ico('i-alert','ic-sm') +
                  'Başarılı + başarısız toplamı, toplam senaryo sayısına eşit olmalı.</span></div>' +
            '</div>') +
        GV.notice({ tone:kosuldu ? 'info' : 'warn',
          title:kosuldu ? 'Senaryo sayıları kayıttan geldi' : 'Bu koşumun senaryo sonucu hiç yazılmamış',
          text:kosuldu
            ? 'Test kaydı senaryo bazlı döküm tutmuyor; yalnız toplam / başarılı / başarısız sayıları var. ' +
              'Tamamlama işlemi bu üç sayıyı değiştirmez, kaydın durumunu “Tamamlandı” yapar.'
            : 'Kayıtta toplam senaryo 0 görünüyor. Koşum tamamlandı işaretlenirken sonuç sayıları da yazılır; ' +
              'başarılı ile başarısız toplamı, toplam senaryo sayısına eşit olmak zorundadır.' }),
      actions:[
        { label:'Vazgeç', cls:'btn-line' },
        { label:'Tamamlandı işaretle', cls:'btn-acc', icon:'i-check', onClick:function(close, el){
            var tarihEl = el.querySelector('#tkTarih');
            var tarih = tarihEl.value;
            if(!tarih || tarih > DB.today){
              tarihEl.closest('.field').classList.add('is-invalid');
              GV.toast('Koşum tarihi bugünden ileri olamaz', 'warn');
              tarihEl.focus();
              return false;
            }
            var opt = { tarih:tarih, not:el.querySelector('#tkNot').value.trim() };

            if(!kosuldu){
              var sEl = el.querySelector('#tkSenaryo'), bEl = el.querySelector('#tkBasarili'),
                  zEl = el.querySelector('#tkBasarisiz');
              var s = parseInt(sEl.value, 10), b = parseInt(bEl.value, 10), z = parseInt(zEl.value, 10);
              if(!(s > 0)){
                sEl.closest('.field').classList.add('is-invalid');
                GV.toast('Toplam senaryo en az 1 olmalı', 'warn');
                sEl.focus();
                return false;
              }
              if(!(b >= 0) || !(z >= 0) || b + z !== s){
                zEl.closest('.field').classList.add('is-invalid');
                GV.toast('Başarılı + başarısız toplamı senaryo sayısına eşit olmalı', 'warn');
                zEl.focus();
                return false;
              }
              opt.senaryo = s; opt.basarili = b; opt.basarisiz = z;
            }
            kosumuTamamla(opt);
          } }
      ]
    });
  }

  /* Ölü buton yasağı: yetki yoksa ya da koşum zaten tamamlandıysa buton HİÇ basılmaz. */
  var tamamlaBtn = (yetkiDuzenle && !tamam)
    ? '<button type="button" class="btn btn-acc" id="btnTamamla">' +
      ico('i-check-circle') + ' Koşumu tamamla</button>'
    : '';

  /* =================================================================
     SAYFA BAŞLIĞI
     ================================================================= */
  var phActions = [
    { label:'Test listesi', icon:'i-flask', href:'app-proje-test.html' },
    { label:'Hatalar', icon:'i-bug', href:'app-proje-hata.html' + (t.proje ? '?q=' + t.proje : '') }
  ];
  if(proje) phActions.push({ label:'Proje', icon:'i-briefcase', href:'app-proje-detay.html?id=' + proje.kod });

  GV.pageHead({
    eyebrow:'Proje Yönetimi', title:'Test Koşumu Detayı',
    sub:t.kod + ' · ' + (proje ? proje.ad : 'Projesiz') + ' · ' + t.ad,
    actions:phActions
  });

  /* =================================================================
     KAYIT BAŞLIĞI — kod + durum + tür + başlık
     ================================================================= */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + esc(t.kod) + '</span>' +
        GV.badge(t.durum) +
        GV.badge(t.tur) +
        (t.basarisiz ? '<span class="badge is-danger">' + F.num(t.basarisiz) + ' başarısız senaryo</span>' : '') +
        (!kosuldu ? '<span class="badge is-warn no-dot">Senaryo koşulmadı</span>' : '') +
        (!sayimTutar ? '<span class="badge is-danger no-dot">Sayım tutmuyor</span>' : '') +
        (t.aktif === false ? '<span class="tag">Arşiv</span>' : '') + '</div>' +
      '<h1>' + esc(t.ad) + '</h1>' +
      '<div class="gv-rec-meta">' +
        (proje ? '<span>' + ico('i-briefcase','ic-sm') +
          '<a href="app-proje-detay.html?id=' + esc(proje.kod) + '">' + esc(proje.ad) + '</a></span>' : '') +
        '<span>' + ico('i-flask','ic-sm') + esc(t.tur) + ' testi</span>' +
        '<span>' + ico('i-user','ic-sm') + 'Koşan ' + esc(DB.empName(t.sorumlu)) + '</span>' +
        '<span>' + ico('i-calendar','ic-sm') + F.date(t.tarih) + '</span>' +
        '<span>' + ico('i-list','ic-sm') + (kosuldu ? F.num(t.senaryo) + ' senaryo' : 'Senaryo yazılmadı') + '</span>' +
        (oran != null ? '<span>' + ico('i-percent','ic-sm') + '%' + F.num(oran) + ' başarı</span>' : '') +
      '</div>' +
    '</div></div>';

  /* =================================================================
     SEKMELER
     ================================================================= */
  var tabs = [
    { key:'genel',    lbl:'Genel',              ic:'i-info' },
    { key:'senaryo',  lbl:'Senaryo Sonuçları',  ic:'i-list',     cnt:t.senaryo || 0 },
    { key:'hata',     lbl:'Açılan Hatalar',     ic:'i-bug',      cnt:hataAdaylari.length },
    { key:'kapsam',   lbl:'Kapsam',             ic:'i-layers',   cnt:projeModulleri.length },
    { key:'teslim',   lbl:'İlgili Teslim',      ic:'i-package',  cnt:projeTeslimleri.length },
    { key:'aktivite', lbl:'Aktivite Geçmişi',   ic:'i-activity', cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* =================================================================
     1. GENEL — DB.tests alanlarının TAMAMI
     (kod · proje · ad · tur · senaryo · basarili · basarisiz · sorumlu ·
      tarih · durum · aktif — on bir alanın hepsi aşağıda)
     ================================================================= */
  var pGenel = '<div class="gc-body">' +
    sec('Koşum Kimliği', dl([
      ['Test kodu', '<span class="u-num">' + esc(t.kod) + '</span>'],
      ['Test adı', '<span class="cell-wrap">' + esc(t.ad) + '</span>'],
      ['Test türü', GV.badge(t.tur)],
      ['Durum', GV.badge(t.durum)],
      ['Kayıt durumu', t.aktif === false
        ? '<span class="tag">Arşivlendi</span>'
        : '<span class="badge is-ok no-dot">Aktif kayıt</span>']
    ])) +

    sec('Kapsam ve Sorumluluk', dl([
      ['Proje', projeSatir()],
      ['Müşteri', proje
        ? (proje.musteri
            ? '<a href="app-musteri-detay.html?id=' + esc(proje.musteri) + '">' + esc(proje.musteriAd) + '</a>' +
              ' <span class="cell-sub">' + esc(proje.musteri) + ' · projeden devralındı</span>'
            : esc(proje.musteriAd))
        : null],
      ['Koşan kişi <span class="u-faint">(sorumlu)</span>', kisiSatir(t.sorumlu)],
      ['Proje yöneticisi', proje ? kisiSatir(proje.pm) : null],
      ['Teknik sorumlu', proje && proje.teknikSorumlu ? kisiSatir(proje.teknikSorumlu) : null],
      ['Proje sağlığı', proje ? GV.badge(proje.saglik) : null]
    ])) +

    sec('Senaryo Sayıları', dl([
      ['Toplam senaryo', kosuldu ? sayiHucre(t.senaryo) : '<span class="u-faint">0 — koşulmadı</span>'],
      ['Başarılı senaryo', kosuldu ? sayiHucre(t.basarili, 'ok') : null],
      ['Başarısız senaryo', kosuldu
        ? (t.basarisiz ? sayiHucre(t.basarisiz, 'danger') : '<span class="u-num u-ok">0</span>')
        : null],
      ['Başarı oranı', oran == null
        ? '<span class="u-faint">Henüz koşulmadı</span>'
        : GV.progress(oran, { tone:oranTon(oran) })],
      ['Sayım tutarlılığı', sayimTutar
        ? '<span class="badge is-ok no-dot">Başarılı + başarısız = toplam senaryo</span>'
        : '<span class="badge is-danger no-dot">' + F.num(toplamSayim) + ' ≠ ' + F.num(t.senaryo || 0) +
          ' — sayım tutmuyor</span>']
    ])) +

    sec('Tarih', dl([
      ['Koşum tarihi', GV.dateCell(t.tarih, { done:tamam }) +
        ' <span class="cell-sub">' + esc(F.dateLong(t.tarih)) + '</span>'],
      ['Bugüne göre', '<span class="cell-sub">' + esc(F.rel(t.tarih)) + '</span>'],
      ['Bugün <span class="u-faint">(sistem tarihi)</span>', F.date(DB.today)],
      ['Kapsayan sprint <span class="u-faint">(türetilmiş — koşumda sprint alanı yok)</span>', tarihSprint

          desc:'Durum değişikliği, senaryo sonucu yazımı ve tarih güncellemesi hareketleri burada listelenir. ' +
               'Bu kayıt üzerinde henüz izlenen bir değişiklik yapılmadı.',
          action:'<a class="btn btn-acc" href="app-proje-test.html">Test listesine dön</a>' })) +
    '</div>' +

    (projeActs.length
      ? '<div class="gc-body">' + sec('Projenin Hareketleri',
          GV.notice({ tone:'neutral', icon:'i-info', title:'Bu hareketler ' + proje.kod + ' projesine yazılıdır',
            text:'Aşağıdaki kayıtlar test koşumunun değil, koşumun bağlı olduğu projenin aktivite geçmişidir. ' +
                 'Bağlam olarak gösterilir.' }) +
          '<div class="u-mt-8">' + GV.activity(projeActs) + '</div>') + '</div>'
      : '');

  var panels = {
    genel:pGenel, senaryo:pSenaryo, hata:pHata,
    kapsam:pKapsam, teslim:pTeslim, aktivite:pAktivite
  };

  /* =================================================================
     SAĞ ÖZET PANELİ
     ================================================================= */
  var aside =
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-flask') + 'Özet</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Proje', proje
        ? '<a href="app-proje-detay.html?id=' + esc(proje.kod) + '">' + esc(proje.ad) + '</a>' +
          '<span class="cell-sub">' + esc(proje.kod) + '</span>'
        : '<span class="u-faint">Projesiz</span>'],
      ['Test türü', GV.badge(t.tur)],
      ['Durum', GV.badge(t.durum)],
      ['Koşum tarihi', '<span class="cell-date">' + F.date(t.tarih) + '</span>' +
        '<span class="cell-sub">' + esc(F.rel(t.tarih)) + '</span>'],
      ['Koşan kişi', GV.user(t.sorumlu, { sm:true })],
      ['Toplam senaryo', kosuldu ? sayiHucre(t.senaryo) : '<span class="u-faint">Koşulmadı</span>'],
      ['Başarılı / başarısız', kosuldu
        ? '<b class="u-num u-ok">' + F.num(t.basarili) + '</b> / <b class="u-num' +
          (t.basarisiz ? ' u-danger' : '') + '">' + F.num(t.basarisiz) + '</b>'
        : '<span class="u-faint">—</span>']
    ]) +
    '<div class="u-mt-8">' +
      (oran == null
        ? '<p class="u-sm u-faint">Başarı oranı için senaryo sonucu gerekiyor.</p>'
        : GV.progress(oran, { tone:oranTon(oran) })) +
    '</div></div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-bug') + 'Açtığı Hatalar</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Aday hata kaydı', hataAdaylari.length
        ? '<b class="u-num">' + hataAdaylari.length + '</b><span class="cell-sub">aynı projede</span>'
        : '<span class="u-faint">Yok</span>'],
      ['Güçlü aday <span class="u-faint">(±3 gün)</span>', gucluHatalar.length
        ? '<b class="u-num u-warn">' + gucluHatalar.length + '</b>'
        : '<span class="u-faint">Yok</span>'],
      ['Projedeki açık hata', acikHatalar.length
        ? '<b class="u-num u-danger">' + acikHatalar.length + '</b>'
        : '<span class="badge is-ok no-dot">Yok</span>'],
      ['Bağ alanı', '<span class="badge is-danger no-dot">Yok</span>' +
        '<span class="cell-sub">sayı bağ değil, adaydır</span>']
    ]) + '</div>' +
    sayac('<a class="btn btn-line btn-sm" href="app-proje-hata.html' + (t.proje ? '?q=' + esc(t.proje) : '') + '">' +
      ico('i-bug','ic-sm') + ' Projenin hataları</a>') +
    '</section>' +

    (proje
      ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-briefcase') + 'Proje</h2></div>' +
        '<div class="gc-body"><a class="cell-main" href="app-proje-detay.html?id=' + esc(proje.kod) + '">' +
          esc(proje.ad) + '</a>' +
        '<div class="cell-sub u-mb-4">' + esc(proje.musteriAd) + '</div>' + GV.progress(proje.ilerleme) +
        '<div class="u-mt-4">' + ozetListe([
          ['Durum', GV.badge(proje.durum)],
          ['Sağlık', GV.badge(proje.saglik)],
          ['Proje yöneticisi', GV.user(proje.pm, { sm:true })],
          ['Teknik sorumlu', proje.teknikSorumlu
            ? GV.user(proje.teknikSorumlu, { sm:true }) : '<span class="u-faint">—</span>'],
          ['Planlanan bitiş', '<span class="cell-date">' + F.date(proje.planlananBitis) + '</span>'],
          ['Projenin test koşumu', '<b class="u-num">' +
            DB.tests.filter(function(x){ return x.proje === proje.kod; }).length + '</b>']
        ]) + '</div></div></section>'
      : '') +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' +
    (acts.length
      ? GV.activity(acts.slice(0, 3))
      : (projeActs.length
          ? '<p class="u-sm u-faint u-mb-8">Koşum kaydında hareket yok — projenin son hareketleri:</p>' +
            GV.activity(projeActs.slice(0, 3))
          : '<p class="u-sm u-faint">Bu test koşumunda henüz kayıtlı hareket yok.</p>')) +
    '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =================================================================
     AKSİYONLAR — yetki ve durum koşulu sağlanmayan buton HİÇ basılmaz.
     Dinleyici `mount.onclick` ATAMASI ile bağlanır: atama idempotenttir,
     GV.refresh() sonrası dinleyici birikmez (ders L-16).
     ================================================================= */
  mount.onclick = function(e){
    if(e.target.closest('#btnTamamla')) return tamamlaModal();
  };
});
</script>
</body>
</html>
