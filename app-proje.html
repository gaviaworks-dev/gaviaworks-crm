<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Projeler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="proje" data-screen="proje">
<a class="gv-skip" href="#gvMain">İçeriğe atla</a>

<div class="gv-app">
  <aside class="gv-rail" id="gvRail"></aside>
  <nav class="gv-menu" id="gvMenu"></nav>
  <button type="button" class="gv-divider" id="gvDivider" aria-label="Menüyü daralt veya genişlet">
    <span><svg class="ic ic-sm" aria-hidden="true"><use href="#i-chev-left"></use></svg></span>
  </button>
  <div class="gv-overlay" id="gvOverlay"></div>
  <header class="gv-top" id="gvTop"></header>

  <main class="gv-main" id="gvMain">
    <div class="gv-page">
      <nav class="gv-crumb" id="gvCrumb" aria-label="Konum"></nav>
      <div class="gv-page-head">
        <div>
          <div class="ph-eyebrow">Teslimat</div>
          <h1>Projeler</h1>
          <div class="ph-sub" data-listcount>—</div>
        </div>
        <div class="ph-actions">
          <a class="btn btn-line" href="app-proje-milestone.html">
            <svg class="ic" aria-hidden="true"><use href="#i-milestone"></use></svg> Milestone
          </a>
          <a class="btn btn-acc" href="app-proje-form.html">
            <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg> Yeni Proje
          </a>
        </div>
      </div>
      <div id="liste"></div>
    </div>
  </main>
</div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, canFinans = GV.perm.can('finans');
  var aktif = function(p){ return p.durum !== 'Teslim' && !p.arsiv; };
  var geciken = function(p){ return aktif(p) && p.planlananBitis && F.days(p.planlananBitis) < 0; };

  GV.list({
    mount:'#liste', id:'proje', key:'kod', source:function(){ return DB.projects; },
    exportName:'projeler', exportTitle:'Proje Listesi', pageSize:10, views:['table','card','kanban'],
    search:{ placeholder:'Proje, müşteri, teknoloji veya proje kodu ara',
             fields:['kod','ad','musteriAd','tur','teknoloji','faz'] },
    defaultSort:'planlananBitis',

    kpis:[
      { label:'Aktif proje', icon:'i-briefcase', calc:function(a){ return a.filter(aktif).length; } },
      { label:'Geciken proje', icon:'i-alert', tone:'danger', calc:function(a){ return a.filter(geciken).length; } },
      { label:'Riskli proje', icon:'i-alert-circle', tone:'warn',
        calc:function(a){ return a.filter(function(p){ return p.saglik === 'Riskli'; }).length; } },
      { label:'Toplam sözleşme', icon:'i-wallet', tone:'ok', format:F.moneyK,
        calc:function(a){ return canFinans ? a.filter(aktif).reduce(function(s,p){ return s + p.sozlesmeTutari; }, 0) : 0; } }
    ],

    tabs:[
      { key:'aktif',    label:'Aktif Projeler',  icon:'i-briefcase',    filter:aktif },
      { key:'planlama', label:'Planlama',        icon:'i-clipboard',    filter:function(p){ return p.durum === 'Planlama'; } },
      { key:'gelistirme', label:'Geliştirme',    icon:'i-code',         filter:function(p){ return p.durum === 'Geliştirme'; } },
      { key:'test',     label:'Test',            icon:'i-flask',        filter:function(p){ return p.durum === 'Test'; } },
      { key:'geciken',  label:'Gecikenler',      icon:'i-alert',        filter:geciken },
      { key:'riskli',   label:'Riskli',          icon:'i-alert-circle', filter:function(p){ return p.saglik === 'Riskli'; } },
      { key:'teslim',   label:'Teslim Edilenler',icon:'i-check-circle', filter:function(p){ return p.durum === 'Teslim'; } },
      { key:'tumu',     label:'Tümü',            icon:'i-list',         filter:null }
    ],

    columns:[
      { key:'ad', label:'Proje', width:'26%', cellClass:'cell-wrap', locked:true,
        render:function(p){ return '<a class="cell-main" href="app-proje-detay.html?id=' + p.kod + '">' + GV.esc(p.ad) + '</a>' +
          '<span class="cell-code">' + p.kod + ' · ' + GV.esc(p.tur) + '</span>'; } },
      { key:'musteriAd', label:'Müşteri', render:function(p){
          return '<a class="cell-main" href="app-musteri-detay.html?id=' + p.musteri + '">' + GV.esc(p.musteriAd) + '</a>'; } },
      { key:'pm', label:'Proje yöneticisi', render:function(p){ return GV.user(p.pm, { sm:true }); },
        sortValue:function(p){ return DB.empName(p.pm); }, exportValue:function(p){ return DB.empName(p.pm); } },
      { key:'ekip', label:'Ekip', sortable:false, visible:false, render:function(p){
          return '<span class="gv-user-stack">' + p.ekip.slice(0,4).map(function(e){
            var emp = DB.emp(e) || {};
            return '<span class="gv-user-ava is-sm" title="' + GV.esc(emp.ad || e) + '">' + GV.esc(emp.ini || '?') + '</span>';
          }).join('') + '</span>' + (p.ekip.length > 4 ? '<span class="cell-sub">+' + (p.ekip.length - 4) + '</span>' : ''); },
        exportValue:function(p){ return p.ekip.map(DB.empName).join(', '); } },
      { key:'ilerleme', label:'İlerleme', render:function(p){ return GV.progress(p.ilerleme); } },
      { key:'planlananBitis', label:'Planlanan bitiş', render:function(p){
          return GV.dateCell(p.planlananBitis, { done:p.durum === 'Teslim' }); } },
      { key:'sozlesmeTutari', label:'Sözleşme', cellClass:'num', render:function(p){
          return canFinans ? '<span class="cell-money">' + F.money(p.sozlesmeTutari) + '</span>' : '<span class="cell-mask">••••••</span>'; },
        exportValue:function(p){ return canFinans ? p.sozlesmeTutari : ''; } },
      { key:'gerceklesenMaliyet', label:'Bütçe kullanımı', visible:false, cellClass:'num', render:function(p){
          if(!canFinans) return '<span class="cell-mask">••••</span>';
          var o = Math.round(p.gerceklesenMaliyet / p.butce * 100);
          return GV.progress(o, { tone:o > 100 ? 'danger' : o > 85 ? 'warn' : 'ok' }); },
        exportValue:function(p){ return canFinans ? Math.round(p.gerceklesenMaliyet / p.butce * 100) + '%' : ''; } },
      { key:'harcananSure', label:'Süre kullanımı', visible:false, cellClass:'num', render:function(p){
          return '<span class="u-num">' + F.hours(p.harcananSure) + ' / ' + F.hours(p.tahminiSure) + '</span>'; } },
      { key:'saglik', label:'Sağlık', render:function(p){
          var t = p.saglik === 'İyi' ? 'is-ok' : p.saglik === 'Riskli' ? 'is-danger' : 'is-warn';
          return '<span class="badge ' + t + '">' + GV.esc(p.saglik) + '</span>'; } },
      { key:'durum', label:'Durum', render:function(p){ return GV.badge(p.durum); } }
    ],

    filters:[
      { key:'durum', label:'Proje durumu', type:'multi', options:['Planlama','Geliştirme','Test','Teslim','Askıda'] },
      { key:'saglik', label:'Proje sağlığı', type:'select', options:['İyi','Dikkat','Riskli'] },
      { key:'musteri', label:'Müşteri', type:'select',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'pm', label:'Proje yöneticisi', type:'select',
        options:DB.employees.filter(function(e){ return e.roller.indexOf('pm') !== -1 || e.rol === 'sahip'; })
                            .map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'tur', label:'Proje türü', type:'multi', options:DB.services },
      { key:'oncelik', label:'Öncelik', type:'select', options:DB.priorities },
      { key:'planlananBitis', label:'Planlanan bitiş', type:'daterange' }
    ],

    rowClass:function(p){ return geciken(p) ? 'is-late' : ''; },

    kanban:{ groupBy:'durum', columns:['Planlama','Geliştirme','Test','Teslim'],
      card:function(p){
        return '<a class="gv-kcard-title" href="app-proje-detay.html?id=' + p.kod + '">' + GV.esc(p.ad) + '</a>' +
          '<div class="gv-kcard-meta"><span>' + GV.esc(p.musteriAd) + '</span></div>' +
          GV.progress(p.ilerleme) +
          '<div class="gv-kcard-meta">' + GV.user(p.pm, { sm:true }) + GV.dateCell(p.planlananBitis) + '</div>';
      } },

    card:function(p){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-proje-detay.html?id=' + p.kod + '">' + GV.esc(p.ad) + '</a>' +
        '<div class="cell-code">' + p.kod + '</div></div>' +
        '<span class="badge ' + (p.saglik === 'İyi' ? 'is-ok' : p.saglik === 'Riskli' ? 'is-danger' : 'is-warn') + '">' + GV.esc(p.saglik) + '</span></div>' +
        '<div class="gv-rcard-meta"><span>' + GV.esc(p.musteriAd) + '</span><span>' + GV.esc(p.tur) + '</span></div>' +
        GV.progress(p.ilerleme) +
        '<div class="gv-rcard-foot">' + GV.user(p.pm, { sm:true }) + GV.dateCell(p.planlananBitis) + '</div>';
    },

    mobile:function(p){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-proje-detay.html?id=' + p.kod + '">' + GV.esc(p.ad) + '</a>' +
        GV.badge(p.durum) + '</div>' +
        '<div class="gv-mrow-code">' + p.kod + ' · ' + GV.esc(p.musteriAd) + '</div>' +
        '<div class="u-mt-0">' + GV.progress(p.ilerleme) + '</div>' +
        '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.user(p.pm, { sm:true }) + '</span>' +
        GV.dateCell(p.planlananBitis) + '</div>';
    },

    rowActions:[
      { key:'ac', icon:'i-external', label:'Proje kartını aç', href:function(p){ return 'app-proje-detay.html?id=' + p.kod; } },
      { key:'gorev', icon:'i-tasks', label:'Projenin görevleri', href:function(p){ return 'app-gorev.html?t=proje&f_proje=' + p.kod; } },
      { key:'duzenle', icon:'i-edit', label:'Düzenle', href:function(p){ return 'app-proje-form.html?id=' + p.kod; } }
    ],

    bulk:[
      { key:'pm', label:'Proje yöneticisi ata', icon:'i-user-check' },
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true },
      { key:'arsiv', label:'Arşivle', icon:'i-archive', tone:'danger', confirm:'{n} proje arşivlenecek. Onaylıyor musunuz?' }
    ],

    emptyState:{ icon:'i-briefcase', title:'Bu görünümde proje yok',
      desc:'Filtreleri değiştirebilir veya kazanılan bir satıştan yeni proje oluşturabilirsiniz.',
      action:'<a class="btn btn-acc" href="app-proje-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Proje</a>' }
  });
});
</script>
</body>
</html>
