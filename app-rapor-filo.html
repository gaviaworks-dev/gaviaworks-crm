<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Filo Raporları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="rapor" data-screen="raporfilo">
<div id="rapor"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, canFinans = GV.perm.can('finans');

  /* =================================================================
     0. SÖZLÜK, KAYIT ARAYICILAR VE TÜRETİLMİŞ ÖLÇÜLER
     Referans tarih daima DB.today (2026-08-03) — new Date() kullanılmaz.
     ================================================================= */
  var AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

  function arc(k){ return DB.vehicles.filter(function(v){ return v.kod === k; })[0] || null; }
  function plaka(k){ var v = arc(k); return v ? v.plaka : (k || '—'); }
  function aracLink(k){ var v = arc(k); return 'app-arac.html?q=' + encodeURIComponent(v ? v.plaka : (k || '')); }
  function depKisa(k){ var d = DB.dep(k); return d ? d.kisa : '—'; }
  function prj(k){ return DB.projects.filter(function(p){ return p.kod === k; })[0] || null; }
  function projeAd(k){ var p = prj(k); return p ? p.ad : (k || 'Tahsis edilmemiş'); }

  function bakimOf(k){ return DB.maintenance.filter(function(m){ return m.arac === k; }); }
  function servisKaydi(k){ return bakimOf(k).filter(function(m){ return m.durum === 'Serviste'; })[0] || null; }
  function mynOf(k){ return DB.inspections.filter(function(i){ return i.arac === k; })[0] || null; }
  function polOf(k, tur){ return DB.policies.filter(function(p){ return p.arac === k && p.tur === tur; })[0] || null; }
  function gidOf(k){ return DB.vehicleExpenses.filter(function(g){ return g.arac === k; }); }
  function yktOf(k){ return DB.fuelLogs.filter(function(y){ return y.arac === k; }); }
  function cezOf(k){ return DB.fines.filter(function(c){ return c.arac === k; }); }
  function kzaOf(k){ return DB.accidents.filter(function(a){ return a.arac === k; }); }

  function gidTop(k){ return gidOf(k).reduce(function(s, g){ return s + (g.tutar || 0); }, 0); }
  function gidTur(k, t){ return gidOf(k).filter(function(g){ return g.tur === t; })
    .reduce(function(s, g){ return s + (g.tutar || 0); }, 0); }
  function litreTop(k){ return yktOf(k).reduce(function(s, y){ return s + (y.litre || 0); }, 0); }
  function cezaTop(k){ return cezOf(k).reduce(function(s, c){ return s + (c.tutar || 0); }, 0); }

  /* Ortalama tüketim — ardışık yakıt kayıtlarının kilometre farkı üzerinden.
     Tek kayıtlı araçta hesaplanamaz (null döner, tabloda “—” gösterilir). */
  function tuketim(k){
    var ls = yktOf(k).slice().sort(function(a, b){ return a.km - b.km; });
    if(ls.length < 2) return null;
    var km = ls[ls.length - 1].km - ls[0].km;
    if(km <= 0) return null;
    var lt = ls.slice(1).reduce(function(s, y){ return s + (y.litre || 0); }, 0);
    return Math.round(lt / km * 1000) / 10;
  }

  /* Ay farkı — tarih ekseni DB.today, en az 1 ay döner (bölme güvenliği). */
  function ayFarki(iso, bitis){
    if(!iso) return 1;
    var a = String(iso).slice(0, 10).split('-'), b = String(bitis || DB.today).slice(0, 10).split('-');
    return Math.max(1, (parseInt(b[0], 10) - parseInt(a[0], 10)) * 12 + (parseInt(b[1], 10) - parseInt(a[1], 10)));
  }

  /* Kilometre başına maliyet — kayıtlı gider toplamı / güncel kilometre */
  function kmMaliyet(k){ var v = arc(k); return (v && v.guncelKm) ? gidTop(k) / v.guncelKm : 0; }

  /* Sahip olma ekonomisi — satın alma bedeli sahiplik ayına yayılır,
     kiralık araçta aylık kira edinme maliyeti sayılır (mükerrer sayım
     olmaması için “Kira” gider kalemi işletme maliyetinden düşülür). */
  function ekonomi(v){
    var kiralik = v.mulkiyet !== 'Satın alınan';
    var bas = kiralik ? v.sozlesmeBas : v.alisTarihi;
    var ay = ayFarki(bas);
    var hepsi = gidTop(v.kod), kira = gidTur(v.kod, 'Kira');
    var isletme = hepsi - kira;
    var edinmeAylik = kiralik ? (v.aylikKira || 0) : Math.round((v.alisBedeli || 0) / ay);
    var edinmeToplam = kiralik ? (v.aylikKira || 0) * ay : (v.alisBedeli || 0);
    return { kiralik:kiralik, bas:bas, ay:ay,
             edinmeAylik:edinmeAylik, isletmeAylik:Math.round(isletme / ay),
             toplamAylik:edinmeAylik + Math.round(isletme / ay),
             edinmeToplam:edinmeToplam, isletmeToplam:isletme,
             sahipToplam:edinmeToplam + isletme,
             kmBasi:v.guncelKm ? (edinmeToplam + isletme) / v.guncelKm : 0 };
  }

  /* Kiralama — kilometre sınırı sözleşme yılı sayısıyla çarpılır (yıllık sınır varsayımı) */
  function sozlesmeYil(v){
    if(!v.sozlesmeBas || !v.sozlesmeBit) return 1;
    return Math.max(1, Math.round(ayFarki(v.sozlesmeBas, v.sozlesmeBit) / 12));
  }
  function kmSinirToplam(v){ return (v.kmSiniri || 0) * sozlesmeYil(v); }
  function kmKullanim(v){ var t = kmSinirToplam(v); return t ? Math.round((v.guncelKm || 0) * 100 / t) : null; }

  /* =================================================================
     1. YENİLEME EŞİKLERİ — PROMPT.md §16: 60 / 30 / 15 / 7 gün · süresi doldu
     ================================================================= */
  function esik(g){
    if(g == null) return null;
    if(g < 0)  return { ad:'Süresi doldu',    ton:'danger', sira:0 };
    if(g <= 7) return { ad:'7 gün kaldı',     ton:'danger', sira:1 };
    if(g <= 15) return { ad:'15 gün kaldı',   ton:'danger', sira:2 };
    if(g <= 30) return { ad:'30 gün kaldı',   ton:'warn',   sira:3 };
    if(g <= 60) return { ad:'60 gün kaldı',   ton:'warn',   sira:4 };
    return { ad:'60 günden uzak', ton:'ok', sira:5 };
  }
  function esikBadge(g){
    var e = esik(g);
    return e ? GV.badge(e.ad, 'is-' + e.ton) : '<span class="u-faint">—</span>';
  }
  function esikTon(g){ var e = esik(g); return e ? e.ton : 'neutral'; }
  function yaklasan(g){ return g != null && g <= 60; }
  function esikDagilim(rows, gunFn){
    var kova = [
      { label:'Süresi doldu', value:0 }, { label:'7 gün', value:0 }, { label:'15 gün', value:0 },
      { label:'30 gün', value:0 }, { label:'60 gün', value:0 }, { label:'60 günden uzak', value:0 }
    ];
    rows.forEach(function(x){ var e = esik(gunFn(x)); if(e) kova[e.sira].value++; });
    return kova.filter(function(k){ return k.value; });
  }

  /* =================================================================
     2. YETKİ — finans yetkisi yoksa tutarlar maskelenir
     ================================================================= */
  function para(v){ return canFinans ? '<span class="cell-money">' + F.money(v) + '</span>' : '<span class="cell-mask">••••••</span>'; }
  function paraNum(v){ return canFinans ? '<span class="u-num">' + F.money(v) + '</span>' : '<span class="cell-mask">••••••</span>'; }
  function paraExp(v){ return canFinans ? v : ''; }
  function paraK(v){ return canFinans ? F.moneyK(v) : '••••••'; }
  function tlKm(v){ return canFinans ? '₺' + F.num(v, 2) : '••••••'; }
  function tlKmCell(v){
    return canFinans ? '<span class="cell-money">₺' + F.num(v, 2) + '</span>' : '<span class="cell-mask">••••••</span>';
  }

  /* =================================================================
     3. ORTAK FİLTRE
     ================================================================= */
  function aracUyar(v, f){
    if(!v) return false;
    if(f.arac && v.kod !== f.arac) return false;
    if(f.dep && v.dep !== f.dep) return false;
    if(f.proje && v.proje !== f.proje) return false;
    return true;
  }
  /* Araç satırlı raporlar */
  function baseArac(f){
    return DB.vehicles.filter(function(v){
      if(!aracUyar(v, f)) return false;
      if(f.personel && v.anaSurucu !== f.personel && v.yedekSurucu !== f.personel) return false;
      if(f.durum && v.durum !== f.durum) return false;
      if(f.tarih){
        var d = v.alisTarihi || v.sozlesmeBas;
        if(!d || d < f.tarih) return false;
      }
      return true;
    });
  }
  /* Araca bağlı kayıt satırlı raporlar. o:{tarih:'alan', surucu:'alan'} */
  function baseKayit(list, f, o){
    o = o || {};
    return list.filter(function(x){
      var v = arc(x.arac);
      if(!aracUyar(v, f)) return false;
      if(f.personel){
        var s = o.surucu ? x[o.surucu] : null;
        if(s){ if(s !== f.personel) return false; }
        else if(!v || (v.anaSurucu !== f.personel && v.yedekSurucu !== f.personel)) return false;
      }
      if(f.durum){
        var d = x.durum != null ? x.durum : (v ? v.durum : null);
        if(d !== f.durum) return false;
      }
      if(f.tarih){
        var t = o.tarih ? x[o.tarih] : null;
        if(!t || t < f.tarih) return false;
      }
      return true;
    });
  }

  /* =================================================================
     4. TOPLAMA VE GRAFİK YARDIMCILARI
     ================================================================= */
  function sum(rows, fn){ return rows.reduce(function(s, x){ return s + (fn(x) || 0); }, 0); }
  function top(a, n){ return a.slice(0, n || 12); }
  function uniq(rows, fn){
    var s = {};
    rows.forEach(function(x){ var k = fn(x); if(k) s[k] = 1; });
    return Object.keys(s).length;
  }
  function tally(rows, keyFn){
    var m = {}, order = [];
    rows.forEach(function(x){
      var k = keyFn(x);
      if(k == null || k === '') k = '—';
      if(!(k in m)){ m[k] = 0; order.push(k); }
      m[k]++;
    });
    return order.map(function(k){ return { label:k, value:m[k] }; })
                .sort(function(a, b){ return b.value - a.value; });
  }
  function tallySum(rows, keyFn, valFn){
    var m = {}, order = [];
    rows.forEach(function(x){
      var k = keyFn(x);
      if(k == null || k === '') k = '—';
      if(!(k in m)){ m[k] = 0; order.push(k); }
      m[k] += valFn(x) || 0;
    });
    return order.map(function(k){ return { label:k, value:Math.round(m[k]) }; })
                .filter(function(d){ return d.value; })
                .sort(function(a, b){ return b.value - a.value; });
  }
  function ayEtiket(ym){ var p = ym.split('-'); return AYK[parseInt(p[1], 10) - 1] + ' ' + p[0].slice(2); }
  function aylikSeri(rows, tarihFn, valFn){
    var ay = [];
    rows.forEach(function(x){
      var t = tarihFn(x);
      if(!t) return;
      var m = String(t).slice(0, 7);
      if(ay.indexOf(m) === -1) ay.push(m);
    });
    ay.sort();
    return { labels:ay.map(ayEtiket), values:ay.map(function(m){
      return Math.round(sum(rows.filter(function(x){ var t = tarihFn(x); return t && String(t).slice(0, 7) === m; }), valFn));
    }) };
  }

  function donutKart(baslik, data, merkez, altBaslik){
    if(!data.length) return null;
    return { title:baslik, html:GV.chart.donut(data, { center:String(merkez), centerSub:altBaslik }), legend:data };
  }
  function barKart(baslik, alt, data, opt){
    if(!data.length) return null;
    return { title:baslik, sub:alt, wide:true, html:GV.chart.bar(data, opt || {}) };
  }
  /* Para grafiği — finans yetkisi yoksa adet/litre/km eksenine düşer */
  function paraBar(o){
    return canFinans
      ? barKart(o.title, o.sub, o.data, { money:true })
      : barKart(o.altTitle || o.title, o.altSub, o.altData || []);
  }
  function esikBar(baslik, alt, data){
    return barKart(baslik, alt || 'kalan gün · yenileme eşiğine göre renklenir', data);
  }

  /* =================================================================
     5. KOLON SÖZLÜĞÜ — her çağrıda yeni nesne (GV.list kolon durumu tutar)
     ================================================================= */
  var C = {
    /* --- araç satırı --- */
    arac:function(w){ return { key:'plaka', label:'Araç', width:w || '20%', cellClass:'cell-wrap', locked:true,
      render:function(v){
        return '<a class="cell-main" href="' + aracLink(v.kod) + '">' + esc(v.plaka) + '</a>' +
               '<span class="cell-sub">' + esc(v.marka + ' ' + v.model + ' · ' + v.modelYili) + '</span>' +
               '<span class="cell-code">' + v.kod + ' · ' + esc(v.tip) + '</span>'; },
      exportValue:function(v){ return v.kod + ' — ' + v.plaka; } }; },

    tip:function(vis){ return { key:'tip', label:'Tip / yakıt', visible:vis !== false,
      render:function(v){ return '<span class="tag">' + esc(v.tip) + '</span>' +
        '<span class="cell-sub">' + esc(v.yakit + ' · ' + v.vites) + '</span>'; },
      exportValue:function(v){ return v.tip + ' / ' + v.yakit; } }; },

    mulkiyet:function(vis){ return { key:'mulkiyet', label:'Mülkiyet', visible:vis !== false,
      render:function(v){ return '<span class="tag">' + esc(v.mulkiyet) + '</span>' +
        (v.mulkiyet === 'Kiralık' && v.aylikKira ? '<span class="cell-sub">' + (canFinans ? F.money(v.aylikKira) + ' / ay' : '•••• / ay') + '</span>' : ''); },
      exportValue:function(v){ return v.mulkiyet; } }; },

    kullanim:function(){ return { key:'kullanim', label:'Kullanım',
      render:function(v){ return '<span class="cell-main">' + esc(v.kullanim) + '</span>' +
        (v.anaSurucu ? '<span class="cell-sub">' + esc(DB.empName(v.anaSurucu)) + '</span>' : ''); },
      exportValue:function(v){ return v.kullanim; } }; },

    anaSurucu:function(){ return { key:'anaSurucu', label:'Ana sürücü',
      render:function(v){ return v.anaSurucu ? GV.user(v.anaSurucu) : '<span class="u-faint">Ortak kullanım</span>'; },
      exportValue:function(v){ return v.anaSurucu ? DB.empName(v.anaSurucu) : '—'; } }; },

    yedekSurucu:function(vis){ return { key:'yedekSurucu', label:'Yedek sürücü', visible:vis !== false,
      render:function(v){ return v.yedekSurucu ? GV.user(v.yedekSurucu) : '<span class="u-faint">—</span>'; },
      exportValue:function(v){ return v.yedekSurucu ? DB.empName(v.yedekSurucu) : '—'; } }; },

    aracDep:function(vis){ return { key:'dep', label:'Departman', visible:vis !== false,
      render:function(v){ return esc(DB.depName(v.dep)); },
      exportValue:function(v){ return DB.depName(v.dep); } }; },

    aracProje:function(vis){ return { key:'proje', label:'Proje', visible:vis !== false,
      render:function(v){ return v.proje ? '<a class="cell-main" href="app-proje.html?q=' + encodeURIComponent(v.proje) + '">' + esc(projeAd(v.proje)) + '</a>'
                                         : '<span class="u-faint">Tahsis edilmemiş</span>'; },
      exportValue:function(v){ return v.proje ? projeAd(v.proje) : '—'; } }; },

    km:function(){ return { key:'guncelKm', label:'Güncel km', cellClass:'num',
      render:function(v){ return '<span class="u-num">' + F.num(v.guncelKm) + '</span>'; } }; },

    sonrakiBakim:function(){ return { key:'sonrakiBakimTarihi', label:'Sonraki bakım',
      render:function(v){ return GV.dateCell(v.sonrakiBakimTarihi) +
        '<span class="cell-sub">' + F.num(v.sonrakiBakimKm) + ' km</span>'; } }; },

    muayeneOzet:function(vis){ return { key:'muayene', label:'Muayene', sortable:false, visible:vis !== false,
      render:function(v){
        var m = mynOf(v.kod);
        if(!m) return '<span class="u-faint">—</span>';
        return GV.dateCell(m.sonrakiTarih) + '<span class="cell-sub">' + esikBadge(F.days(m.sonrakiTarih)) + '</span>'; },
      exportValue:function(v){ var m = mynOf(v.kod); return m ? m.sonrakiTarih : '—'; } }; },

    sigortaOzet:function(vis){ return { key:'sigorta', label:'Trafik sigortası', sortable:false, visible:vis !== false,
      render:function(v){
        var p = polOf(v.kod, 'Trafik Sigortası');
        if(!p) return '<span class="u-faint">Poliçe yok</span>';
        return GV.dateCell(p.bitis) + '<span class="cell-sub">' + esc(p.sirket) + '</span>'; },
      exportValue:function(v){ var p = polOf(v.kod, 'Trafik Sigortası'); return p ? p.bitis : '—'; } }; },

    giderToplam:function(baslik){ return { key:'gider', label:baslik || 'Toplam gider', cellClass:'num',
      sortValue:function(v){ return gidTop(v.kod); },
      render:function(v){ return para(gidTop(v.kod)); },
      exportValue:function(v){ return paraExp(gidTop(v.kod)); } }; },

    aracDurum:function(){ return { key:'durum', label:'Durum', render:function(v){ return GV.badge(v.durum); } }; },

    /* --- araca bağlı kayıt satırı --- */
    kayit:function(sayfa, baslik, altFn, w){ return { key:'kod', label:baslik || 'Kayıt', width:w || '16%',
      cellClass:'cell-wrap', locked:true,
      render:function(x){
        return '<a class="cell-main" href="' + sayfa + '?q=' + encodeURIComponent(x.kod) + '">' + x.kod + '</a>' +
               (altFn ? '<span class="cell-sub">' + esc(altFn(x)) + '</span>' : ''); },
      exportValue:function(x){ return x.kod; } }; },

    aracOf:function(w){ return { key:'arac', label:'Araç', width:w || '16%', cellClass:'cell-wrap',
      sortValue:function(x){ return plaka(x.arac); },
      render:function(x){
        var v = arc(x.arac);
        return '<a class="cell-main" href="' + aracLink(x.arac) + '">' + esc(v ? v.plaka : x.arac) + '</a>' +
               (v ? '<span class="cell-sub">' + esc(v.marka + ' ' + v.model) + '</span>' : ''); },
      exportValue:function(x){ return plaka(x.arac); } }; },

    kayitDep:function(vis){ return { key:'kdep', label:'Departman', visible:vis !== false,
      sortValue:function(x){ var v = arc(x.arac); return v ? DB.depName(v.dep) : ''; },
      render:function(x){ var v = arc(x.arac); return esc(v ? DB.depName(v.dep) : '—'); },
      exportValue:function(x){ var v = arc(x.arac); return v ? DB.depName(v.dep) : '—'; } }; },

    surucu:function(baslik){ return { key:'surucu', label:baslik || 'Sürücü',
      sortValue:function(x){ return DB.empName(x.surucu); },
      render:function(x){ return x.surucu ? GV.user(x.surucu) : '<span class="u-faint">—</span>'; },
      exportValue:function(x){ return x.surucu ? DB.empName(x.surucu) : '—'; } }; },

    tarih:function(alan, baslik){ return { key:alan, label:baslik || 'Tarih',
      render:function(x){ return x[alan] ? '<span class="cell-date">' + F.dateShort(x[alan]) + '</span>' : '<span class="u-faint">—</span>'; } }; },

    hedefTarih:function(alan, baslik){ return { key:alan, label:baslik || 'Tarih',
      render:function(x){ return GV.dateCell(x[alan]); } }; },

    kalanGun:function(alan){ return { key:'kalan', label:'Kalan gün', cellClass:'num',
      sortValue:function(x){ var g = F.days(x[alan]); return g == null ? 99999 : g; },
      render:function(x){
        var g = F.days(x[alan]);
        if(g == null) return '<span class="u-faint">—</span>';
        if(g < 0) return '<span class="u-num u-danger">' + F.num(-g) + ' gün gecikti</span>';
        return '<span class="u-num ' + (g <= 15 ? 'u-danger' : g <= 60 ? 'u-warn' : '') + '">' + F.num(g) + ' gün</span>'; },
      exportValue:function(x){ return F.days(x[alan]); } }; },

    esikKol:function(alan){ return { key:'esik', label:'Yenileme eşiği',
      sortValue:function(x){ var e = esik(F.days(x[alan])); return e ? e.sira : 9; },
      render:function(x){ return esikBadge(F.days(x[alan])); },
      exportValue:function(x){ var e = esik(F.days(x[alan])); return e ? e.ad : '—'; } }; },

    tutar:function(alan, baslik){ return { key:alan, label:baslik || 'Tutar', cellClass:'num',
      render:function(x){ return x[alan] == null ? '<span class="u-faint">—</span>' : para(x[alan]); },
      exportValue:function(x){ return paraExp(x[alan]); } }; },

    kayitDurum:function(baslik){ return { key:'durum', label:baslik || 'Durum',
      render:function(x){ return GV.badge(x.durum); } }; },

    /* --- kırılım (özet) satırı --- */
    ad:function(baslik, w){ return { key:'ad', label:baslik, width:w || '22%', cellClass:'cell-wrap', locked:true,
      render:function(a){ return '<span class="cell-main">' + esc(a.ad) + '</span>' +
        '<span class="cell-code">' + esc(a.kod) + '</span>'; },
      exportValue:function(a){ return a.ad; } }; },
    sayi:function(key, baslik, ton){ return { key:key, label:baslik, cellClass:'num',
      render:function(a){ return a[key] ? '<span class="u-num' + (ton ? ' u-' + ton : ' u-b') + '">' + F.num(a[key]) + '</span>'

  /* =================================================================
     7. KIRILIM ÜRETİCİLERİ (personel · departman · proje)
     ================================================================= */
  function aracOzet(kod, ad, v){
    return { kod:kod, ad:ad, arac:0, plakalar:[], km:0, gider:0, litre:0, yakitTutar:0,
             ceza:0, cezaTutar:0, kaza:0, bakim:0, serviste:0 };
  }
  function aracEkle(a, v){
    a.arac++;
    a.plakalar.push(v.plaka);
    a.km += v.guncelKm || 0;
    a.gider += gidTop(v.kod);
    a.litre += litreTop(v.kod);
    a.yakitTutar += gidTur(v.kod, 'Yakıt');
    a.ceza += cezOf(v.kod).length;
    a.cezaTutar += cezaTop(v.kod);
    a.kaza += kzaOf(v.kod).length;
    a.bakim += bakimOf(v.kod).length;
    if(v.durum === 'Serviste') a.serviste++;
    a.kmMaliyet = a.km ? a.gider / a.km : 0;
    a.litreOrt = a.km ? Math.round(a.litre / a.km * 1000) / 10 : 0;
  }
  function gruplaArac(rows, keyFn, adFn){
    var m = {}, order = [];
    rows.forEach(function(v){
      var k = keyFn(v) || '—';
      if(!m[k]){ m[k] = aracOzet(k, adFn(k), v); order.push(k); }
      aracEkle(m[k], v);
    });
    return order.map(function(k){ return m[k]; }).sort(function(x, y){ return y.arac - x.arac || y.km - x.km; });
  }

  /* Personel kırılımı — ana/yedek sürücülük + yakıt, ceza ve kaza kayıtları */
  function personelOzet(f){
    var m = {}, order = [];
    function al(kod){
      if(!kod) return null;
      if(!m[kod]){
        var e = DB.emp(kod);
        m[kod] = { kod:kod, ad:DB.empName(kod), dep:e ? e.dep : null, depAd:e ? DB.depName(e.dep) : '—',
                   ana:0, yedek:0, plakalar:[], yakitKayit:0, litre:0, yakitTutar:0,
                   ceza:0, cezaTutar:0, kaza:0, arac:0 };
        order.push(kod);
      }
      return m[kod];
    }
    if(f.personel && !al(f.personel)) return [];
    var araclar = baseArac(f);
    araclar.forEach(function(v){
      if(v.anaSurucu){ var a = al(v.anaSurucu); if(a){ a.ana++; a.arac++; a.plakalar.push(v.plaka); } }
      if(v.yedekSurucu){ var b = al(v.yedekSurucu); if(b) b.yedek++; }
    });
    baseKayit(DB.fuelLogs, f, { tarih:'tarih', surucu:'surucu' }).forEach(function(y){
      var a = al(y.surucu);
      if(a){ a.yakitKayit++; a.litre += y.litre || 0; a.yakitTutar += y.tutar || 0; }
    });
    baseKayit(DB.fines, f, { tarih:'tarih', surucu:'surucu' }).forEach(function(c){
      var a = al(c.surucu);
      if(a){ a.ceza++; a.cezaTutar += c.tutar || 0; }
    });
    baseKayit(DB.accidents, f, { tarih:'tarih', surucu:'surucu' }).forEach(function(k){
      var a = al(k.surucu);
      if(a) a.kaza++;
    });
    return order.map(function(k){ return m[k]; })
      .filter(function(a){ return !f.personel || a.kod === f.personel; })
      .filter(function(a){ return a.ana || a.yedek || a.yakitKayit || a.ceza || a.kaza; })
      .sort(function(x, y){ return y.arac - x.arac || y.litre - x.litre; });
  }

              render:function(a){ return para(a.sahipToplam); }, exportValue:function(a){ return paraExp(a.sahipToplam); } },
            { key:'guncelKm', label:'Güncel km', cellClass:'num',
              render:function(a){ return '<span class="u-num">' + F.num(a.guncelKm) + '</span>'; } },
            { key:'kmBasi', label:'Km başına sahip olma', cellClass:'num',
              render:function(a){ return tlKmCell(a.kmBasi) + '<span class="cell-sub">TL / km</span>'; },
              exportValue:function(a){ return canFinans ? Math.round(a.kmBasi * 100) / 100 : ''; } },
            { key:'durum', label:'Durum', render:function(a){ return GV.badge(a.durum); } }],
          mobile:function(a){
            return '<div class="gv-mrow-top"><a class="cell-main" href="' + aracLink(a.kod) + '">' + esc(a.plaka) + '</a>' +
              '<span class="tag">' + esc(a.mulkiyet) + '</span></div>' +
              '<div class="gv-mrow-code">' + a.kod + ' · ' + esc(a.marka + ' ' + a.model) + '</div>' +
              '<div class="gv-mrow-meta"><span>' + (canFinans ? F.moneyK(a.toplamAylik) + ' / ay' : '•••••• / ay') + '</span>' +
              '<span>' + ico('i-gauge','ic-sm') + F.num(a.guncelKm) + ' km</span>' +
              '<span>' + F.num(a.ay) + ' ay</span></div>';
          },
          emptyState:bos('Karşılaştırılacak araç yok', 'Seçilen kapsamda satın alınan ya da kiralanan araç bulunmuyor.', 'i-chart-bar') }) }

    ]
  });
});
</script>
</body>
</html>
