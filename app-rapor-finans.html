<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Satış ve Finans Raporları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="rapor" data-screen="raporfinans">
<div id="rapor"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;
  var host = document.getElementById('rapor');
  if(!host) return;
  var S = GV.session || {};
  var TODAY = DB.today;                    /* referans tarih — new Date() kullanılmaz */
  var AY_KEY = TODAY.slice(0, 7);

  GV.pageHead({
    eyebrow:'Raporlar', title:'Satış ve Finans Raporları',
    sub:'16 rapor · satış hunisi, performans, proje finansı ve nakit ekseni · referans tarih ' + F.date(TODAY),
    actions:[
      { label:'Teklifler', icon:'i-quote', href:'app-teklif.html' },
      { label:'Faturalar', icon:'i-receipt', href:'app-fatura.html' },
      { label:'Tahsilatlar', icon:'i-wallet', cls:'btn-acc', href:'app-tahsilat.html' }
    ]
  });

  /* =================================================================
     0. YETKİ KAPISI — bu ekranın tamamı finans verisidir (§26-D)
     ================================================================= */
  if(!GV.perm.can('finans')){
    host.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-lock', title:'Satış ve finans raporlarına erişim yetkiniz yok',
      desc:(S.rolAd || 'Bu rol') + ' rolü ciro, teklif tutarı, bütçe, maliyet ve tahsilat verisi içeren ' +
           'raporları görüntüleyemez. Erişim gerekiyorsa sistem yöneticinizden finans yetkisi talep edin.',
      action:'<a class="btn btn-acc" href="app-panel.html">Ana Panele Dön</a>'
    }) + '</div>';
    return;
  }


  /* =================================================================
     1. İNDEKSLER VE GENEL YARDIMCILAR
     ================================================================= */
  var CUS = {}; DB.customers.forEach(function(c){ CUS[c.kod] = c; });
  var PRJ = {}; DB.projects.forEach(function(p){ PRJ[p.kod] = p; });
  var INV = {}; DB.invoices.forEach(function(i){ INV[i.kod] = i; });
  var STG = {}; DB.pipelineStages.forEach(function(s){ STG[s.key] = s; });
  var LEADQ = {}; DB.quotes.forEach(function(q){ if(q.lead && !LEADQ[q.lead]) LEADQ[q.lead] = q; });
  var QSZL = {}; DB.contracts.forEach(function(s){ if(s.teklif) QSZL[s.teklif] = s; });

  function sum(a, fn){ return a.reduce(function(s, x){ return s + (fn(x) || 0); }, 0); }
  function uniq(a){ var o = []; a.forEach(function(x){ if(x != null && x !== '' && o.indexOf(x) === -1) o.push(x); }); return o; }
  function topN(d, n){ return d.slice().sort(function(a, b){ return (b.value || 0) - (a.value || 0); }).slice(0, n || 10); }
  function pct(pay, toplam){ return toplam ? Math.round(pay * 100 / toplam) : 0; }
  function cus(k){ return CUS[k] || null; }
  function cName(k){ var c = cus(k); return c ? c.kisa : (k || '—'); }
  function cShort(k){ var c = cus(k); return c ? String(c.kisa).split(' ')[0] : String(k || '—').slice(-3); }
  function pName(k){ var p = PRJ[k]; return p ? p.ad : (k || '—'); }
  function empAd(k){ return DB.empName(k); }
  function kisaAd(s, n){ s = String(s || '—'); return s.length > (n || 12) ? s.slice(0, n || 12) + '…' : s; }
  function bin(v){ return Math.round((v || 0) / 1000); }

  var AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  function ayEt(ym){ var p = String(ym).split('-'); return AYK[parseInt(p[1], 10) - 1] + ' ' + p[0].slice(2); }
  function ay(iso){ return iso ? String(iso).slice(0, 7) : null; }
  function aySirala(list){ return uniq(list.filter(Boolean)).sort(); }

  /* ---- para / sayı hücreleri ---- */
  function mny(v){ return '<span class="cell-money">' + F.money(v || 0) + '</span>'; }
  function mnyTone(v, t){ return '<span class="cell-money' + (t ? ' u-' + t : '') + '">' + F.money(v || 0) + '</span>'; }
  function mnySigned(v){
    v = v || 0;
    return v < 0 ? '<span class="cell-money u-danger">−' + F.money(Math.abs(v)) + '</span>'
                 : '<span class="cell-money u-ok">' + F.money(v) + '</span>';
  }
  function num(v){ return '<span class="u-num">' + F.num(v) + '</span>'; }
  function sub(t){ return '<span class="cell-sub">' + t + '</span>'; }
  function faint(t){ return '<span class="u-faint">' + esc(t) + '</span>'; }
  function gunCell(v, tone){
    if(v == null) return faint('—');
    return '<span class="u-num' + (tone ? ' u-' + tone : '') + '">' + F.num(v) + ' gün</span>';
  }
  function oranCell(v, esik){
    if(v == null) return faint('—');
    var e = esik || 50;
    return '<span class="u-num ' + (v >= e ? 'u-ok' : v >= e / 2 ? 'u-warn' : 'u-danger') + '">%' + F.num(v) + '</span>';
  }

  /* ---- ortak kolon fabrikaları (her çağrıda yeni nesne) ---- */
  function colMoney(key, label, o){
    o = o || {};
    return { key:key, label:label, cellClass:'num', visible:o.visible !== false,
      sortValue:function(x){ return x[key] || 0; },
      exportValue:function(x){ return x[key] || 0; },
      render:function(x){
        var v = x[key] || 0;
        var body = o.signed ? mnySigned(v) : mnyTone(v, o.tone ? o.tone(x) : null);
        return body + (o.sub ? sub(o.sub(x)) : ''); } };
  }
  function colNum(key, label, o){
    o = o || {};
    return { key:key, label:label, cellClass:'num', visible:o.visible !== false,
      sortValue:function(x){ return x[key] || 0; },
      exportValue:function(x){ return x[key] || 0; },
      render:function(x){ return num(x[key]) + (o.sub ? sub(o.sub(x)) : ''); } };
  }
  function colPct(key, label, o){
    o = o || {};
    return { key:key, label:label, cellClass:'num', visible:o.visible !== false,
      sortValue:function(x){ return x[key] == null ? -1 : x[key]; },
      exportValue:function(x){ return x[key]; },
      render:function(x){ return o.bar ? GV.progress(x[key]) : oranCell(x[key], o.esik); } };
  }
  function colDate(key, label, o){
    o = o || {};
    return { key:key, label:label, visible:o.visible !== false,
      exportValue:function(x){ return x[key] || ''; },
      render:function(x){ return x[key]
        ? (o.plain ? '<span class="cell-date">' + F.date(x[key]) + '</span>'
                   : GV.dateCell(x[key], { done:o.done ? o.done(x) : false }))
        : faint('—'); } };
  }
  function colDurum(key, label){
    return { key:key || 'durum', label:label || 'Durum',
      render:function(x){ return GV.badge(x[key || 'durum']); } };
  }
  function colKisi(key, label){
    return { key:key, label:label,
      exportValue:function(x){ return empAd(x[key]); },
      render:function(x){ return GV.user(x[key], { sm:true }); } };
  }
  function linkCell(href, kod, altHtml){
    return '<a class="cell-main" href="' + href + '">' + esc(kod) + '</a>' + (altHtml || '');
  }

  /* ---- mobil satır ---- */
  function mRow(main, kod, metas, badges){
    return '<div class="gv-mrow-top">' + main + '</div>' +
      '<div class="gv-mrow-code">' + kod + '</div>' +
      (metas && metas.length ? '<div class="gv-mrow-meta">' + metas.map(function(m){
        return '<span>' + m + '</span>'; }).join('') + '</div>' : '') +
      (badges ? '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + badges + '</span></div>' : '');
  }

  /* ---- tablo iskeleti ---- */
  function tbl(o){
    return { key:o.key || 'kod', pageSize:o.pageSize || 10, archive:false,      exportName:o.exportName, exportTitle:o.exportTitle,
      search:o.search, defaultSort:o.defaultSort, defaultDir:o.defaultDir || 'desc',
      tabs:o.tabs, columns:o.columns, mobile:o.mobile, emptyState:o.emptyState };
  }
  function bos(baslik, aciklama, ikon){
    return { icon:ikon || 'i-wallet', title:baslik,
      desc:aciklama || 'Ortak filtreleri temizleyerek ya da tarih aralığını genişleterek kapsamı büyütebilirsiniz.' };
  }

  /* =================================================================
     2. ORTAK FİLTRE UYGULAMASI
     f = { tarih, musteri, proje, temsilci, durum }
     ================================================================= */
  function tarihOK(f, iso){ return !f.tarih || (!!iso && String(iso).slice(0, 10) >= f.tarih); }
  function musteriOK(f, kod){ return !f.musteri || kod === f.musteri; }
  function projeOK(f, projeKod, musteriKod){
    if(!f.proje) return true;
    if(projeKod) return projeKod === f.proje;
    var p = PRJ[f.proje];                     /* kaydın projesi yoksa müşteri üzerinden eşleşir */
    return !!p && !!musteriKod && p.musteri === musteriKod;
  }
  function kisiOK(f, list){ return !f.temsilci || (list || []).indexOf(f.temsilci) !== -1; }
  function durumOK(f, v){ return !f.durum || v === f.durum; }

  /* =================================================================
     3. SATIŞ TÜRETMELERİ
     ================================================================= */
  function leadQuote(l){ return LEADQ[l.kod] || null; }
  function leadSozlesme(l){ var q = leadQuote(l); return q ? (QSZL[q.kod] || null) : null; }
  /* Fırsat değeri: teklif varsa teklifin genel toplamı, yoksa müşterinin beyan ettiği bütçe */
  function leadDeger(l){ var q = leadQuote(l); return q ? q.toplam : (l.butce || 0); }
  function leadOlasilik(l){ var s = STG[l.asama]; return s ? s.olasilik : 0; }
  function leadAgirlikli(l){ return Math.round(leadDeger(l) * leadOlasilik(l) / 100); }
  function kazanildi(l){ return l.asama === 'Kazanıldı'; }
  function kaybedildi(l){ return l.asama === 'Kaybedildi'; }
  function sonuclandi(l){ return kazanildi(l) || kaybedildi(l); }
  function leadAcik(l){ return !sonuclandi(l); }
  /* Sonuç tarihi: kazanımda sözleşme imza tarihi (yoksa teklif tarihi), kayıpta son iletişim */
  function leadSonucTarihi(l){
    if(kazanildi(l)){
      var s = leadSozlesme(l); if(s) return s.imzaTarihi;
      var q = leadQuote(l); if(q) return q.tarih;
      return l.sonIletisim;
    }
    if(kaybedildi(l)) return l.sonIletisim || (leadQuote(l) ? leadQuote(l).gecerlilik : null);
    return null;
  }
  function leadSure(l){
    var k = leadSonucTarihi(l);
    return (k && l.talepTarihi) ? F.days(k, l.talepTarihi) : null;
  }
  function leadSonuc(l){ return kazanildi(l) ? 'Kazanıldı' : kaybedildi(l) ? 'Kaybedildi' : 'Sürüyor'; }

  function leadRow(l){
    var q = leadQuote(l), sz = leadSozlesme(l);
    return {
      kod:l.kod, firma:l.firma, yetkili:l.yetkili, sektor:l.sektor, hizmet:l.hizmet, ozet:l.ozet,
      kaynak:l.kaynak, yonlendiren:l.yonlendiren, sorumlu:l.sorumlu, sorumluAd:empAd(l.sorumlu),
      musteri:l.musteri, musteriAd:l.musteri ? cName(l.musteri) : 'Müşteri kaydı yok',
      asama:l.asama, sonuc:leadSonuc(l), olasilik:leadOlasilik(l),
      deger:leadDeger(l), agirlikli:leadAgirlikli(l), butce:l.butce || 0,
      teklif:q ? q.kod : null, teklifTutar:q ? q.toplam : 0, teklifDurum:q ? q.durum : null,
      sozlesme:sz ? sz.kod : null, sozlesmeTutar:sz ? sz.tutar : 0,
      talepTarihi:l.talepTarihi, kapanisTahmini:l.kapanisTahmini, sonucTarihi:leadSonucTarihi(l),
      sure:leadSure(l), sonIletisim:l.sonIletisim, puan:l.puan, sicaklik:l.sicaklik,
      kayipNedeni:l.kayipNedeni, oncelik:l.oncelik
    };
  }
  function baseLeads(f){
    return DB.leads.filter(function(l){
      return tarihOK(f, l.talepTarihi) && musteriOK(f, l.musteri) &&
             projeOK(f, null, l.musteri) && kisiOK(f, [l.sorumlu]) && durumOK(f, l.asama);
    });
  }
  function leadRows(f){ return baseLeads(f).map(leadRow); }

  function baseQuotes(f){
    return DB.quotes.filter(function(q){
      return tarihOK(f, q.tarih) && musteriOK(f, q.musteri) &&
             projeOK(f, null, q.musteri) && kisiOK(f, [q.hazirlayan]) && durumOK(f, q.durum);
    });
  }
  function quoteRow(q){
    var sz = QSZL[q.kod] || null;
    return {
      kod:q.kod, firma:q.firma, musteri:q.musteri,
      musteriAd:q.musteri ? cName(q.musteri) : 'Aday müşteri',
      lead:q.lead, analiz:q.analiz, hazirlayan:q.hazirlayan, hazirlayanAd:empAd(q.hazirlayan),
      tarih:q.tarih, gecerlilik:q.gecerlilik, versiyon:q.versiyon, kalemSayisi:q.kalemSayisi,
      araToplam:q.araToplam, indirim:q.indirim, indirimOran:q.araToplam ? Math.round(q.indirim * 100 / q.araToplam) : 0,
      vergi:q.vergi, toplam:q.toplam, durum:q.durum, icOnay:q.icOnay, musteriOnay:q.musteriOnay,
      sozlesme:sz ? sz.kod : null,
      sonuc:q.durum === 'Kazanıldı' ? 'Kazanıldı' : q.durum === 'Kaybedildi' ? 'Kaybedildi' : 'Sürüyor',
      kalanGun:q.gecerlilik ? F.days(q.gecerlilik) : null,
      teslimSuresi:q.teslimSuresi, odemePlani:q.odemePlani
    };
  }

  /* =================================================================
     4. PROJE / MÜŞTERİ FİNANS TÜRETMELERİ
     app-butce.html ile birebir aynı formüller — canonical değer disiplini
     ================================================================= */
  function butceKalan(p){ return (p.butce || 0) - (p.gerceklesenMaliyet || 0); }
  function butceKullanim(p){ return p.butce ? Math.round(p.gerceklesenMaliyet / p.butce * 100) : 0; }
  function sureSapma(p){ return p.tahminiSure ? Math.round((p.harcananSure - p.tahminiSure) / p.tahminiSure * 100) : 0; }
  function saatMaliyet(p){ return p.harcananSure ? Math.round(p.gerceklesenMaliyet / p.harcananSure) : null; }
  function prjFaturalari(p){ return DB.invoices.filter(function(i){ return i.proje === p.kod; }); }
  function faturalanan(p){ return sum(prjFaturalari(p), function(i){ return i.toplam; }); }
  function tahsilEdilen(p){
    var kodlar = prjFaturalari(p).map(function(i){ return i.kod; });
    return sum(DB.payments.filter(function(t){
      return kodlar.indexOf(t.fatura) !== -1 && t.durum === 'Ödendi'; }), function(t){ return t.tutar; });
  }

  function projectRow(p){
    var fat = faturalanan(p), tah = tahsilEdilen(p), kalan = butceKalan(p);
    return {
      kod:p.kod, ad:p.ad, tur:p.tur, musteri:p.musteri, musteriAd:p.musteriAd, musteriKisa:cName(p.musteri),
      pm:p.pm, pmAd:empAd(p.pm), durum:p.durum, saglik:p.saglik, faz:p.faz, ilerleme:p.ilerleme,
      baslangic:p.baslangic, planlananBitis:p.planlananBitis, gercekBitis:p.gercekBitis,
      sozlesmeTutari:p.sozlesmeTutari || 0, butce:p.butce || 0, maliyet:p.gerceklesenMaliyet || 0,
      kalanButce:kalan, asimTutar:kalan < 0 ? -kalan : 0, kullanim:butceKullanim(p),
      tahminiSure:p.tahminiSure || 0, harcananSure:p.harcananSure || 0, sureSapma:sureSapma(p),
      saatMaliyet:saatMaliyet(p), faturalanan:fat, tahsilEdilen:tah, bekleyen:fat - tah,
      kar:(p.sozlesmeTutari || 0) - (p.gerceklesenMaliyet || 0),
      marj:p.sozlesmeTutari ? Math.round(((p.sozlesmeTutari - p.gerceklesenMaliyet) / p.sozlesmeTutari) * 100) : 0,
      gecikmeNedeni:p.gecikmeNedeni
    };
  }
  function baseProjects(f){
    return DB.projects.filter(function(p){
      return tarihOK(f, p.gercekBitis || p.planlananBitis) && musteriOK(f, p.musteri) &&
             (!f.proje || p.kod === f.proje) &&
             kisiOK(f, [p.pm, p.teknikSorumlu, p.musteriSorumlu].concat(p.ekip || [])) &&
             durumOK(f, p.durum);
    });
  }
  function projectRows(f){ return baseProjects(f).map(projectRow); }

  function custRow(c){
    var pr = DB.projects.filter(function(p){ return p.musteri === c.kod; });
    var fa = DB.invoices.filter(function(i){ return i.musteri === c.kod; });
    var th = DB.payments.filter(function(t){ return t.musteri === c.kod; });
    var sz = DB.contracts.filter(function(s){ return s.musteri === c.kod; });
    var gelir = sum(pr, function(p){ return p.sozlesmeTutari; });
    var maliyet = sum(pr, function(p){ return p.gerceklesenMaliyet; });
    return {
      kod:c.kod, unvan:c.unvan, kisa:c.kisa, sektor:c.sektor, durum:c.durum, risk:c.risk,
      sorumlu:c.sorumlu, sorumluAd:empAd(c.sorumlu), memnuniyet:c.memnuniyet,
      projeAdet:pr.length, gelir:gelir, maliyet:maliyet, kar:gelir - maliyet,
      marj:gelir ? Math.round((gelir - maliyet) / gelir * 100) : 0,
      saat:sum(pr, function(p){ return p.harcananSure; }),
      saatKar:sum(pr, function(p){ return p.harcananSure; })
        ? Math.round((gelir - maliyet) / sum(pr, function(p){ return p.harcananSure; })) : null,
      sozlesmeTutar:sum(sz, function(s){ return s.tutar; }), sozlesmeAdet:sz.length,
      faturalanan:sum(fa, function(i){ return i.toplam; }), faturaAdet:fa.length,
      tahsilEdilen:sum(th.filter(function(t){ return t.durum === 'Ödendi'; }), function(t){ return t.tutar; }),
      geciken:sum(th.filter(function(t){ return t.durum === 'Gecikti'; }), function(t){ return t.tutar; }),
      bekleyen:c.bekleyenTahsilat || 0, toplamCiro:c.toplamCiro || 0
    };
  }
  function baseCustomers(f){
    return DB.customers.filter(function(c){
      if(f.musteri && c.kod !== f.musteri) return false;
      if(f.durum && c.durum !== f.durum) return false;
      if(f.temsilci && c.sorumlu !== f.temsilci) return false;
      if(f.proje){ var p = PRJ[f.proje]; if(!p || p.musteri !== c.kod) return false; }
      if(f.tarih && !(c.sonIletisim && c.sonIletisim >= f.tarih)) return false;
      return true;
    });
  }

  /* =================================================================
     5. NAKİT TÜRETMELERİ
     ================================================================= */
  function invProje(faturaKod){ var i = INV[faturaKod]; return i ? i.proje : null; }
  function tahsilTarihi(t){
    var i = INV[t.fatura];
    if(t.durum !== 'Ödendi') return null;
    return (i && i.odemeTarihi) || t.sonAksiyonTarihi || null;
  }
  function yaslandirma(g){
    if(!g) return 'Vadesi geçmedi';
    if(g <= 30) return '1-30 gün';
    if(g <= 60) return '31-60 gün';
    return '60+ gün';
  }
  function paymentRow(t){
    var i = INV[t.fatura] || null;
    return {
      kod:t.kod, fatura:t.fatura, musteri:t.musteri, musteriAd:t.musteriAd, musteriKisa:cName(t.musteri),
      tutar:t.tutar, vade:t.vade, gecikmeGun:t.gecikmeGun || 0, durum:t.durum,
      sorumlu:t.sorumlu, sorumluAd:empAd(t.sorumlu),
      sonAksiyon:t.sonAksiyon, sonAksiyonTarihi:t.sonAksiyonTarihi,
      proje:i ? i.proje : null, projeAd:i && i.proje ? pName(i.proje) : '—',
      sozlesme:i ? i.sozlesme : null, faturaTarihi:i ? i.tarih : null,
      tahsilTarihi:tahsilTarihi(t), yaslandirma:yaslandirma(t.gecikmeGun || 0),
      kalanGun:t.vade ? F.days(t.vade) : null
    };
  }
  function basePayments(f){
    return DB.payments.filter(function(t){
      return tarihOK(f, t.vade) && musteriOK(f, t.musteri) &&
             projeOK(f, invProje(t.fatura), t.musteri) && kisiOK(f, [t.sorumlu]) && durumOK(f, t.durum);
    });
  }
  function paymentRows(f){ return basePayments(f).map(paymentRow); }

  function baseInvoices(f){
    return DB.invoices.filter(function(i){
      return tarihOK(f, i.tarih) && musteriOK(f, i.musteri) &&
             projeOK(f, i.proje, i.musteri) && durumOK(f, i.durum) &&
             (!f.temsilci || (cus(i.musteri) && cus(i.musteri).sorumlu === f.temsilci) ||

    return DB.milestones.filter(function(m){

      var p = PRJ[m.proje];

      return musteriOK(f, p.musteri) && (!f.proje || m.proje === f.proje) &&

      table:tbl({ exportName:'finans-rapor-nakit-akis', exportTitle:'Nakit Akış Tahmini Raporu',
        defaultSort:'ay', defaultDir:'asc', pageSize:25,
        search:{ placeholder:'Ay ara (ör. Eyl 26)', fields:['kod','ay','tip'] },
        columns:[
          { key:'ay', label:'Dönem', width:'14%', locked:true,
            sortValue:function(x){ return x.donem; },
            exportValue:function(x){ return x.donem; },
            render:function(x){ return linkCell('app-tahsilat.html', x.ay) +
              '<span class="cell-code">' + esc(x.donem) + '</span>'; } },
          colMoney('gerceklesen', 'Gerçekleşen giriş'),
          colMoney('beklenen', 'Bekleyen tahsilat',
            { sub:function(x){ return x.riskli ? 'riskli ' + F.moneyK(x.riskli) : 'gecikme yok'; } }),
          colMoney('milestone', 'Faturalanmamış milestone'),
          colMoney('pipeline', 'Ağırlıklı pipeline'),
          colMoney('tahmini', 'Tahmini giriş'),
          colMoney('toplam', 'Dönem toplamı', { visible:false }),
          colMoney('kumulatif', 'Kümülatif pozisyon'),
          { key:'tip', label:'Dönem tipi',
            render:function(x){ return GV.badge(x.tip,
              x.tip === 'Gerçekleşen' ? 'is-ok' : x.tip === 'Referans ay' ? 'is-accent' : 'is-info'); } }
        ],
        mobile:function(x){
          return mRow('<span class="cell-main">' + esc(x.ay) + '</span>' + mny(x.toplam), esc(x.donem),
            [ico('i-check-circle','ic-sm') + F.moneyK(x.gerceklesen),
             ico('i-hourglass','ic-sm') + F.moneyK(x.tahmini),
             ico('i-trend-up','ic-sm') + F.moneyK(x.kumulatif)],
            GV.badge(x.tip, x.tip === 'Gerçekleşen' ? 'is-ok' : x.tip === 'Referans ay' ? 'is-accent' : 'is-info') +
            (x.riskli ? GV.badge('Riskli ' + F.moneyK(x.riskli), 'is-danger') : ''));
        },
        emptyState:bos('Nakit akış dönemi yok', 'Seçilen kapsamda tahsilat ya da beklenen giriş kaydı bulunmuyor.', 'i-trend-up') }) }

    ]
  });
});
</script>
</body>
