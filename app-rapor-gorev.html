<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Görev Raporları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="rapor" data-screen="raporgorev">
<div id="rapor"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;

  /* =================================================================
     0. SÖZLÜK VE TÜRETİLMİŞ ÖLÇÜLER
     Referans tarih daima DB.today (2026-08-03) — new Date() kullanılmaz.
     ================================================================= */
  var KAPALI = ['Tamamlandı','İptal edildi','Arşivlendi'];
  var AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

  function acik(t){ return KAPALI.indexOf(t.durum) === -1; }
  function geciken(t){ return acik(t) && !!t.termin && F.days(t.termin) < 0; }
  function gecikmeGun(t){ var d = t.termin ? F.days(t.termin) : null; return (d != null && d < 0) ? -d : 0; }
  function zamaninda(t){ return !!(t.tamamlanma && t.termin && t.tamamlanma <= t.termin); }
  function kapandi(t){ return !!t.tamamlanma; }
  function sapma(t){ return (t.gercekSure || 0) - (t.tahminiSure || 0); }
  /* 'Atama bekliyor' REVİZE 01 ile sözlükten kalktı — 'Havuzda' ile aynı şeyi
     anlatıyordu, ikinci koşul artık hiçbir kayda değmiyordu. */
  function atanmamis(t){ return !t.sorumlu || t.durum === 'Havuzda'; }
  function kalanEfor(t){ return Math.max(0, (t.tahminiSure || 0) - (t.gercekSure || 0)); }

  /* Termin sonucu — tamamlananlarda gerçek sonuç, açıklarda termin ihlali */
  function terminSonuc(t){
    if(!t.termin) return null;
    if(t.tamamlanma) return t.tamamlanma <= t.termin ? 'Zamanında' : 'Geç tamamlandı';
    return geciken(t) ? 'Termin aşıldı' : null;
  }
  function terminAsim(t){
    if(t.tamamlanma && t.termin){ var d = F.days(t.termin, t.tamamlanma); return d < 0 ? -d : 0; }
    return gecikmeGun(t);
  }

  /* Kalite puanı — varsayım: revizyon, yeniden açılma, termin aşımı ve
     efor sapması ceza olarak düşülür (tasks/assumptions.md'ye yazılmalı). */
  function kalitePuan(t){
    var p = 100;
    p -= (t.revizyon || 0) * 10;
    p -= (t.yenidenAcilma || 0) * 15;
    if(terminAsim(t) > 0) p -= 15;
    if((t.tahminiSure || 0) > 0 && sapma(t) > (t.tahminiSure * 0.2)) p -= 10;
    return Math.max(0, Math.min(100, p));
  }
  function kaliteSinif(t){ var p = kalitePuan(t); return p >= 85 ? 'İyi' : p >= 60 ? 'Kabul edilebilir' : 'Zayıf'; }
  function kaliteBadge(t){
    var s = kaliteSinif(t);
    return GV.badge(s, s === 'İyi' ? 'is-ok' : s === 'Zayıf' ? 'is-danger' : 'is-warn');
  }

  /* ---- kayıt arayıcılar ---- */
  function pr(kod){ return DB.projects.filter(function(x){ return x.kod === kod; })[0] || null; }
  function cu(kod){ return DB.customers.filter(function(x){ return x.kod === kod; })[0] || null; }
  function ch(kod){ return DB.channels.filter(function(x){ return x.kod === kod; })[0] || null; }
  function mt(kod){ return DB.meetings.filter(function(x){ return x.kod === kod; })[0] || null; }
  function gv(kod){ return DB.tasks.filter(function(x){ return x.kod === kod; })[0] || null; }
  function depKisa(kod){ var d = DB.dep(kod); return d ? d.kisa : '—'; }
  function projeAd(kod){ var p = pr(kod); return p ? p.ad : (kod || 'İç iş'); }
  function musteriAd(kod){ var c = cu(kod); return c ? c.kisa : (kod || 'İç iş'); }

  /* ---- sohbet / toplantı kaynak eşlemesi (gerçek alanlardan türetilir) ----
     DB.messages: m.gorev alanı ya da mesaj metnindeki GRV kodu
     DB.decisions: karar.gorev alanı                                     */
  var SOHBET = (function(){
    var map = {};
    DB.messages.forEach(function(m){
      var kods = [];
      if(m.gorev) kods.push(m.gorev);
      (String(m.metin || '').match(/GRV-\d{4}-\d{3}/g) || []).forEach(function(k){
        if(kods.indexOf(k) === -1) kods.push(k);
      });
      kods.forEach(function(k){ if(!map[k]) map[k] = m; });
    });
    return map;
  })();

  /* =================================================================
     1. ORTAK FİLTRE
     ================================================================= */
  function base(f){
    return DB.tasks.filter(function(t){
      if(f.dep && t.dep !== f.dep) return false;
      if(f.personel && t.sorumlu !== f.personel && t.veren !== f.personel &&
         (t.yardimci || []).indexOf(f.personel) === -1) return false;
      if(f.proje && t.proje !== f.proje) return false;
      if(f.musteri && t.musteri !== f.musteri) return false;
      if(f.durum && t.durum !== f.durum) return false;
      if(f.tarih){
        var d = t.tamamlanma || t.termin || t.baslangic;
        if(!d || d < f.tarih) return false;
      }
      return true;
    });
  }

  /* =================================================================
     2. TOPLAMA VE GRAFİK YARDIMCILARI
     ================================================================= */
  function tally(rows, keyFn){
    var m = {}, order = [];
    rows.forEach(function(t){
      var k = keyFn(t);
      if(k == null || k === '') k = '—';
      if(!(k in m)){ m[k] = 0; order.push(k); }
      m[k]++;
    });
    return order.map(function(k){ return { label:k, value:m[k] }; })
                .sort(function(a, b){ return b.value - a.value; });
  }
  function top(arr, n){ return arr.slice(0, n || 10); }
  function ayEtiket(ym){ var p = ym.split('-'); return AYK[parseInt(p[1], 10) - 1] + ' ' + p[0].slice(2); }

  /* Aylık oran trendi — termin ayına göre gruplanır */
  function oranTrend(list, payFn){
    var ay = [];
    list.forEach(function(t){
      if(!t.termin) return;
      var m = t.termin.slice(0, 7);
      if(ay.indexOf(m) === -1) ay.push(m);
    });
    ay.sort();
    return {
      labels:ay.map(ayEtiket),
      values:ay.map(function(m){
        var g = list.filter(function(t){ return t.termin && t.termin.slice(0, 7) === m; });
        return g.length ? Math.round(g.filter(payFn).length * 100 / g.length) : 0;
      })
    };
  }
  function trendKart(baslik, alt, tr){
    if(tr.labels.length < 2) return null;
    return { title:baslik, sub:alt, wide:true,
             html:GV.chart.line([{ values:tr.values }], tr.labels, { label:baslik }) };
  }

  /* Departman / durum / öncelik standart kartları */
  function kartDurum(rows){
    var d = tally(rows, function(t){ return t.durum; });
    return { title:'Durum dağılımı', html:GV.chart.donut(d, { center:String(rows.length), centerSub:'görev' }), legend:d };
  }
  function kartOncelik(rows){
    var d = tally(rows, function(t){ return t.oncelik; });
    return { title:'Öncelik dağılımı', html:GV.chart.donut(d, { center:String(rows.length), centerSub:'görev' }), legend:d };
  }
  function kartDep(rows, baslik){
    var d = tally(rows, function(t){ return depKisa(t.dep); });
    return { title:baslik || 'Departman bazlı dağılım', sub:'görev adedi', wide:true, html:GV.chart.bar(top(d, 10)) };
  }
  function kartSorumlu(rows, baslik){
    var d = tally(rows, function(t){ return DB.empName(t.sorumlu); });
    return { title:baslik || 'Sorumlu bazlı dağılım', sub:'görev adedi', wide:true, html:GV.chart.bar(top(d, 10)) };
  }
  function kartSure(rows, baslik, n){
    var d = rows.slice().sort(function(a, b){ return Math.abs(sapma(b)) - Math.abs(sapma(a)); })
      .slice(0, n || 12)
      .map(function(t){ return { label:t.kod.slice(-3), value:t.tahminiSure || 0, value2:t.gercekSure || 0 }; });
    var leg = [
      { label:'Tahmini', value:rows.reduce(function(s, t){ return s + (t.tahminiSure || 0); }, 0) },
      { label:'Gerçekleşen', value:rows.reduce(function(s, t){ return s + (t.gercekSure || 0); }, 0) }
    ];
    return { title:baslik || 'Tahmini ve gerçekleşen süre', sub:'saat · sapması en yüksek görevler',
             wide:true, html:GV.chart.bar(d), legend:leg };
  }

  /* Departman / proje / müşteri kırılımı — özet satır üretir */
  function grupla(rows, keyFn, adFn){
    var m = {}, order = [];
    rows.forEach(function(t){
      var k = keyFn(t) || '—';
      if(!m[k]){
        m[k] = { kod:k, ad:adFn(k), toplam:0, acik:0, geciken:0, tamam:0, zamaninda:0,
                 tahmini:0, gercek:0, revizyon:0, yeniden:0, revizyonlu:0 };
        order.push(k);
      }
      var a = m[k];
      a.toplam++;
      if(acik(t)) a.acik++;
      if(geciken(t)) a.geciken++;
      if(kapandi(t)){ a.tamam++; if(zamaninda(t)) a.zamaninda++; }
      a.tahmini += t.tahminiSure || 0;
      a.gercek += t.gercekSure || 0;
      a.revizyon += t.revizyon || 0;
      a.yeniden += t.yenidenAcilma || 0;
      if((t.revizyon || 0) > 0) a.revizyonlu++;
    });
    return order.map(function(k){
      var a = m[k];
      a.sapma = a.gercek - a.tahmini;
      a.oran = a.tamam ? Math.round(a.zamaninda * 100 / a.tamam) : null;
      return a;
    }).sort(function(x, y){ return y.toplam - x.toplam; });
  }

  /* =================================================================
     3. KOLON SÖZLÜĞÜ — her çağrıda yeni nesne (GV.list kolon durumu tutar)
     ================================================================= */
  var C = {
    gorev:function(w){ return { key:'baslik', label:'Görev', width:w || '24%', cellClass:'cell-wrap', locked:true,
      render:function(t){
        return '<a class="cell-main" href="app-gorev-detay.html?id=' + t.kod + '">' + esc(t.baslik) + '</a>' +
               '<span class="cell-code">' + t.kod + ' · ' + esc(t.tur) + '</span>'; },
      exportValue:function(t){ return t.kod + ' — ' + t.baslik; } }; },

    proje:function(){ return { key:'proje', label:'Proje / Müşteri',
      render:function(t){
        if(!t.proje && !t.musteri) return '<span class="u-faint">İç iş</span>';
        var p = pr(t.proje), m = cu(t.musteri);
        return '<span class="cell-main">' + esc(p ? p.ad : (m ? m.kisa : '—')) + '</span>' +
               (p && m ? '<span class="cell-sub">' + esc(m.kisa) + '</span>' : ''); },
      exportValue:function(t){ return t.proje || t.musteri || 'İç iş'; } }; },

    dep:function(vis){ return { key:'dep', label:'Departman', visible:vis !== false,
      render:function(t){ return esc(DB.depName(t.dep)); },
      exportValue:function(t){ return DB.depName(t.dep); } }; },

    sorumlu:function(){ return { key:'sorumlu', label:'Sorumlu',
      render:function(t){ return GV.user(t.sorumlu); },
      exportValue:function(t){ return DB.empName(t.sorumlu); } }; },

    veren:function(){ return { key:'veren', label:'Görevi veren',
      render:function(t){ return GV.user(t.veren); },
      exportValue:function(t){ return DB.empName(t.veren); } }; },

    kontrolEden:function(){ return { key:'kontrolEden', label:'Kontrol eden',
      render:function(t){ return GV.user(t.kontrolEden); },
      exportValue:function(t){ return DB.empName(t.kontrolEden); } }; },

    termin:function(){ return { key:'termin', label:'Termin',
      render:function(t){ return GV.dateCell(t.termin, { done:!!t.tamamlanma }); } }; },

    tamamlanma:function(){ return { key:'tamamlanma', label:'Tamamlanma',
      render:function(t){ return t.tamamlanma
        ? '<span class="cell-date is-done">' + F.dateShort(t.tamamlanma) + '</span>'
        : '<span class="u-faint">—</span>'; } }; },

    oncelik:function(){ return { key:'oncelik', label:'Öncelik',
      render:function(t){ return GV.pri(t.oncelik); } }; },

    ilerleme:function(vis){ return { key:'ilerleme', label:'İlerleme', visible:vis !== false,
      render:function(t){ return GV.progress(t.ilerleme); } }; },

    durum:function(){ return { key:'durum', label:'Durum',
      render:function(t){ return GV.badge(t.durum); } }; },

    tahmini:function(){ return { key:'tahminiSure', label:'Tahmini', cellClass:'num',
      render:function(t){ return '<span class="u-num">' + F.hours(t.tahminiSure) + '</span>'; } }; },

    gercek:function(){ return { key:'gercekSure', label:'Gerçekleşen', cellClass:'num',
      render:function(t){ return '<span class="u-num">' + F.hours(t.gercekSure) + '</span>'; } }; },

    sure:function(){ return { key:'gercekSure', label:'Tahmini / Gerçek', cellClass:'num',
      render:function(t){ return '<span class="u-num">' + F.hours(t.tahminiSure) + ' / <b>' + F.hours(t.gercekSure) + '</b></span>'; },
      exportValue:function(t){ return t.tahminiSure + ' / ' + t.gercekSure; } }; },

    sapma:function(){ return { key:'sapma', label:'Sapma', cellClass:'num', sortValue:sapma,
      render:function(t){
        var s = sapma(t);
        if(!s) return '<span class="u-faint">—</span>';
        return '<span class="u-num ' + (s > 0 ? 'u-danger' : 'u-ok') + '">' + (s > 0 ? '+' : '−') + F.hours(Math.abs(s)) + '</span>'; },
      exportValue:function(t){ return sapma(t); } }; },

    faturalanabilir:function(vis){ return { key:'faturalanabilir', label:'Faturalanabilir', cellClass:'num', visible:vis !== false,
      render:function(t){ return '<span class="u-num">' + F.hours(t.faturalanabilir) + '</span>'; } }; },

    gecikme:function(){ return { key:'gecikme', label:'Gecikme', cellClass:'num', sortValue:gecikmeGun,
      render:function(t){
        var g = gecikmeGun(t);
        return g ? '<span class="u-num u-danger">' + F.num(g) + ' gün</span>' : '<span class="u-faint">—</span>'; },
      exportValue:function(t){ return gecikmeGun(t); } }; },

    asim:function(){ return { key:'asim', label:'Termin aşımı', cellClass:'num', sortValue:terminAsim,
      render:function(t){
        var g = terminAsim(t);
        return g ? '<span class="u-num u-danger">' + F.num(g) + ' gün</span>' : '<span class="u-num u-ok">0 gün</span>'; },
      exportValue:function(t){ return terminAsim(t); } }; },

    sonuc:function(){ return { key:'sonuc', label:'Termin sonucu', sortValue:function(t){ return terminSonuc(t) || 'zzz'; },
      render:function(t){
        var s = terminSonuc(t);
        if(!s) return '<span class="u-faint">Sonuç belli değil</span>';
        return GV.badge(s, s === 'Zamanında' ? 'is-ok' : s === 'Geç tamamlandı' ? 'is-warn' : 'is-danger'); },
      exportValue:function(t){ return terminSonuc(t) || '—'; } }; },

    revizyon:function(){ return { key:'revizyon', label:'Revizyon', cellClass:'num',
      render:function(t){
        return (t.revizyon || 0) > 0
          ? '<span class="u-num u-warn">' + F.num(t.revizyon) + '</span>'
          : '<span class="u-faint">0</span>'; } }; },

    yeniden:function(){ return { key:'yenidenAcilma', label:'Yeniden açılma', cellClass:'num',
      render:function(t){
        return (t.yenidenAcilma || 0) > 0
          ? '<span class="u-num u-danger">' + F.num(t.yenidenAcilma) + '</span>'
          : '<span class="u-faint">0</span>'; } }; },

    kalite:function(){ return { key:'kalite', label:'Kalite puanı', cellClass:'num', sortValue:kalitePuan,
      render:function(t){ return GV.progress(kalitePuan(t)); },
      exportValue:function(t){ return kalitePuan(t); } }; },

    kaliteSinif:function(){ return { key:'kaliteSinif', label:'Sonuç', sortValue:kalitePuan,
      render:function(t){ return kaliteBadge(t); },
      exportValue:function(t){ return kaliteSinif(t); } }; },

    engelNedeni:function(){ return { key:'engelNedeni', label:'Engel nedeni', cellClass:'cell-wrap', width:'24%',
      render:function(t){ return t.engelNedeni ? esc(t.engelNedeni) : '<span class="u-faint">Belirtilmedi</span>'; } }; },

    /* Bekleme nedeni DURUM DEĞİL, ikinci eksendir (REVİZE 01) — bu yüzden
       durum rozetinin yanında ayrı kolon olarak durur, onun yerine geçmez. */
    beklemeNedeni:function(){ return { key:'beklemeNedeni', label:'Bekleme nedeni',
      render:function(t){ return t.beklemeNedeni
        ? GV.badge(t.beklemeNedeni, 'is-warn')
        : '<span class="u-faint">Beklemiyor</span>'; },
      exportValue:function(t){ return t.beklemeNedeni || '—'; } }; },

    beklemeNotu:function(){ return { key:'beklemeNotu', label:'Bekleme notu', cellClass:'cell-wrap', width:'24%',
      render:function(t){ return t.beklemeNotu ? esc(t.beklemeNotu) : '<span class="u-faint">—</span>'; } }; },

    revizeNot:function(){ return { key:'revizeNot', label:'Revize notu', cellClass:'cell-wrap', width:'22%',
      render:function(t){ return t.revizeNot ? esc(t.revizeNot) : '<span class="u-faint">—</span>'; } }; },

    cikti:function(vis){ return { key:'teslimEdilenCikti', label:'Teslim edilen çıktı', visible:vis !== false,
      render:function(t){ return t.teslimEdilenCikti ? esc(t.teslimEdilenCikti) : '<span class="u-faint">—</span>'; } }; },

    kaynakKanal:function(){ return { key:'kaynak', label:'Kaynak sohbet', cellClass:'cell-wrap',
      sortValue:function(t){ var m = SOHBET[t.kod]; return m ? m.tarih : ''; },
      render:function(t){
        var m = SOHBET[t.kod];
        if(!m) return '<span class="u-faint">—</span>';
        var k = ch(m.kanal);
        return '<span class="cell-main">' + esc(k ? k.ad : m.kanal) + '</span>' +
               '<span class="cell-sub">' + esc(DB.empName(m.kisi)) + ' · ' + F.dt(m.tarih) + '</span>'; },
      exportValue:function(t){ var m = SOHBET[t.kod], k = m ? ch(m.kanal) : null; return k ? k.ad : '—'; } }; }
  };

  /* Özet (kırılım) tablosu kolonları */
  var A = {
    ad:function(baslik){ return { key:'ad', label:baslik, width:'24%', cellClass:'cell-wrap', locked:true,
      render:function(a){ return '<span class="cell-main">' + esc(a.ad) + '</span>' +
        '<span class="cell-code">' + esc(a.kod) + '</span>'; },
      exportValue:function(a){ return a.ad; } }; },
    toplam:function(){ return { key:'toplam', label:'Toplam görev', cellClass:'num',
      render:function(a){ return '<span class="u-num u-b">' + F.num(a.toplam) + '</span>'; } }; },
    acikAdet:function(){ return { key:'acik', label:'Açık', cellClass:'num',
      render:function(a){ return '<span class="u-num">' + F.num(a.acik) + '</span>'; } }; },
    gecikenAdet:function(){ return { key:'geciken', label:'Geciken', cellClass:'num',
      render:function(a){ return a.geciken ? '<span class="u-num u-danger">' + F.num(a.geciken) + '</span>' : '<span class="u-faint">0</span>'; } }; },
    tamamAdet:function(){ return { key:'tamam', label:'Tamamlanan', cellClass:'num',
      render:function(a){ return '<span class="u-num u-ok">' + F.num(a.tamam) + '</span>'; } }; },
    sure:function(){ return { key:'gercek', label:'Tahmini / Gerçek', cellClass:'num',
      render:function(a){ return '<span class="u-num">' + F.hours(a.tahmini) + ' / <b>' + F.hours(a.gercek) + '</b></span>'; },
      exportValue:function(a){ return a.tahmini + ' / ' + a.gercek; } }; },
    sapma:function(){ return { key:'sapma', label:'Sapma', cellClass:'num',
      render:function(a){
        if(!a.sapma) return '<span class="u-faint">—</span>';
        return '<span class="u-num ' + (a.sapma > 0 ? 'u-danger' : 'u-ok') + '">' + (a.sapma > 0 ? '+' : '−') + F.hours(Math.abs(a.sapma)) + '</span>'; } }; },
    oran:function(){ return { key:'oran', label:'Zamanında %', cellClass:'num',
      render:function(a){ return a.oran == null ? '<span class="u-faint">—</span>' : GV.progress(a.oran); },
      exportValue:function(a){ return a.oran; } }; },
    revizyon:function(){ return { key:'revizyon', label:'Revizyon turu', cellClass:'num',
      render:function(a){ return a.revizyon ? '<span class="u-num u-warn">' + F.num(a.revizyon) + '</span>' : '<span class="u-faint">0</span>'; } }; }
  };

  /* =================================================================
     4. ORTAK TABLO / MOBİL / BOŞ DURUM
     ================================================================= */
  function mTask(t){
    return '<div class="gv-mrow-top"><a class="cell-main" href="app-gorev-detay.html?id=' + t.kod + '">' + esc(t.baslik) + '</a>' +
      GV.pri(t.oncelik) + '</div>' +
      '<div class="gv-mrow-code">' + t.kod + ' · ' + esc(t.tur) + '</div>' +
      '<div class="gv-mrow-meta"><span>' + ico('i-user','ic-sm') + esc(DB.empName(t.sorumlu)) + '</span>' +
      '<span>' + ico('i-calendar','ic-sm') + F.dateShort(t.termin) + '</span>' +

          emptyState:{ icon:'i-arrow-right', title:'Departman talebi yok',
            desc:'Seçilen kapsamda departmanlar arası iş talebi bulunmuyor.' } } },

      { key:'sohbet', label:'Sohbetten oluşan görevler', icon:'i-chat', group:'Kaynak',
        title:'Sohbetten Oluşan Görevler', desc:'Kanal mesajlarından doğan görevler — mesajda bağlanan ya da metinde geçen görev kodları üzerinden eşleştirilir.',
        rows:function(f){ return base(f).filter(function(t){ return !!SOHBET[t.kod]; }); },
        kpis:[
          { label:'Sohbetten oluşan görev', icon:'i-chat', tone:'purple', calc:function(r){ return r.length; } },
          { label:'Kaynak kanal', icon:'i-layers', tone:'info', calc:function(r){
              var s = {}; r.forEach(function(t){ var m = SOHBET[t.kod]; if(m) s[m.kanal] = 1; }); return Object.keys(s).length; } },
          { label:'Açık görev', icon:'i-tasks', tone:'warn', calc:function(r){ return r.filter(acik).length; } },
          { label:'Geciken', icon:'i-alert', tone:'danger', calc:function(r){ return r.filter(geciken).length; } }
        ],
        charts:function(r){
          if(!r.length) return [];
          var kanal = tally(r, function(t){ var m = SOHBET[t.kod], k = m ? ch(m.kanal) : null; return k ? k.ad : '—'; });
          return [{ title:'Kanal bazlı görev üretimi', sub:'görev adedi', wide:true, html:GV.chart.bar(kanal) }, kartDurum(r)];
        },
        table:tGorev({ exportName:'gorev-rapor-sohbet', exportTitle:'Sohbetten Oluşan Görevler Raporu',
          defaultSort:'kaynak', defaultDir:'desc',
          columns:[C.gorev(), C.kaynakKanal(), C.proje(), C.sorumlu(), C.termin(), C.oncelik(), C.durum()],
          emptyState:{ icon:'i-chat', title:'Sohbetten oluşan görev yok',
            desc:'Seçilen kapsamda mesajlara bağlanmış görev bulunmuyor.' } }) },

      { key:'toplanti', label:'Toplantıdan oluşan görevler', icon:'i-calendar-check', group:'Kaynak',
        title:'Toplantıdan Oluşan Görevler', desc:'Toplantı kararları ve aksiyonları ile bunların göreve dönüşme oranı; göreve bağlanmayan kararlar takipsiz kalan işlerdir.',
        rows:function(f){
          return DB.decisions.filter(function(k){
            var t = k.gorev ? gv(k.gorev) : null, m = mt(k.toplanti);
            if(f.dep && (!t || t.dep !== f.dep)) return false;
            if(f.personel && k.sorumlu !== f.personel) return false;
            if(f.proje && !(m && m.proje === f.proje) && !(t && t.proje === f.proje)) return false;
            if(f.musteri && !(m && m.musteri === f.musteri) && !(t && t.musteri === f.musteri)) return false;
            if(f.durum && k.durum !== f.durum) return false;
            if(f.tarih && (!k.termin || k.termin < f.tarih)) return false;
            return true;
          });
        },
        kpis:[
          { label:'Toplantı kararı', icon:'i-calendar-check', calc:function(r){ return r.length; } },
          { label:'Göreve dönüşen', icon:'i-tasks', tone:'ok',
            calc:function(r){ return r.filter(function(k){ return !!k.gorev; }).length; } },
          { label:'Göreve dönüşme oranı', icon:'i-percent', tone:'info', format:F.pct,
            calc:function(r){ return r.length ? Math.round(r.filter(function(k){ return !!k.gorev; }).length * 100 / r.length) : 0; } },
          { label:'Geciken karar', icon:'i-alert', tone:'danger', calc:function(r){
              return r.filter(function(k){ return k.durum !== 'Tamamlandı' && k.termin && F.days(k.termin) < 0; }).length; } }
        ],
        charts:function(r){
          if(!r.length) return [];
          var top1 = tally(r, function(k){ var m = mt(k.toplanti); return m ? m.ad : k.toplanti; });
          var don = [
            { label:'Göreve dönüşen', value:r.filter(function(k){ return !!k.gorev; }).length },
            { label:'Göreve dönüşmeyen', value:r.filter(function(k){ return !k.gorev; }).length }
          ].filter(function(d){ return d.value; });
          return [{ title:'Toplantı bazlı karar adedi', sub:'karar / aksiyon', wide:true, html:GV.chart.bar(top1) },
                  { title:'Göreve dönüşüm', html:GV.chart.donut(don, { center:String(r.length), centerSub:'karar' }), legend:don }];
        },
        table:{ key:'kod', pageSize:25, archive:false,
          exportName:'gorev-rapor-toplanti', exportTitle:'Toplantıdan Oluşan Görevler Raporu',
          search:{ placeholder:'Karar veya toplantı ara', fields:['kod','karar','toplanti','gorev'] },
          defaultSort:'termin', defaultDir:'asc',
          columns:[
            { key:'karar', label:'Karar / Aksiyon', width:'28%', cellClass:'cell-wrap', locked:true,
              render:function(k){ return '<span class="cell-main">' + esc(k.karar) + '</span>' +
                '<span class="cell-code">' + k.kod + '</span>'; },
              exportValue:function(k){ return k.kod + ' — ' + k.karar; } },
            { key:'toplanti', label:'Toplantı',
              render:function(k){
                var m = mt(k.toplanti);
                return '<span class="cell-main">' + esc(m ? m.ad : k.toplanti) + '</span>' +
                       (m ? '<span class="cell-sub">' + esc(m.tur) + ' · ' + F.dt(m.tarih) + '</span>' : ''); },
              exportValue:function(k){ var m = mt(k.toplanti); return m ? m.ad : k.toplanti; } },
            { key:'sorumlu', label:'Sorumlu', render:function(k){ return GV.user(k.sorumlu); },
              exportValue:function(k){ return DB.empName(k.sorumlu); } },
            { key:'termin', label:'Termin',
              render:function(k){ return GV.dateCell(k.termin, { done:k.durum === 'Tamamlandı' }); } },
            { key:'gorev', label:'Oluşan görev',
              render:function(k){
                if(!k.gorev) return '<span class="u-faint">Göreve dönüşmedi</span>';
                var t = gv(k.gorev);
                return '<a class="cell-main" href="app-gorev-detay.html?id=' + k.gorev + '">' + k.gorev + '</a>' +
                       (t ? '<span class="cell-sub">' + esc(t.baslik) + '</span>' : ''); },
              exportValue:function(k){ return k.gorev || '—'; } },
            { key:'gorevDurum', label:'Görev durumu', sortValue:function(k){ var t = k.gorev ? gv(k.gorev) : null; return t ? t.durum : 'zzz'; },
              render:function(k){ var t = k.gorev ? gv(k.gorev) : null; return t ? GV.badge(t.durum) : '<span class="u-faint">—</span>'; },
              exportValue:function(k){ var t = k.gorev ? gv(k.gorev) : null; return t ? t.durum : '—'; } },
            { key:'durum', label:'Karar durumu', render:function(k){ return GV.badge(k.durum); } }
          ],
          mobile:function(k){
            return '<div class="gv-mrow-top"><span class="cell-main">' + esc(k.karar) + '</span></div>' +
              '<div class="gv-mrow-code">' + k.kod + ' · ' + esc((mt(k.toplanti) || {}).ad || k.toplanti) + '</div>' +
              '<div class="gv-mrow-meta"><span>' + ico('i-user','ic-sm') + esc(DB.empName(k.sorumlu)) + '</span>' +
              '<span>' + ico('i-calendar','ic-sm') + F.dateShort(k.termin) + '</span></div>' +
              '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(k.durum) + '</span>' +
              (k.gorev ? '<a class="cell-main" href="app-gorev-detay.html?id=' + k.gorev + '">' + k.gorev + '</a>' : '') + '</div>';
          },
          emptyState:{ icon:'i-calendar-check', title:'Toplantı kararı yok',
            desc:'Seçilen kapsamda toplantıdan doğan karar ya da aksiyon bulunmuyor.' } } }

    ]
  });
});
</script>
</body>
</html>
