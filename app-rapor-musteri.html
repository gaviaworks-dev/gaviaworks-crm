<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Müşteri Raporları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="rapor" data-screen="rapormusteri">
<div id="rapor"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  var canFin = GV.perm.can('finans');          /* para alanları — §26-D */
  var canExp = GV.perm.can('disaAktar');       /* çıktı yetkisi */
  var TODAY  = DB.today;                       /* referans tarih — new Date() kullanılmaz */

  /* ===== indeksler ===================================================== */
  var CUS = {}; DB.customers.forEach(function(c){ CUS[c.kod] = c; });
  var PRJ = {}; DB.projects.forEach(function(p){ PRJ[p.kod] = p; });
  function cus(k){ return CUS[k] || null; }
  function cname(k){ var c = cus(k); return c ? c.kisa : (k || '—'); }
  function shortName(k){ var c = cus(k); return c ? String(c.kisa).split(' ')[0] : String(k || '—').slice(-3); }
  function sum(a, fn){ return a.reduce(function(s, x){ return s + (fn(x) || 0); }, 0); }
  function avg(a, fn){ return a.length ? sum(a, fn) / a.length : 0; }
  function uniq(a){ var o = []; a.forEach(function(x){ if(x && o.indexOf(x) === -1) o.push(x); }); return o; }
  function topN(data, n){
    return data.slice().sort(function(a, b){ return (b.value || 0) - (a.value || 0); }).slice(0, n || 8);
  }
  function byMonth(rows, dateOf, valOf){
    var m = {}, keys = [];
    rows.forEach(function(x){
      var d = dateOf(x); if(!d) return;
      var k = String(d).slice(0, 7);
      if(!(k in m)){ m[k] = 0; keys.push(k); }
      m[k] += valOf ? (valOf(x) || 0) : 1;
    });
    keys.sort();
    return { labels:keys.map(function(k){ return F.dateShort(k + '-01').split(' ')[1] + ' ' + k.slice(2, 4); }),
             values:keys.map(function(k){ return m[k]; }) };
  }

  /* ===== para yetkisi =================================================== */
  function mny(n){
    return canFin ? '<span class="cell-money">' + F.money(n) + '</span>'
                  : '<span class="cell-mask">••••••</span>';
  }
  function kMoney(v){ return canFin ? F.moneyK(v) : '••••••'; }
  function moneyCol(key, label, subFn){
    return { key:key, label:label, cellClass:'num',
      sortValue:function(x){ return x[key] || 0; },
      exportValue:function(x){ return canFin ? (x[key] || 0) : ''; },
      render:function(x){ return mny(x[key]) + (subFn ? '<span class="cell-sub">' + subFn(x) + '</span>' : ''); } };
  }
  function moneyChart(cardIfCan, cardElse){ return canFin ? cardIfCan : cardElse; }

  /* ===== ortak filtre uygulaması ======================================= */
  function projeOk(f, musteri, proje){
    if(!f.proje) return true;
    if(proje) return proje === f.proje;
    var p = PRJ[f.proje];                       /* kaydın projesi yoksa müşteri üzerinden eşleşir */
    return !!p && p.musteri === musteri;
  }
  function pass(f, musteri, tarih, proje, kayitSorumlu){
    if(f.sorumlu){
      var c0 = cus(musteri);
      var ok = (c0 && c0.sorumlu === f.sorumlu) || (kayitSorumlu && kayitSorumlu === f.sorumlu);
      if(!ok) return false;
    }
    if(!musteri){
      if(f.musteri || f.durum || f.proje) return false;   /* müşteriye bağlanmamış kayıt */
    } else {
      if(f.musteri && musteri !== f.musteri) return false;
      var c = cus(musteri);
      if(f.durum && (!c || c.durum !== f.durum)) return false;
      if(!projeOk(f, musteri, proje)) return false;
    }
    if(f.tarih && tarih && String(tarih).slice(0, 10) < f.tarih) return false;
    return true;
  }
  function passCust(f, c){
    if(f.musteri && c.kod !== f.musteri) return false;
    if(f.durum && c.durum !== f.durum) return false;
    if(f.sorumlu && c.sorumlu !== f.sorumlu) return false;
    if(f.proje){ var p = PRJ[f.proje]; if(!p || p.musteri !== c.kod) return false; }
    if(f.tarih && c.sonIletisim && String(c.sonIletisim).slice(0, 10) < f.tarih) return false;
    return true;
  }

  /* ===== müşteri bazlı toplu hesap ===================================== */
  var ACIK_GOREV = ['Tamamlandı','İptal edildi','Arşivlendi'];
  var KAPALI_DESTEK = ['Çözüldü','Kapandı'];
  var BITEN_PROJE = ['Teslim'];

  function agg(c){
    var sz = DB.contracts.filter(function(x){ return x.musteri === c.kod; });
    var fa = DB.invoices.filter(function(x){ return x.musteri === c.kod; });
    var th = DB.payments.filter(function(x){ return x.musteri === c.kod; });
    var pr = DB.projects.filter(function(x){ return x.musteri === c.kod; });
    var gv = DB.tasks.filter(function(x){ return x.musteri === c.kod; });
    var ds = DB.tickets.filter(function(x){ return x.musteri === c.kod; });
    var kod = pr.map(function(p){ return p.kod; });
    var dg = DB.changeRequests.filter(function(x){ return kod.indexOf(x.proje) !== -1; });
    var gelir = sum(pr, function(p){ return p.sozlesmeTutari; });
    var maliyet = sum(pr, function(p){ return p.gerceklesenMaliyet; });
    return {
      sozlesmeAdet:sz.length, sozlesmeTutar:sum(sz, function(x){ return x.tutar; }),
      faturaAdet:fa.length,   faturaTutar:sum(fa, function(x){ return x.toplam; }),
      tahsilat:sum(th.filter(function(x){ return x.durum === 'Ödendi'; }), function(x){ return x.tutar; }),
      geciken:sum(th.filter(function(x){ return x.durum === 'Gecikti'; }), function(x){ return x.tutar; }),
      bekleyen:c.bekleyenTahsilat || 0,
      maliyet:maliyet, projeGeliri:gelir, kar:gelir - maliyet,
      marj:gelir ? Math.round((gelir - maliyet) / gelir * 100) : 0,
      projeSayisi:c.projeSayisi || 0, aktifProje:c.aktifProje || 0,
      gecikenProje:pr.filter(function(p){
        return BITEN_PROJE.indexOf(p.durum) === -1 && F.days(p.planlananBitis) < 0; }).length,
      harcananSaat:sum(pr, function(p){ return p.harcananSure; }),
      tahminiSaat:sum(pr, function(p){ return p.tahminiSure; }),
      gorevAdet:gv.length,
      acikGorev:gv.filter(function(t){ return ACIK_GOREV.indexOf(t.durum) === -1; }).length,
      destekAdet:ds.length,
      acikDestek:ds.filter(function(t){ return KAPALI_DESTEK.indexOf(t.durum) === -1; }).length,
      destekPuan:(function(){ var p = ds.filter(function(t){ return t.memnuniyet != null; });
        return p.length ? Math.round(avg(p, function(t){ return t.memnuniyet; }) * 10) / 10 : null; })(),
      revizyon:sum(gv, function(t){ return t.revizyon; }), degisiklik:dg.length
    };
  }
  function custRow(c){
    var a = agg(c), row = {
      kod:c.kod, unvan:c.unvan, kisa:c.kisa, sektor:c.sektor, buyukluk:c.buyukluk,
      durum:c.durum, risk:c.risk, sorumlu:c.sorumlu, sorumluAd:DB.empName(c.sorumlu),
      ilkKayit:c.ilkKayit, sonIletisim:c.sonIletisim, sonrakiAksiyon:c.sonrakiAksiyon,
      sonrakiTarih:c.sonrakiTarih, memnuniyet:c.memnuniyet, toplamCiro:c.toplamCiro || 0
    };
    for(var k in a) if(Object.prototype.hasOwnProperty.call(a, k)) row[k] = a[k];
    return row;
  }

  /* ===== ortak render parçaları ======================================== */
  function custCell(x){
    return '<a class="cell-main" href="app-musteri.html">' + esc(x.kisa || cname(x.kod)) + '</a>' +
           '<span class="cell-code">' + (x.kod || '') + ' · ' + esc(x.sektor || '—') + '</span>';
  }
  function musteriCol(){
    return { key:'musteriAd', label:'Müşteri', sortValue:function(x){ return cname(x.musteri); },
      exportValue:function(x){ return cname(x.musteri); },
      render:function(x){ return '<span class="cell-main">' + esc(cname(x.musteri)) + '</span>' +
        '<span class="cell-code">' + esc(x.musteri || '—') + '</span>'; } };
  }
  function scoreCell(v){ return '<span class="cell-money">' + F.num(v) + '</span>'; }
  function satisfaction(v){
    if(v == null) return '<span class="u-faint">—</span>';
    var t = v >= 4.5 ? 'ok' : v >= 3.5 ? '' : v >= 3 ? 'warn' : 'danger';
    return '<span class="cell-money' + (t ? ' u-' + t : '') + '">' + F.num(v, 1) + ' / 5</span>';
  }
  function tags(list){
    if(!list || !list.length) return '<span class="u-faint">—</span>';
    return list.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join(' ');
  }
  function onayBadge(v){
    return (!v || v === '—') ? '<span class="u-faint">—</span>' : GV.badge(v);
  }
  /* GV.chart.line boş seriyle çizilemez — veri yoksa kart hiç kurulmaz */
  function lineCard(data, build){ return data.labels.length ? build() : null; }

  /* ===== filtre seçenekleri ============================================ */
  var sorumluKodlari = uniq(
    DB.customers.map(function(c){ return c.sorumlu; })
    .concat(DB.projects.map(function(p){ return p.pm; }))
    .concat(DB.leads.map(function(l){ return l.sorumlu; }))
    .concat(DB.tickets.map(function(t){ return t.sorumlu; }))
    .concat(DB.payments.map(function(t){ return t.sorumlu; }))
    .concat(DB.quotes.map(function(q){ return q.hazirlayan; }))
  ).sort(function(a, b){ return DB.empName(a).localeCompare(DB.empName(b), 'tr'); });

  GV.pageHead({
    eyebrow:'Raporlar', title:'Müşteri Raporları',
    sub:'14 rapor · ortak tarih, müşteri, proje, durum ve sorumlu filtresi · özet kart + grafik + detay tablo',
    actions:[
      { label:'Müşteriler', icon:'i-building', href:'app-musteri.html' },
      { label:'Tahsilat Takibi', icon:'i-wallet', cls:'btn-acc', href:'app-tahsilat.html' }
    ]
  });

  GV.report({
    mount:'#rapor', id:'rapormusteri',
    filters:[
      { key:'tarih', label:'Başlangıç tarihi', type:'date' },
      { key:'musteri', label:'Müşteri', type:'select', all:'Tüm müşteriler',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'proje', label:'Proje', type:'select', all:'Tüm projeler',
        options:DB.projects.map(function(p){ return { value:p.kod, label:p.ad }; }) },
      { key:'durum', label:'Müşteri durumu', type:'select', all:'Tüm durumlar',
        options:uniq(DB.customers.map(function(c){ return c.durum; })) },
      { key:'sorumlu', label:'Sorumlu', type:'select', all:'Tüm sorumlular',
        options:sorumluKodlari.map(function(k){ return { value:k, label:DB.empName(k) }; }) }
    ],

    reports:[

    /* =================================================================
       1 · MÜŞTERİ GENEL RAPORU — PROMPT.md §20.1 (15 alan)
       ================================================================= */
    { key:'genel', label:'Müşteri genel raporu', icon:'i-building', group:'Genel',
      title:'Müşteri Genel Raporu',
      desc:'Her müşteri için sözleşme, fatura, tahsilat, bekleyen tahsilat, maliyet, kârlılık, proje, görev, destek, revizyon, son iletişim, sonraki aksiyon, memnuniyet ve risk göstergeleri tek tabloda.',
      rows:function(f){
        return DB.customers.filter(function(c){ return passCust(f, c); }).map(custRow);
      },
      kpis:[
        { label:'Müşteri', icon:'i-building', calc:function(r){ return r.length; } },
        { label:'Aktif müşteri', icon:'i-check-circle', tone:'ok',
          calc:function(r){ return r.filter(function(x){ return x.durum === 'Aktif'; }).length; } },
        { label:'Toplam sözleşme', icon:'i-file-check', format:kMoney,
          calc:function(r){ return sum(r, function(x){ return x.sozlesmeTutar; }); } },
        { label:'Bekleyen tahsilat', icon:'i-wallet', tone:'warn', format:kMoney,
          calc:function(r){ return sum(r, function(x){ return x.bekleyen; }); } }
      ],
      charts:function(r){
        var risk = {};
        r.forEach(function(x){ risk[x.risk] = (risk[x.risk] || 0) + 1; });
        var don = Object.keys(risk).map(function(k){ return { label:k, value:risk[k] }; });
        var para = { title:'Fatura ve tahsilat karşılaştırması', sub:'koyu sütun fatura · açık sütun tahsilat · en yüksek 8 müşteri', wide:true,
          html:GV.chart.bar(topN(r.map(function(x){
            return { label:shortName(x.kod), value:x.faturaTutar, value2:x.tahsilat }; })), { money:true }) };
        var sayi = { title:'Müşteri başına açık iş', sub:'açık görev + açık destek talebi', wide:true,
          html:GV.chart.bar(topN(r.map(function(x){
            return { label:shortName(x.kod), value:x.acikGorev + x.acikDestek }; }))) };
        return [moneyChart(para, sayi),
          { title:'Risk seviyesi dağılımı', html:GV.chart.donut(don, { center:String(r.length), centerSub:'müşteri' }), legend:don }];
      },
      table:{
        key:'kod', pageSize:10, archive:false, export:canExp,
        exportName:'musteri-genel-rapor', exportTitle:'Müşteri Genel Raporu',
        search:{ placeholder:'Müşteri, unvan, sektör veya sorumlu ara', fields:['kod','unvan','kisa','sektor','sorumluAd'] },
        defaultSort:'sozlesmeTutar', defaultDir:'desc',
        columns:[
          { key:'kod', label:'Müşteri', locked:true, width:'16%', cellClass:'cell-wrap',
            exportValue:function(x){ return x.unvan; }, render:custCell },
          moneyCol('sozlesmeTutar', 'Toplam sözleşme', function(x){ return x.sozlesmeAdet + ' sözleşme'; }),
          moneyCol('faturaTutar', 'Toplam fatura', function(x){ return x.faturaAdet + ' fatura'; }),
          moneyCol('tahsilat', 'Toplam tahsilat'),
          moneyCol('bekleyen', 'Bekleyen tahsilat', function(x){ return x.geciken ? 'gecikmiş var' : 'gecikme yok'; }),
          moneyCol('maliyet', 'Toplam maliyet', function(x){ return F.num(x.harcananSaat) + ' saat'; }),
          moneyCol('kar', 'Kârlılık', function(x){ return x.projeGeliri ? '%' + x.marj + ' marj' : 'proje kaydı yok'; }),
          { key:'aktifProje', label:'Aktif projeler', cellClass:'num',
            render:function(x){ return scoreCell(x.aktifProje) + '<span class="cell-sub">' + x.projeSayisi + ' toplam</span>'; } },
          { key:'gecikenProje', label:'Geciken projeler', cellClass:'num',
            render:function(x){ return x.gecikenProje
              ? '<span class="cell-money u-danger">' + x.gecikenProje + '</span>'
              : '<span class="u-faint">0</span>'; } },
          { key:'acikGorev', label:'Açık görevler', cellClass:'num',
            render:function(x){ return scoreCell(x.acikGorev) + '<span class="cell-sub">' + x.gorevAdet + ' toplam</span>'; } },
          { key:'destekAdet', label:'Destek talepleri', cellClass:'num',
            render:function(x){ return scoreCell(x.destekAdet) + '<span class="cell-sub">' + x.acikDestek + ' açık</span>'; } },
          { key:'revizyon', label:'Revizyonlar', cellClass:'num',
            render:function(x){ return scoreCell(x.revizyon) + '<span class="cell-sub">' + x.degisiklik + ' değişiklik talebi</span>'; } },
          { key:'sonIletisim', label:'Son iletişim',
            render:function(x){ return GV.dateCell(x.sonIletisim, { done:true }); } },
          { key:'sonrakiAksiyon', label:'Sonraki aksiyon', width:'14%', cellClass:'cell-wrap',
            render:function(x){ return '<span class="cell-main">' + esc(x.sonrakiAksiyon || '—') + '</span>' +
              (x.sonrakiTarih ? '<span class="cell-sub">' + F.dateShort(x.sonrakiTarih) + ' · ' + F.rel(x.sonrakiTarih) + '</span>' : ''); } },
          { key:'memnuniyet', label:'Memnuniyet', cellClass:'num',
            render:function(x){ return satisfaction(x.memnuniyet); } },
          { key:'risk', label:'Risk seviyesi', render:function(x){
              return GV.badge(x.risk, x.risk === 'Yüksek' ? 'is-danger' : x.risk === 'Orta' ? 'is-warn' : 'is-ok'); } }
        ],
        mobile:function(x){
          return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.kisa) + '</span>' + mny(x.sozlesmeTutar) + '</div>' +
                 '<div class="gv-mrow-code">' + x.kod + ' · ' + esc(x.sektor) + ' · ' + esc(x.sorumluAd) + '</div>' +
                 '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) +
                 GV.badge(x.risk, x.risk === 'Yüksek' ? 'is-danger' : x.risk === 'Orta' ? 'is-warn' : 'is-ok') +
                 '</span><span class="cell-sub">' + x.aktifProje + ' aktif proje · ' + x.acikDestek + ' açık destek</span></div>';
        },
        emptyState:{ icon:'i-building', title:'Bu filtrede müşteri yok',
          desc:'Tarih, müşteri, proje, durum veya sorumlu filtresini değiştirin.' }
      }
    },

    /* =================================================================
       2 · İLETİŞİM RAPORU
       ================================================================= */
    { key:'iletisim', label:'İletişim raporu', icon:'i-phone', group:'Müşteri İlişkileri',
      title:'İletişim Raporu',
      desc:'Müşteri etkileşimlerinin kanal, kişi ve zaman dağılımı; planlanmış toplantılarla birlikte iletişim sıklığı.',
      rows:function(f){
        return DB.interactions.filter(function(x){
          return x.musteri && pass(f, x.musteri, x.tarih, null, x.kisi);
        }).map(function(x){
          return { kod:x.kod, musteri:x.musteri, musteriAd:cname(x.musteri), tur:x.tur, tarih:x.tarih,
                   kisi:x.kisi, kisiAd:DB.empName(x.kisi), kontak:x.kontak, konu:x.konu,
                   ozet:x.ozet, sonuc:x.sonuc };
        });
      },
      kpis:[
        { label:'Etkileşim', icon:'i-phone', calc:function(r){ return r.length; } },
        { label:'Görüşülen müşteri', icon:'i-building', tone:'info',
          calc:function(r){ return uniq(r.map(function(x){ return x.musteri; })).length; } },
        { label:'Toplantı', icon:'i-calendar-check', tone:'accent',
          calc:function(r){ return r.filter(function(x){ return x.tur === 'Toplantı'; }).length; } },
        { label:'Planlı toplantı', icon:'i-calendar', tone:'warn',
          calc:function(r, f){ return DB.meetings.filter(function(m){
            return m.musteri && m.durum === 'Planlandı' && pass(f, m.musteri, m.tarih, m.proje); }).length; } }
      ],
      charts:function(r){
        var tur = {};
        r.forEach(function(x){ tur[x.tur] = (tur[x.tur] || 0) + 1; });
        var don = Object.keys(tur).map(function(k){ return { label:k, value:tur[k] }; });
        var ay = byMonth(r, function(x){ return x.tarih; });
        return [
          lineCard(ay, function(){
            return { title:'Aylık etkileşim sayısı', sub:'kayıtlı iletişim geçmişi', wide:true,
                     html:GV.chart.line([{ values:ay.values }], ay.labels) }; }),
          { title:'Kanal dağılımı', html:GV.chart.donut(don, { center:String(r.length), centerSub:'etkileşim' }), legend:don }
        ];
      },
      table:{
        key:'kod', pageSize:10, archive:false, export:canExp,
        exportName:'musteri-iletisim-rapor', exportTitle:'Müşteri İletişim Raporu',
        search:{ placeholder:'Konu, müşteri, kontak veya sonuç ara', fields:['kod','musteriAd','konu','ozet','kontak','sonuc'] },
        defaultSort:'tarih', defaultDir:'desc',
        tabs:[
          { key:'tumu', label:'Tümü', icon:'i-list', filter:null },
          { key:'toplanti', label:'Toplantı', icon:'i-calendar-check', filter:function(x){ return x.tur === 'Toplantı'; } },
          { key:'telefon', label:'Telefon', icon:'i-phone', filter:function(x){ return x.tur === 'Telefon'; } },
          { key:'eposta', label:'E-posta', icon:'i-mail', filter:function(x){ return x.tur === 'E-posta'; } }
        ],
        columns:[
          { key:'konu', label:'Konu', locked:true, width:'26%', cellClass:'cell-wrap',
            render:function(x){ return '<span class="cell-main">' + esc(x.konu) + '</span>' +
              '<span class="cell-sub">' + esc(x.ozet) + '</span>'; } },
          musteriCol(),
          { key:'tur', label:'Kanal', render:function(x){ return '<span class="tag">' + esc(x.tur) + '</span>'; } },
          { key:'tarih', label:'Tarih', render:function(x){ return '<span class="cell-date">' + F.dt(x.tarih) + '</span>'; } },
          { key:'kisiAd', label:'Görüşen', render:function(x){ return GV.user(x.kisi); } },
          { key:'kontak', label:'Muhatap', render:function(x){ return esc(x.kontak || '—'); } },
          { key:'sonuc', label:'Sonuç', cellClass:'cell-wrap', render:function(x){ return esc(x.sonuc || '—'); } }
        ],
        mobile:function(x){

        { label:'Açık bakiye', icon:'i-alert', tone:'danger', format:kMoney,
          calc:function(r){ return sum(r.filter(function(x){ return x.durum !== 'Ödendi'; }), function(x){ return x.toplam; }); } }
      ],
      charts:function(r){
        var dur = {};
        r.forEach(function(x){ dur[x.durum] = (dur[x.durum] || 0) + 1; });
        var don = Object.keys(dur).map(function(k){ return { label:k, value:dur[k] }; });
        var fat = byMonth(r, function(x){ return x.tarih; }, function(x){ return x.toplam; });
        var tah = byMonth(r, function(x){ return x.tarih; },
          function(x){ return x.durum === 'Ödendi' ? x.toplam : 0; });
        var adet = byMonth(r, function(x){ return x.tarih; });
        var para = lineCard(fat, function(){
          return { title:'Aylık fatura ve tahsilat', sub:'koyu çizgi fatura · açık çizgi tahsil edilen', wide:true,
            html:GV.chart.line([{ values:fat.values }, { values:tah.values }], fat.labels, { money:true }),
            legend:[{ label:'Fatura', value:sum(r, function(x){ return x.toplam; }) },
                    { label:'Tahsil edilen', value:sum(r.filter(function(x){ return x.durum === 'Ödendi'; }), function(x){ return x.toplam; }) }] }; });
        var sayi = lineCard(adet, function(){
          return { title:'Aylık fatura adedi', wide:true,
            html:GV.chart.line([{ values:adet.values }], adet.labels) }; });
        return [moneyChart(para, sayi),
          { title:'Fatura durumu dağılımı', html:GV.chart.donut(don, { center:String(r.length), centerSub:'fatura' }), legend:don }];
      },
      table:{
        key:'kod', pageSize:10, archive:false, export:canExp,
        exportName:'musteri-finans-rapor', exportTitle:'Müşteri Finans Raporu',
        search:{ placeholder:'Fatura, müşteri veya sözleşme ara', fields:['kod','musteriAd','sozlesme','durum'] },
        defaultSort:'tarih', defaultDir:'desc',
        tabs:[
          { key:'tumu', label:'Tümü', icon:'i-list', filter:null },
          { key:'acik', label:'Açık', icon:'i-hourglass', filter:function(x){ return x.durum !== 'Ödendi'; } },
          { key:'geciken', label:'Geciken', icon:'i-alert', filter:function(x){ return x.durum === 'Gecikti'; } },
          { key:'odenen', label:'Ödenen', icon:'i-check-circle', filter:function(x){ return x.durum === 'Ödendi'; } }
        ],
        columns:[
          { key:'kod', label:'Fatura', locked:true, width:'14%',
            render:function(x){ return '<a class="cell-main" href="app-fatura.html">' + x.kod + '</a>' +
              '<span class="cell-code">' + esc(x.sozlesme || 'sözleşmesiz') + '</span>'; } },
          musteriCol(),
          { key:'proje', label:'Proje', render:function(x){
              return x.proje ? '<span class="cell-code">' + x.proje + '</span>' : '<span class="u-faint">—</span>'; } },
          { key:'tarih', label:'Tarih', render:function(x){ return '<span class="cell-date">' + F.date(x.tarih) + '</span>'; } },
          { key:'vade', label:'Vade', render:function(x){ return GV.dateCell(x.vade, { done:x.durum === 'Ödendi' }); } },
          moneyCol('tutar', 'Tutar'),
          moneyCol('vergi', 'Vergi'),
          moneyCol('toplam', 'Toplam'),
          { key:'gecikme', label:'Gecikme', cellClass:'num', render:function(x){
              return x.gecikme ? '<span class="cell-money u-danger">' + x.gecikme + ' gün</span>' : '<span class="u-faint">—</span>'; } },
          { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } },
          { key:'odemeTarihi', label:'Ödeme tarihi', render:function(x){
              return x.odemeTarihi ? '<span class="cell-date is-done">' + F.date(x.odemeTarihi) + '</span>' : '<span class="u-faint">—</span>'; } }
        ],
        mobile:function(x){
          return '<div class="gv-mrow-top"><span class="cell-main">' + x.kod + '</span>' + mny(x.toplam) + '</div>' +
                 '<div class="gv-mrow-code">' + esc(x.musteriAd) + '</div>' +
                 '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + '</span>' +
                 '<span class="cell-date">Vade ' + F.date(x.vade) + '</span></div>';
        },
        emptyState:{ icon:'i-receipt', title:'Fatura yok', desc:'Seçili filtrede fatura kaydı bulunamadı.' }
      }
    },

    /* =================================================================
       12 · TAHSİLAT RAPORU
       ================================================================= */
    { key:'tahsilat', label:'Tahsilat raporu', icon:'i-wallet', group:'Finans',
      title:'Müşteri Tahsilat Raporu',
      desc:'Vade takibi, gecikme günü, son aksiyon ve tahsilat sorumlusu bazlı gecikme dağılımı.',
      rows:function(f){
        return DB.payments.filter(function(x){ return pass(f, x.musteri, x.vade, null, x.sorumlu); })
          .map(function(x){
            var o = {}; for(var k in x) if(Object.prototype.hasOwnProperty.call(x, k)) o[k] = x[k];
            o.sorumluAd = DB.empName(x.sorumlu);
            return o;
          });
      },
      kpis:[
        { label:'Tahsilat kaydı', icon:'i-wallet', calc:function(r){ return r.length; } },
        { label:'Gecikmiş tutar', icon:'i-alert', tone:'danger', format:kMoney,
          calc:function(r){ return sum(r.filter(function(x){ return x.durum === 'Gecikti'; }), function(x){ return x.tutar; }); } },
        { label:'Bekleyen tutar', icon:'i-hourglass', tone:'warn', format:kMoney,
          calc:function(r){ return sum(r.filter(function(x){ return x.durum === 'Bekliyor'; }), function(x){ return x.tutar; }); } },
        { label:'En uzun gecikme', icon:'i-timer', tone:'danger', format:function(v){ return v ? v + ' gün' : '—'; },
          calc:function(r){ return r.length ? Math.max.apply(null, r.map(function(x){ return x.gecikmeGun || 0; })) : 0; } }
      ],
      charts:function(r){
        var dur = {};
        r.forEach(function(x){ dur[x.durum] = (dur[x.durum] || 0) + 1; });
        var don = Object.keys(dur).map(function(k){ return { label:k, value:dur[k] }; });
        return [
          { title:'Gecikme günü', sub:'tahsilat kaydı bazında', wide:true,
            html:GV.chart.bar(topN(r.map(function(x){
              return { label:shortName(x.musteri), value:x.gecikmeGun || 0,
                       tone:x.gecikmeGun > 30 ? 'danger' : x.gecikmeGun > 0 ? 'warn' : 'ok' }; }))) },
          { title:'Tahsilat durumu', html:GV.chart.donut(don, { center:String(r.length), centerSub:'kayıt' }), legend:don }
        ];
      },
      table:{
        key:'kod', pageSize:10, archive:false, export:canExp,
        exportName:'musteri-tahsilat-rapor', exportTitle:'Müşteri Tahsilat Raporu',
        search:{ placeholder:'Tahsilat, fatura veya müşteri ara', fields:['kod','fatura','musteriAd','durum','sonAksiyon'] },
        defaultSort:'gecikmeGun', defaultDir:'desc',
        tabs:[
          { key:'tumu', label:'Tümü', icon:'i-list', filter:null },
          { key:'geciken', label:'Geciken', icon:'i-alert', filter:function(x){ return x.durum === 'Gecikti'; } },
          { key:'bekleyen', label:'Bekleyen', icon:'i-hourglass', filter:function(x){ return x.durum === 'Bekliyor'; } },
          { key:'tahsil', label:'Tahsil edilen', icon:'i-check-circle', filter:function(x){ return x.durum === 'Ödendi'; } }
        ],
        columns:[
          { key:'kod', label:'Tahsilat', locked:true, width:'16%',
            render:function(x){ return '<a class="cell-main" href="app-tahsilat.html">' + x.kod + '</a>' +
              '<span class="cell-code">' + esc(x.fatura) + '</span>'; } },
          musteriCol(),
          moneyCol('tutar', 'Tutar'),
          { key:'vade', label:'Vade', render:function(x){ return GV.dateCell(x.vade, { done:x.durum === 'Ödendi' }); } },
          { key:'gecikmeGun', label:'Gecikme', cellClass:'num', render:function(x){
              return x.gecikmeGun ? '<span class="cell-money u-danger">' + x.gecikmeGun + ' gün</span>' : '<span class="u-faint">—</span>'; } },
          { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } },
          { key:'sonAksiyon', label:'Son aksiyon', width:'20%', cellClass:'cell-wrap',
            render:function(x){ return '<span class="cell-main">' + esc(x.sonAksiyon) + '</span>' +
              '<span class="cell-sub">' + F.date(x.sonAksiyonTarihi) + '</span>'; } },
          { key:'sorumluAd', label:'Sorumlu', render:function(x){ return GV.user(x.sorumlu); } }
        ],
        mobile:function(x){
          return '<div class="gv-mrow-top"><span class="cell-main">' + x.kod + '</span>' + mny(x.tutar) + '</div>' +
                 '<div class="gv-mrow-code">' + esc(x.musteriAd) + ' · ' + esc(x.fatura) + '</div>' +
                 '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + '</span>' +
                 '<span class="cell-date">' + (x.gecikmeGun ? x.gecikmeGun + ' gün gecikme' : 'Vade ' + F.date(x.vade)) + '</span></div>';
        },
        emptyState:{ icon:'i-wallet', title:'Tahsilat kaydı yok', desc:'Seçili filtrede tahsilat bulunamadı.' }
      }
    },

    /* =================================================================
       13 · KÂRLILIK RAPORU
       ================================================================= */
    { key:'karlilik', label:'Kârlılık raporu', icon:'i-percent', group:'Finans',
      title:'Müşteri Kârlılık Raporu',
      desc:'Proje geliri ile gerçekleşen maliyet farkından türeyen müşteri kârlılığı, marj yüzdesi ve efor sapması.',
      rows:function(f){
        return DB.customers.filter(function(c){ return passCust(f, c); }).map(custRow)
          .filter(function(x){ return x.projeGeliri > 0 || x.maliyet > 0; })
          .map(function(x){
            x.sapma = x.tahminiSaat ? Math.round((x.harcananSaat - x.tahminiSaat) / x.tahminiSaat * 100) : 0;
            return x;
          });
      },
      kpis:[
        { label:'Proje geliri', icon:'i-wallet', format:kMoney,
          calc:function(r){ return sum(r, function(x){ return x.projeGeliri; }); } },
        { label:'Toplam maliyet', icon:'i-receipt', tone:'warn', format:kMoney,
          calc:function(r){ return sum(r, function(x){ return x.maliyet; }); } },
        { label:'Kâr', icon:'i-trend-up', tone:'ok', format:kMoney,
          calc:function(r){ return sum(r, function(x){ return x.kar; }); } },
        { label:'Ortalama marj', icon:'i-percent', tone:'accent', format:function(v){ return F.pct(v); },
          calc:function(r){
            var g = sum(r, function(x){ return x.projeGeliri; });
            return g ? Math.round(sum(r, function(x){ return x.kar; }) / g * 100) : 0; } }
      ],
      charts:function(r){
        return [
          moneyChart(
            { title:'Gelir ve maliyet', sub:'koyu sütun proje geliri · açık sütun gerçekleşen maliyet', wide:true,
              html:GV.chart.bar(topN(r.map(function(x){
                return { label:shortName(x.kod), value:x.projeGeliri, value2:x.maliyet }; })), { money:true }) },
            { title:'Efor sapması', sub:'harcanan / tahmini saat farkı, yüzde', wide:true,
              html:GV.chart.bar(r.map(function(x){
                return { label:shortName(x.kod), value:Math.abs(x.sapma), tone:x.sapma > 0 ? 'danger' : 'ok' }; })) }),
          { title:'Kâr marjı', sub:'müşteri bazında yüzde',
            html:GV.chart.bar(r.map(function(x){
              return { label:shortName(x.kod), value:Math.max(0, x.marj),
                       tone:x.marj < 20 ? 'danger' : x.marj < 35 ? 'warn' : 'ok' }; }), { height:200 }) }
        ];
      },
      table:{
        key:'kod', pageSize:10, archive:false, export:canExp,
        exportName:'musteri-karlilik-rapor', exportTitle:'Müşteri Kârlılık Raporu',
        search:{ placeholder:'Müşteri veya sektör ara', fields:['kod','unvan','kisa','sektor'] },
        defaultSort:'kar', defaultDir:'desc',
        columns:[
          { key:'kod', label:'Müşteri', locked:true, width:'20%', cellClass:'cell-wrap',
            exportValue:function(x){ return x.unvan; }, render:custCell },
          { key:'projeSayisi', label:'Proje', cellClass:'num',
            render:function(x){ return scoreCell(x.projeSayisi) + '<span class="cell-sub">' + x.aktifProje + ' aktif</span>'; } },
          moneyCol('projeGeliri', 'Proje geliri'),
          moneyCol('maliyet', 'Gerçekleşen maliyet'),
          moneyCol('kar', 'Kâr'),
          { key:'marj', label:'Marj', cellClass:'num', render:function(x){
              return '<span class="cell-money' + (x.marj < 20 ? ' u-danger' : x.marj < 35 ? ' u-warn' : ' u-ok') + '">%' + x.marj + '</span>'; } },
          { key:'harcananSaat', label:'Harcanan saat', cellClass:'num',
            render:function(x){ return '<span class="cell-money">' + F.num(x.harcananSaat) + '</span>' +
              '<span class="cell-sub">' + F.num(x.tahminiSaat) + ' tahmini</span>'; } },
          { key:'sapma', label:'Efor sapması', cellClass:'num', render:function(x){
              return '<span class="cell-money' + (x.sapma > 0 ? ' u-danger' : ' u-ok') + '">%' + x.sapma + '</span>'; } },
          { key:'memnuniyet', label:'Memnuniyet', cellClass:'num', render:function(x){ return satisfaction(x.memnuniyet); } },
          { key:'risk', label:'Risk', render:function(x){
              return GV.badge(x.risk, x.risk === 'Yüksek' ? 'is-danger' : x.risk === 'Orta' ? 'is-warn' : 'is-ok'); } }
        ],
        mobile:function(x){
          return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.kisa) + '</span>' + mny(x.kar) + '</div>' +
                 '<div class="gv-mrow-code">' + x.kod + ' · %' + x.marj + ' marj</div>' +
                 '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + '</span>' +
                 '<span class="cell-sub">' + F.num(x.harcananSaat) + ' saat</span></div>';
        },
        emptyState:{ icon:'i-percent', title:'Kârlılık verisi yok',
          desc:'Seçili filtrede proje geliri veya maliyeti olan müşteri bulunamadı.' }
      }
    },

    /* =================================================================
       14 · MÜŞTERİ YAŞAM BOYU DEĞERİ
       ================================================================= */
    { key:'ltv', label:'Müşteri yaşam boyu değeri', icon:'i-trend-up', group:'Finans',
      title:'Müşteri Yaşam Boyu Değeri',
      desc:'Müşterinin ilk kaydından bugüne kadarki toplam cirosu, müşteri yaşı ve aylık ortalama değeri. Referans tarih: ' + F.date(TODAY) + '.',
      rows:function(f){
        return DB.customers.filter(function(c){ return passCust(f, c); }).map(function(c){
          var x = custRow(c);
          x.yasAy = Math.max(1, Math.round(-F.days(c.ilkKayit) / 30.44));
          x.aylikDeger = Math.round(x.toplamCiro / x.yasAy);
          x.ortProje = x.projeSayisi ? Math.round(x.toplamCiro / x.projeSayisi) : 0;
          x.segment = x.toplamCiro >= 1000000 ? 'A · 1M+' : x.toplamCiro >= 500000 ? 'B · 500B–1M' : 'C · 500B altı';
          return x;
        });
      },
      kpis:[
        { label:'Toplam yaşam boyu değer', icon:'i-trend-up', format:kMoney,
          calc:function(r){ return sum(r, function(x){ return x.toplamCiro; }); } },
        { label:'Ortalama değer', icon:'i-wallet', tone:'info', format:kMoney,
          calc:function(r){ return Math.round(avg(r, function(x){ return x.toplamCiro; })); } },
        { label:'Ortalama müşteri yaşı', icon:'i-hourglass', tone:'accent',
          format:function(v){ return F.num(v) + ' ay'; },
          calc:function(r){ return Math.round(avg(r, function(x){ return x.yasAy; })); } },
        { label:'1M+ değerli müşteri', icon:'i-award', tone:'ok',
          calc:function(r){ return r.filter(function(x){ return x.toplamCiro >= 1000000; }).length; } }
      ],
      charts:function(r){
        var seg = ['A · 1M+','B · 500B–1M','C · 500B altı'].map(function(k){
          return { label:k, value:r.filter(function(x){ return x.segment === k; }).length }; })
          .filter(function(d){ return d.value; });
        var para = { title:'Müşteri yaşam boyu değeri', sub:'toplam ciro · en yüksek 8 müşteri', wide:true,
          html:GV.chart.bar(topN(r.map(function(x){
            return { label:shortName(x.kod), value:x.toplamCiro }; })), { money:true }) };
        var sayi = { title:'Müşteri yaşı', sub:'ay', wide:true,
          html:GV.chart.bar(topN(r.map(function(x){ return { label:shortName(x.kod), value:x.yasAy }; }))) };
        return [moneyChart(para, sayi),
          { title:'Değer segmentleri', html:GV.chart.donut(seg, { center:String(r.length), centerSub:'müşteri' }), legend:seg }];
      },
      table:{
        key:'kod', pageSize:10, archive:false, export:canExp,
        exportName:'musteri-yasam-boyu-deger', exportTitle:'Müşteri Yaşam Boyu Değeri',
        search:{ placeholder:'Müşteri, sektör veya segment ara', fields:['kod','unvan','kisa','sektor','segment'] },
        defaultSort:'toplamCiro', defaultDir:'desc',
        columns:[
          { key:'kod', label:'Müşteri', locked:true, width:'18%', cellClass:'cell-wrap',
            exportValue:function(x){ return x.unvan; }, render:custCell },
          { key:'segment', label:'Segment', render:function(x){ return '<span class="tag">' + esc(x.segment) + '</span>'; } },
          { key:'ilkKayit', label:'İlk kayıt', render:function(x){ return '<span class="cell-date">' + F.date(x.ilkKayit) + '</span>'; } },
          { key:'yasAy', label:'Müşteri yaşı', cellClass:'num',
            render:function(x){ return '<span class="cell-money">' + F.num(x.yasAy) + ' ay</span>'; } },
          moneyCol('toplamCiro', 'Toplam ciro'),
          moneyCol('aylikDeger', 'Aylık ortalama'),
          moneyCol('ortProje', 'Proje başına'),
          { key:'projeSayisi', label:'Proje', cellClass:'num',
            render:function(x){ return scoreCell(x.projeSayisi) + '<span class="cell-sub">' + x.sozlesmeAdet + ' sözleşme</span>'; } },
          moneyCol('bekleyen', 'Bekleyen tahsilat'),
          { key:'memnuniyet', label:'Memnuniyet', cellClass:'num', render:function(x){ return satisfaction(x.memnuniyet); } },
          { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } },
          { key:'risk', label:'Risk', render:function(x){
              return GV.badge(x.risk, x.risk === 'Yüksek' ? 'is-danger' : x.risk === 'Orta' ? 'is-warn' : 'is-ok'); } }
        ],
        mobile:function(x){
          return '<div class="gv-mrow-top"><span class="cell-main">' + esc(x.kisa) + '</span>' + mny(x.toplamCiro) + '</div>' +
                 '<div class="gv-mrow-code">' + x.kod + ' · ' + x.yasAy + ' ay · ' + esc(x.segment) + '</div>' +
                 '<div class="gv-mrow-bottom"><span class="gv-mrow-badges">' + GV.badge(x.durum) + '</span>' +
                 '<span class="cell-sub">aylık ' + (canFin ? F.moneyK(x.aylikDeger) : '••••••') + '</span></div>';
        },
        emptyState:{ icon:'i-trend-up', title:'Müşteri yok', desc:'Seçili filtrede müşteri bulunamadı.' }
      }
    }

    ]
  });
});
</script>
</body>
</html>
