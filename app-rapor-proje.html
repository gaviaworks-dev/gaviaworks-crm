<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Proje Raporları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="rapor" data-screen="raporproje">
<div id="rapor"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;
  var S = GV.session || {};

  /* =================================================================
     0. YETKİ
     finans → bütçe / maliyet / hakediş tutarları
     scope('gor') === 'proje' | 'kendi' → yalnız kullanıcının projeleri
     ================================================================= */
  var canFinans = GV.perm.can('finans');
  var gorScope  = GV.perm.scope('gor');
  var MASK      = '<span class="cell-mask">••••••</span>';

  function para(v){ return canFinans ? '<span class="cell-money">' + F.money(v) + '</span>' : MASK; }
  function paraNum(v){ return canFinans ? '<span class="u-num u-b">' + F.money(v) + '</span>' : MASK; }
  function paraExp(v){ return canFinans ? v : ''; }
  function kpiPara(v){ return canFinans ? F.money(v) : MASK; }

  /* Kullanıcının projesi mi — 'proje' ve 'kendi' kapsamında daraltılır */
  function seeProje(p){
    if(gorScope === 'tum' || gorScope === 'departman') return true;
    if(!S.emp) return true;
    return p.pm === S.emp || p.teknikSorumlu === S.emp || p.musteriSorumlu === S.emp ||
           (p.ekip || []).indexOf(S.emp) !== -1;
  }

  /* =================================================================
     1. SÖZLÜK VE TÜRETİLMİŞ ÖLÇÜLER
     Referans tarih daima DB.today (2026-08-03) — new Date() kullanılmaz.
     ================================================================= */
  var GOREV_KAPALI = ['Tamamlandı','İptal edildi','Arşivlendi'];

  function pr(kod){ return DB.projects.filter(function(x){ return x.kod === kod; })[0] || null; }
  function cu(kod){ return DB.customers.filter(function(x){ return x.kod === kod; })[0] || null; }
  function projeAd(kod){ var p = pr(kod); return p ? p.ad : (kod || '—'); }
  function musteriAd(kod){ var c = cu(kod); return c ? c.kisa : (kod || '—'); }
  function pKisa(p){ var c = cu(p.musteri); return c ? c.kisa.split(' ')[0] : p.kod.slice(-3); }
  function projeKisa(kod){ var p = pr(kod); return p ? pKisa(p) : (kod ? String(kod).slice(-3) : '—'); }

  /* ---- proje ölçüleri ---- */
  function teslimEdildi(p){ return !!p.gercekBitis; }
  function butceKullanim(p){ return p.butce ? Math.round(p.gerceklesenMaliyet * 100 / p.butce) : null; }
  function butceSapma(p){ return (p.gerceklesenMaliyet || 0) - (p.butce || 0); }
  function butceSapmaPct(p){ return p.butce ? Math.round(butceSapma(p) * 100 / p.butce) : null; }
  function butceAsti(p){ return butceSapma(p) > 0; }
  function sureSapma(p){ return (p.harcananSure || 0) - (p.tahminiSure || 0); }
  function sureSapmaPct(p){ return p.tahminiSure ? Math.round(sureSapma(p) * 100 / p.tahminiSure) : null; }
  function kalanGun(p){ return p.gercekBitis ? null : F.days(p.planlananBitis); }

  /* Termin gecikmesi (gün) — teslim edilende gerçek bitiş, açıkta bugün esas alınır */
  function terminGecikme(p){
    if(p.gercekBitis){ var d = F.days(p.planlananBitis, p.gercekBitis); return d < 0 ? -d : 0; }
    var k = F.days(p.planlananBitis);
    return k < 0 ? -k : 0;
  }
  function gecikiyor(p){ return terminGecikme(p) > 0; }

  /* Plan ilerlemesi — takvimin ne kadarı tüketildi (varsayım: doğrusal plan) */
  function planIlerleme(p){
    var toplam = F.days(p.planlananBitis, p.baslangic);
    if(!toplam || toplam <= 0) return 100;
    var gecen = p.gercekBitis ? F.days(p.gercekBitis, p.baslangic) : -F.days(p.baslangic);
    return Math.max(0, Math.min(100, Math.round(gecen * 100 / toplam)));
  }
  function ilerlemeFark(p){ return (p.ilerleme || 0) - planIlerleme(p); }

  /* ---- proje bağlı kayıtlar ---- */
  function pMilestones(kod){ return DB.milestones.filter(function(m){ return m.proje === kod; }); }
  function pModuller(kod){ return DB.projectModules.filter(function(m){ return m.proje === kod; }); }
  function pSprintler(kod){ return DB.sprints.filter(function(s){ return s.proje === kod; }); }
  function pTestler(kod){ return DB.tests.filter(function(t){ return t.proje === kod; }); }
  function pHatalar(kod){ return DB.bugs.filter(function(b){ return b.proje === kod; }); }
  function pTeslimler(kod){ return DB.deliveries.filter(function(d){ return d.proje === kod; }); }
  function pDegisiklikler(kod){ return DB.changeRequests.filter(function(d){ return d.proje === kod; }); }
  function pGorevler(kod){ return DB.tasks.filter(function(t){ return t.proje === kod; }); }
  function pZaman(kod){ return DB.timelogs.filter(function(z){ return z.proje === kod; }); }
  function pFaturalar(kod){ return DB.invoices.filter(function(i){ return i.proje === kod; }); }
  function faturalanan(kod){ return pFaturalar(kod).reduce(function(s, i){ return s + (i.toplam || 0); }, 0); }
  function zamanSaat(kod){ return pZaman(kod).reduce(function(s, z){ return s + (z.sure || 0); }, 0); }

  function acikGorev(t){ return GOREV_KAPALI.indexOf(t.durum) === -1; }
  function gecikenGorev(t){ return acikGorev(t) && !!t.termin && F.days(t.termin) < 0; }
  function acikHata(b){ return b.durum !== 'Kapandı'; }
  function kritikAcikHata(kod){
    return pHatalar(kod).filter(function(b){ return acikHata(b) && (b.siddet === 'Kritik' || b.siddet === 'Yüksek'); }).length;
  }
  function gecikenMilestone(kod){
    return pMilestones(kod).filter(function(m){ return m.durum === 'Gecikti'; }).length;
  }

  /* Proje sağlık puanı — varsayım: bütçe aşımı, süre sapması, termin gecikmesi,
     açık kritik hata, geciken milestone ve kayıtlı risk maddeleri ceza olarak düşülür. */
  function saglikPuan(p){
    var s = 100;
    var bs = butceSapmaPct(p); if(bs > 0) s -= Math.min(30, bs);
    var ss = sureSapmaPct(p);  if(ss > 0) s -= Math.min(20, ss);
    var tg = terminGecikme(p); if(tg > 0) s -= Math.min(25, Math.round(tg / 2));
    s -= Math.min(15, kritikAcikHata(p.kod) * 5);
    s -= Math.min(10, gecikenMilestone(p.kod) * 5);
    s -= Math.min(9, (p.riskler || []).length * 3);
    return Math.max(0, Math.min(100, Math.round(s)));
  }
  function saglikTone(v){ return v === 'İyi' ? 'is-ok' : v === 'Riskli' ? 'is-danger' : 'is-warn'; }
  function puanTone(v){ return v >= 80 ? 'ok' : v >= 55 ? 'warn' : 'danger'; }

  /* ---- alt kayıt ölçüleri ---- */
  function msGecikme(m){
    if(m.durum === 'Tamamlandı') return 0;
    var k = F.days(m.tarih);
    return k < 0 ? -k : 0;
  }
  function msFatura(m){ return DB.invoices.filter(function(i){ return i.milestone === m.kod; })[0] || null; }
  function sprintHiz(s){ return s.planlanan ? Math.round((s.tamamlanan || 0) * 100 / s.planlanan) : null; }
  function testBasari(t){ return t.senaryo ? Math.round((t.basarili || 0) * 100 / t.senaryo) : null; }
  function hataYas(b){ return b.cozum ? -F.days(b.bulunma, b.cozum) : -F.days(b.bulunma); }
  /* Teslim gecikmesi — onayı alınmış teslim gecikmiş sayılmaz; alınmamışsa
     planlanan teslim tarihinin üzerinden geçen gün sayılır. */
  function teslimGecikme(d){
    if(d.onayTarihi) return 0;
    var k = F.days(d.tarih);
    return k < 0 ? -k : 0;
  }
  function onaySuresi(d){ return d.onayTarihi ? -F.days(d.tarih, d.onayTarihi) : null; }
  function teslimZamaninda(d){ return d.durum !== 'Gecikti' && d.durum !== 'Planlandı'; }

  /* =================================================================
     2. ORTAK FİLTRE
     ================================================================= */
  function baseProjects(f){
    return DB.projects.filter(function(p){
      if(!seeProje(p)) return false;
      if(f.proje && p.kod !== f.proje) return false;
      if(f.musteri && p.musteri !== f.musteri) return false;
      if(f.pm && p.pm !== f.pm) return false;
      if(f.durum && p.durum !== f.durum) return false;
      if(f.tarih){
        var d = p.gercekBitis || p.planlananBitis;
        if(!d || d < f.tarih) return false;
      }
      return true;
    });
  }
  function projeKodlari(f){ return baseProjects(f).map(function(p){ return p.kod; }); }

  /* Alt kayıt filtresi: projesi kapsamda mı + kendi tarihi filtreyi geçiyor mu */
  function altKayit(f, list, dateFn){
    var kods = projeKodlari(f);
    return list.filter(function(x){
      if(kods.indexOf(x.proje) === -1) return false;
      if(f.tarih){ var d = dateFn ? dateFn(x) : null; if(d && d < f.tarih) return false; }
      return true;
    });
  }

  /* =================================================================
     3. TOPLAMA VE GRAFİK YARDIMCILARI
     ================================================================= */
  function tally(rows, keyFn){
    var m = {}, order = [];
    rows.forEach(function(x){
      var k = keyFn(x);
      if(k == null || k === '') k = '—';
      if(!(k in m)){ m[k] = 0; order.push(k); }
      m[k]++;
    });
    return order.map(function(k){ return { label:k, value:m[k] }; })
                .sort(function(a, b){ return b.value - a.value; });
  }
  function toplam(rows, fn){ return rows.reduce(function(s, x){ return s + (fn(x) || 0); }, 0); }
  function ort(rows, fn){ return rows.length ? Math.round(toplam(rows, fn) / rows.length) : 0; }
  function top(arr, n){ return arr.slice(0, n || 12); }

  function durumDonut(rows, keyFn, birim){
    var d = tally(rows, keyFn);
    return { title:'Durum dağılımı', html:GV.chart.donut(d, { center:String(rows.length), centerSub:birim || 'kayıt' }), legend:d };
  }

  /* =================================================================
     4. KOLON SÖZLÜĞÜ — her çağrıda yeni nesne (GV.list kolon durumu tutar)
     ================================================================= */
  var P = {
    proje:function(w){ return { key:'ad', label:'Proje', width:w || '24%', cellClass:'cell-wrap', locked:true,
      render:function(p){
        return '<a class="cell-main" href="app-proje.html?id=' + p.kod + '">' + esc(p.ad) + '</a>' +
               '<span class="cell-code">' + p.kod + ' · ' + esc(p.tur) + '</span>'; },
      exportValue:function(p){ return p.kod + ' — ' + p.ad; } }; },

    musteri:function(vis){ return { key:'musteri', label:'Müşteri', visible:vis !== false,
      render:function(p){ return esc(musteriAd(p.musteri)); },
      exportValue:function(p){ return musteriAd(p.musteri); } }; },

    pm:function(vis){ return { key:'pm', label:'Proje yöneticisi', visible:vis !== false,
      render:function(p){ return GV.user(p.pm); },
      exportValue:function(p){ return DB.empName(p.pm); } }; },

    faz:function(vis){ return { key:'faz', label:'Faz', visible:vis !== false,
      render:function(p){ return esc(p.faz || '—'); } }; },

    oncelik:function(vis){ return { key:'oncelik', label:'Öncelik', visible:vis !== false,
      render:function(p){ return GV.pri(p.oncelik); } }; },

    baslangic:function(vis){ return { key:'baslangic', label:'Başlangıç', visible:vis !== false,
      render:function(p){ return '<span class="cell-date">' + F.dateShort(p.baslangic) + '</span>'; } }; },

    planBitis:function(){ return { key:'planlananBitis', label:'Planlanan bitiş',
      render:function(p){ return GV.dateCell(p.planlananBitis, { done:teslimEdildi(p) }); } }; },

    gercekBitis:function(vis){ return { key:'gercekBitis', label:'Gerçekleşen bitiş', visible:vis !== false,
      render:function(p){ return p.gercekBitis
        ? '<span class="cell-date is-done">' + F.dateShort(p.gercekBitis) + '</span>'
        : '<span class="u-faint">—</span>'; } }; },

    kalan:function(){ return { key:'kalan', label:'Kalan gün', cellClass:'num',
      sortValue:function(p){ var k = kalanGun(p); return k == null ? 9999 : k; },
      render:function(p){
        var k = kalanGun(p);
        if(k == null) return '<span class="u-num u-ok">Teslim edildi</span>';
        return k < 0 ? '<span class="u-num u-danger">' + F.num(-k) + ' gün gecikti</span>'
                     : '<span class="u-num">' + F.num(k) + ' gün</span>'; },
      exportValue:function(p){ var k = kalanGun(p); return k == null ? 'Teslim edildi' : k; } }; },

    gecikme:function(){ return { key:'gecikme', label:'Termin gecikmesi', cellClass:'num', sortValue:terminGecikme,
      render:function(p){
        var g = terminGecikme(p);
        return g ? '<span class="u-num u-danger">' + F.num(g) + ' gün</span>' : '<span class="u-num u-ok">0 gün</span>'; },
      exportValue:terminGecikme }; },

    durum:function(){ return { key:'durum', label:'Proje durumu',
      render:function(p){ return GV.badge(p.durum); } }; },

    saglik:function(){ return { key:'saglik', label:'Sağlık',
      render:function(p){ return GV.badge(p.saglik, saglikTone(p.saglik)); } }; },

    puan:function(){ return { key:'puan', label:'Sağlık puanı', cellClass:'num', sortValue:saglikPuan,
      render:function(p){ return GV.progress(saglikPuan(p), { tone:puanTone(saglikPuan(p)) }); },
      exportValue:saglikPuan }; },

    ilerleme:function(){ return { key:'ilerleme', label:'İlerleme',
      render:function(p){ return GV.progress(p.ilerleme); } }; },

    planIlerleme:function(){ return { key:'planIlerleme', label:'Plan ilerlemesi', sortValue:planIlerleme,
      render:function(p){ return GV.progress(planIlerleme(p), { tone:'info' }); },
      exportValue:planIlerleme }; },

    fark:function(){ return { key:'fark', label:'Plana göre fark', cellClass:'num', sortValue:ilerlemeFark,
      render:function(p){
        var d = ilerlemeFark(p);
        if(!d) return '<span class="u-faint">0 puan</span>';
        return '<span class="u-num ' + (d > 0 ? 'u-ok' : 'u-danger') + '">' + (d > 0 ? '+' : '−') +
               F.num(Math.abs(d)) + ' puan</span>'; },
      exportValue:ilerlemeFark }; },

    sozlesme:function(vis){ return { key:'sozlesmeTutari', label:'Sözleşme tutarı', cellClass:'num', visible:vis !== false,
      render:function(p){ return para(p.sozlesmeTutari); },
      exportValue:function(p){ return paraExp(p.sozlesmeTutari); } }; },

    butce:function(){ return { key:'butce', label:'Onaylı bütçe', cellClass:'num',
      render:function(p){ return para(p.butce); },
      exportValue:function(p){ return paraExp(p.butce); } }; },

    maliyet:function(){ return { key:'gerceklesenMaliyet', label:'Gerçekleşen maliyet', cellClass:'num',
      render:function(p){ return para(p.gerceklesenMaliyet); },
      exportValue:function(p){ return paraExp(p.gerceklesenMaliyet); } }; },

    kalanButce:function(vis){ return { key:'kalanButce', label:'Kalan bütçe', cellClass:'num', visible:vis !== false,
      sortValue:function(p){ return (p.butce || 0) - (p.gerceklesenMaliyet || 0); },
      render:function(p){
        if(!canFinans) return MASK;
        var k = (p.butce || 0) - (p.gerceklesenMaliyet || 0);
        return '<span class="cell-money ' + (k < 0 ? 'u-danger' : '') + '">' + F.money(k) + '</span>'; },
      exportValue:function(p){ return paraExp((p.butce || 0) - (p.gerceklesenMaliyet || 0)); } }; },

    kullanim:function(){ return { key:'kullanim', label:'Bütçe kullanımı', sortValue:function(p){ return butceKullanim(p) || 0; },
      render:function(p){
        var k = butceKullanim(p);
        if(k == null) return '<span class="u-faint">—</span>';
        return GV.progress(Math.min(100, k), { tone:k > 100 ? 'danger' : k > 85 ? 'warn' : 'ok' }); },
      exportValue:butceKullanim }; },

    butceSapma:function(){ return { key:'butceSapma', label:'Bütçe sapması', cellClass:'num', sortValue:butceSapma,
      render:function(p){
        if(!canFinans) return MASK;
        var s = butceSapma(p);
        if(!s) return '<span class="u-faint">—</span>';
        return '<span class="u-num ' + (s > 0 ? 'u-danger' : 'u-ok') + '">' + (s > 0 ? '+' : '−') +
               F.money(Math.abs(s)) + '</span>'; },
      exportValue:function(p){ return paraExp(butceSapma(p)); } }; },

    faturalanan:function(vis){ return { key:'faturalanan', label:'Faturalanan', cellClass:'num', visible:vis !== false,
      sortValue:function(p){ return faturalanan(p.kod); },
      render:function(p){
        if(!canFinans) return MASK;
        var v = faturalanan(p.kod), n = pFaturalar(p.kod).length;
        if(!n) return '<span class="u-faint">Fatura yok</span>';
        return '<a class="cell-main" href="app-fatura.html?proje=' + p.kod + '">' + F.money(v) + '</a>' +
               '<span class="cell-sub">' + F.num(n) + ' fatura</span>'; },
      exportValue:function(p){ return paraExp(faturalanan(p.kod)); } }; },

    tahminiSure:function(){ return { key:'tahminiSure', label:'Tahmini süre', cellClass:'num',
      render:function(p){ return '<span class="u-num">' + F.hours(p.tahminiSure) + '</span>'; } }; },

    harcananSure:function(){ return { key:'harcananSure', label:'Harcanan süre', cellClass:'num',
      render:function(p){ return '<span class="u-num u-b">' + F.hours(p.harcananSure) + '</span>'; } }; },

    sureSapma:function(){ return { key:'sureSapma', label:'Süre sapması', cellClass:'num', sortValue:sureSapma,
      render:function(p){
        var s = sureSapma(p);
        if(!s) return '<span class="u-faint">—</span>';
        return '<span class="u-num ' + (s > 0 ? 'u-danger' : 'u-ok') + '">' + (s > 0 ? '+' : '−') +
               F.hours(Math.abs(s)) + '</span>'; },
      exportValue:sureSapma }; },

    sureSapmaPct:function(vis){ return { key:'sureSapmaPct', label:'Sapma %', cellClass:'num', visible:vis !== false,
      sortValue:function(p){ return sureSapmaPct(p) || 0; },
      render:function(p){
        var s = sureSapmaPct(p);
        if(s == null) return '<span class="u-faint">—</span>';
        return '<span class="u-num ' + (s > 0 ? 'u-danger' : 'u-ok') + '">' + (s > 0 ? '+' : '') + F.pct(s) + '</span>'; },
      exportValue:sureSapmaPct }; },

    zaman:function(vis){ return { key:'zaman', label:'Zaman kaydı', cellClass:'num', visible:vis !== false,
      sortValue:function(p){ return zamanSaat(p.kod); },
      render:function(p){
        var v = zamanSaat(p.kod);
        return v ? '<a class="cell-main" href="app-zaman.html?proje=' + p.kod + '">' + F.hours(v) + '</a>'
                 : '<span class="u-faint">—</span>'; },
      exportValue:function(p){ return zamanSaat(p.kod); } }; },

    gorevSayi:function(vis){ return { key:'gorevSayi', label:'Açık görev', cellClass:'num', visible:vis !== false,
      sortValue:function(p){ return pGorevler(p.kod).filter(acikGorev).length; },
      render:function(p){
        var g = pGorevler(p.kod), a = g.filter(acikGorev).length, gc = g.filter(gecikenGorev).length;
        if(!g.length) return '<span class="u-faint">—</span>';
        return '<a class="cell-main" href="app-gorev.html?proje=' + p.kod + '">' + F.num(a) + ' açık</a>' +
               (gc ? '<span class="cell-sub u-danger">' + F.num(gc) + ' geciken</span>' : ''); },
      exportValue:function(p){ return pGorevler(p.kod).filter(acikGorev).length; } }; },

    kritikHata:function(){ return { key:'kritikHata', label:'Açık kritik hata', cellClass:'num',
      sortValue:function(p){ return kritikAcikHata(p.kod); },
      render:function(p){
        var n = kritikAcikHata(p.kod);
        return n ? '<span class="u-num u-danger">' + F.num(n) + '</span>' : '<span class="u-faint">0</span>'; },
      exportValue:function(p){ return kritikAcikHata(p.kod); } }; },

    gecikenMs:function(){ return { key:'gecikenMs', label:'Geciken milestone', cellClass:'num',
      sortValue:function(p){ return gecikenMilestone(p.kod); },
      render:function(p){
        var n = gecikenMilestone(p.kod);
        return n ? '<span class="u-num u-danger">' + F.num(n) + '</span>' : '<span class="u-faint">0</span>'; },
      exportValue:function(p){ return gecikenMilestone(p.kod); } }; },

    risk:function(w){ return { key:'riskler', label:'Kayıtlı riskler', width:w || '20%', cellClass:'cell-wrap',
      sortValue:function(p){ return (p.riskler || []).length; },
      render:function(p){
        var r = p.riskler || [];
        if(!r.length) return '<span class="u-faint">Risk kaydı yok</span>';
        return '<span class="cell-main">' + F.num(r.length) + ' risk</span>' +
               '<span class="cell-sub">' + esc(r.join(' · ')) + '</span>'; },
      exportValue:function(p){ return (p.riskler || []).join(' | '); } }; },

  /* =================================================================
     6. KAYNAK VE İŞ YÜKÜ TOPLAMASI
     ================================================================= */
  function kaynakRows(f){
    var ps = baseProjects(f), kods = ps.map(function(p){ return p.kod; });
    var map = {}, order = [];
    function ensure(kod){
      if(!map[kod]){
        var e = DB.emp(kod);
        map[kod] = { kod:kod, ad:e ? e.ad : kod, dep:e ? e.depAd : '—', pozisyon:e ? e.pozisyon : '',
                     proje:0, pmProje:0, gorev:0, acik:0, geciken:0, saat:0, fatSaat:0,
                     kapasite:null, planlanan:null, doluluk:null, izin:0 };
        order.push(kod);
      }
      return map[kod];
    }
    ps.forEach(function(p){
      var seen = {};
      [p.pm, p.teknikSorumlu].concat(p.ekip || []).forEach(function(k){
        if(!k || seen[k]) return;
        seen[k] = 1; ensure(k).proje++;
      });
      if(p.pm) ensure(p.pm).pmProje++;
    });
    DB.tasks.forEach(function(t){
      if(!t.sorumlu || kods.indexOf(t.proje) === -1) return;
      var a = map[t.sorumlu]; if(!a) return;
      a.gorev++;
      if(acikGorev(t)) a.acik++;
      if(gecikenGorev(t)) a.geciken++;
    });
    DB.timelogs.forEach(function(z){
      if(kods.indexOf(z.proje) === -1) return;
      var a = map[z.personel]; if(!a) return;
      a.saat += z.sure || 0;
      if(z.faturalanabilir) a.fatSaat += z.sure || 0;
    });
    DB.capacity.forEach(function(c){
      var a = map[c.personel]; if(!a) return;
      a.kapasite = c.kapasite; a.planlanan = c.planlanan; a.doluluk = c.doluluk; a.izin = c.izin;
    });
    return order.map(function(k){ return map[k]; })
      .sort(function(x, y){ return (y.doluluk || 0) - (x.doluluk || 0) || y.acik - x.acik; });
  }
