<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Referans Raporları — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="rapor" data-screen="raporreferans">
<div id="rapor"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;
  var host = document.getElementById('rapor');
  if(!host) return;
  var S = GV.session || {};

  GV.pageHead({
    eyebrow:'Raporlar', title:'Referans Raporları',
    sub:'10 rapor · yönlendiren kişi, dönüşüm, ciro, kâr ve komisyon ekseni · referans tarih ' + F.date(DB.today),
    actions:[
      { label:'Yönlendirenler', icon:'i-users', href:'app-referans.html' },
      { label:'Komisyon Kazançları', icon:'i-percent', href:'app-komisyon.html' },
      { label:'Müşteri Adayları', icon:'i-user-plus', cls:'btn-acc', href:'app-lead.html' }
    ]
  });

  /* =================================================================
     0. YETKİ KAPISI — referans raporu müşteri verisi içerir (§20 yetkilendirme)
     ================================================================= */
  if(!GV.perm.can('musteriRapor')){
    host.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-lock', title:'Referans raporlarına erişim yetkiniz yok',
      desc:(S.rolAd || 'Bu rol') + ' rolü müşteri ve referans verisi içeren raporları görüntüleyemez. ' +
           'Erişim gerekiyorsa sistem yöneticinizden rapor yetkisi talep edin.',
      action:'<a class="btn btn-acc" href="app-panel.html">Ana Panele Dön</a>'
    }) + '</div>';
    return;
  }

  /* Finans yetkisi — ciro, kâr ve komisyon tutarları maskelenir */
  var canFin = GV.perm.can('finans');
  /* Mobil satırın maske işareti — tablo hücresini artık GV.list kendi
     maskeliyor (perm:'finans'), bu sabit yalnız mobil şeritte kaldı. */
  var MASK = '<span class="cell-mask">••••••</span>';

  /* =================================================================
     1. İNDEKS VE SÖZLÜK
     Referans tarih daima DB.today (2026-08-03) — new Date() kullanılmaz.
     ================================================================= */
  var REFI = {}; DB.referrers.forEach(function(r){ REFI[r.kod] = r; });
  var CUSI = {}; DB.customers.forEach(function(c){ CUSI[c.kod] = c; });

  function ref(k){ return REFI[k] || null; }
  function cus(k){ return CUSI[k] || null; }
  function refAd(k){ var r = ref(k); return r ? r.ad : (k || '—'); }
  function refTur(k){ var r = ref(k); return r ? r.tur : '—'; }
  function cname(k){ var c = cus(k); return c ? c.kisa : (k || '—'); }
  function shortLbl(s){ return String(s || '—').split(' ')[0]; }

  function sum(a, fn){ return a.reduce(function(s, x){ return s + (fn(x) || 0); }, 0); }
  function uniq(a){ var o = []; a.forEach(function(x){ if(x && o.indexOf(x) === -1) o.push(x); }); return o; }
  function topN(d, n){ return d.slice().sort(function(a, b){ return (b.value || 0) - (a.value || 0); }).slice(0, n || 10); }
  function agg(rows, keyFn, valFn){
    var m = {}, order = [];
    rows.forEach(function(x){
      var k = keyFn(x);
      if(k == null || k === '') k = '—';
      if(!(k in m)){ m[k] = 0; order.push(k); }
      m[k] += valFn ? (valFn(x) || 0) : 1;
    });
    return order.map(function(k){ return { label:k, value:m[k] }; })
                .filter(function(d){ return d.value > 0; })
                .sort(function(a, b){ return b.value - a.value; });
  }
  /* İlişki süresi — ilk kayıttan referans tarihe kadar geçen ay */
  function ayFarki(iso){ var d = F.days(iso); return d == null ? 0 : Math.max(0, Math.round(-d / 30.44)); }
  function gunGecti(iso){ var d = F.days(iso); return d == null ? null : Math.max(0, -d); }

  /* Referans türü öbekleri — PROMPT.md §9'daki 17 tür içinden veride var olanlar */
  var TUR_IC   = ['Personel','Şirket ortağı'];
  var TUR_MUS  = ['Mevcut müşteri','Eski müşteri'];
  var TUR_KISI = ['Mevcut müşteri','Eski müşteri','Personel','Şirket ortağı','İş ortağı',
                  'Danışman','Freelancer','Tedarikçi','Harici kişi','Kurumsal firma'];
  var VAR_OLAN_TUR = uniq(DB.referrers.map(function(r){ return r.tur; }));

  function odendi(k){ return k.durum === 'Ödendi'; }
  function komOf(kod){ return DB.commissions.filter(function(k){ return k.referans === kod; }); }
  /* Kazanç tarihinden ödemeye geçen gün / kazancın bekleme günü */
  function odemeGun(k){ return (k.kazanimTarihi && k.odemeTarihi) ? F.days(k.odemeTarihi, k.kazanimTarihi) : null; }
  function beklemeGun(k){ return k.kazanimTarihi ? Math.max(0, -F.days(k.kazanimTarihi)) : null; }

  /* =================================================================
     2. YÖNLENDİRME KAYITLARI (YON)
     Aday ve müşteri kayıtları tek eksende birleştirilir; bir aday
     müşteriye dönüştüyse kayıt tek kez sayılır (çift sayım olmaz).
     ================================================================= */
  var YON = (function(){
    var out = [], gorulen = {};
    DB.leads.forEach(function(l){
      if(!l.referans) return;
      if(l.musteri) gorulen[l.musteri] = 1;
      var c = l.musteri ? cus(l.musteri) : null;
      out.push({
        kod:l.kod, tip:'Aday', ad:l.firma, musteri:l.musteri,
        referans:l.referans, referansAd:refAd(l.referans), referansTur:refTur(l.referans),
        sorumlu:l.sorumlu, sorumluAd:DB.empName(l.sorumlu), tarih:l.talepTarihi,
        asama:l.asama, hizmet:l.hizmet, sektor:l.sektor,
        sonuc:l.asama === 'Kazanıldı' ? 'Kazanıldı' : (l.asama === 'Kaybedildi' ? 'Kaybedildi' : 'Süreçte'),
        butce:l.butce || 0, ciro:c ? (c.toplamCiro || 0) : 0, kayipNedeni:l.kayipNedeni
      });
    });
    DB.customers.forEach(function(c){
      if(!c.referans || gorulen[c.kod]) return;
      out.push({
        kod:c.kod, tip:'Müşteri', ad:c.kisa, musteri:c.kod,
        referans:c.referans, referansAd:refAd(c.referans), referansTur:refTur(c.referans),
        sorumlu:c.sorumlu, sorumluAd:DB.empName(c.sorumlu), tarih:c.ilkKayit,
        asama:'Kazanıldı', hizmet:'—', sektor:c.sektor,
        sonuc:'Kazanıldı', butce:0, ciro:c.toplamCiro || 0, kayipNedeni:null
      });
    });
    return out;
  })();

  /* =================================================================
     3. ORTAK FİLTRE
     tarih · yönlendiren kişi · müşteri · referans türü · kaynak durumu
     ================================================================= */
  function refOk(f, kod){
    if(!kod) return false;
    if(f.referans && kod !== f.referans) return false;
    var r = ref(kod);
    if(f.tur && (!r || r.tur !== f.tur)) return false;
    if(f.durum && (!r || r.durum !== f.durum)) return false;
    return true;
  }
  function tarihOk(f, iso){ return !f.tarih || (!!iso && String(iso).slice(0, 10) >= f.tarih); }

  /* Yönlendiren kişi ekseni */
  function baseRef(f){
    return DB.referrers.filter(function(r){
      if(!refOk(f, r.kod)) return false;
      if(f.tarih && !tarihOk(f, r.sonYonlendirme)) return false;
      if(f.musteri){
        var c = cus(f.musteri);
        var bagli = !!(c && c.referans === r.kod);
        if(!bagli) bagli = YON.filter(function(y){ return y.referans === r.kod && y.musteri === f.musteri; }).length > 0;
        if(!bagli) bagli = komOf(r.kod).filter(function(k){ return k.musteri === f.musteri; }).length > 0;
        if(!bagli) return false;
      }
      return true;
    }).map(refRow);
  }

  /* Yönlendirme kaydı ekseni */
  function baseYon(f){
    return YON.filter(function(y){
      if(!refOk(f, y.referans)) return false;
      if(f.musteri && y.musteri !== f.musteri) return false;
      if(!tarihOk(f, y.tarih)) return false;
      return true;
    });
  }

  /* Komisyon ekseni — kayıtlar app-komisyon.html ile birebir aynı alanlardır */
  function baseKom(f){
    return DB.commissions.filter(function(k){
      if(!refOk(f, k.referans)) return false;
      if(f.musteri && k.musteri !== f.musteri) return false;
      if(f.tarih){
        var d = k.odemeTarihi || k.kazanimTarihi;
        if(!d || d < f.tarih) return false;
      }
      return true;
    });
  }

  /* Referans kaynaklı müşteri ekseni */
  function baseMus(f){
    return DB.customers.filter(function(c){
      if(!c.referans) return false;
      if(!refOk(f, c.referans)) return false;
      if(f.musteri && c.kod !== f.musteri) return false;
      if(!tarihOk(f, c.ilkKayit)) return false;
      return true;
    }).map(musRow);
  }

  /* =================================================================
     4. SATIR MODELLERİ
     ================================================================= */
  function refRow(r){
    var km = komOf(r.kod);
    var kayit = YON.filter(function(y){ return y.referans === r.kod; });
    return {
      kod:r.kod, ad:r.ad, firma:r.firma, tur:r.tur, pozisyon:r.pozisyon, not:r.not,
      sorumlu:r.sorumlu, sorumluAd:DB.empName(r.sorumlu),
      yonlendirme:r.yonlendirme, kazanilan:r.kazanilan, kaybedilen:r.kaybedilen,
      acik:Math.max(0, (r.yonlendirme || 0) - (r.kazanilan || 0) - (r.kaybedilen || 0)),
      donusum:r.donusum, ciro:r.ciro,
      komisyonModeli:r.komisyonModeli, komisyonOrani:r.komisyonOrani, sabitBedel:r.sabitBedel,
      komAdet:km.length,
      komTutar:sum(km, function(k){ return k.tutar; }),
      komOdenen:sum(km.filter(odendi), function(k){ return k.tutar; }),
      komBekleyen:sum(km.filter(function(k){ return !odendi(k); }), function(k){ return k.tutar; }),
      kayit:kayit.length,
      kayitKazanilan:kayit.filter(function(y){ return y.sonuc === 'Kazanıldı'; }).length,
      musteriAdet:DB.customers.filter(function(c){ return c.referans === r.kod; }).length,
      sonYonlendirme:r.sonYonlendirme, durum:r.durum
    };
  }

  function musRow(c){
    var pr = DB.projects.filter(function(p){ return p.musteri === c.kod; });
    var sz = DB.contracts.filter(function(x){ return x.musteri === c.kod; });
    var fa = DB.invoices.filter(function(x){ return x.musteri === c.kod; });
    var th = DB.payments.filter(function(x){ return x.musteri === c.kod && x.durum === 'Ödendi'; });
    var km = DB.commissions.filter(function(x){ return x.musteri === c.kod; });
    var gelir = sum(pr, function(p){ return p.sozlesmeTutari; });
    /* REVİZE 04 — proje maliyeti türetilir (`gerceklesenMaliyet` kaldırıldı). */
    var maliyet = sum(pr, function(p){ return GV.proje.maliyet(p.kod).toplam; });
    var komisyon = sum(km, function(k){ return k.tutar; });
    return {
      kod:c.kod, kisa:c.kisa, unvan:c.unvan, sektor:c.sektor, durum:c.durum, risk:c.risk,
      referans:c.referans, referansAd:refAd(c.referans), referansTur:refTur(c.referans),
      kaynak:c.kaynak, sorumlu:c.sorumlu, sorumluAd:DB.empName(c.sorumlu),
      ilkKayit:c.ilkKayit, sonIletisim:c.sonIletisim, sonrakiAksiyon:c.sonrakiAksiyon,
      memnuniyet:c.memnuniyet, projeSayisi:c.projeSayisi || 0, aktifProje:c.aktifProje || 0,
      toplamCiro:c.toplamCiro || 0, bekleyenTahsilat:c.bekleyenTahsilat || 0,
      sozlesmeTutar:sum(sz, function(x){ return x.tutar; }),
      faturaTutar:sum(fa, function(x){ return x.toplam; }),
      tahsilat:sum(th, function(x){ return x.tutar; }),
      gelir:gelir, maliyet:maliyet, komisyon:komisyon, kar:gelir - maliyet - komisyon,
      marj:gelir ? Math.round((gelir - maliyet - komisyon) / gelir * 100) : 0,
      /* REVİZE 03 — proje eforu onaylı zaman kayıtlarından türetilir. */
      harcananSure:sum(pr, function(p){ return GV.proje.sure(p.kod).gerceklesen; }),
      projeAdet:pr.length,
      iliskiAy:ayFarki(c.ilkKayit), sessizGun:gunGecti(c.sonIletisim),
      tekrarIs:(c.projeSayisi || 0) > 1, aktif:c.aktif
    };
  }

  /* =================================================================
     5. PARA VE GRAFİK YARDIMCILARI
     Finans yetkisi yoksa tutar maskelenir, para grafiği adet eksenine düşer.
     ================================================================= */
  function kMoney(v){ return canFin ? F.moneyK(v) : '••••••'; }
  /* Kolon maskesi UID-28 kolon sözleşmesinden gelir: perm:'finans' konunca
     GV.list hem hücreyi hem çıktıyı kapatır, sayfa kendi maskesini taşımaz.
     `plain` kipi para değerini sayı stilinde (u-num) basar — ortak fabrikanın
     iki para stili yok, bu yüzden o dal sayfada kaldı. */
  function paraKol(key, label, opt){
    opt = opt || {};
    var c = opt.plain
      ? { key:key, label:label, cellClass:'num', visible:opt.visible !== false,
          sortValue:function(x){ return x[key] || 0; },
          exportValue:function(x){ return x[key] || 0; },
          render:function(x){ return '<span class="u-num">' + F.money(x[key]) + '</span>' +
            (opt.sub ? GV.cell.sub(opt.sub(x)) : ''); } }
      : GV.cols.money(key, label, { visible:opt.visible, sub:opt.sub });
    c.perm = 'finans';
    return c;
  }
  function barKart(o){
    if(!o.data || !o.data.length) return null;
    return { title:o.title, sub:o.sub, wide:o.wide !== false,
             html:GV.chart.bar(o.data, o.money ? { money:true } : {}), legend:o.legend || null };
  }
  function donutKart(title, data, birim){
    if(!data.length) return null;
    return { title:title, html:GV.chart.donut(data, {
      center:F.num(sum(data, function(d){ return d.value; })), centerSub:birim }), legend:data };
  }
  function sonucTonu(v){ return v === 'Kazanıldı' ? 'is-ok' : v === 'Kaybedildi' ? 'is-danger' : 'is-warn'; }

  /* =================================================================
     6. KOLON SÖZLÜĞÜ — her çağrıda yeni nesne (GV.list kolon durumu tutar)
     ================================================================= */
  /* ---- yönlendiren kişi kolonları ---- */
  var R = {
    kaynak:function(w){ return { key:'ad', label:'Yönlendiren', width:w || '22%', cellClass:'cell-wrap', locked:true,
      render:function(x){
        return GV.cell.link('app-referans.html', x.ad,
          (x.firma && x.firma !== '—' ? GV.cell.sub(esc(x.firma)) : '') +
          '<span class="cell-code">' + x.kod + ' · ' + esc(x.tur) + '</span>'); },
      exportValue:function(x){ return x.kod + ' — ' + x.ad; } }; },

    tur:function(vis){ return { key:'tur', label:'Referans türü', visible:vis !== false,
      render:function(x){ return '<span class="tag">' + esc(x.tur) + '</span>'; } }; },

    /* GV.cols.kisi değil: kolon anahtarı `sorumluAd` — sıralama ve arama
       personelin ADI üzerinden yürür. Ortak fabrika tek anahtarı hem çizim
       hem çıktı için kullanır, kodla sıralamaya döner. */
    sorumlu:function(vis){ return { key:'sorumluAd', label:'Şirket içi sorumlu', visible:vis !== false,
      render:function(x){ return GV.user(x.sorumlu, { sm:true }); },
      exportValue:function(x){ return x.sorumluAd; } }; },

    yonlendirme:function(){ return { key:'yonlendirme', label:'Yönlendirme', cellClass:'num',
      render:function(x){ return '<b class="u-num">' + F.num(x.yonlendirme) + '</b>'; } }; },

    kazanilan:function(){ return { key:'kazanilan', label:'Kazanılan', cellClass:'num',
      render:function(x){ return '<span class="u-num u-ok u-b">' + F.num(x.kazanilan) + '</span>'; } }; },

    /* GV.cols.num değil: burada sıfır ÖLÇÜLMÜŞ değerdir ("hiç kaybetmemiş"),
       eksik veri değil — "—" değil "0" basar. */
    kaybedilen:function(vis){ return { key:'kaybedilen', label:'Kaybedilen', cellClass:'num', visible:vis !== false,
      render:function(x){ return x.kaybedilen ? '<span class="u-num u-danger">' + F.num(x.kaybedilen) + '</span>'
                                              : GV.cell.faint('0'); } }; },

    acik:function(vis){ return { key:'acik', label:'Açık fırsat', cellClass:'num', visible:vis !== false,
      render:function(x){ return x.acik ? '<span class="u-num u-warn">' + F.num(x.acik) + '</span>'
                                        : GV.cell.faint('0'); } }; },

    /* GV.cols.pct({bar:true}) değil: ortak fabrika ilerleme çubuğuna ton
       geçirmiyor, buradaki eşik renklendirmesi (40 / 20) kaybolurdu. */
    donusum:function(){ return { key:'donusum', label:'Dönüşüm oranı', cellClass:'num',
      render:function(x){ return GV.progress(x.donusum, { tone:x.donusum >= 40 ? 'ok' : x.donusum >= 20 ? 'warn' : 'danger' }); },
      exportValue:function(x){ return x.donusum; } }; },

    komModeli:function(vis){ return { key:'komisyonModeli', label:'Komisyon modeli', visible:vis !== false,
      render:function(x){
        if(x.komisyonModeli === 'Yok') return GV.cell.faint('Komisyonsuz');
        return '<span class="cell-main">' + esc(x.komisyonModeli) + '</span>' +
               GV.cell.sub(x.komisyonOrani ? '%' + x.komisyonOrani : (canFin ? F.money(x.sabitBedel) : '••••')); },
      exportValue:function(x){ return x.komisyonModeli; } }; }
  };

  /* ---- yönlendirme kaydı kolonları ---- */
  var Y = {
    kayit:function(w){ return { key:'ad', label:'Yönlendirilen', width:w || '22%', cellClass:'cell-wrap', locked:true,
      render:function(y){
        return GV.cell.link(y.tip === 'Müşteri' ? 'app-musteri.html' : 'app-lead.html', y.ad,
          '<span class="cell-code">' + y.kod + ' · ' + esc(y.tip) + '</span>'); },
      exportValue:function(y){ return y.kod + ' — ' + y.ad; } }; },

    kaynak:function(){ return { key:'referansAd', label:'Yönlendiren',
      render:function(y){ return GV.cell.link('app-referans.html', y.referansAd, GV.cell.sub(esc(y.referansTur))); },
      exportValue:function(y){ return y.referans + ' — ' + y.referansAd; } }; },

    tur:function(vis){ return { key:'referansTur', label:'Referans türü', visible:vis !== false,
      render:function(y){ return '<span class="tag">' + esc(y.referansTur) + '</span>'; } }; },

    sektor:function(vis){ return { key:'sektor', label:'Sektör', visible:vis !== false,
      render:function(y){ return esc(y.sektor || '—'); } }; },

    /* GV.cols.kisi değil — R.sorumlu ile aynı gerekçe (anahtar `sorumluAd`). */
    sorumlu:function(vis){ return { key:'sorumluAd', label:'Satış sorumlusu', visible:vis !== false,
      render:function(y){ return GV.user(y.sorumlu, { sm:true }); },
      exportValue:function(y){ return y.sorumluAd; } }; },

    kayip:function(vis){ return { key:'kayipNedeni', label:'Kayıp nedeni', cellClass:'cell-wrap', visible:vis !== false,
      render:function(y){ return y.kayipNedeni ? esc(y.kayipNedeni) : GV.cell.faint('—'); } }; },

    musteri:function(vis){ return { key:'musteri', label:'Oluşan müşteri', visible:vis !== false,
      render:function(y){ return y.musteri
        ? GV.cell.link('app-musteri.html', cname(y.musteri), '<span class="cell-code">' + y.musteri + '</span>')
        : GV.cell.faint('Müşteriye dönüşmedi'); },
      exportValue:function(y){ return y.musteri || '—'; } }; }
  };

  /* ---- komisyon kolonları — app-komisyon.html ile aynı alanlar ---- */
  var K = {
    komisyonToplam:function(){ return { key:'kod', label:'Kazanç', width:'18%', cellClass:'cell-wrap', locked:true,
      render:function(k){ return GV.cell.link('app-komisyon.html', k.kod, GV.cell.sub(esc(k.kisi))); },
      exportValue:function(k){ return k.kod; } }; },

    kisi:function(){ return { key:'kisi', label:'Yönlendiren',
      render:function(k){ return GV.cell.link('app-referans.html', k.kisi,
        '<span class="cell-code">' + k.referans + ' · ' + esc(refTur(k.referans)) + '</span>'); },
      exportValue:function(k){ return k.referans + ' — ' + k.kisi; } }; },

    firma:function(){ return { key:'firma', label:'Kazandırdığı müşteri',
      render:function(k){ return k.musteri

          columns:[M.musteri(), M.kaynak(), M.tur(false), M.sorumlu(false), GV.cols.date('ilkKayit', 'İlk kayıt', { plain:true }), M.iliski(),
                   GV.cols.num('projeSayisi', 'Proje', { sub:function(x){ return F.num(x.aktifProje) + ' aktif'; } }), M.tekrar(), M.sonIletisim(), M.memnuniyet(),
                   GV.cols.durum('risk', 'Risk',
                     { extra:function(x){ return x.risk === 'Yüksek' ? 'is-danger' : x.risk === 'Orta' ? 'is-warn' : 'is-ok'; } }),
                   paraKol('toplamCiro', 'Toplam ciro', { plain:true, visible:false }), GV.cols.durum('durum', 'Durum')],
          mobile:mMus,
          emptyState:GV.cols.bos('Devamlılık verisi yok', 'Seçilen kapsamda referans kaynağına bağlı müşteri bulunmuyor.', 'i-refresh') }) }

    ]
  });
});
</script>
