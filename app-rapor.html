<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rapor Merkezi — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="rapor" data-screen="rapor">
<div id="merkez"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;
  var TODAY = DB.today;                       /* referans tarih — new Date() kullanılmaz */

  /* =====================================================================
     KATEGORİ KATALOĞU
     Rapor anahtarları (key) ilgili ekranın GV.report({reports:[…]}) tanımından
     birebir alınmıştır; `deep:false` olan kategorilerde (Satış ve Finans, Proje)
     ekran paralel üretimde olduğu için çip bağlantısı kategori sayfasına gider.
     ===================================================================== */
  var CATS = [
    {
      id:'musteri', sid:'rapormusteri', href:'app-rapor-musteri.html',
      ad:'Müşteri Raporları', icon:'i-building', deep:true, perm:'musteriRapor',
      desc:'Müşteri portföyünün sağlığı: iletişim, teklif, dönüşüm, teslim, destek ve finans ekseni tek yerde.',
      reports:[
        { key:'genel',       label:'Müşteri genel raporu' },
        { key:'iletisim',    label:'İletişim raporu' },
        { key:'memnuniyet',  label:'Memnuniyet raporu' },
        { key:'risk',        label:'Risk raporu' },
        { key:'teklif',      label:'Teklif raporu' },
        { key:'donusum',     label:'Satış dönüşüm raporu' },
        { key:'capraz',      label:'Çapraz satış fırsatları' },
        { key:'yenileme',    label:'Yenileme fırsatları' },
        { key:'proje',       label:'Proje raporu' },
        { key:'destek',      label:'Destek raporu' },
        { key:'finans',      label:'Finans raporu' },
        { key:'tahsilat',    label:'Tahsilat raporu' },
        { key:'karlilik',    label:'Kârlılık raporu' },
        { key:'ltv',         label:'Müşteri yaşam boyu değeri' }
      ]
    },
    {
      id:'personel', sid:'raporpersonel', href:'app-rapor-personel.html',
      ad:'Personel Raporları', icon:'i-users', deep:true, perm:'personelRapor',
      desc:'İş yükü, kapasite, zaman kaydı, performans ve özlük verisi — adet değil katkı odaklı okunur.',
      reports:[
        { key:'genel',       label:'Personel genel raporu' },
        { key:'gorev',       label:'Görev raporu' },
        { key:'isyuku',      label:'İş yükü raporu' },
        { key:'katki',       label:'Proje katkı raporu' },
        { key:'zaman',       label:'Zaman raporu' },
        { key:'kapasite',    label:'Kapasite raporu' },
        { key:'mesai',       label:'Fazla mesai raporu' },
        { key:'eksik',       label:'Eksik çalışma raporu' },
        { key:'performans',  label:'Performans raporu' },
        { key:'egitim',      label:'Eğitim raporu' },
        { key:'izin',        label:'İzin raporu' },
        { key:'zimmet',      label:'Zimmet raporu' },
        { key:'arac',        label:'Araç kullanım raporu' }
      ]
    },
    {
      id:'gorev', sid:'raporgorev', href:'app-rapor-gorev.html',
      ad:'Görev Raporları', icon:'i-tasks', deep:true, perm:null,
      desc:'Görev akışının tüm durumları, departman/proje/müşteri kırılımları ve verimlilik oranları.',
      reports:[
        { key:'acik',            label:'Açık görevler' },
        { key:'geciken',         label:'Geciken görevler' },
        { key:'engellenen',      label:'Engellenen görevler' },
        { key:'atanmamis',       label:'Atanmamış görevler' },
        { key:'kabul',           label:'Kabul bekleyen görevler' },
        { key:'kontrol',         label:'Kontrol bekleyen görevler' },
        { key:'revize',          label:'Revizedeki görevler' },
        { key:'tamamlanan',      label:'Tamamlanan görevler' },
        { key:'departman',       label:'Departman bazlı görevler' },
        { key:'projeBazli',      label:'Proje bazlı görevler' },
        { key:'musteriBazli',    label:'Müşteri bazlı görevler' },
        { key:'sure',            label:'Tahmini ve gerçekleşen süre' },
        { key:'zamaninda',       label:'Zamanında tamamlama oranı' },
        { key:'revizyonOrani',   label:'Revizyon oranı' },
        { key:'yenidenAcilma',   label:'Yeniden açılma oranı' },
        { key:'kalite',          label:'Görev kalite sonuçları' },
        { key:'talep',           label:'Departmanlar arası talepler' },
        { key:'sohbet',          label:'Sohbetten oluşan görevler' },
        { key:'toplanti',        label:'Toplantıdan oluşan görevler' }
      ]
    },
    {
      id:'referans', sid:'raporreferans', href:'app-rapor-referans.html',
      ad:'Referans Raporları', icon:'i-percent', deep:true, perm:'musteriRapor',
      desc:'Yönlendiren kişi ve kanal performansı, referans dönüşümü, kazanç ve komisyon takibi.',
      reports:[
        { key:'kaynaklar',   label:'Referans kaynakları' },
        { key:'performans',  label:'Yönlendiren kişi performansı' },
        { key:'donusum',     label:'Referans dönüşüm oranı' },
        { key:'ciro',        label:'Referansla oluşan ciro' },
        { key:'kar',         label:'Referansla oluşan kâr' },
        { key:'odenen',      label:'Ödenen komisyonlar' },
        { key:'bekleyen',    label:'Bekleyen komisyonlar' },
        { key:'personel',    label:'Personel referansları' },
        { key:'musteriRef',  label:'Müşteri referansları' },
        { key:'devamlilik',  label:'Referans kaynaklı müşteri devamlılığı' }
      ]
    },
    {
      id:'filo', sid:'raporfilo', href:'app-rapor-filo.html',
      ad:'Filo Raporları', icon:'i-car', deep:true, perm:null,
      desc:'Araç envanteri, yenileme takvimi (bakım, muayene, sigorta, kasko), maliyet ve olay kayıtları.',
      reports:[
        { key:'aktif',             label:'Aktif araçlar' },
        { key:'tahsisli',          label:'Personele tahsisli araçlar' },
        { key:'ortak',             label:'Ortak kullanım araçları' },
        { key:'serviste',          label:'Servisteki araçlar' },
        { key:'bakimYaklasan',     label:'Bakımı yaklaşan araçlar' },
        { key:'bakimGeciken',      label:'Bakımı geciken araçlar' },
        { key:'muayene',           label:'Muayenesi yaklaşan araçlar' },
        { key:'sigorta',           label:'Sigortası yaklaşan araçlar' },
        { key:'kasko',             label:'Kaskosu yaklaşan araçlar' },
        { key:'yakit',             label:'Yakıt tüketimi' },
        { key:'gider',             label:'Araç giderleri' },
        { key:'kmMaliyet',         label:'Kilometre başına maliyet' },
        { key:'personelKullanim',  label:'Personel bazlı kullanım' },
        { key:'depKullanim',       label:'Departman bazlı kullanım' },
        { key:'projeKullanim',     label:'Proje bazlı kullanım' },
        { key:'kaza',              label:'Kaza ve hasar' },
        { key:'ceza',              label:'Trafik cezaları' },
        { key:'kiralama',          label:'Kiralama sözleşmeleri' },
        { key:'sahiplik',          label:'Satın alma ve kiralama karşılaştırması' }
      ]
    },
    {
      id:'finans', sid:'raporfinans', href:'app-rapor-finans.html',
      ad:'Satış ve Finans Raporları', icon:'i-trend-up', deep:false, perm:'finans',
      desc:'Lead kaynağından nakit akışına kadar satış hunisi, bütçe, maliyet, kârlılık ve tahsilat ekseni.',
      reports:[
        { key:'leadKaynak',   label:'Lead kaynakları' },
        { key:'donusum',      label:'Satış dönüşüm oranı' },
        { key:'teklifBasari', label:'Teklif başarı oranı' },
        { key:'kazanilan',    label:'Kazanılan satışlar' },
        { key:'kaybedilen',   label:'Kaybedilen satışlar' },
        { key:'temsilci',     label:'Satış temsilcisi performansı' },
        { key:'satisSuresi',  label:'Ortalama satış süresi' },
        { key:'tahminGelir',  label:'Tahmini satış geliri' },
        { key:'butce',        label:'Proje bütçeleri' },
        { key:'maliyet',      label:'Proje maliyetleri' },
        { key:'musteriKar',   label:'Müşteri kârlılığı' },
        { key:'hizmetKar',    label:'Hizmet kârlılığı' },
        { key:'tahsilat',     label:'Tahsilatlar' },
        { key:'geciken',      label:'Geciken ödemeler' },
        { key:'aylikGelir',   label:'Aylık gelir tahmini' },
        { key:'nakit',        label:'Nakit akış tahmini' }
      ]
    },
    {
      id:'proje', sid:'raporproje', href:'app-rapor-proje.html',
      ad:'Proje Raporları', icon:'i-briefcase', deep:false, perm:null,
      desc:'Proje portföyünün durumu: sprint ve milestone ilerlemesi, bütçe kullanımı, kaynak ve teslim performansı.',
      reports:[
        { key:'genel',       label:'Proje genel raporu' },
        { key:'durum',       label:'Proje durum raporu' },
        { key:'sprint',      label:'Sprint raporu' },
        { key:'milestone',   label:'Milestone ve teslim raporu' },
        { key:'butce',       label:'Proje bütçe ve maliyet raporu' },
        { key:'kaynak',      label:'Kaynak kullanım raporu' },
        { key:'gecikme',     label:'Geciken projeler raporu' },
        { key:'risk',        label:'Proje risk ve engel raporu' }
      ]
    }
  ];

  /* Kayıtlı rapor filtrelerinde kullanılan anahtarların okunur karşılıkları */
  var FLBL = {
    tarih:'Tarih', dep:'Departman', personel:'Personel', proje:'Proje', musteri:'Müşteri',
    durum:'Durum', sorumlu:'Sorumlu', arac:'Araç', referans:'Yönlendiren', tur:'Tür',
    temsilci:'Temsilci', hizmet:'Hizmet', kaynak:'Kaynak'
  };

  /* ===== yardımcılar ==================================================== */
  function norm(s){
    return String(s == null ? '' : s)
      .replace(/İ/g,'i').replace(/I/g,'ı')
      .toLowerCase()
      .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
      .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
  }
  function lockReason(c){
    if(!c.perm) return null;
    if(GV.perm.can(c.perm)) return null;
    if(c.perm === 'finans') return 'Finansal veri yetkiniz olmadığı için bu kategori kapalı. Erişim için yöneticinize başvurun.';
    if(c.perm === 'personelRapor') return 'Personel verisi görme yetkiniz olmadığı için bu kategori kapalı. Erişim için İK ekibine başvurun.';
    return 'Müşteri raporu yetkiniz olmadığı için bu kategori kapalı. Erişim için yöneticinize başvurun.';
  }
  function catBySid(sid){ for(var i=0;i<CATS.length;i++) if(CATS[i].sid === sid) return CATS[i]; return null; }
  function reportLabel(cat, key){
    if(!cat) return key;
    for(var i=0;i<cat.reports.length;i++) if(cat.reports[i].key === key) return cat.reports[i].label;
    return key;
  }
  function savedOf(sid){
    try{ var v = JSON.parse(localStorage.getItem('gv.rp.' + sid) || '[]'); return v instanceof Array ? v : []; }
    catch(e){ return []; }
  }
  function writeSaved(sid, list){
    try{ localStorage.setItem('gv.rp.' + sid, JSON.stringify(list)); }catch(e){}
  }
  function allSaved(){
    var out = [];
    CATS.forEach(function(c){
      savedOf(c.sid).forEach(function(s, i){ out.push({ cat:c, idx:i, nm:s.nm, key:s.key, f:s.f || {} }); });
    });
    return out;
  }
  function savedHref(row){
    var q = '?r=' + encodeURIComponent(row.key || '');
    Object.keys(row.f).forEach(function(k){
      if(row.f[k]) q += '&rf_' + encodeURIComponent(k) + '=' + encodeURIComponent(row.f[k]);
    });
    return row.cat.href + q;
  }
  function reportHref(cat, r){
    return cat.deep ? cat.href + '?r=' + encodeURIComponent(r.key) : cat.href;
  }

  /* ===== sayımlar ======================================================= */
  var TOTAL = CATS.reduce(function(s, c){ return s + c.reports.length; }, 0);
  var OPEN_CATS = CATS.filter(function(c){ return !lockReason(c); });
  var OPEN_REPORTS = OPEN_CATS.reduce(function(s, c){ return s + c.reports.length; }, 0);

  /* ===== sayfa başlığı ================================================== */
  GV.pageHead({
    eyebrow:'Raporlar',
    title:'Rapor Merkezi',
    sub:CATS.length + ' kategori · ' + TOTAL + ' rapor · veri tarihi ' + F.dateLong(TODAY),
    actions:[
      { label:'Kayıtlı raporlar', icon:'i-star', cls:'btn-line', id:'rpJump' },
      { label:'Ana Panel', icon:'i-gauge', cls:'btn-line', href:'app-panel.html' }
    ]
  });

  var root = document.getElementById('merkez');

  /* ===== KPI şeridi ===================================================== */
  function kpi(c){
    return '<div class="kpi' + (c.tone ? ' is-' + c.tone : '') + '">' +
      '<div class="kpi-ico">' + ico(c.icon, 'ic-lg') + '</div>' +
      '<div class="kpi-body">' +
        '<div class="kpi-num"' + (c.id ? ' id="' + c.id + '"' : '') + '>' + c.value + '</div>' +
        '<div class="kpi-lbl">' + esc(c.label) + '</div>' +
        (c.meta ? '<div class="kpi-meta' + (c.metaTone ? ' is-' + c.metaTone : ' is-flat') + '">' + esc(c.meta) + '</div>' : '') +
      '</div></div>';
  }
  function kpiHtml(){
    var sv = allSaved().length;
    return '<div class="kpi-grid">' +
      kpi({ icon:'i-chart-bar', label:'Tanımlı rapor', value:TOTAL,
            meta:'PROMPT §20 kapsamının tamamı', metaTone:'flat' }) +
      kpi({ icon:'i-shield-check', tone:(OPEN_REPORTS === TOTAL ? 'ok' : 'warn'),
            label:'Erişebildiğiniz rapor', value:OPEN_REPORTS,
            meta:(TOTAL - OPEN_REPORTS) + ' rapor yetki dışı',
            metaTone:(OPEN_REPORTS === TOTAL ? 'up' : 'down') }) +
      kpi({ icon:'i-star', tone:'info', label:'Kayıtlı rapor', value:sv, id:'kpiSaved',
            meta:'Bu tarayıcıda saklanır', metaTone:'flat' }) +
      kpi({ icon:'i-layers', tone:'purple', label:'Açık kategori',
            value:OPEN_CATS.length + '<small>/ ' + CATS.length + '</small>',
            meta:'Rolünüz: ' + DB.roleName(GV.perm.role()), metaTone:'flat' }) +
      '</div>';
  }

  /* ===== kategori kartları ============================================== */
  function chip(cat, r){
    var txt = esc(r.label);
    if(lockReason(cat)) return '<span class="tag" data-rp="' + norm(r.label) + '">' + txt + '</span>';
    return '<a class="tag" data-rp="' + norm(r.label) + '" href="' + reportHref(cat, r) + '">' + txt + '</a>';
  }
  function catCard(c){
    var lock = lockReason(c);
    var head =
      '<div class="gc-head"><div>' +
        '<h2 class="gc-title">' + ico(c.icon) + esc(c.ad) + '</h2>' +
        '<div class="gc-sub">' + c.reports.length + ' rapor' + (c.deep ? '' : ' · rapor bağlantısı kategori sayfasını açar') + '</div>' +
      '</div><div class="gc-head-acts">' +
        (lock ? GV.badge('Yetki yok','is-neutral') : '<span class="badge is-accent no-dot">Açık</span>') +
      '</div></div>';
    var body =
      '<div class="gc-body">' +
        '<p class="u-sm u-muted u-mt-0 u-mb-4">' + esc(lock || c.desc) + '</p>' +
        '<div class="u-row u-wrap" data-chips>' + c.reports.map(function(r){ return chip(c, r); }).join('') + '</div>' +
      '</div>';
    var foot =
      '<div class="gc-foot">' +
        '<span class="u-xs u-muted u-b" data-catcount>' + c.reports.length + ' rapor</span>' +
        (lock
          ? '<span class="u-xs u-faint">' + ico('i-lock','ic-sm') + ' Kategori kilitli</span>'
          : '<a class="btn btn-line btn-sm" href="' + c.href + '">Kategoriyi aç ' + ico('i-arrow-right','ic-sm') + '</a>') +
      '</div>';
    return '<article class="gv-card" data-cat="' + c.id + '" data-catname="' + norm(c.ad) + '">' + head + body + foot + '</article>';
  }
  function catsHtml(){
    return '<section class="gv-card">' +
      '<div class="gv-listhead"><div class="lh-row">' +
        '<label class="lh-search">' + ico('i-search') +
          '<input id="rpQ" type="search" placeholder="' + TOTAL + ' rapor içinde ara — örn. tahsilat, kapasite, muayene" ' +
          'aria-label="Rapor ara" autocomplete="off">' +
        '</label>' +
        '<div class="lh-acts">' +
          '<span class="tag" id="rpStat">' + CATS.length + ' kategori · ' + TOTAL + ' rapor</span>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-act="clear">' + ico('i-filter-x','ic-sm') + ' Aramayı temizle</button>' +
        '</div>' +
      '</div></div>' +
      '<div class="gc-body">' +
        '<div class="gv-grid gv-grid-3" id="rpCats">' + CATS.map(catCard).join('') + '</div>' +
        '<div id="rpNone" style="display:none"></div>' +
      '</div>' +
    '</section>';
  }

  /* ===== kayıtlı raporlar =============================================== */
  function savedRows(){
    var list = allSaved();
    if(!list.length){
      return GV.empty({
        icon:'i-star',
        title:'Henüz kayıtlı rapor yok',
        desc:'Bir raporu filtreleriyle birlikte saklamak için rapor ekranındaki “Raporu kaydet” düğmesini kullanın. Kayıtlar bu tarayıcıda tutulur.',
        action:'<a class="btn btn-acc" href="app-rapor-gorev.html">Görev raporlarını aç</a>'
      });
    }
    var body = list.map(function(row){
      var lock = lockReason(row.cat);
      var lbl = reportLabel(row.cat, row.key);
      var chips = Object.keys(row.f).filter(function(k){ return row.f[k]; }).map(function(k){
        return '<span class="tag">' + esc(FLBL[k] || k) + ': ' + esc(row.f[k]) + '</span>';
      });
      var first = lock
        ? '<span class="cell-main">' + esc(row.nm) + '</span><span class="cell-sub">' + esc(lbl) + '</span>'
        : '<a class="cell-main" href="' + savedHref(row) + '">' + esc(row.nm) + '</a><span class="cell-sub">' + esc(lbl) + '</span>';
      return '<tr>' +
        '<td class="cell-wrap">' + first + '</td>' +
        '<td>' + (lock ? GV.badge('Yetki yok','is-neutral') : '<span class="tag">' + esc(row.cat.ad) + '</span>') + '</td>' +
        '<td class="cell-wrap">' + (chips.length ? '<span class="u-row u-wrap">' + chips.join('') + '</span>' : '<span class="u-faint">Filtresiz</span>') + '</td>' +
        '<td class="col-acts"><span class="cell-acts">' +
          '<button type="button" class="btn btn-ghost btn-xs btn-icon" data-del="' + row.cat.sid + '" data-idx="' + row.idx + '" ' +
          'title="Kayıtlı raporu sil" aria-label="' + esc(row.nm) + ' kaydını sil">' + ico('i-trash','ic-sm') + '</button>' +
        '</span></td>' +
      '</tr>';
    }).join('');
    return '<div class="gv-tablewrap"><table class="gtable">' +
      '<thead><tr><th>Kayıt adı</th><th>Kategori</th><th>Saklanan filtreler</th><th class="col-acts">İşlem</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div>';
  }
  function savedHtml(){
    var n = allSaved().length;
    return '<section class="gv-card u-mt-8" id="rpSavedSec">' +
      '<div class="gc-head"><div>' +
        '<h2 class="gc-title">' + ico('i-star') + 'Kayıtlı raporlar</h2>' +
        '<div class="gc-sub" data-savedsub>' + (n ? n + ' kayıt · rapor ve filtreleri birlikte geri yüklenir' : 'Rapor ekranlarında kaydettiğiniz görünümler burada toplanır') + '</div>' +
      '</div></div>' +
      '<div class="gc-body' + (n ? ' flush' : '') + '" id="rpSavedBody">' + savedRows() + '</div>' +
    '</section>';
  }

  /* ===== ilk çizim ====================================================== */
  root.innerHTML = kpiHtml() + catsHtml() + savedHtml();

  /* ===== arama ========================================================== */
  var q = document.getElementById('rpQ');
  var stat = document.getElementById('rpStat');
  var none = document.getElementById('rpNone');

  function applySearch(){
    var term = norm(q.value.trim());
    var cards = root.querySelectorAll('#rpCats > .gv-card');
    var visCat = 0, visRep = 0;
    Array.prototype.forEach.call(cards, function(card){
      var catHit = !term || card.dataset.catname.indexOf(term) !== -1;
      var chips = card.querySelectorAll('[data-chips] .tag');
      var hit = 0;
      Array.prototype.forEach.call(chips, function(ch){
        var on = !term || catHit || ch.dataset.rp.indexOf(term) !== -1;
        /* .tag inline-flex olduğu için [hidden] yetmez — display doğrudan yönetilir */
        ch.style.display = on ? '' : 'none';
        if(on) hit++;
      });
      var show = !term || catHit || hit > 0;
      card.style.display = show ? '' : 'none';
      if(show){ visCat++; visRep += hit; }
      var cc = card.querySelector('[data-catcount]');
      if(cc) cc.textContent = (term && !catHit ? hit + ' eşleşen rapor' : chips.length + ' rapor');
    });
    stat.textContent = term
      ? visCat + ' kategori · ' + visRep + ' eşleşen rapor'
      : CATS.length + ' kategori · ' + TOTAL + ' rapor';
    if(!visCat){
      none.style.display = '';
      none.innerHTML = GV.empty({
        icon:'i-search',
        title:'Rapor bulunamadı',
        desc:'“' + q.value.trim() + '” aramasıyla eşleşen rapor yok. Daha kısa bir anahtar kelime deneyin.',
        action:'<button type="button" class="btn btn-line" data-act="clear">Aramayı temizle</button>'
      });
    }else{
      none.style.display = 'none';
      none.innerHTML = '';
    }
  }
  q.addEventListener('input', applySearch);

  /* ===== etkileşimler =================================================== */
  function refreshSaved(){
    var n = allSaved().length;
    var body = document.getElementById('rpSavedBody');
    body.className = 'gc-body' + (n ? ' flush' : '');
    body.innerHTML = savedRows();
    var sub = root.querySelector('[data-savedsub]');
    if(sub) sub.textContent = n ? n + ' kayıt · rapor ve filtreleri birlikte geri yüklenir'
                                : 'Rapor ekranlarında kaydettiğiniz görünümler burada toplanır';
    var k = document.getElementById('kpiSaved');
    if(k) k.textContent = n;
  }

  root.addEventListener('click', function(e){
    var clr = e.target.closest('[data-act="clear"]');
    if(clr){ q.value = ''; applySearch(); q.focus(); return; }

    var del = e.target.closest('[data-del]');
    if(del){
      var sid = del.dataset.del, idx = parseInt(del.dataset.idx, 10);
      var list = savedOf(sid);
      var rec = list[idx];
      if(!rec) return;
      GV.confirm({
        title:'Kayıtlı rapor silinsin mi?',
        text:'“' + rec.nm + '” kaydı kalıcı olarak silinecek. Rapor ve filtreleri bu kısayoldan artık açılamaz.',
        tone:'danger', okLabel:'Sil'
      }).then(function(ok){
        if(!ok) return;
        list.splice(idx, 1);
        writeSaved(sid, list);
        refreshSaved();
        GV.toast('“' + rec.nm + '” silindi.', 'ok');
      });
    }
  });

  var jump = document.getElementById('rpJump');
  if(jump) jump.addEventListener('click', function(){
    var sec = document.getElementById('rpSavedSec');
    if(sec) sec.scrollIntoView({ behavior:'smooth', block:'start' });
  });
});
</script>
</body>
</html>
