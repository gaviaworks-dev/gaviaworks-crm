<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yönlendiren Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satis" data-screen="referans">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');

  var id = new URLSearchParams(location.search).get('id') || (DB.referrers[0] || {}).kod;
  var r  = DB.referrers.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!r){
    GV.pageHead({ eyebrow:'Satış ve CRM', title:'Yönlendiren Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Referans kaynakları', icon:'i-users', href:'app-referans.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Yönlendiren bulunamadı',
      desc:'“' + esc(id || '') + '” kodlu yönlendiren kaydı sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-referans.html">Referans kaynaklarına dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(r.kod);
  document.title = r.kod + ' — ' + r.ad + ' — GaviaWorks CRM';

  /* =================================================================
     TERMİNOLOJİ NOTU
       DB.commissions[].kazanimTarihi ve DB.referrers[].komisyonToplam alan adları
       veri dosyasında böyle yazılıdır ve DEĞİŞTİRİLMEZ (canonical tarama
       alan adına bakar). Ekranda gösterilen etiketlerde ise inşaat terimi
       kullanılmaz: "Komisyon kazancı" · "Kazanç tarihi" · "Ödenen komisyon"
       · "Bekleyen komisyon".
     ================================================================= */

  /* =================================================================
     İLİŞKİLİ KAYITLAR — hepsi veride yazılı tekil bağdan türetilir
       lead.referans → REF-xxx · customer.referans → REF-xxx
       commission.referans → REF-xxx · activity.kayit → REF-xxx
     ================================================================= */
  var leads = DB.leads.filter(function(l){ return l.referans === r.kod; })
                      .sort(function(a,b){ return String(b.talepTarihi).localeCompare(String(a.talepTarihi)); });
  var musteriler = DB.customers.filter(function(c){ return c.referans === r.kod; })
                      .sort(function(a,b){ return String(b.ilkKayit).localeCompare(String(a.ilkKayit)); });
  var koms = DB.commissions.filter(function(k){ return k.referans === r.kod; })
                      .sort(function(a,b){ return String(b.kazanimTarihi || '').localeCompare(String(a.kazanimTarihi || '')); });
  var acts = DB.activities.filter(function(a){ return a.kayit === r.kod; });

  function musteriByKod(k){ return DB.customers.filter(function(c){ return c.kod === k; })[0] || null; }

  /* Kişi mi kanal mı — app-referans.html'deki tür kümeleriyle birebir aynı */
  var KISI_TUR = ['Mevcut müşteri','Eski müşteri','Personel','Şirket ortağı','İş ortağı',
                  'Danışman','Freelancer','Tedarikçi','Harici kişi'];
  var kisiKaynak = KISI_TUR.indexOf(r.tur) !== -1;
  var turBilinen = DB.refTypes.indexOf(r.tur) !== -1;

  /* =================================================================
     PARA — components.md §9b
       Bu ekrandaki HER tutar NET (KDV hariç) eksenindedir:
         referrer.ciro · referrer.komisyonToplam/odenen/bekleyen · referrer.sabitBedel
         commission.ciro (dayanak) · commission.tutar (komisyon kazancı)
         lead.butce · customer.toplamCiro
       Brüt eksen bu ekranda hiç kullanılmaz, karışma riski yoktur.
     ================================================================= */
  function para(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="cell-money">' + F.money(v) + '</span>';
  }
  function paraSade(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="u-num">' + F.money(v) + '</span>';
  }
  var finansNot = canFinans ? '' : '<div class="gc-body">' + GV.notice({
    tone:'neutral', icon:'i-lock', title:'Tutarlar gizli',
    text:'Rolünüzde finansal tutar görüntüleme yetkisi yok. Kayıtlar listelenir, para alanları maskelenir.' }) + '</div>';

  /* =================================================================
     KOMİSYON TÜRETİMİ VE KART DOĞRULAMASI
       Kart alanları: r.komisyonToplam (toplam) · r.odenen · r.bekleyen
       Türetilen:     Σ k.tutar · Σ (durum === 'Ödendi') · fark
     ================================================================= */
  var komNet     = koms.reduce(function(s,k){ return s + (k.tutar || 0); }, 0);
  var komOdenen  = koms.filter(function(k){ return k.durum === 'Ödendi'; })
                       .reduce(function(s,k){ return s + (k.tutar || 0); }, 0);
  var komBekleyen = komNet - komOdenen;
  var komDayanak = koms.reduce(function(s,k){ return s + (k.ciro || 0); }, 0);
  var komOnayBekleyen = koms.filter(function(k){ return k.onay === 'Bekliyor'; }).length;

  var farkToplam   = komNet - (r.komisyonToplam || 0);
  var farkOdenen   = komOdenen - (r.odenen || 0);
  var farkBekleyen = komBekleyen - (r.bekleyen || 0);
  var komTutuyor   = farkToplam === 0 && farkOdenen === 0 && farkBekleyen === 0;

  /* =================================================================
     PERFORMANS TÜRETİMİ — veriye yazılı hazır sayı aranmaz
     ================================================================= */
  var leadKazanildi = leads.filter(function(l){ return l.asama === 'Kazanıldı'; }).length;
  var leadKaybedildi = leads.filter(function(l){ return l.asama === 'Kaybedildi'; }).length;
  var leadAcik = leads.length - leadKazanildi - leadKaybedildi;
  var leadDonusum = leads.length ? Math.round(leadKazanildi / leads.length * 100) : null;
  var leadButceNet = leads.reduce(function(s,l){ return s + (l.butce || 0); }, 0);
  var ortLeadButce = leads.length ? Math.round(leadButceNet / leads.length) : null;

  var musteriCiroNet = musteriler.reduce(function(s,c){ return s + (c.toplamCiro || 0); }, 0);
  var ortMusteriCiro = musteriler.length ? Math.round(musteriCiroNet / musteriler.length) : null;
  var cirolu = musteriler.filter(function(c){ return (c.toplamCiro || 0) > 0; });
  var aktifProjeSayisi = musteriler.reduce(function(s,c){ return s + (c.aktifProje || 0); }, 0);
  var toplamProjeSayisi = musteriler.reduce(function(s,c){ return s + (c.projeSayisi || 0); }, 0);

  /* Efektif komisyon oranı: kazandırdığı müşterilerin net cirosuna göre */
  var efektifOran = musteriCiroNet ? Math.round(komNet / musteriCiroNet * 1000) / 10 : null;
  var kazanimBasinaKomisyon = musteriler.length ? Math.round(komNet / musteriler.length) : null;

  /* Devamlılık — ilk ve son yönlendirme tarihi arası; tarihler bağlı
     kayıtlardan türetilir, kart yalnız sonYonlendirme'yi tutar. */
  var tarihler = [];
  leads.forEach(function(l){ if(l.talepTarihi) tarihler.push(String(l.talepTarihi).slice(0,10)); });
  musteriler.forEach(function(c){ if(c.ilkKayit) tarihler.push(String(c.ilkKayit).slice(0,10)); });
  koms.forEach(function(k){ if(k.kazanimTarihi) tarihler.push(String(k.kazanimTarihi).slice(0,10)); });
  tarihler.sort();
  var ilkYonlendirme = tarihler[0] || null;
  var sonYonlendirmeTuretilen = tarihler.length ? tarihler[tarihler.length - 1] : null;
  /* Kart alanı da adaydır — hangisi daha yeniyse gösterilen "son" odur */
  var sonYonlendirme = r.sonYonlendirme || null;
  if(sonYonlendirmeTuretilen && (!sonYonlendirme || sonYonlendirmeTuretilen > sonYonlendirme)){
    sonYonlendirme = sonYonlendirmeTuretilen;
  }
  var devamGun = (ilkYonlendirme && sonYonlendirme)
    ? Math.round((new Date(sonYonlendirme + 'T00:00:00') - new Date(ilkYonlendirme + 'T00:00:00')) / 86400000) : null;
  var devamAy = devamGun != null ? Math.round(devamGun / 30.44 * 10) / 10 : null;
  var sessizGun = sonYonlendirme != null ? -F.days(sonYonlendirme) : null;
  var kayitAdedi = leads.length + musteriler.length;
  var araGun = (devamGun != null && kayitAdedi > 1) ? Math.round(devamGun / (kayitAdedi - 1)) : null;

  /* Canlılık eşikleri — DB.today referansı, 60 / 120 / 240 gün */
  function canlilik(gun){
    if(gun == null) return { tone:'neutral', lbl:'Yönlendirme tarihi yok' };
    if(gun <= 60)  return { tone:'ok',      lbl:'Canlı kaynak' };
    if(gun <= 120) return { tone:'warn',    lbl:'Yavaşlıyor' };
    if(gun <= 240) return { tone:'danger',  lbl:'Uzun süredir sessiz' };
    return { tone:'neutral', lbl:'Uykuda' };
  }
  var canli = canlilik(sessizGun);

  /* =================================================================
     YARDIMCILAR
     ================================================================= */
  /* dt metinleri yazar tarafından yazılan sabit dizelerdir (eksen etiketi için
     <span class="u-faint"> içerir) — bu yüzden dt escape EDİLMEZ, dd zaten
     çağıran tarafta esc()'lenerek gelir. */
  function tbl(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3></div>' + govde + '</div>';
  }
  function bos(v){ return v == null || v === '' || v === '—'; }
  function gunMetin(gun){
    if(gun == null) return '<span class="u-faint">—</span>';
    if(gun === 0) return '<b class="u-num">bugün</b>';
    if(gun < 0)   return '<b class="u-num">' + Math.abs(gun) + ' gün sonra</b>';
    return '<b class="u-num">' + gun + ' gün önce</b>';
  }
  function oranTonu(v){ return v == null ? null : (v >= 40 ? 'ok' : v >= 20 ? 'warn' : 'danger'); }

  /* =================================================================
     SAYFA BAŞLIĞI — aksiyonların üçü de yayındaki ekranlara gider
     ================================================================= */
  GV.pageHead({
    eyebrow:'Satış ve CRM', title:'Yönlendiren Detayı',
    sub:r.kod + ' · ' + r.ad + ' · ' + r.tur,
    actions:[
      { label:'Referans kaynakları', icon:'i-users',  href:'app-referans.html' },
      { label:'Komisyonlar',         icon:'i-percent', href:'app-komisyon.html?f_referans=' + r.kod },
      { label:'Referans raporu',     icon:'i-chart-bar', cls:'btn-acc', href:'app-rapor-referans.html' }
    ]
  });

  /* =================================================================
     KAYIT BAŞLIĞI
     ================================================================= */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + esc(r.kod) + '</span>' +
        GV.badge(r.durum) +
        '<span class="tag">' + esc(r.tur) + '</span>' +
        '<span class="badge ' + (kisiKaynak ? 'is-info' : 'is-neutral') + ' no-dot">' +
          (kisiKaynak ? 'Kişi referansı' : 'Dijital / kurumsal kanal') + '</span>' +
        (r.aktif === false ? '<span class="tag">Arşiv</span>' : '') +
        (r.bekleyen > 0 ? '<span class="badge is-warn no-dot">Ödeme bekleyen komisyon</span>' : '') + '</div>' +
      '<h1>' + esc(r.ad) + '</h1>' +
      '<div class="gv-rec-meta">' +
        (bos(r.firma) ? '' : '<span>' + ico('i-building','ic-sm') + esc(r.firma) +
          (bos(r.pozisyon) ? '' : ' · ' + esc(r.pozisyon)) + '</span>') +
        (bos(r.tel) ? '' : '<span>' + ico('i-phone','ic-sm') +
          '<a href="tel:' + esc(String(r.tel).replace(/\s/g,'')) + '">' + esc(r.tel) + '</a></span>') +
        (bos(r.eposta) ? '' : '<span>' + ico('i-mail','ic-sm') +
          '<a href="mailto:' + esc(r.eposta) + '">' + esc(r.eposta) + '</a></span>') +
        '<span>' + ico('i-user-check','ic-sm') + 'Sorumlu ' + esc(DB.empName(r.sorumlu)) + '</span>' +
        '<span>' + ico('i-user-plus','ic-sm') + F.num(r.yonlendirme) + ' yönlendirme · ' +
          F.num(r.kazanilan) + ' kazanım</span>' +
        '<span>' + ico('i-wallet','ic-sm') +
          (canFinans ? F.money(r.ciro) + ' ciro (KDV hariç)' : 'Ciro gizli') + '</span>' +
        '<span>' + ico('i-calendar','ic-sm') + 'Son yönlendirme ' + F.date(sonYonlendirme) + '</span>' +
      '</div>' +
    '</div></div>';

  /* =================================================================
     SEKMELER
     ================================================================= */
  var tabs = [
    { key:'genel',      lbl:'Genel',                 ic:'i-info' },
    { key:'lead',       lbl:'Yönlendirdiği Adaylar', ic:'i-user-plus', cnt:leads.length },
    { key:'musteri',    lbl:'Kazandırdığı Müşteriler', ic:'i-building', cnt:musteriler.length },
    { key:'komisyon',   lbl:'Komisyonlar',           ic:'i-percent',   cnt:koms.length },
    { key:'performans', lbl:'Performans',            ic:'i-chart-bar' },
    { key:'aktivite',   lbl:'Aktivite Geçmişi',      ic:'i-activity',  cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* =================================================================
     1. GENEL — DB.referrers alanlarının tamamı
     ================================================================= */
  var sorumluEmp = DB.emp(r.sorumlu);

  var modelAciklama = r.komisyonModeli === 'Ciro yüzdesi'
      ? 'Kazandırdığı müşterinin net cirosu × %' + r.komisyonOrani
      : r.komisyonModeli === 'Sabit bedel'
        ? 'Kazandırdığı müşteri başına sabit tutar'
        : 'Bu kaynağa komisyon uygulanmıyor';

  var pGenel = '<div class="gc-body">' +
    sec('Yönlendiren Kimliği', GV.dl([
      ['Yönlendiren kodu', '<span class="u-num">' + esc(r.kod) + '</span>'],
      ['Ad / kanal adı', esc(r.ad)],
      ['Referans türü', '<span class="tag">' + esc(r.tur) + '</span>' +
        (turBilinen ? '' : ' <span class="badge is-warn no-dot">Tür listesinde yok</span>')],
      ['Kaynak sınıfı <span class="u-faint">(türden türetildi)</span>',
        kisiKaynak
          ? '<span class="badge is-info no-dot">Kişi referansı</span> <span class="cell-sub">Komisyon konusu olabilir</span>'
          : '<span class="badge is-neutral no-dot">Dijital / kurumsal kanal</span> <span class="cell-sub">Kişiye komisyon ödenmez</span>'],
      ['İlişki <span class="u-faint">(tür + kurum + unvandan türetildi)</span>',
        esc(r.tur) + (bos(r.firma) ? '' : ' · ' + esc(r.firma)) + (bos(r.pozisyon) ? '' : ' · ' + esc(r.pozisyon))],
      ['Firma / kurum', bos(r.firma) ? null : esc(r.firma)],
      ['Unvan / pozisyon', bos(r.pozisyon) ? null : esc(r.pozisyon)],
      ['Kaynak durumu', GV.badge(r.durum)],
      ['Kayıt durumu', r.aktif === false
        ? '<span class="tag">Arşivlendi — listede varsayılan olarak gizli</span>'
        : '<span class="badge is-ok no-dot">Aktif kayıt</span>']
    ])) +

    sec('İletişim ve Sahiplik', GV.dl([
      ['Telefon', bos(r.tel) ? null
        : '<a href="tel:' + esc(String(r.tel).replace(/\s/g,'')) + '">' + esc(r.tel) + '</a>'],
      ['E-posta', bos(r.eposta) ? null
        : '<a href="mailto:' + esc(r.eposta) + '">' + esc(r.eposta) + '</a>'],
      ['Şirket içi sorumlu', GV.user(r.sorumlu, { sm:true }) +
        (sorumluEmp ? ' <span class="cell-sub">' + esc(sorumluEmp.pozisyon) + ' · ' + esc(sorumluEmp.depAd) + '</span>' : '')],
      ['Sorumlunun departmanı', sorumluEmp ? esc(sorumluEmp.depAd) : null]
    ])) +

    sec('Komisyon Koşulu', GV.dl([
      ['Komisyon modeli', r.komisyonModeli === 'Yok'
        ? '<span class="u-faint">Komisyonsuz kaynak</span>'
        : '<span class="tag">' + esc(r.komisyonModeli) + '</span>'],
      ['Komisyon oranı', r.komisyonOrani ? '<b class="u-num">%' + r.komisyonOrani + '</b>' : null],
      ['Sabit bedel <span class="u-faint">(KDV hariç)</span>', r.sabitBedel ? para(r.sabitBedel) : null],
      ['Hesap tabanı', esc(modelAciklama)],
      ['Toplam komisyon kazancı <span class="u-faint">(KDV hariç)</span>', '<b>' + para(r.komisyonToplam) + '</b>'],
      ['Ödenen komisyon <span class="u-faint">(KDV hariç)</span>', para(r.odenen)],
      ['Bekleyen komisyon <span class="u-faint">(KDV hariç)</span>',
        r.bekleyen ? '<b class="u-warn">' + para(r.bekleyen) + '</b>' : '<span class="badge is-ok no-dot">Bekleyen yok</span>']
    ])) +

    sec('Kart Üzerindeki Yönlendirme Sayaçları', GV.dl([
      ['Yönlendirme sayısı', '<b class="u-num">' + F.num(r.yonlendirme) + '</b>'],
      ['Kazanılan', '<b class="u-num u-ok">' + F.num(r.kazanilan) + '</b>'],
      ['Kaybedilen', '<span class="u-num u-muted">' + F.num(r.kaybedilen) + '</span>'],
      ['Açık fırsat <span class="u-faint">(yönlendirme − kazanılan − kaybedilen)</span>',
        '<b class="u-num">' + F.num(r.yonlendirme - r.kazanilan - r.kaybedilen) + '</b>'],
      ['Dönüşüm oranı <span class="u-faint">(kart değeri)</span>',
        GV.progress(r.donusum, { tone:oranTonu(r.donusum) })],
      ['Getirdiği toplam ciro <span class="u-faint">(KDV hariç)</span>', '<b>' + para(r.ciro) + '</b>'],
      ['Son yönlendirme <span class="u-faint">(kart alanı)</span>',
        r.sonYonlendirme
          ? GV.dateCell(r.sonYonlendirme, { done:true }) + ' <span class="cell-sub">' + gunMetin(-F.days(r.sonYonlendirme)) + '</span>'
          : null]
    ])) +

    sec('Not', GV.dl([
      ['Yönlendiren notu', bos(r.not) ? null : esc(r.not)]
    ])) +

    sec('Kartta Tutulmayan Alanlar', GV.notice({
      tone:'neutral', icon:'i-info', title:'Üç alan veri modelinde yok',
      text:'Yönlendiren kaydı “ödeme koşulu”, “kayıt / ilk temas tarihi” ve serbest metin “ilişki” alanı tutmuyor. ' +
           'Ödeme koşulu yerine komisyon modeli, kayıt tarihi yerine Performans sekmesindeki ilk yönlendirme tarihi, ' +
           'ilişki yerine tür + kurum + unvan birleşimi gösterilir.' })) +
    '</div>';

  /* =================================================================
     2. YÖNLENDİRDİĞİ ADAYLAR
     ================================================================= */
  var leadKapsam = (leads.length !== r.yonlendirme)
    ? '<div class="gc-body">' + GV.notice({ tone:'neutral', icon:'i-info',
        title:'Kart sayacı ile listelenen aday sayısı farklı',
        text:'Kart “' + r.yonlendirme + ' yönlendirme” diyor; aday kayıtları arasında bu kaynağa bağlı ' + leads.length +
             ' aday bulunuyor. Kart sayacı kaynağın tüm geçmişini (arşivlenmiş ve sisteme taşınmamış talepler dahil) ' +
             'kapsar, tablo yalnız sistemdeki aday kayıtlarını listeler.' }) + '</div>'
    : '';

  var pLead = finansNot + leadKapsam + '<div class="gc-body flush">' +
    (leads.length
      ? tbl('<th>Aday</th><th>Firma</th><th>Hizmet</th><th>Aşama</th><th>Sıcaklık</th>' +
            '<th class="num">Bütçe (KDV hariç)</th><th>Talep tarihi</th><th>Sonuç</th><th>Sorumlu</th>',
          leads.map(function(l){
            var m = l.musteri ? musteriByKod(l.musteri) : null;
            var sonuc;
            if(l.asama === 'Kazanıldı'){
              sonuc = m
                ? '<span class="badge is-ok no-dot">Kazanıldı</span><a class="cell-code" href="app-musteri-detay.html?id=' + esc(m.kod) + '">' + esc(m.kisa) + '</a>'

        : '<span class="u-faint">Kontrol edilecek kayıt yok</span>']
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-trend-up') + 'Devamlılık</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['İlk yönlendirme', ilkYonlendirme ? '<span class="cell-date">' + F.date(ilkYonlendirme) + '</span>' : '<span class="u-faint">—</span>'],
      ['Son yönlendirme', sonYonlendirme ? '<span class="cell-date">' + F.date(sonYonlendirme) + '</span>' : '<span class="u-faint">—</span>'],
      ['Aktif dönem', devamGun != null ? '<b class="u-num">' + F.num(devamGun) + '</b> gün' : '<span class="u-faint">—</span>'],
      ['Sessiz süre', gunMetin(sessizGun)],
      ['Canlılık', GV.badge(canli.lbl, 'is-' + canli.tone)]
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3))
      : '<p class="u-sm u-faint">Bu yönlendiren kartında henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');
});
</script>
</body>
</html>
