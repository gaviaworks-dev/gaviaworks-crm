<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yönlendiren Kişiler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satis" data-screen="referans">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc;
  var canFinans = GV.perm.can('finans');

  GV.pageHead({
    eyebrow:'Satış ve CRM', title:'Yönlendiren Kişiler',
    actions:[
      { label:'Komisyon Kazançları', icon:'i-percent', href:'app-komisyon.html' },
      { label:'Yeni Yönlendiren', icon:'i-plus', cls:'btn-acc', href:'app-referans-form.html' }
    ]
  });

  GV.list({
    mount:'#liste', id:'referans', key:'kod', source:function(){ return DB.referrers; },
    exportName:'yonlendirenler', exportTitle:'Yönlendiren Kişi ve Referans Kaynakları',
    pageSize:10, views:['table','card'],
    search:{ placeholder:'Kişi, firma, referans türü ara', fields:['kod','ad','firma','tur','pozisyon','not'] },
    defaultSort:'ciro', defaultDir:'desc',

    kpis:[
      { label:'Aktif yönlendiren', icon:'i-users',
        calc:function(a){ return a.filter(function(r){ return r.durum === 'Aktif'; }).length; } },
      { label:'Toplam yönlendirme', icon:'i-arrow-right', tone:'info',
        calc:function(a){ return a.reduce(function(s,r){ return s + r.yonlendirme; }, 0); } },
      { label:'Referanslı ciro', icon:'i-wallet', tone:'ok', format:F.moneyK,
        perm:'finans', calc:function(a){ return a.reduce(function(s,r){ return s + r.ciro; }, 0); } },
      { label:'Bekleyen komisyon', icon:'i-percent', tone:'warn', format:F.moneyK, href:'app-komisyon.html',
        perm:'finans', calc:function(a){ return a.reduce(function(s,r){ return s + r.bekleyen; }, 0); } }
    ],

    tabs:[
      { key:'aktif',  label:'Aktif Kaynaklar', icon:'i-check-circle', filter:function(r){ return r.durum === 'Aktif'; } },
      { key:'kisi',   label:'Kişi Referansları', icon:'i-user',
        filter:function(r){ return ['Mevcut müşteri','Eski müşteri','Personel','Danışman','İş ortağı','Freelancer','Harici kişi','Şirket ortağı','Tedarikçi'].indexOf(r.tur) !== -1; } },
      { key:'kanal',  label:'Dijital Kanallar', icon:'i-link',
        filter:function(r){ return ['Dijital reklam','Organik arama','Sosyal medya','Web formu','Telefon','E-posta','Etkinlik','Kurumsal firma'].indexOf(r.tur) !== -1; } },
      { key:'komisyon', label:'Komisyonlu', icon:'i-percent', filter:function(r){ return r.komisyonModeli !== 'Yok'; } },
      { key:'odenmemis', label:'Ödeme Bekleyen', icon:'i-hourglass', filter:function(r){ return r.bekleyen > 0; } },
      { key:'pasif',  label:'Pasif', icon:'i-archive', filter:function(r){ return r.durum === 'Pasif'; } },
      { key:'tumu',   label:'Tümü', icon:'i-list', filter:null }
    ],

    columns:[
      { key:'ad', label:'Yönlendiren', width:'22%', cellClass:'cell-wrap', locked:true,
        render:function(r){ return '<a class="cell-main" href="app-referans-detay.html?id=' + r.kod + '">' + esc(r.ad) + '</a>' +
          (r.firma && r.firma !== '—' ? '<span class="cell-sub">' + esc(r.firma) + '</span>' : '') +
          '<span class="cell-code">' + r.kod + '</span>'; } },
      { key:'tur', label:'Referans türü', render:function(r){ return '<span class="tag">' + esc(r.tur) + '</span>'; } },
      { key:'pozisyon', label:'Pozisyon', visible:false },
      { key:'sorumlu', label:'Şirket içi sorumlu', render:function(r){ return GV.user(r.sorumlu, { sm:true }); },
        sortValue:function(r){ return DB.empName(r.sorumlu); }, exportValue:function(r){ return DB.empName(r.sorumlu); } },
      { key:'yonlendirme', label:'Yönlendirme', cellClass:'num',
        render:function(r){ return '<b class="u-num">' + r.yonlendirme + '</b>'; } },
      { key:'kazanilan', label:'Kazanılan', cellClass:'num',
        render:function(r){ return '<span class="u-num u-ok u-b">' + r.kazanilan + '</span>'; } },
      { key:'kaybedilen', label:'Kaybedilen', cellClass:'num', visible:false,
        render:function(r){ return '<span class="u-num u-muted">' + r.kaybedilen + '</span>'; } },
      { key:'donusum', label:'Dönüşüm oranı', cellClass:'num',
        render:function(r){ return GV.progress(r.donusum, { tone:r.donusum >= 40 ? 'ok' : r.donusum >= 20 ? 'warn' : 'danger' }); },
        exportValue:function(r){ return r.donusum + '%'; } },
      { key:'ciro', label:'Oluşturduğu ciro', cellClass:'num',
        render:function(r){ return canFinans ? '<span class="cell-money">' + F.money(r.ciro) + '</span>' : '<span class="cell-mask">••••••</span>'; },
        exportValue:function(r){ return canFinans ? r.ciro : ''; } },
      { key:'komisyonModeli', label:'Komisyon modeli', visible:false,
        render:function(r){ return r.komisyonModeli === 'Yok' ? '<span class="u-faint">—</span>' :
          '<span class="cell-main">' + esc(r.komisyonModeli) + '</span><span class="cell-sub">' +
          (r.komisyonOrani ? '%' + r.komisyonOrani : F.money(r.sabitBedel)) + '</span>'; } },
      { key:'bekleyen', label:'Bekleyen kazanç', cellClass:'num',
        render:function(r){ if(!canFinans) return '<span class="cell-mask">••••</span>';
          return r.bekleyen ? '<span class="cell-money u-warn">' + F.money(r.bekleyen) + '</span>' : '<span class="u-faint">—</span>'; },
        exportValue:function(r){ return canFinans ? r.bekleyen : ''; } },
      { key:'sonYonlendirme', label:'Son yönlendirme',
        render:function(r){ return '<span class="cell-date">' + F.date(r.sonYonlendirme) + '</span>'; } },
      { key:'durum', label:'Durum', render:function(r){ return GV.badge(r.durum); } }
    ],

    filters:[
      { key:'tur', label:'Referans türü', type:'multi', options:DB.refTypes },
      { key:'durum', label:'Durum', type:'select', options:['Aktif','Pasif'] },
      { key:'sorumlu', label:'Şirket içi sorumlu', type:'select',
        options:DB.employees.map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'komisyonModeli', label:'Komisyon modeli', type:'multi', options:['Ciro yüzdesi','Sabit bedel','Yok'] },
      { key:'donusum', label:'Dönüşüm oranı (en az %)', type:'text',
        test:function(r,v){ return r.donusum >= (parseFloat(v) || 0); } },
      { key:'sonYonlendirme', label:'Son yönlendirme tarihi', type:'daterange' }
    ],

    rowClass:function(r){ return r.durum === 'Pasif' ? 'is-passive' : ''; },

    card:function(r){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-referans-detay.html?id=' + r.kod + '">' + esc(r.ad) + '</a>' +
        '<div class="cell-sub">' + esc(r.tur) + '</div></div>' + GV.badge(r.durum) + '</div>' +
        '<div class="gv-rcard-meta"><span>' + r.yonlendirme + ' yönlendirme</span><span>' + r.kazanilan + ' kazanım</span></div>' +
        GV.progress(r.donusum) +
        '<div class="gv-rcard-foot">' + (canFinans ? '<span class="cell-money">' + F.moneyK(r.ciro) + '</span>' : '<span class="cell-mask">••••</span>') +
        GV.user(r.sorumlu, { sm:true }) + '</div>';
    },

    mobile:function(r){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-referans-detay.html?id=' + r.kod + '">' + esc(r.ad) + '</a>' +
        '<span class="tag">' + esc(r.tur) + '</span></div>' +
        '<div class="gv-mrow-code">' + r.kod + (r.firma && r.firma !== '—' ? ' · ' + esc(r.firma) : '') + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-arrow-right','ic-sm') + r.yonlendirme + ' yönlendirme</span>' +
        '<span>' + GV.ico('i-check-circle','ic-sm') + r.kazanilan + ' kazanım</span></div>' +
        '<div class="u-mt-0">' + GV.progress(r.donusum) + '</div>';
    },

    rowActions:[
      { key:'ac', icon:'i-external', label:'Kartı aç', href:function(r){ return 'app-referans-detay.html?id=' + r.kod; } },
      { key:'leadler', icon:'i-user-plus', label:'Yönlendirdiği adaylar', href:function(r){ return 'app-lead.html?t=tumu&f_kaynak=' + encodeURIComponent(r.tur); } },
      { key:'komisyon', icon:'i-percent', label:'Komisyonları', href:function(r){ return 'app-komisyon.html?f_referans=' + r.kod; } }
    ],

    bulk:[
      { key:'sorumlu', label:'Sorumlu ata', icon:'i-user-check' },
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true },
      { key:'pasif', label:'Pasife al', icon:'i-archive', tone:'danger', confirm:'{n} kaynak pasife alınacak. Onaylıyor musunuz?' }
    ],

    emptyState:{ icon:'i-users', title:'Bu görünümde yönlendiren yok',
      desc:'Referans kaynaklarınızı ekleyerek hangi kanalın kaç müşteri kazandırdığını ölçebilirsiniz.',
      action:'<a class="btn btn-acc" href="app-referans-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Yönlendiren</a>' }
  });
});
</script>
</body>
</html>
