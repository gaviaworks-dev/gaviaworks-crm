<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sipariş Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satinalma" data-screen="siparis">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');
  var canDuzenle = GV.perm.can('duzenle');

  var id = new URLSearchParams(location.search).get('id') || (DB.orders[0] || {}).kod;
  var o  = DB.orders.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!o){
    GV.pageHead({ eyebrow:'Satın Alma', title:'Sipariş Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Sipariş listesi', icon:'i-truck', href:'app-siparis.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Sipariş bulunamadı',
      desc:'“' + esc(id || '') + '” numaralı sipariş sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-siparis.html">Sipariş listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(o.kod);
  document.title = o.kod + ' — Sipariş — GaviaWorks CRM';

  /* =================================================================
     İLİŞKİLİ KAYITLAR — hepsi veride yazılı tekil bağdan türetilir
       order.talep      → DB.purchases (kaynak talep)
       order.tedarikci  → DB.suppliers
       talep            → DB.supplierQuotes · DB.purchaseApprovals
     ================================================================= */
  function ted(kod){ return DB.suppliers.filter(function(s){ return s.kod === kod; })[0] || null; }
  function tedAd(kod){ var s = ted(kod); return s ? s.unvan : (kod || '—'); }

  var s = ted(o.tedarikci);
  var p = o.talep ? (DB.purchases.filter(function(x){ return x.kod === o.talep; })[0] || null) : null;

  var teklifler = p ? DB.supplierQuotes.filter(function(q){ return q.talep === p.kod; })
                                       .sort(function(a,b){ return a.fiyat - b.fiyat; }) : [];
  var adimlar   = p ? DB.purchaseApprovals.filter(function(a){ return a.talep === p.kod; })
                                          .sort(function(a,b){ return a.sira - b.sira; }) : [];
  var tercih    = teklifler.filter(function(q){ return q.tercih; })[0] || null;
  var siparisTeklif = teklifler.filter(function(q){ return q.tedarikci === o.tedarikci; })[0] || null;
  /* Kalem dökümü ve iadeler — §17 "Ürünler · Miktar · Birim fiyat · Eksik teslim · İade".
     Eksik miktar ALAN DEĞİLDİR, kalemden türetilir: miktar - teslimAlinan (L-08). */
  var kalemler = DB.orderLines.filter(function(l){ return l.siparis === o.kod; })
                              .sort(function(a,b){ return a.sira - b.sira; });
  var iadeler  = DB.orderReturns.filter(function(r){ return r.siparis === o.kod; });
  var kalemNet = kalemler.reduce(function(t,l){ return t + l.miktar * l.birimFiyat; }, 0);
  var siparilenAdet = kalemler.reduce(function(t,l){ return t + l.miktar; }, 0);
  var teslimAdet    = kalemler.reduce(function(t,l){ return t + l.teslimAlinan; }, 0);
  var eksikAdet     = siparilenAdet - teslimAdet;
  var eksikKalem    = kalemler.filter(function(l){ return l.teslimAlinan < l.miktar; });
  var iadeAdet      = iadeler.reduce(function(t,r){ return t + r.miktar; }, 0);
  /* Kalemlerden türeyen teslim kontrolü — kayıttaki alanla karşılaştırılır, ezilmez. */
  var turemisKontrol = kalemler.length ? (eksikKalem.length ? 'Eksik' : 'Tam') : null;

  var acts      = DB.activities.filter(function(a){ return a.kayit === o.kod; });
  var talepActs = p ? DB.activities.filter(function(a){ return a.kayit === p.kod; }) : [];

  /* Demirbaşa aktarım — bağ veride YAZILI: `DB.assets[].siparis` (VB-07, ders L-13).
     Tedarikçi eşleşmesi ya da tarih yakınlığı bağ yerine geçmez. */
  var varliklar = DB.assets.filter(function(a){ return a.siparis === o.kod; });
  /* Araca aktarım — aynı yön kuralının filo tarafı: `DB.vehicles[].siparis` (VB-28,
     §22 madde 24). Araç demirbaştan ayrı bir modüldür, bu yüzden ayrı okunur. */
  var araclar = DB.vehicles.filter(function(v){ return v.siparis === o.kod; });
  /* Yalnız tedarikçi eşleşmesiyle bulunan kayıtlar — bu bir sipariş bağı DEĞİLDİR,
     ayrı ve açıkça etiketli bir referans listesi olarak gösterilir. */
  var tedarikciVarliklari = DB.assets.filter(function(a){ return a.tedarikci === o.tedarikci; });

  /* =================================================================
     DURUM VE SÜRE — tarih referansı DB.today
     ================================================================= */
  /* Sözlük DB.orderStatuses / DB.purchaseStatuses (org.js). Eski dizgiler
     (“Teslim alındı” · “İptal” · “Sipariş verildi”) taşındı ve hiçbir kayıtta
     kalmadı; onları arayan koşullar teslim alınmış siparişi “bekliyor”
     gösteriyor, teslim alma düğmesini kapanmış siparişte de basıyordu.
     'Kapandı' teslimden SONRA gelir, bu yüzden teslim ekseninde sayılır. */
  var SIP_TESLIM   = ['Tam Teslim','Kapandı'];
  var TALEP_KAPALI = ['Tam Teslim','Kapandı','Reddedildi','İptal Edildi'];

  var teslimAlindi = SIP_TESLIM.indexOf(o.durum) !== -1;
  var iptal        = o.durum === 'İptal Edildi';
  /* 'İade' de teslimat takibini durdurur ama iptal DEĞİLDİR: mal gelmiş,
     sonra tedarikçiye geri gönderilmiştir. Ayrı eksen, ayrı metin. */
  var iade         = o.durum === 'İade';
  /* `teslimTarihi` çift anlamlı (ops.js): teslim alınmadıysa PLANLANAN,
     'Tam Teslim' / 'Kapandı' ise GERÇEKLEŞEN tarihtir. Etiket buna göre seçilir. */
  var teslimEksen  = teslimAlindi ? 'gerçekleşen' : 'planlanan';
  var teslimEtiket = teslimAlindi ? 'Gerçekleşen teslim tarihi' : 'Planlanan teslim tarihi';

  var planKalan   = teslimAlindi ? null : F.days(o.teslimTarihi);   /* planlanan teslime kalan gün */
  var gecikmeGun  = (!teslimAlindi && !iptal && planKalan != null && planKalan < 0) ? Math.abs(planKalan) : 0;

  function gunFark(a, b){
    if(!a || !b) return null;
    return Math.round((new Date(String(a).slice(0,10) + 'T00:00:00') -
                       new Date(String(b).slice(0,10) + 'T00:00:00')) / 86400000);
  }
  var tedarikSuresi = teslimAlindi ? gunFark(o.teslimTarihi, o.tarih) : null;   /* sipariş → teslim */
  var ihtiyacFark   = p ? gunFark(o.teslimTarihi, p.ihtiyacTarihi) : null;      /* teslim − ihtiyaç */

  function val(v){ return (v == null || v === '' || v === '—') ? null : v; }

  /* =================================================================
     PARA — components.md §9b, TEK KONVANSİYON
       o.tutar  = NET (KDV hariç) · o.vergi = KDV · o.toplam = BRÜT (KDV dahil)
       p.tahminiMaliyet = NET · supplierQuotes.fiyat = NET
     Net ve brüt aynı kolonda KARIŞMAZ; her etikette eksen yazılıdır.
     Karşılaştırma ve oranlar yalnız net/net ekseninde yapılır.
     ================================================================= */
  var kur = o.doviz === 'TRY' ? '₺' : o.doviz;

  function para(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="cell-money">' + F.money(v, kur) + '</span>';
  }
  function paraSade(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="u-num">' + F.money(v, kur) + '</span>';
  }
  function paraMetin(v){ return canFinans ? F.money(v, kur) : '••••••'; }

  var finansNot = canFinans ? '' : '<div class="gc-body">' + GV.notice({
    tone:'neutral', icon:'i-lock', title:'Tutarlar gizli',
    text:'Rolünüzde finansal tutar görüntüleme yetkisi yok. Sipariş, teklif ve teslimat bilgileri listelenir, ' +
         'para alanları maskelenir.' }) + '</div>';

  /* Talep tahmini ile sipariş tutarı — ikisi de NET */
  var sapma     = p ? o.tutar - p.tahminiMaliyet : null;
  var sapmaPct  = (p && p.tahminiMaliyet) ? Math.round(sapma / p.tahminiMaliyet * 100) : null;
  /* Tercih edilen teklif ile sipariş tutarı — ikisi de NET */
  var teklifFark = siparisTeklif ? o.tutar - siparisTeklif.fiyat : null;
  var enDusuk    = teklifler.length ? Math.min.apply(null, teklifler.map(function(q){ return q.fiyat; })) : null;
  var maxPuan    = teklifler.length ? Math.max.apply(null, teklifler.map(function(q){ return q.puan; })) : null;
  var uygunsuzSayi = teklifler.filter(function(q){ return !q.teknikUygun; }).length;
  /* KDV oranı sipariş kartında yazılı değil — net ve KDV'den geri hesaplanır */
  var kdvOran = o.tutar ? Math.round(o.vergi / o.tutar * 100) : null;

  /* =================================================================
     YARDIMCILAR
     ================================================================= */
  /* dt yazar tarafından yazılan sabit dizedir (eksen etiketi <span> içerir) →
     escape EDİLMEZ. dd çağıran tarafta esc()'lenerek gelir. */
  function tbl(head, rows){
    return '<div class="gv-tablewrap"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(x){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + x[0] + '</span>' +
        '<span class="gv-summary-val">' + x[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3></div>' + govde + '</div>';
  }
  /* Puan rozeti — TONE sözlüğü sayısal puan tanımaz, ton AÇIKÇA geçilir */
  function puanRozet(v){
    if(v == null) return '<span class="u-faint">—</span>';
    var t = v >= 4.5 ? 'is-ok' : v >= 4 ? 'is-info' : v >= 3.5 ? 'is-warn' : 'is-danger';
    return GV.badge(F.num(v, 1) + ' / 5', t);
  }
  function teslimZaman(){
    if(iptal) return '<span class="u-faint">Sipariş iptal edildi</span>';
    if(iade)  return '<span class="u-faint">Mal tedarikçiye iade edildi</span>';
    if(teslimAlindi){
      return '<b class="u-ok">' + F.date(o.teslimTarihi) + ' tarihinde teslim alındı</b>';
    }
    if(planKalan == null) return '<span class="u-faint">Planlanan teslim tarihi girilmemiş</span>';
    if(planKalan < 0)  return '<b class="u-danger">Planlanan teslim ' + Math.abs(planKalan) + ' gün gecikti</b>';
    if(planKalan === 0) return '<b class="u-danger">Planlanan teslim bugün</b>';
    return '<b class="u-num">Planlanan teslime ' + planKalan + ' gün var</b>';
  }
  function sapmaMetni(){
    if(!p) return null;
    if(!canFinans) return '<span class="cell-mask">••••••</span>';
    if(sapma === 0) return '<span class="badge is-ok no-dot">Tahminle birebir aynı</span>';
    var artı = sapma > 0;
    return '<b class="u-num' + (artı ? ' u-danger' : ' u-ok') + '">' + (artı ? '+' : '−') +
      F.money(Math.abs(sapma), kur) + '</b> <span class="cell-sub">' +
      (artı ? 'tahmini aştı' : 'tahminin altında') + ' · %' + Math.abs(sapmaPct) + '</span>';
  }

  /* =================================================================
     İŞ AKIŞI EYLEMLERİ — şartname §6.1: durum EKRANDA yazılmaz.
     `GV.flow.adimlar('order', kod)` yapılabilir geçişleri verir;
     `GV.flow.gec(...)` TEK mutasyon noktasıdır. Yürütülemeyen adım ölü
     buton bırakılmaz: `disabled` basılır, engelin sebebi `title`a yazılır.
     ================================================================= */
  var AKIS = (GV.flow && GV.flow.adimlar) ? (GV.flow.adimlar('order', o.kod) || []) : [];

  var NEDEN_TURU = { 'İade':'iade', 'İptal Edildi':'iptal', 'Taslak':'geri' };
  function nedenSecenek(hedef){
    var t = NEDEN_TURU[hedef];
    var liste = (DB.reasonCodes || []).filter(function(r){ return !t || (r.tur || []).indexOf(t) !== -1; });
    if(!liste.length) liste = DB.reasonCodes || [];
    return liste.map(function(r){
      return '<option value="' + esc(r.kod) + '">' + esc(r.ad) + '</option>'; }).join('');
  }
  function akisEngeli(s){
    if(!canDuzenle) return 'Kayıt düzenleme yetkiniz yok';
    if(!s.izin) return 'Bu geçiş için yetkiniz yok';
    if(s.eksik && s.eksik.length) return 'Eksik zorunlu alan: ' + s.eksik.join(', ');
    return '';
  }
  /* Motor kuralın etiketini yalnız İLK hedefe verir, kalanlara durum adını
     basar. Bu tek başına yanıltıcı olabiliyor — “Teslim Al” siparişte
     'Kısmi Teslim'e gider, 'Tam Teslim'e değil. Etiket hedeften farklıysa
     hedef düğmenin üstünde AÇIKÇA yazılır. */
  function akisButonlari(){
    if(!AKIS.length) return '';
    return '<div class="gv-state-acts u-mt-8">' + AKIS.map(function(s, i){
      var engel = akisEngeli(s);
      var yazi  = esc(s.etiket) + (s.etiket === s.hedef ? ''
                  : ' <span class="u-faint">→ ' + esc(s.hedef) + '</span>');
      return '<button type="button" class="btn ' + (s.tone || 'btn-acc') + '" data-akis="' + i + '"' +
        (engel ? ' disabled title="' + esc(engel) + '"' : ' title="' + esc('Yeni durum: ' + s.hedef) + '"') +
        '>' + yazi + '</button>';
    }).join(' ') + '</div>';
  }

  /* Teslim ekseni geçişleri siparişin kendi alanlarını da yazar: teslim
     tarihi GERÇEKLEŞEN tarihe döner, teslim kontrolü kalem dökümünden
     türetilir. Bunlar `ek` ile motora verilir — ekran doğrudan yazmaz. */
  function akisEk(hedef){
    if(hedef === 'Tam Teslim')   return { teslimTarihi:DB.today, teslimKontrol:'Tam' };
    if(hedef === 'Kısmi Teslim') return { teslimKontrol:'Eksik' };
    return null;
  }

  function akisCalistir(s){
    var gerekli = !!s.gerekce;
    var tamTeslim = s.hedef === 'Tam Teslim';
    GV.modal({
      title:s.etiket, icon:'i-refresh', size:'sm',
      text:o.kod + ' · “' + o.durum + '” → “' + s.hedef + '”' +
           (tamTeslim ? ' · teslim tarihi bugün (' + F.date(DB.today) + ') yazılır' : ''),
      body:(tamTeslim && eksikKalem.length
        ? GV.notice({ tone:'warn', icon:'i-truck', title:'Eksik kalem kapanacak',
            text:'Eksik gelen ' + eksikKalem.length + ' kalemin kalan ' + F.num(eksikAdet) +
                 ' birimi de teslim alınmış sayılır; kalem dökümü buna göre kapanır.' })
        : '') +
        (gerekli
        ? '<div class="field"><label for="akNeden">Neden kodu<span class="req">*</span></label>' +
          '<select id="akNeden">' + nedenSecenek(s.hedef) + '</select>' +
          '<div class="f-hint">Gerekçe neden KODU + açıklama olarak istenir; serbest metin tek başına raporlanamaz.</div></div>'
        : '') +
        '<div class="field u-mt-4"><label for="akNot">Açıklama' +
        (gerekli ? '<span class="req">*</span>' : '') + '</label>' +
        '<textarea id="akNot" rows="3" placeholder="Bu geçişin nedeni — aktivite geçmişine yazılır"></textarea></div>',
      actions:[{ label:'Vazgeç', cls:'btn-line' },
        { label:s.etiket, cls:s.tone === 'btn-danger-line' ? 'btn-danger' : 'btn-acc',
          onClick:function(close, el){
            var neden = gerekli ? ((el.querySelector('#akNeden') || {}).value || '') : null;
            var not   = String(((el.querySelector('#akNot') || {}).value) || '').trim();
            if(gerekli && (!neden || !not)){
              GV.toast('Neden kodu ve açıklama zorunludur', 'warn'); return false;
            }
            var eskiTeslim = o.teslimTarihi, eskiEksik = eksikAdet;
            var r = GV.flow.gec('order', o.kod, s.hedef, akisEk(s.hedef), { not:not, neden:neden });
            if(!r.ok){
              GV.toast(r.mesaj || (r.eksik ? 'Eksik zorunlu alan: ' + r.eksik.join(', ') : r.why), 'warn');
              return false;
            }
            var saat = DB.today + 'T' + new Date().toTimeString().slice(0,5);
            if(tamTeslim){
              /* 'Tam Teslim' demek her kalemin tamamının geldiği demektir;
                 aksi hâlde kayıt kendi kalem dökümüyle çelişirdi. */
              kalemler.forEach(function(l){ l.teslimAlinan = l.miktar; });
              if(eskiEksik > 0){
                DB.activities.unshift({ kayit:o.kod, tarih:saat, kisi:GV.session.emp,
                  metin:'Eksik kalan ' + F.num(eskiEksik) + ' birim teslim alındı, kalem dökümü kapandı',
                  eski:'Eksik', yeni:'Tam', tone:'ok', icon:'i-truck' });
              }
              DB.activities.unshift({ kayit:o.kod, tarih:saat, kisi:GV.session.emp,
                metin:'Teslim tarihi gerçekleşen tarihe çevrildi (planlanan ' + F.date(eskiTeslim) + ')',
                eski:F.date(eskiTeslim), yeni:F.date(DB.today), tone:'info', icon:'i-calendar' });
            }
            /* Kaynak talep siparişin TESLİM eksenini izler. Ayna da motordan
               geçer; geçiş yasaksa talep olduğu gibi bırakılır, uydurulmaz. */
            if(p && ['Tam Teslim','Kısmi Teslim'].indexOf(s.hedef) !== -1 && p.durum !== s.hedef){
              var rt = GV.flow.gec('purchase', p.kod, s.hedef, null,
                                   { not:o.kod + ' siparişi teslim alındı' });
              if(!rt.ok) GV.toast(p.kod + ' talebi eşitlenemedi: ' + (rt.mesaj || rt.why), 'warn');
            }
            GV.toast(o.kod + ' · ' + r.eski + ' → ' + r.yeni, 'ok');
            setTimeout(function(){ GV.refresh(); }, 400);
          } }]
    });
  }

  /* Başlık aksiyonu — “Teslim alındı işaretle” artık motorun 'Tam Teslim'
     adımıdır; adım yoksa düğme HİÇ basılmaz (ölü buton yasak). */
  var tamAdim = AKIS.filter(function(s){ return s.hedef === 'Tam Teslim'; })[0] || null;
  var teslimAlinabilir = !!tamAdim && !akisEngeli(tamAdim);
  function teslimAl(){ if(tamAdim) akisCalistir(tamAdim); }

  /* =================================================================
     SAYFA BAŞLIĞI — aksiyonların hepsi gerçekten çalışır
     ================================================================= */
  var actions = [
    { label:'Sipariş listesi', icon:'i-truck', href:'app-siparis.html' }
  ];
  if(p) actions.push({ label:'Talep detayı', icon:'i-cart', href:'app-satinalma-detay.html?id=' + p.kod });
  if(s) actions.push({ label:'Tedarikçi', icon:'i-building', href:'app-tedarikci-detay.html?id=' + s.kod });
  if(teslimAlinabilir) actions.push({ label:'Teslim alındı işaretle', icon:'i-check', cls:'btn-acc', run:teslimAl });

  GV.pageHead({
    eyebrow:'Satın Alma', title:'Sipariş Detayı',
    sub:o.kod + ' · ' + tedAd(o.tedarikci) + (p ? ' · ' + p.urun : ''),
    actions:actions
  });

  /* =================================================================
     KAYIT BAŞLIĞI — sipariş kodu + durum rozeti + tedarikçi
     ================================================================= */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + esc(o.kod) + '</span>' +
        GV.badge(o.durum) +
        (val(o.teslimKontrol) ? GV.badge(o.teslimKontrol === 'Tam' ? 'Tam' : o.teslimKontrol,
            o.teslimKontrol === 'Tam' ? 'is-ok' : 'is-warn') : '') +
        (gecikmeGun ? '<span class="badge is-danger">Teslim ' + gecikmeGun + ' gün gecikti</span>' : '') +
        (o.aktif === false ? '<span class="tag">Arşiv</span>' : '') + '</div>' +

          ['Talep durumu', p ? GV.badge(p.durum) : null],
          ['Sipariş durumu', GV.badge(o.durum)]
        ])
      : '<div class="u-mt-4">' + GV.empty({
          icon:'i-stamp', title:'Onay adımı kaydı yok',
          desc:p
            ? p.kod + ' talebinin kartında ' + p.onayAdim + ' / ' + p.onayToplam + ' onay yazılı, ancak zincirin ' +
              'adım kayıtları sisteme işlenmemiş. Sipariş bu onaylar tamamlandıktan sonra açılmıştır.'
            : 'Sipariş bir satın alma talebine bağlı olmadığı için görüntülenecek onay adımı yok.',
          action:'<a class="btn btn-acc" href="app-ayar-onay.html">Onay akışı kurallarına git</a>' }) + '</div>') +
    '</div>';

  /* =================================================================
     5. TESLİMAT — planlanan/gerçekleşen ayrımı + teslim alma aksiyonu
     ================================================================= */
  var teslimDurumNot;
  if(iptal){
    teslimDurumNot = GV.notice({ tone:'neutral', icon:'i-x-circle', title:'Sipariş iptal edildi',
      text:o.kod + ' iptal durumunda; teslimat takibi yapılmıyor.' });
  }else if(iade){
    teslimDurumNot = GV.notice({ tone:'warn', icon:'i-refresh', title:'Sipariş iade durumunda',
      text:o.kod + ' teslim alındıktan sonra tedarikçiye iade edildi; teslimat takibi durdu. ' +
           'Kalan tek adım siparişi kapatmaktır.' });
  }else if(teslimAlindi){
    teslimDurumNot = GV.notice({ tone:'ok', icon:'i-check-circle', title:'Sipariş teslim alındı',
      text:'Gerçekleşen teslim tarihi ' + F.date(o.teslimTarihi) + '. ' +
           (tedarikSuresi == null ? ''
            : tedarikSuresi === 0 ? 'Sipariş ile teslim aynı gün gerçekleşti. '
            : 'Sipariş tarihinden ' + tedarikSuresi + ' gün sonra teslim alındı. ') +
           'Teslim kontrolü: ' + (val(o.teslimKontrol) || 'kaydedilmedi') + '.' });
  }else if(gecikmeGun){
    teslimDurumNot = GV.notice({ tone:'danger', icon:'i-alert', title:'Planlanan teslim tarihi geçti',
      text:'Planlanan teslim ' + F.date(o.teslimTarihi) + ' — bugüne (' + F.date(DB.today) + ') göre ' +
           gecikmeGun + ' gün gecikti. Sipariş hâlâ “' + o.durum + '” durumunda.' });
  }else if(planKalan != null && planKalan <= 3){
    teslimDurumNot = GV.notice({ tone:'warn', icon:'i-hourglass', title:'Teslim tarihi yaklaşıyor',
      text:'Planlanan teslim ' + F.date(o.teslimTarihi) + ' · ' + planKalan + ' gün kaldı. ' +
           'Tedarikçiyle teyitleşilmesi gereken eşik.' });
  }else{
    teslimDurumNot = GV.notice({ tone:'info', icon:'i-truck', title:'Teslim bekleniyor',
      text:'Planlanan teslim ' + F.date(o.teslimTarihi) +
           (planKalan != null ? ' · ' + planKalan + ' gün var.' : '.') +
           ' Bu tarih PLANLANAN teslim tarihidir; teslim alındığında gerçekleşen tarihle değiştirilir.' });
  }

  /* Tek düğme yerine motorun verdiği TÜM adımlar basılır: “Teslim alındı
     işaretle” bu adımlardan yalnız biriydi; kısmi teslim, iade, iptal ve
     kapatma ekranda hiç yoktu ve kayıt o durumlara hiç geçemiyordu. */
  var teslimAksiyon = AKIS.length
    ? '<p class="u-sm u-muted u-mt-8">Durum bu ekrandan elle yazılmaz; aşağıdaki eylemler merkezî ' +
      'geçiş motorundan (şartname §6.1) geçer. Yetkisi olmayan ya da zorunlu alanı eksik olan eylem ' +
      'etkisiz basılır, sebebi düğmenin üstünde yazar.</p>' + akisButonlari()
    : GV.notice({ tone:'neutral', icon:'i-lock', title:'Bu durumdan yapılabilecek geçiş yok',
        text:'“' + o.durum + '” geçiş tablosunda uç durumdur; sipariş üzerinde durum değiştiren bir ' +
             'eylem kalmadı.' });

  /* ---- Kalem dökümü · eksik teslim (§17) --------------------------------
     Eksik miktar tabloda HESAPLANIR; veride "eksik" diye bir alan yoktur. */
  function kalemBlok(){
    if(!kalemler.length){
      return GV.notice({ tone:'warn', icon:'i-alert', title:'Bu siparişin kalem dökümü yok',
        text:'Sipariş ' + paraMetin(o.tutar) + ' (KDV hariç) tutarında ama kalem kaydı bulunmuyor; ' +
             'eksik teslim ve iade kalem düzeyinde izlenemiyor.' });
    }
    var tutarNot = kalemNet === o.tutar
      ? GV.notice({ tone:'ok', icon:'i-check-circle', title:'Kalem toplamı sipariş netiyle uyuşuyor',
          text:kalemler.length + ' kalemin toplamı ' + paraMetin(kalemNet) + ' — siparişin net tutarına ' +
               '(' + paraMetin(o.tutar) + ') eşit. Sipariş neti kalemlerden türer, ayrı yazılmaz.' })
      : GV.notice({ tone:'danger', icon:'i-alert', title:'Kalem toplamı sipariş netiyle uyuşmuyor',
          text:'Kalemlerin toplamı ' + paraMetin(kalemNet) + ', siparişin neti ' + paraMetin(o.tutar) +
               '. Aradaki fark ' + paraMetin(Math.abs(kalemNet - o.tutar)) + ' — veri düzeltmesi gerekir.' });

    var kontrolNot = (turemisKontrol && val(o.teslimKontrol) && turemisKontrol !== o.teslimKontrol)
      ? GV.notice({ tone:'danger', icon:'i-alert', title:'Teslim kontrolü kalemlerle çelişiyor',
          text:'Kayıtta “' + o.teslimKontrol + '” yazılı ama kalemlerden türeyen sonuç “' + turemisKontrol + '”.' })
      : '';

    var eksikNot = eksikKalem.length
      ? GV.notice({ tone:'warn', icon:'i-truck', title:'Eksik teslim var',
          text:kalemler.length + ' kalemin ' + eksikKalem.length + ' tanesi eksik geldi · toplam ' +
               F.num(eksikAdet) + ' birim bekleniyor. Sipariş bu yüzden “' + o.durum + '” durumunda kalır; ' +
               'kalan kalemler gelmeden teslim alındı işaretlenmez.' })
      : '';

    return '<div class="u-mt-8">' + tutarNot + kontrolNot + eksikNot + '</div>' +
      '</div><div class="gc-body flush">' +
      tbl('<th class="num th-narrow">#</th><th>Ürün</th><th class="num">Sipariş</th>' +
          '<th class="num">Teslim alınan</th><th class="num">Eksik</th>' +
          '<th class="num">Birim fiyat</th><th class="num">Tutar (KDV hariç)</th><th>Durum</th>',
        kalemler.map(function(l, i){
          var eksik = l.miktar - l.teslimAlinan;
          return '<tr>' +
            '<td class="num"><span class="u-num">' + (i + 1) + '</span></td>' +
            '<td class="cell-wrap"><span class="cell-main">' + esc(l.urun) + '</span>' +
              (l.aciklama ? '<span class="cell-sub">' + esc(l.aciklama) + '</span>' : '') + '</td>' +
            '<td class="num"><span class="u-num">' + F.num(l.miktar) + '</span>' +
              '<span class="cell-sub">' + esc(l.birim) + '</span></td>' +
            '<td class="num"><span class="u-num">' + F.num(l.teslimAlinan) + '</span></td>' +
            '<td class="num">' + (eksik > 0 ? '<b class="u-danger u-num">' + F.num(eksik) + '</b>'
                                            : '<span class="u-faint">—</span>') + '</td>' +
            '<td class="num">' + para(l.birimFiyat) + '</td>' +
            '<td class="num">' + para(l.miktar * l.birimFiyat) + '</td>' +
            '<td>' + (eksik > 0 ? GV.badge('Eksik') : GV.badge('Tam')) + '</td></tr>';
        }).join('') +
        '<tr class="is-total"><td class="num"></td><td><b>Toplam</b></td>' +
          '<td class="num"><b class="u-num">' + F.num(siparilenAdet) + '</b></td>' +
          '<td class="num"><b class="u-num">' + F.num(teslimAdet) + '</b></td>' +
          '<td class="num">' + (eksikAdet > 0 ? '<b class="u-danger u-num">' + F.num(eksikAdet) + '</b>'
                                              : '<span class="u-faint">—</span>') + '</td>' +
          '<td class="num"></td><td class="num">' + para(kalemNet) + '</td><td></td></tr>') +
      sayac('<b>' + kalemler.length + '</b> kalem · ' + F.num(teslimAdet) + ' / ' + F.num(siparilenAdet) +
            ' birim teslim alındı' + (eksikAdet ? ' · <b>' + F.num(eksikAdet) + '</b> birim eksik' : '')) +
      '</div><div class="gc-body">';
  }

  /* ---- İadeler (§17) ---- */
  function iadeBlok(){
    if(!kalemler.length) return '';
    if(!iadeler.length){
      return '<div class="u-mt-8">' + GV.notice({ tone:'neutral', icon:'i-info', title:'İade kaydı yok',
        text:'Bu siparişin hiçbir kalemi tedarikçiye iade edilmedi.' }) + '</div>';
    }
    return '<div class="u-mt-8">' + GV.notice({ tone:'warn', icon:'i-refresh',
        title:iadeler.length + ' iade kaydı var',
        text:'Toplam ' + F.num(iadeAdet) + ' birim tedarikçiye iade edildi. İade, teslim alınmış miktarı ' +
             'geri götürmez — teslim gerçekleşmiştir, mal ayrıca iade edilmiştir; iki eksen ayrı tutulur.' }) +
      '</div></div><div class="gc-body flush">' +
      tbl('<th>İade no</th><th>Kalem</th><th class="num">Miktar</th><th>İade tarihi</th>' +
          '<th>Neden</th><th>Çözüm</th><th>Kaydeden</th><th>Durum</th>',
        iadeler.map(function(r){
          var l = kalemler.filter(function(x){ return x.kod === r.kalem; })[0];
          return '<tr>' +
            '<td><span class="cell-code">' + esc(r.kod) + '</span></td>' +
            '<td class="cell-wrap"><span class="cell-main">' + esc(l ? l.urun : r.kalem) + '</span></td>' +
            '<td class="num"><span class="u-num">' + F.num(r.miktar) + '</span>' +
              '<span class="cell-sub">' + esc(r.birim) + '</span></td>' +
            '<td>' + GV.dateCell(r.tarih, { done:true }) + '</td>' +
            '<td class="cell-wrap">' + esc(r.neden) + '</td>' +
            '<td class="cell-wrap">' + esc(r.cozum) + '</td>' +
            '<td>' + GV.user(r.kaydeden, { sm:true }) + '</td>' +
            '<td>' + GV.badge(r.durum) + '</td></tr>';
        }).join('')) +
      sayac('<b>' + iadeler.length + '</b> iade kaydı · ' + F.num(iadeAdet) + ' birim') +
      '</div><div class="gc-body">';
  }

  var pTeslimat = '<div class="gc-body">' + teslimDurumNot + teslimNotu +
    GV.dl([
      ['Sipariş durumu', GV.badge(o.durum)],
      ['Sipariş tarihi', '<span class="cell-date">' + F.date(o.tarih) + '</span>'],
      [teslimEtiket, GV.dateCell(o.teslimTarihi, { done:teslimAlindi }) +
        '<span class="cell-sub">' + (teslimAlindi ? 'gerçekleşen tarih' : F.rel(o.teslimTarihi)) + '</span>'],
      ['Tarihin niteliği', teslimAlindi
        ? '<span class="badge is-ok no-dot">Gerçekleşen</span>'
        : '<span class="badge is-info no-dot">Planlanan</span>'],
      ['Gecikme <span class="u-faint">(bugün ' + F.date(DB.today) + ')</span>',
        teslimAlindi
          ? '<span class="u-faint">Teslim alındı — planlanan tarih kaydı korunmuyor</span>'
          : (gecikmeGun ? '<b class="u-danger u-num">' + gecikmeGun + ' gün</b>'
                        : '<span class="badge is-ok no-dot">Gecikme yok</span>')],
      ['Tedarik süresi <span class="u-faint">(sipariş → teslim)</span>',
        tedarikSuresi == null ? null
          : tedarikSuresi === 0 ? '<b class="u-num">Aynı gün</b>'
          : '<b class="u-num">' + tedarikSuresi + '</b> gün'],
      ['Teslim kontrolü', val(o.teslimKontrol)
        ? GV.badge(o.teslimKontrol, o.teslimKontrol === 'Tam' ? 'is-ok' : 'is-warn')
        : '<span class="u-faint">Teslim kontrolü yapılmadı</span>'],
      ['İrsaliye no', val(o.irsaliye) ? '<span class="u-num">' + esc(o.irsaliye) + '</span>'
        : '<span class="u-faint">İrsaliye kaydedilmedi</span>'],
      ['Tedarikçi fatura no', val(o.fatura) ? '<span class="u-num">' + esc(o.fatura) + '</span>'
        : '<span class="u-faint">Fatura kaydedilmedi</span>'],
      ['Sipariş miktarı', p ? '<b class="u-num">' + F.num(p.miktar) + '</b> adet' : null],
      ['İhtiyaç tarihi <span class="u-faint">(talepten)</span>',
        p ? GV.dateCell(p.ihtiyacTarihi, { done:teslimAlindi }) : null],
      ['İhtiyaç tarihine göre teslim', ihtiyacFark == null ? null
        : teslimAlindi
          ? (ihtiyacFark > 0 ? '<b class="u-danger">İhtiyaç tarihinden ' + ihtiyacFark + ' gün sonra teslim alındı</b>'
             : ihtiyacFark === 0 ? '<b class="u-ok">İhtiyaç tarihinde teslim alındı</b>'
             : '<b class="u-ok">İhtiyaç tarihinden ' + Math.abs(ihtiyacFark) + ' gün önce teslim alındı</b>')
          : (ihtiyacFark > 0 ? '<b class="u-danger">Planlanan teslim ihtiyaç tarihinden ' + ihtiyacFark + ' gün sonra</b>'
             : ihtiyacFark === 0 ? '<b class="u-ok">Planlanan teslim ihtiyaç tarihinde</b>'
             : '<b class="u-ok">Planlanan teslim ihtiyaç tarihinden ' + Math.abs(ihtiyacFark) + ' gün önce</b>')]
    ]) +
    kalemBlok() + iadeBlok() +
    (!canDuzenle && AKIS.length ? GV.notice({ tone:'neutral', icon:'i-lock',
      title:'Durum değiştirme yetkiniz yok',
      text:'Bu siparişte yapılabilecek geçişler var, ancak rolünüzde kayıt düzenleme yetkisi tanımlı ' +
           'değil. Teslimat bilgilerini görüntüleyebilirsiniz.' }) : '') +
    teslimAksiyon +
    '</div>';

  /* =================================================================
     6. DEMİRBAŞA AKTARIM — DB.assets içinde sipariş bağı aranır
        (bağ alanı veride yoksa uydurulmaz; boş durum + açık not basılır)
     ================================================================= */
  var pDemirbas;
  /* Araç bloğu — filo modülü demirbaştan ayrıdır, kolon seti de farklıdır
     (plaka · mülkiyet · km). Bağ `DB.vehicles[].siparis` alanında YAZILI. */
  var pAracBlok = !araclar.length ? '' :
    '<div class="gc-body flush">' +
      tbl('<th>Araç</th><th>Plaka</th><th>Marka / model</th><th>Mülkiyet</th>' +
          '<th>Alış tarihi</th><th class="num">Alış bedeli (KDV hariç)</th>' +
          '<th>Kullanım</th><th>Ana sürücü</th><th>Durum</th>',
        araclar.map(function(v){
          return '<tr>' +
            '<td class="cell-wrap"><a class="cell-main" href="app-arac-detay.html?id=' + esc(v.kod) + '">' +
              esc(v.kod) + '</a><span class="cell-code">' + esc(v.tip || '') + '</span></td>' +
            '<td><span class="u-num">' + esc(v.plaka) + '</span></td>' +
            '<td class="cell-wrap"><span class="cell-main">' + esc(v.marka + ' ' + v.model) + '</span>' +
              '<span class="cell-sub">' + esc(String(v.modelYili || '') + ' · ' + (v.yakit || '')) + '</span></td>' +
            '<td>' + esc(v.mulkiyet) + '</td>' +
            '<td><span class="cell-date">' + F.date(v.alisTarihi) + '</span></td>' +
            '<td class="num">' + para(v.alisBedeli) + '</td>' +
            '<td>' + esc(v.kullanim || '—') + '</td>' +
            '<td>' + (v.anaSurucu ? GV.user(v.anaSurucu, { sm:true }) : '<span class="u-faint">Tahsis yok</span>') + '</td>' +
            '<td>' + GV.badge(v.durum) + '</td></tr>';
        }).join('')) +
      sayac('<b>' + araclar.length + '</b> araç bu siparişten filoya alındı ' +
        '<span class="u-faint">— bağ araç kartındaki sipariş alanında yazılı</span>',
        '<a class="btn btn-line btn-sm" href="app-arac.html">' + ico('i-truck','ic-sm') +
        ' Araç listesi</a>') +
    '</div>';
  if(varliklar.length || araclar.length){
    pDemirbas = (!varliklar.length ? '' : '<div class="gc-body flush">' +
      tbl('<th>Demirbaş</th><th>Kategori</th><th>Marka / model</th><th>Seri no</th>' +
          '<th>Alış tarihi</th><th class="num">Alış fiyatı (KDV hariç)</th><th>Lokasyon</th>' +
          '<th>Zimmetli</th><th>Durum</th>',
        varliklar.map(function(a){
          return '<tr>' +
            '<td class="cell-wrap"><a class="cell-main" href="app-demirbas-detay.html?id=' + esc(a.kod) + '">' +
              esc(a.kod) + '</a><span class="cell-code">' + esc(a.barkod || '') + '</span></td>' +
            '<td>' + esc(a.kategori) + '<span class="cell-code">' + esc(a.altKategori || '') + '</span></td>' +
            '<td class="cell-wrap"><span class="cell-main">' + esc(a.marka + ' ' + a.model) + '</span>' +
              '<span class="cell-sub">' + esc(a.ozellik || '') + '</span></td>' +
            '<td><span class="u-num">' + esc(a.seri || '—') + '</span></td>' +
            '<td><span class="cell-date">' + F.date(a.alisTarihi) + '</span></td>' +
            '<td class="num">' + para(a.alisFiyati) + '</td>' +
            '<td>' + esc(a.lokasyon || '—') + '</td>' +
            '<td>' + (a.zimmetli ? GV.user(a.zimmetli, { sm:true }) : '<span class="u-faint">Zimmetsiz</span>') + '</td>' +
            '<td>' + GV.badge(a.durum) + '</td></tr>';
        }).join('')) +
      sayac('<b>' + varliklar.length + '</b> demirbaş bu siparişten envantere alındı',
        '<a class="btn btn-line btn-sm" href="app-demirbas.html">' + ico('i-package','ic-sm') +
        ' Demirbaş listesi</a>') +
      '</div>') + pAracBlok;
  }else{
    pDemirbas = '<div class="gc-body">' + GV.notice({
      tone:teslimAlindi ? 'warn' : 'info',
      icon:teslimAlindi ? 'i-alert' : 'i-truck',
      title:teslimAlindi
        ? 'Bu siparişten envantere alınan demirbaş ya da araç yok'
        : 'Sipariş henüz teslim alınmadı',
      text:(teslimAlindi
        ? 'Sipariş teslim alınmış ancak hiçbir demirbaş kartı bu siparişe bağlanmamış. ' +
          'Kredi paketi, abonelik ve sarf malzemesi siparişleri envanter kaydı doğurmaz; ' +
          'ekipman siparişlerinde bu boşluk eksik envanter girişi anlamına gelir.'
        : 'Demirbaş kartı yalnız teslim alınmış siparişten doğar. Bu sipariş "' + esc(o.durum) +
          '" durumunda, bu yüzden envanter kaydı da beklenmiyor.') +
        (tedarikciVarliklari.length
          ? ' Aşağıda yalnız aynı tedarikçinin demirbaşları bağlam olarak listelenir; bu liste sipariş bağı değildir.'
          : ' Bu siparişin tedarikçisine (' + esc(tedAd(o.tedarikci)) + ') ait kayıtlı demirbaş da yok.') }) +
      '</div>' +
      '<div class="gc-body flush">' + GV.empty({
        icon:'i-package', title:'Bu siparişe bağlı envanter kaydı yok',
        desc:'Ne demirbaş ne de araç kartlarındaki sipariş alanında bu sipariş numarasını ' +
             'gösteren kayıt bulunamadı. Teslim alınan ekipman envantere, araç ise filoya ' +
             'girildiğinde kart bu alanla siparişe bağlanır.',
        action:'<a class="btn btn-acc" href="app-demirbas.html">Demirbaş listesine git</a>' }) + '</div>' +
      (tedarikciVarliklari.length
        ? '<div class="gc-body flush">' +
          tbl('<th>Demirbaş</th><th>Kategori</th><th>Marka / model</th><th>Alış tarihi</th>' +
              '<th class="num">Alış fiyatı (KDV hariç)</th><th>Durum</th>',
            tedarikciVarliklari.map(function(a){
              return '<tr>' +
                '<td class="cell-wrap"><a class="cell-main" href="app-demirbas-detay.html?id=' + esc(a.kod) + '">' +
                  esc(a.kod) + '</a><span class="cell-code">' + esc(a.barkod || '') + '</span></td>' +
                '<td>' + esc(a.kategori) + '</td>' +
                '<td class="cell-wrap"><span class="cell-main">' + esc(a.marka + ' ' + a.model) + '</span></td>' +
                '<td><span class="cell-date">' + F.date(a.alisTarihi) + '</span></td>' +
                '<td class="num">' + para(a.alisFiyati) + '</td>' +
                '<td>' + GV.badge(a.durum) + '</td></tr>';
            }).join('')) +
          sayac('<b>' + tedarikciVarliklari.length + '</b> demirbaş ' + esc(tedAd(o.tedarikci)) +
            ' tedarikçisinden alınmış <span class="u-faint">— bu sipariş bağı değildir, yalnız tedarikçi eşleşmesidir</span>',
            '<a class="btn btn-line btn-sm" href="app-tedarikci-detay.html?id=' + esc(o.tedarikci) + '">' +
            ico('i-building','ic-sm') + ' Tedarikçi kartı</a>') +
          '</div>'
        : '');
  }

  /* =================================================================
     7. AKTİVİTE GEÇMİŞİ
     ================================================================= */
  var pAktivite = '<div class="gc-body">' +
    (acts.length ? GV.activity(acts)
      : GV.empty({ icon:'i-activity', title:'Bu siparişte kayıtlı hareket yok',
          desc:'Sipariş üzerinde yapılan durum, teslim tarihi ve teslim kontrolü değişiklikleri burada ' +
               'listelenir. Kaynak talebin hareketleri talep kartında tutulur.',
          action:p ? '<a class="btn btn-line" href="app-satinalma-detay.html?id=' + p.kod + '">Talep detayına git</a>'
                   : '<a class="btn btn-line" href="app-siparis.html">Sipariş listesine dön</a>' })) +
    (talepActs.length
      ? sec('Kaynak Talebin Hareketleri · ' + p.kod, GV.activity(talepActs))
      : '') +
    '</div>';

  var panels = {
    genel:pGenel, talep:pTalep, teklif:pTeklif, onay:pOnay,
    teslimat:pTeslimat, demirbas:pDemirbas, aktivite:pAktivite
  };

  /* =================================================================
     SAĞ ÖZET PANELİ
     ================================================================= */
  var aside =
    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-info') + 'Özet</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Sipariş no', '<span class="u-num">' + esc(o.kod) + '</span>'],
      ['Durum', GV.badge(o.durum)],
      ['Tedarikçi', s
        ? '<a href="app-tedarikci-detay.html?id=' + esc(s.kod) + '">' + esc(s.unvan) + '</a>'
        : esc(o.tedarikci || '—')],
      ['Kaynak talep', p
        ? '<a href="app-satinalma-detay.html?id=' + esc(p.kod) + '">' + esc(p.kod) + '</a>'
        : '<span class="u-faint">Talebe bağlı değil</span>'],
      ['Sipariş tarihi', '<span class="cell-date">' + F.date(o.tarih) + '</span>'],
      [teslimEtiket, GV.dateCell(o.teslimTarihi, { done:teslimAlindi }) +
        ' <span class="cell-sub">' + teslimEksen + '</span>'],
      ['Net tutar <span class="u-faint">(KDV hariç)</span>', para(o.tutar)],
      ['KDV', paraSade(o.vergi)],
      ['Brüt toplam <span class="u-faint">(KDV dahil)</span>', '<b>' + para(o.toplam) + '</b>'],
      ['Teslim kontrolü', val(o.teslimKontrol)
        ? GV.badge(o.teslimKontrol, o.teslimKontrol === 'Tam' ? 'is-ok' : 'is-warn')
        : '<span class="u-faint">Yapılmadı</span>'],
      ['İrsaliye', val(o.irsaliye) ? '<span class="u-num">' + esc(o.irsaliye) + '</span>'
        : '<span class="u-faint">—</span>'],
      ['Fatura no', val(o.fatura) ? '<span class="u-num">' + esc(o.fatura) + '</span>'
        : '<span class="u-faint">—</span>']
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-truck') + 'Teslimat Durumu</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Tarihin niteliği', teslimAlindi
        ? '<span class="badge is-ok no-dot">Gerçekleşen</span>'
        : '<span class="badge is-info no-dot">Planlanan</span>'],
      ['Zamanlama', teslimZaman()],
      ['Tedarik süresi', tedarikSuresi == null ? '<span class="u-faint">Teslim alınmadı</span>'
        : tedarikSuresi === 0 ? '<b class="u-num">Aynı gün</b>'
        : '<b class="u-num">' + tedarikSuresi + '</b> gün'],
      p ? ['İhtiyaç tarihi', GV.dateCell(p.ihtiyacTarihi, { done:teslimAlindi })] : null,
      p ? ['Miktar', '<b class="u-num">' + F.num(p.miktar) + '</b> adet'] : null,
      ['Envanter kaydı', varliklar.length
        ? '<b class="u-num">' + varliklar.length + '</b> demirbaş'
        : '<span class="u-faint">Bağlı demirbaş yok</span>']
    ]) + '</div></section>' +

    (p
      ? '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-cart') + 'Kaynak Talep</h2></div>' +
        '<div class="gc-body">' + ozetListe([
          ['Talep', '<a href="app-satinalma-detay.html?id=' + esc(p.kod) + '">' + esc(p.kod) + '</a>'],
          ['Talep eden', GV.user(p.talepEden, { sm:true })],
          ['Departman', esc(DB.depName(p.dep))],
          ['Öncelik', GV.pri(p.oncelik)],
          ['Talep durumu', GV.badge(p.durum)],
          ['Tahmini maliyet <span class="u-faint">(KDV hariç)</span>', para(p.tahminiMaliyet)],
          ['Sipariş tutarı <span class="u-faint">(KDV hariç)</span>', para(o.tutar)],
          ['Sapma <span class="u-faint">(net / net)</span>', sapmaMetni()],
          ['Bütçe kodu', '<span class="u-num">' + esc(p.butceKodu) + '</span>']
        ]) + '</div></section>'
      : '') +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-quote') + 'Tedarik Kararı</h2></div>' +
    '<div class="gc-body">' + ozetListe([
      ['Toplanan teklif', '<b class="u-num">' + teklifler.length + '</b>'],
      enDusuk != null ? ['En düşük teklif <span class="u-faint">(KDV hariç)</span>', para(enDusuk)] : null,
      siparisTeklif ? ['Siparişin teklifi <span class="u-faint">(KDV hariç)</span>', para(siparisTeklif.fiyat)] : null,
      siparisTeklif ? ['Teklif puanı', puanRozet(siparisTeklif.puan)] : null,
      s ? ['Tedarikçi genel puanı', puanRozet(s.puan)] : null,
      s ? ['Ödeme vadesi', esc(s.odemeVadesi)] : null,
      ['Onay adımı', adimlar.length
        ? '<b class="u-num">' + adimlar.filter(function(a){ return a.durum === 'Onaylandı'; }).length +
          ' / ' + adimlar.length + '</b>'
        : '<span class="u-faint">Adım kaydı yok</span>']
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3))
      : '<p class="u-sm u-faint">Bu sipariş kartında henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =================================================================
     AKSİYONLAR — her render'da taze düğüme bağlanır (GV.refresh sonrası
     dinleyici birikmesin diye mount üzerinde delege edilmez)
     ================================================================= */
  Array.prototype.forEach.call(mount.querySelectorAll('[data-akis]'), function(b){
    b.addEventListener('click', function(){
      var s = AKIS[+b.getAttribute('data-akis')];
      if(s) akisCalistir(s);
    });
  });
});
</script>
</body>
</html>
