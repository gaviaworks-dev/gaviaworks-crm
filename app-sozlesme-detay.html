<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sözleşme Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="finans" data-screen="sozlesme">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');
  var canFinans = GV.perm.can('finans');

  var id = new URLSearchParams(location.search).get('id') || (DB.contracts[0] || {}).kod;
  var c  = DB.contracts.filter(function(x){ return x.kod === id; })[0];

  /* ---- Kayıt yok: listeye dönüş aksiyonlu boş durum ---- */
  if(!c){
    GV.pageHead({ eyebrow:'Finans', title:'Sözleşme Detayı', sub:'Kayıt bulunamadı',
      actions:[{ label:'Sözleşme listesi', icon:'i-list', href:'app-sozlesme.html' }] });
    mount.innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-alert-circle', title:'Sözleşme bulunamadı',
      desc:'“' + esc(id || '') + '” numaralı sözleşme sistemde yok. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-sozlesme.html">Sözleşme listesine dön</a>' }) + '</div>';
    return;
  }

  GV.shell.crumb(c.kod);
  document.title = c.kod + ' — Sözleşme — GaviaWorks CRM';

  /* =================================================================
     İLİŞKİLİ KAYITLAR — hepsi veride yazılı tekil bağdan türetilir
     ================================================================= */
  var musteri  = c.musteri ? DB.customers.filter(function(m){ return m.kod === c.musteri; })[0] : null;
  var teklif   = c.teklif ? DB.quotes.filter(function(q){ return q.kod === c.teklif; })[0] : null;
  var proje    = c.proje ? DB.proj(c.proje) : null;

  /* Taksitler: milestone.sozlesme → bu sözleşme (1 tabanlı `taksit` sırasına göre) */
  var taksitler = DB.milestones.filter(function(m){ return m.sozlesme === c.kod; })
                               .sort(function(a,b){ return a.taksit - b.taksit; });
  var taksitKod = taksitler.map(function(m){ return m.kod; });

  /* Faturalar: doğrudan sözleşmeye bağlı olanlar + bu sözleşmenin taksitine bağlı olanlar */
  var faturalar = DB.invoices.filter(function(i){
    return i.sozlesme === c.kod || (i.milestone && taksitKod.indexOf(i.milestone) !== -1);
  }).sort(function(a,b){ return String(a.tarih).localeCompare(String(b.tarih)); });
  var faturaKod = faturalar.map(function(i){ return i.kod; });

  /* Tahsilatlar: bu sözleşmenin faturalarına bağlı olanlar */
  var tahsilatlar = DB.payments.filter(function(t){ return faturaKod.indexOf(t.fatura) !== -1; })
                               .sort(function(a,b){ return String(a.vade).localeCompare(String(b.vade)); });

  /* Teslimler: bağlı projenin teslimleri — taksit bağı `milestone` alanında YAZILI (L-13) */
  var teslimler = proje ? DB.deliveries.filter(function(d){ return d.proje === proje.kod; })
                                       .sort(function(a,b){ return String(a.tarih).localeCompare(String(b.tarih)); }) : [];

  var acts = DB.activities.filter(function(a){ return a.kayit === c.kod; });

  function faturaOf(msKod){ return faturalar.filter(function(i){ return i.milestone === msKod; })[0] || null; }
  function tahsilatOf(ftrKod){ return tahsilatlar.filter(function(t){ return t.fatura === ftrKod; })[0] || null; }
  function faturaByKod(k){ return faturalar.filter(function(i){ return i.kod === k; })[0] || null; }
  function taksitByKod(k){ return taksitler.filter(function(m){ return m.kod === k; })[0] || null; }

  /* =================================================================
     PARA — components.md §9b, TEK KONVANSİYON
       c.tutar   = NET (KDV hariç)   · c.kdv = KDV   · c.toplam = BRÜT (KDV dahil)
       milestone.odeme = NET · invoice.tutar/vergi/toplam = net/KDV/brüt
       payment.tutar   = BRÜT
     Net ve brüt aynı kolonda KARIŞMAZ; her etikette eksen yazılıdır.
     ================================================================= */
  var kur = c.doviz === 'TRY' ? '₺' : c.doviz;

  var taksitNet   = taksitler.reduce(function(s,m){ return s + (m.odeme || 0); }, 0);          /* NET */
  var faturaNet   = faturalar.reduce(function(s,i){ return s + (i.tutar || 0); }, 0);          /* NET */
  var faturaKdv   = faturalar.reduce(function(s,i){ return s + (i.vergi || 0); }, 0);          /* KDV */
  var faturaBrut  = faturalar.reduce(function(s,i){ return s + (i.toplam || 0); }, 0);         /* BRÜT */
  var tahsilBrut  = tahsilatlar.filter(function(t){ return t.durum === 'Ödendi'; })
                               .reduce(function(s,t){ return s + (t.tutar || 0); }, 0);        /* BRÜT */
  var acikBrut    = tahsilatlar.filter(function(t){ return t.durum !== 'Ödendi'; })
                               .reduce(function(s,t){ return s + (t.tutar || 0); }, 0);        /* BRÜT */
  var kalanAlacak = faturaBrut - tahsilBrut;                                                   /* BRÜT */
  var kalanNet    = (c.tutar || 0) - faturaNet;                                                /* NET  */

  /* Oranlar da kendi ekseninde: faturalanan NET/NET, tahsil edilen BRÜT/BRÜT */
  var faturaOran = c.tutar ? Math.round(faturaNet / c.tutar * 100) : 0;
  var tahsilOran = c.toplam ? Math.round(tahsilBrut / c.toplam * 100) : 0;

  function para(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="cell-money">' + F.money(v, kur) + '</span>';
  }
  function paraSade(v){
    if(!canFinans) return '<span class="cell-mask" title="Bu alanı görüntüleme yetkiniz yok">••••••</span>';
    return '<span class="u-num">' + F.money(v, kur) + '</span>';
  }
  var finansNot = canFinans ? '' : '<div class="gc-body">' + GV.notice({
    tone:'neutral', icon:'i-lock', title:'Tutarlar gizli',
    text:'Rolünüzde finansal tutar görüntüleme yetkisi yok. Kayıtlar listelenir, para alanları maskelenir.' }) + '</div>';

  /* =================================================================
     SÜRE — referans DB.today (new Date() ile bugün alınmaz)
     ================================================================= */
  var bitmis    = c.durum === 'Tamamlandı' || c.durum === 'İptal';
  var kalanGun  = c.bitis ? F.days(c.bitis) : null;
  var suresiDoldu = !bitmis && kalanGun != null && kalanGun < 0;
  var toplamGun = (c.baslangic && c.bitis)
    ? Math.round((new Date(c.bitis + 'T00:00:00') - new Date(c.baslangic + 'T00:00:00')) / 86400000) : null;
  var gecenGun  = (c.baslangic && toplamGun != null) ? (toplamGun - (kalanGun == null ? 0 : kalanGun)) : null;
  var sureOran  = (toplamGun && gecenGun != null) ? Math.max(0, Math.min(100, Math.round(gecenGun / toplamGun * 100))) : null;

  /* Yenileme eşikleri — 60 / 30 / 15 / 7 gün */
  function esik(gun){
    if(gun == null) return null;
    if(gun < 0)   return { tone:'danger', lbl:'Süresi doldu' };
    if(gun <= 7)  return { tone:'danger', lbl:'7 günden az kaldı' };
    if(gun <= 15) return { tone:'warn',   lbl:'15 günden az kaldı' };
    if(gun <= 30) return { tone:'warn',   lbl:'30 günden az kaldı' };
    if(gun <= 60) return { tone:'info',   lbl:'60 günden az kaldı' };
    return { tone:'ok', lbl:'Süre rahat' };
  }
  var bitisEsik = bitmis ? null : esik(kalanGun);

  function kalanMetin(gun){
    if(gun == null) return '<span class="u-faint">—</span>';
    if(gun < 0)   return '<b class="u-danger">' + Math.abs(gun) + ' gün önce doldu</b>';
    if(gun === 0) return '<b class="u-danger">Bugün son gün</b>';
    return '<b class="u-num">' + gun + ' gün kaldı</b>';
  }

  var yenilemeGun = c.yenileme && c.yenilemeTarihi ? F.days(c.yenilemeTarihi) : null;
  /* Yenilenebilirlik: yenilemeye açık ve iptal edilmemiş sözleşme */
  var yenilenebilir = c.yenileme === true && c.durum !== 'İptal';

  /* =================================================================
     YARDIMCILAR
     ================================================================= */
  /* dt metinleri yazar tarafından yazılan sabit dizelerdir (eksen etiketi için
     <span class="u-faint"> içerir) — bu yüzden dt escape EDİLMEZ, dd zaten
     çağıran tarafta esc()'lenerek gelir. */
  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(Boolean).map(function(p){
      var bos = p[1] == null || p[1] === '';
      return '<div><dt>' + p[0] + '</dt><dd' + (bos ? ' class="is-empty"' : '') + '>' +
        (bos ? '—' : p[1]) + '</dd></div>';
    }).join('') + '</dl>';
  }
  function tbl(head, rows){
    return '<div class="gv-tablewrap is-mobilescroll"><table class="gtable"><thead><tr>' +
      head + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function sayac(text, aksiyon){
    return '<div class="gc-foot"><span class="gv-count">' + text + '</span>' + (aksiyon || '') + '</div>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sec(baslik, govde){
    return '<div class="gv-form-sec"><div class="gv-form-sec-head"><h3>' + esc(baslik) + '</h3></div>' + govde + '</div>';
  }

  /* =================================================================
     SAYFA BAŞLIĞI — aksiyonların hepsi gerçekten çalışır
     ================================================================= */
  function yilEkle(iso){ return iso ? (Number(String(iso).slice(0,4)) + 1) + String(iso).slice(4) : iso; }

  function yenilemeAkisi(){
    GV.confirm({
      title:'Sözleşmeyi yenile',
      text:c.kod + ' bitiş tarihi ' + F.date(c.bitis) + ' → ' + F.date(yilEkle(c.bitis)) +
           ' olarak bir yıl uzatılacak ve durum Aktif yapılacak.',
      okLabel:'Yenile'
    }).then(function(ok){
      if(!ok) return;
      var eskiBitis = c.bitis, eskiDurum = c.durum;
      c.bitis = yilEkle(c.bitis);
      if(c.yenilemeTarihi) c.yenilemeTarihi = yilEkle(c.yenilemeTarihi);
      c.durum = 'Aktif';
      DB.activities.unshift({ kayit:c.kod, tarih:DB.today + 'T' + new Date().toTimeString().slice(0,5),
        kisi:GV.session.emp, metin:'Sözleşme bir yıl yenilendi (durum: ' + eskiDurum + ' → Aktif)',
        eski:eskiBitis, yeni:c.bitis, tone:'ok', icon:'i-refresh' });
      GV.toast(c.kod + ' bir yıl yenilendi', 'ok');
      setTimeout(function(){ GV.refresh(); }, 700);
    });
  }

  var actions = [
    { label:'Sözleşme listesi', icon:'i-list', href:'app-sozlesme.html' },
    { label:'Ödeme planı', icon:'i-milestone', href:'app-odemeplani.html' }
  ];
  /* "Yenile" yalnız düzenleme yetkisi VARSA ve sözleşme gerçekten yenilenebilirse basılır */
  if(GV.perm.can('duzenle') && yenilenebilir){
    actions.push({ label:'Yenile', icon:'i-refresh', cls:'btn-acc', run:yenilemeAkisi });
  }

  GV.pageHead({
    eyebrow:'Finans', title:'Sözleşme Detayı',
    sub:c.kod + ' · ' + c.musteriAd + ' · ' + c.ad,
    actions:actions
  });

  /* =================================================================
     KAYIT BAŞLIĞI
     ================================================================= */
  var head =
    '<div class="gv-rec-head"><div>' +
      '<div class="gv-rec-id"><span class="gv-rec-code">' + c.kod + '</span>' +
        GV.badge(c.durum) +
        (c.yenileme ? '<span class="badge ' + (yenilemeGun != null && yenilemeGun <= 60 ? 'is-warn' : 'is-info') +
            ' no-dot">Yenilenecek</span>' : '<span class="tag">Yenilemesiz</span>') +
        (suresiDoldu ? '<span class="badge is-danger">Süresi ' + Math.abs(kalanGun) + ' gün önce doldu</span>' : '') +
        (c.aktif === false ? '<span class="tag">Arşiv</span>' : '') + '</div>' +
      '<h1>' + esc(c.ad) + '</h1>' +
      '<div class="gv-rec-meta">' +
        (musteri
          ? '<span>' + ico('i-building','ic-sm') + '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + esc(musteri.kisa) + '</a></span>'
          : '<span>' + ico('i-building','ic-sm') + esc(c.musteriAd) + '</span>') +
        (proje ? '<span>' + ico('i-briefcase','ic-sm') + '<a href="app-proje-detay.html?id=' + proje.kod + '">' + esc(proje.ad) + '</a></span>'
               : '<span>' + ico('i-briefcase','ic-sm') + 'Projesiz sözleşme</span>') +
        (teklif ? '<span>' + ico('i-quote','ic-sm') + '<a href="app-teklif-detay.html?id=' + teklif.kod + '">' + esc(teklif.kod) + '</a></span>' : '') +
        '<span>' + ico('i-stamp','ic-sm') + 'İmza ' + F.date(c.imzaTarihi) + '</span>' +
        '<span>' + ico('i-calendar','ic-sm') + F.date(c.baslangic) + ' – ' + F.date(c.bitis) + '</span>' +
        '<span>' + ico('i-wallet','ic-sm') + (canFinans ? F.money(c.toplam, kur) + ' (KDV dahil)' : 'Tutar gizli') + '</span>' +
      '</div>' +
    '</div></div>';

  /* =================================================================
     SEKMELER
     ================================================================= */
  var tabs = [
    { key:'genel',    lbl:'Genel',            ic:'i-info' },
    { key:'taksit',   lbl:'Ödeme Planı',      ic:'i-milestone', cnt:taksitler.length },
    { key:'fatura',   lbl:'Faturalar',        ic:'i-receipt',   cnt:faturalar.length },
    { key:'tahsilat', lbl:'Tahsilatlar',      ic:'i-wallet',    cnt:tahsilatlar.length },
    { key:'proje',    lbl:'Proje ve Teslimler', ic:'i-briefcase', cnt:teslimler.length },
    { key:'yenileme', lbl:'Yenileme',         ic:'i-refresh' },
    { key:'aktivite', lbl:'Aktivite Geçmişi', ic:'i-activity',  cnt:acts.length }
  ];

  var tabBar = '<div class="gv-tabs" role="tablist" id="recTabs">' + tabs.map(function(x){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + x.key + '">' + ico(x.ic,'ic-sm') + esc(x.lbl) +
      (x.cnt ? '<span class="gv-tab-cnt">' + x.cnt + '</span>' : '') + '</button>';
  }).join('') + '</div>';

  /* =================================================================
     1. GENEL — DB.contracts alanlarının tamamı
     ================================================================= */
  var pGenel = '<div class="gc-body">' +
    sec('Sözleşme Kimliği', dl([
      ['Sözleşme kodu', '<span class="u-num">' + esc(c.kod) + '</span>'],
      ['Sözleşme adı / konusu', esc(c.ad)],
      ['Müşteri', musteri
        ? '<a href="app-musteri-detay.html?id=' + musteri.kod + '">' + esc(musteri.unvan) + '</a>' +
          ' <span class="cell-sub">' + esc(musteri.kod) + ' · ' + esc(musteri.sektor) + '</span>'
        : esc(c.musteriAd) + ' <span class="cell-sub">' + esc(c.musteri || '') + '</span>'],
      ['Bağlı teklif', teklif
        ? '<a href="app-teklif-detay.html?id=' + teklif.kod + '">' + esc(teklif.kod) + '</a>' +
          ' <span class="cell-sub">' + esc(teklif.firma) + ' · v' + teklif.versiyon + '</span>'
        : '<span class="u-faint">Teklifsiz sözleşme</span>'],
      ['Bağlı proje', proje
        ? '<a href="app-proje-detay.html?id=' + proje.kod + '">' + esc(proje.ad) + '</a>' +
          ' <span class="cell-sub">' + esc(proje.kod) + ' · ' + esc(proje.durum) + '</span>'
        : '<span class="u-faint">Projeye bağlı değil — dönemsel hizmet sözleşmesi</span>'],
      ['Sözleşme durumu', GV.badge(c.durum)],
      ['Kayıt durumu', c.aktif === false ? '<span class="tag">Arşivlendi</span>' : '<span class="badge is-ok no-dot">Aktif kayıt</span>']
    ])) +

    sec('Bedel ve Vergi', dl([
      ['Sözleşme bedeli <span class="u-faint">(KDV hariç)</span>', '<b>' + para(c.tutar) + '</b>'],
      ['KDV oranı', '<b class="u-num">%' + c.kdvOran + '</b>'],
      ['KDV tutarı', para(c.kdv)],
      ['Genel toplam <span class="u-faint">(KDV dahil)</span>', '<b>' + para(c.toplam) + '</b>'],
      ['Para birimi', esc(c.doviz)]
    ])) +

    sec('Süre ve Tarihler', dl([
      ['İmza tarihi', F.date(c.imzaTarihi)],
      ['Başlangıç tarihi', F.date(c.baslangic)],
      ['Bitiş tarihi', GV.dateCell(c.bitis, { done:bitmis }) + ' <span class="cell-sub">' + kalanMetin(bitmis ? null : kalanGun) + '</span>'],
      ['Sözleşme süresi', toplamGun != null ? '<b class="u-num">' + F.num(toplamGun) + '</b> gün' : null],
      ['Süre ilerlemesi', sureOran != null ? GV.progress(sureOran, { tone:bitmis ? 'ok' : (suresiDoldu ? 'danger' : null) }) : null],
      ['Yenileme koşulu', c.yenileme
        ? '<span class="badge is-info no-dot">Yenilemeli</span>'
        : '<span class="u-faint">Yenilemesiz</span>'],
      ['Yenileme tarihi', c.yenileme && c.yenilemeTarihi
        ? GV.dateCell(c.yenilemeTarihi, { done:false }) + ' <span class="cell-sub">' + kalanMetin(yenilemeGun) + '</span>'
        : null]
    ])) +

    sec('Ticari Koşullar', dl([
      ['Ödeme planı <span class="u-faint">(sözleşme metni)</span>', esc(c.odemePlani)],
      ['Ödeme planı taksit sayısı', taksitler.length
        ? '<b class="u-num">' + taksitler.length + '</b> taksit'
        : '<span class="u-faint">Taksit tanımlı değil — aylık faturalanır</span>'],
      ['Garanti', c.garanti && c.garanti !== '—' ? '<span class="tag">' + esc(c.garanti) + '</span>' : null]
    ])) +

    sec('İlgili Kişiler', GV.notice({
        tone:'neutral', icon:'i-info', title:'Sözleşme kartında sorumlu alanı yok',
        text:'Sözleşme kaydı kendi sorumlusunu tutmuyor. Aşağıdaki kişiler müşteri kartından ve bağlı proje kaydından türetilmiştir.' }) +
      dl([
        ['Müşteri sorumlusu <span class="u-faint">(müşteri kartından)</span>',
          musteri && musteri.sorumlu ? GV.user(musteri.sorumlu, { sm:true }) : null],
        ['Proje yöneticisi <span class="u-faint">(proje kartından)</span>',
          proje ? GV.user(proje.pm, { sm:true }) : null],
        ['Müşteri ilişkileri sorumlusu <span class="u-faint">(proje kartından)</span>',
          proje && proje.musteriSorumlu ? GV.user(proje.musteriSorumlu, { sm:true }) : null],
        ['Teknik sorumlu <span class="u-faint">(proje kartından)</span>',
          proje && proje.teknikSorumlu ? GV.user(proje.teknikSorumlu, { sm:true }) : null]
      ])) +
    '</div>';

  /* =================================================================
     2. ÖDEME PLANI (TAKSİTLER) — Σ odeme = sözleşme neti doğrulaması
     ================================================================= */
  var siraBosluk = [];
  taksitler.forEach(function(m, i){ if(m.taksit !== i + 1) siraBosluk.push(m.kod + ' (taksit ' + m.taksit + ', beklenen ' + (i + 1) + ')'); });

  var taksitUyari = '';
  if(!taksitler.length){
    taksitUyari = '<div class="gc-body">' + GV.notice(c.proje
      ? { tone:'warn', icon:'i-alert', title:'Projeli sözleşmenin taksit seti boş',
          text:'Bu sözleşme ' + c.proje + ' projesine bağlı ama ödeme planında hiç taksit tanımlı değil. ' +
               'Projeli her sözleşmenin taksit toplamı sözleşme bedeline eşit olmalıdır.' }
      : { tone:'neutral', icon:'i-info', title:'Taksitsiz sözleşme',
          text:'Bu sözleşme projeye bağlı değil; ödeme planı “' + c.odemePlani + '” olarak yürür ve ' +
               'taksit yerine dönemsel fatura kesilir. Kesilen faturalar Faturalar sekmesindedir.' }) + '</div>';
  } else {
    if(taksitNet !== c.tutar){
      taksitUyari += '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',
        title:'Taksit toplamı sözleşme bedeliyle eşleşmiyor',
        text:'Taksitlerin toplamı ' + F.money(taksitNet, kur) + ', sözleşme bedeli ' + F.money(c.tutar, kur) +
             ' (ikisi de KDV hariç net). Fark ' + F.money(Math.abs(taksitNet - c.tutar), kur) + '.' }) + '</div>';
    }
    if(siraBosluk.length){
      taksitUyari += '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',

      ['Ödeme planı', esc(c.odemePlani)],
      ['Garanti', c.garanti && c.garanti !== '—' ? esc(c.garanti) : '<span class="u-faint">—</span>'],
      ['İmza tarihi', '<span class="cell-date">' + F.date(c.imzaTarihi) + '</span>'],
      ['Bağlı teklif', teklif
        ? '<a href="app-teklif-detay.html?id=' + teklif.kod + '">' + esc(teklif.kod) + '</a>'
        : '<span class="u-faint">Teklifsiz</span>'],
      ['Para birimi', esc(c.doviz)]
    ]) + '</div></section>' +

    '<section class="gv-card"><div class="gc-head"><h2 class="gc-title">' + ico('i-activity') + 'Son Hareket</h2></div>' +
    '<div class="gc-body">' + (acts.length ? GV.activity(acts.slice(0, 3))
      : '<p class="u-sm u-faint">Bu sözleşme kartında henüz kayıtlı hareket yok.</p>') + '</div></section>';

  mount.innerHTML = head +
    '<div class="gv-grid gv-grid-aside">' +
      '<div><section class="gv-card">' + tabBar +
        tabs.map(function(x){ return '<div role="tabpanel" data-panel="' + x.key + '" hidden>' + panels[x.key] + '</div>'; }).join('') +
      '</section></div>' +
      '<div class="u-col">' + aside + '</div>' +
    '</div>';

  GV.tabs('#recTabs');

  /* =================================================================
     AKSİYONLAR
     ================================================================= */
  mount.addEventListener('click', function(e){
    if(e.target.closest('#btnYenile')) yenilemeAkisi();
  });
});
</script>
</body>
</html>
