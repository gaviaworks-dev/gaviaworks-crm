<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sözleşme Kaydı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="finans" data-screen="sozlesme">
<div id="rec"></div>

<!-- Okunan koleksiyonların TAMAMININ dosyası yüklenir (ders L-12):
     org.js  → DB.today
     crm.js  → DB.customers, DB.quotes
     work.js → DB.projects, DB.milestones, DB.activities, DB.proj
     misc.js → DB.contracts, DB.invoices -->
<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');

  /* =================================================================
     MOD — adreste id varsa düzenleme, yoksa yeni kayıt
     ================================================================= */
  var qs      = new URLSearchParams(location.search);
  var id      = qs.get('id');
  var kayit   = id ? DB.contracts.filter(function(x){ return x.kod === id; })[0] : null;
  var duzenle = !!kayit;

  /* Adreste id var ama kayıt yok — uydurma yok, boş forma da düşülmez. */
  if(id && !kayit){
    GV.shell.crumb('Kayıt bulunamadı');
    GV.pageHead({
      eyebrow:'Finans', title:'Kayıt bulunamadı',
      sub:'Düzenlenmek istenen sözleşme kaydı sistemde yok.',
      actions:[{ label:'Sözleşme listesine dön', cls:'btn-line', href:'app-sozlesme.html' }]
    });
    mount.innerHTML = '<section class="gv-card">' + GV.empty({
      icon:'i-search', title:'Sözleşme bulunamadı',
      desc:'“' + esc(id) + '” numaralı sözleşme bulunamadı. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-sozlesme.html">Sözleşme listesine dön</a>' }) + '</section>';
    return;
  }

  var basligi = duzenle ? kayit.kod + ' · Düzenle' : 'Yeni Sözleşme';
  GV.shell.crumb(basligi);
  document.title = basligi + ' — GaviaWorks CRM';

  /* =================================================================
     YETKİ KAPILARI — form kurulmadan önce (PROMPT.md §5 · ders L-07)

     Bu ekranın TAMAMI finans eksenindedir: sözleşme kaydının her alanı
     (bedel, KDV, genel toplam, ödeme planı, garanti) ticari bedelin
     parçasıdır. Bu yüzden finans yetkisi olmayan role tek tek alan
     gizlemek yerine sayfa seviyesinde 403 basılır — yarısı maskeli bir
     sözleşme formu ölü kontrol olurdu.
     ================================================================= */
  var canFinans = GV.perm.can('finans');
  var canYaz    = duzenle ? GV.perm.can('duzenle') : GV.perm.can('ekle');

  if(!canFinans || !canYaz){
    var neden = !canFinans
      ? 'Sözleşme kaydının tamamı finansal bedeldir; rolünüzde (' + GV.session.rolAd + ') ' +
        'finansal tutar yetkisi tanımlı değil. Sözleşmeleri listede görebilir, tutarları ' +
        'maskeli okuyabilirsiniz — ama sözleşme kaydı oluşturamaz veya değiştiremezsiniz.'
      : (duzenle ? 'Sözleşme düzenleme' : 'Sözleşme oluşturma') +
        ' yetkisi rolünüzde (' + GV.session.rolAd + ') tanımlı değil. ' +
        'Sözleşmeleri görüntüleyebilir ama değiştiremezsiniz.';

    GV.pageHead({
      eyebrow:'Finans', title:basligi, sub:'Bu işlem için yetkiniz yok.',
      actions:[{ label:'Sözleşme listesine dön', cls:'btn-line', href:'app-sozlesme.html' }]
    });
    mount.innerHTML = '<section class="gv-card">' + GV.errorState({
      title:'Bu işlem için yetkiniz yok', desc:neden }) + '</section>';
    /* GV.errorState kendi “Tekrar dene” butonunu basar; burada yeniden denenecek bir
       yükleme yok — ölü kontrol bırakmamak için gerçek aksiyonla değiştirilir. */
    var acts403 = mount.querySelector('.gv-state-acts');
    if(acts403){
      acts403.innerHTML = '<a class="btn btn-line" href="app-sozlesme.html">Sözleşme listesine dön</a>' +
        (duzenle ? ' <a class="btn btn-acc" href="app-sozlesme-detay.html?id=' + esc(kayit.kod) +
                   '">Sözleşme kartını aç</a>' : '');
    }
    return;                                   /* GV.form HİÇ kurulmaz */
  }

  /* =================================================================
     PARA KONVANSİYONU — components.md §9b, TEK EKSEN
       tutar   = sözleşme bedeli, NET (KDV hariç)  → formda girilen tek bedel
       kdvOran = yüzde · kdv = tutar × kdvOran/100 → HESAPLANIR, girilmez
       toplam  = tutar + kdv, BRÜT (KDV dahil)     → HESAPLANIR, girilmez
     Etikette eksen daima yazılır; net ve brüt aynı alanda karışmaz.
     ================================================================= */
  function sayi(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function kurSim(d){ return (!d || d === 'TRY') ? '₺' : d; }
  function kdvZinciri(tutar, oran){
    var net = sayi(tutar);
    var kdv = Math.round(net * sayi(oran) / 100);
    return { net:net, kdv:kdv, brut:net + kdv };
  }
  /* Teklifin net tutarı: araToplam − indirim (components.md §9b teklif zinciri). */
  function teklifNet(q){ return sayi(q.araToplam) - sayi(q.indirim); }

  /* =================================================================
     ÖDEME PLANI — taksitler DB.milestones'ta, bağ `sozlesme` alanında
     Bu form taksit YAZMAZ; yalnız dengeyi ölçer ve bozulacaksa uyarır.
     ================================================================= */
  function taksitleriOf(kod){
    return DB.milestones.filter(function(m){ return m.sozlesme === kod; })
                        .sort(function(a, b){ return a.taksit - b.taksit; });
  }
  function taksitToplam(list){
    return list.reduce(function(s, m){ return s + sayi(m.odeme); }, 0);
  }
  function siraBoslugu(list){
    var eksik = [];
    list.forEach(function(m, i){ if(m.taksit !== i + 1) eksik.push(m.kod + ' (taksit ' + m.taksit + ')'); });
    return eksik;
  }

  /* =================================================================
     ÖLÇÜMLER — ipuçlarındaki sayılar varsayılmaz, veriden sayılır
     ================================================================= */
  var toplamSozlesme = DB.contracts.length;
  var projeliSayi    = DB.contracts.filter(function(c){ return !!c.proje; }).length;
  var teklifliSayi   = DB.contracts.filter(function(c){ return !!c.teklif; }).length;
  var yenilemeliSayi = DB.contracts.filter(function(c){ return c.yenileme === true; }).length;

  /* net + KDV = brüt kaç kayıtta tutuyor */
  var kdvTutan = DB.contracts.filter(function(c){
    return sayi(c.tutar) + sayi(c.kdv) === sayi(c.toplam) &&
           sayi(c.kdv) === Math.round(sayi(c.tutar) * sayi(c.kdvOran) / 100);
  }).length;

  /* projeli sözleşmelerde Σ taksit = net bedel ve sıra 1..N boşluksuz mu */
  var projeliSozlesmeler = DB.contracts.filter(function(c){ return !!c.proje; });
  var planTamSayi = projeliSozlesmeler.filter(function(c){
    var ms = taksitleriOf(c.kod);
    return ms.length > 0 && taksitToplam(ms) === sayi(c.tutar) && siraBoslugu(ms).length === 0;
  }).length;
  var toplamTaksit = DB.milestones.filter(function(m){ return !!m.sozlesme; }).length;

  /* teklif → sözleşme para ekseni: sözleşme neti teklifin NETİNE mi BRÜTÜNE mi eşit */
  var teklifliSozlesmeler = DB.contracts.filter(function(c){ return !!c.teklif; });
  function teklifBul(k){ return k ? DB.quotes.filter(function(q){ return q.kod === k; })[0] || null : null; }
  var brutEsit = teklifliSozlesmeler.filter(function(c){
    var q = teklifBul(c.teklif);
    return q && sayi(c.tutar) === sayi(q.toplam) && sayi(c.tutar) !== teklifNet(q);
  }).length;
  var netEsit = teklifliSozlesmeler.filter(function(c){
    var q = teklifBul(c.teklif);
    return q && sayi(c.tutar) === teklifNet(q);
  }).length;

  /* proje kaydındaki sözleşme tutarı ile sözleşme neti kaç projede birebir */
  var projeEsit = projeliSozlesmeler.filter(function(c){
    var p = DB.proj(c.proje);
    return p && sayi(p.sozlesmeTutari) === sayi(c.tutar);
  }).length;

  /* =================================================================
     KAYDIN İLİŞKİLİ KAYITLARI — hepsi veride yazılı tekil bağdan
     ================================================================= */
  function musteriBul(k){ return k ? DB.customers.filter(function(c){ return c.kod === k; })[0] || null : null; }

  var taksitler = duzenle ? taksitleriOf(kayit.kod) : [];
  var taksitKod = taksitler.map(function(m){ return m.kod; });
  var faturalar = duzenle
    ? DB.invoices.filter(function(i){
        return i.sozlesme === kayit.kod || (i.milestone && taksitKod.indexOf(i.milestone) !== -1); })
    : [];
  var faturaNet = faturalar.reduce(function(s, i){ return s + sayi(i.tutar); }, 0);   /* NET */

  var kayitTeklif  = duzenle ? teklifBul(kayit.teklif) : null;
  var kayitProje   = duzenle && kayit.proje ? DB.proj(kayit.proje) : null;
  var kayitMusteri = duzenle ? musteriBul(kayit.musteri) : null;

  var acts = duzenle
    ? DB.activities.filter(function(a){ return a.kayit === kayit.kod; })
        .sort(function(a, b){ return String(b.tarih).localeCompare(String(a.tarih)); })
    : [];

  /* =================================================================
     SÖZLÜKLER
       · Sözleşme durumu: veride Aktif · Tamamlandı · Gecikti geçiyor;
         'İptal' değerini app-sozlesme-detay.html'in kapanış ve yenileme
         mantığı okuyor (bitmis / yenilenebilir kontrolleri). Veri
         katmanında sözleşme durumu sözlüğü olan bir koleksiyon YOK.
       · Para birimi: 7 sözleşmenin 7'si TRY; küme teklif formuyla aynı.
     ================================================================= */
  var DURUMLAR = ['Aktif','Tamamlandı','Gecikti','İptal'];
  if(duzenle && kayit.durum && DURUMLAR.indexOf(kayit.durum) === -1) DURUMLAR.push(kayit.durum);
  var DOVIZ = ['TRY','USD','EUR','GBP'];

  /* =================================================================
     SEÇENEK KÜMELERİ — hepsi veriden
     ================================================================= */
  var MUSTERILER = DB.customers
    .filter(function(c){ return c.aktif !== false || (duzenle && c.kod === kayit.musteri); })
    .map(function(c){ return { value:c.kod, label:c.unvan + ' · ' + c.kod + ' · ' + c.sektor +
      (c.aktif === false ? ' · pasif' : '') }; });

  var TEKLIFLER = DB.quotes
    .filter(function(q){ return q.aktif !== false || (duzenle && q.kod === kayit.teklif); })
    .map(function(q){ return { value:q.kod, label:q.kod + ' · ' + q.firma + ' · v' + q.versiyon +
      ' · ' + q.durum + ' · net ' + F.money(teklifNet(q), kurSim(q.doviz)) + ' (KDV hariç)' }; });

  var PROJELER = DB.projects
    .filter(function(p){ return p.aktif !== false || (duzenle && p.kod === kayit.proje); })
    .map(function(p){ return { value:p.kod, label:p.ad + ' · ' + p.kod + ' · ' + p.durum +
      ' · ' + p.musteriAd }; });

  /* =================================================================
     FORM KAYDI — koleksiyondaki ham değerler forma uygun biçime çevrilir
     ================================================================= */
  var formRec;
  if(duzenle){
    formRec = {};
    Object.keys(kayit).forEach(function(k){ formRec[k] = kayit[k]; });
    ['teklif','proje','yenilemeTarihi'].forEach(function(k){ formRec[k] = kayit[k] || ''; });
    /* Veride garanti alanında '—' sentinel'i “garanti yok” anlamında geçiyor
       (7 kaydın 1'inde). Formda boş metin karşılığıdır; sentinel yeniden yazılmaz. */
    formRec.garanti = (kayit.garanti && kayit.garanti !== '—') ? kayit.garanti : '';
    formRec.yenileme = kayit.yenileme === true;
    formRec.aktif = kayit.aktif !== false;
  }else{
    formRec = {
      ad:'', musteri:'', teklif:'', proje:'',
      tutar:0, kdvOran:20, doviz:'TRY',
      imzaTarihi:DB.today, baslangic:'', bitis:'',
      yenileme:false, yenilemeTarihi:'',
      odemePlani:'', garanti:'',
      durum:'Aktif', aktif:true
    };
  }

  /* =================================================================
     GÖRÜNÜM YARDIMCILARI
     `dt` escape EDİLMEZ (sabit etiket işaretlemesi — para ekseni notu
     <span class="u-faint"> ile yazılıyor), `dd` çağıran tarafta
     esc()'lenmiş gelir (ders L-14).
     ================================================================= */
  function dl(pairs){
    return '<dl class="gv-dl">' + pairs.filter(Boolean).map(function(p){
      var bos = p[1] == null || p[1] === '';
      return '<div><dt>' + p[0] + '</dt><dd' + (bos ? ' class="is-empty"' : '') + '>' +
        (bos ? '—' : p[1]) + '</dd></div>';
    }).join('') + '</dl>';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sub(t){ return '<span class="cell-sub">' + esc(t) + '</span>'; }
  function para(v, kur){ return '<span class="cell-money">' + F.money(v, kur) + '</span>'; }
  function kart(baslik, ikon, govde, ustAksiyon){
    return '<section class="gv-card">' +
      '<div class="gc-head"><h2 class="gc-title">' + ico(ikon) + esc(baslik) + '</h2>' +
      (ustAksiyon ? '<div class="gc-head-acts">' + ustAksiyon + '</div>' : '') + '</div>' + govde + '</section>';
  }

  /* =================================================================
     ÜST BLOKLAR
     ================================================================= */
  var ust = '';

  /* Teklif → sözleşme para ekseni kanaryası: sözleşmenin NET bedeli teklifin
     BRÜT toplamına eşitse, teklifin KDV'si sözleşmede bir kez daha uygulanır. */
  if(brutEsit){
    ust += '<section class="gv-card"><div class="gc-body">' + GV.notice({
      tone:'danger', icon:'i-alert', title:'Teklif → sözleşme aktarımında para ekseni kayması var',
      text:'Teklifi yazılı ' + teklifliSozlesmeler.length + ' sözleşmenin ' + brutEsit +
           ' tanesinde sözleşme bedeli (KDV hariç, net) teklifin KDV DAHİL toplamına eşit; ' +
           'yalnız ' + netEsit + ' tanesinde teklifin netine eşit. Bu forma girdiğiniz sözleşme ' +
           'bedeli net eksendedir ve KDV onun üzerine eklenir — teklifin brüt toplamını buraya ' +
           'yazarsanız KDV ikinci kez uygulanır. Aşağıdaki para zinciri kartı seçtiğiniz teklifle ' +
           'karşılaştırmayı canlı gösterir.',
      actions:[{ label:'Teklif listesi', href:'app-teklif.html' }] }) + '</div></section>';
  }

  if(duzenle){
    /* ---- İlişkili kayıt uyarısı: ödeme planı bütünlüğü (components.md §9b) ---- */
    var mevcutToplam = taksitToplam(taksitler);
    var mevcutBosluk = siraBoslugu(taksitler);
    var planAksiyon = [{ label:'Ödeme planı ekranı', href:'app-odemeplani.html' },
                       { label:'Sözleşme kartını aç', href:'app-sozlesme-detay.html?id=' + kayit.kod }];

    if(taksitler.length){
      ust += '<section class="gv-card"><div class="gc-body">' + GV.notice({
        tone:(mevcutToplam === sayi(kayit.tutar) && !mevcutBosluk.length) ? 'ok' : 'warn',
        title:(mevcutToplam === sayi(kayit.tutar) && !mevcutBosluk.length)
          ? 'Ödeme planı tam — taksitler bu formdan değiştirilmez'
          : 'Ödeme planı dengesi şu an bozuk',
        text:'Bu sözleşmenin ' + taksitler.length + ' taksiti ödeme planında yazılı ve toplamları ' +
             F.money(mevcutToplam, kurSim(kayit.doviz)) + ' (KDV hariç); sözleşme bedeli ' +
             F.money(sayi(kayit.tutar), kurSim(kayit.doviz)) + ' (KDV hariç). ' +
             (mevcutBosluk.length ? 'Taksit sırasında boşluk var: ' + mevcutBosluk.join(' · ') + '. ' : '') +
             'Taksitler bu formda düzenlenmez — sözleşme bedelini değiştirirseniz denge bozulur ve ' +
             'kaydetmeden önce onayınız istenir. Ölçüm: projeli ' + projeliSozlesmeler.length +
             ' sözleşmenin ' + planTamSayi + ' tanesinde ' + toplamTaksit +
             ' taksitin toplamı sözleşme netine eşit ve sıra 1..N boşluksuz.',
        actions:planAksiyon }) + '</div></section>';
    }else{
      ust += '<section class="gv-card"><div class="gc-body">' + GV.notice(kayit.proje
        ? { tone:'warn', icon:'i-alert', title:'Projeli sözleşmenin taksit seti boş',
            text:kayit.kod + ' sözleşmesi ' + kayit.proje + ' projesine bağlı ama ödeme planında hiç ' +
                 'taksit tanımlı değil. Projeli her sözleşmenin taksit toplamı sözleşme bedeline ' +
                 'eşit olmalıdır; taksitler bu formdan değil ödeme planı ekranından yazılır.',
            actions:planAksiyon }
        : { tone:'neutral', icon:'i-info', title:'Taksitsiz sözleşme',
            text:kayit.kod + ' bir projeye bağlı değil; ödeme planı “' + kayit.odemePlani +
                 '” olarak yürür ve taksit yerine dönemsel fatura kesilir. Bu sözleşmenin ' +
                 faturalar.length + ' faturası var.',
            actions:planAksiyon }) + '</div></section>';
    }

    /* ---- Bu kaydın teklif ekseni ---- */
    if(kayitTeklif){
      var kNet = teklifNet(kayitTeklif), kKur = kurSim(kayit.doviz);
      var kayma = sayi(kayit.tutar) === sayi(kayitTeklif.toplam) && sayi(kayit.tutar) !== kNet;
      ust += '<section class="gv-card"><div class="gc-body">' + GV.notice({
        tone:kayma ? 'danger' : (sayi(kayit.tutar) === kNet ? 'ok' : 'warn'),
        title:kayma ? 'Bu sözleşmenin bedeli teklifin BRÜT toplamına eşit'
                    : (sayi(kayit.tutar) === kNet ? 'Sözleşme bedeli teklifin netiyle birebir'
                                                  : 'Sözleşme bedeli teklifin hiçbir eksenine eşit değil'),
        text:kayitTeklif.kod + ' teklifinin net tutarı ' + F.money(kNet, kurSim(kayitTeklif.doviz)) +
             ' (KDV hariç), genel toplamı ' + F.money(sayi(kayitTeklif.toplam), kurSim(kayitTeklif.doviz)) +
             ' (KDV dahil). Bu sözleşmenin bedeli ' + F.money(sayi(kayit.tutar), kKur) + ' (KDV hariç), ' +
             'genel toplamı ' + F.money(sayi(kayit.toplam), kKur) + ' (KDV dahil). ' +
             (kayma ? 'Sözleşmenin NET alanına teklifin BRÜT değeri yazılmış; KDV bu kayıtta ikinci ' +
                      'kez uygulanıyor. Bedeli düzeltirseniz taksit–fatura zinciri de dengelenmelidir.'
                    : 'İki eksen de KDV hariç okunmalıdır.'),
        actions:[{ label:'Teklifi aç', href:'app-teklif-detay.html?id=' + kayitTeklif.kod }] }) + '</div></section>';
    }

    /* ---- Kayıt özeti ---- */
    var son = acts[0];
    var kalanGun = kayit.bitis ? F.days(kayit.bitis) : null;
    var bitmis = kayit.durum === 'Tamamlandı' || kayit.durum === 'İptal';
    var kurK = kurSim(kayit.doviz);

    ust += kart('Kayıt Özeti', 'i-info',
      '<div class="gc-body">' + dl([
        ['Sözleşme no', '<span class="cell-code">' + esc(kayit.kod) + '</span>'],
        ['Sözleşme adı', esc(kayit.ad)],
        ['Müşteri', kayitMusteri
          ? '<a href="app-musteri-detay.html?id=' + esc(kayitMusteri.kod) + '">' + esc(kayitMusteri.unvan) + '</a>' +
            sub(kayitMusteri.kod + ' · ' + kayitMusteri.sektor)
          : esc(kayit.musteriAd)],
        ['Bağlı teklif', kayitTeklif
          ? '<a href="app-teklif-detay.html?id=' + esc(kayitTeklif.kod) + '">' + esc(kayitTeklif.kod) + '</a>' +
            sub(kayitTeklif.firma + ' · v' + kayitTeklif.versiyon + ' · ' + kayitTeklif.durum)
          : null],
        ['Bağlı proje', kayitProje
          ? '<a href="app-proje-detay.html?id=' + esc(kayitProje.kod) + '">' + esc(kayitProje.ad) + '</a>' +
            sub(kayitProje.kod + ' · ' + kayitProje.durum)
          : null],
        ['Sözleşme durumu', GV.badge(kayit.durum) +
          (kayit.aktif === false ? ' <span class="tag">Arşiv</span>' : '')],
        ['Sözleşme bedeli <span class="u-faint">(KDV hariç)</span>', '<b>' + para(kayit.tutar, kurK) + '</b>'],

  function tutarOzetiCiz(){
    var hedef = document.getElementById('tutarOzet');
    if(!hedef) return;
    var v = form.read();
    var kur = kurSim(v.doviz);
    var z = kdvZinciri(v.tutar, v.kdvOran);
    var q = teklifBul(v.teklif);

    var uyari = '';
    if(q){
      var qNet = teklifNet(q), qBrut = sayi(q.toplam), qKur = kurSim(q.doviz);
      if(z.net === qBrut && qNet !== qBrut){
        uyari = GV.notice({ tone:'danger', icon:'i-alert',
          title:'Girilen bedel teklifin KDV DAHİL toplamına eşit',
          text:'Sözleşme bedeli alanı KDV hariç (net) eksendedir. ' + q.kod + ' teklifinin neti ' +
               F.money(qNet, qKur) + ', brütü ' + F.money(qBrut, qKur) + '. Şu an brüt değer net ' +
               'alana yazılı; kaydedilirse genel toplam ' + F.money(z.brut, kur) +
               ' olur ve KDV ikinci kez uygulanır.' });
      }else if(z.net !== qNet){
        uyari = GV.notice({ tone:'warn', icon:'i-alert',
          title:'Sözleşme bedeli teklifin netinden farklı',
          text:q.kod + ' teklifinin net tutarı ' + F.money(qNet, qKur) + ' (KDV hariç); girilen ' +
               'sözleşme bedeli ' + F.money(z.net, kur) + '. Fark ' +
               F.money(Math.abs(z.net - qNet), kur) + '. Görüşmede değişmişse sorun yok; ' +
               'değişmediyse teklif ekseni kaymış demektir.' });
      }else{
        uyari = GV.notice({ tone:'ok', icon:'i-check-circle',
          title:'Sözleşme bedeli teklifin netiyle birebir',
          text:q.kod + ' teklifinin net tutarı ile sözleşme bedeli aynı: ' + F.money(qNet, qKur) +
               ' (ikisi de KDV hariç).' });
      }
    }else{
      uyari = GV.notice({ tone:'neutral', icon:'i-info', title:'Teklif bağı yok',
        text:'Bu sözleşme bir teklife bağlanmadı; bedel karşılaştırması yapılamıyor. Ölçüm: ' +
             toplamSozlesme + ' sözleşmenin ' + teklifliSayi + ' tanesi teklife bağlı.' });
    }

    hedef.innerHTML = uyari + ozetListe([
      ['Sözleşme bedeli <span class="u-faint">(KDV hariç)</span>', para(z.net, kur)],
      ['KDV oranı', '<b class="u-num">%' + F.num(sayi(v.kdvOran)) + '</b>'],
      ['KDV tutarı <span class="u-faint">(hesaplanır)</span>', para(z.kdv, kur)],
      ['Genel toplam <span class="u-faint">(KDV dahil — hesaplanır)</span>', '<b>' + para(z.brut, kur) + '</b>'],
      q ? ['Teklif net tutarı <span class="u-faint">(KDV hariç)</span>',
        '<span class="u-num">' + F.money(teklifNet(q), kurSim(q.doviz)) + '</span>' + sub(q.kod)] : null,
      q ? ['Teklif genel toplamı <span class="u-faint">(KDV dahil)</span>',
        '<span class="u-num">' + F.money(sayi(q.toplam), kurSim(q.doviz)) + '</span>' + sub(q.kod)] : null,
      ['Para birimi', esc(v.doviz || 'TRY')]
    ]);
  }

    var hedef = document.getElementById('planOzet');
    if(!hedef) return;
    var v = form.read();
    var kur = kurSim(v.doviz);
    var net = sayi(v.tutar);
    var p = v.proje ? DB.proj(v.proje) : null;

    /* Taksitler yalnız KAYITLI sözleşmede olur; yeni kayıtta henüz taksit yoktur. */
    if(!taksitler.length){
      hedef.innerHTML = GV.notice(v.proje
        ? { tone:'warn', icon:'i-alert', title:'Projeli sözleşmenin taksitleri henüz yazılmamış',
            text:'Projeli her sözleşmenin taksit seti ödeme planında TAM tutulur: taksitlerin ' +
                 'toplamı sözleşme bedeline (KDV hariç) eşit ve taksit numaraları 1..N boşluksuz ' +
                 'olmalıdır. Şu an bu sözleşmede taksit yok; ' + F.money(net, kur) +
                 ' tutarındaki bedel ödeme planı ekranından taksitlere bölünmelidir. Ölçüm: projeli ' +
                 projeliSozlesmeler.length + ' sözleşmenin ' + planTamSayi + ' tanesinde bu denge tutuyor.' }
        : { tone:'neutral', icon:'i-info', title:'Projesiz sözleşme taksit tutmaz',
            text:'Proje bağı olmayan sözleşme (bakım / dönemsel hizmet) ödeme planı taksiti tutmaz; ' +
                 '“' + (String(v.odemePlani || '').trim() || 'ödeme planı metni') + '” koşuluna göre ' +
                 'dönemsel fatura kesilir. Ölçüm: ' + toplamSozlesme + ' sözleşmenin ' +
                 (toplamSozlesme - projeliSayi) + ' tanesi projesiz.' }) +
        (p ? ozetListe([
          ['Proje kaydındaki sözleşme tutarı <span class="u-faint">(KDV hariç)</span>',
            '<span class="u-num">' + F.money(sayi(p.sozlesmeTutari), kur) + '</span>' + sub(p.kod)],
          ['Forma girilen bedel <span class="u-faint">(KDV hariç)</span>', para(net, kur)],
          ['Fark', sayi(p.sozlesmeTutari) === net
            ? '<span class="badge is-ok no-dot">Yok</span>'
            : '<b class="u-danger">' + F.money(Math.abs(sayi(p.sozlesmeTutari) - net), kur) + '</b>']
        ]) : '');
      return;
    }

    var toplam = taksitToplam(taksitler);
    var bosluk = siraBoslugu(taksitler);
    var dengede = toplam === net && !bosluk.length;

    hedef.innerHTML = GV.notice({
      tone:dengede ? 'ok' : 'warn',
      icon:dengede ? 'i-check-circle' : 'i-alert',
      title:dengede ? 'Ödeme planı dengede' : 'Ödeme planı dengesi bozuluyor',
      text:dengede
        ? 'Taksitlerin toplamı sözleşme bedeline eşit ve taksit numaraları 1..' + taksitler.length +
          ' boşluksuz. Bedeli değiştirirseniz bu denge bozulur; taksitler bu formdan yazılmaz.'
        : 'Taksitlerin toplamı ' + F.money(toplam, kur) + ', forma girilen sözleşme bedeli ' +
          F.money(net, kur) + ' (ikisi de KDV hariç). Fark ' + F.money(Math.abs(toplam - net), kur) + '. ' +
          (bosluk.length ? 'Ayrıca taksit sırasında boşluk var: ' + bosluk.join(' · ') + '. ' : '') +
          'Bu form taksitleri değiştirmez — kaydetmeden önce onayınız istenir ve denge ödeme planı ' +
          'ekranından düzeltilmelidir.' }) +

    ozetListe([
      ['Taksit sayısı', '<b class="u-num">' + taksitler.length + '</b> taksit' +
        sub(bosluk.length ? 'sıra boşluklu' : 'sıra 1..' + taksitler.length + ' tam')],
      ['Taksit toplamı <span class="u-faint">(KDV hariç)</span>', para(toplam, kur)],
      ['Forma girilen bedel <span class="u-faint">(KDV hariç)</span>', para(net, kur)],
      ['Fark <span class="u-faint">(KDV hariç)</span>', toplam === net
        ? '<span class="badge is-ok no-dot">Yok</span>'
        : '<b class="u-danger">' + F.money(Math.abs(toplam - net), kur) + '</b>'],
      ['Kesilmiş fatura neti <span class="u-faint">(KDV hariç)</span>',
        faturalar.length ? para(faturaNet, kur) + sub(faturalar.length + ' fatura')
                         : '<span class="u-faint">Fatura kesilmedi</span>'],
      p ? ['Proje kaydındaki sözleşme tutarı <span class="u-faint">(KDV hariç)</span>',
        '<span class="u-num">' + F.money(sayi(p.sozlesmeTutari), kur) + '</span>' + sub(p.kod)] : null
    ]) +

    '<div class="gv-summary">' + taksitler.map(function(m){
      return '<div class="gv-summary-row">' +
        '<span class="gv-summary-lbl">' + m.taksit + '. taksit · ' + esc(m.ad) + '</span>' +
        '<span class="gv-summary-val"><span class="u-num">' + F.money(sayi(m.odeme), kur) + '</span>' +
          sub(m.kod + ' · ' + m.tarih) + '</span></div>';
    }).join('') + '</div>';
  }

  function ozetleriCiz(){ tutarOzetiCiz(); planOzetiCiz(); }

  form.el.addEventListener('input',  function(e){ if(e.target && e.target.name) ozetleriCiz(); });
  form.el.addEventListener('change', function(e){ if(e.target && e.target.name) ozetleriCiz(); });
  ozetleriCiz();

  /* =================================================================
     KAYDET
     ================================================================= */
  var ALAN_ADI = {
    ad:'Sözleşme adı', musteri:'Müşteri', musteriAd:'Müşteri unvanı', teklif:'Bağlı teklif',
    proje:'Bağlı proje', tutar:'Sözleşme bedeli', kdvOran:'KDV oranı', kdv:'KDV tutarı',
    toplam:'Genel toplam', doviz:'Para birimi', imzaTarihi:'İmza tarihi',
    baslangic:'Başlangıç tarihi', bitis:'Bitiş tarihi', durum:'Sözleşme durumu',
    odemePlani:'Ödeme planı', garanti:'Garanti süresi', yenileme:'Yenileme koşulu',
    yenilemeTarihi:'Yenileme tarihi', aktif:'Kayıt durumu'
  };

  /* Tarih DB.today'den gelir; new Date() ile bugün alınmaz. */
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }

  /* Yeni kod dizi uzunluğundan değil, en yüksek mevcut numaradan üretilir. */
  function yeniKod(){
    var max = 0;
    DB.contracts.forEach(function(x){
      var m = /^SZL-\d{4}-(\d+)$/.exec(x.kod || '');
      if(m) max = Math.max(max, +m[1]);
    });
    var n = String(max + 1);
    while(n.length < 3) n = '0' + n;
    return 'SZL-' + String(DB.today).slice(0,4) + '-' + n;
  }

  /* Karşılaştırma normalleştirmesi: tanımsız, false, boş metin ve '—' aynı kovaya düşer. */
  function norm(x){
    if(x == null || x === false || x === '' || x === '—') return '';
    return String(x);
  }
  function gorunur(k, v){
    if(v == null || v === '' || v === '—') return '—';
    if(k === 'aktif')    return v ? 'Aktif kayıt' : 'Arşivlendi';
    if(k === 'yenileme') return v ? 'Yenilemeye açık' : 'Yenilemesiz';
    if(k === 'kdvOran')  return '%' + v;
    if(k === 'musteri'){ var c = musteriBul(v); return c ? c.unvan : String(v); }
    if(k === 'proje')    return DB.projName(v) + ' (' + v + ')';
    if(['tutar','kdv','toplam'].indexOf(k) !== -1) return F.money(v);
    if(['imzaTarihi','baslangic','bitis','yenilemeTarihi'].indexOf(k) !== -1) return F.date(v);
    return String(v);
  }

  function degerleriOku(){
    var raw = form.submit();
    if(!raw) return null;

    var v = {};
    Object.keys(raw).forEach(function(k){ v[k] = raw[k]; });

    v.ad         = String(v.ad || '').trim();
    v.odemePlani = String(v.odemePlani || '').trim();
    v.garanti    = String(v.garanti || '').trim();
    v.teklif     = v.teklif || null;
    v.proje      = v.proje || null;
    v.doviz      = v.doviz || 'TRY';

    /* Müşteri unvanı kayda müşteri kartından YAZILIR; ikinci bir eksen açılmaz. */
    var mus = musteriBul(v.musteri);
    v.musteriAd = mus ? mus.unvan : (duzenle ? kayit.musteriAd : '');

    /* Para zinciri: net girilir, KDV ve brüt hesaplanır (components.md §9b). */
    v.tutar   = sayi(v.tutar);
    v.kdvOran = sayi(v.kdvOran);
    var z = kdvZinciri(v.tutar, v.kdvOran);
    v.kdv     = z.kdv;
    v.toplam  = z.brut;

    v.yenileme       = !!v.yenileme;
    v.yenilemeTarihi = v.yenileme ? (v.yenilemeTarihi || null) : null;
    v.aktif          = !!v.aktif;
    return v;
  }

  /* Bu form taksit, fatura ve proje kaydı YAZMAZ. Girilen bedel bağlı kayıtlarla
     çelişiyorsa kullanıcı kaydetmeden önce açıkça uyarılır (components.md §9b). */
  function dengeUyarilari(v){
    var kur = kurSim(v.doviz);
    var out = [];

    if(taksitler.length){
      var toplam = taksitToplam(taksitler);
      if(toplam !== v.tutar){
        out.push('Ödeme planı: ' + taksitler.length + ' taksitin toplamı ' + F.money(toplam, kur) +
                 ', yeni sözleşme bedeli ' + F.money(v.tutar, kur) + ' (ikisi de KDV hariç); fark ' +
                 F.money(Math.abs(toplam - v.tutar), kur) + '. Taksitler bu formdan güncellenmez.');
      }
    }
    if(faturalar.length && faturaNet > v.tutar){
      out.push('Faturalama: bu sözleşmeye kesilmiş ' + faturalar.length + ' faturanın net toplamı ' +
               F.money(faturaNet, kur) + ', yeni bedelin (' + F.money(v.tutar, kur) + ') üstünde.');
    }
    var p = v.proje ? DB.proj(v.proje) : null;
    if(p && sayi(p.sozlesmeTutari) !== v.tutar){
      out.push('Proje kaydı: ' + p.kod + ' kaydındaki sözleşme tutarı ' +
               F.money(sayi(p.sozlesmeTutari), kur) + ', yeni bedel ' + F.money(v.tutar, kur) +
               ' (ikisi de KDV hariç). Proje kaydı bu formdan güncellenmez.');
    }
    return out;
  }

  function yaz(v){
    if(duzenle){
      /* Aktivite kaydı yalnız DEĞİŞEN alanlar için yazılır (PROMPT.md §28). */
      var degisen = 0;
      Object.keys(v).forEach(function(k){
        if(norm(kayit[k]) === norm(v[k])) return;
        DB.activities.unshift({
          kayit:kayit.kod, tarih:simdi(), kisi:GV.session.ad,
          metin:'Alan güncellendi: ' + (ALAN_ADI[k] || k),
          eski:gorunur(k, kayit[k]), yeni:gorunur(k, v[k]),
          tone:'accent', icon:'i-edit'
        });
        kayit[k] = v[k];
        degisen++;
      });
      GV.toast(degisen
        ? kayit.kod + ' güncellendi · ' + degisen + ' alan'
        : 'Değişiklik yok — kayıt olduğu gibi bırakıldı', degisen ? 'ok' : 'info');
    }else{
      var kod = yeniKod();
      /* Anahtar sırası koleksiyondaki kayıtlarla aynı tutulur. `yenilemeTarihi`
         yalnız yenilemeye açık kayıtta doğar — veride de öyle (yenilemesiz
         kayıtlarda anahtar hiç yok). */
      var yeni = {
        kod:kod, musteri:v.musteri, musteriAd:v.musteriAd, teklif:v.teklif, proje:v.proje,
        ad:v.ad, tutar:v.tutar, kdvOran:v.kdvOran, kdv:v.kdv, toplam:v.toplam, doviz:v.doviz,
        imzaTarihi:v.imzaTarihi, baslangic:v.baslangic, bitis:v.bitis, durum:v.durum,
        odemePlani:v.odemePlani, garanti:v.garanti, yenileme:v.yenileme, aktif:v.aktif
      };
      if(v.yenileme) yeni.yenilemeTarihi = v.yenilemeTarihi;

      DB.contracts.unshift(yeni);
      DB.activities.unshift({
        kayit:kod, tarih:simdi(), kisi:GV.session.ad,
        metin:'Sözleşme oluşturuldu — ' + v.musteriAd + ' · ' +
              F.money(v.tutar, kurSim(v.doviz)) + ' (KDV hariç)',
        eski:null, yeni:kod, tone:'ok', icon:'i-plus'
      });
      GV.toast(kod + ' oluşturuldu', 'ok');
    }

    form.setDirty(false);
    /* location.reload() YASAK (ders L-15) — normal akış listeye dönmektir. */
    setTimeout(function(){ location.href = 'app-sozlesme.html'; }, 700);
  }

  function kaydet(){
    var v = degerleriOku();
    if(!v) return;

    var uyari = dengeUyarilari(v);
    if(!uyari.length){ yaz(v); return; }

    /* form.submit() dirty bayrağını düşürdü; onay verilmezse kaydedilmemiş
       değişiklik uyarısı geri konur. */
    GV.confirm({
      tone:'warn', title:'Bağlı kayıtlarla denge bozulacak',
      okLabel:'Yine de kaydet', cancelLabel:'Vazgeç',
      text:uyari.join(' ') + ' Kaydederseniz sözleşme yeni bedelle yazılır, bağlı kayıtlar olduğu ' +
           'gibi kalır ve dengeyi ilgili ekranlardan düzeltmeniz gerekir.'
    }).then(function(ok){
      if(ok){ yaz(v); return; }
      form.setDirty(true);
      GV.toast('Kaydedilmedi — bağlı kayıtlarla denge korundu', 'info');
    });
  }

  GV.pageHead({
    eyebrow:'Finans',
    title:basligi,
    sub: duzenle
      ? 'Kayıt üzerinde yapılan değişiklikler aktivite geçmişine yazılır · ' + alanSayisi + ' alan.'
      : 'Zorunlu alanlar yıldızla işaretlidir · ' + alanSayisi + ' alan, ' + zorunlu.length + ' zorunlu.',
    actions:[
      { label:'Vazgeç', cls:'btn-line', href:'app-sozlesme.html' },
      { label: duzenle ? 'Değişiklikleri kaydet' : 'Kaydet', cls:'btn-acc', icon:'i-check', run:kaydet }
    ]
  });

  /* Mount İÇİNDEKİ düğüm — GV.refresh() taze kopyayla değiştirir (ders L-16). */
  var altBtn = document.getElementById('kaydetAlt');
  if(altBtn) altBtn.addEventListener('click', kaydet);
});
</script>
</body>
