<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tedarikçiler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satinalma" data-screen="tedarikci">
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, canFinans = GV.perm.can('finans');
  GV.pageHead({ eyebrow:'Tedarik', title:'Tedarikçiler',
    actions:[{ label:'Siparişler', icon:'i-truck', href:'app-siparis.html' },
             { label:'Yeni Tedarikçi', icon:'i-plus', cls:'btn-acc', href:'app-tedarikci-form.html' }] });
  GV.list({
    mount:'#liste', id:'tedarikci', key:'kod', source:function(){ return DB.suppliers; },
    exportName:'tedarikciler', exportTitle:'Tedarikçi Listesi', pageSize:25, views:['table','card'],
    search:{ placeholder:'Ünvan, kategori, yetkili veya vergi no ara', fields:['kod','unvan','kategori','yetkili','vergiNo','adres'] },
    defaultSort:'puan', defaultDir:'desc',
    kpis:[
      { label:'Aktif tedarikçi', icon:'i-building', calc:function(a){ return a.filter(function(x){ return x.durum === 'Aktif'; }).length; } },
      { label:'Toplam sipariş', icon:'i-truck', tone:'info', calc:function(a){ return a.reduce(function(s,x){ return s + x.siparisSayisi; }, 0); } },
      { label:'Toplam hacim', icon:'i-wallet', tone:'ok', format:F.moneyK,
        calc:function(a){ return canFinans ? a.reduce(function(s,x){ return s + x.toplamTutar; }, 0) : 0; } },
      { label:'Ortalama genel puan', icon:'i-star', tone:'purple', format:function(v){ return v + ' / 5'; },
        calc:function(a){ return a.length ? (a.reduce(function(s,x){ return s + x.puan; }, 0) / a.length).toFixed(1) : '—'; } }
    ],
    tabs:[
      { key:'aktif', label:'Aktif Tedarikçiler', icon:'i-building', filter:function(x){ return x.durum === 'Aktif'; } },
      { key:'donanim', label:'Donanım', icon:'i-package', filter:function(x){ return x.kategori === 'Donanım'; } },
      { key:'yazilim', label:'Yazılım ve Bulut', icon:'i-server',
        filter:function(x){ return ['Yazılım lisansı','Bulut hizmeti'].indexOf(x.kategori) !== -1; } },
      { key:'diger', label:'Diğer', icon:'i-list',
        filter:function(x){ return ['Donanım','Yazılım lisansı','Bulut hizmeti'].indexOf(x.kategori) === -1; } },
      { key:'tumu', label:'Tümü', icon:'i-list', filter:null }
    ],
    columns:[
      { key:'unvan', label:'Tedarikçi', width:'26%', locked:true, cellClass:'cell-wrap', render:function(x){
          return '<a class="cell-main" href="app-tedarikci-detay.html?id=' + x.kod + '">' + esc(x.unvan) + '</a>' +
                 '<span class="cell-sub">' + esc(x.adres) + '</span><span class="cell-code">' + x.kod + '</span>'; } },
      { key:'kategori', label:'Kategori', render:function(x){ return '<span class="tag">' + esc(x.kategori) + '</span>'; } },
      { key:'yetkili', label:'Yetkili', render:function(x){
          return x.yetkili && x.yetkili !== '—'
            ? '<span class="cell-main">' + esc(x.yetkili) + '</span><span class="cell-sub">' + esc(x.tel) + '</span>'
            : '<span class="u-faint">—</span>'; } },
      { key:'eposta', label:'E-posta', visible:false },
      { key:'vergiNo', label:'Vergi no', visible:false, cellClass:'u-num' },
      { key:'siparisSayisi', label:'Sipariş', cellClass:'num', render:function(x){ return '<b class="u-num">' + x.siparisSayisi + '</b>'; } },
      { key:'toplamTutar', label:'Toplam hacim', cellClass:'num', render:function(x){
          return canFinans ? '<span class="cell-money">' + F.money(x.toplamTutar) + '</span>' : '<span class="cell-mask">••••••</span>'; },
        exportValue:function(x){ return canFinans ? x.toplamTutar : ''; } },
      { key:'odemeVadesi', label:'Ödeme vadesi' },
      { key:'puan', label:'Tedarikçi genel puanı', render:function(x){
          return '<span class="badge ' + (x.puan >= 4.5 ? 'is-ok' : x.puan >= 4 ? 'is-info' : x.puan >= 3.5 ? 'is-warn' : 'is-danger') + '">' +
                 x.puan + ' / 5</span>'; } },
      { key:'durum', label:'Durum', render:function(x){ return GV.badge(x.durum); } }
    ],
    filters:[
      { key:'kategori', label:'Kategori', type:'multi',
        options:['Donanım','Yazılım lisansı','Bulut hizmeti','Ofis mobilyası','Araç kiralama'] },
      { key:'durum', label:'Durum', type:'select', options:['Aktif','Pasif'] },
      { key:'odemeVadesi', label:'Ödeme vadesi', type:'multi', options:['Peşin','30 gün','60 gün','Aylık'] },
      { key:'puan', label:'Genel puan (en az)', type:'text', test:function(x,v){ return x.puan >= (parseFloat(v) || 0); } }
    ],
    card:function(x){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-tedarikci-detay.html?id=' + x.kod + '">' + esc(x.unvan) + '</a>' +
        '<div class="cell-sub">' + esc(x.kategori) + '</div></div>' +
        '<span class="badge ' + (x.puan >= 4.5 ? 'is-ok' : 'is-info') + '">' + x.puan + '</span></div>' +
        '<div class="gv-rcard-meta"><span>' + x.siparisSayisi + ' sipariş</span><span>' + esc(x.odemeVadesi) + '</span></div>' +
        '<div class="gv-rcard-foot">' + (canFinans ? '<span class="cell-money">' + F.moneyK(x.toplamTutar) + '</span>' : '') +
        GV.badge(x.durum) + '</div>';
    },
    mobile:function(x){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-tedarikci-detay.html?id=' + x.kod + '">' + esc(x.unvan) + '</a>' +
        '<span class="badge is-info">' + x.puan + '</span></div>' +
        '<div class="gv-mrow-code">' + esc(x.kategori) + ' · ' + x.siparisSayisi + ' sipariş</div>';
    },
    rowActions:[
      { key:'ac', icon:'i-external', label:'Tedarikçiyi aç', href:function(x){ return 'app-tedarikci-detay.html?id=' + x.kod; } },
      { key:'siparis', icon:'i-truck', label:'Siparişleri', href:function(x){ return 'app-siparis.html?f_tedarikci=' + x.kod; } },
      { key:'mail', icon:'i-mail', label:'E-posta gönder', href:function(x){ return 'mailto:' + x.eposta; } }
    ],
    bulk:[{ key:'disa', label:'Dışa aktar', icon:'i-download' }],
    emptyState:{ icon:'i-building', title:'Bu görünümde tedarikçi yok',
      desc:'Tedarikçi genel puanı sipariş geçmişinden beslenir: teslim zamanlaması, kalite, satış sonrası destek ve ödeme uyumu. Tek bir teklife verilen “teklif puanı” bundan ayrı bir eksendir.' }
  });

});
</script>
</body>
</html>
