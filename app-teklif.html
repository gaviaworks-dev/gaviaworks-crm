<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teklifler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="satis" data-screen="teklif">
<!-- UID-15 — shell iskeleti ARTIK ELLE YAZILMIYOR. `buildSkeleton()` gövdedeki
     içeriği koruyup rail/menü/üstbar/main sarmalayıcısını kendisi kurar; böylece
     20 satırlık markup 13 ekranda tekrarlanmaz, kopyalanan `.gv-divider`ın
     `aria-controls` niteliğini kaybetmesi sorunu da kökten biter. -->
<div class="gv-page-head">
  <div>
    <div class="ph-eyebrow">Satış ve CRM</div>
    <h1>Teklifler</h1>
    <div class="ph-sub" data-listcount>—</div>
  </div>
  <div class="ph-actions">
    <a class="btn btn-line" href="app-onanaliz.html">
      <svg class="ic" aria-hidden="true"><use href="#i-clipboard"></use></svg> Ön Analizler
    </a>
    <a class="btn btn-acc" href="app-teklif-form.html">
      <svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg> Yeni Teklif
    </a>
  </div>
</div>
<div id="liste"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt;
  var acik = function(q){ return ['Kazanıldı','Kaybedildi'].indexOf(q.durum) === -1; };
  var suresiDolan = function(q){ return acik(q) && q.gecerlilik && F.days(q.gecerlilik) < 0; };

  /* `GV.flow.gec()` reddi kullanıcı diline çevrilir — `why` kodu ekranda ham basılmaz. */
  function flowHata(r){
    if(r.why === 'yetki')   return 'Bu geçiş için yetkiniz yok · yetkili roller: ' + (r.roller || []).join(', ');
    if(r.why === 'zorunlu') return 'Geçiş için eksik zorunlu alan: ' + (r.eksik || []).join(', ');
    if(r.why === 'gerekce') return r.mesaj || 'Bu işlem için neden kodu ve açıklama zorunludur';
    if(r.why === 'kapi')    return r.mesaj || 'Geçiş ön koşulu sağlanmadı';
    return r.why || 'Geçiş yapılamadı';
  }

  GV.list({
    mount:'#liste', id:'teklif', key:'kod', source:function(){ return DB.quotes; },
    exportName:'teklifler', exportTitle:'Teklif Listesi', pageSize:10, views:['table','card'],
    search:{ placeholder:'Teklif no, firma veya hazırlayan ara', fields:['kod','firma','durum','odemePlani'] },
    defaultSort:'tarih', defaultDir:'desc',

    kpis:[
      { label:'Açık teklif', icon:'i-quote', calc:function(a){ return a.filter(acik).length; } },
      { label:'Açık teklif değeri', icon:'i-wallet', tone:'info', format:F.moneyK,
        calc:function(a){ return a.filter(acik).reduce(function(s,q){ return s + q.toplam; }, 0); } },
      { label:'Geçerliliği dolan', icon:'i-hourglass', tone:'danger', calc:function(a){ return a.filter(suresiDolan).length; } },
      { label:'Teklif başarı oranı', icon:'i-percent', tone:'ok', format:function(v){ return '%' + v; },
        calc:function(a){
          var k = a.filter(function(q){ return q.durum === 'Kazanıldı'; }).length;
          var kb = a.filter(function(q){ return q.durum === 'Kaybedildi'; }).length;
          return Math.round(k / Math.max(1, k + kb) * 100); } }
    ],

    tabs:[
      { key:'acik',     label:'Açık Teklifler',   icon:'i-quote',        filter:acik },
      { key:'taslak',   label:'Taslak',           icon:'i-edit',         filter:function(q){ return q.durum === 'Taslak'; } },
      { key:'iconay',   label:'İç Onay Bekleyen', icon:'i-stamp',        filter:function(q){ return q.icOnay === 'Bekliyor'; } },
      { key:'iletildi', label:'Müşteride',        icon:'i-send',         filter:function(q){ return ['Gönderildi','Müşteri İncelemesi'].indexOf(q.durum) !== -1; } },
      { key:'dolan',    label:'Süresi Dolanlar',  icon:'i-hourglass',    filter:suresiDolan },
      { key:'kazanan',  label:'Kazanılanlar',     icon:'i-check-circle', filter:function(q){ return q.durum === 'Kazanıldı'; } },
      { key:'kayip',    label:'Kaybedilenler',    icon:'i-x-circle',     filter:function(q){ return q.durum === 'Kaybedildi'; } },
      { key:'tumu',     label:'Tümü',             icon:'i-list',         filter:null }
    ],

    columns:[
      { key:'kod', label:'Teklif', width:'22%', cellClass:'cell-wrap', locked:true,
        render:function(q){ return '<a class="cell-main" href="app-teklif-detay.html?id=' + q.kod + '">' + q.kod + '</a>' +
          '<span class="cell-sub">' + GV.esc(q.firma) + '</span>' +
          '<span class="cell-code">v' + q.versiyon + ' · ' + q.kalemSayisi + ' kalem</span>'; } },
      { key:'tarih', label:'Teklif tarihi', render:function(q){ return '<span class="cell-date">' + F.date(q.tarih) + '</span>'; } },
      { key:'gecerlilik', label:'Geçerlilik', render:function(q){
          return GV.dateCell(q.gecerlilik, { done:!acik(q) }); } },
      { key:'hazirlayan', label:'Hazırlayan', render:function(q){ return GV.user(q.hazirlayan, { sm:true }); },
        sortValue:function(q){ return DB.empName(q.hazirlayan); }, exportValue:function(q){ return DB.empName(q.hazirlayan); } },
      { key:'araToplam', label:'Ara toplam', visible:false, cellClass:'num',
        render:function(q){ return '<span class="u-num">' + F.money(q.araToplam) + '</span>'; } },
      { key:'indirim', label:'İndirim', visible:false, cellClass:'num',
        render:function(q){ return q.indirim ? '<span class="u-num u-danger">−' + F.money(q.indirim) + '</span>' : '<span class="u-faint">—</span>'; } },
      { key:'toplam', label:'Toplam', cellClass:'num',
        render:function(q){ return '<span class="cell-money">' + F.money(q.toplam, q.doviz === 'TRY' ? '₺' : q.doviz) + '</span>'; } },
      { key:'teslimSuresi', label:'Teslim süresi', visible:false },
      { key:'icOnay', label:'İç onay', render:function(q){ return GV.badge(q.icOnay === '—' ? 'Bekliyor' : q.icOnay); } },
      { key:'musteriOnay', label:'Müşteri onayı', visible:false,
        render:function(q){ return q.musteriOnay === '—' ? '<span class="u-faint">—</span>' : GV.badge(q.musteriOnay); } },
      { key:'durum', label:'Durum', render:function(q){ return GV.badge(q.durum); } }
    ],

    filters:[
      /* Sözlük ekranda ELLE YAZILMAZ: tek kaynak `DB.quoteStatuses` (org.js).
         Kopya liste, sözlük her genişlediğinde sessizce eksik filtre üretiyordu. */
      { key:'durum', label:'Teklif durumu', type:'multi', options:DB.quoteStatuses },
      { key:'hazirlayan', label:'Hazırlayan', type:'select',
        options:DB.employees.filter(function(e){ return ['satismudur','satistemsilci','sahip'].indexOf(e.rol) !== -1; })
                            .map(function(e){ return { value:e.kod, label:e.ad }; }) },
      { key:'icOnay', label:'İç onay durumu', type:'select', options:['Bekliyor','Onaylandı','Reddedildi'] },
      { key:'musteri', label:'Müşteri', type:'select',
        options:DB.customers.map(function(c){ return { value:c.kod, label:c.kisa }; }) },
      { key:'toplam', label:'Tutar (en az)', type:'text',
        test:function(q,v){ return q.toplam >= (parseFloat(v) || 0); } },
      { key:'tarih', label:'Teklif tarihi', type:'daterange' }
    ],

    rowClass:function(q){ return suresiDolan(q) ? 'is-late' : ''; },

    card:function(q){
      return '<div class="gv-rcard-top"><div><a class="cell-main" href="app-teklif-detay.html?id=' + q.kod + '">' + q.kod + '</a>' +
        '<div class="cell-code">' + GV.esc(q.firma) + '</div></div>' + GV.badge(q.durum) + '</div>' +
        '<div class="gv-rcard-meta"><span>v' + q.versiyon + '</span><span>' + q.kalemSayisi + ' kalem</span>' +
        '<span>' + GV.esc(q.teslimSuresi) + '</span></div>' +
        '<div class="gv-rcard-foot"><span class="cell-money">' + F.money(q.toplam) + '</span>' + GV.dateCell(q.gecerlilik) + '</div>';
    },

    mobile:function(q){
      return '<div class="gv-mrow-top"><a class="cell-main" href="app-teklif-detay.html?id=' + q.kod + '">' + q.kod + '</a>' +
        GV.badge(q.durum) + '</div>' +
        '<div class="gv-mrow-code">' + GV.esc(q.firma) + ' · v' + q.versiyon + '</div>' +
        '<div class="gv-mrow-meta"><span>' + GV.ico('i-user','ic-sm') + GV.esc(DB.empName(q.hazirlayan)) + '</span>' +
        '<span>' + GV.ico('i-calendar','ic-sm') + 'Geçerlilik ' + F.dateShort(q.gecerlilik) + '</span></div>' +
        '<div class="gv-mrow-bottom"><span class="cell-money">' + F.money(q.toplam) + '</span></div>';
    },

    rowActions:[
      { key:'ac', icon:'i-external', label:'Teklifi aç', href:function(q){ return 'app-teklif-detay.html?id=' + q.kod; } },
      { key:'pdf', icon:'i-printer', label:'PDF çıktısı', run:function(q){
          GV.result({ tone:'info', title:'Teklif çıktısı', text:q.kod + ' için PDF çıktısı hazırlanıyor.',
            body:'<p class="u-sm u-muted">Çıktı, listenin “Çıktı Al” akışıyla aynı yazdırma penceresini kullanır.</p>' }); } },
      { key:'revize', icon:'i-copy', label:'Revize teklif oluştur', run:function(q, refresh){
          GV.confirm({ title:'Revize teklif oluştur',
            text:q.kod + ' teklifinin v' + (q.versiyon + 1) + ' sürümü oluşturulacak. Mevcut teklif geçmişte kalır.',
            okLabel:'Oluştur' }).then(function(ok){
              if(!ok) return;
              /* Durum ekranda YAZILMAZ — tek mutasyon noktası `GV.flow.gec` (§6.1).
                 Versiyon ve iç onay sıfırlaması geçişin `ek` yükü olarak gider ki
                 kayıt tek adımda tutarlı kalsın. */
              var r = GV.flow.gec('quote', q.kod, 'Müzakere/Revizyon',
                { versiyon:q.versiyon + 1, icOnay:'Bekliyor' },
                { not:'Revize teklif oluşturuldu — v' + (q.versiyon + 1) });
              if(!r.ok){ GV.toast(flowHata(r), 'danger', 6000); return; }
              GV.toast(q.kod + ' v' + q.versiyon + ' oluşturuldu', 'ok'); refresh(); }); } }
    ],

    bulk:[
      { key:'onay', label:'İç onaya gönder', icon:'i-stamp' },
      { key:'disa', label:'Dışa aktar', icon:'i-download', export:true },
      { key:'arsiv', label:'Arşivle', icon:'i-archive', tone:'danger', confirm:'{n} teklif arşivlenecek. Onaylıyor musunuz?' }
    ],

    emptyState:{ icon:'i-quote', title:'Bu görünümde teklif yok',
      desc:'Filtreleri değiştirebilir veya bir ön analizden yeni teklif oluşturabilirsiniz.',
      action:'<a class="btn btn-acc" href="app-teklif-form.html"><svg class="ic"><use href="#i-plus"></use></svg> Yeni Teklif</a>' }
  });
});
</script>
</body>
</html>
