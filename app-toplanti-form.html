<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Toplantı Planla — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/ui.css">
</head>
<body data-sec="toplanti" data-screen="toplanti">
<div id="rec"></div>

<!-- Okunan koleksiyonların TAMAMININ dosyası yüklenir (ders L-12):
     org.js  → DB.today, DB.employees, DB.empName, DB.depName
     crm.js  → DB.customers
     work.js → DB.projects, DB.tasks, DB.activities
     misc.js → DB.meetings, DB.decisions -->
<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico, mount = document.getElementById('rec');

  /* =================================================================
     MOD — adreste id varsa düzenleme, yoksa yeni kayıt
     ================================================================= */
  var qs      = new URLSearchParams(location.search);
  var id      = qs.get('id');
  var kayit   = id ? DB.meetings.filter(function(x){ return x.kod === id; })[0] : null;
  var duzenle = !!kayit;

  /* Adreste id var ama kayıt yok — uydurma yok, boş forma da düşülmez. */
  if(id && !kayit){
    GV.shell.crumb('Kayıt bulunamadı');
    GV.pageHead({
      eyebrow:'Toplantılar', title:'Kayıt bulunamadı',
      sub:'Düzenlenmek istenen toplantı kaydı sistemde yok.',
      actions:[{ label:'Toplantı listesine dön', cls:'btn-line', href:'app-toplanti.html' }]
    });
    /* GV.empty desc alanını KENDİSİ escape eder — burada ön-escape yapılmaz (UID-23). */
    mount.innerHTML = '<section class="gv-card">' + GV.empty({
      icon:'i-search', title:'Toplantı bulunamadı',
      desc:'“' + id + '” kodlu toplantı bulunamadı. Bağlantı eski olabilir.',
      action:'<a class="btn btn-acc" href="app-toplanti.html">Toplantı listesine dön</a>' }) + '</section>';
    return;
  }

  var basligi = duzenle ? kayit.kod + ' · Düzenle' : 'Toplantı Planla';
  GV.shell.crumb(basligi);
  document.title = basligi + ' — GaviaWorks CRM';

  /* =================================================================
     YETKİ KAPISI — form kurulmadan önce (PROMPT.md §5 · ders L-07)
     Toplantı kaydı finansal tutar ya da maaş alanı taşımaz; kapı yalnız
     ekle / düzenle yetkisine bakar, alan bazlı gizleme yoktur.
     ================================================================= */
  var canYaz = duzenle ? GV.perm.can('duzenle') : GV.perm.can('ekle');

  if(!canYaz){
    GV.pageHead({
      eyebrow:'Toplantılar', title:basligi, sub:'Bu işlem için yetkiniz yok.',
      actions:[{ label:'Toplantı listesine dön', cls:'btn-line', href:'app-toplanti.html' }]
    });
    mount.innerHTML = '<section class="gv-card">' + GV.errorState({
      title:'Bu işlem için yetkiniz yok',
      desc:(duzenle ? 'Toplantı kaydı düzenleme' : 'Toplantı planlama') +
           ' yetkisi rolünüzde (' + GV.session.rolAd + ') tanımlı değil. Toplantıları listede ve ' +
           'toplantı kartında görüntüleyebilir, ancak kaydı değiştiremezsiniz.' }) + '</section>';
    /* GV.errorState kendi “Tekrar dene” butonunu basar; yeniden denenecek bir yükleme
       yok — ölü kontrol bırakmamak için gerçek aksiyonla değiştirilir. */
    var acts403 = mount.querySelector('.gv-state-acts');
    if(acts403){
      acts403.innerHTML = '<a class="btn btn-line" href="app-toplanti.html">Toplantı listesine dön</a>' +
        (duzenle ? ' <a class="btn btn-acc" href="app-toplanti-detay.html?id=' + esc(kayit.kod) +
                   '">Toplantı kartını aç</a>' : '');
    }
    return;                                   /* GV.form HİÇ kurulmaz */
  }

  /* =================================================================
     SABİT KÜMELER — PROMPT.md §19'daki altı toplantı türü
     ================================================================= */
  var TURLER   = ['Müşteri toplantısı','Proje toplantısı','Satış görüşmesi',
                  'Departman toplantısı','Personel görüşmesi','Satın alma görüşmesi'];
  var DURUMLAR = ['Planlandı','Tamamlandı','İptal'];
  var MUSTERILI = ['Müşteri toplantısı','Proje toplantısı'];      /* müşteri bağı zorunlu */
  var IC_TUR    = ['Departman toplantısı','Personel görüşmesi','Satın alma görüşmesi'];
  var SADECE_IC = ['Departman toplantısı','Personel görüşmesi'];  /* dış katılımcı yazılmaz */

  /* =================================================================
     YARDIMCILAR
     ================================================================= */
  function sayi(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function satirlar(v){
    return String(v == null ? '' : v).split(/\r?\n/).map(function(s){ return s.trim(); })
      .filter(function(s){ return s !== ''; });
  }
  function dk(hhmm){
    var p = String(hhmm || '').split(':');
    if(p.length !== 2) return null;
    return (parseInt(p[0], 10) * 60) + parseInt(p[1], 10);
  }
  function saatMetin(m){ return pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60); }
  function sureMetin(d){
    if(d == null) return '—';
    var s = Math.floor(d / 60), k = d % 60;
    return ((s ? s + ' sa' : '') + (k ? (s ? ' ' : '') + k + ' dk' : '')) || '0 dk';
  }
  function ozetListe(rows){
    return '<div class="gv-summary">' + rows.filter(Boolean).map(function(p){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + p[0] + '</span>' +
        '<span class="gv-summary-val">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function sub(t){ return '<span class="cell-sub">' + esc(t) + '</span>'; }
  function kart(baslik, ikon, altBaslik, govde, ustAksiyon){
    return '<section class="gv-card">' +
      '<div class="gc-head"><div><h2 class="gc-title">' + ico(ikon) + esc(baslik) + '</h2>' +
      (altBaslik ? '<div class="gc-sub">' + esc(altBaslik) + '</div>' : '') + '</div>' +
      (ustAksiyon ? '<div class="gc-head-acts">' + ustAksiyon + '</div>' : '') + '</div>' + govde + '</section>';
  }
  function musteriOf(kod){ return kod ? DB.customers.filter(function(c){ return c.kod === kod; })[0] || null : null; }
  function projeOf(kod){ return kod ? DB.proj(kod) || null : null; }
  function gorevOf(kod){ return kod ? DB.tasks.filter(function(t){ return t.kod === kod; })[0] || null : null; }

  /* =================================================================
     ÖLÇÜMLER — ipuçlarındaki sayılar varsayılmaz, veriden sayılır
     ================================================================= */
  var toplamToplanti = DB.meetings.length;
  var turSayim = {};
  TURLER.forEach(function(t){ turSayim[t] = 0; });
  DB.meetings.forEach(function(m){ if(turSayim[m.tur] != null) turSayim[m.tur]++; });
  var kayitsizTur = TURLER.filter(function(t){ return turSayim[t] === 0; });

  var planliSayi = DB.meetings.filter(function(m){ return m.durum === 'Planlandı'; }).length;
  var tamamSayi  = DB.meetings.filter(function(m){ return m.durum === 'Tamamlandı'; }).length;
  var iptalSayi  = DB.meetings.filter(function(m){ return m.durum === 'İptal'; }).length;

  var sureler   = DB.meetings.map(function(m){ return sayi(m.sure); });
  var enKisa    = Math.min.apply(null, sureler);
  var enUzun    = Math.max.apply(null, sureler);
  var ortSure   = Math.round(sureler.reduce(function(s, x){ return s + x; }, 0) / toplamToplanti);

  var gundemSay = DB.meetings.map(function(m){ return (m.gundem || []).length; });
  var enAzGundem = Math.min.apply(null, gundemSay);
  var enCokGundem = Math.max.apply(null, gundemSay);

  var YERLER = [];
  DB.meetings.forEach(function(m){ if(YERLER.indexOf(m.yer) === -1) YERLER.push(m.yer); });

  /* Not alanı ölçümü: veride not YALNIZ tamamlanmış toplantılarda var. */
  var notluSayi        = DB.meetings.filter(function(m){ return !!m.notlar; }).length;
  var notluTamamlanan  = DB.meetings.filter(function(m){ return m.durum === 'Tamamlandı' && !!m.notlar; }).length;

  /* ---- DB.decisions sözleşmesi (components.md §9): kararlar YALNIZ
     durum:'Tamamlandı' toplantılara bağlanır. Ölçülür, varsayılmaz. ---- */
  function mtg(kod){ return DB.meetings.filter(function(m){ return m.kod === kod; })[0] || null; }
  function kararlariOf(kod){ return DB.decisions.filter(function(d){ return d.toplanti === kod; }); }
  var toplamKarar   = DB.decisions.length;
  var kararUyumlu   = DB.decisions.filter(function(d){
    var m = mtg(d.toplanti); return m && m.durum === 'Tamamlandı'; }).length;
  var kararliTamamlanan = DB.meetings.filter(function(m){
    return m.durum === 'Tamamlandı' && kararlariOf(m.kod).length > 0; }).length;
  var acikKararToplam = DB.decisions.filter(function(d){ return d.durum !== 'Tamamlandı'; }).length;

  /* =================================================================
     KAYDIN İLİŞKİLİ KAYITLARI — hepsi veride yazılı tekil bağdan
     ================================================================= */
  var kararlar = duzenle ? kararlariOf(kayit.kod) : [];
  var acikKarar = kararlar.filter(function(d){ return d.durum !== 'Tamamlandı'; });
  var gorevliKarar = kararlar.filter(function(d){ return !!d.gorev; });
  var kararSorumlulari = [];
  kararlar.forEach(function(d){ if(d.sorumlu && kararSorumlulari.indexOf(d.sorumlu) === -1) kararSorumlulari.push(d.sorumlu); });

  var acts = duzenle
    ? DB.activities.filter(function(a){ return a.kayit === kayit.kod; })
        .sort(function(a, b){ return String(b.tarih).localeCompare(String(a.tarih)); })
    : [];

  /* =================================================================
     SAAT KÜMESİ — GV.form'da `time` tipi YOK; yarım saatlik select kurulur.
     Kayıtta ızgaraya düşmeyen bir saat varsa kümeye eklenir (kayıp veri olmaz).
     ================================================================= */
  var SAATLER = [];
  for(var h = 7; h <= 20; h++){ SAATLER.push(pad2(h) + ':00'); SAATLER.push(pad2(h) + ':30'); }
  var kayitSaat = duzenle ? String(kayit.tarih).slice(11,16) : '';
  if(kayitSaat && SAATLER.indexOf(kayitSaat) === -1){
    SAATLER.push(kayitSaat);
    SAATLER.sort();
  }

  /* =================================================================
     ÇAKIŞMA — aynı gün, kesişen saat aralığı, ortak katılımcı.
     İptal edilmiş toplantı çakışma saymaz; düzenlenen kayıt hariç tutulur.
     ================================================================= */
  function cakisanlar(gun, saat, sure, kisiler){
    var b = dk(saat);
    if(!gun || b == null) return [];
    var s = b + sayi(sure);
    var out = [];
    DB.meetings.forEach(function(m){
      if(duzenle && m.kod === kayit.kod) return;
      if(m.durum === 'İptal') return;
      if(String(m.tarih).slice(0,10) !== gun) return;
      var mb = dk(String(m.tarih).slice(11,16));
      if(mb == null) return;
      var ms = mb + sayi(m.sure);
      if(!(b < ms && mb < s)) return;
      var ortak = (m.katilimci || []).filter(function(k){ return kisiler.indexOf(k) !== -1; });
      if(ortak.length) out.push({ m:m, ortak:ortak });
    });
    return out;
  }

  /* =================================================================
     FORM KAYDI — koleksiyondaki ham değerler forma uygun biçime çevrilir.
     `tarih` alanı forma iki parça olarak girer: gün (date) + saat (select).
     Katılımcılar personel başına bir onay kutusudur (multiselect tipi yok).
     ================================================================= */
  var formRec = {
    ad:          duzenle ? kayit.ad : '',
    tur:         duzenle ? kayit.tur : '',
    durum:       duzenle ? kayit.durum : 'Planlandı',
    gun:         duzenle ? String(kayit.tarih).slice(0,10) : DB.today,
    saat:        duzenle ? kayitSaat : '10:00',
    sure:        duzenle ? sayi(kayit.sure) : 60,
    yer:         duzenle ? kayit.yer : '',
    musteri:     duzenle ? (kayit.musteri || '') : '',
    proje:       duzenle ? (kayit.proje || '') : '',
    disKatilimci:duzenle ? (kayit.disKatilimci || []).join('\n') : '',
    gundem:      duzenle ? (kayit.gundem || []).join('\n') : '',
    notlar:      duzenle ? (kayit.notlar || '') : '',
    aktif:       duzenle ? kayit.aktif !== false : true
  };
  DB.employees.forEach(function(e){
    formRec['kat_' + e.kod] = duzenle ? (kayit.katilimci || []).indexOf(e.kod) !== -1 : false;
  });

  function secilenler(d){
    return DB.employees.filter(function(e){ return !!d['kat_' + e.kod]; })
                       .map(function(e){ return e.kod; });
  }

  /* =================================================================
     ÜST BLOKLAR
     ================================================================= */
  var ust = '';

  /* ---- DB.decisions kapsam notu — bu form karar kaydı ÜRETMEZ ---- */
  var kararKapsamNot = GV.notice({
    tone:'neutral', icon:'i-flag',
    title:'Kararlar ve aksiyonlar bu formdan yazılmaz, ayrı ekranda yönetilir',
    text:'Toplantı kararı kaydı (KRR-…) yalnız “Kararlar ve Aksiyonlar” ekranından açılır ve veri ' +
         'sözleşmesi gereği YALNIZ durumu “Tamamlandı” olan toplantılara bağlanır. Bu form toplantının ' +
         'kimliğini, zamanını, katılımcılarını, gündemini ve notunu yazar; karar, sorumlu, termin ve ' +
         'karardan üretilen görev alanlarına dokunmaz. Ölçüm: sistemdeki ' + toplamKarar + ' kararın ' +
         kararUyumlu + ' tanesi tamamlanmış toplantıya bağlı, ' + tamamSayi + ' tamamlanmış toplantının ' +
         kararliTamamlanan + ' tanesinde karar kaydı var; planlı toplantıların hiçbirinde karar yok.',
    actions:[{ label:'Kararlar ve aksiyonlar', href:'app-toplanti-karar.html' }] });

  if(duzenle){
    /* ---- İlişkili kayıt uyarısı (form-brief §8) ---- */
    ust += '<section class="gv-card"><div class="gc-body">' + GV.notice(
      kararlar.length
        ? { tone:acikKarar.length ? 'warn' : 'info',
            icon:acikKarar.length ? 'i-alert' : 'i-info',
            title:'Bu toplantıya bağlı karar kayıtları var',
            text:kayit.kod + ' kaydına bağlı ' + kararlar.length + ' karar kaydı tutuluyor; bunların ' +
                 acikKarar.length + ' tanesi hâlâ açık, ' + gorevliKarar.length +
                 ' tanesi göreve dönüştürülmüş. Kararlar yalnız tamamlanmış toplantılara bağlandığı için ' +
                 'bu kaydın durumu “Tamamlandı” dışına alınamaz. Karar metni, sorumlu ve termin bu formdan ' +
                 'değiştirilmez — karar ekranından yürütülür.',
            actions:[{ label:'Kararları aç', href:'app-toplanti-karar.html?q=' + encodeURIComponent(kayit.kod) },
                     { label:'Toplantı kartını aç', href:'app-toplanti-detay.html?id=' + kayit.kod }] }
        : { tone:'neutral', icon:'i-info', title:'Bu toplantıya bağlı karar kaydı yok',
            text:kayit.kod + ' için sistemde karar kaydı bulunmuyor. ' +
                 (kayit.durum === 'Tamamlandı'
                   ? 'Toplantı tamamlandı ancak karar girilmemiş; kararlar karar ekranından eklenir.'
                   : 'Kararlar toplantı tamamlandıktan sonra, karar ekranından kaydedilir — bu toplantının ' +
                     'durumu “' + kayit.durum + '”.') +
                 ' Ölçüm: ' + tamamSayi + ' tamamlanmış toplantının ' + kararliTamamlanan +
                 ' tanesinde karar kaydı var, sistemde toplam ' + acikKararToplam + ' açık aksiyon izleniyor.',
            actions:[{ label:'Kararlar ve aksiyonlar', href:'app-toplanti-karar.html' },
                     { label:'Toplantı kartını aç', href:'app-toplanti-detay.html?id=' + kayit.kod }] }) +
      '</div></section>';

    /* ---- Bağlam kartı: kayıt özeti (form-brief §8) ---- */
    var son = acts[0];
    var kMus = musteriOf(kayit.musteri);
    var kPrj = projeOf(kayit.proje);
    ust += kart('Kayıt Özeti', 'i-info', null,
      '<div class="gc-body">' + GV.dl([
        ['Toplantı kodu', '<span class="cell-code">' + esc(kayit.kod) + '</span>'],
        ['Başlık', esc(kayit.ad)],
        ['Toplantı türü', '<span class="tag">' + esc(kayit.tur) + '</span>'],
        ['Durum', GV.badge(kayit.durum) + (kayit.aktif === false ? ' <span class="tag">Arşiv</span>' : '')],
        ['Tarih ve saat', GV.dateCell(String(kayit.tarih).slice(0,10), { done:kayit.durum === 'Tamamlandı' }) +
          sub(String(kayit.tarih).slice(11,16) + ' · ' + sureMetin(sayi(kayit.sure)))],
        ['Yer / platform', esc(kayit.yer)],
        ['Müşteri', kMus
          ? '<a href="app-musteri-detay.html?id=' + esc(kMus.kod) + '">' + esc(kMus.kisa) + '</a>' + sub(kMus.kod)
          : null],
        ['Proje', kPrj
          ? '<a href="app-proje-detay.html?id=' + esc(kPrj.kod) + '">' + esc(kPrj.ad) + '</a>' + sub(kPrj.kod)
          : null],
        ['Katılımcı', '<b class="u-num">' + ((kayit.katilimci || []).length + (kayit.disKatilimci || []).length) +
          '</b>' + sub((kayit.katilimci || []).length + ' personel · ' +
                       (kayit.disKatilimci || []).length + ' dış katılımcı')],
        ['Gündem maddesi', '<b class="u-num">' + (kayit.gundem || []).length + '</b>'],
        ['Karar kaydı', kararlar.length
          ? '<b class="u-num">' + kararlar.length + '</b>' +
            sub(acikKarar.length + ' açık · ' + gorevliKarar.length + ' göreve dönüştü')
          : '<span class="u-faint">Karar kaydı yok</span>'],
        ['Toplantı notu', kayit.notlar ? '<span class="cell-wrap">' + esc(kayit.notlar) + '</span>' : null],
        ['Son değiştiren', son ? esc(DB.empName(son.kisi)) + sub(F.dt(son.tarih) + ' · ' + son.metin) : null]
      ]) + '</div>',
      '<a class="btn btn-line btn-sm" href="app-toplanti-detay.html?id=' + esc(kayit.kod) + '">' +
        ico('i-external','ic-sm') + ' Toplantı kartını aç</a>');

  }else{
    ust += '<section class="gv-card"><div class="gc-body">' +
      GV.notice({ tone:'info', title:'Yeni toplantı kaydı oluşturuluyor',
        text:'Kaydettiğinizde sıradaki toplantı kodu atanır, aktivite geçmişine “Toplantı kaydı ' +
             'oluşturuldu” satırı düşer ve toplantı listesine dönülür. Katılımcılara davet gönderme, ' +
             'takvim (ICS) bağlantısı ve online toplantı bağlantısı üretme bu prototipin kapsamı ' +
             'dışındadır; yer alanı serbest metindir. Ölçüm: sistemde ' + toplamToplanti +
             ' toplantı kayıtlı — ' + planliSayi + ' planlı, ' + tamamSayi + ' tamamlanmış, ' +
             iptalSayi + ' iptal.',
        actions:[{ label:'Toplantı listesi', href:'app-toplanti.html' },
                 { label:'Ajanda', href:'app-ajanda.html' },
                 { label:'Kararlar ve aksiyonlar', href:'app-toplanti-karar.html' }] }) + '</div></section>';
  }

  /* =================================================================
     SAYFA KABUĞU
     ================================================================= */
  mount.innerHTML = ust +
    '<section class="gv-card">' +
      '<div class="gc-head"><div><h2 class="gc-title">' + ico('i-users') + 'Toplantı Bilgileri</h2>' +
        '<div class="gc-sub">Toplantı kodu kaydederken atanır · zorunlu alanlar yıldızla işaretlidir.</div></div>' +
        '<div class="gc-head-acts">' +
          '<a class="btn btn-line btn-sm" href="app-ajanda.html">' + ico('i-calendar','ic-sm') +
            ' Ajandada gör</a></div></div>' +
      '<div class="gc-body" id="formMount"></div>' +
    '</section>' +

    '<section class="gv-card">' +
      '<div class="gc-head"><div><h2 class="gc-title">' + ico('i-clock') + 'Plan Özeti</h2>' +
        '<div class="gc-sub">Alanları değiştirdikçe güncellenir: zaman aralığı, katılımcı listesi, ' +
          'gündem ve katılımcı çakışması.</div></div></div>' +
      '<div class="gc-body" id="planOzet"></div>' +
    '</section>' +

    '<section class="gv-card">' +
      '<div class="gc-head"><div><h2 class="gc-title">' + ico('i-flag') + 'Kararlar ve Aksiyonlar</h2>' +
        '<div class="gc-sub">Karar kayıtları bu formdan üretilmez; yalnız tamamlanmış toplantılara ' +
          'bağlanır ve karar ekranında yönetilir.</div></div>' +
        '<div class="gc-head-acts">' +
          '<a class="btn btn-line btn-sm" href="app-toplanti-karar.html' +
            (duzenle ? '?q=' + encodeURIComponent(kayit.kod) : '') + '">' + ico('i-flag','ic-sm') +
            ' Karar ekranını aç</a></div></div>' +

  function zamanMetin(gun, saat, durum){
    if(durum === 'İptal') return '<span class="u-faint">Toplantı iptal edildi</span>';
    if(!gun) return '<span class="u-faint">Tarih seçilmedi</span>';
    var g = F.days(gun);
    if(g < 0)   return '<span class="u-num">' + Math.abs(g) + ' gün önce</span>';
    if(g === 0) return '<b class="u-num">Bugün ' + esc(saat || '') + '</b>';
    if(g <= 3)  return '<b class="u-num">' + g + ' gün kaldı</b>';
    return '<span class="u-num">' + g + ' gün kaldı</span>';
  }

  function planOzetiCiz(){
    var hedef = document.getElementById('planOzet');
    if(!hedef) return;
    var d = form.read();
    var kisiler = secilenler(d);
    var dis = satirlar(d.disKatilimci);
    var g = satirlar(d.gundem);
    var b = dk(d.saat);
    var sureDk = sayi(d.sure);
    var bitis = (b == null) ? null : saatMetin(b + sureDk);
    var cak = cakisanlar(d.gun, d.saat, sureDk, kisiler);
    var mus = musteriOf(d.musteri);
    var prj = projeOf(d.proje);

    var uyari = '';
    if(cak.length){
      uyari = GV.notice({ tone:'warn', icon:'i-alert',
        title:'Katılımcı çakışması var',
        text:'Seçilen zaman aralığında ' + cak.length + ' toplantı daha var ve katılımcılar örtüşüyor: ' +
             cak.map(function(c){
               return c.m.kod + ' (' + String(c.m.tarih).slice(11,16) + ' · ' + c.m.sure + ' dk · ' +
                      c.ortak.map(DB.empName).join(', ') + ')';
             }).join(' · ') + '. Kayıt engellenmez; kaydetmeden önce onayınız istenir.' });
    }else if(kisiler.length){
      uyari = GV.notice({ tone:'ok', icon:'i-check-circle',
        title:'Seçilen aralıkta katılımcı çakışması yok',
        text:'Aynı gün ve kesişen saat aralığında, seçilen ' + kisiler.length +
             ' personelin başka bir toplantı kaydı bulunmuyor. İptal edilmiş toplantılar çakışma sayılmaz.' });
    }else{
      uyari = GV.notice({ tone:'neutral', icon:'i-users',
        title:'Henüz personel katılımcı seçilmedi',
        text:'Katılımcı seçildikçe aynı gün ve saat aralığındaki toplantılarla çakışma burada ölçülür.' });
    }

    hedef.innerHTML = uyari + ozetListe([
      ['Zaman aralığı', d.gun
        ? GV.dateCell(d.gun, { done:d.durum === 'Tamamlandı' }) +
          sub((d.saat || '—') + (bitis ? ' – ' + bitis : '') + ' · ' + sureMetin(sureDk))
        : '<span class="u-faint">Tarih ve saat seçilmedi</span>'],
      ['Zaman durumu', zamanMetin(d.gun, d.saat, d.durum)],
      ['Tür ve durum', (d.tur ? '<span class="tag">' + esc(d.tur) + '</span> ' : '') +
        (d.durum ? GV.badge(d.durum) : '<span class="u-faint">—</span>')],
      ['Yer / platform', d.yer ? esc(d.yer) : '<span class="u-faint">Girilmedi</span>'],
      ['Bağlam', mus
        ? esc(mus.kisa) + (prj ? sub(prj.ad + ' · ' + prj.kod) : sub('proje bağı yok'))
        : '<span class="u-faint">İç toplantı — müşteri ve proje bağı yok</span>'],
      ['Katılımcı', '<b class="u-num">' + (kisiler.length + dis.length) + '</b>' +
        sub(kisiler.length + ' personel · ' + dis.length + ' dış katılımcı')],
      kisiler.length
        ? ['Seçilen personel', '<span class="u-row u-wrap">' + kisiler.map(function(k){
            return '<span class="tag">' + esc(DB.empName(k)) + '</span>'; }).join('') + '</span>']
        : null,
      dis.length
        ? ['Dış katılımcı', '<span class="u-row u-wrap">' + dis.map(function(x){
            return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</span>']
        : null,
      ['Gündem maddesi', g.length
        ? '<b class="u-num">' + g.length + '</b>' + sub(g.join(' · '))
        : '<span class="u-faint">Gündem girilmedi</span>'],
      ['Toplantı notu', String(d.notlar || '').trim()
        ? '<span class="cell-wrap">' + esc(String(d.notlar).trim()) + '</span>'
        : '<span class="u-faint">' + (d.durum === 'Tamamlandı'
            ? 'Tamamlanmış toplantıda not zorunludur' : 'Toplantı sonrası yazılır') + '</span>'],
      ['Kayıt durumu', d.aktif ? GV.badge('Aktif') : GV.badge('Arşiv')]
    ]);

      ]) + '</div>';
    }
    hedef.innerHTML = blok;

    tarih:'Tarih ve saat', sure:'Süre', yer:'Yer / platform', katilimci:'Personel katılımcılar',
    disKatilimci:'Dış katılımcılar', gundem:'Gündem maddeleri', durum:'Toplantı durumu',
    notlar:'Toplantı notu', aktif:'Kayıt durumu'

  /* Tarih DB.today'den gelir; new Date() ile bugün alınmaz. */
  function simdi(){ return DB.today + 'T' + new Date().toTimeString().slice(0,5); }

  /* Yeni kod dizi uzunluğundan değil, en yüksek mevcut numaradan üretilir. */
  function yeniKod(){
    var max = 0;
    DB.meetings.forEach(function(m){
      var x = /^TOP-\d{4}-(\d+)$/.exec(m.kod || '');
      if(x) max = Math.max(max, parseInt(x[1], 10));
    });
    var n = String(max + 1);
    while(n.length < 3) n = '0' + n;
    return 'TOP-' + String(DB.today).slice(0,4) + '-' + n;
  }

  /* Karşılaştırma normalleştirmesi: dizi, boş metin, null ve false aynı kovaya düşer. */
  function norm(x){
    if(x == null || x === false || x === '') return '';
    if(Object.prototype.toString.call(x) === '[object Array]') return x.join('|');
    return String(x);
  }
  function gorunur(k, v){
    if(v == null || v === '') return '—';
    if(k === 'katilimci') return (v || []).map(DB.empName).join(', ') || '—';
    if(k === 'disKatilimci' || k === 'gundem') return (v || []).join(' · ') || '—';
    if(k === 'musteri') return (musteriOf(v) || {}).kisa || String(v);
    if(k === 'proje')   return (projeOf(v) || {}).ad || String(v);
    if(k === 'tarih')   return F.dt(v);
    if(k === 'sure')    return sureMetin(sayi(v));
    if(k === 'aktif')   return v ? 'Aktif kayıt' : 'Arşivlendi';
    return String(v);
  }

  function degerleriOku(){
    var raw = form.submit();
    if(!raw) return null;
    return {
      ad:String(raw.ad || '').trim(),
      tur:raw.tur,
      musteri:raw.musteri || null,
      proje:raw.proje || null,
      tarih:raw.gun + 'T' + raw.saat,
      sure:Math.round(sayi(raw.sure)),
      yer:String(raw.yer || '').trim(),
      katilimci:secilenler(raw),
      disKatilimci:satirlar(raw.disKatilimci),
      gundem:satirlar(raw.gundem),
      durum:raw.durum,
      notlar:String(raw.notlar || '').trim(),
      aktif:!!raw.aktif
    };
  }

  /* Bu form karar kaydı, görev ve davet YAZMAZ. Girilen değerler bağlı kayıtlarla
     çelişiyorsa kullanıcı kaydetmeden önce açıkça uyarılır. */
  function dengeUyarilari(v){
    var out = [];
    var cak = cakisanlar(String(v.tarih).slice(0,10), String(v.tarih).slice(11,16), v.sure, v.katilimci);
    if(cak.length){
      out.push(cak.length + ' toplantı aynı gün ve kesişen saatte, ortak katılımcılarla kayıtlı: ' +
               cak.map(function(c){ return c.m.kod + ' · ' + c.ortak.map(DB.empName).join(', '); }).join(' | ') + '.');
    }
    if(duzenle && kararSorumlulari.length){
      var dusen = kararSorumlulari.filter(function(k){ return v.katilimci.indexOf(k) === -1; });
      if(dusen.length){
        out.push('Bu toplantının kararlarından sorumlu ' + dusen.map(DB.empName).join(', ') +
                 ' katılımcı listesinden çıkarılıyor; karar kayıtlarındaki sorumluluk bu işlemle değişmez.');
      }
    }
    if(!duzenle && v.durum === 'Tamamlandı'){
      out.push('Toplantı doğrudan “Tamamlandı” olarak açılıyor. Karar kaydı bu formdan üretilmez; ' +
               'alınan kararlar karar ekranından eklenmelidir.');
    }
    if(v.durum !== 'Tamamlandı' && v.notlar){
      out.push('Toplantı durumu “' + v.durum + '” ancak not yazılmış. Veride not yalnız tamamlanmış ' +
               'toplantılarda tutuluyor (' + notluSayi + ' notun ' + notluTamamlanan + ' tanesi).');
    }
    if(duzenle && v.durum === 'İptal' && kayit.durum !== 'İptal'){
      out.push('Toplantı iptal ediliyor; katılımcılara bildirim gönderme bu prototipin kapsamı dışındadır.');
    }
    return out;
  }

  function yaz(v){
    if(duzenle){
      /* Aktivite kaydı yalnız DEĞİŞEN alanlar için yazılır (PROMPT.md §28). */
      var degisen = 0;
      ALAN_SIRA.forEach(function(k){
        if(norm(kayit[k]) === norm(v[k])) return;
        DB.activities.unshift({
          kayit:kayit.kod, tarih:simdi(), kisi:GV.session.emp,
          metin:'Alan güncellendi: ' + (ALAN_ADI[k] || k),
          eski:gorunur(k, kayit[k]), yeni:gorunur(k, v[k]),
          tone:'accent', icon:'i-edit'
        });
        kayit[k] = v[k];
        degisen++;
      });
      GV.toast(degisen
        ? kayit.kod + ' güncellendi · ' + degisen + ' alan'
        : 'Değişiklik yok — kayıt olduğu gibi bırakıldı', degisen ? 'ok' : 'info');
    }else{
      var kod = yeniKod();
      /* Anahtar sırası koleksiyondaki kayıtlarla aynı tutulur; `notlar` veride yalnız
         tamamlanmış toplantılarda bulunduğu için boşsa hiç açılmaz. */
      var yeni = {
        kod:kod, ad:v.ad, tur:v.tur, musteri:v.musteri, proje:v.proje,
        tarih:v.tarih, sure:v.sure, yer:v.yer,
        katilimci:v.katilimci, disKatilimci:v.disKatilimci, gundem:v.gundem,
        durum:v.durum, aktif:v.aktif
      };
      if(v.notlar) yeni.notlar = v.notlar;

      DB.meetings.unshift(yeni);
      DB.activities.unshift({
        kayit:kod, tarih:simdi(), kisi:GV.session.emp,
        metin:'Toplantı kaydı oluşturuldu — ' + v.ad + ' · ' + v.tur + ' · ' + F.dt(v.tarih) +
              ' · ' + v.katilimci.length + ' personel katılımcı',
        eski:null, yeni:kod, tone:'ok', icon:'i-plus'
      });
      GV.toast(kod + ' oluşturuldu', 'ok');
    }

    form.setDirty(false);
    /* location.reload() YASAK (ders L-15) — normal akış listeye dönmektir. */
    setTimeout(function(){ location.href = 'app-toplanti.html'; }, 700);
  }

  function kaydet(){
    var v = degerleriOku();
    if(!v) return;

    var uyari = dengeUyarilari(v);
    if(!uyari.length){ yaz(v); return; }

    /* form.submit() dirty bayrağını düşürdü; onay verilmezse kaydedilmemiş
       değişiklik uyarısı geri konur. */
    GV.confirm({
      tone:'warn', title:'Kaydetmeden önce onaylayın',
      okLabel:'Yine de kaydet', cancelLabel:'Vazgeç',
      text:uyari.join(' ') + ' Kaydederseniz toplantı kaydı yeni değerlerle yazılır, bağlı karar ' +
           'kayıtları olduğu gibi kalır.'
    }).then(function(ok){
      if(ok){ yaz(v); return; }
      form.setDirty(true);
      GV.toast('Kaydedilmedi — kayıt olduğu gibi bırakıldı', 'info');
    });
  }

  GV.pageHead({
    eyebrow:'Toplantılar',
    title:basligi,
    sub: duzenle
      ? 'Kayıt üzerinde yapılan değişiklikler aktivite geçmişine yazılır · ' + alanSayisi + ' alan.'
      : 'Zorunlu alanlar yıldızla işaretlidir · ' + alanSayisi + ' alan, ' + zorunlu.length + ' zorunlu.',
    actions:[
      { label:'Vazgeç', cls:'btn-line', href:'app-toplanti.html' },
      { label: duzenle ? 'Değişiklikleri kaydet' : 'Kaydet', cls:'btn-acc', icon:'i-check', run:kaydet }
    ]
  });

  /* Mount İÇİNDEKİ düğüm — GV.refresh() taze kopyayla değiştirir (ders L-16). */
  var altBtn = document.getElementById('kaydetAlt');
  if(altBtn) altBtn.addEventListener('click', kaydet);
});
</script>
</body>
</html>
