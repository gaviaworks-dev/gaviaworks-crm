<script>
/* =====================================================================
   HAM ONAY SAYACI ANLIK GÖRÜNTÜSÜ — [17.0.6] ölçülebilsin diye.

   `domain.js` yüklenirken `GV.approval.tazeleSayaclar()` çalışır ve
   `DB.purchases[].onayAdim / onayToplam` alanlarını onay zincirinden
   YENİDEN TÜRETİP ÜZERİNE YAZAR. Bu doğru davranıştır (şartname [6.3.10]:
   sayaç değil türetim) — ama yan etkisi şudur: sayfa kodu çalışmaya
   başladığında elle yazılmış sayaç ARTIK YOKTUR, kayıt zincirle birebir
   uyumlu görünür ve "elle tutulmuş sayaç" kontrolü hep sıfır bulgu verir.

   Sıfır bulgu ile ölçülememe aynı şey değildir (L-13 · L-25). Bu yüzden
   ham değerler motor devreye girmeden ÖNCE, veri dosyalarından okunduğu
   hâliyle burada dondurulur. Bu blok veriye hiçbir şey yazmaz; yalnız
   okur. Sıra önemlidir: bu script veri dosyalarından SONRA, `shell.js` ve
   `domain.js`'ten ÖNCE durmak zorundadır.
   ===================================================================== */
window.__DQ_HAM_ONAY = (function(){
  if(!window.DB || !DB.purchases) return null;
  return DB.purchases.map(function(p){
    return { kod:p.kod, onayAdim:p.onayAdim, onayToplam:p.onayToplam };
  });
})();
</script>

<script>
document.addEventListener('gv:ready', function(){
  var F = GV.fmt, esc = GV.esc, ico = GV.ico;

  var ROL   = GV.perm.role();
  var rolAd = DB.roleName(ROL);

  /* Şartname: sayfa `sahip` / `genelmudur` / `sistem` rollerine açılır.
     Yetki matrisi ekseni değil ROL eksenidir: veri kalitesi taraması tüm
     modüllerin ham kayıtlarını yan yana koyar; "kendi kayıtları" diye bir
     kapsamı yoktur, o yüzden kapsamlı rollere hiç açılmaz. */
  var ACIK_ROLLER = ['sahip','genelmudur','sistem'];
  var yetkili = ACIK_ROLLER.indexOf(ROL) !== -1;

  GV.pageHead({
    eyebrow:'Ayarlar', title:'Veri Kalitesi ve Sistem Sağlığı',
    sub:'On iki tutarlılık kontrolü · tarama anı ' + F.date(DB.today),
    actions:[
      { label:'Log Kayıtları',   icon:'i-list',     href:'app-ayar-log.html' },
      { label:'Onay Akışları',   icon:'i-stamp',    href:'app-ayar-onay.html' },
      { label:'Arşiv',           icon:'i-archive',  href:'app-ayar-arsiv.html' }
    ]
  });

  /* =================================================================
     YETKİ KAPISI — `GV.guardRecord`in liste karşılığı.
     Yetkisiz rolde tarama HİÇ ÇALIŞTIRILMAZ: bulgu metinleri kayıt
     kodu, müşteri unvanı, sözleşme tutarı ve personel kodu taşır;
     "listeyi gizle ama hesabı yap" burada sızıntı yüzeyidir.
     ================================================================= */
  if(!yetkili){
    document.getElementById('uyari').innerHTML = '<div class="u-mb-4">' + GV.notice({
      tone:'warn', icon:'i-lock', title:'Veri kalitesi taramasına erişim yetkiniz yok',
      text:'“' + rolAd + '” rolü bu ekranı açamaz. Tarama; müşteri, sözleşme, fatura, personel ve ' +
           'zimmet kayıtlarını tek listede yan yana koyar ve her bulguda kayıt kodunu, ilgili tutarı ve ' +
           'sorumlusunu yazar. Bu nedenle ekran yalnız sahip, genel müdür ve sistem yöneticisi rollerine ' +
           'açıktır. Yetkisiz rolde tarama başlatılmaz — liste gizlenmez, hiç hesaplanmaz.',
      actions:[{ label:'Ana Panele Dön', href:'app-panel.html', cls:'btn-line' },
               { label:'Yetki Matrisi',  href:'app-ayar-yetki.html', cls:'btn-line' }]
    }) + '</div>';

    document.getElementById('liste').innerHTML = '<div class="gv-card">' + GV.empty({
      icon:'i-lock', title:'Tarama çalıştırılmadı',
      desc:'Bu rolde kontrol motoru hiç kurulmaz; bulgu sayısı, kontrol karnesi ve çıktı alma da dâhil ' +
           'hiçbir veri bu ekrana gelmez. Erişim gerekiyorsa sistem yöneticinizden veri kalitesi ' +
           'ekranı yetkisi isteyin.'
    }) + '</div>';
    return;
  }

  /* =================================================================
     ORTAK YARDIMCILAR
     ================================================================= */
  /* Bu veri setinde boş değer üç biçimde yazılır: null, '' ve '—'.
     Üçünü de boş saymayan her kural yalancı bulgu üretir (ilk turda
     iki tedarikçinin '—' vergi numarası "mükerrer vergi no" çıkmıştı). */
  function bos(v){ return v == null || v === '' || v === '—' || v === '-'; }

  /* Unvan karşılaştırmasında şirket eki gürültüdür: "Deniz Lojistik A.Ş."
     ile "Deniz Lojistik Ltd. Şti." aynı firmanın iki yazımı olabilir. */
  function norm(s){
    return String(s || '').toLocaleLowerCase('tr')
      .replace(/[.,]/g, ' ')
      .replace(/\b(a\s*ş|ltd|şti|sti|inc)\b/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }

  function gecmis(d){ return !bos(d) && String(d) < DB.today; }

  /* Kayıt kodundan ekran adresi. Yayında olmayan hedefleri `GV.isBuilt`
     eler; sahte bağlantı bırakılmaz. */
  var HREF = {
    'MUS-':'app-musteri-detay.html?id=',      'YTK-':'app-musteri-yetkili.html?q=',
    'LEAD-':'app-lead-detay.html?id=',        'ANL-':'app-onanaliz-detay.html?id=',
    'TKL-':'app-teklif-detay.html?id=',       'REF-':'app-referans-detay.html?id=',
    'KOM-':'app-komisyon-detay.html?id=',     'ILT-':'app-musteri-iletisim.html?q=',
    'PRJ-':'app-proje-detay.html?id=',        'MOD-':'app-proje-detay.html?id=',
    'MS-':'app-odemeplani.html?q=',           'PMS-':'app-proje-milestone.html?q=',
    'SPR-':'app-proje-sprint.html?q=',        'GRV-':'app-gorev-detay.html?id=',
    'HTA-':'app-proje-hata-detay.html?id=',   'TST-':'app-proje-test-detay.html?id=',
    'TSL-':'app-proje-teslim-detay.html?id=', 'DGS-':'app-proje-degisiklik-detay.html?id=',
    'TLP-':'app-istalebi-detay.html?id=',     'ONY-':'app-panel-onaylar.html?q=',
    'SZL-':'app-sozlesme-detay.html?id=',     'FTR-':'app-fatura-detay.html?id=',
    'THS-':'app-tahsilat-detay.html?id=',     'DST-':'app-destek-detay.html?id=',
    'BKP-':'app-destek-paket.html?q=',        'ANK-':'app-destek-memnuniyet.html?q=',
    'DMB-':'app-demirbas-detay.html?id=',     'ZMT-':'app-zimmet.html?q=',
    'ARC-':'app-arac-detay.html?id=',         'PLC-':'app-arac-sigorta.html?q=',
    'MYN-':'app-arac-muayene.html?q=',        'BKM-':'app-arac-bakim.html?q=',
    'SAT-':'app-satinalma-detay.html?id=',    'SIP-':'app-siparis-detay.html?id=',
    'TDR-':'app-tedarikci-detay.html?id=',    'DOK-':'app-dokuman-detay.html?id=',
    'EMP-':'app-personel-detay.html?id=',     'IZN-':'app-izin-detay.html?id=',
    'ZMN-':'app-zaman.html?q=',               'TSH-':'app-zaman-onay.html?q=',
    'DEP-':'app-ayar-departman.html?q=',      'TOP-':'app-toplanti-detay.html?id=',
    'KRR-':'app-toplanti-karar.html?q=',      'ENT-':'app-ayar-entegrasyon.html?q=',
    'BTC-':'app-butce.html?q='
  };
  function kayitHref(kod){
    if(!kod) return null;
    var p = Object.keys(HREF).filter(function(x){ return String(kod).indexOf(x) === 0; })
                  .sort(function(a,b){ return b.length - a.length; })[0];
    return p ? HREF[p] + encodeURIComponent(kod) : null;
  }
  function kayitBag(kod){
    var h = kayitHref(kod);
    return h ? '<a href="' + h + '">' + esc(kod) + '</a>' : '<span class="u-num">' + esc(kod) + '</span>';
  }

  /* Kaydın sorumlusu — [17.0.12] "sorumlu" alanı. Her koleksiyonda farklı
     adla durur; UYDURULMAZ, bulunamazsa boş bırakılır. */
  var TUM_KOD = {};
  Object.keys(DB).forEach(function(k){
    if(!Array.isArray(DB[k])) return;
    DB[k].forEach(function(r){ if(r && r.kod && !TUM_KOD[r.kod]) TUM_KOD[r.kod] = { kol:k, rec:r }; });
  });
  var SORUMLU_ALAN = ['sorumlu','pm','hazirlayan','talepEden','onaylayan','yukleyen',
                      'personel','olusturan','veren','yonetici','acan','kisi','surucu','zimmetli'];
  function kayitSorumlu(kod){
    var t = TUM_KOD[kod]; if(!t) return null;
    for(var i = 0; i < SORUMLU_ALAN.length; i++){
      var v = t.rec[SORUMLU_ALAN[i]];
      if(!bos(v) && /^EMP-/.test(String(v))) return v;
    }
    return null;
  }
  function kayitModul(kod){
    var t = TUM_KOD[kod]; if(!t) return '—';
    return MODUL_AD[t.kol] || t.kol;
  }
  var MODUL_AD = {
    customers:'Müşteri', contacts:'Müşteri', interactions:'Müşteri', referrers:'Satış',
    leads:'Satış', analyses:'Satış', quotes:'Satış', commissions:'Satış',
    projects:'Proje', projectModules:'Proje', milestones:'Finans', projectMilestones:'Proje',
    sprints:'Proje', tasks:'Görev', deptRequests:'Görev', bugs:'Proje', tests:'Proje',
    deliveries:'Proje', changeRequests:'Proje', approvals:'Onay',
    assets:'Varlık', assignments:'Varlık', vehicles:'Filo', maintenance:'Filo',
    inspections:'Filo', policies:'Filo', fuelLogs:'Filo', vehicleExpenses:'Filo',
    accidents:'Filo', fines:'Filo', suppliers:'Satın Alma', purchases:'Satın Alma',
    orders:'Satın Alma', tickets:'Destek', supportPackages:'Destek', surveys:'Destek',
    leaves:'Personel', timelogs:'Personel', timesheets:'Personel', performance:'Personel',
    trainings:'Personel', onboarding:'Personel', employees:'Personel', departments:'Ayarlar',
    contracts:'Finans', invoices:'Finans', payments:'Finans',
    meetings:'Toplantı', decisions:'Toplantı', documents:'Doküman',
    integrations:'Ayarlar', capacity:'Personel'
  };

  /* Kaydın olay geçmişindeki ilk ve son hareket — [17.0.12] "ilk / son
     görülme"nin bu prototipteki DÜRÜST karşılığı. Tarama geçmişi
     saklanmadığı için bulgunun kendisinin ne zaman doğduğu bilinmez;
     bilinen şey ETKİLENEN KAYDIN ne zaman dokunulduğudur ve kolon adı
     da bunu söyler. Uydurma bir "ilk tespit" tarihi yazılmaz. */
  var AKT = {};
  (DB.activities || []).forEach(function(a){ (AKT[a.kayit] = AKT[a.kayit] || []).push(a); });
  function hareket(kodlar){
    var t = [];
    (kodlar || []).forEach(function(k){
      (AKT[k] || []).forEach(function(a){ if(a.tarih) t.push(String(a.tarih)); });
    });
    if(!t.length) return { ilk:null, son:null };
    t.sort();
    return { ilk:t[0], son:t[t.length - 1] };
  }

  /* =================================================================
     KONTROL MOTORU
     Her kontrol `{ olculdu, kapsam, neden, bulgular[] }` döndürür.
     `olculdu:false` ⇒ KONTROL YAPILAMADI. "Geçti" DEĞİL, "temiz" DEĞİL.
     Ölçülemeyen kontrolün bulgusu da sıfırdır; ikisini aynı yeşile
     yazmak, olmayan bir güvenceyi rapor etmek olurdu (L-13 · L-25).
     ================================================================= */
  function yeniKontrol(){ return { bulgular:[], olculdu:true, kapsam:'', neden:null }; }
  function ekle(K, o){
    /* kayitlar: bulgu bir ilişkiden doğduğunda birden çok kayıt taşır
       (ör. iki mükerrer müşteri). İlk kod birincil kayıttır. */
    K.bulgular.push({
      onem:o.onem, kural:o.kural, kayitlar:o.kayitlar, aciklama:o.aciklama,
      oto:!!o.oto, otoNot:o.otoNot || null
    });
  }

  var KONTROLLER = [];

  /* -----------------------------------------------------------------
     [17.0.2] · K1 — Kaynaksız / yetim bağlı kayıt
     Bir alan dolu ama işaret ettiği kayıt yok. Harita elle yazılır;
     "her *-kodlu alan yabancı anahtardır" varsayımı yanlış bulgu üretir
     (`orders.fatura` tedarikçinin kendi fatura numarasıdır, bizim
     `DB.invoices` kaydımız değildir; `automations.kullanici` bir rol
     tarifidir, personel kodu değildir).
     ----------------------------------------------------------------- */
  var BAG = [
    ['customers','sorumlu','employees'], ['customers','referans','referrers'],
    ['contacts','musteri','customers'],
    ['leads','musteri','customers'], ['leads','referans','referrers'],
    ['leads','sorumlu','employees'], ['leads','destek','tickets'],
    ['analyses','lead','leads'], ['analyses','hazirlayan','employees'],
    ['quotes','musteri','customers'], ['quotes','lead','leads'],
    ['quotes','analiz','analyses'], ['quotes','hazirlayan','employees'],
    ['quoteItems','teklif','quotes'],
    ['interactions','musteri','customers'], ['interactions','lead','leads'],
    ['interactions','kisi','employees'], ['interactions','kontak','contacts'],
    ['commissions','referans','referrers'], ['commissions','musteri','customers'],
    ['referrers','kontak','contacts'], ['referrers','sorumlu','employees'],
    ['projects','musteri','customers'], ['projects','pm','employees'],
    ['projects','teknikSorumlu','employees'], ['projects','musteriSorumlu','employees'],
    ['projectModules','proje','projects'], ['projectModules','sorumlu','employees'],
    ['milestones','proje','projects'], ['milestones','sozlesme','contracts'],
    ['milestones','milestone','projectMilestones'],
    ['projectMilestones','proje','projects'], ['projectMilestones','sorumlu','employees'],
    ['sprints','proje','projects'],
    ['tasks','proje','projects'], ['tasks','modul','projectModules'], ['tasks','sprint','sprints'],
    ['tasks','musteri','customers'], ['tasks','dep','departments'], ['tasks','olusturan','employees'],
    ['tasks','veren','employees'], ['tasks','sorumlu','employees'], ['tasks','kontrolEden','employees'],
    ['tasks','onaylayan','employees'], ['tasks','destek','tickets'],
    ['subtasks','ustGorev','tasks'], ['subtasks','sorumlu','employees'],
    ['checklists','gorev','tasks'], ['taskDeps','gorev','tasks'], ['taskDeps','bagimli','tasks'],
    ['deptRequests','talepEdenDep','departments'], ['deptRequests','talepEdilenDep','departments'],
    ['deptRequests','talepEden','employees'], ['deptRequests','sorumlu','employees'],
    ['deptRequests','musteri','customers'], ['deptRequests','proje','projects'],
    ['bugs','proje','projects'], ['bugs','gorev','tasks'], ['bugs','bulan','employees'],
    ['bugs','sorumlu','employees'], ['bugs','sprint','sprints'], ['bugs','destek','tickets'],
    ['bugs','test','tests'],
    ['tests','proje','projects'], ['tests','sorumlu','employees'], ['tests','sprint','sprints'],
    ['deliveries','proje','projects'], ['deliveries','milestone','milestones'],
    ['deliveries','teslimEden','employees'], ['deliveries','test','tests'],
    ['changeRequests','proje','projects'], ['changeRequests','sorumlu','employees'],
    ['changeRequests','destek','tickets'],
    ['approvals','talepEden','employees'], ['approvals','onaylayan','employees'],
    ['assets','tedarikci','suppliers'], ['assets','dep','departments'],
    ['assets','zimmetli','employees'], ['assets','siparis','orders'],
    ['assignments','demirbas','assets'], ['assignments','personel','employees'],
    ['assignments','iadeAlan','employees'],
    ['vehicles','anaSurucu','employees'], ['vehicles','yedekSurucu','employees'],
    ['vehicles','dep','departments'], ['vehicles','proje','projects'], ['vehicles','siparis','orders'],
    ['maintenance','arac','vehicles'], ['inspections','arac','vehicles'],
    ['policies','arac','vehicles'], ['fuelLogs','arac','vehicles'], ['fuelLogs','surucu','employees'],
    ['vehicleExpenses','arac','vehicles'], ['accidents','arac','vehicles'],
    ['accidents','surucu','employees'], ['fines','arac','vehicles'], ['fines','surucu','employees'],
    ['purchases','talepEden','employees'], ['purchases','dep','departments'],
    ['purchases','proje','projects'],
    ['purchaseApprovals','talep','purchases'], ['purchaseApprovals','kisi','employees'],
    ['supplierQuotes','talep','purchases'], ['supplierQuotes','tedarikci','suppliers'],
    ['orders','talep','purchases'], ['orders','tedarikci','suppliers'],
    ['orderLines','siparis','orders'], ['orderReturns','siparis','orders'],
    ['tickets','musteri','customers'], ['tickets','proje','projects'],
    ['tickets','sorumlu','employees'], ['tickets','acan','contacts'],
    ['tickets','cozenPersonel','employees'],
    ['supportPackages','musteri','customers'], ['supportPackages','proje','projects'],
    ['supportPackages','sozlesme','contracts'], ['supportPackages','sorumlu','employees'],
    ['surveys','musteri','customers'],
    ['leaves','personel','employees'], ['leaves','vekil','employees'], ['leaves','onaylayan','employees'],
    ['timelogs','personel','employees'], ['timelogs','gorev','tasks'], ['timelogs','proje','projects'],
    ['timelogs','musteri','customers'], ['timelogs','modul','projectModules'],
    ['timesheets','personel','employees'], ['timesheets','onaylayan','employees'],
    ['performance','personel','employees'], ['capacity','personel','employees'],
    ['onboarding','personel','employees'], ['onboarding','sorumlu','employees'],
    ['salaryHistory','personel','employees'],
    ['contracts','musteri','customers'], ['contracts','teklif','quotes'],
    ['contracts','proje','projects'], ['contracts','sorumlu','employees'],
    ['invoices','musteri','customers'], ['invoices','sozlesme','contracts'],
    ['invoices','proje','projects'], ['invoices','milestone','milestones'],
    ['payments','fatura','invoices'], ['payments','musteri','customers'],
    ['payments','sorumlu','employees'],
    ['paymentAllocations','tahsilat','payments'], ['paymentAllocations','fatura','invoices'],
    ['meetings','musteri','customers'], ['meetings','proje','projects'],
    ['decisions','toplanti','meetings'], ['decisions','sorumlu','employees'],
    ['decisions','gorev','tasks'],
    ['documents','musteri','customers'], ['documents','proje','projects'],
    ['documents','arac','vehicles'], ['documents','yukleyen','employees'],
    ['documentVersions','dokuman','documents'], ['documentVersions','yukleyen','employees'],
    ['documentApprovals','dokuman','documents'], ['documentApprovals','kisi','employees'],
    ['channels','proje','projects'], ['channels','dep','departments'],
    ['messages','kanal','channels'], ['messages','kisi','employees'], ['messages','gorev','tasks'],
    ['reminders','gonderen','employees'],
    ['notifications','kisi','employees'], ['announcements','yazan','employees'],
    ['announcements','dep','departments'],
    ['logs','kisi','employees'], ['activities','kisi','employees'],
    ['employees','dep','departments'], ['employees','yonetici','employees'],
    ['departments','yonetici','employees']
  ];
  var BAG_DIZI = [
    ['projects','ekip','employees'], ['tasks','yardimci','employees'],
    ['tasks','izleyiciler','employees'], ['channels','uyeler','employees'],
    ['trainings','katilimci','employees'], ['meetings','katilimci','employees'],
    ['announcements','okuyanlar','employees']
  ];
  /* Onay kuyruğu kaydı hangi koleksiyona bakar — türü söyler. */
  var ONAY_KOL = {
    'Satın alma talebi':'purchases', 'İzin talebi':'leaves', 'Teklif iç onayı':'quotes',
    'Görev onayı':'tasks', 'Değişiklik talebi':'changeRequests', 'Ön analiz onayı':'analyses',
    'Komisyon kazancı':'commissions', 'Timesheet onayı':'timesheets'
  };

  function kontrol1(){
    var K = yeniKontrol(), kodSeti = {}, tarandi = 0;
    function var_(kol, kod){
      if(!kodSeti[kol]) kodSeti[kol] = (DB[kol] || []).reduce(function(m, r){ m[r.kod] = 1; return m; }, {});
      return !!kodSeti[kol][kod];
    }
    function yetim(kayitKod, kol, alan, deger, hedef){
      ekle(K, { onem:'Kritik', kural:'Yetim yabancı anahtar',
        kayitlar:[kayitKod],
        aciklama:'`' + kol + '.' + alan + '` alanı “' + deger + '” değerini taşıyor, ama bu kodda bir ' +
                 hedef + ' kaydı yok. Kaynağı olmayan bağ, kaydı açan her ekranda “—” ya da boş ad ' +
                 'olarak görünür ve raporlarda sessizce dışarıda kalır.',
        oto:false, otoNot:'Otomatik düzeltilemez: doğru hedef kaydın hangisi olduğu veriden türetilemez. ' +
                          'Bağ ya elle düzeltilir ya da kopartılır.' });
    }
    BAG.forEach(function(b){
      var kol = b[0], alan = b[1], hedef = b[2];
      (DB[kol] || []).forEach(function(r){
        var v = r[alan];
        if(bos(v)) return;
        tarandi++;
        if(!var_(hedef, v)) yetim(r.kod || (kol + ':' + alan), kol, alan, v, hedef);
      });
    });
    BAG_DIZI.forEach(function(b){
      var kol = b[0], alan = b[1], hedef = b[2];
      (DB[kol] || []).forEach(function(r){
        (Array.isArray(r[alan]) ? r[alan] : []).forEach(function(v){
          if(bos(v)) return;
          tarandi++;
          if(!var_(hedef, v)) yetim(r.kod || kol, kol, alan + '[]', v, hedef);
        });
      });
    });
    /* Onay kuyruğu → kaynak kayıt (tür bazlı hedef) */
    (DB.approvals || []).forEach(function(a){
      var kol = ONAY_KOL[a.tur];
      tarandi++;
      if(!kol){
        ekle(K, { onem:'Yüksek', kural:'Tanımsız onay türü', kayitlar:[a.kod],
          aciklama:'Onay kaydının türü “' + a.tur + '” — `DB.approvalTypes` içinde böyle bir tür yok. ' +
                   'Onay sonuçlandığında hangi kaydın hangi duruma geçeceği bilinmiyor.',
          oto:false, otoNot:'Otomatik düzeltilemez: onay tipi tanımı eklenmeli.' });
        return;
      }
      if(!var_(kol, a.kayit)) yetim(a.kod, 'approvals', 'kayit', a.kayit, kol);
    });
    /* Serbest hedefli alanlar: herhangi bir koleksiyondaki kayda işaret eder */
    ['activities','logs','reminders'].forEach(function(kol){
      (DB[kol] || []).forEach(function(r){
        [['kayit', r.kayit], ['alici', r.alici]].forEach(function(p){
          if(bos(p[1])) return;
          tarandi++;
          if(!TUM_KOD[p[1]]) yetim(r.kod || (kol + ':' + p[1]), kol, p[0], p[1], 'herhangi bir koleksiyon');
        });
      });
    });
    /* Departman grubu bir koleksiyon değil, `DB.departmentGroups` metin listesi */
    var grup = (DB.departmentGroups || []).reduce(function(m, g){ m[g] = 1; return m; }, {});
    (DB.departments || []).forEach(function(d){
      if(bos(d.ustDepartman)) return;
      tarandi++;
      if(!grup[d.ustDepartman]) yetim(d.kod, 'departments', 'ustDepartman', d.ustDepartman, 'departman grubu');
    });
    K.kapsam = F.num(tarandi) + ' bağ · ' + BAG.length + ' alan haritası';
    return K;
  }

      if(c && !bos(s.musteriAd) && c.unvan !== s.musteriAd) celiski('Orta', ADKOPYA, [s.kod, c.kod],
        'Sözleşmedeki `musteriAd` “' + s.musteriAd + '”, müşteri kartındaki unvan “' + c.unvan + '”.',
